<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷盒社区官方网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #111111;
            line-height: 1.5;
            padding: 2rem 1rem 5rem; /* 底部留出空间给悬浮按钮 */
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid #dddddd;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin: 0;
        }
        #loginBtn {
            padding: 0.4rem 1.2rem;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            color: #333333;
            font-size: 0.9rem;
        }
        #loginBtn:hover {
            background: #f5f5f5;
        }
        /* 登录模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 2rem;
            width: 300px;
            max-width: 90%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .modal h3 {
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #333333;
        }
        .modal input {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 1rem;
            border: 1px solid #cccccc;
            background: #ffffff;
            font-size: 0.9rem;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .modal-actions button {
            padding: 0.4rem 1rem;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            color: #333333;
        }
        .modal-actions button:hover {
            background: #f5f5f5;
        }
        .modal-message {
            font-size: 0.85rem;
            color: #aa0000;
            margin-top: 0.5rem;
        }
        /* 发帖悬浮按钮 */
        .post-float-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: #ffffff;
            border: 1px solid #cccccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            color: #333333;
            z-index: 900;
            transition: background 0.1s;
        }
        .post-float-btn:hover {
            background: #f5f5f5;
        }
        /* 发帖弹窗 (从底部滑出) */
        .post-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 1px solid #cccccc;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1100;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem 1rem 2rem;
        }
        .post-modal.show {
            transform: translateY(0);
        }
        .post-modal .modal-content {
            max-width: 600px;
            margin: 0 auto;
        }
        .post-modal h3 {
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #333333;
        }
        .post-modal input, .post-modal textarea {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #cccccc;
            background: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .post-modal textarea {
            min-height: 150px;
            resize: vertical;
        }
        .post-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }
        .post-modal-actions button {
            padding: 0.6rem 1.5rem;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            color: #333333;
        }
        .post-modal-actions button:hover {
            background: #f5f5f5;
        }
        .post-message {
            margin-bottom: 1rem;
            color: #aa0000;
        }
        /* 全局提示 */
        .global-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333333;
            color: #ffffff;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 1200;
            display: none;
            white-space: nowrap;
        }
        /* 帖子列表 */
        .post-list {
            list-style: none;
            border-top: 1px solid #dddddd;
        }
        .post-item {
            border-bottom: 1px solid #eeeeee;
            padding: 1rem 0.5rem;
            cursor: pointer;
            transition: background 0.1s;
        }
        .post-item:hover {
            background: #f5f5f5;
        }
        .post-item.selected {
            background: #f0f0f0;
            border-left: 3px solid #888888;
            padding-left: calc(0.5rem - 3px);
        }
        .post-title {
            font-weight: 500;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        .post-meta {
            display: flex;
            gap: 1.5rem;
            color: #666666;
            font-size: 0.9rem;
        }
        /* 详情卡片 */
        .detail-card {
            border: 1px solid #dddddd;
            border-top: none;
            background: #fafafa;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.8rem 1.5rem;
            align-items: start;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .detail-label {
            font-weight: 500;
            color: #555555;
            white-space: nowrap;
        }
        .detail-value {
            color: #111111;
            word-break: break-word;
        }
        .detail-value.large-text {
            max-height: 200px;
            overflow-y: auto;
            background: #ffffff;
            padding: 0.5rem;
            border: 1px solid #eeeeee;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .detail-section {
            grid-column: 1 / -1;
            font-weight: 600;
            color: #333333;
            border-bottom: 1px solid #cccccc;
            margin-top: 0.5rem;
            padding-bottom: 0.2rem;
        }
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
            padding: 0.5rem 0;
        }
        .pagination button {
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 0.4rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            color: #333333;
        }
        .pagination button:hover:not(:disabled) {
            background: #f5f5f5;
        }
        .pagination button:disabled {
            color: #aaaaaa;
            border-color: #dddddd;
            cursor: not-allowed;
        }
        .pagination span {
            font-size: 0.95rem;
            color: #555555;
        }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: #666666;
        }
        .error {
            color: #aa0000;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>酷盒社区官方网站</h1>
    <button id="loginBtn">登录</button>
</div>

<!-- 登录模态框 -->
<div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal">
        <h3>登录酷盒社区</h3>
        <input type="text" id="modalLoginName" placeholder="邮箱/用户名">
        <input type="password" id="modalLoginPassword" placeholder="密码">
        <div id="modalMessage" class="modal-message"></div>
        <div class="modal-actions">
            <button id="modalCancel">取消</button>
            <button id="modalSubmit">登录</button>
        </div>
    </div>
</div>

<!-- 发帖悬浮按钮 -->
<div class="post-float-btn" id="postFloatBtn">+</div>

<!-- 发帖弹窗（从底部滑出） -->
<div class="post-modal" id="postModal">
    <div class="modal-content">
        <h3>发布新帖子</h3>
        <div id="postMessage" class="post-message"></div>
        <input type="text" id="postTitle" placeholder="标题">
        <textarea id="postContent" placeholder="内容..."></textarea>
        <div class="post-modal-actions">
            <button id="postCancel">取消</button>
            <button id="postSubmit">发布</button>
        </div>
    </div>
</div>

<!-- 全局提示 -->
<div class="global-toast" id="globalToast">提示</div>

<!-- 帖子列表区 -->
<div id="listContainer">
    <ul class="post-list" id="postList"></ul>
    <div id="listLoading" class="loading" style="display: none;">加载中...</div>
    <div id="listError" class="error" style="display: none;"></div>
    <div id="pagination" class="pagination"></div>
</div>

<script>
    (function() {
        // 接口配置
        const LIST_URL = 'http://159.75.183.170:3000/Posts/PostsList';
        const DETAIL_URL = 'http://159.75.183.170:3000/Posts/PostsInfo';
        const LOGIN_URL = 'http://159.75.183.170:3000/Users/Login';
        const POST_ADD_URL = 'http://159.75.183.170:3000/Posts/PostsAdd';

        // 固定的 localtoken
        const LOCALTOKEN_LIST = '57MJILatB0JMYi2FOtDIJjYF2MhbLbvcUSUbIsL22gdzh1LAiYKLNvp75JcPelNlTQ64uYbeZBSk2/bsRl9oJM1aOH12DKwd3oA1PDl7Nc5cHMZLQfQzSrAv01f8XmeS5Ex5wOoROWOn9l5fBXZPcw==';
        const LOCALTOKEN_DETAIL = '57MJILatB0JMYi2FOtDIJjYF2MhbLbvcUSUbIsL22gdzh1LAiYKLNvp75JcPelNlTQ64uYbeZBSk2/bsRl9oJM1aOH12DKwd3oA1PDl7Nc5cHMZLQfQzSrAv01f8XmeSrD3jWBP9ED3cGhIdtbdH7Q==';
        const LOCALTOKEN_POSTADD = 'TA1DBPQ19f7sT9HWZYPVeCiVsfMqcrfHaQzk2TbN3UgI9h9ZXjlLSm0gIVTK7s/VXgOSjLcRNJf6VZur0hMVUzo+uzE5TvZRCPnTT5gdFWmhedtyWXF3TXrrP6GMUnylIa6O3V+ZojnQj91I/lHqhw==';

        // Authorization 头：未登录时使用默认值，登录后使用返回的 token
        let currentAuthorization = 'app_763_2w7kUKhmn3jHSbrofYMCQjiRMkr12nOQ'; // 默认值

        // 状态
        let currentPage = 1;
        let limit = 10;
        let totalPosts = 0;
        let posts = [];
        let expandedCid = null;
        let expandedElement = null;

        // DOM
        const postListEl = document.getElementById('postList');
        const listLoading = document.getElementById('listLoading');
        const listError = document.getElementById('listError');
        const paginationEl = document.getElementById('pagination');
        const loginBtn = document.getElementById('loginBtn');
        const loginModal = document.getElementById('loginModal');
        const modalLoginName = document.getElementById('modalLoginName');
        const modalLoginPassword = document.getElementById('modalLoginPassword');
        const modalMessage = document.getElementById('modalMessage');
        const modalCancel = document.getElementById('modalCancel');
        const modalSubmit = document.getElementById('modalSubmit');
        // 发帖相关
        const postFloatBtn = document.getElementById('postFloatBtn');
        const postModal = document.getElementById('postModal');
        const postTitle = document.getElementById('postTitle');
        const postContent = document.getElementById('postContent');
        const postMessage = document.getElementById('postMessage');
        const postCancel = document.getElementById('postCancel');
        const postSubmit = document.getElementById('postSubmit');
        const globalToast = document.getElementById('globalToast');

        // 工具函数：日期格式化
        function formatDate(timestamp) {
            if (!timestamp) return '未知';
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(/\//g, '-');
        }

        // 处理内容：第一个insert公开，第二个insert替换为隐藏提示，其余忽略
        function processContent(rawText) {
            if (!rawText) return '';
            try {
                const parsed = JSON.parse(rawText);
                if (Array.isArray(parsed)) {
                    let result = '';
                    parsed.forEach((item, index) => {
                        if (item.insert && typeof item.insert === 'string') {
                            if (index === 0) {
                                result += item.insert;
                            } else if (index === 1) {
                                result += '【该隐藏内容请在APP内查看】';
                            }
                        }
                    });
                    return result;
                }
            } catch (e) {}
            return rawText.replace(/【隐藏内容】/g, '【该隐藏内容请在APP内查看】');
        }

        // 生成详情卡片HTML
        function generateDetailHTML(data) {
            const author = data.authorInfo || {};
            const sections = data.sections || {};
            const images = data.images || [];

            const fields = [
                { label: '帖子ID', value: data.cid ?? '-' },
                { label: '标题', value: data.title || '-' },
                { label: '发布时间', value: formatDate(data.created) },
                { label: '修改时间', value: formatDate(data.modified) },
                { label: '浏览数', value: data.views ?? '-' },
                { label: '点赞数', value: data.likes ?? '-' },
                { label: '评论数', value: data.commentsNum ?? '-' },
                { label: '置顶', value: data.istop === 1 ? '是' : '否' },
                { label: '状态', value: data.status || '-' },
                { label: '类型', value: data.type || '-' },
            ];

            const authorFields = [
                { label: 'UID', value: author.uid ?? '-' },
                { label: '昵称', value: author.screenName || author.name || '-' },
                { label: '简介', value: author.introduce || '-' },
            ];

            const sectionFields = [
                { label: '分区ID', value: sections.sid ?? '-' },
                { label: '分区名称', value: sections.name || '-' },
                { label: '分区类型', value: sections.type || '-' },
            ];

            const imagesHtml = images.length ? `共 ${images.length} 张图片` : '无';
            const content = processContent(data.text || '');

            let html = '<div class="detail-grid">';
            html += '<div class="detail-section">📄 帖子信息</div>';
            fields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });
            html += '<div class="detail-section">👤 发布者</div>';
            authorFields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });
            html += '<div class="detail-section">📂 分区</div>';
            sectionFields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });
            html += `<div class="detail-label">图片：</div><div class="detail-value">${imagesHtml}</div>`;
            html += `<div class="detail-label">内容：</div><div class="detail-value large-text">${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;
            html += '</div>';
            return `<div class="detail-card" data-cid="${data.cid}">${html}</div>`;
        }

        // 移除当前展开的详情
        function removeExpanded() {
            if (expandedElement && expandedElement.parentNode) {
                expandedElement.remove();
                expandedElement = null;
            }
            expandedCid = null;
            document.querySelectorAll('.post-item').forEach(li => li.classList.remove('selected'));
        }

        // 获取并展开详情
        async function expandPost(cid, postItem) {
            if (expandedCid === cid) {
                removeExpanded();
                return;
            }
            removeExpanded();

            try {
                const body = `key=${cid}`;
                const response = await fetch(DETAIL_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_DETAIL,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1 && json.data) {
                    const detailHtml = generateDetailHTML(json.data);
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = detailHtml;
                    const detailElement = tempDiv.firstElementChild;
                    postItem.insertAdjacentElement('afterend', detailElement);
                    expandedElement = detailElement;
                    expandedCid = cid;
                    postItem.classList.add('selected');
                } else {
                    throw new Error(json.msg || '获取详情失败');
                }
            } catch (err) {
                alert(`详情加载失败: ${err.message}`);
            }
        }

        // 获取帖子列表
        async function fetchPosts(page = 1) {
            showLoading(true);
            hideError();
            removeExpanded();

            const searchParams = JSON.stringify({ type: 'post' });
            const body = `page=${page}&limit=${limit}&order=created&searchParams=${encodeURIComponent(searchParams)}`;

            try {
                const response = await fetch(LIST_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_LIST,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1) {
                    posts = json.data || [];
                    totalPosts = json.total || posts.length;
                    renderList(posts);
                    renderPagination(page, totalPosts);
                } else {
                    throw new Error(json.msg || '获取列表失败');
                }
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        // 渲染列表
        function renderList(posts) {
            if (!posts || posts.length === 0) {
                postListEl.innerHTML = '<div class="empty-detail" style="padding: 2rem; border: none;">暂无帖子</div>';
                return;
            }

            let html = '';
            posts.forEach(post => {
                const cid = post.cid;
                const title = post.title || '无标题';
                const author = post.authorInfo?.name || '匿名';
                const created = formatDate(post.created);
                html += `
                    <li class="post-item" data-cid="${cid}">
                        <div class="post-title">${escapeHtml(title)}</div>
                        <div class="post-meta">
                            <span>👤 ${escapeHtml(author)}</span>
                            <span>📅 ${escapeHtml(created)}</span>
                        </div>
                    </li>
                `;
            });
            postListEl.innerHTML = html;

            document.querySelectorAll('.post-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const cid = item.dataset.cid;
                    if (cid) expandPost(cid, item);
                });
            });
        }

        // 分页
        function renderPagination(page, total) {
            const totalPages = Math.ceil(total / limit);
            paginationEl.innerHTML = `
                <button id="prevPage" ${page <= 1 ? 'disabled' : ''}>上一页</button>
                <span>第 ${page} / ${totalPages} 页</span>
                <button id="nextPage" ${page >= totalPages ? 'disabled' : ''}>下一页</button>
            `;

            document.getElementById('prevPage')?.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchPosts(currentPage);
                }
            });

            document.getElementById('nextPage')?.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchPosts(currentPage);
                }
            });
        }

        // 登录功能
        async function login(name, password) {
            modalMessage.textContent = '';
            const body = `name=${encodeURIComponent(name)}&password=${encodeURIComponent(password)}`;

            try {
                const response = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                const responseText = await response.text();
                let json;
                try {
                    json = JSON.parse(responseText);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1 && json.data && json.data.token) {
                    currentAuthorization = json.data.token;
                    modalMessage.textContent = '登录成功！';
                    setTimeout(() => {
                        closeModal();
                        fetchPosts(currentPage);
                    }, 500);
                } else {
                    modalMessage.textContent = json.msg || '登录失败';
                }
            } catch (err) {
                modalMessage.textContent = `错误: ${err.message}`;
            }
        }

        // 发帖功能
        async function addPost(title, content) {
            if (!title.trim() || !content.trim()) {
                postMessage.textContent = '标题和内容不能为空';
                return;
            }

            postMessage.textContent = '';
            // 构建 text 字段为 Delta 格式的 JSON 数组
            const textDelta = JSON.stringify([{ insert: content }]);
            const body = new URLSearchParams();
            body.append('title', title);
            body.append('sections', '13');
            body.append('text', textDelta);
            body.append('token', currentAuthorization);
            body.append('isMd', '0');

            try {
                const response = await fetch(POST_ADD_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_POSTADD,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body.toString()
                });

                const responseText = await response.text();
                let json;
                try {
                    json = JSON.parse(responseText);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1) {
                    showToast('发布成功');
                    closePostModal();
                    fetchPosts(currentPage); // 刷新列表
                } else {
                    postMessage.textContent = `发布失败: ${json.msg || '未知错误'}`;
                }
            } catch (err) {
                postMessage.textContent = `错误: ${err.message}`;
            }
        }

        // 显示全局提示
        function showToast(msg, duration = 2000) {
            globalToast.textContent = msg;
            globalToast.style.display = 'block';
            setTimeout(() => {
                globalToast.style.display = 'none';
            }, duration);
        }

        // 模态框控制
        function openModal() {
            loginModal.style.display = 'flex';
            modalLoginName.value = '';
            modalLoginPassword.value = '';
            modalMessage.textContent = '';
        }
        function closeModal() {
            loginModal.style.display = 'none';
        }

        // 发帖弹窗控制
        function openPostModal() {
            postModal.classList.add('show');
            postTitle.value = '';
            postContent.value = '';
            postMessage.textContent = '';
        }
        function closePostModal() {
            postModal.classList.remove('show');
        }

        // 事件绑定
        loginBtn.addEventListener('click', openModal);
        modalCancel.addEventListener('click', closeModal);
        modalSubmit.addEventListener('click', () => {
            const name = modalLoginName.value.trim();
            const password = modalLoginPassword.value.trim();
            if (!name || !password) {
                modalMessage.textContent = '请输入用户名和密码';
                return;
            }
            login(name, password);
        });
        loginModal.addEventListener('click', (e) => {
            if (e.target === loginModal) closeModal();
        });

        postFloatBtn.addEventListener('click', openPostModal);
        postCancel.addEventListener('click', closePostModal);
        postSubmit.addEventListener('click', () => {
            const title = postTitle.value.trim();
            const content = postContent.value.trim();
            addPost(title, content);
        });
        // 点击背景关闭发帖弹窗？为了简单，不添加背景点击关闭，防止误触

        // 辅助函数
        function showLoading(show) {
            listLoading.style.display = show ? 'block' : 'none';
            if (show) postListEl.innerHTML = '';
        }
        function showError(msg) {
            listError.style.display = 'block';
            listError.textContent = `错误: ${msg}`;
            postListEl.innerHTML = '';
        }
        function hideError() {
            listError.style.display = 'none';
        }
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 初始化
        fetchPosts(currentPage);
    })();
</script>
</body>
</html>
