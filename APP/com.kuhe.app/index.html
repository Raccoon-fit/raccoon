<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>酷盒社区 · 清爽版</title>
    <style>
        /* ===== 全局变量 ===== */
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --success: #16a34a;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.2s ease;
        }

        /* 夜间模式变量 */
        body.night-mode {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-light: #334155;
            --border-medium: #475569;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            padding: 1rem 1rem 6rem;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* 主内容容器 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-light);
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @media (min-width: 640px) {
            .header h1 {
                font-size: 1.8rem;
            }
        }

        /* 账户下拉菜单 */
        .account-dropdown {
            position: relative;
        }
        .account-btn {
            padding: 0.5rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: 40px;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .account-btn:hover {
            background: var(--border-light);
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            min-width: 180px;
            box-shadow: var(--shadow-lg);
            z-index: 10;
            overflow: hidden;
        }
        .dropdown-content button {
            width: 100%;
            padding: 0.75rem 1rem;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: var(--transition);
        }
        .dropdown-content button:hover {
            background: var(--border-light);
        }
        .account-dropdown:hover .dropdown-content {
            display: block;
        }

        /* ===== 模态框通用 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            width: 600px;
            max-width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }
        .modal h3 {
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 0.75rem;
        }

        /* 表单元素 */
        .modal input, .modal textarea, .modal .input-group {
            margin-bottom: 1rem;
        }
        .modal input, .modal textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-medium);
            border-radius: 40px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .modal input:focus, .modal textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .modal .input-group {
            display: flex;
            gap: 0.5rem;
        }
        .modal .input-group input {
            flex: 1;
            margin-bottom: 0;
        }
        .modal .input-group button {
            padding: 0.75rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: 40px;
            cursor: pointer;
            color: var(--text-primary);
            white-space: nowrap;
            transition: var(--transition);
        }
        .modal .input-group button:hover {
            background: var(--border-light);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
        .modal-actions button {
            padding: 0.6rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: 40px;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 500;
            transition: var(--transition);
        }
        .modal-actions button:hover {
            background: var(--border-light);
        }
        .modal-message {
            font-size: 0.85rem;
            color: var(--danger);
            margin-top: 0.5rem;
        }
        .modal-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-light);
        }
        .modal-tab {
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 40px 40px 0 0;
            transition: var(--transition);
        }
        .modal-tab.active {
            border-color: var(--border-medium);
            border-bottom-color: var(--bg-card);
            background: var(--bg-card);
            color: var(--accent);
            margin-bottom: -1px;
        }

        /* 滑块验证 */
        .slide-images {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        .slide-images img {
            max-width: 200px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            background: var(--bg-page);
        }
        .slide-control {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1rem 0;
        }
        .slide-control input[type=range] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: var(--border-medium);
            border-radius: 3px;
        }
        .slide-control input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        /* ===== 优化后的帖子列表 ===== */
        .post-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .post-item {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .post-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }
        .post-item.selected {
            border-left: 4px solid var(--accent);
            background: var(--border-light);
        }
        .post-title {
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .post-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .post-meta span {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
        }

        /* 详情卡片优化 */
        .detail-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin: 1rem 0;
            box-shadow: var(--shadow-md);
            animation: slideDown 0.2s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .detail-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.8rem 1.5rem;
            align-items: start;
            max-height: 500px;
            overflow-y: auto;
        }
        .detail-label {
            font-weight: 600;
            color: var(--text-secondary);
        }
        .detail-value {
            color: var(--text-primary);
            word-break: break-word;
        }
        .detail-value.large-text {
            max-height: 300px;
            overflow-y: auto;
            background: var(--bg-page);
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .detail-section {
            grid-column: 1 / -1;
            font-weight: 600;
            color: var(--accent);
            border-bottom: 1px solid var(--border-light);
            margin-top: 0.5rem;
            padding-bottom: 0.3rem;
        }
        /* 图片预览 */
        .post-image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border-light);
        }
        .post-image-preview:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        /* 大图预览模态框 */
        .image-preview-modal img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }

        /* 分页优化 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }
        .pagination button {
            padding: 0.5rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: 40px;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 500;
            transition: var(--transition);
            min-width: 80px;
        }
        .pagination button:hover:not(:disabled) {
            background: var(--border-light);
            border-color: var(--accent);
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .pagination span {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* ===== 底部浮动按钮 ===== */
        .float-buttons-center {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 900;
        }
        .float-btn {
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
            transition: var(--transition);
        }
        .float-btn:hover {
            transform: scale(1.1);
            background: var(--border-light);
        }

        .search-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
            z-index: 900;
            transition: var(--transition);
        }
        .search-btn:hover {
            transform: scale(1.1);
            background: var(--border-light);
        }

        .right-bottom-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 900;
        }
        .profile-btn, .night-mode-btn {
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
            transition: var(--transition);
            overflow: hidden;
        }
        .profile-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-btn:hover, .night-mode-btn:hover {
            transform: scale(1.1);
            background: var(--border-light);
        }

        /* 发帖弹窗（优化样式） */
        .post-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-card);
            border-top: 1px solid var(--border-medium);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1100;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem 1rem 2rem;
        }
        .post-modal.show {
            transform: translateY(0);
        }
        .post-modal .modal-content {
            max-width: 600px;
            margin: 0 auto;
        }
        .post-modal h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 0.5rem;
        }
        .post-modal input, .post-modal textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            margin-bottom: 1.2rem;
            border: 1px solid var(--border-medium);
            border-radius: 40px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
        }
        .post-modal textarea {
            min-height: 180px;
            resize: vertical;
            border-radius: 24px;
        }
        .post-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        .post-modal-actions button {
            padding: 0.7rem 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: 40px;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 500;
            transition: var(--transition);
        }
        .post-modal-actions button:hover {
            background: var(--border-light);
        }
        .post-message {
            margin-bottom: 1rem;
            color: var(--danger);
            font-size: 0.9rem;
        }

        /* 群组消息列表样式 */
        .chat-message-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .chat-message-item {
            display: flex;
            gap: 0.8rem;
            padding: 0.8rem;
            background: var(--bg-page);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
        }
        .chat-avatar {
            flex-shrink: 0;
        }
        .chat-avatar img {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            object-fit: cover;
        }
        .chat-content {
            flex: 1;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }
        .chat-name {
            font-weight: 600;
            color: var(--text-primary);
        }
        .chat-time {
            color: var(--text-secondary);
        }
        .chat-text {
            color: var(--text-primary);
            word-break: break-word;
        }
        .chat-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: var(--radius-md);
            margin-top: 0.3rem;
            cursor: pointer;
            border: 1px solid var(--border-light);
        }
        .chat-image:hover {
            opacity: 0.9;
        }

        /* 全局提示 */
        .global-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-card);
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 1200;
            display: none;
            box-shadow: var(--shadow-lg);
        }

        /* 下载横幅 */
        .download-banner {
            text-align: center;
            margin: 2rem auto;
        }
        .download-link {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }
        .download-link:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        /* 系统消息列表 */
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-page);
        }
        .message-avatar img {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            object-fit: cover;
        }

        /* 响应式调整 */
        @media (max-width: 640px) {
            body {
                padding: 0.8rem 0.8rem 5rem;
            }
            .post-title {
                font-size: 1.1rem;
            }
            .post-meta {
                gap: 0.8rem;
            }
            .float-btn, .search-btn, .profile-btn, .night-mode-btn {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
            .modal {
                padding: 1.2rem;
            }
            .modal-actions button {
                padding: 0.5rem 1rem;
            }
            .slide-images img {
                max-width: 150px;
            }
            .chat-image {
                max-width: 150px;
            }
        }

        /* 其他 */
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        .error {
            color: var(--danger);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>酷盒社区</h1>
        <div class="account-dropdown">
            <button class="account-btn">账户</button>
            <div class="dropdown-content">
                <button id="loginBtn">登录</button>
                <button id="registerBtn">注册</button>
                <button id="inboxBtn">系统消息</button>
                <button id="sendImageMsgBtn">群组图片消息</button>
                <button id="sendTextMsgBtn">群组文本消息</button>
                <button id="chatMsgListBtn">群组消息记录</button>
            </div>
        </div>
    </div>

    <!-- 登录模态框（含滑块验证） -->
    <div id="loginModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-tabs">
                <div class="modal-tab active" id="loginPasswordTab">密码登录</div>
                <div class="modal-tab" id="loginTokenTab">Token登录</div>
            </div>
            <div id="passwordLoginForm">
                <input type="text" id="modalLoginName" placeholder="邮箱/用户名">
                <input type="password" id="modalLoginPassword" placeholder="密码">
            </div>
            <div id="tokenLoginForm" style="display: none;">
                <input type="text" id="modalToken" placeholder="输入Token">
            </div>
            <div id="slideVerifyArea" style="display: none;">
                <div class="slide-images">
                    <img id="slideOriginal" alt="背景图">
                    <img id="slideJigsaw" alt="缺口图">
                </div>
                <div class="slide-control">
                    <input type="range" id="slideRange" min="0" max="100" value="0">
                    <span class="slide-value" id="slideValue">0%</span>
                </div>
                <div class="modal-actions">
                    <button id="slideCancel">取消</button>
                    <button id="slideConfirm">确认验证</button>
                </div>
                <div id="slideMessage" class="modal-message"></div>
            </div>
            <div id="modalMessage" class="modal-message"></div>
            <div class="modal-actions" id="loginActions">
                <button id="modalCancel">取消</button>
                <button id="modalSubmit">登录</button>
            </div>
        </div>
    </div>

    <!-- 注册模态框 -->
    <div id="registerModal" class="modal-overlay" style="display: none;">
        <div class="modal">

            postListEl.innerHTML = html;
            document.querySelectorAll('.post-item').forEach(it => it.addEventListener('click', e => { const cid = it.dataset.cid; if (cid) expandPost(cid, it); }));
        }

        async function loginWithPassword(name, pwd) {
            modalMessage.textContent = '';
            try {
                const res = await fetch(LOGIN_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `name=${encodeURIComponent(name)}&password=${encodeURIComponent(pwd)}` });
                const txt = await res.text(); let j; try { j = JSON.parse(txt); } catch { throw new Error('非JSON'); }
                if (j.code === 20001) { handleSlideVerification(j.data, { name, pwd }); return; }
                if (res.ok && j.code === 1 && j.data?.token) {
                    currentAuthorization = j.data.token; localStorage.setItem('token', currentAuthorization);
                    modalMessage.textContent = '登录成功！';
                    await fetchAndStoreUserData();
                    setTimeout(() => { closeLoginModal(); searchMode = false; searchKeyword = ''; currentPage = 1; fetchPosts(1); }, 500);
                } else modalMessage.textContent = j.msg || '登录失败';
            } catch (e) { modalMessage.textContent = `错误: ${e.message}`; }
        }

        async function loginWithToken(t) {
            if (!t.trim()) { modalMessage.textContent = '请输入Token'; return; }
            currentAuthorization = t.trim(); localStorage.setItem('token', currentAuthorization);
            try {
                await fetchAndStoreUserData();
                modalMessage.textContent = 'Token登录成功！';
                setTimeout(() => { closeLoginModal(); searchMode = false; searchKeyword = ''; currentPage = 1; fetchPosts(1); }, 500);
            } catch (e) { modalMessage.textContent = `Token无效: ${e.message}`; localStorage.removeItem('token'); currentAuthorization = ''; }
        }

        function handleSlideVerification(data, params) {
            pendingLoginParams = params; slideToken = data.token; slideSecretKey = data.secretKey; slideOriginalBase64 = data.originalImageBase64; slideJigsawBase64 = data.jigsawImageBase64;
            passwordLoginForm.style.display = 'none'; tokenLoginForm.style.display = 'none'; loginActions.style.display = 'none'; modalMessage.style.display = 'none'; slideVerifyArea.style.display = 'block';
            if (slideOriginalBase64) slideOriginal.src = 'data:image/png;base64,' + slideOriginalBase64;
            if (slideJigsawBase64) slideJigsaw.src = 'data:image/png;base64,' + slideJigsawBase64;
            slideRange.value = 0; slideValue.textContent = '0%'; slideMessage.textContent = '';
        }

        function generatePointJson(distance, key) { return btoa(distance + ':' + key); }

        async function confirmSlide() {
            const d = parseInt(slideRange.value); slideMessage.textContent = '验证中...';
            try {
                const pj = generatePointJson(d, slideSecretKey);
                const body = new URLSearchParams(); body.append('name', pendingLoginParams.name); body.append('password', pendingLoginParams.password); body.append('pointJson', pj); body.append('token', slideToken);
                const res = await fetch(LOGIN_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() });
                const txt = await res.text(); let j; try { j = JSON.parse(txt); } catch { throw new Error('非JSON'); }
                if (j.code === 1 && j.data?.token) {
                    currentAuthorization = j.data.token; localStorage.setItem('token', currentAuthorization);
                    await fetchAndStoreUserData(); closeLoginModal(); searchMode = false; searchKeyword = ''; currentPage = 1; fetchPosts(1); showToast('登录成功');
                } else slideMessage.textContent = j.msg || '登录失败';
            } catch (e) { slideMessage.textContent = `验证错误: ${e.message}`; }
        }

        async function fetchAndStoreUserData() {
            if (!currentAuthorization) throw new Error('未登录');
            try {
                const res = await fetch(USER_DATA_URL, { method: 'POST', headers: { 'Authorization': currentAuthorization, 'localtoken': LOCALTOKEN_USERDATA, 'Content-Type': 'application/x-www-form-urlencoded' }, body: '' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const j = await res.json();
                if (j.code === 1 && j.data) {
                    currentUser = { uid: j.data.uid, nickname: j.data.nickname || j.data.name || '未知', avatar: j.data.avatar || '' };
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    if (currentUser.avatar) { profileAvatar.src = currentUser.avatar; profileAvatar.style.display = 'block'; profileBtnText.style.display = 'none'; }
                    else { profileAvatar.style.display = 'none'; profileBtnText.style.display = 'block'; }
                } else throw new Error(j.msg || '获取用户信息失败');
            } catch (e) {
                console.error(e); localStorage.removeItem('token'); localStorage.removeItem('user'); currentAuthorization = ''; currentUser = null;
                profileAvatar.style.display = 'none'; profileBtnText.style.display = 'block'; throw e;
            }
        }

        function restoreFromStorage() {
            const t = localStorage.getItem('token');
            if (t) {
                currentAuthorization = t;
                const u = localStorage.getItem('user');
                if (u) try { currentUser = JSON.parse(u); if (currentUser.avatar) { profileAvatar.src = currentUser.avatar; profileAvatar.style.display = 'block'; profileBtnText.style.display = 'none'; } fetchPosts(1); } catch (e) { fetchAndStoreUserData().then(() => fetchPosts(1)); }
                else fetchAndStoreUserData().then(() => fetchPosts(1));
            } else showToast('请先登录');
        }

        async function sendCode(mail) {
            if (!mail) { registerMessage.textContent = '请输入邮箱'; return false; }
            registerMessage.textContent = '发送中...';
            try {
                const res = await fetch(SEND_CODE_URL, { method: 'POST', headers: { 'localtoken': LOCALTOKEN_SENDCODE, 'Content-Type': 'application/x-www-form-urlencoded' }, body: `mail=${encodeURIComponent(mail)}` });
                const txt = await res.text(); let j; try { j = JSON.parse(txt); } catch { throw new Error('非JSON'); }
                if (res.ok && j.code === 1) { registerMessage.textContent = '验证码发送成功'; return true; } else { registerMessage.textContent = j.msg || '发送失败'; return false; }
            } catch (e) { registerMessage.textContent = `错误: ${e.message}`; return false; }
        }

        async function register(mail, code, pwd) {
            registerMessage.textContent = '';
            const name = mail.split('@')[0]; const body = new URLSearchParams(); body.append('name', name); body.append('code', code); body.append('password', pwd); body.append('mail', mail);
            try {
                const res = await fetch(REGISTER_URL, { method: 'POST', headers: { 'localtoken': LOCALTOKEN_REGISTER, 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() });
                const txt = await res.text(); let j; try { j = JSON.parse(txt); } catch { throw new Error('非JSON'); }
                if (res.ok && j.code === 1) { registerMessage.textContent = '注册成功！'; setTimeout(() => { closeRegisterModal(); showToast('注册成功，请登录'); }, 500); return true; } else { registerMessage.textContent = j.msg || '注册失败'; return false; }
            } catch (e) { registerMessage.textContent = `错误: ${e.message}`; return false; }
        }

        async function addPost(title, content) {
            if (!currentAuthorization) return showToast('请先登录');
            if (!title.trim() || !content.trim()) { postMessage.textContent = '标题和内容不能为空'; return; }
            postMessage.textContent = '';
            const delta = JSON.stringify([{ insert: content }]); const body = new URLSearchParams(); body.append('title', title); body.append('sections', '13'); body.append('text', delta); body.append('token', currentAuthorization); body.append('isMd', '0');
            try {
                const res = await fetch(POST_ADD_URL, { method: 'POST', headers: { 'Authorization': currentAuthorization, 'localtoken': LOCALTOKEN_POSTADD, 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() });
                const txt = await res.text(); let j; try { j = JSON.parse(txt); } catch { throw new Error('非JSON'); }
                if (res.ok && j.code === 1) { showToast('发布成功'); closePostModal(); fetchPosts(currentPage, searchMode ? searchKeyword : ''); } else postMessage.textContent = `发布失败: ${j.msg || '未知错误'}`;
            } catch (e) { postMessage.textContent = `错误: ${e.message}`; }
        }

        async function signIn() {
            if (!currentAuthorization) return showToast('请先登录');
            try {
                const res = await fetch(SIGN_URL, { method: 'POST', headers: { 'Authorization': currentAuthorization, 'localtoken': LOCALTOKEN_SIGN, 'Content-Type': 'application/x-www-form-urlencoded' }, body: '' });
                const txt = await res.text(); let j; try { j = JSON.parse(txt); } catch { throw new Error('非JSON'); }
                if (res.ok && j.code === 1) showToast(j.msg || '签到成功'); else showToast(j.msg || '签到失败');
            } catch (e) { showToast(`错误: ${e.message}`); }
        }

        async function fetchUserDataForProfile() {
            if (!currentAuthorization) { showToast('请先登录'); closeProfileModal(); return; }
            profileContent.innerHTML = '<div style="text-align:center;">加载中...</div>';
            try {
                const res = await fetch(USER_DATA_URL, { method: 'POST', headers: { 'Authorization': currentAuthorization, 'localtoken': LOCALTOKEN_USERDATA, 'Content-Type': 'application/x-www-form-urlencoded' }, body: '' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const j = await res.json();
                if (j.code === 1 && j.data) {
                    const d = j.data, created = formatDate(d.created), permsName = d.perms?.name || '未知', nickname = d.nickname || d.name || '未知', avatar = d.avatar || '';
                    profileContent.innerHTML = `<div style="display:flex; flex-direction:column; gap:0.8rem;"><div style="display:flex; align-items:center; gap:1rem;"><img src="${escapeHtml(avatar)}" class="avatar" style="width:60px;height:60px;border-radius:30px;object-fit:cover;"><span style="font-size:1.2rem;">${escapeHtml(nickname)}</span></div><div><span class="info-label">UID：</span>${d.uid || '-'}</div><div><span class="info-label">经验：</span>${d.experience || 0}</div><div><span class="info-label">粉丝：</span>${d.fanNum || 0}</div><div><span class="info-label">关注：</span>${d.followNum || 0}</div><div><span class="info-label">点赞数：</span>${d.totalLikes || 0}</div><div><span class="info-label">注册时间：</span>${created}</div><div><span class="info-label">连续签到：</span>${d.consSignIn || 0}</div><div><span class="info-label">今日签到：</span>${d.isClock ? '已签' : '未签'}</div><div><span class="info-label">用户组：</span>${permsName}</div></div>`;
                } else throw new Error(j.msg || '获取失败');
            } catch (e) { profileContent.innerHTML = `<div style="color:var(--danger);">错误: ${e.message}</div>`; }
        }

        async function fetchInbox(page = 1) {
            if (!currentAuthorization) { showToast('请先登录'); closeInboxModal(); return; }
            inboxContent.innerHTML = '<div style="text-align:center;">加载中...</div>'; inboxPagination.style.display = 'none';
            try {
                const res = await fetch(INBOX_URL, { method: 'POST', headers: { 'Authorization': currentAuthorization, 'localtoken': LOCALTOKEN_INBOX, 'Content-Type': 'application/x-www-form-urlencoded' }, body: `type=system&page=${page}&limit=${inboxLimit}` });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const j = await res.json();
                if (j.code === 1 && j.data) {
                    inboxMessages = j.data; inboxTotal = j.total || 0;
                    if (!inboxMessages.length) { inboxContent.innerHTML = '<div style="text-align:center;">暂无系统消息</div>'; inboxPagination.style.display = 'none'; return; }
                    let html = '<div class="message-list">';
                    inboxMessages.forEach(m => { const a = m.authorInfo || {}, av = a.avatar || '', nm = a.name || '系统', tm = formatDate(m.created), txt = m.text || ''; html += `<div class="message-item"><div class="message-avatar"><img src="${escapeHtml(av)}" class="avatar" onerror="this.style.display='none';this.parentElement.innerHTML='👤';"></div><div class="message-content"><div class="message-header"><span class="message-name">${escapeHtml(nm)}</span><span class="message-time">${escapeHtml(tm)}</span></div><div class="message-text">${escapeHtml(txt)}</div></div></div>`; });
                    html += '</div>'; inboxContent.innerHTML = html;
                    const tp = Math.ceil(inboxTotal / inboxLimit);
                    inboxPageInfo.textContent = `第 ${page} / ${tp} 页`; inboxPrevPage.disabled = page <= 1; inboxNextPage.disabled = page >= tp; inboxPagination.style.display = 'flex';
                } else throw new Error(j.msg || '获取失败');
            } catch (e) { inboxContent.innerHTML = `<div style="color:var(--danger);">错误: ${e.message}</div>`; }
        }

        // 发送群组图片消息
        async function sendImageMsg() {
            const url = imgUrl.value.trim();
            const msg = imgMsg.value.trim();

            if (!url) {
                sendImageMsgResult.textContent = '图片链接不能为空';
                return;
            }

            sendImageMsgResult.textContent = '发送中...';
            try {
                const body = new URLSearchParams();
                body.append('chatid', GROUP_CHAT_ID);
                body.append('type', '1');
                body.append('url', url);
                body.append('msg', msg);

                const response = await fetch(SEND_MSG_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_SEND_IMAGE,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body.toString()
                });

                const text = await response.text();
                let json;
                try {
                    json = JSON.parse(text);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1) {
                    sendImageMsgResult.textContent = '发送成功！';
                    sendImageMsgResult.style.color = 'var(--success)';
                    setTimeout(() => {
                        closeSendImageMsgModal();
                    }, 1500);
                } else {
                    sendImageMsgResult.textContent = json.msg || '发送失败';
                    sendImageMsgResult.style.color = 'var(--danger)';
                }
            } catch (e) {
                sendImageMsgResult.textContent = `错误: ${e.message}`;
                sendImageMsgResult.style.color = 'var(--danger)';
            }
        }

        // 发送群组文本消息
        async function sendTextMsg() {
            const msg = textMsg.value.trim();

            if (!msg) {
                sendTextMsgResult.textContent = '消息内容不能为空';
                return;
            }

            sendTextMsgResult.textContent = '发送中...';
            try {
                const body = new URLSearchParams();
                body.append('chatid', GROUP_CHAT_ID);
                body.append('touid', GROUP_TO_UID);
                body.append('type', '0');
                body.append('msg', msg);

                const response = await fetch(SEND_MSG_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_SEND_TEXT,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body.toString()
                });

                const text = await response.text();
                let json;
                try {
                    json = JSON.parse(text);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1) {
                    sendTextMsgResult.textContent = '发送成功！';
                    sendTextMsgResult.style.color = 'var(--success)';
                    setTimeout(() => {
                        closeSendTextMsgModal();
                    }, 1500);
                } else {
                    sendTextMsgResult.textContent = json.msg || '发送失败';
                    sendTextMsgResult.style.color = 'var(--danger)';
                }
            } catch (e) {
                sendTextMsgResult.textContent = `错误: ${e.message}`;
                sendTextMsgResult.style.color = 'var(--danger)';
            }
        }

        // 获取群组消息记录（恢复为 application/x-www-form-urlencoded）
        async function fetchChatMsgList() {
            if (!currentAuthorization) {
                showToast('请先登录');
                closeChatMsgListModal();
                return;
            }
            chatMsgListContent.innerHTML = '<div style="text-align:center;">加载中...</div>';
            try {
                const body = `chatid=${GROUP_CHAT_ID}&page=1&limit=200`;
                const response = await fetch(CHAT_MSG_LIST_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_CHAT_LIST,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1 && json.data) {
                    renderChatMsgList(json.data);
                } else {
                    throw new Error(json.msg || '获取消息失败');
                }
            } catch (e) {
                chatMsgListContent.innerHTML = `<div style="color:var(--danger);">错误: ${e.message}</div>`;
            }
        }

        // 渲染群组消息列表
        function renderChatMsgList(messages) {
            if (!messages || messages.length === 0) {
                chatMsgListContent.innerHTML = '<div style="text-align:center;">暂无消息</div>';
                return;
            }

            let html = '';
            messages.forEach(msg => {
                const user = msg.userJson || {};
                const avatar = user.avatar || '';
                const name = user.name || '未知用户';
                const time = formatDate(msg.created);
                const type = msg.type;
                const text = msg.text || '';
                const url = msg.url || '';

                html += '<div class="chat-message-item">';
                html += `<div class="chat-avatar"><img src="${escapeHtml(avatar)}" onerror="this.style.display='none';this.parentElement.innerHTML='👤';"></div>`;
                html += '<div class="chat-content">';
                html += `<div class="chat-header"><span class="chat-name">${escapeHtml(name)}</span><span class="chat-time">${escapeHtml(time)}</span></div>`;
                if (type === 0) {
                    html += `<div class="chat-text">${escapeHtml(text)}</div>`;
                } else if (type === 1) {
                    html += `<div><img src="${escapeHtml(url)}" class="chat-image" onclick="window.open('${escapeHtml(url)}','_blank')"></div>`;
                } else if (type === 2) {
                    html += `<div class="chat-text" style="color:var(--danger);">[系统] ${escapeHtml(text)}</div>`;
                }
                html += '</div></div>';
            });
            chatMsgListContent.innerHTML = html;
        }

        // 模态框控制
        function openLoginModal() {
            loginModal.style.display = 'flex'; modalLoginName.value = ''; modalLoginPassword.value = ''; modalToken.value = ''; modalMessage.textContent = ''; setLoginMode('password');
            slideVerifyArea.style.display = 'none'; passwordLoginForm.style.display = 'block'; tokenLoginForm.style.display = 'none'; loginActions.style.display = 'flex'; modalMessage.style.display = 'block';
        }
        function closeLoginModal() { loginModal.style.display = 'none'; }
        function setLoginMode(m) {
            loginMode = m; if (m === 'password') { loginPasswordTab.classList.add('active'); loginTokenTab.classList.remove('active'); passwordLoginForm.style.display = 'block'; tokenLoginForm.style.display = 'none'; } else { loginPasswordTab.classList.remove('active'); loginTokenTab.classList.add('active'); passwordLoginForm.style.display = 'none'; tokenLoginForm.style.display = 'block'; }
        }
        function openRegisterModal() { registerModal.style.display = 'flex'; regMail.value = ''; regCode.value = ''; regPassword.value = ''; registerMessage.textContent = ''; }
        function closeRegisterModal() { registerModal.style.display = 'none'; }
        function openProfileModal() { profileModal.style.display = 'flex'; fetchUserDataForProfile(); }
        function closeProfileModal() { profileModal.style.display = 'none'; }
        function openPostModal() { postModal.classList.add('show'); postTitle.value = ''; postContent.value = ''; postMessage.textContent = ''; }
        function closePostModal() { postModal.classList.remove('show'); }
        function openSearchModal() { searchModal.style.display = 'flex'; searchKeywordInput.value = searchKeyword; searchMessage.textContent = ''; }
        function closeSearchModal() { searchModal.style.display = 'none'; }
        function openInboxModal() { inboxModal.style.display = 'flex'; inboxPage = 1; fetchInbox(1); }
        function closeInboxModal() { inboxModal.style.display = 'none'; }
        function openSendImageMsgModal() { sendImageMsgModal.style.display = 'flex'; imgUrl.value = ''; imgMsg.value = ''; sendImageMsgResult.textContent = ''; sendImageMsgResult.style.color = 'var(--danger)'; }
        function closeSendImageMsgModal() { sendImageMsgModal.style.display = 'none'; }
        function openSendTextMsgModal() { sendTextMsgModal.style.display = 'flex'; textMsg.value = ''; sendTextMsgResult.textContent = ''; sendTextMsgResult.style.color = 'var(--danger)'; }
        function closeSendTextMsgModal() { sendTextMsgModal.style.display = 'none'; }
        function openChatMsgListModal() { chatMsgListModal.style.display = 'flex'; fetchChatMsgList(); }
        function closeChatMsgListModal() { chatMsgListModal.style.display = 'none'; }

        // 事件绑定
        loginBtn.addEventListener('click', openLoginModal);
        registerBtn.addEventListener('click', openRegisterModal);
        inboxBtn.addEventListener('click', openInboxModal);
        sendImageMsgBtn.addEventListener('click', openSendImageMsgModal);
        sendTextMsgBtn.addEventListener('click', openSendTextMsgModal);
        chatMsgListBtn.addEventListener('click', openChatMsgListModal);
        modalCancel.addEventListener('click', closeLoginModal);
        modalSubmit.addEventListener('click', () => {
            if (loginMode === 'password') { const n = modalLoginName.value.trim(), p = modalLoginPassword.value.trim(); if (!n || !p) { modalMessage.textContent = '请输入用户名和密码'; return; } loginWithPassword(n, p); }
            else { const t = modalToken.value.trim(); loginWithToken(t); }
        });
        loginPasswordTab.addEventListener('click', () => setLoginMode('password'));
        loginTokenTab.addEventListener('click', () => setLoginMode('token'));
        loginModal.addEventListener('click', e => { if (e.target === loginModal) closeLoginModal(); });
        slideCancel.addEventListener('click', () => { slideVerifyArea.style.display = 'none'; passwordLoginForm.style.display = 'block'; tokenLoginForm.style.display = 'none'; loginActions.style.display = 'flex'; modalMessage.style.display = 'block'; setLoginMode(loginMode); });
        slideConfirm.addEventListener('click', confirmSlide);
        slideRange.addEventListener('input', e => { slideValue.textContent = e.target.value + '%'; });
        registerCancel.addEventListener('click', closeRegisterModal);
        sendCodeBtn.addEventListener('click', async () => { const m = regMail.value.trim(); await sendCode(m); });
        registerSubmit.addEventListener('click', async () => { const m = regMail.value.trim(), c = regCode.value.trim(), p = regPassword.value.trim(); if (!m || !c || !p) { registerMessage.textContent = '请填写所有字段'; return; } await register(m, c, p); });
        registerModal.addEventListener('click', e => { if (e.target === registerModal) closeRegisterModal(); });
        postFloatBtn.addEventListener('click', openPostModal);
        postCancel.addEventListener('click', closePostModal);
        postSubmit.addEventListener('click', () => { const t = postTitle.value.trim(), c = postContent.value.trim(); addPost(t, c); });
        signBtn.addEventListener('click', signIn);
        profileBtn.addEventListener('click', openProfileModal);
        profileClose.addEventListener('click', closeProfileModal);
        profileModal.addEventListener('click', e => { if (e.target === profileModal) closeProfileModal(); });
        searchBtn.addEventListener('click', openSearchModal);
        searchCancel.addEventListener('click', closeSearchModal);
        searchSubmit.addEventListener('click', () => { const kw = searchKeywordInput.value.trim(); if (!kw) { searchMessage.textContent = '请输入关键词'; return; } searchMode = true; searchKeyword = kw; currentPage = 1; closeSearchModal(); fetchPosts(1, kw); });
        searchAllBtn.addEventListener('click', () => { searchMode = false; searchKeyword = ''; currentPage = 1; closeSearchModal(); fetchPosts(1); });
        searchModal.addEventListener('click', e => { if (e.target === searchModal) closeSearchModal(); });
        inboxPrevPage.addEventListener('click', () => { if (inboxPage > 1) { inboxPage--; fetchInbox(inboxPage); } });
        inboxNextPage.addEventListener('click', () => { inboxPage++; fetchInbox(inboxPage); });
        inboxClose.addEventListener('click', closeInboxModal);
        inboxModal.addEventListener('click', e => { if (e.target === inboxModal) closeInboxModal(); });
        sendImageMsgCancel.addEventListener('click', closeSendImageMsgModal);
        sendImageMsgSubmit.addEventListener('click', sendImageMsg);
        sendImageMsgModal.addEventListener('click', e => { if (e.target === sendImageMsgModal) closeSendImageMsgModal(); });
        sendTextMsgCancel.addEventListener('click', closeSendTextMsgModal);
        sendTextMsgSubmit.addEventListener('click', sendTextMsg);
        sendTextMsgModal.addEventListener('click', e => { if (e.target === sendTextMsgModal) closeSendTextMsgModal(); });
        chatMsgListClose.addEventListener('click', closeChatMsgListModal);
        chatMsgListModal.addEventListener('click', e => { if (e.target === chatMsgListModal) closeChatMsgListModal(); });

        // 初始化
        restoreFromStorage();
    })();
</script>
</body>
</html>
