<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷盒社区官方网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #111111;
            line-height: 1.5;
            padding: 2rem 1rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            border-bottom: 1px solid #dddddd;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        /* 详情卡片 */
        .detail-card {
            border: 1px solid #dddddd;
            padding: 1.5rem;
            background: #ffffff;
        }
        .detail-field {
            display: flex;
            margin-bottom: 0.8rem;
        }
        .detail-label {
            width: 6rem;
            flex-shrink: 0;
            color: #555555;
        }
        .detail-value {
            flex: 1;
            word-break: break-word;
        }
        .detail-value.large {
            max-height: 400px;        /* 内容区域足够大 */
            overflow-y: auto;
            white-space: pre-wrap;
            background: #fafafa;
            padding: 0.5rem;
            border: 1px solid #eeeeee;
            font-family: inherit;
        }
        .empty-detail {
            color: #888888;
            font-style: italic;
            padding: 2rem 0;
            text-align: center;
            border: 1px dashed #cccccc;
        }
        /* 帖子列表 */
        .post-list {
            list-style: none;
            border-top: 1px solid #dddddd;
        }
        .post-item {
            border-bottom: 1px solid #eeeeee;
            padding: 1rem 0.5rem;
            cursor: pointer;
            transition: background 0.1s;
        }
        .post-item:hover {
            background: #f5f5f5;
        }
        .post-item.selected {
            background: #f0f0f0;
            border-left: 3px solid #888888;
            padding-left: calc(0.5rem - 3px);
        }
        .post-title {
            font-weight: 500;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        .post-meta {
            display: flex;
            gap: 1.5rem;
            color: #666666;
            font-size: 0.9rem;
        }
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
            padding: 0.5rem 0;
        }
        .pagination button {
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 0.4rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            color: #333333;
        }
        .pagination button:hover:not(:disabled) {
            background: #f5f5f5;
        }
        .pagination button:disabled {
            color: #aaaaaa;
            border-color: #dddddd;
            cursor: not-allowed;
        }
        .pagination span {
            font-size: 0.95rem;
            color: #555555;
        }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: #666666;
        }
        .error {
            color: #aa0000;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>酷盒社区官方网站</h1>

    <!-- 详情显示区 -->
    <div id="detailContainer">
        <div class="empty-detail">点击任意帖子查看详情</div>
    </div>

    <!-- 帖子列表区 -->
    <div id="listContainer">
        <ul class="post-list" id="postList"></ul>
        <div id="listLoading" class="loading" style="display: none;">加载中...</div>
        <div id="listError" class="error" style="display: none;"></div>
        <div id="pagination" class="pagination"></div>
    </div>
</div>

<script>
    (function() {
        // 接口配置
        const LIST_URL = 'http://159.75.183.170:3000/Posts/PostsList';
        const DETAIL_URL = 'http://159.75.183.170:3000/Posts/PostsInfo';
        const AUTHORIZATION = 'app_763_2w7kUKhmn3jHSbrofYMCQjiRMkr12nOQ';
        const LOCALTOKEN_LIST = '57MJILatB0JMYi2FOtDIJjYF2MhbLbvcUSUbIsL22gdzh1LAiYKLNvp75JcPelNlTQ64uYbeZBSk2/bsRl9oJM1aOH12DKwd3oA1PDl7Nc5cHMZLQfQzSrAv01f8XmeS5Ex5wOoROWOn9l5fBXZPcw==';
        const LOCALTOKEN_DETAIL = '57MJILatB0JMYi2FOtDIJjYF2MhbLbvcUSUbIsL22gdzh1LAiYKLNvp75JcPelNlTQ64uYbeZBSk2/bsRl9oJM1aOH12DKwd3oA1PDl7Nc5cHMZLQfQzSrAv01f8XmeSrD3jWBP9ED3cGhIdtbdH7Q==';

        // 状态
        let currentPage = 1;
        let limit = 10;
        let totalPosts = 0;
        let posts = [];
        let selectedCid = null;

        // DOM
        const detailContainer = document.getElementById('detailContainer');
        const postListEl = document.getElementById('postList');
        const listLoading = document.getElementById('listLoading');
        const listError = document.getElementById('listError');
        const paginationEl = document.getElementById('pagination');

        // 工具：日期格式化
        function formatDate(timestamp) {
            if (!timestamp) return '未知';
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(/\//g, '-');
        }

        /**
         * 处理帖子内容：
         * - 如果内容是 Delta 数组，则第一个 insert 为公开文本，第二个 insert 替换为隐藏提示，其余忽略
         * - 否则作为普通文本，替换【隐藏内容】标记
         */
        function processContent(rawText) {
            if (!rawText) return '';

            // 尝试解析为 JSON (Delta 格式)
            try {
                const parsed = JSON.parse(rawText);
                if (Array.isArray(parsed)) {
                    let result = '';
                    parsed.forEach((item, index) => {
                        // 只处理包含 insert 字符串的块
                        if (item.insert && typeof item.insert === 'string') {
                            if (index === 0) {
                                // 第一个 insert 作为公开内容
                                result += item.insert;
                            } else if (index === 1) {
                                // 第二个 insert 替换为隐藏提示
                                result += '【该隐藏内容请在APP内查看】';
                            }
                            // 后续 insert 忽略（包括图片等非文本）
                        }
                    });
                    return result;
                }
            } catch (e) {
                // 不是 JSON，原样处理
            }

            // 普通字符串，替换隐藏标记
            return rawText.replace(/【隐藏内容】/g, '【该隐藏内容请在APP内查看】');
        }

        // 获取帖子列表
        async function fetchPosts(page = 1) {
            showLoading(true);
            hideError();

            const searchParams = JSON.stringify({ type: 'post' });
            const body = `page=${page}&limit=${limit}&order=created&searchParams=${encodeURIComponent(searchParams)}`;

            try {
                const response = await fetch(LIST_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': AUTHORIZATION,
                        'localtoken': LOCALTOKEN_LIST,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1) {
                    posts = json.data || [];
                    totalPosts = json.total || posts.length;
                    renderList(posts, page);
                    renderPagination(page, totalPosts);
                } else {
                    throw new Error(json.msg || '获取列表失败');
                }
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        // 获取帖子详情
        async function fetchDetail(cid) {
            if (!cid) return;
            detailContainer.innerHTML = `<div class="empty-detail">加载详情中...</div>`;

            const body = `key=${cid}`;
            try {
                const response = await fetch(DETAIL_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': AUTHORIZATION,
                        'localtoken': LOCALTOKEN_DETAIL,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1 && json.data) {
                    renderDetail(json.data);
                } else {
                    throw new Error(json.msg || '获取详情失败');
                }
            } catch (err) {
                detailContainer.innerHTML = `<div class="error">详情加载失败: ${err.message}</div>`;
            }
        }

        // 渲染详情
        function renderDetail(data) {
            const authorInfo = data.authorInfo || {};
            const nick = authorInfo.screenName || authorInfo.name || '匿名';
            const created = data.created ? formatDate(data.created) : '未知';
            const title = data.title || '无标题';
            const rawContent = data.text || '';
            const processedContent = processContent(rawContent);

            detailContainer.innerHTML = `
                <div class="detail-card">
                    <div class="detail-field">
                        <div class="detail-label">发布者：</div>
                        <div class="detail-value">${escapeHtml(nick)}</div>
                    </div>
                    <div class="detail-field">
                        <div class="detail-label">发布日期：</div>
                        <div class="detail-value">${escapeHtml(created)}</div>
                    </div>
                    <div class="detail-field">
                        <div class="detail-label">帖子标题：</div>
                        <div class="detail-value">${escapeHtml(title)}</div>
                    </div>
                    <div class="detail-field">
                        <div class="detail-label">帖子内容：</div>
                        <div class="detail-value large">${escapeHtml(processedContent).replace(/\n/g, '<br>')}</div>
                    </div>
                </div>
            `;
        }

        // 渲染列表
        function renderList(posts, page) {
            if (!posts || posts.length === 0) {
                postListEl.innerHTML = '<div class="empty-detail" style="padding: 2rem; border: none;">暂无帖子</div>';
                return;
            }

            let html = '';
            posts.forEach(post => {
                const cid = post.cid;
                const title = post.title || '无标题';
                const author = post.authorInfo?.name || '匿名';
                const created = formatDate(post.created);
                const selectedClass = (selectedCid === cid) ? 'selected' : '';
                html += `
                    <li class="post-item ${selectedClass}" data-cid="${cid}">
                        <div class="post-title">${escapeHtml(title)}</div>
                        <div class="post-meta">
                            <span>👤 ${escapeHtml(author)}</span>
                            <span>📅 ${escapeHtml(created)}</span>
                        </div>
                    </li>
                `;
            });
            postListEl.innerHTML = html;

            document.querySelectorAll('.post-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const cid = item.dataset.cid;
                    if (cid) {
                        document.querySelectorAll('.post-item').forEach(li => li.classList.remove('selected'));
                        item.classList.add('selected');
                        selectedCid = cid;
                        fetchDetail(cid);
                    }
                });
            });
        }

        // 分页
        function renderPagination(page, total) {
            const totalPages = Math.ceil(total / limit);
            paginationEl.innerHTML = `
                <button id="prevPage" ${page <= 1 ? 'disabled' : ''}>上一页</button>
                <span>第 ${page} / ${totalPages} 页</span>
                <button id="nextPage" ${page >= totalPages ? 'disabled' : ''}>下一页</button>
            `;

            document.getElementById('prevPage')?.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchPosts(currentPage);
                }
            });

            document.getElementById('nextPage')?.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchPosts(currentPage);
                }
            });
        }

        function showLoading(show) {
            listLoading.style.display = show ? 'block' : 'none';
            if (show) postListEl.innerHTML = '';
        }

        function showError(msg) {
            listError.style.display = 'block';
            listError.textContent = `错误: ${msg}`;
            postListEl.innerHTML = '';
        }

        function hideError() {
            listError.style.display = 'none';
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 初始化
        fetchPosts(currentPage);
    })();
</script>
</body>
</html>
