<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷盒社区 · 帖子浏览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #111111;
            line-height: 1.5;
            padding: 2rem 1rem 6rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid #dddddd;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin: 0;
        }
        .header-right {
            display: flex;
            gap: 0.5rem;
        }
        .header-right button {
            padding: 0.4rem 1.2rem;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            color: #333333;
            font-size: 0.9rem;
        }
        .header-right button:hover {
            background: #f5f5f5;
        }
        /* 模态框通用样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 2rem;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #333333;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 0.5rem;
        }
        .modal .info-item {
            display: flex;
            margin-bottom: 0.8rem;
        }
        .modal .info-label {
            width: 100px;
            flex-shrink: 0;
            color: #555555;
        }
        .modal .info-value {
            flex: 1;
            word-break: break-word;
            color: #111111;
        }
        .modal .avatar {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            object-fit: cover;
            border: 1px solid #dddddd;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }
        .modal-actions button {
            padding: 0.4rem 1.5rem;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            color: #333333;
        }
        .modal-actions button:hover {
            background: #f5f5f5;
        }
        .modal input, .modal .input-group {
            margin-bottom: 1rem;
        }
        .modal .input-group {
            display: flex;
            gap: 0.5rem;
        }
        .modal .input-group input {
            flex: 1;
        }
        .modal input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #cccccc;
            background: #ffffff;
            font-size: 0.9rem;
        }
        .modal .input-group button {
            padding: 0.6rem 1rem;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            white-space: nowrap;
        }
        .modal .input-group button:hover {
            background: #f5f5f5;
        }
        .modal-message {
            font-size: 0.85rem;
            color: #aa0000;
            margin-top: 0.5rem;
        }
        .modal-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #dddddd;
        }
        .modal-tab {
            padding: 0.4rem 1rem;
            cursor: pointer;
            color: #555555;
            border: 1px solid transparent;
            border-bottom: none;
        }
        .modal-tab.active {
            border-color: #cccccc;
            border-bottom-color: #ffffff;
            background: #ffffff;
            color: #111111;
            margin-bottom: -1px;
        }
        /* 底部悬浮按钮组（居中） */
        .float-buttons-center {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 900;
        }
        .float-btn {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: #ffffff;
            border: 1px solid #cccccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: #333333;
            transition: background 0.1s;
        }
        .float-btn:hover {
            background: #f5f5f5;
        }
        .float-btn.sign-btn {
            font-size: 20px;
        }
        /* 右下角个人中心按钮 */
        .profile-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: #ffffff;
            border: 1px solid #cccccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            color: #333333;
            z-index: 900;
            transition: background 0.1s;
        }
        .profile-btn:hover {
            background: #f5f5f5;
        }
        /* 发帖弹窗 */
        .post-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 1px solid #cccccc;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05);

            z-index: 1100;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem 1rem 2rem;
        }
        .post-modal.show {
            transform: translateY(0);
        }
        .post-modal .modal-content {
            max-width: 600px;
            margin: 0 auto;
        }
        .post-modal h3 {
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #333333;
        }
        .post-modal input, .post-modal textarea {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #cccccc;
            background: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .post-modal textarea {
            min-height: 150px;
            resize: vertical;
        }
        .post-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }
        .post-modal-actions button {
            padding: 0.6rem 1.5rem;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            color: #333333;
        }
        .post-modal-actions button:hover {
            background: #f5f5f5;
        }
        .post-message {
            margin-bottom: 1rem;
            color: #aa0000;
        }
        /* 全局提示 */
        .global-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333333;
            color: #ffffff;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 1200;
            display: none;
            white-space: nowrap;
        }
        /* 帖子列表 */
        .post-list {
            list-style: none;
            border-top: 1px solid #dddddd;
        }
        .post-item {
            border-bottom: 1px solid #eeeeee;
            padding: 1rem 0.5rem;
            cursor: pointer;
            transition: background 0.1s;
        }
        .post-item:hover {
            background: #f5f5f5;
        }
        .post-item.selected {
            background: #f0f0f0;
            border-left: 3px solid #888888;
            padding-left: calc(0.5rem - 3px);
        }
        .post-title {
            font-weight: 500;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        .post-meta {
            display: flex;
            gap: 1.5rem;
            color: #666666;
            font-size: 0.9rem;
        }
        /* 详情卡片 */
        .detail-card {
            border: 1px solid #dddddd;
            border-top: none;
            background: #fafafa;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.8rem 1.5rem;
            align-items: start;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .detail-label {
            font-weight: 500;
            color: #555555;
            white-space: nowrap;
        }
        .detail-value {
            color: #111111;
            word-break: break-word;
        }
        .detail-value.large-text {
            max-height: 200px;
            overflow-y: auto;
            background: #ffffff;
            padding: 0.5rem;
            border: 1px solid #eeeeee;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .detail-section {
            grid-column: 1 / -1;
            font-weight: 600;
            color: #333333;
            border-bottom: 1px solid #cccccc;
            margin-top: 0.5rem;
            padding-bottom: 0.2rem;
        }
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
            padding: 0.5rem 0;
        }
        .pagination button {
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 0.4rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            color: #333333;
        }
        .pagination button:hover:not(:disabled) {
            background: #f5f5f5;
        }
        .pagination button:disabled {
            color: #aaaaaa;
            border-color: #dddddd;
            cursor: not-allowed;
        }
        .pagination span {
            font-size: 0.95rem;
            color: #555555;
        }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: #666666;
        }
        .error {
            color: #aa0000;
        }
    </style>
</head>

<!-- 登录模态框 (含密码登录和token登录) -->

            <input type="password" id="modalLoginPassword" placeholder="密码">

        <!-- Token登录表单 -->
        <div id="tokenLoginForm" style="display: none;">
            <input type="text" id="modalToken" placeholder="输入Token">
        </div>
        <div id="modalMessage" class="modal-message"></div>
        <div class="modal-actions">
            <button id="modalCancel">取消</button>
            <button id="modalSubmit">登录</button>
        </div>
    </div>
</div>

<!-- 注册模态框 (无昵称输入，昵称自动使用QQ号) -->
<div id="registerModal" class="modal-overlay" style="display: none;">
    <div class="modal">
        <h3>注册酷盒社区</h3>
        <div class="input-group">
            <input type="email" id="regMail" placeholder="邮箱">
            <button id="sendCodeBtn">获取验证码</button>
        </div>
        <input type="text" id="regCode" placeholder="验证码">
        <input type="password" id="regPassword" placeholder="密码">
        <div id="registerMessage" class="modal-message"></div>
        <div class="modal-actions">
            <button id="registerCancel">取消</button>
            <button id="registerSubmit">注册</button>
        </div>
    </div>
</div>

<!-- 个人中心模态框 -->
<div id="profileModal" class="modal-overlay" style="display: none;">
    <div class="modal">
        <h3>个人中心</h3>
        <div id="profileContent">
            <!-- 动态填充用户信息 -->
            <div style="text-align: center; padding: 1rem;">加载中...</div>
        </div>
        <div class="modal-actions">
            <button id="profileClose">关闭</button>
        </div>
    </div>
</div>

<!-- 底部悬浮按钮组（中央） -->
<div class="float-buttons-center">
    <div class="float-btn sign-btn" id="signBtn" title="签到">🔔</div>
    <div class="float-btn" id="postFloatBtn">+</div>
</div>

<!-- 右下角个人中心按钮 -->
<div class="profile-btn" id="profileBtn" title="个人中心">👤</div>

<!-- 发帖弹窗 -->
<div class="post-modal" id="postModal">
    <div class="modal-content">
        <h3>发布新帖子</h3>
        <div id="postMessage" class="post-message"></div>
        <input type="text" id="postTitle" placeholder="标题">
        <textarea id="postContent" placeholder="内容..."></textarea>
        <div class="post-modal-actions">
            <button id="postCancel">取消</button>
            <button id="postSubmit">发布</button>
        </div>
    </div>
</div>

<!-- 全局提示 -->
<div class="global-toast" id="globalToast">提示</div>

        // 工具函数：日期格式化
        function formatDate(timestamp) {
            if (!timestamp) return '未知';
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(/\//g, '-');
        }

        // 处理内容：第一个insert公开，第二个insert替换为隐藏提示，其余忽略
        function processContent(rawText) {
            if (!rawText) return '';
            try {
                const parsed = JSON.parse(rawText);
                if (Array.isArray(parsed)) {
                    let result = '';
                    parsed.forEach((item, index) => {
                        if (item.insert && typeof item.insert === 'string') {
                            if (index === 0) {
                                result += item.insert;
                            } else if (index === 1) {
                                result += '【该隐藏内容请在APP内查看】';
                            }
                        }
                    });
                    return result;
                }
            } catch (e) {}
            return rawText.replace(/【隐藏内容】/g, '【该隐藏内容请在APP内查看】');
        }

        // 生成详情卡片HTML
        function generateDetailHTML(data) {
            const author = data.authorInfo || {};
            const sections = data.sections || {};
            const images = data.images || [];

            const fields = [
                { label: '帖子ID', value: data.cid ?? '-' },
                { label: '标题', value: data.title || '-' },
                { label: '发布时间', value: formatDate(data.created) },
                { label: '修改时间', value: formatDate(data.modified) },
                { label: '浏览数', value: data.views ?? '-' },
                { label: '点赞数', value: data.likes ?? '-' },
                { label: '评论数', value: data.commentsNum ?? '-' },
                { label: '置顶', value: data.istop === 1 ? '是' : '否' },
                { label: '状态', value: data.status || '-' },
                { label: '类型', value: data.type || '-' },
            ];

            const authorFields = [
                { label: 'UID', value: author.uid ?? '-' },
                { label: '昵称', value: author.screenName || author.name || '-' },
                { label: '简介', value: author.introduce || '-' },
            ];

            const sectionFields = [
                { label: '分区ID', value: sections.sid ?? '-' },
                { label: '分区名称', value: sections.name || '-' },
                { label: '分区类型', value: sections.type || '-' },
            ];

            const imagesHtml = images.length ? `共 ${images.length} 张图片` : '无';
            const content = processContent(data.text || '');

            let html = '<div class="detail-grid">';
            html += '<div class="detail-section">📄 帖子信息</div>';
            fields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });
            html += '<div class="detail-section">👤 发布者</div>';
            authorFields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });
            html += '<div class="detail-section">📂 分区</div>';
            sectionFields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });
            html += `<div class="detail-label">图片：</div><div class="detail-value">${imagesHtml}</div>`;
            html += `<div class="detail-label">内容：</div><div class="detail-value large-text">${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;
            html += '</div>';
            return `<div class="detail-card" data-cid="${data.cid}">${html}</div>`;
        }

        // 移除当前展开的详情
        function removeExpanded() {
            if (expandedElement && expandedElement.parentNode) {
                expandedElement.remove();
                expandedElement = null;
            }
            expandedCid = null;
            document.querySelectorAll('.post-item').forEach(li => li.classList.remove('selected'));
        }

        // 获取并展开详情
        async function expandPost(cid, postItem) {
            if (expandedCid === cid) {
                removeExpanded();
                return;
            }
            removeExpanded();

            try {
                const body = `key=${cid}`;
                const response = await fetch(DETAIL_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_DETAIL,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1 && json.data) {
                    const detailHtml = generateDetailHTML(json.data);
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = detailHtml;
                    const detailElement = tempDiv.firstElementChild;
                    postItem.insertAdjacentElement('afterend', detailElement);
                    expandedElement = detailElement;
                    expandedCid = cid;
                    postItem.classList.add('selected');
                } else {
                    throw new Error(json.msg || '获取详情失败');
                }
            } catch (err) {
                alert(`详情加载失败: ${err.message}`);
            }
        }

        // 获取帖子列表
        async function fetchPosts(page = 1) {
            showLoading(true);
            hideError();
            removeExpanded();

            const searchParams = JSON.stringify({ type: 'post' });
            const body = `page=${page}&limit=${limit}&order=created&searchParams=${encodeURIComponent(searchParams)}`;

            try {
                const response = await fetch(LIST_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_LIST,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1) {
                    posts = json.data || [];
                    totalPosts = json.total || posts.length;
                    renderList(posts);
                    renderPagination(page, totalPosts);
                } else {
                    throw new Error(json.msg || '获取列表失败');
                }
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        // 渲染列表
        function renderList(posts) {
            if (!posts || posts.length === 0) {
                postListEl.innerHTML = '<div class="empty-detail" style="padding: 2rem; border: none;">暂无帖子</div>';
                return;
            }

            let html = '';
            posts.forEach(post => {
                const cid = post.cid;
                const title = post.title || '无标题';
                const author = post.authorInfo?.name || '匿名';
                const created = formatDate(post.created);
                html += `
                    <li class="post-item" data-cid="${cid}">
                        <div class="post-title">${escapeHtml(title)}</div>
                        <div class="post-meta">
                            <span>👤 ${escapeHtml(author)}</span>
                            <span>📅 ${escapeHtml(created)}</span>
                        </div>
                    </li>
                `;
            });
            postListEl.innerHTML = html;

            document.querySelectorAll('.post-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const cid = item.dataset.cid;
                    if (cid) expandPost(cid, item);
                });
            });
        }

        // 分页
        function renderPagination(page, total) {
            const totalPages = Math.ceil(total / limit);
            paginationEl.innerHTML = `
                <button id="prevPage" ${page <= 1 ? 'disabled' : ''}>上一页</button>
                <span>第 ${page} / ${totalPages} 页</span>
                <button id="nextPage" ${page >= totalPages ? 'disabled' : ''}>下一页</button>
            `;

            document.getElementById('prevPage')?.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchPosts(currentPage);
                }
            });

            document.getElementById('nextPage')?.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchPosts(currentPage);
                }
            });
        }

        // 登录功能（密码登录）
        async function loginWithPassword(name, password) {
            modalMessage.textContent = '';
            const body = `name=${encodeURIComponent(name)}&password=${encodeURIComponent(password)}`;

            try {
                const response = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                const responseText = await response.text();
                let json;
                try {
                    json = JSON.parse(responseText);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1 && json.data && json.data.token) {
                    currentAuthorization = json.data.token;
                    modalMessage.textContent = '登录成功！';
                    setTimeout(() => {
                        closeLoginModal();
                        fetchPosts(currentPage);
                    }, 500);
                } else {
                    modalMessage.textContent = json.msg || '登录失败';
                }
            } catch (err) {
                modalMessage.textContent = `错误: ${err.message}`;
            }
        }

        // Token登录
        function loginWithToken(token) {
            if (!token.trim()) {
                modalMessage.textContent = '请输入Token';
                return;
            }
            currentAuthorization = token.trim();
            modalMessage.textContent = 'Token登录成功！';
            setTimeout(() => {
                closeLoginModal();
                fetchPosts(currentPage);
            }, 500);
        }

        // 发送验证码
        async function sendCode(mail) {
            if (!mail) {
                registerMessage.textContent = '请输入邮箱';
                return false;
            }
            registerMessage.textContent = '发送中...';
            const body = `mail=${encodeURIComponent(mail)}`;

            try {
                const response = await fetch(SEND_CODE_URL, {
                    method: 'POST',
                    headers: {
                        'localtoken': LOCALTOKEN_SENDCODE,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                const responseText = await response.text();
                let json;
                try {
                    json = JSON.parse(responseText);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1) {
                    registerMessage.textContent = '验证码发送成功';
                    return true;
                } else {
                    registerMessage.textContent = json.msg || '发送失败';
                    return false;
                }
            } catch (err) {
                registerMessage.textContent = `错误: ${err.message}`;
                return false;
            }
        }

        // 注册
        async function register(mail, code, password) {
            registerMessage.textContent = '';
            // 从邮箱提取QQ号作为昵称
            const name = mail.split('@')[0];
            const body = new URLSearchParams();
            body.append('name', name);
            body.append('code', code);
            body.append('password', password);
            body.append('mail', mail);

            try {
                const response = await fetch(REGISTER_URL, {
                    method: 'POST',
                    headers: {
                        'localtoken': LOCALTOKEN_REGISTER,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body.toString()
                });

                const responseText = await response.text();
                let json;
                try {
                    json = JSON.parse(responseText);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1) {
                    registerMessage.textContent = '注册成功！';
                    setTimeout(() => {
                        closeRegisterModal();
                        showToast('注册成功，请登录');
                    }, 500);
                    return true;
                } else {
                    registerMessage.textContent = json.msg || '注册失败';
                    return false;
                }
            } catch (err) {
                registerMessage.textContent = `错误: ${err.message}`;
                return false;
            }
        }

        // 发帖功能
        async function addPost(title, content) {
            if (!title.trim() || !content.trim()) {
                postMessage.textContent = '标题和内容不能为空';
                return;
            }

            postMessage.textContent = '';
            const textDelta = JSON.stringify([{ insert: content }]);
            const body = new URLSearchParams();
            body.append('title', title);
            body.append('sections', '13');
            body.append('text', textDelta);
            body.append('token', currentAuthorization);
            body.append('isMd', '0');

            try {
                const response = await fetch(POST_ADD_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_POSTADD,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body.toString()
                });

                const responseText = await response.text();
                let json;
                try {
                    json = JSON.parse(responseText);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1) {
                    showToast('发布成功');
                    closePostModal();
                    fetchPosts(currentPage);
                } else {
                    postMessage.textContent = `发布失败: ${json.msg || '未知错误'}`;
                }
            } catch (err) {
                postMessage.textContent = `错误: ${err.message}`;
            }
        }

        // 签到功能
        async function signIn() {
            if (!currentAuthorization) {
                showToast('请先登录');
                return;
            }
            try {
                const response = await fetch(SIGN_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_SIGN,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: '' // 空body
                });

                const responseText = await response.text();
                let json;
                try {
                    json = JSON.parse(responseText);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1) {
                    showToast(json.msg || '签到成功');
                } else {
                    showToast(json.msg || '签到失败');
                }
            } catch (err) {
                showToast(`错误: ${err.message}`);
            }
        }

        // 获取个人中心数据并显示
        async function fetchUserData() {
            if (!currentAuthorization) {
                showToast('请先登录');
                closeProfileModal();
                return;
            }
            profileContent.innerHTML = '<div style="text-align: center; padding: 1rem;">加载中...</div>';
            try {
                const response = await fetch(USER_DATA_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': currentAuthorization,
                        'localtoken': LOCALTOKEN_USERDATA,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: ''
                });

                const responseText = await response.text();
                let json;
                try {
                    json = JSON.parse(responseText);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1 && json.data) {
                    renderUserData(json.data);
                } else {
                    throw new Error(json.msg || '获取用户信息失败');
                }
            } catch (err) {
                profileContent.innerHTML = `<div style="color: #aa0000; padding: 1rem;">错误: ${err.message}</div>`;
            }
        }

        // 渲染个人中心数据
        function renderUserData(data) {
            // 提取需要的字段
            const created = formatDate(data.created);
            const permsName = data.perms?.name || '未知';
            const html = `
                <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                    <div><span class="info-label">UID：</span>${data.uid || '-'}</div>
                    <div><span class="info-label">经验：</span>${data.experience || 0}</div>
                    <div><span class="info-label">粉丝：</span>${data.fanNum || 0}</div>
                    <div><span class="info-label">关注：</span>${data.followNum || 0}</div>
                    <div><span class="info-label">点赞数：</span>${data.totalLikes || 0}</div>
                    <div><span class="info-label">注册时间：</span>${created}</div>
                    <div><span class="info-label">连续签到：</span>${data.consSignIn || 0}</div>
                    <div><span class="info-label">今日签到：</span>${data.isClock ? '已签' : '未签'}</div>
                    <div><span class="info-label">用户组：</span>${permsName}</div>
                </div>
            `;
            profileContent.innerHTML = html;
        }

        // 显示全局提示
        function showToast(msg, duration = 2000) {
            globalToast.textContent = msg;
            globalToast.style.display = 'block';
            setTimeout(() => {
                globalToast.style.display = 'none';
            }, duration);
        }

        // 登录模态框控制
        function openLoginModal() {
            loginModal.style.display = 'flex';
            modalLoginName.value = '';
            modalLoginPassword.value = '';
            modalToken.value = '';
            modalMessage.textContent = '';
            setLoginMode('password');
        }
        function closeLoginModal() {
            loginModal.style.display = 'none';
        }
        function setLoginMode(mode) {
            loginMode = mode;
            if (mode === 'password') {
                loginPasswordTab.classList.add('active');
                loginTokenTab.classList.remove('active');
                passwordLoginForm.style.display = 'block';
                tokenLoginForm.style.display = 'none';
            } else {
                loginPasswordTab.classList.remove('active');
                loginTokenTab.classList.add('active');
                passwordLoginForm.style.display = 'none';
                tokenLoginForm.style.display = 'block';
            }
        }

        // 注册模态框控制
        function openRegisterModal() {
            registerModal.style.display = 'flex';
            regMail.value = '';
            regCode.value = '';
            regPassword.value = '';
            registerMessage.textContent = '';
        }
        function closeRegisterModal() {
            registerModal.style.display = 'none';
        }

        // 个人中心模态框控制
        function openProfileModal() {
            profileModal.style.display = 'flex';
            fetchUserData();
        }
        function closeProfileModal() {
            profileModal.style.display = 'none';
        }

        // 发帖弹窗控制
        function openPostModal() {
            postModal.classList.add('show');
            postTitle.value = '';
            postContent.value = '';
            postMessage.textContent = '';
        }
        function closePostModal() {
            postModal.classList.remove('show');
        }

        // 事件绑定
        loginBtn.addEventListener('click', openLoginModal);
        modalCancel.addEventListener('click', closeLoginModal);
        modalSubmit.addEventListener('click', () => {
            if (loginMode === 'password') {
                const name = modalLoginName.value.trim();
                const password = modalLoginPassword.value.trim();
                if (!name || !password) {
                    modalMessage.textContent = '请输入用户名和密码';
                    return;
                }
                loginWithPassword(name, password);
            } else {
                const token = modalToken.value.trim();
                loginWithToken(token);
            }
        });
        loginPasswordTab.addEventListener('click', () => setLoginMode('password'));
        loginTokenTab.addEventListener('click', () => setLoginMode('token'));
        loginModal.addEventListener('click', (e) => {
            if (e.target === loginModal) closeLoginModal();
        });

        registerBtn.addEventListener('click', openRegisterModal);
        registerCancel.addEventListener('click', closeRegisterModal);
        sendCodeBtn.addEventListener('click', async () => {
            const mail = regMail.value.trim();
            await sendCode(mail);
        });
        registerSubmit.addEventListener('click', async () => {
            const mail = regMail.value.trim();
            const code = regCode.value.trim();
            const password = regPassword.value.trim();
            if (!mail || !code || !password) {
                registerMessage.textContent = '请填写所有字段';
                return;
            }
            await register(mail, code, password);
        });
        registerModal.addEventListener('click', (e) => {
            if (e.target === registerModal) closeRegisterModal();
        });

        postFloatBtn.addEventListener('click', openPostModal);
        postCancel.addEventListener('click', closePostModal);
        postSubmit.addEventListener('click', () => {
            const title = postTitle.value.trim();
            const content = postContent.value.trim();
            addPost(title, content);
        });

        signBtn.addEventListener('click', signIn);

        profileBtn.addEventListener('click', openProfileModal);
        profileClose.addEventListener('click', closeProfileModal);
        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) closeProfileModal();
        });

        // 辅助函数
        function showLoading(show) {
            listLoading.style.display = show ? 'block' : 'none';
            if (show) postListEl.innerHTML = '';
        }
        function showError(msg) {
            listError.style.display = 'block';
            listError.textContent = `错误: ${msg}`;
            postListEl.innerHTML = '';
        }
        function hideError() {
            listError.style.display = 'none';
        }
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 初始化
        fetchPosts(currentPage);
    })();
</script>
</body>
</html>
