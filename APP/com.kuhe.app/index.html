<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷盒社区官方网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #111111;
            line-height: 1.5;
            padding: 2rem 1rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            border-bottom: 1px solid #dddddd;
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }
        /* 帖子列表 */
        .post-list {
            list-style: none;
            border-top: 1px solid #dddddd;
        }
        .post-item {
            border-bottom: 1px solid #eeeeee;
            padding: 1rem 0.5rem;
            cursor: pointer;
            transition: background 0.1s;
        }
        .post-item:hover {
            background: #f5f5f5;
        }
        .post-item.selected {
            background: #f0f0f0;
            border-left: 3px solid #888888;
            padding-left: calc(0.5rem - 3px);
        }
        .post-title {
            font-weight: 500;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        .post-meta {
            display: flex;
            gap: 1.5rem;
            color: #666666;
            font-size: 0.9rem;
        }
        /* 详情卡片 - 插入在帖子项下方 */
        .detail-card {
            border: 1px solid #dddddd;
            border-top: none;
            background: #fafafa;
            padding: 1.5rem;
            margin-bottom: 1rem; /* 与下一个帖子保持间距 */
        }
        .detail-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.8rem 1.5rem;
            align-items: start;
            max-height: 500px;        /* 限制高度，可滚动 */
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .detail-label {
            font-weight: 500;
            color: #555555;
            white-space: nowrap;
        }
        .detail-value {
            color: #111111;
            word-break: break-word;
        }
        .detail-value.large-text {
            max-height: 200px;
            overflow-y: auto;
            background: #ffffff;
            padding: 0.5rem;
            border: 1px solid #eeeeee;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .detail-section {
            grid-column: 1 / -1;
            font-weight: 600;
            color: #333333;
            border-bottom: 1px solid #cccccc;
            margin-top: 0.5rem;
            padding-bottom: 0.2rem;
        }
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
            padding: 0.5rem 0;
        }
        .pagination button {
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 0.4rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            color: #333333;
        }
        .pagination button:hover:not(:disabled) {
            background: #f5f5f5;
        }
        .pagination button:disabled {
            color: #aaaaaa;
            border-color: #dddddd;
            cursor: not-allowed;
        }
        .pagination span {
            font-size: 0.95rem;
            color: #555555;
        }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: #666666;
        }
        .error {
            color: #aa0000;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>酷盒社区官方网站</h1>

    <!-- 帖子列表区 -->
    <div id="listContainer">
        <ul class="post-list" id="postList"></ul>
        <div id="listLoading" class="loading" style="display: none;">加载中...</div>
        <div id="listError" class="error" style="display: none;"></div>
        <div id="pagination" class="pagination"></div>
    </div>
</div>

<script>
    (function() {
        // 接口配置
        const LIST_URL = 'http://159.75.183.170:3000/Posts/PostsList';
        const DETAIL_URL = 'http://159.75.183.170:3000/Posts/PostsInfo';
        const AUTHORIZATION = 'app_763_2w7kUKhmn3jHSbrofYMCQjiRMkr12nOQ';
        const LOCALTOKEN_LIST = '57MJILatB0JMYi2FOtDIJjYF2MhbLbvcUSUbIsL22gdzh1LAiYKLNvp75JcPelNlTQ64uYbeZBSk2/bsRl9oJM1aOH12DKwd3oA1PDl7Nc5cHMZLQfQzSrAv01f8XmeS5Ex5wOoROWOn9l5fBXZPcw==';
        const LOCALTOKEN_DETAIL = '57MJILatB0JMYi2FOtDIJjYF2MhbLbvcUSUbIsL22gdzh1LAiYKLNvp75JcPelNlTQ64uYbeZBSk2/bsRl9oJM1aOH12DKwd3oA1PDl7Nc5cHMZLQfQzSrAv01f8XmeSrD3jWBP9ED3cGhIdtbdH7Q==';

        // 状态
        let currentPage = 1;
        let limit = 10;
        let totalPosts = 0;
        let posts = [];
        let expandedCid = null;          // 当前展开的帖子ID
        let expandedElement = null;       // 当前展开的详情DOM元素

        // DOM
        const postListEl = document.getElementById('postList');
        const listLoading = document.getElementById('listLoading');
        const listError = document.getElementById('listError');
        const paginationEl = document.getElementById('pagination');

        // 工具函数：日期格式化
        function formatDate(timestamp) {
            if (!timestamp) return '未知';
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(/\//g, '-');
        }

        // 处理内容：第一个insert公开，第二个insert替换为隐藏提示，其余忽略（针对Delta数组）
        function processContent(rawText) {
            if (!rawText) return '';
            try {
                const parsed = JSON.parse(rawText);
                if (Array.isArray(parsed)) {
                    let result = '';
                    parsed.forEach((item, index) => {
                        if (item.insert && typeof item.insert === 'string') {
                            if (index === 0) {
                                result += item.insert;
                            } else if (index === 1) {
                                result += '【该隐藏内容请在APP内查看】';
                            }
                            // 后续忽略
                        }
                    });
                    return result;
                }
            } catch (e) {
                // 不是JSON，普通字符串
            }
            return rawText.replace(/【隐藏内容】/g, '【该隐藏内容请在APP内查看】');
        }

        // 生成详情卡片HTML（包含所有可用字段）
        function generateDetailHTML(data) {
            const author = data.authorInfo || {};
            const sections = data.sections || {};

            // 基础字段
            const fields = [
                { label: '响应码', value: data.code ?? '-' },
                { label: '帖子ID', value: data.cid ?? '-' },
                { label: '标题', value: data.title || '-' },
                { label: '发布时间', value: formatDate(data.created) },
                { label: '修改时间', value: formatDate(data.modified) },
                { label: '浏览数', value: data.views ?? '-' },
                { label: '点赞数', value: data.likes ?? '-' },
                { label: '评论数', value: data.commentsNum ?? '-' },
                { label: '是否置顶', value: data.istop === 1 ? '是' : '否' },
                { label: '状态', value: data.status || '-' },
                { label: '类型', value: data.type || '-' },
            ];

            // 发布者信息
            const authorFields = [
                { label: 'UID', value: author.uid ?? '-' },
                { label: '昵称', value: author.screenName || author.name || '-' },
                { label: '邮箱', value: author.mail || '-' },
                { label: 'VIP到期', value: author.vip ? formatDate(author.vip) : '无' },
                { label: '注册时间', value: author.created ? formatDate(author.created) : '-' },
                { label: '最后登录', value: author.logged ? formatDate(author.logged) : '-' },
                { label: '简介', value: author.introduce || '-' },
                { label: '头像', value: author.avatar || '-' },
                { label: '经验值', value: author.experience ?? '-' },
                { label: '性别', value: author.gender === 1 ? '男' : (author.gender === 2 ? '女' : '未知') },
                { label: '是否VIP', value: author.isvip === 1 ? '是' : '否' },
            ];

            // 分区信息
            const sectionFields = [
                { label: '分区ID', value: sections.sid ?? '-' },
                { label: '分区名称', value: sections.name || '-' },
                { label: '分区类型', value: sections.type || '-' },
                { label: '图标', value: sections.imgurl || '-' },
                { label: '背景图', value: sections.bGurl || '-' },
            ];

            // 图片列表
            const images = data.images || [];
            const imagesHtml = images.length ? images.map(url => `<div>${escapeHtml(url)}</div>`).join('') : '无';

            // 帖子内容（经过处理）
            const content = processContent(data.text || '');

            // 构建HTML
            let html = '<div class="detail-grid">';

            // 基础字段
            html += '<div class="detail-section">📄 帖子信息</div>';
            fields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });

            // 发布者信息
            html += '<div class="detail-section">👤 发布者信息</div>';
            authorFields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });

            // 分区信息
            html += '<div class="detail-section">📂 分区信息</div>';
            sectionFields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });

            // 图片
            html += `<div class="detail-label">图片列表：</div><div class="detail-value">${imagesHtml}</div>`;

            // 帖子内容（大框）
            html += `<div class="detail-label">帖子内容：</div><div class="detail-value large-text">${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;

            html += '</div>'; // 关闭detail-grid
            return `<div class="detail-card" data-cid="${data.cid}">${html}</div>`;
        }

        // 移除当前展开的详情
        function removeExpanded() {
            if (expandedElement && expandedElement.parentNode) {
                expandedElement.remove();
                expandedElement = null;
            }
            expandedCid = null;
            // 移除所有帖子项的高亮
            document.querySelectorAll('.post-item').forEach(li => li.classList.remove('selected'));
        }

        // 获取并插入详情
        async function expandPost(cid, postItem) {
            // 如果已经展开同一个，则收起
            if (expandedCid === cid) {
                removeExpanded();
                return;
            }

            // 移除之前的展开
            removeExpanded();

            // 显示加载占位（可选，此处直接调用接口）
            try {
                const body = `key=${cid}`;
                const response = await fetch(DETAIL_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': AUTHORIZATION,
                        'localtoken': LOCALTOKEN_DETAIL,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1 && json.data) {
                    // 生成详情卡片
                    const detailHtml = generateDetailHTML(json.data);
                    // 创建临时容器
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = detailHtml;
                    const detailElement = tempDiv.firstElementChild;

                    // 在postItem后面插入
                    postItem.insertAdjacentElement('afterend', detailElement);
                    expandedElement = detailElement;
                    expandedCid = cid;

                    // 高亮当前帖子项
                    postItem.classList.add('selected');
                } else {
                    throw new Error(json.msg || '获取详情失败');
                }
            } catch (err) {
                alert(`详情加载失败: ${err.message}`);
            }
        }

        // 获取帖子列表
        async function fetchPosts(page = 1) {
            showLoading(true);
            hideError();
            removeExpanded(); // 切换页码时收起所有详情

            const searchParams = JSON.stringify({ type: 'post' });
            const body = `page=${page}&limit=${limit}&order=created&searchParams=${encodeURIComponent(searchParams)}`;

            try {
                const response = await fetch(LIST_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': AUTHORIZATION,
                        'localtoken': LOCALTOKEN_LIST,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1) {
                    posts = json.data || [];
                    totalPosts = json.total || posts.length;
                    renderList(posts);
                    renderPagination(page, totalPosts);
                } else {
                    throw new Error(json.msg || '获取列表失败');
                }
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        // 渲染列表
        function renderList(posts) {
            if (!posts || posts.length === 0) {
                postListEl.innerHTML = '<div class="empty-detail" style="padding: 2rem; border: none;">暂无帖子</div>';
                return;
            }

            let html = '';
            posts.forEach(post => {
                const cid = post.cid;
                const title = post.title || '无标题';
                const author = post.authorInfo?.name || '匿名';
                const created = formatDate(post.created);
                // 注意：这里不加selected类，因为高亮由expandPost管理
                html += `
                    <li class="post-item" data-cid="${cid}">
                        <div class="post-title">${escapeHtml(title)}</div>
                        <div class="post-meta">
                            <span>👤 ${escapeHtml(author)}</span>
                            <span>📅 ${escapeHtml(created)}</span>
                        </div>
                    </li>
                `;
            });
            postListEl.innerHTML = html;

            // 绑定点击事件
            document.querySelectorAll('.post-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const cid = item.dataset.cid;
                    if (cid) {
                        expandPost(cid, item);
                    }
                });
            });
        }

        // 分页
        function renderPagination(page, total) {
            const totalPages = Math.ceil(total / limit);
            paginationEl.innerHTML = `
                <button id="prevPage" ${page <= 1 ? 'disabled' : ''}>上一页</button>
                <span>第 ${page} / ${totalPages} 页</span>
                <button id="nextPage" ${page >= totalPages ? 'disabled' : ''}>下一页</button>
            `;

            document.getElementById('prevPage')?.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchPosts(currentPage);
                }
            });

            document.getElementById('nextPage')?.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchPosts(currentPage);
                }
            });
        }

        function showLoading(show) {
            listLoading.style.display = show ? 'block' : 'none';
            if (show) postListEl.innerHTML = '';
        }

        function showError(msg) {
            listError.style.display = 'block';
            listError.textContent = `错误: ${msg}`;
            postListEl.innerHTML = '';
        }

        function hideError() {
            listError.style.display = 'none';
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 初始化
        fetchPosts(currentPage);
    })();
</script>
</body>
</html>
