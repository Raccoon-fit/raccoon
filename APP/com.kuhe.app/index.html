<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷盒社区官方网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #111111;
            line-height: 1.5;
            padding: 2rem 1rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid #dddddd;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin: 0;
        }
        .login-area {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }
        .login-area input {
            padding: 0.4rem 0.8rem;
            border: 1px solid #cccccc;
            background: #ffffff;
            font-size: 0.9rem;
            width: 140px;
        }
        .login-area button {
            padding: 0.4rem 1rem;
            background: #ffffff;
            border: 1px solid #cccccc;
            cursor: pointer;
            color: #333333;
        }
        .login-area button:hover {
            background: #f5f5f5;
        }
        .login-message {
            font-size: 0.85rem;
            color: #666666;
            max-width: 200px;
            word-break: break-word;
        }
        /* 帖子列表 */
        .post-list {
            list-style: none;
            border-top: 1px solid #dddddd;
        }
        .post-item {
            border-bottom: 1px solid #eeeeee;
            padding: 1rem 0.5rem;
            cursor: pointer;
            transition: background 0.1s;
        }
        .post-item:hover {
            background: #f5f5f5;
        }
        .post-item.selected {
            background: #f0f0f0;
            border-left: 3px solid #888888;
            padding-left: calc(0.5rem - 3px);
        }
        .post-title {
            font-weight: 500;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }
        .post-meta {
            display: flex;
            gap: 1.5rem;
            color: #666666;
            font-size: 0.9rem;
        }
        /* 详情卡片 */
        .detail-card {
            border: 1px solid #dddddd;
            border-top: none;
            background: #fafafa;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.8rem 1.5rem;
            align-items: start;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .detail-label {
            font-weight: 500;
            color: #555555;
            white-space: nowrap;
        }
        .detail-value {
            color: #111111;
            word-break: break-word;
        }
        .detail-value.large-text {
            max-height: 200px;
            overflow-y: auto;
            background: #ffffff;
            padding: 0.5rem;
            border: 1px solid #eeeeee;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .detail-section {
            grid-column: 1 / -1;
            font-weight: 600;
            color: #333333;
            border-bottom: 1px solid #cccccc;
            margin-top: 0.5rem;
            padding-bottom: 0.2rem;
        }
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
            padding: 0.5rem 0;
        }
        .pagination button {
            background: #ffffff;
            border: 1px solid #cccccc;
            padding: 0.4rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            color: #333333;
        }
        .pagination button:hover:not(:disabled) {
            background: #f5f5f5;
        }
        .pagination button:disabled {
            color: #aaaaaa;
            border-color: #dddddd;
            cursor: not-allowed;
        }
        .pagination span {
            font-size: 0.95rem;
            color: #555555;
        }
        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: #666666;
        }
        .error {
            color: #aa0000;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>📋 酷盒社区 · 帖子浏览</h1>
    <div class="login-area">
        <input type="text" id="loginName" placeholder="邮箱/用户名" value="2051775505@qq.com">
        <input type="password" id="loginPassword" placeholder="密码" value="ABC123456CBA">
        <button id="loginBtn">登录</button>
        <span id="loginMessage" class="login-message"></span>
    </div>
</div>

<!-- 帖子列表区 -->
<div id="listContainer">
    <ul class="post-list" id="postList"></ul>
    <div id="listLoading" class="loading" style="display: none;">加载中...</div>
    <div id="listError" class="error" style="display: none;"></div>
    <div id="pagination" class="pagination"></div>
</div>

<script>
    (function() {
        // 接口配置
        const LIST_URL = 'http://159.75.183.170:3000/Posts/PostsList';
        const DETAIL_URL = 'http://159.75.183.170:3000/Posts/PostsInfo';
        const LOGIN_URL = 'http://159.75.183.170:3000/Users/Login';
        const AUTHORIZATION = 'app_763_2w7kUKhmn3jHSbrofYMCQjiRMkr12nOQ'; // 固定应用令牌

        // 备用的 localtoken（未登录时使用）
        const FALLBACK_LOCALTOKEN_LIST = '57MJILatB0JMYi2FOtDIJjYF2MhbLbvcUSUbIsL22gdzh1LAiYKLNvp75JcPelNlTQ64uYbeZBSk2/bsRl9oJM1aOH12DKwd3oA1PDl7Nc5cHMZLQfQzSrAv01f8XmeS5Ex5wOoROWOn9l5fBXZPcw==';
        const FALLBACK_LOCALTOKEN_DETAIL = '57MJILatB0JMYi2FOtDIJjYF2MhbLbvcUSUbIsL22gdzh1LAiYKLNvp75JcPelNlTQ64uYbeZBSk2/bsRl9oJM1aOH12DKwd3oA1PDl7Nc5cHMZLQfQzSrAv01f8XmeSrD3jWBP9ED3cGhIdtbdH7Q==';

        // 状态
        let currentPage = 1;
        let limit = 10;
        let totalPosts = 0;
        let posts = [];
        let expandedCid = null;
        let expandedElement = null;
        let userToken = ''; // 登录后保存的 token，将作为 localtoken 使用

        // DOM
        const postListEl = document.getElementById('postList');
        const listLoading = document.getElementById('listLoading');
        const listError = document.getElementById('listError');
        const paginationEl = document.getElementById('pagination');
        const loginName = document.getElementById('loginName');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginMessage = document.getElementById('loginMessage');

        // 工具函数：日期格式化
        function formatDate(timestamp) {
            if (!timestamp) return '未知';
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(/\//g, '-');
        }

        // 处理内容：第一个insert公开，第二个insert替换为隐藏提示，其余忽略
        function processContent(rawText) {
            if (!rawText) return '';
            try {
                const parsed = JSON.parse(rawText);
                if (Array.isArray(parsed)) {
                    let result = '';
                    parsed.forEach((item, index) => {
                        if (item.insert && typeof item.insert === 'string') {
                            if (index === 0) {
                                result += item.insert;
                            } else if (index === 1) {
                                result += '【该隐藏内容请在APP内查看】';
                            }
                        }
                    });
                    return result;
                }
            } catch (e) {}
            return rawText.replace(/【隐藏内容】/g, '【该隐藏内容请在APP内查看】');
        }

        // 生成详情卡片HTML（只显示非敏感字段）
        function generateDetailHTML(data) {
            const author = data.authorInfo || {};
            const sections = data.sections || {};
            const images = data.images || [];

            // 基础字段（公开）
            const fields = [
                { label: '帖子ID', value: data.cid ?? '-' },
                { label: '标题', value: data.title || '-' },
                { label: '发布时间', value: formatDate(data.created) },
                { label: '修改时间', value: formatDate(data.modified) },
                { label: '浏览数', value: data.views ?? '-' },
                { label: '点赞数', value: data.likes ?? '-' },
                { label: '评论数', value: data.commentsNum ?? '-' },
                { label: '置顶', value: data.istop === 1 ? '是' : '否' },
                { label: '状态', value: data.status || '-' },
                { label: '类型', value: data.type || '-' },
            ];

            // 发布者信息（公开部分）
            const authorFields = [
                { label: 'UID', value: author.uid ?? '-' },
                { label: '昵称', value: author.screenName || author.name || '-' },
                { label: '简介', value: author.introduce || '-' },
                // 隐藏邮箱、VIP、经验、性别、登录时间等敏感字段
            ];

            // 分区信息（公开部分）
            const sectionFields = [
                { label: '分区ID', value: sections.sid ?? '-' },
                { label: '分区名称', value: sections.name || '-' },
                { label: '分区类型', value: sections.type || '-' },
            ];

            // 图片列表简化为数量
            const imagesHtml = images.length ? `共 ${images.length} 张图片` : '无';

            // 帖子内容
            const content = processContent(data.text || '');

            // 构建HTML
            let html = '<div class="detail-grid">';

            // 基础字段
            html += '<div class="detail-section">📄 帖子信息</div>';
            fields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });

            // 发布者信息
            html += '<div class="detail-section">👤 发布者</div>';
            authorFields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });

            // 分区信息
            html += '<div class="detail-section">📂 分区</div>';
            sectionFields.forEach(f => {
                html += `<div class="detail-label">${f.label}：</div><div class="detail-value">${escapeHtml(String(f.value))}</div>`;
            });

            // 图片
            html += `<div class="detail-label">图片：</div><div class="detail-value">${imagesHtml}</div>`;

            // 帖子内容（大框）
            html += `<div class="detail-label">内容：</div><div class="detail-value large-text">${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;

            html += '</div>';
            return `<div class="detail-card" data-cid="${data.cid}">${html}</div>`;
        }

        // 移除当前展开的详情
        function removeExpanded() {
            if (expandedElement && expandedElement.parentNode) {
                expandedElement.remove();
                expandedElement = null;
            }
            expandedCid = null;
            document.querySelectorAll('.post-item').forEach(li => li.classList.remove('selected'));
        }

        // 获取并展开详情
        async function expandPost(cid, postItem) {
            if (expandedCid === cid) {
                removeExpanded();
                return;
            }
            removeExpanded();

            // 确定使用的 localtoken
            const localToken = userToken || FALLBACK_LOCALTOKEN_DETAIL;

            try {
                const body = `key=${cid}`;
                const response = await fetch(DETAIL_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': AUTHORIZATION,
                        'localtoken': localToken,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1 && json.data) {
                    const detailHtml = generateDetailHTML(json.data);
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = detailHtml;
                    const detailElement = tempDiv.firstElementChild;

                    postItem.insertAdjacentElement('afterend', detailElement);
                    expandedElement = detailElement;
                    expandedCid = cid;
                    postItem.classList.add('selected');
                } else {
                    throw new Error(json.msg || '获取详情失败');
                }
            } catch (err) {
                alert(`详情加载失败: ${err.message}`);
            }
        }

        // 获取帖子列表
        async function fetchPosts(page = 1) {
            showLoading(true);
            hideError();
            removeExpanded();

            const searchParams = JSON.stringify({ type: 'post' });
            const body = `page=${page}&limit=${limit}&order=created&searchParams=${encodeURIComponent(searchParams)}`;

            // 确定使用的 localtoken
            const localToken = userToken || FALLBACK_LOCALTOKEN_LIST;

            try {
                const response = await fetch(LIST_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': AUTHORIZATION,
                        'localtoken': localToken,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();
                if (json.code === 1) {
                    posts = json.data || [];
                    totalPosts = json.total || posts.length;
                    renderList(posts);
                    renderPagination(page, totalPosts);
                } else {
                    throw new Error(json.msg || '获取列表失败');
                }
            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        // 渲染列表
        function renderList(posts) {
            if (!posts || posts.length === 0) {
                postListEl.innerHTML = '<div class="empty-detail" style="padding: 2rem; border: none;">暂无帖子</div>';
                return;
            }

            let html = '';
            posts.forEach(post => {
                const cid = post.cid;
                const title = post.title || '无标题';
                const author = post.authorInfo?.name || '匿名';
                const created = formatDate(post.created);
                html += `
                    <li class="post-item" data-cid="${cid}">
                        <div class="post-title">${escapeHtml(title)}</div>
                        <div class="post-meta">
                            <span>👤 ${escapeHtml(author)}</span>
                            <span>📅 ${escapeHtml(created)}</span>
                        </div>
                    </li>
                `;
            });
            postListEl.innerHTML = html;

            document.querySelectorAll('.post-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const cid = item.dataset.cid;
                    if (cid) expandPost(cid, item);
                });
            });
        }

        // 分页
        function renderPagination(page, total) {
            const totalPages = Math.ceil(total / limit);
            paginationEl.innerHTML = `
                <button id="prevPage" ${page <= 1 ? 'disabled' : ''}>上一页</button>
                <span>第 ${page} / ${totalPages} 页</span>
                <button id="nextPage" ${page >= totalPages ? 'disabled' : ''}>下一页</button>
            `;

            document.getElementById('prevPage')?.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchPosts(currentPage);
                }
            });

            document.getElementById('nextPage')?.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchPosts(currentPage);
                }
            });
        }

        // 登录功能
        async function login() {
            const name = loginName.value.trim();
            const password = loginPassword.value.trim();
            if (!name || !password) {
                loginMessage.textContent = '请输入用户名和密码';
                return;
            }

            loginMessage.textContent = '登录中...';
            const body = `name=${encodeURIComponent(name)}&password=${encodeURIComponent(password)}`;

            try {
                const response = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                const responseText = await response.text();
                let json;
                try {
                    json = JSON.parse(responseText);
                } catch {
                    throw new Error('服务器返回非JSON格式');
                }

                if (response.ok && json.code === 1 && json.data && json.data.token) {
                    userToken = json.data.token; // 保存 token
                    loginMessage.textContent = '登录成功！';
                    // 可以重新加载列表（使用新 token）
                    fetchPosts(currentPage);
                } else {
                    loginMessage.textContent = json.msg || '登录失败';
                }
            } catch (err) {
                loginMessage.textContent = `错误: ${err.message}`;
            }
        }

        // 辅助函数
        function showLoading(show) {
            listLoading.style.display = show ? 'block' : 'none';
            if (show) postListEl.innerHTML = '';
        }
        function showError(msg) {
            listError.style.display = 'block';
            listError.textContent = `错误: ${msg}`;
            postListEl.innerHTML = '';
        }
        function hideError() {
            listError.style.display = 'none';
        }
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 事件绑定
        loginBtn.addEventListener('click', login);

        // 初始化
        fetchPosts(currentPage);
    })();
</script>
</body>
</html>
