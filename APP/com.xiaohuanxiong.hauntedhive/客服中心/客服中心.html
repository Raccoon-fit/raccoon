    <script>
        // 屏蔽返回键功能
        history.pushState(null, null, document.URL);
        window.addEventListener('popstate', function(event) {
            history.pushState(null, null, document.URL);
        });
        // 主题切换功能
        const themeSwitch = document.getElementById('themeSwitch');
        const icon = themeSwitch.querySelector('i');
        // 检查本地存储中的主题偏好
        if (localStorage.getItem('夜间模式') === '开启') {
            document.body.classList.add('夜间模式');
            icon.classList.replace('fa-moon', 'fa-sun');
        }
        themeSwitch.addEventListener('click', () => {
            document.body.classList.toggle('夜间模式');
            if (document.body.classList.contains('夜间模式')) {
                localStorage.setItem('夜间模式', '开启');
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                localStorage.setItem('夜间模式', '关闭');
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>
    <script>
        webapp.record(); //清空浏览历史访问记录
    </script>
    
    <style>
         :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --dark-color: #2b2d42;
            --light-color: #f8f9fa;
            --bg-color: #f5f7fa;
            --text-color: #2b2d42;
            --container-bg: white;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }
        
        .夜间模式 {
            --primary-color: #5dade2;
            --secondary-color: #3498db;
            --accent-color: #7fb3d5;
            --dark-color: #e0e0e0;
            --light-color: #2d2d2d;
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --container-bg: #2d2d2d;
            --border-color: #444;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        
        header {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 4px 6px var(--shadow-color);
            transition: all 0.3s ease;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .main-content {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        
        .game-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.2rem;
            width: 100%;
            margin-top: 1.5rem;
        }
        
        .game-card {
            background: var(--container-bg);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 5px 15px var(--shadow-color);
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }
        
        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px var(--shadow-color);
        }
        
        .game-icon {
            width: 60px;
            height: 60px;
            background: var(--accent-color);
            border-radius: 12px;
            /* 修改为圆角 */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 3px 6px var(--shadow-color);
            overflow: hidden;
            /* 确保图片也应用圆角 */
        }
        
        .game-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            /* 图片也应用相同的圆角 */
        }
        
        .game-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
        
        .game-desc {
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        
        .contact-btn {
            background: linear-gradient(to right, var(--accent-color), var(--primary-color));
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 6px var(--shadow-color);
        }
        
        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px var(--shadow-color);
        }
        
        footer {
            background: var(--dark-color);
            color: white;
            padding: 1rem 0;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            list-style: none;
            flex-wrap: wrap;
        }
        
        .nav-links li {
            margin: 0 1rem;
        }
        
        .nav-links a {
            color: #7df797;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
            padding: 0.3rem 0;
        }
        
        .nav-links a:hover {
            color: var(--accent-color);
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-color);
            transition: width 0.3s;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .copyright {
            margin-top: 0.8rem;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        
        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 5px var(--shadow-color);
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .theme-switch i {
            font-size: 1.5em;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            .game-cards {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .game-card {
                padding: 1.2rem;
            }
            .nav-links li {
                margin: 0 0.5rem;
            }
        }
    </style>
</body>
