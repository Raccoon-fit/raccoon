            getSystemInfo() {
                const ua = navigator.userAgent;
                let browserName = '未知浏览器';
                let browserVersion = '';
                if (/Edg\/([\d.]+)/.test(ua)) {
                    browserName = 'Microsoft Edge';
                    browserVersion = RegExp.$1;
                } else if (/OPR\/([\d.]+)/.test(ua)) {
                    browserName = 'Opera';
                    browserVersion = RegExp.$1;
                } else if (/Chrome\/([\d.]+)/.test(ua)) {
                    browserName = 'Chrome';
                    browserVersion = RegExp.$1;
                } else if (/Firefox\/([\d.]+)/.test(ua)) {
                    browserName = 'Firefox';
                    browserVersion = RegExp.$1;
                } else if (/Safari\/([\d.]+)/.test(ua)) {
                    browserName = 'Safari';
                    browserVersion = RegExp.$1;
                }
                let osName = '未知系统';
                if (/Windows NT ([\d.]+)/.test(ua)) {
                    const map = { '10.0': 'Windows 10/11', '6.3': 'Windows 8.1', '6.2': 'Windows 8', '6.1': 'Windows 7' };
                    osName = map[RegExp.$1] || `Windows NT ${RegExp.$1}`;
                } else if (/Mac OS X ([\d_]+)/.test(ua)) {
                    osName = 'macOS ' + RegExp.$1.replace(/_/g, '.');
                } else if (/Android ([\d.]+)/.test(ua)) {
                    osName = 'Android ' + RegExp.$1;
                } else if (/iPhone OS ([\d_]+)/.test(ua)) {
                    osName = 'iOS ' + RegExp.$1.replace(/_/g, '.');
                } else if (/Linux/.test(ua)) {
                    osName = 'Linux';
                }
                const cpu = navigator.hardwareConcurrency || '不可用';
                const memory = (typeof navigator.deviceMemory !== 'undefined') ? navigator.deviceMemory + ' GB' : '不可用';
                const platform = navigator.platform || '不可用';
                const lang = navigator.language || '不可用';
                const online = navigator.onLine ? '在线' : '离线';
                const cores = navigator.hardwareConcurrency || '不可用';
                const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                const connType = connection ? (connection.effectiveType || connection.type || '未知') : 'API 不可用';
                const touchPoints = navigator.maxTouchPoints || 0;
                let storageEst = '不可用';
                if (navigator.storage && navigator.storage.estimate) {
                    navigator.storage.estimate().then(est => {
                        const used = ((est.usage || 0) / 1024 / 1024).toFixed(2);
                        const total = ((est.quota || 0) / 1024 / 1024).toFixed(2);
                        const el = document.querySelector('#storage-estimate');
                        if (el) el.textContent = `${used} MB / ${total} MB`;
                    }).catch(() => {});
                    storageEst = '<span id="storage-estimate">计算中...</span>';
                }
                const cookiesEnabled = navigator.cookieEnabled ? '启用' : '禁用';
                const doNotTrack = navigator.doNotTrack === '1' ? '启用' : '未启用';
                const colorDepth = screen.colorDepth + ' bit';
                const pixelRatio = window.devicePixelRatio || 1;
                const caps = {
                    wakeLock: !!(navigator.wakeLock),
                    idleDetector: 'IdleDetector' in window,
                    notification: 'Notification' in window,
                    clipboard: !!(navigator.clipboard && navigator.clipboard.readText),
                    share: !!navigator.share,
                    fileSystem: 'showDirectoryPicker' in window,
                    mediaSession: 'mediaSession' in navigator,
                    navigation: 'navigation' in window,
                    windowControlsOverlay: 'windowControlsOverlay' in navigator,
                    camera: 'HTMLCameraElement' in window,
                    microphone: 'HTMLMicrophoneElement' in window,
                    viewTransition: 'startViewTransition' in document,
                    cssWindowDrag: this.useNativeWindowDrag || false
                };
                const cpuPerf = (typeof performance.now === 'function')
                    ? `${(performance.now() / 1000).toFixed(1)} 秒` : '不可用';
                return {
                    browserName,
                    browserVersion,
                    osName,
                    cpu,
                    cores,
                    memory,
                    platform,
                    lang,
                    online,
                    connType,
                    touchPoints,
                    storageEst,
                    cookiesEnabled,
                    doNotTrack,
                    colorDepth,
                    pixelRatio,
                    screenRes: `${screen.width} × ${screen.height}`,
                    availScreen: `${screen.availWidth} × ${screen.availHeight}`,
                    viewport: `${window.innerWidth} × ${window.innerHeight}`,
                    colorDepthBits: colorDepth,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '未知',
                    cpuPerf,
                    caps
                };
            }

            getSettingsSystem() {

                return `

            showWindowContextMenu(x, y, winObj) {
                this.removeAllContextMenus();
                const menu = document.createElement('div');
                menu.className = 'context-menu';
                const isMaximized = winObj.element.style.width === '100%';
                menu.innerHTML = `
                    <div class="context-menu-item" data-action="restore" style="${isMaximized ? '' : 'display:none'}">还原</div>
                    <div class="context-menu-item" data-action="maximize" style="${isMaximized ? 'display:none' : ''}">最大化</div>
                    <div class="context-menu-item" data-action="minimize">最小化</div>
                    <div class="context-menu-divider"></div>
                    <div class="context-menu-item" data-action="close">关闭窗口</div>
                `;
                document.body.appendChild(menu);
                const mw = menu.offsetWidth;
                const mh = menu.offsetHeight;
                menu.style.visibility = 'hidden';
                let left = x;
                let top = y - mh;
                if (left + mw > window.innerWidth - 4) left = window.innerWidth - mw - 4;
                if (left < 4) left = 4;
                if (top < 8) top = y + 8;
                if (top + mh > window.innerHeight - 4) top = window.innerHeight - mh - 4;
                menu.style.left = left + 'px';
                menu.style.top = top + 'px';
                menu.style.visibility = 'visible';
                menu.querySelector('[data-action="close"]').addEventListener('click', () => {
                    this.closeWindow(winObj);
                    menu.remove();
                });
                const minimizeItem = menu.querySelector('[data-action="minimize"]');
                if (minimizeItem) {
                    minimizeItem.addEventListener('click', () => {
                        this.toggleMinimizeWindow(winObj);
                        menu.remove();
                    });
                }
                const maximizeItem = menu.querySelector('[data-action="maximize"]');
                if (maximizeItem) {
                    maximizeItem.addEventListener('click', () => {
                        const btn = winObj.element.querySelector('[data-action="maximize"]');
                        if (btn) btn.click();
                        menu.remove();
                    });
                }
                const restoreItem = menu.querySelector('[data-action="restore"]');
                if (restoreItem) {
                    restoreItem.addEventListener('click', () => {
                        const btn = winObj.element.querySelector('[data-action="maximize"]');
                        if (btn) btn.click();
                        menu.remove();
                    });
                }
                document.body.appendChild(menu);
                const closeHandler = (e) => { if (!menu.contains(e.target)) menu.remove();
                    document.removeEventListener('click', closeHandler); };
                setTimeout(() => document.addEventListener('click', closeHandler), 0);

            cascadeWindows() {
                const visible = this.windows.filter(w => !w.minimized);
                if (visible.length === 0) return;
                const startX = 50;
                const startY = 50;
                const offset = 24;
                visible.forEach((win, idx) => {
                    const el = win.element;
                    if (el.style.width === '100%') return;
                    el.style.left = (startX + idx * offset) + 'px';
                    el.style.top = (startY + idx * offset) + 'px';
                    win.savedPosition.left = startX + idx * offset;
                    win.savedPosition.top = startY + idx * offset;
                });
                if (visible.length > 0) this.activateWindow(visible[0]);
            }

            createBaseWindow(id, icon, title) {
                const win = document.createElement('div');
                win.className = 'window';
                win.style.width = '800px';
                win.style.height = '550px';
                win.innerHTML = `
                    <div class="window-header">
                        <div class="window-title"><span class="material-symbols-outlined text-sm">${icon}</span> ${title}</div>
                        <div class="window-controls">
                            <div class="win-btn" data-action="minimize"><span class="material-symbols-outlined text-sm">remove</span></div>
                            <div class="win-btn" data-action="maximize"><span class="material-symbols-outlined text-sm">crop_square</span></div>
                            <div class="win-btn win-close" data-action="close"><span class="material-symbols-outlined text-sm">close</span></div>
                        </div>
                    </div>
                    <div class="window-content"></div>
                `;
                const header = win.querySelector('.window-header');
                if (this.useNativeWindowDrag && this.isStandalonePwa) {
                    header.classList.add('native-drag');
                }
                let offsetX, offsetY, isDragging = false;
                const constrain = (left, top) => {
                    const maxX = window.innerWidth - win.offsetWidth;
                    const maxY = window.innerHeight - 44 - win.offsetHeight;
                    return { left: Math.max(0, Math.min(left, maxX)), top: Math.max(0, Math.min(top, maxY)) };
                };
                header.addEventListener('mousedown', (e) => {
                    if (this.useNativeWindowDrag && this.isStandalonePwa) return;
                    if (e.target.closest('.win-btn')) return;
                    isDragging = true;
                    offsetX = e.clientX - win.offsetLeft;
                    offsetY = e.clientY - win.offsetTop;
                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) this.activateWindow(winObj);
                });
                const onMouseMove = (e) => {
                    if (!isDragging) return;
                    let newLeft = e.clientX - offsetX;
                    let newTop = e.clientY - offsetY;
                    const constrained = constrain(newLeft, newTop);
                    win.style.left = constrained.left + 'px';
                    win.style.top = constrained.top + 'px';
                    win.style.transform = 'none';
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) {
                        winObj.savedPosition.left = constrained.left;
                        winObj.savedPosition.top = constrained.top;
                    }
                };
                const onMouseUp = () => {
                    isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                win.querySelector('[data-action="minimize"]').addEventListener('click', () => {
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) this.toggleMinimizeWindow(winObj);
                });
                win.querySelector('[data-action="close"]').addEventListener('click', () => {
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) this.closeWindow(winObj);
                });
                const maximizeBtn = win.querySelector('[data-action="maximize"]');
                maximizeBtn.addEventListener('click', () => {
                    const winObj = this.windows.find(w => w.id === id);
                    if (!winObj) return;
                    const isMaximized = win.style.width === '100%';
                    if (isMaximized) {
                        win.style.width = winObj.savedPosition.width || '800px';
                        win.style.height = winObj.savedPosition.height || '550px';
                        win.style.left = winObj.savedPosition.left + 'px';
                        win.style.top = winObj.savedPosition.top + 'px';
                        win.style.borderRadius = '10px';
                        win.style.boxSizing = '';
                        const winContent = win.querySelector('.window-content');
                        if (winContent) {
                            winContent.style.borderRadius = '';
                            winContent.style.overflow = '';
                        }
                        maximizeBtn.innerHTML = '<span class="material-symbols-outlined text-sm">crop_square</span>';
                    } else {
                        winObj.savedPosition.width = win.style.width;
                        winObj.savedPosition.height = win.style.height;
                        winObj.savedPosition.left = parseInt(win.style.left);
                        winObj.savedPosition.top = parseInt(win.style.top);
                        win.style.width = '100%';
                        win.style.height = 'calc(100vh - 44px)';
                        win.style.left = '0';
                        win.style.top = '0';
                        win.style.borderRadius = '0 0 10px 10px';
                        win.style.boxSizing = 'border-box';
                        const winContent = win.querySelector('.window-content');
                        if (winContent) {
                            winContent.style.borderRadius = '0 0 10px 10px';
                            winContent.style.overflow = 'hidden';
                        }
                        maximizeBtn.innerHTML = '<span class="material-symbols-outlined text-sm">fullscreen_exit</span>';
                    }
                });
                win.addEventListener('mousedown', () => {
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) this.activateWindow(winObj);
                });
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        win.classList.add('window-open');
                    });
                });
                return win;
            }

            // 文件管理器（完整功能）
            fileIconOf(name, type) {
                if (type === 'dir') return { icon: 'folder', cls: 'fm-folder-icon' };
                const ext = (name.split('.').pop() || '').toLowerCase();
                if (['txt', 'md', 'log', 'readme'].includes(ext)) return { icon: 'description', cls: 'fm-doc-icon' };
                if (['doc', 'docx'].includes(ext)) return { icon: 'article', cls: 'fm-doc-icon' };
                if (['xls', 'xlsx', 'csv'].includes(ext)) return { icon: 'table_chart', cls: 'fm-doc-icon' };
                if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg'].includes(ext)) return { icon: 'image', cls: 'fm-img-icon' };
                if (['mp3', 'wav', 'flac', 'ogg', 'm4a'].includes(ext)) return { icon: 'music_note', cls: 'fm-audio-icon' };
                if (['mp4', 'avi', 'mkv', 'mov', 'wmv', 'webm'].includes(ext)) return { icon: 'movie', cls: 'fm-video-icon' };
                if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return { icon: 'folder_zip', cls: 'fm-zip-icon' };
                if (['exe', 'msi', 'bat', 'cmd'].includes(ext)) return { icon: 'apps', cls: 'fm-exe-icon' };
                return { icon: 'insert_drive_file', cls: 'fm-other-icon' };
            }

                        } catch (e) { fmContent.innerHTML = `<div class="fm-empty">无法读取目录</div>`; return; }
                        entries.sort((a, b) => {
                            if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
                            return a.name.localeCompare(b.name, 'zh-CN');
                        });
                        const shown = query ? entries.filter(f => f.name.toLowerCase().includes(query)) : entries;
                        if (shown.length === 0) {
                            fmContent.innerHTML = `<div class="fm-empty">此文件夹为空${query ? '，无匹配搜索结果' : ''}</div>`;
                            renderStatus();
                            return;
                        }
                        fmContent.innerHTML = `<div class="fm-grid">
                            ${shown.map((file) => {
                                const { icon, cls } = this.fileIconOf(file.name, file.type);
                                return `<div class="fm-item" data-name="${file.name}">
                                    <span class="material-symbols-outlined fm-icon ${cls}">${icon}</span>
                                    <span class="fm-name">${file.name}</span>
                                </div>`;
                            }).join('')}
                        </div>`;
                        fmContent.querySelectorAll('.fm-item').forEach((itemEl) => {
                            const file = entries.find(f => f.name === itemEl.dataset.name);
                            itemEl.addEventListener('click', (e) => {
                                e.stopPropagation();
                                selectedFile = file;
                                fmContent.querySelectorAll('.fm-item').forEach(i => i.classList.remove('selected'));
                                itemEl.classList.add('selected');
                                renderStatus();
                            });
                            itemEl.addEventListener('dblclick', async () => {
                                if (file.type === 'dir') {
                                    navigateToReal(file.handle, file.name);
                                } else {
                                    this.openFileWithApp(file, file.handle);
                                }
                            });
                            itemEl.addEventListener('contextmenu', (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                            });
                        });
                        renderStatus();
                    })();
                };

                const renderDir = () => {
                    if (currentDirHandle) renderRealDir();
                    else renderInternalDir();
                };

                const render = () => {
                    renderBreadcrumb();
                    sidebar.querySelectorAll('.fm-tree-item').forEach(t => {
                        const active = currentDirHandle ? t.dataset.path === 'root' : t.dataset.path === currentPath;
                        t.classList.toggle('active', active);
                    });
                    if (currentPath === 'root') renderHome();
                    else renderDir();
                    renderStatus();
                    const backBtn = content.querySelector('[data-nav="back"]');
                    const fwdBtn = content.querySelector('[data-nav="forward"]');
                    const upBtn = content.querySelector('[data-nav="up"]');
                    backBtn.disabled = historyBack.length === 0;
                    fwdBtn.disabled = historyForward.length === 0;
                    upBtn.disabled = currentPath === 'root' && !currentDirHandle;
                };

                const renderStatus = () => {
                    if (currentPath === 'root' && !currentDirHandle) {
                        const n = Object.keys(this.fileSystem).filter(k => k !== 'desktop_folder').length;
                        statusEl.textContent = `${n} 个项目`;
                        return;
                    }
                    statusEl.textContent = selectedFile ? `已选择: ${selectedFile.name}` : '';
                };

                const navigateToInternal = (path) => {
                    if (path === currentPath && !currentDirHandle) return;
                    historyBack.push({ path: currentPath, handle: currentDirHandle, label: currentDirLabel });
                    historyForward.length = 0;
                    currentPath = path;
                    currentDirHandle = null;
                    currentDirLabel = null;
                    selectedFile = null;
                    searchInput.value = '';
                    render();
                };

                const navigateToReal = (handle, label) => {
                    historyBack.push({ path: currentPath, handle: currentDirHandle, label: currentDirLabel });
                    historyForward.length = 0;
                    currentPath = null;
                    currentDirHandle = handle;
                    currentDirLabel = label || '磁盘';
                    selectedFile = null;
                    searchInput.value = '';
                    render();
                };

                content.querySelector('[data-nav="back"]').addEventListener('click', () => {
                    if (historyBack.length === 0) return;
                    historyForward.unshift({ path: currentPath, handle: currentDirHandle, label: currentDirLabel });
                    const entry = historyBack.pop();
                    currentPath = entry.path;
                    currentDirHandle = entry.handle;
                    currentDirLabel = entry.label;
                    selectedFile = null;
                    searchInput.value = '';
                    render();
                });
                content.querySelector('[data-nav="forward"]').addEventListener('click', () => {
                    if (historyForward.length === 0) return;
                    historyBack.push({ path: currentPath, handle: currentDirHandle, label: currentDirLabel });
                    const entry = historyForward.shift();
                    currentPath = entry.path;
                    currentDirHandle = entry.handle;
                    currentDirLabel = entry.label;
                    selectedFile = null;
                    searchInput.value = '';
                    render();
                });
                content.querySelector('[data-nav="up"]').addEventListener('click', () => {
                    if (currentDirHandle) {
                        navigateToInternal('root');
                    } else {
                        navigateToInternal('root');
                    }
                });
                content.querySelector('[data-nav="refresh"]').addEventListener('click', () => {
                    render();
                    this.showToast('已刷新', 'refresh');
                });
                content.querySelector('[data-nav="newfolder"]').addEventListener('click', () => {
                    if (currentDirHandle) {
                        this.showToast('真实目录不支持新建，请在虚拟文件夹中操作', 'lock');
                        return;
                    }
                    if (currentPath === 'root') {
                        this.showToast('请先进入一个文件夹目录', 'info');
                        return;
                    }
                    this.showSystemDialog('新建文件夹', '请输入文件夹名称:', (name) => {
                        if (name) {
                            this.fileSystem[currentPath].push({
                                name,
                                type: 'dir',
                                path: `${currentPath}_${Date.now()}`
                            });
                            render();
                        }
                    }, true);
                });
                content.querySelector('[data-nav="paste"]').addEventListener('click', () => {
                    if (currentDirHandle) {
                        this.showToast('真实目录不支持粘贴，请在虚拟文件夹中操作', 'lock');
                        return;
                    }
                    if (currentPath === 'root') {
                        this.showToast('请先进入一个文件夹目录', 'info');
                        return;
                    }
                    if (this.copyFile) {
                        const newFile = { ...this.copyFile, name: `副本 - ${this.copyFile.name}` };
                        this.fileSystem[currentPath].push(newFile);
                        this.copyFile = null;
                        this.copyFilePath = null;
                        render();
                    } else if (this.cutFile) {
                        const srcPath = this.cutFilePath;
                        if (srcPath && srcPath !== currentPath) {
                            const srcIdx = this.fileSystem[srcPath].indexOf(this.cutFile);
                            if (srcIdx !== -1) {
                                this.fileSystem[srcPath].splice(srcIdx, 1);
                                this.fileSystem[currentPath].push(this.cutFile);
                            }
                        }
                        this.cutFile = null;
                        this.cutFilePath = null;
                        render();
                    } else {
                        this.showToast('剪贴板中没有可粘贴的内容', 'content_paste');
                    }
                });
                sidebar.querySelectorAll('.fm-tree-item').forEach(el => {
                    el.addEventListener('click', () => navigateToInternal(el.dataset.path));
                });
                fmContent.addEventListener('contextmenu', (e) => {
                    if (e.target.closest('.fm-item') || e.target.closest('.fm-card')) return;
                    if (currentPath === 'root' || currentDirHandle) return;
                    e.preventDefault();
                    selectedFile = null;
                    renderStatus();
                    this.showFolderContextMenu(e.clientX, e.clientY, () => renderInternalDir(), content, currentPath);
                });
                fmContent.addEventListener('click', () => {
                    if (selectedFile) {
                        selectedFile = null;
                        renderStatus();
                        fmContent.querySelectorAll('.fm-item').forEach(i => i.classList.remove('selected'));
                    }
                });
                searchInput.addEventListener('input', () => {
                    if (currentPath === 'root' && !currentDirHandle) return;
                    renderDir();
                });

                render();
                return win;
            }

            getFileKind(name) {
                const ext = (name.split('.').pop() || '').toLowerCase();
                if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'].includes(ext)) return 'image';
                if (['mp4', 'avi', 'mkv', 'mov', 'wmv', 'webm', 'flv', 'm4v', '3gp'].includes(ext)) return 'video';
                if (['mp3', 'wav', 'flac', 'ogg', 'm4a', 'aac', 'opus', 'mid', 'midi'].includes(ext)) return 'audio';
                if (['txt', 'md', 'log', 'json', 'js', 'css', 'html', 'xml', 'yml', 'yaml', 'ini', 'csv', 'bat', 'sh'].includes(ext)) return 'text';
                return 'other';
            }

            makeSvgImageUrl(name) {
                const palette = ['#2c3e50', '#20639b', '#16a085', '#c0392b', '#8e44ad', '#d35400'];
                const c = palette[(name.charCodeAt(0) || 0) % palette.length];
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420"><rect width="100%" height="100%" fill="${c}"/><rect x="20" y="20" width="600" height="380" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" rx="10"/><circle cx="320" cy="180" r="70" fill="rgba(255,255,255,0.18)"/><text x="320" y="300" font-size="26" fill="#fff" text-anchor="middle" font-family="sans-serif">${name}</text><text x="320" y="340" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle" font-family="sans-serif">示例图片（虚拟文件）</text></svg>`;
                return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            }

            makeToneWav(freq) {
                const sampleRate = 44100;
                const seconds = 2;
                const n = Math.floor(sampleRate * seconds);
                const buffer = new ArrayBuffer(44 + n * 2);
                const view = new DataView(buffer);
                const writeStr = (offset, text) => { for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i)); };
                writeStr(0, 'RIFF');
                view.setUint32(4, 36 + n * 2, true);
                writeStr(8, 'WAVE');
                writeStr(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, 1, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                writeStr(36, 'data');
                view.setUint32(40, n * 2, true);
                for (let i = 0; i < n; i++) {
                    const t = i / sampleRate;
                    const env = Math.min(1, t / 0.02) * Math.min(1, (seconds - t) / 0.02);
                    const v = Math.sin(2 * Math.PI * freq * t) * 0.5 * env;
                    view.setInt16(44 + i * 2, v * 32767, true);
                }
                return URL.createObjectURL(new Blob([view], { type: 'audio/wav' }));
            }

            async openFileWithApp(file, handle) {
                const kind = this.getFileKind(file.name);
                const winId = this.nextWindowId++;
                if (kind === 'image') {
                    let url = null;
                    if (handle) {
                        try { const blob = await handle.getFile(); if (blob) url = URL.createObjectURL(blob); } catch (e) {}
                    }
                    if (!url) url = this.makeSvgImageUrl(file.name);
                    const winElement = this.createImageViewerWindow(winId, [{ name: file.name, url }]);
                    this.finishOpenWindow(winElement, 'imagerviewer', winId);
                } else if (kind === 'video') {
                    let url = null;
                    if (handle) {
                        try { const blob = await handle.getFile(); if (blob) url = URL.createObjectURL(blob); } catch (e) {}
                    }
                    const winElement = this.createVideoViewerWindow(winId, [{ name: file.name, url, isVirtual: !handle }]);
                    this.finishOpenWindow(winElement, 'videoviewer', winId);
                } else if (kind === 'audio') {
                    let url = null;
                    if (handle) {
                        try { const blob = await handle.getFile(); if (blob) url = URL.createObjectURL(blob); } catch (e) {}
                    }
                    if (!url) url = this.makeToneWav(440 + (file.name.charCodeAt(0) % 400));
                    const winElement = this.createMusicPlayerWindow(winId, [{ name: file.name, url, isVirtual: !handle }]);
                    this.finishOpenWindow(winElement, 'musicplayer', winId);
                } else if (kind === 'text') {
                    let text = file.content || '';
                    if (handle) {
                        try { const blob = await handle.getFile(); text = await blob.text(); } catch (e) {}
                    }
                    const winElement = this.createTextViewerWindow(winId, file.name, text);
                    this.finishOpenWindow(winElement, 'textviewer', winId);
                } else {
                    this.showSystemDialog('打开文件', `暂不支持预览 "${file.name}"。`);
                }
            }

            finishOpenWindow(winElement, appName, id) {
                document.getElementById('desktop-area').appendChild(winElement);
                const winObj = { id, element: winElement, appName, minimized: false, taskbarButton: null,
                    savedPosition: { left: 120, top: 90, width: 800, height: 500 } };
                this.windows.push(winObj);
                this.addToTaskbar(winObj);
                this.activateWindow(winObj);
                let left = 120 + (this.windows.length * 22);
                let top = 90 + (this.windows.length * 22);
                left = Math.min(left, window.innerWidth - 400);
                top = Math.min(top, window.innerHeight - 44 - 320);
                winElement.style.left = left + 'px';
                winElement.style.top = top + 'px';
                winObj.savedPosition.left = left;
                winObj.savedPosition.top = top;
            }

            createImageViewerWindow(id, images) {
                const win = this.createBaseWindow(id, 'image', '图片查看器');
                const content = win.querySelector('.window-content');
                let allowPick = images === null || images.length === 0;
                images = images || [];
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.innerHTML = `
                    <div style="display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.1);align-items:center;background:#222;">
                        <button class="img-btn" data-act="prev" title="上一张"><span class="material-symbols-outlined">chevron_left</span></button>
                        <span id="img-index" style="font-size:12px;color:#aaa;min-width:64px;text-align:center;">1 / ${images.length}</span>
                        <button class="img-btn" data-act="next" title="下一张"><span class="material-symbols-outlined">chevron_right</span></button>
                        <div style="width:1px;height:20px;background:rgba(255,255,255,0.12);margin:0 4px;"></div>
                        <button class="img-btn" data-act="zoom-out" title="缩小"><span class="material-symbols-outlined">zoom_out</span></button>
                        <button class="img-btn" data-act="zoom-in" title="放大"><span class="material-symbols-outlined">zoom_in</span></button>
                        <button class="img-btn" data-act="fit" title="适应窗口"><span class="material-symbols-outlined">fit_screen</span></button>
                        <button class="img-btn" data-act="rotate" title="旋转"><span class="material-symbols-outlined">rotate_right</span></button>
                        <div style="flex:1;"></div>
                        <button class="img-btn" data-act="slide" title="幻灯片放映">▶ 幻灯片</button>
                    </div>
                    <div class="img-canvas" id="img-canvas"></div>
                    <div style="height:28px;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#999;border-top:1px solid rgba(255,255,255,0.08);background:#222;"><span id="img-name"></span></div>
                `;
                let index = 0;
                let scale = 1;
                let rotate = 0;
                let slideTimer = null;
                const canvas = content.querySelector('#img-canvas');
                const nameEl = content.querySelector('#img-name');
                const indexEl = content.querySelector('#img-index');

                const renderImage = () => {
                    if (allowPick) {
                        canvas.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:16px;color:#888;">
                            <div class="material-symbols-outlined" style="font-size:72px;color:#555;">image</div>
                            <div>拖放图片到此处，或点击下方按钮选择本地图片</div>
                            <button class="img-btn" id="img-pick" style="font-size:14px;padding:8px 20px;">打开本地图片</button>
                        </div>`;
                        const pickBtn = canvas.querySelector('#img-pick');
                        pickBtn.addEventListener('click', async () => {
                            try {
                                if (!('showOpenFilePicker' in window)) { this.showToast('浏览器不支持文件选择', 'lock'); return; }
                                const handles = await window.showOpenFilePicker({ multiple: true, types: [{ description: '图片', accept: { 'image/*': ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.webp', '.svg'] } }] });
                                const newImages = [];
                                for (const h of handles) {
                                    const blob = await h.getFile();
                                    newImages.push({ name: h.name, url: URL.createObjectURL(blob) });
                                }
                                if (newImages.length > 0) {
                                    images.length = 0;
                                    newImages.forEach(x => images.push(x));
                                    allowPick = false;
                                    index = 0; scale = 1; rotate = 0;
                                    renderImage();
                                }
                            } catch (e) { if (e && e.name === 'AbortError') return; }
                        });
                        canvas.addEventListener('dragover', (e) => e.preventDefault());
                        canvas.addEventListener('drop', (e) => {
                            e.preventDefault();
                            const files = [...e.dataTransfer.files];
                            if (files.length === 0) return;
                            const newImages = files.map(f => ({ name: f.name, url: URL.createObjectURL(f) }));
                            images.length = 0;
                            newImages.forEach(x => images.push(x));
                            allowPick = false;
                            index = 0; scale = 1; rotate = 0;
                            renderImage();
                        });
                        nameEl.textContent = '图片查看器';
                        indexEl.textContent = '0 / 0';
                        return;
                    }
                    const img = images[index];
                    if (!img) { canvas.innerHTML = '<div style="color:#888;margin:auto;">无可用图片</div>'; nameEl.textContent = ''; indexEl.textContent = '0 / 0'; return; }
                    canvas.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden;"><img src="${img.url}" style="max-width:100%;max-height:100%;width:auto;height:auto;transform:scale(${scale}) rotate(${rotate}deg);transition:transform 0.2s;"></div>`;
                    nameEl.textContent = img.name;
                    indexEl.textContent = `${index + 1} / ${images.length}`;
                };

                const scrollImage = (dir) => {
                    if (images.length === 0) return;
                    index = (index + dir + images.length) % images.length;
                    scale = 1;
                    rotate = 0;
                    renderImage();
                };

                content.querySelector('[data-act="prev"]').addEventListener('click', () => scrollImage(-1));
                content.querySelector('[data-act="next"]').addEventListener('click', () => scrollImage(1));
                content.querySelector('[data-act="zoom-in"]').addEventListener('click', () => { scale = Math.min(scale * 1.2, 5); renderImage(); });
                content.querySelector('[data-act="zoom-out"]').addEventListener('click', () => { scale = Math.max(scale / 1.2, 0.2); renderImage(); });
                content.querySelector('[data-act="fit"]').addEventListener('click', () => { scale = 1; rotate = 0; renderImage(); });
                content.querySelector('[data-act="rotate"]').addEventListener('click', () => { rotate = (rotate + 90) % 360; renderImage(); });
                content.querySelector('[data-act="slide"]').addEventListener('click', () => {
                    if (slideTimer) { clearInterval(slideTimer); slideTimer = null; return; }
                    slideTimer = setInterval(() => scrollImage(1), 2500);
                    scrollImage(0);
                });
                if (images.length > 0 || allowPick) renderImage();
                return win;
            }

            createVideoViewerWindow(id, videos) {
                const win = this.createBaseWindow(id, 'movie', '视频查看器');
                const content = win.querySelector('.window-content');
                let allowPick = videos === null || videos.length === 0;
                videos = videos || [];
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.innerHTML = `
                    <div style="display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.1);align-items:center;background:#222;">
                        <button class="img-btn" data-act="prev" title="上一个"><span class="material-symbols-outlined">skip_previous</span></button>
                        <span id="vd-index" style="font-size:12px;color:#aaa;min-width:64px;text-align:center;">1 / ${videos.length}</span>
                        <button class="img-btn" data-act="next" title="下一个"><span class="material-symbols-outlined">skip_next</span></button>
                        <div style="flex:1;"></div>
                    </div>
                    <div class="img-canvas" id="vd-canvas"></div>
                    <div style="height:28px;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#999;border-top:1px solid rgba(255,255,255,0.08);background:#222;"><span id="vd-name"></span></div>
                `;
                let index = 0;
                const canvas = content.querySelector('#vd-canvas');
                const nameEl = content.querySelector('#vd-name');
                const indexEl = content.querySelector('#vd-index');

                const renderVideo = () => {
                    if (allowPick) {
                        canvas.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:16px;color:#888;">
                            <div class="material-symbols-outlined" style="font-size:72px;color:#555;">movie</div>
                            <div>拖放视频到此处，或点击下方按钮选择本地视频</div>
                            <button class="img-btn" id="vd-pick" style="font-size:14px;padding:8px 20px;">打开本地视频</button>
                        </div>`;
                        const pickBtn = canvas.querySelector('#vd-pick');
                        pickBtn.addEventListener('click', async () => {
                            try {
                                if (!('showOpenFilePicker' in window)) { this.showToast('浏览器不支持文件选择', 'lock'); return; }
                                const handles = await window.showOpenFilePicker({ multiple: true, types: [{ description: '视频', accept: { 'video/*': ['.mp4', '.avi', '.mkv', '.mov', '.wmv', '.webm', '.m4v'] } }] });
                                const newVideos = [];
                                for (const h of handles) {
                                    const blob = await h.getFile();
                                    newVideos.push({ name: h.name, url: URL.createObjectURL(blob) });
                                }
                                if (newVideos.length > 0) {
                                    allowPick = false;
                                    index = 0;
                                    videos.length = 0;
                                    newVideos.forEach(v => videos.push(v));
                                    renderVideo();
                                }
                            } catch (e) { if (e && e.name === 'AbortError') return; }
                        });
                        canvas.addEventListener('dragover', (e) => e.preventDefault());
                        canvas.addEventListener('drop', (e) => {
                            e.preventDefault();
                            const files = [...e.dataTransfer.files];
                            if (files.length === 0) return;
                            const newVideos = files.map(f => ({ name: f.name, url: URL.createObjectURL(f) }));
                            allowPick = false;
                            index = 0;
                            videos.length = 0;
                            newVideos.forEach(v => videos.push(v));
                            renderVideo();
                        });
                        nameEl.textContent = '视频查看器';
                        indexEl.textContent = '0 / 0';
                        return;
                    }
                    const v = videos[index];
                    if (!v) { canvas.innerHTML = '<div style="color:#888;margin:auto;">无可用视频</div>'; nameEl.textContent = ''; indexEl.textContent = '0 / 0'; return; }
                    nameEl.textContent = v.name;
                    indexEl.textContent = `${index + 1} / ${videos.length}`;
                    if (v.url) {
                        canvas.innerHTML = `<video src="${v.url}" controls autoplay style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
                    } else {
                        canvas.innerHTML = `<div style="margin:auto;text-align:center;color:#888;">
                            <div class="material-symbols-outlined" style="font-size:64px;color:#555;">movie</div>
                            <div style="margin-top:12px;font-size:14px;">「${v.name}」是虚拟视频文件，无媒体数据</div>
                            <div style="font-size:12px;color:#666;margin-top:6px;">可通过文件管理器打开本地文件夹中的真实视频</div>
                        </div>`;
                    }
                };
                content.querySelector('[data-act="prev"]').addEventListener('click', () => { if (videos.length === 0) return; index = (index - 1 + videos.length) % videos.length; renderVideo(); });
                content.querySelector('[data-act="next"]').addEventListener('click', () => { if (videos.length === 0) return; index = (index + 1) % videos.length; renderVideo(); });
                renderVideo();
                return win;
            }

            createMusicPlayerWindow(id, tracks) {
                const win = this.createBaseWindow(id, 'music_note', '音乐播放器');
                const content = win.querySelector('.window-content');

                const seek = content.querySelector('#mu-seek');
                const playlistEl = content.querySelector('#mu-playlist');

                const fmt = (s) => { if (!isFinite(s)) return '0:00'; const m = Math.floor(s / 60); return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };

                const renderTrack = () => {

                        </div>`
                    ).join('');
                    playlistEl.querySelectorAll('.mu-track').forEach(row => {
                        row.addEventListener('click', () => { index = parseInt(row.dataset.idx); this.muPlaying ? null : null; audio.src = tracks[index].url; audio.play(); updatePlaying(); });
                    });
                };
                const updatePlaying = () => {
                    renderTrack();
                    renderPlaylist();
                    const isPlaying = !audio.paused;
                    content.querySelector('[data-act="play"]').querySelector('span').textContent = isPlaying ? 'pause' : 'play_arrow';
                    if (tracks[index] && tracks[index].url) { artEl.innerHTML = `<span class="material-symbols-outlined" style="font-size:52px;">${isPlaying ? 'equalizer' : 'music_note'}</span>`; }

                    if (!tracks[index] || !tracks[index].url) { this.showToast('没有可播放的音频', 'info'); return; }

                });
                content.querySelector('[data-act="prev"]').addEventListener('click', () => { if (tracks.length === 0) return; index = (index - 1 + tracks.length) % tracks.length; audio.src = tracks[index].url; audio.play(); updatePlaying(); });
                content.querySelector('[data-act="next"]').addEventListener('click', () => { if (tracks.length === 0) return; index = (index + 1) % tracks.length; audio.src = tracks[index].url; audio.play(); updatePlaying(); });
                content.querySelector('[data-act="vol"]').addEventListener('click', () => { audio.muted = !audio.muted; content.querySelector('[data-act="vol"]').querySelector('span').textContent = audio.muted ? 'volume_off' : 'volume_up'; });
                audio.addEventListener('timeupdate', () => { seek.max = audio.duration || 0; seek.value = audio.currentTime || 0; curEl.textContent = fmt(audio.currentTime); durEl.textContent = fmt(audio.duration); });
                audio.addEventListener('ended', () => { content.querySelector('[data-act="next"]').click(); });
                seek.addEventListener('input', () => { if (audio.duration) audio.currentTime = parseFloat(seek.value); });
                audio.addEventListener('play', updatePlaying);
                audio.addEventListener('pause', updatePlaying);
                audio.addEventListener('loadedmetadata', () => { seek.max = audio.duration || 0; durEl.textContent = fmt(audio.duration); });
                if (tracks.length > 0) {
                    renderPlaylist();
                    updatePlaying();
                    if (tracks[0] && tracks[0].url) { audio.src = tracks[0].url; audio.play().catch(() => {}); }
                } else {
                    renderPlaylist();
                    const muBody = content.querySelector('.mu-status');
                    const overlay = document.createElement('div');
                    overlay.className = 'mu-pick-overlay';
                    overlay.innerHTML = `
                        <div class="material-symbols-outlined" style="font-size:64px;color:#555;">music_note</div>
                        <div>拖放音乐文件到此处，或点击下方按钮选择</div>
                        <button class="img-btn" id="mu-pick" style="font-size:14px;padding:8px 20px;">打开本地音乐</button>
                    `;
                    muBody.appendChild(overlay);
                    const finishPick = async () => {
                        if (tracks.length > 0) {
                            overlay.remove();
                            renderPlaylist();
                            updatePlaying();
                            if (audio.paused) audio.src = tracks[0].url;
                            audio.play().catch(() => {});
                            content.querySelector('[data-act="play"]').querySelector('span').textContent = 'pause';
                            if (artEl) artEl.innerHTML = '<span class="material-symbols-outlined" style="font-size:52px;">equalizer</span>';
                        }
                    };
                    const pickBtn = content.querySelector('#mu-pick');
                    pickBtn.addEventListener('click', async () => {
                        try {
                            if (!('showOpenFilePicker' in window)) { this.showToast('浏览器不支持文件选择', 'lock'); return; }
                            const handles = await window.showOpenFilePicker({ multiple: true, types: [{ description: '音乐', accept: { 'audio/*': ['.mp3', '.wav', '.flac', '.ogg', '.m4a', '.aac', '.opus'] } }] });
                            for (const h of handles) {
                                const blob = await h.getFile();
                                tracks.push({ name: h.name, url: URL.createObjectURL(blob) });
                            }
                            finishPick();
                        } catch (e) { if (e && e.name === 'AbortError') return; }
                    });
                    overlay.addEventListener('dragover', (e) => e.preventDefault());
                    overlay.addEventListener('drop', (e) => {
                        e.preventDefault();
                        const files = [...e.dataTransfer.files];
                        files.forEach(f => tracks.push({ name: f.name, url: URL.createObjectURL(f) }));
                        finishPick();
                    });
                }
                return win;
            }

            createCalculatorWindow(id) {
                const win = this.createBaseWindow(id, 'calculate', '计算器');
                const content = win.querySelector('.window-content');
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.style.height = '100%';
                content.innerHTML = `
                    <div style="padding:16px 16px 8px;background:#2b2b2b;border-bottom:1px solid rgba(255,255,255,0.08);">
                        <div id="calc-expr" style="text-align:right;font-size:13px;color:#8a8a8a;height:20px;overflow:hidden;white-space:nowrap;"></div>
                        <div id="calc-display" style="text-align:right;font-size:38px;font-weight:300;color:#fff;height:50px;line-height:50px;overflow:hidden;">0</div>
                    </div>
                    <div class="calc-grid">
                        <button class="calc-btn fn" data-v="C">C</button>
                        <button class="calc-btn fn" data-v="&#177;">±</button>
                        <button class="calc-btn fn" data-v="%">%</button>
                        <button class="calc-btn op" data-v="/">÷</button>
                        <button class="calc-btn num" data-v="7">7</button>
                        <button class="calc-btn num" data-v="8">8</button>
                        <button class="calc-btn num" data-v="9">9</button>
                        <button class="calc-btn op" data-v="*">×</button>
                        <button class="calc-btn num" data-v="4">4</button>
                        <button class="calc-btn num" data-v="5">5</button>
                        <button class="calc-btn num" data-v="6">6</button>
                        <button class="calc-btn op" data-v="-">−</button>
                        <button class="calc-btn num" data-v="1">1</button>
                        <button class="calc-btn num" data-v="2">2</button>
                        <button class="calc-btn num" data-v="3">3</button>
                        <button class="calc-btn op" data-v="+">+</button>
                        <button class="calc-btn zero" data-v="0">0</button>
                        <button class="calc-btn num" data-v=".">.</button>
                        <button class="calc-btn op" data-v="(">(</button>
                        <button class="calc-btn op" data-v=")">)</button>
                        <button class="calc-btn op back" data-v="back">⌫</button>
                        <button class="calc-btn eq" data-v="=">=</button>
                    </div>
                `;
                const exprEl = content.querySelector('#calc-expr');
                const dispEl = content.querySelector('#calc-display');
                let expression = '';

                const update = () => {
                    dispEl.textContent = expression === '' ? '0' : expression;
                    exprEl.textContent = expression;
                };
                const calcResult = () => {
                    try {
                        let exp = expression;
                        exp = exp.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
                        if (!exp) return;
                        const result = Function('"use strict";return (' + exp + ')')();
                        const formatted = Number.isFinite(result) ? parseFloat(result.toPrecision(12)).toString() : '错误';
                        expression = formatted;
                        exprEl.textContent = exp + ' =';
                    } catch (e) { expression = '错误'; }
                    update();
                };
                content.querySelectorAll('.calc-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const v = btn.dataset.v;
                        if (v === 'C') { expression = ''; }
                        else if (v === 'back') { expression = expression.slice(0, -1); }
                        else if (v === '=') { calcResult(); return; }
                        else if (v === '±') {
                            try {
                                const m = expression.match(/^[+-]?(.*)$/);
                                expression = (expression.startsWith('-') ? expression.slice(1) : '-' + expression);
                            } catch (e) {}
                        }
                        else if (v === '%') {
                            expression = (parseFloat(expression) / 100).toString();
                        }
                        else { expression += v; }
                        update();
                    });
                });
                function calcKey(e) {
                    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
                    if (/^[0-9+\-*/.()]$/.test(e.key)) { expression += e.key; update(); }
                    else if (e.key === 'Enter') { calcResult(); }
                    else if (e.key === 'Backspace') { expression = expression.slice(0, -1); update(); }
                    else if (e.key.toLowerCase() === 'c') { expression = ''; update(); }
                }
                document.addEventListener('keydown', calcKey);
                const observer = new MutationObserver(() => {
                    if (!win.isConnected) { observer.disconnect(); document.removeEventListener('keydown', calcKey); }
                });
                observer.observe(win.parentNode || document.body, { childList: true, subtree: true });
                update();
                return win;
            }

                    try {
                        const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'monitor' }, audio: false });
                        const video = document.createElement('video');
                        video.srcObject = stream;
                        await video.play();
                        const w = video.videoWidth || window.innerWidth;
                        const h = video.videoHeight || window.innerHeight;
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(video, 0, 0, w, h);
                        stream.getTracks().forEach(t => t.stop());
                        currentCanvas = canvas;
                        canvasWrap.innerHTML = '';
                        canvas.style.maxWidth = '100%';
                        canvas.style.maxHeight = '100%';
                        canvas.style.objectFit = 'contain';

                menu.style.zIndex = '1000';

                const rect = winEl.getBoundingClientRect();
                let left = x - rect.left;
                let top = y - rect.top;
                const menuHeight = 150;
                if (top + menuHeight > rect.height) top = y - rect.top - menuHeight;
                menu.style.left = left + 'px';
                menu.style.top = top + 'px';
                menu.innerHTML = `
                    <div class="context-menu-item" data-action="open">打开</div>
                    <div class="context-menu-divider"></div>
                    <div class="context-menu-item" data-action="rename">重命名</div>

                    <div class="context-menu-item" data-action="delete">删除</div>

                menu.querySelector('[data-action="open"]').addEventListener('click', () => {
                    if (file.type === 'dir') {
                        this.showSystemDialog('打开文件夹', `打开文件夹 "${file.name}"`);
                    } else {
                        this.openFileWithApp(file, null);
                    }
                    menu.remove();
                });
                menu.querySelector('[data-action="rename"]').addEventListener('click', () => {

                        if (newName) {
                            file.name = newName;
                            onRefresh();
                        }
                    }, true);
                    menu.remove();
                });
                menu.querySelector('[data-action="copy"]').addEventListener('click', () => {
                    this.copyFile = file;
                    this.copyFilePath = currentPath;
                    menu.remove();
                });

                    this.cutFile = file;

            showFolderContextMenu(x, y, onRefresh, win, currentPath) {
                this.removeAllContextMenus();

                menu.style.position = 'absolute';
                menu.style.zIndex = '1000';

                let top = y - rect.top;
                const menuHeight = 120;
                if (top + menuHeight > rect.height) top = y - rect.top - menuHeight;
                menu.style.left = left + 'px';
                menu.style.top = top + 'px';

                    <div class="context-menu-item" data-action="newfolder">新建文件夹</div>
                    <div class="context-menu-item" data-action="newfile">新建文本文档</div>
                    <div class="context-menu-divider"></div>

            injectIframeProxy(id) {
                const frame = document.querySelector(`#browser-frame-${id}`);
                if (!frame) return;
                try {
                    const doc = frame.contentDocument || frame.contentWindow.document;
                    const script = doc.createElement('script');
                    script.textContent = `
 (function() {
    function sendMessage(type, data) {
        window.parent.postMessage({ type, ...data }, '*');
    }
    function absUrl(u) {
        try { return new URL(u, window.location.href).href; } catch (e) { return u; }
    }
    window.addEventListener('load', function() {
        sendMessage('urlUpdated', { url: window.location.href });
    });
    setTimeout(function() {
        sendMessage('urlUpdated', { url: window.location.href });
    }, 100);
    if (document.requestStorageAccess) {
        document.requestStorageAccess().then(function() {
            sendMessage('storageAccess', { granted: true });
        }).catch(function() {
            sendMessage('storageAccess', { granted: false });
        });
    }
    var origOpen = window.open;
    if (typeof window.open === 'function') {
        window.open = function(url, target, features) {
            if (url && /^https?:/i.test(String(url))) {
                sendMessage('openInContainer', { url: absUrl(String(url)) });
            }
            return null;
        };
        window.open.toString = function() { return 'function open() { [native code] }'; };
    }
    document.addEventListener('click', function(ev) {
        var a = ev.target && ev.target.closest ? ev.target.closest('a[target]') : null;
        if (!a) return;
        var t = (a.getAttribute('target') || '').toLowerCase();
        if (t === '_blank' || t === '_top' || t === '_parent') {
            ev.preventDefault();
            ev.stopPropagation();
            var href = a.getAttribute('href');
            if (href && /^https?:/i.test(href)) {
                sendMessage('openInContainer', { url: absUrl(href) });
            }
        }
    }, true);
    document.addEventListener('submit', function(ev) {
        var f = ev.target;
        if (f instanceof HTMLFormElement) {
            var t = (f.getAttribute('target') || '').toLowerCase();
            if (t === '_blank' || t === '_top' || t === '_parent') {
                ev.preventDefault();
                var action = f.getAttribute('action');
                if (action && /^https?:/i.test(action)) {
                    sendMessage('openInContainer', { url: absUrl(action) });
                }
            }
        }
    }, true);
    document.addEventListener('contextmenu', function(ev) {
        var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
        if (!a) return;
        var href = a.getAttribute('href');
        if (!href || !/^https?:/i.test(href)) return;
        ev.preventDefault();
        ev.stopPropagation();
        sendMessage('showLinkMenu', { url: absUrl(href), x: ev.clientX, y: ev.clientY });
    }, true);
})();
`;
                    doc.head.appendChild(script);
                } catch (e) {}
            }

                const performCut = async () => {
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(urlInput.value);
                        } else {
                            urlInput.focus();

                        document.execCommand('cut'); }

                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(urlInput.value);
                        } else {
                            urlInput.focus();
                            urlInput.select();
                            document.execCommand('copy');
                        }
                    } catch (e) { urlInput.focus();
                        urlInput.select();
                        document.execCommand('copy'); }
                    menu.remove();
                };
                const performPaste = async () => {
                    try {
                        const text = await navigator.clipboard.readText();
                        const start = urlInput.selectionStart;
                        const end = urlInput.selectionEnd;
                        urlInput.value = urlInput.value.substring(0, start) + text + urlInput.value.substring(end);
                        urlInput.setSelectionRange(start + text.length, start + text.length);
                    } catch (e) { document.execCommand('paste'); }
                    menu.remove();
                };
                menu.querySelector('[data-action="cut"]').addEventListener('click', performCut);
                menu.querySelector('[data-action="copy"]').addEventListener('click', performCopy);
                menu.querySelector('[data-action="paste"]').addEventListener('click', performPaste);

            showBrowserContentMenu(x, y, frame, win) {

                const handleBack = () => { try { frame.contentWindow.history.back(); } catch(e) {}
                    menu.remove(); };
                const handleForward = () => { try { frame.contentWindow.history.forward(); } catch(e) {}
                    menu.remove(); };
                const handleReload = () => {

                            w.location.reload();

                    const src = frame.src;

                    frame.src = 'about:blank';

                };
                menu.querySelector('[data-action="back"]').addEventListener('click', handleBack);
                menu.querySelector('[data-action="forward"]').addEventListener('click', handleForward);
                menu.querySelector('[data-action="reload"]').addEventListener('click', handleReload);
                win.querySelector('.window-content').appendChild(menu);

                    document.removeEventListener('click', closeHandler); };

            // 终端（增强命令）
            createTerminalWindow(id) {
                const win = this.createBaseWindow(id, 'terminal', 'Raccoon Terminal');
                const content = win.querySelector('.window-content');
                content.style.background = '#0a2a1a';
                content.style.fontFamily = 'monospace';
                const terminalDiv = document.createElement('div');
                terminalDiv.className = 'terminal-body';
                terminalDiv.style.height = '100%';
                terminalDiv.innerHTML = `<div class="terminal-line"><span class="terminal-prompt">🦝></span><span class="terminal-output">Raccoon Terminal v2.0 - 增强版</span></div>
                                         <div class="terminal-line"><span class="terminal-prompt">🦝></span><span class="terminal-output">输入 help 查看所有命令</span></div>`;
                const inputLine = document.createElement('div');
                inputLine.className = 'terminal-line';
                inputLine.innerHTML = `<span class="terminal-prompt">🦝></span><input type="text" class="terminal-input" autofocus>`;
                terminalDiv.appendChild(inputLine);
                const inputField = inputLine.querySelector('input');
                let currentDir = '/home/raccoon';
                const fs = {
                    '/home/raccoon': { type: 'dir', children: ['Documents', 'Downloads', 'Pictures'] },
                    '/home/raccoon/Documents': { type: 'dir', children: ['readme.txt'] },
                    '/home/raccoon/Documents/readme.txt': { type: 'file', content: 'Welcome to Raccoon OS!' }
                };
                const history = [];
                let historyIndex = -1;
                const executeCommand = (cmd) => {
                    const outputLine = document.createElement('div');
                    outputLine.className = 'terminal-line';
                    outputLine.innerHTML = `<span class="terminal-prompt">🦝></span><span class="terminal-output">${cmd}</span>`;
                    terminalDiv.insertBefore(outputLine, inputLine);
                    const resultLine = document.createElement('div');
                    resultLine.className = 'terminal-line';
                    let output = '';
                    const args = cmd.trim().split(/\s+/);
                    const command = args[0].toLowerCase();
                    switch (command) {
                        case 'help':
                            output = '可用命令: help, clear, ls, cd, pwd, mkdir, touch, cat, rm, echo, date, hello, version, exit';
                            break;
                        case 'clear':
                            terminalDiv.innerHTML = '';
                            terminalDiv.appendChild(inputLine);
                            inputField.value = '';
                            inputField.focus();
                            return;
                        case 'ls':
                            const parts = currentDir.split('/');
                            const current = fs[currentDir];
                            if (current && current.type === 'dir') output = current.children.join('  ');
                            else output = '目录不存在';
                            break;
                        case 'cd':
                            if (args[1]) {
                                let newPath = args[1];
                                if (newPath === '..') {
                                    const newDir = currentDir.substring(0, currentDir.lastIndexOf('/'));
                                    if (newDir) currentDir = newDir;
                                } else if (newPath === '/') {
                                    currentDir = '/home/raccoon';
                                } else {
                                    const target = `${currentDir}/${newPath}`;
                                    if (fs[target] && fs[target].type === 'dir') currentDir = target;
                                    else output = `cd: ${newPath}: 不是目录`;
                                }
                            }
                            break;
                        case 'pwd':
                            output = currentDir;
                            break;
                        case 'mkdir':
                            if (args[1]) {
                                const newDir = `${currentDir}/${args[1]}`;
                                if (!fs[newDir]) {
                                    fs[newDir] = { type: 'dir', children: [] };
                                    fs[currentDir].children.push(args[1]);
                                    output = `目录 ${args[1]} 已创建`;
                                } else output = `目录已存在`;
                            }
                            break;
                        case 'touch':
                            if (args[1]) {
                                const newFile = `${currentDir}/${args[1]}`;
                                if (!fs[newFile]) {
                                    fs[newFile] = { type: 'file', content: '' };
                                    fs[currentDir].children.push(args[1]);
                                    output = `文件 ${args[1]} 已创建`;
                                } else output = `文件已存在`;
                            }
                            break;
                        case 'cat':
                            if (args[1]) {
                                const filePath = `${currentDir}/${args[1]}`;
                                if (fs[filePath] && fs[filePath].type === 'file') output = fs[filePath].content ||
                                    '(空文件)';
                                else output = `cat: ${args[1]}: 文件不存在`;
                            }
                            break;
                        case 'rm':
                            if (args[1]) {
                                const target = `${currentDir}/${args[1]}`;
                                if (fs[target]) {
                                    delete fs[target];
                                    fs[currentDir].children = fs[currentDir].children.filter(c => c !== args[1]);
                                    output = `已删除 ${args[1]}`;
                                } else output = `rm: ${args[1]}: 不存在`;
                            }
                            break;
                        case 'echo':
                            output = args.slice(1).join(' ');
                            break;
                        case 'date':
                            output = new Date().toString();
                            break;
                        case 'hello':
                            output = 'Hello, Raccoon User! Welcome to Raccoon OS.';
                            break;
                        case 'version':
                            output = 'Raccoon OS Terminal v2.0 (2026.06)';
                            break;
                        case 'exit':
                            this.closeWindow(this.windows.find(w => w.id === id));
                            return;
                        default:
                            output = `未知命令: ${cmd}. 输入 help 查看帮助。`;
                    }
                    resultLine.innerHTML = `<span class="terminal-prompt"></span><span class="terminal-output">${output}</span>`;
                    terminalDiv.insertBefore(resultLine, inputLine);
                    terminalDiv.scrollTop = terminalDiv.scrollHeight;
                    inputField.value = '';
                    inputField.focus();
                    history.push(cmd);
                    historyIndex = history.length;
                };
                inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') executeCommand(inputField
                    .value); });
                inputField.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowUp') {
                        if (historyIndex > 0) { historyIndex--;
                            inputField.value = history[historyIndex]; }
                        e.preventDefault();
                    } else if (e.key === 'ArrowDown') {
                        if (historyIndex < history.length - 1) { historyIndex++;
                            inputField.value = history[historyIndex]; } else { historyIndex = history.length;
                            inputField.value = ''; }
                        e.preventDefault();
                    }
                });
                content.appendChild(terminalDiv);
                return win;
            }

                    if (e.metaKey) {
