                                this.openApp('filemanager');
                                this.metaUsed = true;
                                this.showToast('打开文件管理器', 'folder');
                                return;
                            case 'r':
                                e.preventDefault();
                                this.runProgram();
                                this.metaUsed = true;
                                this.showToast('运行', 'play_arrow');
                                return;
                            case 'd':
                                e.preventDefault();
                                this.minimizeAllWindows();
                                this.metaUsed = true;
                                this.showToast('显示桌面', 'desktop_windows');
                                return;
                            case 'l':
                                e.preventDefault();
                                this.lockScreen();
                                this.metaUsed = true;
                                return;
                            case 'a':
                                e.preventDefault();
                                this.toggleNotifCenter();
                                this.metaUsed = true;
                                return;
                        }
                    }

                    if (e.altKey && e.key === 'F4') {
                        e.preventDefault();
                        if (this.activeWindow) {
                            this.showToast('关闭窗口', 'close');
                            this.closeActiveWindow();
                        }
                        return;
                    }

                    if (e.altKey && e.key === 'Tab') {
                        e.preventDefault();
                        this.cycleWindow();
                        return;
                    }

                    if (e.ctrlKey && e.shiftKey && (e.key === 'Escape' || e.code === 'Escape')) {
                        e.preventDefault();
                        this.openTaskMgr();
                        this.showToast('任务管理器', 'list');
                        return;
                    }

                    if (e.key === 'F11') {
                        e.preventDefault();
                        this.toggleFullscreen();
                        this.showToast('切换全屏', 'fullscreen');
                        return;
                    }

                    if (e.ctrlKey && !e.altKey && !e.shiftKey) {
                        const prevented = ['w', 't', 'n', 'tab'];
                        if (prevented.includes(e.key.toLowerCase())) {
                            e.preventDefault();
                            return;
                        }
                    }

                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        if (isInput) return;
                        if (this.selectedIcons.length > 0) {
                            const names = this.selectedIcons.map(a => {
                                const icon = this.desktopIcons.find(d => d.app === a);
                                return icon ? icon.name : a;
                            }).join('、');
                            this.showSystemDialog('删除', `确定要删除 "${names}" 吗？`, () => {
                                this.selectedIcons.forEach(a => this.deleteDesktopIcon(a));
                                this.selectedIcons = [];
                            });
                        }
                        return;
                    }
                    if (e.key === 'F5') {
                        e.preventDefault();
                        this.refreshDesktop();
                        return;
                    }
                    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                        if (isInput) return;
                        if (this.desktopIcons.length === 0) return;
                        if (this.activeWindow) return;
                        e.preventDefault();
                        this.selectAdjacentIcon(e.key);
                        return;
                    }
                    if (e.key === 'Enter') {
                        if (isInput) return;
                        if (this.selectedIcons.length === 1) {
                            e.preventDefault();
                            const app = this.selectedIcons[0];
                            this.deselectAllIcons();
                            this.openApp(app);
                        }
                        return;
                    }
                    if (e.key === 'Escape') {
                        if (isInput) return;
                        if (this.selectedIcons.length > 0) {
                            this.deselectAllIcons();
                            return;
                        }
                        return;
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                        if (isInput) return;
                        e.preventDefault();
                        document.querySelectorAll('.desktop-icon').forEach(i => i.classList.add('active'));
                        this.selectedIcons = this.desktopIcons.map(d => d.app);
                        this.showToast(`已选择 ${this.desktopIcons.length} 个图标`, 'select_all');
                        return;
                    }
                });

                document.addEventListener('keyup', (e) => {
                    if (e.key === 'Meta') {
                        this.metaHeld = false;
                        if (!this.metaUsed) {
                            this.toggleStartMenu();
                        }
                    }
                });
            }

            showDesktopIconContextMenu(e, iconEl) {
                e.preventDefault();
                e.stopPropagation();
                const app = iconEl.getAttribute('data-app');
                const iconData = this.desktopIcons.find(d => d.app === app);
                this.removeAllContextMenus();
                const menu = document.createElement('div');
                menu.className = 'context-menu';
                let top = e.clientY;
                const menuHeight = 120;
                if (top + menuHeight > window.innerHeight) top = e.clientY - menuHeight;
                menu.style.left = e.clientX + 'px';
                menu.style.top = top + 'px';
                menu.innerHTML = `
                    <div class="context-menu-item" data-action="open">打开</div>
                    <div class="context-menu-item" data-action="rename">重命名</div>
                    <div class="context-menu-divider"></div>
                    <div class="context-menu-item" data-action="delete">删除</div>
                `;
                menu.querySelector('[data-action="open"]').addEventListener('click', () => {
                    if (app) this.openApp(app);
                    menu.remove();
                });
                menu.querySelector('[data-action="rename"]').addEventListener('click', () => {
                    this.showSystemDialog('重命名', '输入新名称:', (newName) => {
                        if (newName && iconData) {
                            iconData.name = newName;
                            this.renderDesktop();
                        }
                    }, true);
                    if (iconData) {
                        setTimeout(() => {
                            const input = document.querySelector('#dialog-input');
                            if (input) input.value = iconData.name;
                        }, 50);
                    }
                    menu.remove();
                });
                menu.querySelector('[data-action="delete"]').addEventListener('click', () => {
                    if (app) {
                        this.showSystemDialog('删除', `确定要删除 "${iconData ? iconData.name : ''}" 吗？`, () => {
                            this.deleteDesktopIcon(app);
                        });
                    }
                    menu.remove();
                });
                document.body.appendChild(menu);
                const close = (e) => { if (!menu.contains(e.target)) menu.remove();
                    document.removeEventListener('click', close); };
                setTimeout(() => document.addEventListener('click', close), 0);
            }

            populateStartMenu() {
                const container = document.getElementById('start-apps-list');
                const apps = [
                    { name: '文件管理器', icon: 'folder', app: 'filemanager' },
                    { name: '浏览器', icon: 'public', app: 'browser' },

                    { name: '视频查看器', icon: 'movie', app: 'videoviewer' },
                    { name: '音乐播放器', icon: 'music_note', app: 'musicplayer' },
                    { name: '计算器', icon: 'calculate', app: 'calculator' },
                    { name: '截图工具', icon: 'screenshot', app: 'snippingtool' },
                    { name: '记事本', icon: 'edit_note', app: 'notepad' },
                    { name: '终端', icon: 'terminal', app: 'terminal' },

            refreshDesktop() {
                const icons = document.querySelectorAll('.desktop-icon');
                icons.forEach(ic => { ic.style.opacity = '0';
                    setTimeout(() => ic.style.opacity = '1', 150); });
            }

            toggleStartMenu() {
                const startMenu = document.getElementById('start-menu');
                const isVisible = startMenu.style.display === 'block';
                startMenu.style.display = isVisible ? 'none' : 'block';
                if (!isVisible) {
                    this.populateStartMenu();
                    startMenu.classList.add('start-menu-open');
                    setTimeout(() => startMenu.classList.remove('start-menu-open'), 250);
                }
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen({ keyboardLock: 'browser' }).catch(() => {});
                        setTimeout(() => this.showFullscreenHint(), 500);
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen().catch(() => {});

            showFullscreenHint() {
                if (!document.fullscreenElement) return;
                const el = document.getElementById('fullscreen-hint');

                hint.id = 'fullscreen-hint';

            minimizeAllWindows() {
                this.windows.forEach(win => {
                    if (!win.minimized) {
                        win.element.style.display = 'none';
                        win.minimized = true;
                    }
                });
                this.updateTaskbarActive();
            }

            closeActiveWindow() {
                if (this.activeWindow) {
                    this.closeWindow(this.activeWindow);
                }
            }

            cycleWindow() {
                const visible = this.windows.filter(w => !w.minimized);
                if (visible.length === 0) return;
                const idx = this.activeWindow ? visible.indexOf(this.activeWindow) : -1;
                const next = visible[(idx + 1) % visible.length];
                this.activateWindow(next);
            }

            showToast(message, icon = 'info') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<span class="material-symbols-outlined text-sm">${icon}</span><span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 2800);
                if (this.settings && this.settings.systemNotifications) {
                    this.showNativeNotification('RaccoonOS', message);
                }
                this.notifications.push({ message, icon, time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) });
                this.notifBadge++;
                this.updateNotifBadge();
                if (document.getElementById('notif-center')) this.updateNotifList();
            }

            updateNotifBadge() {
                const btn = document.getElementById('notif-btn');
                const panel = document.getElementById('notif-center');
                if (!btn) return;
                const isOpen = panel ? panel.classList.contains('open') : false;
                let badge = btn.querySelector('.notif-badge');
                if (this.notifBadge > 0 && !isOpen) {
                    if (!badge) { badge = document.createElement('span'); badge.className = 'notif-badge'; btn.appendChild(badge); }
                    badge.textContent = this.notifBadge;
                } else {
                    if (badge) badge.remove();
                }
            }

            updateNotifList() {
                const list = document.getElementById('notif-list');
                if (!list) return;
                if (this.notifications.length === 0) {
                    list.innerHTML = '<div style="text-align:center;color:#888;padding:24px;font-size:13px;">暂无通知</div>';
                    return;
                }
                const items = this.notifications.slice(-30).reverse().map(n =>
                    `<div class="notif-item"><span class="material-symbols-outlined">${n.icon || 'info'}</span><div class="notif-text">${n.message}</div><span class="notif-time">${n.time}</span></div>`
                ).join('');
                list.innerHTML = items;
            }

            toggleNotifCenter() {
                const panel = document.getElementById('notif-center');
                if (!panel) return;
                const isOpen = panel.classList.contains('open');
                if (isOpen) {
                    panel.classList.remove('open');
                } else {
                    panel.classList.add('open');
                    this.updateNotifList();
                    this.notifBadge = 0;
                    this.updateNotifBadge();
                }
            }

                        <div class="help-row"><span>显示此帮助</span><div class="help-keys"><span class="help-key">F1</span></div></div>
                        <div style="margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.1); font-size:11px; color:#888; line-height:1.6;">
                            提示: 部分系统级快捷键 (Win/Alt+Tab) 可能仍会被操作系统优先拦截。如无效，请在桌面区域点击使其获得焦点。
                        </div>
                    </div>

                const close = () => overlay.remove();
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) close();

            removeGlobalLinkOverlays() {
                try {
                    const vw = window.innerWidth, vh = window.innerHeight;
                    document.querySelectorAll('a').forEach(a => {
                        const r = a.getBoundingClientRect();
                        if (r.width >= vw * 0.85 && r.height >= vh * 0.85) {
                            const style = getComputedStyle(a);
                            const bgAlpha = style.backgroundColor === 'transparent' || style.opacity === '0';
                            const empty = !a.textContent.trim() && a.querySelectorAll('img,svg,canvas,video').length === 0;
                            if (bgAlpha && empty) {
                                a.remove();
                            }
                        }
                    });
                } catch (e) {}
            }

                const overlay = document.createElement('div');
                overlay.className = 'entry-overlay';
                overlay.style.background =
                    `linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.5) 100%), linear-gradient(140deg, ${this.settings.theme} 0%, #000 170%)`;

                document.body.appendChild(overlay);
                this.entryConfirmEl = overlay;

                const enter = () => {

                        if (document.documentElement.requestFullscreen) {

                    } catch (err) {

                    }
                    setTimeout(() => {
                        if (fsOk) { try { this.showFullscreenHint(); } catch (e2) {} }

                    try {

                        this.entryConfirmEl = null;

                };
                overlay.querySelector('#entry-ok').addEventListener('click', enter);
                overlay.querySelector('#entry-cancel').addEventListener('click', () => {
                    overlay.innerHTML = `

                    `;
                    overlay.querySelector('#entry-enter-again').addEventListener('click', enter);
                });
                overlay.querySelector('#entry-cancel').addEventListener('keydown', (e) => {

            showLoginScreen(locked = false) {
                if (this.lockScreenEl) return;
                const bg = this.settings.theme;
                const screen = document.createElement('div');
                screen.className = 'login-screen';
                screen.style.background =
                    `linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.12) 45%, rgba(0,0,0,0.5) 100%), linear-gradient(140deg, ${bg} 0%, #000 170%)`;
                screen.innerHTML = `
                    <div class="login-clock">
                        <div class="login-time" id="login-time"></div>
                        <div class="login-date" id="login-date"></div>
                    </div>
                    <div class="login-user-card">
                        <div class="login-avatar">🦝</div>
                        <div class="login-name">Raccoon</div>
                        <div class="login-form">
                            <input type="password" class="login-password" id="login-password" placeholder="密码（可留空）" autocomplete="off">
                            <button class="login-go" id="login-go"><span class="material-symbols-outlined" style="font-size:20px">arrow_forward</span></button>
                        </div>
                    </div>
                `;
                document.body.appendChild(screen);
                this.lockScreenEl = screen;
                this._isBoot = !locked;

                const updateClock = () => {
                    const now = new Date();
                    const t = document.getElementById('login-time');
                    const d = document.getElementById('login-date');
                    if (t) t.innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
                    if (d) d.innerText = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
                };
                updateClock();
                this._loginClockTimer = setInterval(updateClock, 1000);

                screen.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('.login-form')) {
                        e.stopPropagation();
                        return;
                    }
                    e.preventDefault();
                    if (screen.contains(document.activeElement)) document.activeElement.blur();
                });
                screen.addEventListener('keydown', (e) => {
                    if (e.target !== screen.querySelector('#login-password') && e.key === 'Enter') {
                        this.unlockLogin();
                    }
                });
                screen.querySelector('#login-go').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.unlockLogin();
                });
                screen.querySelector('#login-password').addEventListener('keydown', (e) => {
                    e.stopPropagation();
                    if (e.key === 'Enter') this.unlockLogin();
                });
                if (locked) {
                    if (this.minimizeAllWindows) this.minimizeAllWindows();
                    this.showToast('屏幕已锁定', 'lock');
                }
            }

            lockScreen() {
                this.releaseWakeLock();
                const panel = document.getElementById('notif-center');
                if (panel) panel.classList.remove('open');
                this.showLoginScreen(true);
            }

            unlockLogin() {
                const screen = this.lockScreenEl;
                if (!screen) return;
                clearInterval(this._loginClockTimer);
                this.lockScreenEl = null;
                const isBoot = this._isBoot;
                screen.remove();
                this.requestWakeLock();
                this.setupIdleLock();
                if (isBoot) {
                    const savedUrl = localStorage.getItem('raccoonos_browser_url');
                    if (savedUrl && this.settings.autoRestoreUrl) {
                        setTimeout(() => {
                            this.openApp('browser');
                            setTimeout(() => {
                                const browserWin = this.windows.find(w => w.appName === 'browser');
                                if (browserWin) {
                                    const urlInput = browserWin.element.querySelector('input[placeholder*="网址"]');
                                    if (urlInput) {
                                        urlInput.value = savedUrl;
                                        urlInput.dispatchEvent(new Event('keydown', { key: 'Enter', bubbles: true }));
                                    }
                                }
                            }, 300);
                        }, 200);
                    }
                } else {
                    this.showToast('已解锁', 'lock_open');
                }
            }

            // ---------- Edge API 接入 ----------
            async requestWakeLock() {
                if (!this.wakeLockSupported) return;
                try {
                    this.wakeLock = await navigator.wakeLock.request('screen');
                    this.wakeLock.addEventListener('release', () => { this.wakeLock = null; });
                } catch (e) {}
            }

            releaseWakeLock() {
                if (this.wakeLock && typeof this.wakeLock.release === 'function') {
                    this.wakeLock.release().catch(() => {});
                    this.wakeLock = null;
                }
            }

            initWakeLockVisibility() {
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible' && this.lockScreenEl === null) {
                        this.requestWakeLock();
                    }
                });
                const mediaPlay = () => {
                    const playing = [...document.querySelectorAll('audio, video')].some(m => !m.paused && !m.ended);
                    if (playing) {
                        this.requestWakeLock();
                    } else if (!this.lockScreenEl) {
                        this.requestWakeLock();
                    }
                };
                document.addEventListener('play', mediaPlay, true);
                document.addEventListener('pause', mediaPlay, true);
            }

            async setupIdleLock() {
                if (!('IdleDetector' in window)) return;
                try {
                    if (await IdleDetector.requestPermission() !== 'granted') return;
                    if (this._idleController) this._idleController.abort();
                    this._idleController = new AbortController();
                    const detector = new IdleDetector();
                    await detector.start({ threshold: 120000, signal: this._idleController.signal });
                    detector.addEventListener('change', () => {
                        if (detector.userState === 'idle' && !this.lockScreenEl) {
                            const hasMedia = [...document.querySelectorAll('audio, video')].some(m => !m.paused && !m.ended);
                            if (!hasMedia && !document.hidden) this.lockScreen();
                        }
                    });
                } catch (e) {}
            }

            initSystemNotifications() {
                if (!('Notification' in window)) return;
                if (Notification.permission === 'granted') return;
                if (Notification.permission === 'denied') return;
                try {
                    Notification.requestPermission().catch(() => {});
                } catch (e) {}
            }

            showNativeNotification(title, body, icon) {
                if (!this.settings.systemNotifications || !('Notification' in window)) return;
                if (Notification.permission !== 'granted') return;
                try {
                    new Notification(title, { body, icon: icon || undefined, tag: 'raccoonos' });
                } catch (e) {}
            }

            updateMediaSession(title, artist) {
                if (!('mediaSession' in navigator)) return;
                try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: title || 'RaccoonOS 浏览器',
                        artist: artist || 'RaccoonOS',
                        album: '网页媒体'
                    });
                } catch (e) {}
            }

            async openLocalFolder(onReady) {
                if (!this.fileSystemAccessSupported) {
                    this.showSystemDialog('提示', '当前浏览器不支持 File System Access API，请在 Edge/Chrome 中使用。');
                    return;
                }
                try {
                    const dirHandle = await window.showDirectoryPicker();
                    let entries = [];
                    for await (const [name, handle] of dirHandle.entries()) {
                        entries.push({ name, type: handle.kind === 'directory' ? 'dir' : 'file' });
                    }
                    if (onReady) onReady(entries);
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                    this.showSystemDialog('提示', '无法读取本地文件夹：' + (e && e.message ? e.message : '未知错误'));
                }
            }

            async openRealFolder(onReady) {
                if (!this.fileSystemAccessSupported) {
                    this.showSystemDialog('提示', '当前浏览器不支持 File System Access API，请在 Edge/Chrome 中使用。');
                    return;
                }
                try {
                    const dirHandle = await window.showDirectoryPicker();
                    if (onReady) onReady(dirHandle);
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                    this.showSystemDialog('提示', '无法读取本地文件夹：' + (e && e.message ? e.message : '未知错误'));
                }
            }

            async shareFile(file) {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: file.name,
                            text: `RaccoonOS 文件: ${file.name}` + (file.content ? `\n${file.content}` : '')
                        });
                        return true;
                    } catch (e) {
                        if (e && e.name === 'AbortError') return false;
                    }
                }
                this.showSystemDialog('分享', `分享文件 "${file.name}"${file.content ? '，内容：' + file.content : ''}。`);
                return false;
            }

            refreshBatteryInfo(el) {
                if (!('getBattery' in navigator)) {
                    el.textContent = 'API 不可用';
                    return;
                }
                navigator.getBattery().then(battery => {
                    const update = () => {
                        const pct = Math.round(battery.level * 100);
                        const charging = battery.charging ? '充电中' : '使用电池';
                        const hours = battery.dischargingTime === Infinity ? '未知' :
                            Math.floor(battery.dischargingTime / 3600) + ' 小时 ' + Math.floor((battery.dischargingTime % 3600) / 60) + ' 分';
                        el.textContent = `${pct}%（${charging}，剩余 ${hours}）`;
                    };
                    update();
                    battery.addEventListener('levelchange', update);
                    battery.addEventListener('chargingchange', update);
                    battery.addEventListener('chargingtimechange', update);
                    battery.addEventListener('dischargingtimechange', update);
                }).catch(() => { el.textContent = '读取失败'; });
            }

            startClock() {
                const update = () => {
                    const now = new Date();
                    const timeEl = document.getElementById('clock-time');
                    const dateEl = document.getElementById('clock-date');
                    if (!timeEl || !dateEl) return;
                    if (this.settings.showSeconds) {
                        timeEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    } else {
                        timeEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
                    }
                    dateEl.textContent = now.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
                };
                update();
                setInterval(update, 1000);
            }

            runProgram() {
                try {
                    const link = document.createElement('a');
                    link.href = 'raccoonos://run';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (e) {
                    this.showSystemDialog('提示', '协议未注册。请双击运行 run-protocol.reg 后再试。');
                }
            }

            getAppLabel(appName) {
                const map = { filemanager: '文件管理器', browser: '浏览器', terminal: '终端', settings: '设置', run: '运行', taskmgr: '任务管理器', imagerviewer: '图片查看器', videoviewer: '视频查看器', musicplayer: '音乐播放器', textviewer: '文本查看器', calculator: '计算器', snippingtool: '截图工具', notepad: '记事本' };
                return map[appName] || appName;
            }

            createTaskManagerWindow(id) {
                const win = this.createBaseWindow(id, 'list', '任务管理器');
                const content = win.querySelector('.window-content');
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.innerHTML = `
                    <div style="display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.1);align-items:center;flex-wrap:wrap;">
                        <button class="tm-btn" data-action="refresh"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">refresh</span> 刷新列表</button>
                        <button class="tm-btn" data-action="topmost"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">vertical_align_top</span> 窗口置顶</button>
                        <button class="tm-btn danger" data-action="kill"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">close</span> 结束进程</button>
                        <span style="margin-left:auto;font-size:11px;color:#888;" id="tm-stats"></span>
                    </div>
                    <div style="flex:1;overflow:auto;">
                        <table style="width:100%;border-collapse:collapse;font-size:13px;">
                            <thead>
                                <tr style="color:#aaa;text-align:left;">
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">进程名</th>
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">PID</th>
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">状态</th>
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">内存</th>
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">置顶</th>
                                </tr>
                            </thead>
                            <tbody id="tm-body"></tbody>
                        </table>
                    </div>
                `;
                this._procMem = this._procMem || {};
                let selected = null;

                const render = () => {
                    const body = content.querySelector('#tm-body');
                    const rows = [];
                    rows.push({ name: '系统', pid: 'System', status: '运行中', mem: '—', win: null, system: true });
                    rows.push({ name: '桌面外壳 (explorer)', pid: 1, status: '运行中', mem: '45 MB', win: null, system: true });
                    this.windows.forEach(w => {
                        if (!this._procMem[w.id]) {
                            this._procMem[w.id] = (Math.abs((w.id * 2654435761) % 90) + 20) + ' MB';
                        }
                        rows.push({
                            name: this.getAppLabel(w.appName),
                            pid: 1000 + w.id,
                            status: w.minimized ? '最小化' : '运行中',
                            mem: this._procMem[w.id],
                            win: w,
                            system: false
                        });
                    });
                    body.innerHTML = rows.map((r, i) => `
                        <tr data-idx="${i}" style="cursor:pointer;${selected && selected.pid === r.pid ? 'background:rgba(0,120,212,0.25);' : ''}">
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.name}${r.system ? ' <span style="color:#888;font-size:11px;">(系统)</span>' : ''}</td>
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.pid}</td>
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.status}</td>
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.mem}</td>
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.win && r.win.topmost ? '<span style="color:#3fb950;">置顶</span>' : ''}</td>
                        </tr>
                    `).join('');
                    body.querySelectorAll('tr').forEach(tr => {
                        tr.addEventListener('click', () => {
                            const r = rows[parseInt(tr.dataset.idx)];
                            selected = r;
                            render();
                        });
                    });
                    content.querySelector('#tm-stats').textContent =
                        `进程数: ${rows.length - 1} | 窗口: ${this.windows.length}`;
                };

                content.querySelector('[data-action="refresh"]').addEventListener('click', render);
                content.querySelector('[data-action="topmost"]').addEventListener('click', () => {
                    if (!selected || selected.system || !selected.win) {
                        this.showToast('请先选择一个应用进程', 'info');
                        return;
                    }
                    this.toggleTopmost(selected.win);
                    this.activateWindow(selected.win);
                    this.showToast(`${selected.win.topmost ? '已置顶' : '取消置顶'}: ${selected.name}`, 'vertical_align_top');
                    render();
                });
                content.querySelector('[data-action="kill"]').addEventListener('click', () => {
                    if (!selected || selected.system || !selected.win) {
                        this.showToast('系统进程不可结束，请选择一个应用进程', 'lock');
                        return;
                    }
                    const target = selected.win;
                    this.closeWindow(target);
                    this.showToast(`已结束进程: ${selected.name} (PID ${selected.pid})`, 'close');
                    selected = null;
                    setTimeout(render, 200);
                });
                render();
                return win;
            }

            openTaskMgr() {
                const existing = this.windows.find(w => w.appName === 'taskmgr' && !w.minimized);
                if (existing) {
                    this.activateWindow(existing);
                    return;
                }
                const id = this.nextWindowId++;
                const winElement = this.createTaskManagerWindow(id);
                document.getElementById('desktop-area').appendChild(winElement);
                const winObj = { id, element: winElement, appName: 'taskmgr', minimized: false, taskbarButton: null,
                    savedPosition: { left: 150, top: 90, width: 640, height: 420 } };
                this.windows.push(winObj);
                this.addToTaskbar(winObj);
                this.activateWindow(winObj);
                winElement.style.width = '640px';
                winElement.style.height = '420px';
                winElement.style.left = '150px';
                winElement.style.top = '90px';
                winObj.savedPosition.left = 150;
                winObj.savedPosition.top = 90;
            }

            shutdown() {
                const shutdownTime = 3000;
                const shutdownScreen = document.createElement('div');
                shutdownScreen.className = 'fixed inset-0 bg-black z-[100000] flex flex-col items-center justify-center';
                shutdownScreen.innerHTML =
                    `<div class="text-2xl mb-6 text-white">正在关闭 RaccoonOS...</div><div class="w-64 h-1 bg-gray-700 rounded overflow-hidden"><div class="h-full bg-white w-0 transition-all" id="shutdown-bar" style="transition-duration: ${shutdownTime}ms"></div></div>`;
                document.body.appendChild(shutdownScreen);
                const bar = shutdownScreen.querySelector('#shutdown-bar');
                setTimeout(() => bar.style.width = '100%', 50);
                setTimeout(() => { window.close();
                    location.href = 'about:blank'; }, shutdownTime + 100);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.raccoon = new RaccoonOS();
        });
        window.addEventListener('beforeunload', () => {
            const browserWin = window.raccoon && window.raccoon.windows ? window.raccoon.windows.find(w => w.appName === 'browser' && !w.minimized) : null;
            if (browserWin) {
                const input = browserWin.element.querySelector('input[placeholder*="网址"]');
                if (input && input.value) {
                    localStorage.setItem('raccoonos_browser_url', input.value);
                }
            }
        });
    </script>
</body>
</html>
