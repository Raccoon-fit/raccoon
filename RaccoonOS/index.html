                };
                updateStorageInfo();
                const exportBtn = content.querySelector('#export-settings');
                if (exportBtn) {
                    exportBtn.addEventListener('click', () => {
                        const data = {
                            settings: this.settings,
                            history: this.history,
                            bookmarks: this.bookmarks,
                            fileSystem: this.fileSystem
                        };
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'raccoonos-backup.json';
                        a.click();
                        URL.revokeObjectURL(url);
                    });
                }
                const importBtn = content.querySelector('#import-settings');
                const importFile = content.querySelector('#import-file');
                if (importBtn && importFile) {
                    importBtn.addEventListener('click', () => importFile.click());
                    importFile.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                try {
                                    const data = JSON.parse(event.target.result);
                                    if (data.settings) {
                                        this.settings = { ...this.settings, ...data.settings };
                                        this.saveSettings();
                                    }
                                    if (data.history) {
                                        this.history = data.history;
                                        this.saveHistory();
                                    }
                                    if (data.bookmarks) {
                                        this.bookmarks = data.bookmarks;
                                        this.saveBookmarks();
                                    }
                                    if (data.fileSystem) {
                                        this.fileSystem = data.fileSystem;
                                        this.saveFileSystem();
                                    }
                                    this.showSystemDialog('导入成功', '配置已成功导入，部分设置需要刷新页面生效');
                                    updateStorageInfo();
                                } catch (err) {
                                    this.showSystemDialog('导入失败', '文件格式不正确');
                                }
                            };
                            reader.readAsText(file);
                        }
                    });
                }
                const clearStorageBtn = content.querySelector('#clear-storage');
                if (clearStorageBtn) {
                    clearStorageBtn.addEventListener('click', () => {
                        this.showSystemDialog('警告', '确定要清除所有数据吗？此操作不可撤销。', () => {
                            localStorage.clear();
                            location.reload();
                        });
                    });
                }
                return win;
            }

            // 系统弹窗（支持输入框）
            showSystemDialog(title, message, onConfirm, withInput = false) {
                const existing = document.querySelector('.system-dialog');
                if (existing) existing.remove();
                const dialog = document.createElement('div');
                dialog.className = 'system-dialog';
                let inputHtml = '';
                if (withInput) {
                    inputHtml = `<input type="text" id="dialog-input" class="system-dialog-input" placeholder="请输入...">`;
                }
                dialog.innerHTML = `
                    <div class="system-dialog-header">
                        <span class="system-dialog-title">${title}</span>
                        <div class="system-dialog-close"><span class="material-symbols-outlined text-sm">close</span></div>
                    </div>
                    <div class="system-dialog-content">
                        ${message}
                        ${inputHtml}
                    </div>
                    <div class="system-dialog-buttons">
                        <button class="system-dialog-button" id="dialog-cancel">取消</button>
                        <button class="system-dialog-button primary" id="dialog-ok">确定</button>
                    </div>
                `;
                document.body.appendChild(dialog);
                const closeBtn = dialog.querySelector('.system-dialog-close');
                const cancelBtn = dialog.querySelector('#dialog-cancel');
                const okBtn = dialog.querySelector('#dialog-ok');
                const input = dialog.querySelector('#dialog-input');
                const remove = () => dialog.remove();
                closeBtn.addEventListener('click', remove);
                cancelBtn.addEventListener('click', remove);
                okBtn.addEventListener('click', () => {
                    const value = input ? input.value : null;
                    if (onConfirm) onConfirm(value);
                    remove();
                });
                if (input) input.focus();
            }

            removeAllContextMenus() {
                document.querySelectorAll('.context-menu').forEach(m => m.remove());
            }

            initEventListeners() {
                const startBtn = document.getElementById('start-btn');
                const startMenu = document.getElementById('start-menu');
                startBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isVisible = startMenu.style.display === 'block';
                    startMenu.style.display = isVisible ? 'none' : 'block';
                    if (!isVisible) this.populateStartMenu();
                });
                document.addEventListener('click', (e) => {
                    if (!startMenu.contains(e.target) && e.target !== startBtn) startMenu.style.display = 'none';
                });
                document.getElementById('shutdown-btn-start').addEventListener('click', () => this.shutdown());

                const volBtn = document.getElementById('volume-btn');
                const volPopup = document.getElementById('volume-popup');
                volBtn.addEventListener('click', (e) => { e.stopPropagation();
                    volPopup.classList.toggle('hidden'); });
                const volSlider = document.getElementById('volume-slider');
                volSlider.value = this.settings.volume;
                volSlider.addEventListener('input', (e) => {
                    const val = e.target.value;
                    this.settings.volume = parseInt(val);
                    this.saveSettings();
                    document.getElementById('volume-value').innerText = val;
                    const settingsVolDisplay = document.getElementById('settings-volume-display');
                    if (settingsVolDisplay) settingsVolDisplay.textContent = val + '%';
                    const settingsVolSlider = document.getElementById('settings-volume-slider');
                    if (settingsVolSlider) settingsVolSlider.value = val;
                    document.querySelectorAll('audio, video').forEach(el => el.volume = val / 100);
                });
                document.addEventListener('click', () => volPopup.classList.add('hidden'));

                document.getElementById('taskmgr-btn').addEventListener('click', () => {
                    this.openTaskMgr();
                });

                document.getElementById('desktop-area').addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    const windows = document.querySelectorAll('.window');
                    for (const win of windows) {
                        const rect = win.getBoundingClientRect();
                        if (e.clientX >= rect.left && e.clientX <= rect.right &&
                            e.clientY >= rect.top && e.clientY <= rect.bottom) {
                            return;
                        }
                    }
                    if (e.target.closest('.desktop-icon')) return;
                    this.removeAllContextMenus();
                    const menu = document.createElement('div');
                    menu.className = 'context-menu';
                    menu.style.position = 'absolute';
                    menu.style.zIndex = '500';
                    let top = e.clientY;
                    const menuHeight = 180;
                    if (top + menuHeight > window.innerHeight) top = e.clientY - menuHeight;
                    menu.style.left = e.clientX + 'px';
                    menu.style.top = top + 'px';
                    menu.innerHTML = `
                        <div class="context-menu-item" data-action="view">查看</div>
                        <div class="context-menu-item" data-action="sortby">排序方式</div>
                        <div class="context-menu-divider"></div>
                        <div class="context-menu-item" data-action="new">新建</div>
                        <div class="context-menu-divider"></div>
                        <div class="context-menu-item" data-action="refresh">刷新</div>
                        <div class="context-menu-divider"></div>
                        <div class="context-menu-item" data-action="settings">显示设置</div>
                    `;
                    menu.querySelector('[data-action="refresh"]').addEventListener('click', () => {
                        this.refreshDesktop();
                        menu.remove();
                    });
                    menu.querySelector('[data-action="settings"]').addEventListener('click', () => {
                        this.openApp('settings');
                        menu.remove();
                    });
                    menu.querySelector('[data-action="new"]').addEventListener('click', () => {
                        this.showSystemDialog('新建', '选择新建类型:', (type) => {});
                        menu.remove();
                    });
                    menu.querySelector('[data-action="view"]').addEventListener('click', () => menu.remove());
                    menu.querySelector('[data-action="sortby"]').addEventListener('click', () => menu.remove());
                    document.body.appendChild(menu);
                    const close = (e) => { if (!menu.contains(e.target)) menu.remove();
                        document.removeEventListener('click', close); };
                    setTimeout(() => document.addEventListener('click', close), 0);
                });

                document.querySelectorAll('.desktop-icon').forEach(icon => {
                    icon.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.removeAllContextMenus();
                        const menu = document.createElement('div');
                        menu.className = 'context-menu';
                        let top = e.clientY;
                        const menuHeight = 80;
                        if (top + menuHeight > window.innerHeight) top = e.clientY - menuHeight;
                        menu.style.left = e.clientX + 'px';
                        menu.style.top = top + 'px';
                        menu.innerHTML =
                            `<div class="context-menu-item" data-action="open">打开</div><div class="context-menu-divider"></div><div class="context-menu-item" data-action="delete">删除</div>`;
                        menu.querySelector('[data-action="open"]').addEventListener('click', () => {
                            const app = icon.getAttribute('data-app');
                            if (app) this.openApp(app);
                            menu.remove();
                        });
                        menu.querySelector('[data-action="delete"]').addEventListener('click', () => {
                            icon.remove();
                            menu.remove();
                        });
                        document.body.appendChild(menu);
                        const close = (e) => { if (!menu.contains(e.target)) menu.remove();
                            document.removeEventListener('click', close); };
                        setTimeout(() => document.addEventListener('click', close), 0);
                    });
                });
            }

            populateStartMenu() {
                const container = document.getElementById('start-apps-list');
                const apps = [
                    { name: '文件管理器', icon: 'folder', app: 'filemanager' },
                    { name: '浏览器', icon: 'public', app: 'browser' },
                    { name: '终端', icon: 'terminal', app: 'terminal' },
                    { name: '设置', icon: 'settings', app: 'settings' }
                ];
                container.innerHTML = '';
                apps.forEach(a => {
                    const div = document.createElement('div');
                    div.className = 'start-menu-app';
                    div.innerHTML = `<span class="material-symbols-outlined">${a.icon}</span><span>${a.name}</span>`;
                    div.addEventListener('click', () => {
                        this.openApp(a.app);
                        document.getElementById('start-menu').style.display = 'none';
                    });
                    container.appendChild(div);
                });
                const searchInput = document.getElementById('start-search');
                searchInput.oninput = (e) => {
                    const val = e.target.value.toLowerCase();
                    Array.from(container.children).forEach(child => {
                        const text = child.innerText.toLowerCase();
                        child.style.display = text.includes(val) ? 'flex' : 'none';
                    });
                };
            }

            refreshDesktop() {
                const icons = document.querySelectorAll('.desktop-icon');
                icons.forEach(ic => { ic.style.opacity = '0';
                    setTimeout(() => ic.style.opacity = '1', 150); });
            }

            showBootDialog() {
                const dialog = document.createElement('div');
                dialog.className = 'boot-dialog';
                dialog.innerHTML = `
                    <div class="bg-gray-800 rounded-xl w-96 p-5 shadow-2xl border border-gray-700">
                        <div class="flex items-center gap-2 text-blue-400 mb-3">
                            <span class="text-2xl">🦝</span>
                            <span class="font-semibold">RaccoonOS 启动</span>
                        </div>
                        <p class="text-gray-300 text-sm mb-4">点击“确定”进入桌面环境。</p>
                        <button id="boot-confirm-btn" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded text-white w-full">确定</button>
                    </div>
                `;
                document.body.appendChild(dialog);
                const confirmBtn = dialog.querySelector('#boot-confirm-btn');
                confirmBtn.addEventListener('click', () => {
                    dialog.remove();
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    }
                });
            }

            startClock() {
                const update = () => {
                    const now = new Date();
                    document.getElementById('clock-time').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
                    document.getElementById('clock-date').innerText =
                        `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
                };
                update();
                setInterval(update, 1000);
            }

            runProgram() {
                try {
                    const link = document.createElement('a');
                    link.href = 'raccoonos://run';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (e) {
                    this.showSystemDialog('提示', '协议未注册。请双击运行 run-protocol.reg 后再试。');
                }
            }

            openTaskMgr() {
                try {
                    const link = document.createElement('a');
                    link.href = 'raccoonos://taskmgr';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (e) {
                    this.showSystemDialog('错误', '无法打开任务管理器。请按 Ctrl+Shift+Esc 手动打开。');
                }
            }

            openWechat() {
                this.openApp('browser');
                setTimeout(() => {
                    const browserWindow = this.windows.find(w => w.appName === 'browser');
                    if (browserWindow) {
                        const urlInput = browserWindow.element.querySelector('input[placeholder*="网址"]');
                        if (urlInput) {
                            urlInput.value = 'https://filehelper.weixin.qq.com/';
                            urlInput.dispatchEvent(new Event('keypress', { key: 'Enter' }));
                        }
                    }
                }, 500);
            }

            shutdown() {
                const shutdownTime = 3000;
                const shutdownScreen = document.createElement('div');
                shutdownScreen.className = 'fixed inset-0 bg-black z-[20000] flex flex-col items-center justify-center';
                shutdownScreen.innerHTML =
                    `<div class="text-2xl mb-6 text-white">正在关闭 RaccoonOS...</div><div class="w-64 h-1 bg-gray-700 rounded overflow-hidden"><div class="h-full bg-white w-0 transition-all" id="shutdown-bar" style="transition-duration: ${shutdownTime}ms"></div></div>`;
                document.body.appendChild(shutdownScreen);
                const bar = shutdownScreen.querySelector('#shutdown-bar');
                setTimeout(() => bar.style.width = '100%', 50);
                setTimeout(() => { window.close();
                    location.href = 'about:blank'; }, shutdownTime + 100);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.raccoon = new RaccoonOS();
        });
    </script>
</body>
</html>
