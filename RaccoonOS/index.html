<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浣熊OS - RaccoonOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: white;
            overflow: hidden;
            user-select: none;
        }

        /* 桌面 */
        .desktop {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
        }

        /* 桌面图标 */
        .desktop-icon {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 60px;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .desktop-icon img {
            width: 48px;
            height: 48px;
            margin-bottom: 4px;
            border-radius: 8px;
        }

        .desktop-icon span {
            font-size: 12px;
            text-align: center;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* 任务栏 */
        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
        }

        .start-button {
            width: 40px;
            height: 40px;
            background: #ff6b6b;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .start-button:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .taskbar-icons {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .taskbar-icon {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .taskbar-icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .taskbar-icon.active {
            background: rgba(255, 255, 255, 0.3);
        }

        .taskbar-time {
            color: white;
            font-size: 14px;
            text-align: right;
            min-width: 100px;
        }

        /* 窗口 */
        .window {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 1001;
        }

        .window-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: move;
            border-radius: 12px 12px 0 0;
        }

        .window-title {
            font-weight: bold;
            color: white;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-control {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            transition: all 0.3s ease;
        }

        .window-control.close {
            background: #ff4757;
        }

        .window-control.close:hover {
            background: #ff3838;
        }

        .window-control.minimize {
            background: #ffa502;
        }

        .window-control.minimize:hover {
            background: #ff6348;
        }

        .window-control.maximize {
            background: #26de81;
        }

        .window-control.maximize:hover {
            background: #20bf6b;
        }

        .window-content {
            padding: 16px;
            color: white;
            max-height: 400px;
            overflow-y: auto;
        }

        /* 右键菜单 */
        .context-menu {
            position: fixed;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 4px 0;
            z-index: 2000;
            min-width: 160px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .context-menu-item {
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .context-menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .context-menu-separator {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 4px 0;
        }

        /* 开始菜单 */
        .start-menu {
            position: fixed;
            bottom: 50px;
            left: 16px;
            width: 300px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            z-index: 1500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .start-menu.show {
            opacity: 1;
            transform: translateY(0);
        }

        .start-menu h3 {
            color: white;
            margin-bottom: 16px;
            font-size: 18px;
        }

        .start-menu-item {
            padding: 12px;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .start-menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .start-menu-item img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        /* 通知 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            color: white;
            z-index: 3000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            max-width: 300px;
        }

        .notification-title {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .notification-message {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 系统错误弹窗遮罩 */
        #error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10002;
        }

        .error-dialog {
            background: rgba(45, 45, 48, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .error-dialog h3 {
            color: #ff6b6b;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .error-dialog p {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .error-dialog-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .error-dialog-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .error-dialog-btn.cancel {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
        }

        .error-dialog-btn.confirm {
            background: #ff6b6b;
            color: white;
        }

        .error-dialog-btn.confirm:hover {
            background: #ff5252;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

    <script>
        class RaccoonOS {
            constructor() {
                this.windows = new Map();
                this.isSystemStarted = false;
                this.isFullscreen = false;
                this.init();
            }

            init() {
                this.initErrorDialogSystem();
            }

            initErrorDialogSystem() {
                const confirmBtn = document.getElementById('confirm-btn');
                confirmBtn.addEventListener('click', () => this.handleSystemStart());
            }

            async handleSystemStart() {
                const confirmBtn = document.getElementById('confirm-btn');
                const btnText = document.getElementById('btn-text');
                const btnLoading = document.getElementById('btn-loading');
                const errorOverlay = document.getElementById('error-overlay');

                // 显示加载状态
                btnText.style.display = 'none';
                btnLoading.style.display = 'inline-block';
                confirmBtn.disabled = true;

                try {
                    // 尝试进入全屏
                    await this.enterFullscreen();
                    
                    // 短暂延迟后开始系统
                    setTimeout(() => {
                        // 淡出遮罩
                        errorOverlay.style.opacity = '0';
                        errorOverlay.style.transition = 'opacity 0.5s ease';
                        
                        setTimeout(() => {
                            // 完全移除遮罩
                            errorOverlay.remove();
                            
                            // 清理所有通知
                            this.clearAllNotifications();
                            
                            // 显示桌面
                            const desktop = document.getElementById('desktop');
                            desktop.style.display = 'block';
                            
                            // 初始化桌面功能
                            this.initDesktopFeatures();
                            
                            // 显示欢迎通知
                            setTimeout(() => {
                                this.showNotification('系统启动成功', '欢迎使用浣熊OS！');
                            }, 1000);
                            
                            this.isSystemStarted = true;
                        }, 500);
                    }, 1000);
                    
                } catch (error) {
                    console.log('全屏模式启动失败，继续运行');
                    
                    setTimeout(() => {
                        errorOverlay.style.opacity = '0';
                        errorOverlay.style.transition = 'opacity 0.5s ease';
                        
                        setTimeout(() => {
                            errorOverlay.remove();
                            this.clearAllNotifications();
                            
                            const desktop = document.getElementById('desktop');
                            desktop.style.display = 'block';
                            this.initDesktopFeatures();
                            
                            setTimeout(() => {
                                this.showNotification('系统启动成功', '欢迎使用浣熊OS！');
                            }, 1000);
                            
                            this.isSystemStarted = true;
                        }, 500);
                    }, 1000);
                }
            }

            async enterFullscreen() {
                if (document.fullscreenElement) {
                    return;
                }

                try {
                    const elem = document.documentElement;
                    if (elem.requestFullscreen) {
                        await elem.requestFullscreen();
                        this.isFullscreen = true;
                    }
                } catch (error) {
                    throw new Error('无法进入全屏模式');
                }
            }

            initDesktopFeatures() {
                this.initTimeUpdate();
                this.initDesktopIcons();
                this.initStartMenu();
                this.initTaskbarButtons();
                this.initKeyboardShortcuts();
            }

            initTimeUpdate() {
                const updateTime = () => {
                    const now = new Date();
                    const timeString = now.toLocaleTimeString('zh-CN', { 
                        hour: '2-digit', 
                        minute: '2-digit',
                        hour12: false 
                    });
                    const timeElement = document.getElementById('taskbar-time');
                    if (timeElement) {
                        timeElement.textContent = timeString;
                    }
                };
                
                updateTime();
                setInterval(updateTime, 1000);
            }

            initDesktopIcons() {
                const desktopIcons = document.querySelectorAll('.desktop-icon');
                desktopIcons.forEach(icon => {
                    icon.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const app = icon.dataset.app;
                        this.launchApp(app);
                    });

                    icon.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.showContextMenu(e.clientX, e.clientY, [
                            { text: '打开', action: () => this.launchApp(icon.dataset.app) },
                            { text: '属性', action: () => this.showNotification('属性', `${icon.dataset.app} 的属性`) },
                            { type: 'separator' },
                            { text: '重命名', action: () => this.showNotification('重命名', '重命名功能暂未实现') },
                            { text: '删除', action: () => this.showNotification('删除', '删除功能暂未实现') }
                        ]);
                    });
                });
            }

            initStartMenu() {
                const startBtn = document.getElementById('start-btn');
                const startMenu = document.getElementById('start-menu');
                
                startBtn.addEventListener('click', () => {
                    startMenu.classList.toggle('show');
                });

                // 点击其他地方关闭菜单
                document.addEventListener('click', (e) => {
                    if (!startBtn.contains(e.target) && !startMenu.contains(e.target)) {
                        startMenu.classList.remove('show');
                    }
                });

                // 开始菜单项目
                const startMenuItems = startMenu.querySelectorAll('.start-menu-item');
                startMenuItems.forEach(item => {
                    item.addEventListener('click', () => {
                        const app = item.dataset.app;
                        this.launchApp(app);
                        startMenu.classList.remove('show');
                    });
                });
            }

            initTaskbarButtons() {
                const taskbarIcons = document.querySelectorAll('.taskbar-icon');
                taskbarIcons.forEach(icon => {
                    icon.addEventListener('click', () => {
                        const app = icon.dataset.app;
                        const window = this.windows.get(app);
                        if (window && window.style.display !== 'none') {
                            // 如果窗口已存在且可见，隐藏它
                            window.style.display = 'none';
                            icon.classList.remove('active');
                        } else {
                            // 否则启动应用
                            this.launchApp(app);
                        }
                    });
                });
            }

            initKeyboardShortcuts() {
                document.addEventListener('keydown', (e) => {
                    // 阻止 F11, ESC, Ctrl+W 等快捷键
                    if (e.key === 'F11' || 
                        e.key === 'Escape' || 
                        (e.ctrlKey && e.key === 'w') ||
                        (e.ctrlKey && e.key === 'r')) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        if (this.isSystemStarted) {
                            this.showNotification('提示', '全屏模式下已禁用系统快捷键');
                        }
                        return false;
                    }

                    // 开始菜单快捷键
                    if (e.key === 'Meta' || e.key === 'Control') {
                        e.preventDefault();
                        const startMenu = document.getElementById('start-menu');
                        startMenu.classList.toggle('show');
                    }

                    // 切换应用
                    if (e.key >= '1' && e.key <= '9' && (e.altKey || e.ctrlKey)) {
                        e.preventDefault();
                        const index = parseInt(e.key) - 1;
                        const taskbarIcons = document.querySelectorAll('.taskbar-icon');
                        if (taskbarIcons[index]) {
                            taskbarIcons[index].click();
                        }
                    }
                });
            }

            launchApp(appName) {
                // 检查应用是否已经打开
                if (this.windows.has(appName)) {
                    const window = this.windows.get(appName);
                    if (window.style.display !== 'none') {
                        this.focusWindow(window);
                        return;
                    }
                }

                switch (appName) {
                    case 'this-pc':
                        this.openThisPC();
                        break;
                    case 'notepad':
                        this.openNotepad();
                        break;
                    case 'calculator':
                        this.openCalculator();
                        break;
                    case 'settings':
                        this.openSettings();
                        break;
                    case 'recycle-bin':
                        this.openRecycleBin();
                        break;
                    default:
                        this.showNotification('错误', `未知应用: ${appName}`);
                }
            }

            openCalculator() {
                const window = this.createWindow('计算器', 300, 400);
                const content = window.querySelector('.window-content');
                content.innerHTML = `
                    <div style="background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 4px; margin-bottom: 10px;">
                        <input type="text" id="calc-display" style="width: 100%; background: transparent; border: none; color: white; font-size: 24px; text-align: right; outline: none;" readonly value="0">
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
                        ${['C', '±', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', '=', '='].map((btn, index) => `
                            <button style="padding: 15px; background: ${['÷', '×', '-', '+', '='].includes(btn) ? '#ff6b6b' : 'rgba(255, 255, 255, 0.1)'}; border: none; border-radius: 4px; color: white; font-size: 18px; cursor: pointer; ${btn === '0' ? 'grid-column: span 2;' : ''}" onclick="this.calculatorClick('${btn}')">${btn}</button>
                        `).join('')}
                    </div>
                `;
                
                // 添加计算器逻辑
                content.calculatorClick = (btn) => {
                    const display = content.querySelector('#calc-display');
                    let value = display.value;
                    
                    if (btn === 'C') {
                        display.value = '0';
                    } else if (btn === '=') {
                        try {
                            const result = eval(value.replace('×', '*').replace('÷', '/'));
                            display.value = result;
                        } catch (e) {
                            display.value = 'Error';
                        }
                    } else {
                        if (value === '0' && btn !== '.') {
                            display.value = btn;
                        } else {
                            display.value += btn;
                        }
                    }
                };
                
                this.windows.set('calculator', window);
                this.activateTaskbarButton('calculator');
            }

                // 添加设置切换逻辑

                                        <option>深色主题</option>
                                        <option>浅色主题</option>
                                    </select>
                                </div>
                            `;

                        case 'sound':
                            html = `
                                <h3 style="margin-bottom: 20px; color: white;">声音设置</h3>

                        case 'network':
                            html = `
                                <h3 style="margin-bottom: 20px; color: white;">网络设置</h3>

            openRecycleBin() {
                const window = this.createWindow('回收站', 400, 300);

                    <div style="text-align: center; padding: 40px;">
                        <div style="font-size: 48px; margin-bottom: 20px;">🗑️</div>
                        <h3 style="margin-bottom: 10px;">回收站</h3>
                        <p style="color: rgba(255, 255, 255, 0.7);">已清空</p>
                        <div style="margin-top: 30px; color: rgba(255, 255, 255, 0.5); font-size: 14px;">
                            <p>这里会显示已删除的文件</p>
                        </div>
                    </div>
                `;
                this.windows.set('recycle-bin', window);
                this.activateTaskbarButton('recycle-bin');
            }

            createWindow(title, width, height) {
                const window = document.createElement('div');
                window.className = 'window';
                window.style.width = width + 'px';
                window.style.height = height + 'px';
                window.style.left = (window.innerWidth / 2 - width / 2) + 'px';
                window.style.top = (window.innerHeight / 2 - height / 2) + 'px';
                
                window.innerHTML = `
                    <div class="window-header">
                        <span class="window-title">${title}</span>
                        <div class="window-controls">
                            <button class="window-control minimize">—</button>
                            <button class="window-control maximize">□</button>
                            <button class="window-control close">×</button>
                        </div>
                    </div>
                    <div class="window-content"></div>
                `;
                
                document.body.appendChild(window);
                
                // 窗口控制
                const closeBtn = window.querySelector('.close');
                const minimizeBtn = window.querySelector('.minimize');
                const maximizeBtn = window.querySelector('.maximize');
                
                closeBtn.addEventListener('click', () => {
                    window.remove();
                    this.deactivateTaskbarButton(title.toLowerCase().replace(/[^a-z]/g, ''));
                });
                
                minimizeBtn.addEventListener('click', () => {
                    window.style.display = 'none';
                    this.deactivateTaskbarButton(title.toLowerCase().replace(/[^a-z]/g, ''));
                });
                
                maximizeBtn.addEventListener('click', () => {
                    if (window.style.width === '100%') {
                        window.style.width = width + 'px';
                        window.style.height = height + 'px';
                        window.style.left = (window.innerWidth / 2 - width / 2) + 'px';
                        window.style.top = (window.innerHeight / 2 - height / 2) + 'px';
                    } else {
                        window.style.left = '0';
                        window.style.top = '0';
                        window.style.width = '100%';
                        window.style.height = 'calc(100% - 50px)';
                    }
                });
                
                // 拖拽功能
                this.makeWindowDraggable(window);
                
                return window;
            }

            makeWindowDraggable(window) {
                const header = window.querySelector('.window-header');
                let isDragging = false;
                let currentX;
                let currentY;
                let initialX;
                let initialY;
                let xOffset = 0;
                let yOffset = 0;

                header.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                    
                    if (e.target === header || header.contains(e.target)) {
                        window.style.zIndex = 1001;
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        e.preventDefault();
                        currentX = e.clientX - initialX;
                        currentY = e.clientY - initialY;
                        
                        xOffset = currentX;
                        yOffset = currentY;
                        
                        window.style.left = currentX + 'px';
                        window.style.top = currentY + 'px';
                    }
                });

                document.addEventListener('mouseup', () => {
                    initialX = currentX;
                    initialY = currentY;
                    isDragging = false;
                });
            }

            focusWindow(window) {
                window.style.zIndex = 1001;
                window.style.display = 'block';
                this.activateTaskbarButton(window.querySelector('.window-title').textContent.toLowerCase().replace(/[^a-z]/g, ''));
            }

            activateTaskbarButton(appName) {
                const taskbarIcon = document.querySelector(`[data-app="${appName}"]`);
                if (taskbarIcon) {
                    taskbarIcon.classList.add('active');
                }
            }

            deactivateTaskbarButton(appName) {
                const taskbarIcon = document.querySelector(`[data-app="${appName}"]`);
                if (taskbarIcon) {
                    taskbarIcon.classList.remove('active');
                }
            }

            showContextMenu(x, y, items) {
                // 移除现有菜单
                const existingMenu = document.querySelector('.context-menu');
                if (existingMenu) {
                    existingMenu.remove();
                }

                const menu = document.createElement('div');
                menu.className = 'context-menu';
                menu.style.left = x + 'px';
                menu.style.top = y + 'px';
                
                items.forEach(item => {
                    if (item.type === 'separator') {
                        const separator = document.createElement('div');
                        separator.className = 'context-menu-separator';
                        menu.appendChild(separator);
                    } else {
                        const menuItem = document.createElement('div');
                        menuItem.className = 'context-menu-item';
                        menuItem.textContent = item.text;
                        menuItem.addEventListener('click', () => {
                            item.action();
                            menu.remove();
                        });
                        menu.appendChild(menuItem);
                    }
                });
                
                document.body.appendChild(menu);
                
                // 点击其他地方关闭菜单
                setTimeout(() => {
                    const closeMenu = (e) => {
                        if (!menu.contains(e.target)) {
                            menu.remove();
                            document.removeEventListener('click', closeMenu);
                        }
                    };
                    document.addEventListener('click', closeMenu);
                }, 100);
            }

            showNotification(title, message, duration = 3000) {
                // 移除现有通知
                this.clearAllNotifications();
                
                const notification = document.createElement('div');
                notification.className = 'notification';
                notification.innerHTML = `
                    <div class="notification-title">${title}</div>
                    <div class="notification-message">${message}</div>
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, duration);
            }

            clearAllNotifications() {
                const notifications = document.querySelectorAll('.notification');
                notifications.forEach(notification => notification.remove());
            }
        }

        // 初始化系统
        document.addEventListener('DOMContentLoaded', () => {
            new RaccoonOS();
        });
    </script>
