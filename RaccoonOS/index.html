                linkDropEl.innerHTML = '<span class="ldt-icon material-symbols-outlined">open_in_new</span><div style="text-align:center;line-height:1.4;padding:0 10px;">松开鼠标<br>在此打开新窗口</div>';
                document.body.appendChild(linkDropEl);
                linkDropEl.addEventListener('dragover', function(e) {
                    e.preventDefault(); e.stopPropagation();
                    try { e.dataTransfer.dropEffect = 'link'; } catch (err) {}
                    linkDropEl.classList.add('hover');
                    clearTimeout(linkDropTimer);
                });
                linkDropEl.addEventListener('dragleave', function() { linkDropEl.classList.remove('hover'); });
                linkDropEl.addEventListener('drop', function(e) {
                    e.preventDefault(); e.stopPropagation();
                    let url = '';
                    try { url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain'); } catch (err) {}
                    url = (url || '').split(/\r?\n/)[0].trim();
                    const s = window.raccoon;
                    if (url && /^https?:/i.test(url) && s && typeof s.openBrowserInContainer === 'function') {
                        s.openBrowserInContainer(url);
                    }
                    hideLinkDrop();
                });
                return linkDropEl;
            };
            const showLinkDrop = () => {
                const el = ensureLinkDropEl();
                el.classList.add('visible');
                clearTimeout(linkDropTimer);
                linkDropTimer = setTimeout(hideLinkDrop, 2000);
            };
            const hideLinkDrop = () => {
                clearTimeout(linkDropTimer);
                if (linkDropEl) linkDropEl.classList.remove('visible');
            };
            window.addEventListener('dragstart', function(e) {
                const el = (e.target && e.target.closest) ? e.target.closest('a[href]') : null;
                if (el || isLinkDrag(e)) showLinkDrop();
            }, true);
            window.addEventListener('dragover', function(e) {
                if (!isLinkDrag(e)) return;
                e.preventDefault();
                try { e.dataTransfer.dropEffect = 'none'; } catch (err) {}
                showLinkDrop();
            }, true);
            window.addEventListener('drop', function(e) {
                if (!isLinkDrag(e)) return;
                const inTarget = linkDropEl && e.target && (e.target === linkDropEl || (e.target.closest ? e.target.closest('#link-drop-target') : null));
                if (inTarget) { hideLinkDrop(); return; }
                e.preventDefault(); e.stopPropagation();
                hideLinkDrop();
            }, true);
            window.addEventListener('dragend', function(e) {
                if (isLinkDrag(e)) hideLinkDrop();
            }, true);
            window.addEventListener('message', function(e) {
                const d = e.data;
                if (!d) return;
                const s = window.raccoon;
                if (d.type === 'openInContainer') {
                    if (s && typeof s.openBrowserInContainer === 'function' && d.url) {
                        try { s.openBrowserInContainer(d.url); } catch (err) {}
                    }
                } else if (d.type === 'showLinkMenu') {
                    if (!s || typeof s.showLinkContextMenu !== 'function' || !d.url) return;
                    let frame = null;
                    try { if (e.source && e.source.frameElement) frame = e.source.frameElement; } catch (err) {}
                    let vx = d.x || 0, vy = d.y || 0;
                    if (frame && typeof frame.getBoundingClientRect === 'function') {
                        const r = frame.getBoundingClientRect();
                        vx = r.left + (d.x || 0); vy = r.top + (d.y || 0);
                    }
                    try { s.showLinkContextMenu(vx, vy, d.url, frame); } catch (err) {}
                }
            });
        })();

        // ---------- Raccoon OS 终极增强版 ----------
        class RaccoonOS {
            constructor() {
                this.windows = [];
                this.nextWindowId = 1;
                this.activeWindow = null;
                this.currentPage = null;
                this.desktopIcons = [
                    { name: "文件管理器", icon: "folder", app: "filemanager" },
                    { name: "浏览器", icon: "public", app: "browser" },
                    { name: "图片查看器", icon: "image", app: "imagerviewer" },
                    { name: "视频查看器", icon: "movie", app: "videoviewer" },
                    { name: "音乐播放器", icon: "music_note", app: "musicplayer" },
                    { name: "计算器", icon: "calculate", app: "calculator" },
                    { name: "截图工具", icon: "screenshot", app: "snippingtool" },
                    { name: "记事本", icon: "edit_note", app: "notepad" },
                    { name: "终端", icon: "terminal", app: "terminal" },
                    { name: "设置", icon: "settings", app: "settings" },
                    { name: "任务管理器", icon: "https://raccoon.fit/RaccoonOS/icon/%E8%BF%90%E8%A1%8C.ico", app: "taskmgr" }
                ];
                this.iconPositions = this.loadIconPositions();
                this.selectedIcons = [];
                this.metaHeld = false;
                this.metaUsed = false;
                // 模拟文件系统
                this.fileSystem = {
                    desktop: [
                        { name: "示例文件夹", type: "dir", path: "desktop_folder" },
                        { name: "readme.txt", type: "file", content: "欢迎使用 Raccoon OS！" }
                    ],
                    documents: [
                        { name: "工作文档.docx", type: "file" },
                        { name: "报表.xlsx", type: "file" }
                    ],
                    downloads: [
                        { name: "安装包.exe", type: "file" },
                        { name: "图片.zip", type: "file" }
                    ],
                    pictures: [
                        { name: "风景.jpg", type: "file" },
                        { name: "截图.png", type: "file" }
                    ],
                    music: [
                        { name: "歌曲1.mp3", type: "file" },
                        { name: "歌单.flac", type: "file" }
                    ],
                    videos: [
                        { name: "电影.mp4", type: "file" },
                        { name: "教程.mkv", type: "file" }
                    ],
                    desktop_folder: [
                        { name: "子文件.txt", type: "file", content: "这是子文件夹中的文件。" }
                    ]
                };
                try {
                    const savedFs = JSON.parse(localStorage.getItem('raccoonos_filesystem') || 'null');
                    if (savedFs && typeof savedFs === 'object') {
                        Object.keys(savedFs).forEach(k => {
                            if (Array.isArray(savedFs[k])) this.fileSystem[k] = savedFs[k];
                        });
                    }
                } catch (e) {}
                // 浏览器数据
                this.bookmarks = this.loadBookmarks();
                this.history = this.loadHistory();
                this.notifications = [];
                this.notifBadge = 0;
                // 系统设置
                this.settings = this.loadSettings();
                // Edge 能力检测
                this.isStandalonePwa = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
                this.useNativeWindowDrag = typeof CSS !== 'undefined' && typeof CSS.supports === 'function' &&
                    (CSS.supports('window-drag', 'drag') || CSS.supports('app-region', 'drag'));
                this.wcoSupported = 'windowControlsOverlay' in navigator;
                this.fileSystemAccessSupported = 'showDirectoryPicker' in window;
                this.wakeLockSupported = 'wakeLock' in navigator && navigator.wakeLock !== undefined;
                this.wakeLock = null;
                this.init();
            }

            loadSettings() {
                try {
                    const saved = localStorage.getItem('raccoonos_settings');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        return {
                            volume: parsed.volume !== undefined ? parsed.volume : 70,
                            theme: parsed.theme || '#0a0a0a',
                            autostartApps: parsed.autostartApps || [],
                            showHiddenFiles: parsed.showHiddenFiles || false,
                            desktopLayout: parsed.desktopLayout || 'grid',
                            systemSound: parsed.systemSound !== undefined ? parsed.systemSound : true,
                            notificationSound: parsed.notificationSound !== undefined ? parsed.notificationSound : true,
                            displayScale: parsed.displayScale || '100',
                            windowAnimation: parsed.windowAnimation !== undefined ? parsed.windowAnimation : true,
                            taskbarTransparent: parsed.taskbarTransparent !== undefined ? parsed.taskbarTransparent : true,
                            showSeconds: parsed.showSeconds !== undefined ? parsed.showSeconds : false,
                            externalOpen: parsed.externalOpen !== undefined ? parsed.externalOpen : false,
                            autoRestoreUrl: parsed.autoRestoreUrl !== undefined ? parsed.autoRestoreUrl : false,
                            searchEngine: parsed.searchEngine || 'bing',
                            systemNotifications: parsed.systemNotifications !== undefined ? parsed.systemNotifications : false,
                            desktopIconsVisible: parsed.desktopIconsVisible !== undefined ? parsed.desktopIconsVisible : true,
                            desktopIconsDraggable: parsed.desktopIconsDraggable !== undefined ? parsed.desktopIconsDraggable : false
                        };
                    }
                } catch (e) {}
                return {
                    volume: 70,
                    theme: '#0a0a0a',
                    autostartApps: [],
                    showHiddenFiles: false,
                    desktopLayout: 'grid',
                    systemSound: true,
                    notificationSound: true,
                    displayScale: '100',
                    windowAnimation: true,
                    taskbarTransparent: true,
                    showSeconds: false,
                    externalOpen: false,
                    autoRestoreUrl: false,
                    searchEngine: 'bing',
                    systemNotifications: false,
                    desktopIconsVisible: true,
                    desktopIconsDraggable: false
                };
            }

            saveSettings() {
                localStorage.setItem('raccoonos_settings', JSON.stringify(this.settings));
            }

            loadIconPositions() {
                try {
                    const saved = localStorage.getItem('raccoonos_icon_positions');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) { return {}; }
            }

            saveIconPositions() {
                const positions = {};
                document.querySelectorAll('.desktop-icon').forEach(icon => {
                    const app = icon.getAttribute('data-app');
                    if (icon.style.left || icon.style.top) {
                        positions[app] = {
                            left: icon.style.left,
                            top: icon.style.top
                        };
                    }
                });
                localStorage.setItem('raccoonos_icon_positions', JSON.stringify(positions));
            }

            deleteDesktopIcon(appName) {
                const idx = this.desktopIcons.findIndex(d => d.app === appName);
                if (idx !== -1) {
                    this.desktopIcons.splice(idx, 1);
                    delete this.iconPositions[appName];
                    this.saveIconPositions();
                    this.renderDesktop();
                }
            }

            renameDesktopIcon(appName, newName) {
                const icon = this.desktopIcons.find(d => d.app === appName);
                if (icon) {
                    icon.name = newName;
                    this.renderDesktop();
                }
            }

            deselectAllIcons() {
                document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('active'));
                this.selectedIcons = [];
            }

            selectIcon(appName) {
                this.deselectAllIcons();
                const el = document.querySelector(`.desktop-icon[data-app="${appName}"]`);
                if (el) {
                    el.classList.add('active');
                    this.selectedIcons = [appName];
                }
            }

            selectAdjacentIcon(direction) {
                const icons = Array.from(document.querySelectorAll('.desktop-icon'));
                if (icons.length === 0) return;
                if (this.selectedIcons.length === 0) {
                    this.selectIcon(this.desktopIcons[0].app);
                    return;
                }
                const current = document.querySelector(`.desktop-icon[data-app="${this.selectedIcons[0]}"]`);
                if (!current) {
                    this.selectIcon(this.desktopIcons[0].app);
                    return;
                }
                const cRect = current.getBoundingClientRect();
                const cCx = cRect.left + cRect.width / 2;
                const cCy = cRect.top + cRect.height / 2;
                let best = null;
                let bestScore = Infinity;
                const isHorizontal = direction === 'ArrowLeft' || direction === 'ArrowRight';
                const preferDirection = direction === 'ArrowLeft' || direction === 'ArrowUp' ? -1 : 1;
                icons.forEach(el => {
                    if (el === current) return;
                    const r = el.getBoundingClientRect();
                    const cx = r.left + r.width / 2;
                    const cy = r.top + r.height / 2;
                    const dx = cx - cCx;
                    const dy = cy - cCy;
                    let primary, secondary;
                    if (direction === 'ArrowLeft') {
                        if (dx >= -5) return;
                        primary = -dx;
                        secondary = Math.abs(dy);
                    } else if (direction === 'ArrowRight') {
                        if (dx <= 5) return;
                        primary = dx;
                        secondary = Math.abs(dy);
                    } else if (direction === 'ArrowUp') {
                        if (dy >= -5) return;
                        primary = -dy;
                        secondary = Math.abs(dx);
                    } else if (direction === 'ArrowDown') {
                        if (dy <= 5) return;
                        primary = dy;
                        secondary = Math.abs(dx);
                    }
                    const score = primary * 100 + secondary;
                    if (score < bestScore) {
                        bestScore = score;
                        best = el;
                    }
                });
                if (best) {
                    this.selectIcon(best.getAttribute('data-app'));
                }
            }

            loadBookmarks() {
                try {
                    const saved = localStorage.getItem('raccoonos_bookmarks');
                    return saved ? JSON.parse(saved) : [
                        { title: "GitHub", url: "https://github.com" },
                        { title: "Bilibili", url: "https://www.bilibili.com" }
                    ];
                } catch (e) { return []; }
            }

            saveBookmarks() {
                localStorage.setItem('raccoonos_bookmarks', JSON.stringify(this.bookmarks));
            }

            loadHistory() {
                try {
                    const saved = localStorage.getItem('raccoonos_history');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            }

            saveHistory() {
                localStorage.setItem('raccoonos_history', JSON.stringify(this.history.slice(0, 50)));
            }

            addToHistory(url, title) {
                this.history = this.history.filter(h => h.url !== url);
                this.history.unshift({ url, title, time: new Date().toISOString() });
                if (this.history.length > 50) this.history.pop();
                this.saveHistory();
            }

            init() {
                this.removeGlobalLinkOverlays();
                this.renderDesktop();
                this.initEventListeners();
                this.startClock();
                this.applySettings();
                this.setupFullscreenGuard();
                this.showEntryConfirm();
                this.initWakeLockVisibility();
                this.initViewportHandling();
                this.initSystemNotifications();
                ['browser', 'terminal', 'settings', 'filemanager'].forEach((app, idx) => {
                    if (!this.settings.autostartApps.includes(app)) return;
                    setTimeout(() => {
                        if (this.lockScreenEl || this.entryConfirmEl) return;
                        this.openApp(app);
                    }, 600 + idx * 300);
                });
            }

            setupFullscreenGuard() {
                this._fullscreenActive = false;
                document.addEventListener('fullscreenchange', () => {
                    if (document.fullscreenElement) {
                        this._fullscreenActive = true;
                        this.lockKeyboard();
                        const hint = document.getElementById('fullscreen-hint');
                        if (hint) hint.remove();
                        return;
                    }
                    if (!this._fullscreenActive || this.lockScreenEl || this.entryConfirmEl) return;
                    setTimeout(() => {
                        if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                            document.documentElement.requestFullscreen({ keyboardLock: 'browser' }).catch(() => {});
                        }
                    }, 50);
                });
            }

            lockKeyboard() {
                if (navigator.keyboard && navigator.keyboard.lock) {
                    navigator.keyboard.lock(['Escape']).catch(() => {});
                }
            }

            applySettings() {
                document.documentElement.style.backgroundColor = this.settings.theme;
                document.body.style.backgroundColor = this.settings.theme;
                const volume = this.settings.volume;
                document.getElementById('volume-slider').value = volume;
                document.getElementById('volume-value').innerText = volume;
                document.querySelectorAll('audio, video').forEach(el => el.volume = volume / 100);
                const scale = parseInt(this.settings.displayScale) || 100;
                document.body.style.fontSize = (scale / 100) * 16 + 'px';
                if (this.settings.taskbarTransparent === false) {
                    const tb = document.getElementById('taskbar');
                    if (tb) tb.style.background = 'rgba(24,24,24,0.98)';
                }
            }

            renderDesktop() {
                const desktop = document.getElementById('desktop-area');
                desktop.innerHTML = '';
                this.selectedIcons = [];
                if (!this.settings.desktopIconsVisible) return;
                this.desktopIcons.forEach((icon, idx) => {
                    const div = document.createElement('div');
                    div.className = 'desktop-icon';
                    div.setAttribute('data-app', icon.app);
                    let iconHtml = '';
                    if (icon.icon && (icon.icon.startsWith('http') || icon.icon.startsWith('/'))) {
                        iconHtml = `<img src="${icon.icon}" style="width:36px;height:36px;object-fit:contain;">`;
                    } else {
                        iconHtml = `<span class="material-symbols-outlined">${icon.icon}</span>`;
                    }
                    div.innerHTML = `${iconHtml}<span>${icon.name}</span>`;
                    const pos = this.iconPositions[icon.app];
                    if (pos) {
                        div.style.position = 'fixed';
                        div.style.left = pos.left;
                        div.style.top = pos.top;
                        div.style.zIndex = '10';
                    }
                    div.addEventListener('dblclick', () => {
                        this.openApp(icon.app);
                        this.deselectAllIcons();
                    });
                    div.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const wasActive = div.classList.contains('active');
                        const now = Date.now();
                        const quickSecondTap = wasActive && (now - (div._lastTap || 0) < 600);
                        div._lastTap = now;
                        if (!e.ctrlKey && !e.metaKey && quickSecondTap) {
                            this.openApp(icon.app);
                            this.deselectAllIcons();
                            return;
                        }
                        if (e.ctrlKey || e.metaKey) {
                            if (div.classList.contains('active')) {
                                div.classList.remove('active');
                                this.selectedIcons = this.selectedIcons.filter(a => a !== icon.app);
                            } else {
                                div.classList.add('active');
                                this.selectedIcons.push(icon.app);
                            }
                        } else {
                            document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('active'));
                            div.classList.add('active');
                            this.selectedIcons = [icon.app];
                        }
                    });
                    const startDrag = (e) => {
                        if (e.button !== 0) return;
                        const startX = e.clientX;
                        const startY = e.clientY;
                        let dragged = false;
                        const onMove = (e) => {
                            if (!dragged) {
                                const dx = e.clientX - startX;
                                const dy = e.clientY - startY;
                                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                                    dragged = true;
                                    if (!(e.ctrlKey || e.metaKey)) {
                                        document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('active'));
                                        this.selectedIcons = [icon.app];
                                    }
                                    document.querySelectorAll('.desktop-icon').forEach(i => i.classList.add('active'));
                                    document.querySelectorAll('.desktop-icon').forEach(i => {
                                        if (!this.selectedIcons.includes(i.getAttribute('data-app'))) {
                                            i.classList.remove('active');
}
                });

                // 捕获阶段拦截系统键
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Meta' || e.metaKey) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }, true);
                window.addEventListener('keyup', (e) => {
                    if (e.key === 'Meta') {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }, true);
            }
                            }
                            if (dragged) {
                                if (!div.style.position || div.style.position === 'static') {
                                    div.style.position = 'fixed';
                                    div.style.zIndex = '10';
                                }
                                div.style.left = (e.clientX - 40) + 'px';
                                div.style.top = (e.clientY - 40) + 'px';
                                div.style.zIndex = '50';
                            }
                        };
                        const onUp = (e) => {
                            document.removeEventListener('mousemove', onMove);
                            document.removeEventListener('mouseup', onUp);
                            if (dragged) {
                                this.saveIconPositions();
                            }
                        };
                        document.addEventListener('mousemove', onMove);
                        document.addEventListener('mouseup', onUp);
                    };
                    if (this.settings.desktopIconsDraggable) div.addEventListener('mousedown', startDrag);
                    desktop.appendChild(div);
                });
            }

            openApp(appName) {
                if (appName === 'settings') {
                    this.openSettingsWindow();
                    return;
                }
                const existing = this.windows.find(w => w.appName === appName && !w.minimized);
                if (existing) {
                    this.activateWindow(existing);
                    return;
                }
                const id = this.nextWindowId++;
                let winElement = null;
                switch (appName) {
                    case 'filemanager':
                        winElement = this.createFileManagerWindow(id);
                        break;
                    case 'browser':
                        winElement = this.createBrowserWindow(id);
                        break;
                    case 'terminal':
                        winElement = this.createTerminalWindow(id);
                        break;
                    case 'imagerviewer':
                        winElement = this.createImageViewerWindow(id, null);
                        break;
                    case 'videoviewer':
                        winElement = this.createVideoViewerWindow(id, null);
                        break;
                    case 'musicplayer':
                        winElement = this.createMusicPlayerWindow(id, null);
                        break;
                    case 'calculator':
                        winElement = this.createCalculatorWindow(id);
                        break;
                    case 'snippingtool':
                        winElement = this.createSnippingToolWindow(id);
                        break;
                    case 'notepad':
                        winElement = this.createNotepadWindow(id, null);
                        break;
                    case 'run':
                        this.runProgram();
                        return;
                    case 'taskmgr':
                        this.openTaskMgr();
                        return;
                    default:
                        return;
                }
                document.getElementById('desktop-area').appendChild(winElement);
                const winObj = { id, element: winElement, appName, minimized: false, taskbarButton: null,
                savedPosition: { left: 100, top: 100, width: 800, height: 550 } };
                this.windows.push(winObj);
                this.addToTaskbar(winObj);
                this.activateWindow(winObj);
                this.placeWindow(winElement, winObj);
            }

            openBrowserInContainer(url) {
                const id = this.nextWindowId++;
                const winElement = this.createBrowserWindow(id);
                document.getElementById('desktop-area').appendChild(winElement);
                const winObj = { id, element: winElement, appName: 'browser', minimized: false, taskbarButton: null,
                    savedPosition: { left: 100, top: 100, width: 800, height: 550 } };
                this.windows.push(winObj);
                this.addToTaskbar(winObj);
                this.activateWindow(winObj);
                this.placeWindow(winElement, winObj);
                if (url) {
                    if (typeof winElement._navigate === 'function') {
                        winElement._navigate(url);
                    } else {
                        const input = winElement.querySelector('input[placeholder*="网址"]');
                        if (input) { input.value = url; winElement.querySelector('.browser-go').click(); }
                    }
                }
                return winObj;
            }

            showLinkContextMenu(x, y, url, frame) {
                this.removeAllContextMenus();
                const menu = document.createElement('div');
                menu.className = 'context-menu';
                menu.style.position = 'fixed';
                menu.style.zIndex = '100000';
                menu.style.left = x + 'px';
                menu.style.top = y + 'px';
                menu.innerHTML = `
                    <div class="context-menu-item" data-action="open">打开</div>
                    <div class="context-menu-item" data-action="newtab">在新标签页打开</div>
                    <div class="context-menu-divider"></div>
                    <div class="context-menu-item" data-action="copy">复制链接地址</div>`;
                document.body.appendChild(menu);
                const rect = menu.getBoundingClientRect();
                if (rect.right > window.innerWidth - 4) menu.style.left = (window.innerWidth - rect.width - 4) + 'px';
                if (rect.bottom > window.innerHeight - 4) menu.style.top = (window.innerHeight - rect.height - 4) + 'px';
                const close = () => {
                    menu.remove();
                    document.removeEventListener('click', onDoc);
                    document.removeEventListener('contextmenu', onDoc);
                };
                const onDoc = (e) => {
                    if (!menu.contains(e.target)) close();
                };
                menu.querySelector('[data-action="open"]').addEventListener('click', () => {
                    if (frame && typeof frame.src !== 'undefined') {
                        frame.src = url;
                    } else {
                        this.openBrowserInContainer(url);
                    }
                    close();
                });
                menu.querySelector('[data-action="newtab"]').addEventListener('click', () => {
                    this.openBrowserInContainer(url);
                    close();
                });
                menu.querySelector('[data-action="copy"]').addEventListener('click', async () => {
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(url);
                        } else {
                            const ta = document.createElement('textarea');
                            ta.value = url;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                        }
                        this.showToast('链接已复制', 'info');
                    } catch (e) { this.showToast('复制失败', 'error'); }
                    close();
                });
                setTimeout(() => {
                    document.addEventListener('click', onDoc);
                    document.addEventListener('contextmenu', onDoc);
                }, 0);
            }

            addToTaskbar(winObj) {
                const taskbarDiv = document.getElementById('taskbar-apps');
                const btn = document.createElement('div');
                btn.className = 'taskbar-item taskbar-app';
                let icon = '';
                let appName = '';
                switch (winObj.appName) {
                    case 'filemanager':
                        icon = 'folder';
                        appName = '文件管理器';
                        break;
                    case 'browser':
                        icon = 'public';
                        appName = '浏览器';
                        break;
                    case 'terminal':
                        icon = 'terminal';
                        appName = '终端';
                        break;
                    case 'imagerviewer':
                        icon = 'image';
                        appName = '图片查看器';
                        break;
                    case 'videoviewer':
                        icon = 'movie';
                        appName = '视频查看器';
                        break;
case 'textviewer':
                        icon = 'description';
                        appName = '文本查看器';
                        break;
                    case 'musicplayer':
                        icon = 'music_note';
                        appName = '音乐播放器';
                        break;
                    case 'calculator':
                        icon = 'calculate';
                        appName = '计算器';
                        break;
                    case 'snippingtool':
                        icon = 'screenshot';
                        appName = '截图工具';
                        break;
                    case 'notepad':
                        icon = 'edit_note';
                        appName = '记事本';
                        break;
                    case 'taskmgr':
                        icon = 'play_arrow';
                        appName = '任务管理器';
                        break;
                    case 'settings':
                        icon = 'settings';
                        appName = '设置';
                        break;
                    case 'run':
                        icon = 'play_arrow';
                        appName = '运行';
                        break;
                }
                btn.innerHTML = `<span class="material-symbols-outlined">${icon}</span><span class="app-name">${appName}</span>`;
                btn.addEventListener('click', (e) => { e.stopPropagation();
                    this.toggleMinimizeWindow(winObj); });
                btn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    this.showWindowContextMenu(e.clientX, e.clientY, winObj);
                });
                taskbarDiv.appendChild(btn);
                winObj.taskbarButton = btn;
            }

            toggleMinimizeWindow(winObj) {
                if (winObj.minimized) {
                    winObj.element.style.display = 'flex';
                    winObj.element.classList.remove('window-minimizing');
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            winObj.element.classList.add('window-open');
                        });
                    });
                    winObj.minimized = false;
                    this.activateWindow(winObj);
                } else {
                    winObj.element.classList.remove('window-open');
                    winObj.element.classList.add('window-minimizing');
                    setTimeout(() => {
                        winObj.element.style.display = 'none';
                        winObj.minimized = true;
                    }, 160);
                }
                this.updateTaskbarActive();
            }

            updateTaskbarActive() {
                this.windows.forEach(win => {
                    if (win.taskbarButton) {
                        const shouldBeActive = !win.minimized && this.activeWindow === win;
                        if (shouldBeActive) win.taskbarButton.classList.add('active');
                        else win.taskbarButton.classList.remove('active');
                    }
                });
            }

            activateWindow(winObj) {
                if (winObj.minimized) {
                    winObj.element.style.display = 'flex';
                    winObj.minimized = false;
                }
                let maxZ = 100;
                this.windows.forEach(w => {
                    const z = parseInt(w.element.style.zIndex) || 100;
                    if (z > maxZ) maxZ = z;
                });
                if (winObj.topmost) {
                    winObj.element.style.zIndex = 90000;
                } else {
                    const topmost = this.windows.find(w => w.topmost && !w.minimized && w !== winObj);
                    winObj.element.style.zIndex = topmost ? Math.min(maxZ + 1, 89999) : maxZ + 1;
                }
                this.activeWindow = winObj;
                this.updateTaskbarActive();
            }

            toggleTopmost(winObj) {
                winObj.topmost = !winObj.topmost;
                if (winObj.topmost) {
                    winObj.element.style.zIndex = 90000;
                } else {
                    let maxZ = 100;
                    this.windows.forEach(w => {
                        const z = parseInt(w.element.style.zIndex) || 100;
                        if (z > maxZ) maxZ = z;
                    });
                    winObj.element.style.zIndex = maxZ + 1;
                }
                this.updateTaskbarActive();
            }

            closeWindow(winObj) {
                winObj.element.classList.remove('window-open');
                winObj.element.classList.add('window-minimizing');
                setTimeout(() => {
                    winObj.element.remove();
                    if (winObj.taskbarButton) winObj.taskbarButton.remove();
                    const index = this.windows.indexOf(winObj);
                    if (index !== -1) this.windows.splice(index, 1);
                    if (this.activeWindow === winObj) this.activeWindow = null;
                }, 160);
            }

            // 全屏设置页面
            openSettingsPage() {
                this.currentPage = 'settings';
                document.getElementById('start-menu').style.display = 'none';

                this.addPageToTaskbar('settings', '设置');

                const pageContent = document.getElementById('fullscreen-page-content');
                pageContent.innerHTML = `
                    <div class="set-page-grid">
                        <div class="set-page-nav">
                            <div class="set-page-nav-item active" data-page="personalization"><span class="material-symbols-outlined" style="vertical-align:middle;margin-right:8px;">palette</span>个性化</div>
                            <div class="set-page-nav-item" data-page="sound"><span class="material-symbols-outlined" style="vertical-align:middle;margin-right:8px;">volume_up</span>声音</div>
                            <div class="set-page-nav-item" data-page="display"><span class="material-symbols-outlined" style="vertical-align:middle;margin-right:8px;">monitor</span>显示</div>
                            <div class="set-page-nav-item" data-page="system"><span class="material-symbols-outlined" style="vertical-align:middle;margin-right:8px;">computer</span>系统</div>
                            <div class="set-page-nav-item" data-page="startup"><span class="material-symbols-outlined" style="vertical-align:middle;margin-right:8px;">rocket_launch</span>启动项</div>

                            <div class="set-page-nav-item" data-page="storage"><span class="material-symbols-outlined" style="vertical-align:middle;margin-right:8px;">storage</span>存储</div>

                    </div>
                `;
                document.getElementById('fullscreen-page').classList.add('active');

                const navItems = pageContent.querySelectorAll('.set-page-nav-item');
                navItems.forEach(item => {
                    item.addEventListener('click', () => {
                        navItems.forEach(i => i.classList.remove('active'));
                        item.classList.add('active');
                        const page = item.dataset.page;

            bindSettingsSearch(mainContent) {
                const box = mainContent.closest('.set-content');
                if (!box) return;
                const input = box.querySelector('.set-search input');
                if (!input || input.dataset.searchBound === '1') return;
                input.dataset.searchBound = '1';
                const jump = () => {
                    const q = (input.value || '').trim().toLowerCase();
                    if (!q) return;
                    const navs = Array.from(box.querySelectorAll('.set-nav-item'));
                    for (const nav of navs) {
                        nav.click();
                        const page = box.querySelector('#settings-main-content');
                        const text = ((nav.textContent || '') + ' ' + (page ? page.textContent : '')).toLowerCase();
                        if (text.includes(q)) {
                            this.showToast('已定位到：' + (nav.textContent || '').trim(), 'search');
                            if (page) page.scrollTop = 0;
                            input.blur();
                            return;
                        }
                    }
                    this.showToast('没有找到匹配的设置项', 'search_off');
                };
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); jump(); } });
            }

            bindSettingsEvents(page) {
                const mainContent = document.getElementById('settings-main-content');
                if (!mainContent) return;
                try { this.bindSettingsSearch(mainContent); } catch (e) {}

                if (page === 'system') {
                    const batteryEl = document.getElementById('battery-status');
                    if (batteryEl) this.refreshBatteryInfo(batteryEl);
                    const resultEl = document.getElementById('device-test-result');
                    const camBtn = document.getElementById('camera-test-btn');
                    const micBtn = document.getElementById('mic-test-btn');
                    const stopStream = (key) => {
                        const stream = this[key];
                        if (stream && stream.getTracks) stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
                        this[key] = null;
                    };
                    if (camBtn) {
                        camBtn.addEventListener('click', async () => {
                            const preview = document.getElementById('camera-preview');
                            if (this._cameraStream) {
                                stopStream('_cameraStream');
                                camBtn.textContent = '测试摄像头';
                                if (preview) preview.innerHTML = '';
                                if (resultEl) resultEl.textContent = '摄像头已关闭';
                                return;
                            }
                            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                                if (resultEl) resultEl.textContent = '当前环境不支持摄像头 API';
                                return;
                            }
                            try {
                                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                                this._cameraStream = stream;
                                camBtn.textContent = '关闭摄像头';
                                if (preview) {
                                    preview.innerHTML = '';
                                    const video = document.createElement('video');
                                    video.autoplay = true;
                                    video.muted = true;
                                    video.playsInline = true;
                                    video.srcObject = stream;
                                    video.style.cssText = 'width:320px;max-width:100%;border-radius:8px;border:1px solid #444;';
                                    preview.appendChild(video);
                                }
                                if (resultEl) resultEl.textContent = '摄像头可用：' + (stream.getVideoTracks().map(t => t.label).join(', ') || '已连接');
                            } catch (e) {
                                if (resultEl) resultEl.textContent = '摄像头不可用：' + (e && e.name ? e.name : '未知错误');
                            }
                        });
                    }
                    if (micBtn) {
                        micBtn.addEventListener('click', async () => {
                            if (this._micStream) {
                                stopStream('_micStream');
                                micBtn.textContent = '测试麦克风';
                                if (resultEl) resultEl.textContent = '麦克风已关闭';
                                return;
                            }
                            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                                if (resultEl) resultEl.textContent = '当前环境不支持麦克风 API';
                                return;
                            }
                            try {
                                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                                this._micStream = stream;
                                micBtn.textContent = '关闭麦克风';
                                if (resultEl) resultEl.textContent = '麦克风可用：' + (stream.getAudioTracks().map(t => t.label).join(', ') || '已连接');
                            } catch (e) {
                                if (resultEl) resultEl.textContent = '麦克风不可用：' + (e && e.name ? e.name : '未知错误');
                            }
                        });
                    }
                }

                if (page === 'personalization') {
                    mainContent.querySelectorAll('.wallpaper-preview').forEach(el => {
                        el.addEventListener('click', () => {
                            const color = el.dataset.wall;
                            this.settings.theme = color;
                            document.documentElement.style.backgroundColor = color;
                            document.body.style.backgroundColor = color;
                            this.saveSettings();
                        });
                    });

                    const nightToggle = mainContent.querySelectorAll('.toggle-switch');
                    if (nightToggle[0]) {
                        nightToggle[0].addEventListener('click', () => {
                            nightToggle[0].classList.toggle('toggle-active');
                            this.settings.desktopIconsVisible = nightToggle[0].classList.contains('toggle-active');
                            this.saveSettings();
                            this.renderDesktop();
                            this.showToast(this.settings.desktopIconsVisible ? '桌面图标已显示' : '桌面图标已隐藏', 'apps');
                        });
                    }
                    if (nightToggle[1]) {
                        nightToggle[1].addEventListener('click', () => {
                            nightToggle[1].classList.toggle('toggle-active');
                            this.settings.desktopIconsDraggable = nightToggle[1].classList.contains('toggle-active');
                            this.saveSettings();
                        });
                    }
                    if (nightToggle[2]) {
                        nightToggle[2].addEventListener('click', () => {
                            nightToggle[2].classList.toggle('toggle-active');
                            this.settings.showHiddenFiles = nightToggle[2].classList.contains('toggle-active');
                            this.saveSettings();
                        });
                    }

                    const resetIconsBtn = mainContent.querySelector('#settings-reset-icons');
                    if (resetIconsBtn) {
                        resetIconsBtn.addEventListener('click', () => {
                            this.showSystemDialog('恢复图标位置', '确定要恢复桌面图标到默认位置吗？', () => {
                                localStorage.removeItem('raccoonos_icon_positions');
                                this.iconPositions = {};
                                this.renderDesktop();
                                this.showToast('桌面图标位置已恢复', 'refresh');
                            });
                        });
                    }

                    const dragToggle = mainContent.querySelector('#settings-desktop-drag-toggle');
                    if (dragToggle) {
                        dragToggle.addEventListener('click', () => {
                            dragToggle.classList.toggle('toggle-active');
                            this.settings.desktopIconsDraggable = dragToggle.classList.contains('toggle-active');
                            this.saveSettings();
                            this.renderDesktop();
                            this.showToast(this.settings.desktopIconsDraggable ? '桌面图标可拖动' : '桌面图标已锁定', 'move');
                        });
                    }
                }

                if (page === 'sound') {
                    const volumeSlider = mainContent.querySelector('#settings-volume-slider');
                    if (volumeSlider) {
                        const handleSoundVolumeChange = (val) => {
                            const vol = parseInt(val);
                            this.settings.volume = vol;
                            const displaySpan = mainContent.querySelector('#settings-volume-display');
                            if (displaySpan) displaySpan.textContent = vol + '%';
                            const taskbarSlider = document.getElementById('volume-slider');
                            if (taskbarSlider) taskbarSlider.value = vol;
                            const taskbarValue = document.getElementById('volume-value');
                            if (taskbarValue) taskbarValue.textContent = vol;
                            this.saveSettings();
                        };
                        volumeSlider.addEventListener('input', (e) => handleSoundVolumeChange(e.target.value));
                        volumeSlider.addEventListener('change', (e) => handleSoundVolumeChange(e.target.value));
                    }

                    const sysToggle = mainContent.querySelector('#settings-system-sound-toggle');
                    if (sysToggle) {
                        sysToggle.addEventListener('click', () => {
                            sysToggle.classList.toggle('toggle-active');
                            this.settings.systemSound = sysToggle.classList.contains('toggle-active');
                            this.saveSettings();
                        });
                    }
                    const notifToggle = mainContent.querySelector('#settings-notification-sound-toggle');
                    if (notifToggle) {
                        notifToggle.addEventListener('click', () => {
                            notifToggle.classList.toggle('toggle-active');
                            this.settings.notificationSound = notifToggle.classList.contains('toggle-active');
                            this.saveSettings();
                        });
                    }
                    const nativeNotifToggle = mainContent.querySelector('#settings-native-notification-toggle');
                    if (nativeNotifToggle) {
                        nativeNotifToggle.addEventListener('click', () => {
                            nativeNotifToggle.classList.toggle('toggle-active');
                            this.settings.systemNotifications = nativeNotifToggle.classList.contains('toggle-active');
                            this.saveSettings();
                            if (this.settings.systemNotifications && 'Notification' in window && Notification.permission === 'default') {
                                Notification.requestPermission().catch(() => {});
                            }
                        });
                    }
                }

                if (page === 'display') {
                    const displayToggles = mainContent.querySelectorAll('.toggle-switch');
                    if (displayToggles[0]) {
                        displayToggles[0].addEventListener('click', () => {
                            displayToggles[0].classList.toggle('toggle-active');
                            this.settings.showSeconds = displayToggles[0].classList.contains('toggle-active');
                            this.updateClock();
                            this.saveSettings();
                        });
                    }
                    if (displayToggles[1]) {
                        displayToggles[1].addEventListener('click', () => {
                            displayToggles[1].classList.toggle('toggle-active');
                            this.settings.taskbarTransparent = displayToggles[1].classList.contains('toggle-active');
                            this.saveSettings();
                        });
                    }
                    if (displayToggles[2]) {
                        displayToggles[2].addEventListener('click', () => {
                            displayToggles[2].classList.toggle('toggle-active');
                            this.settings.windowAnimation = displayToggles[2].classList.contains('toggle-active');
                            this.saveSettings();
                        });
                    }

                    const scaleSelect = mainContent.querySelector('select');
                    if (scaleSelect) {
                        scaleSelect.addEventListener('change', (e) => {
                            this.settings.displayScale = e.target.value;
                            document.body.style.fontSize = (parseInt(e.target.value) / 100) * 16 + 'px';
                            this.saveSettings();
                        });
                    }
                }

                if (page === 'startup') {
                    const browserCheck = mainContent.querySelector('#autostart-browser');
                    if (browserCheck) {
                        browserCheck.addEventListener('click', () => {
                            browserCheck.classList.toggle('toggle-active');
                            if (browserCheck.classList.contains('toggle-active')) {
                                if (!this.settings.autostartApps.includes('browser')) this.settings.autostartApps.push(
                                    'browser');
                            } else {

            getSystemInfo() {
                const ua = navigator.userAgent;
                let browserName = '未知浏览器';
                let browserVersion = '';
                if (/Edg\/([\d.]+)/.test(ua)) {
                    browserName = 'Microsoft Edge';
                    browserVersion = RegExp.$1;
                } else if (/OPR\/([\d.]+)/.test(ua)) {
                    browserName = 'Opera';
                    browserVersion = RegExp.$1;
                } else if (/Chrome\/([\d.]+)/.test(ua)) {
                    browserName = 'Chrome';
                    browserVersion = RegExp.$1;
                } else if (/Firefox\/([\d.]+)/.test(ua)) {
                    browserName = 'Firefox';
                    browserVersion = RegExp.$1;
                } else if (/Safari\/([\d.]+)/.test(ua)) {
                    browserName = 'Safari';
                    browserVersion = RegExp.$1;
                }
                let osName = '未知系统';
                if (/Windows NT ([\d.]+)/.test(ua)) {
                    const map = { '10.0': 'Windows 10/11', '6.3': 'Windows 8.1', '6.2': 'Windows 8', '6.1': 'Windows 7' };
                    osName = map[RegExp.$1] || `Windows NT ${RegExp.$1}`;
                } else if (/Mac OS X ([\d_]+)/.test(ua)) {
                    osName = 'macOS ' + RegExp.$1.replace(/_/g, '.');
                } else if (/Android ([\d.]+)/.test(ua)) {
                    osName = 'Android ' + RegExp.$1;
                } else if (/iPhone OS ([\d_]+)/.test(ua)) {
                    osName = 'iOS ' + RegExp.$1.replace(/_/g, '.');
                } else if (/Linux/.test(ua)) {
                    osName = 'Linux';
                }
                const cpu = navigator.hardwareConcurrency || '不可用';
                const memory = (typeof navigator.deviceMemory !== 'undefined') ? navigator.deviceMemory + ' GB' : '不可用';
                const platform = navigator.platform || '不可用';
                const lang = navigator.language || '不可用';
                const online = navigator.onLine ? '在线' : '离线';
                const cores = navigator.hardwareConcurrency || '不可用';
                const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                const connType = connection ? (connection.effectiveType || connection.type || '未知') : 'API 不可用';
                const touchPoints = navigator.maxTouchPoints || 0;
                let storageEst = '不可用';
                if (navigator.storage && navigator.storage.estimate) {
                    navigator.storage.estimate().then(est => {
                        const used = ((est.usage || 0) / 1024 / 1024).toFixed(2);
                        const total = ((est.quota || 0) / 1024 / 1024).toFixed(2);
                        const el = document.querySelector('#storage-estimate');
                        if (el) el.textContent = `${used} MB / ${total} MB`;
                    }).catch(() => {});
                    storageEst = '<span id="storage-estimate">计算中...</span>';
                }
                const cookiesEnabled = navigator.cookieEnabled ? '启用' : '禁用';
                const doNotTrack = navigator.doNotTrack === '1' ? '启用' : '未启用';
                const colorDepth = screen.colorDepth + ' bit';
                const pixelRatio = window.devicePixelRatio || 1;
                const caps = {
                    wakeLock: !!(navigator.wakeLock),
                    idleDetector: 'IdleDetector' in window,
                    notification: 'Notification' in window,
                    clipboard: !!(navigator.clipboard && navigator.clipboard.readText),
                    share: !!navigator.share,
                    fileSystem: 'showDirectoryPicker' in window,
                    mediaSession: 'mediaSession' in navigator,
                    navigation: 'navigation' in window,
                    windowControlsOverlay: 'windowControlsOverlay' in navigator,
                    camera: 'HTMLCameraElement' in window,
                    microphone: 'HTMLMicrophoneElement' in window,
                    viewTransition: 'startViewTransition' in document,
                    cssWindowDrag: this.useNativeWindowDrag || false
                };
                const cpuPerf = (typeof performance.now === 'function')
                    ? `${(performance.now() / 1000).toFixed(1)} 秒` : '不可用';
                return {
                    browserName,
                    browserVersion,
                    osName,
                    cpu,
                    cores,
                    memory,
                    platform,
                    lang,
                    online,
                    connType,
                    touchPoints,
                    storageEst,
                    cookiesEnabled,
                    doNotTrack,
                    colorDepth,
                    pixelRatio,
                    screenRes: `${screen.width} × ${screen.height}`,
                    availScreen: `${screen.availWidth} × ${screen.availHeight}`,
                    viewport: `${window.innerWidth} × ${window.innerHeight}`,
                    colorDepthBits: colorDepth,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '未知',
                    cpuPerf,
                    caps
                };
            }

                const kb = bytes / 1024;
                const percent = Math.min(100, Math.round((kb / 5120) * 100));
                return `
                    <div class="set-page-title">存储</div>
                    <div class="set-section">
                        <div class="set-section-title">本机数据</div>
                        <div class="bg-gray-200 rounded-full h-3 overflow-hidden mb-1">
                            <div class="bg-blue-500 h-full" style="width: ${percent}%"></div>
                        </div>
                        <div style="font-size:12px;color:#777;">已使用 ${kb < 1024 ? kb.toFixed(1) + ' KB' : (kb / 1024).toFixed(2) + ' MB'} · 浏览器 localStorage 配额约 5 MB</div>
                        <div id="storage-detail" style="font-size:12px;color:#777;margin-top:8px;line-height:1.8;"></div>
                    </div>
                    <div class="set-section">
                        <div class="set-section-title">配置</div>
                        <div class="flex gap-3" style="flex-wrap:wrap;">
                            <button id="settings-export-config" class="nt-btn">导出配置</button>
                            <button id="settings-import-config" class="nt-btn">导入配置</button>
                            <button id="settings-clear-all" class="nt-btn">清空全部数据</button>
                        </div>
                    </div>
                `;
            }

            getLocalStorageUsage() {
                let total = 0;
                try {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (!key || !key.startsWith('raccoonos_')) continue;
                        total += (key.length + (localStorage.getItem(key) || '').length) * 2;
                    }
                } catch (e) {}
                return total;
            }

            exportConfig() {
                const data = {};
                try {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (!key || !key.startsWith('raccoonos_')) continue;
                        data[key] = localStorage.getItem(key);
                    }
                } catch (e) {}
                const text = JSON.stringify({ app: 'RaccoonOS', version: '6.3.3', exportedAt: new Date().toISOString(), data }, null, 2);
                try {
                    const blob = new Blob([text], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'raccoonos-config-' + Date.now() + '.json';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                    this.showToast('配置已导出', 'download');
                } catch (e) {
                    this.showSystemDialog('导出配置', '<textarea style="width:100%;height:180px;font-size:12px;">' + text.replace(/</g, '&lt;') + '</textarea>');
                }
            }

            importConfig() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'application/json,.json';
                input.addEventListener('change', async () => {
                    const file = input.files && input.files[0];
                    if (!file) return;
                    try {
                        const parsed = JSON.parse(await file.text());
                        const data = parsed && parsed.data ? parsed.data : parsed;
                        let count = 0;
                        Object.keys(data || {}).forEach(key => {
                            if (!key.startsWith('raccoonos_')) return;
                            localStorage.setItem(key, data[key]);
                            count++;
                        });
                        this.settings = this.loadSettings();
                        this.bookmarks = this.loadBookmarks();
                        this.history = this.loadHistory();
                        this.applySettings();
                        this.renderDesktop();
                        this.showToast('已导入 ' + count + ' 项配置，部分内容刷新后生效', 'upload');
                    } catch (e) {
                        this.showToast('导入失败：文件格式不正确', 'error');
                    }
                });
                input.click();
            }
            showWindowContextMenu(x, y, winObj) {
