                                return;
                            }
                            this.fileSystem[currentPath] = entries.map(e => e.type === 'dir' ?
                                { name: e.name, type: 'dir', path: `${currentPath}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}` } :
                                { name: e.name, type: 'file', content: '' });
                            onRefresh();
                            this.showToast(`已导入 ${entries.length} 项本地文件`, 'folder_open');
                        });
                    });
                }
                menu.querySelector('[data-action="paste"]').addEventListener('click', () => {
                    if (this.copyFile) {
                        const newFile = { ...this.copyFile, name: `副本 - ${this.copyFile.name}` };
                        this.fileSystem[currentPath].push(newFile);
                        this.copyFile = null;
                        this.copyFilePath = null;
                        onRefresh();
                    } else if (this.cutFile) {
                        const srcPath = this.cutFilePath;
                        if (srcPath && srcPath !== currentPath) {
                            const srcIdx = this.fileSystem[srcPath].indexOf(this.cutFile);
                            if (srcIdx !== -1) {
                                this.fileSystem[srcPath].splice(srcIdx, 1);
                                this.fileSystem[currentPath].push(this.cutFile);
                            }
                        }
                        this.cutFile = null;
                        this.cutFilePath = null;
                        onRefresh();
                    }
                    menu.remove();
                });
                menu.querySelector('[data-action="refresh"]').addEventListener('click', () => {
                    onRefresh();
                    menu.remove();
                });
                winEl.appendChild(menu);
                const closeHandler = (e) => { if (!menu.contains(e.target)) menu.remove();
                    document.removeEventListener('click', closeHandler); };
                setTimeout(() => document.addEventListener('click', closeHandler), 0);
            }

            // ----- 浏览器窗口（使用 postMessage 跨域通信）-----
            createBrowserWindow(id) {
                const win = this.createBaseWindow(id, 'public', 'Raccoon Browser');
                const content = win.querySelector('.window-content');
                content.style.position = 'relative';
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.style.overflow = 'hidden';
                content.innerHTML = `
                    <div id="browser-tip-${id}" class="browser-tip" style="flex-shrink:0; display:flex; align-items:center; gap:8px; padding:6px 12px; font-size:11.5px; box-sizing:border-box;">
                        <span class="material-symbols-outlined" style="font-size:16px;flex-shrink:0;">info</span>
                        <span>提示：多数网站禁止被嵌入；被拦截时点错误页的「在容器内新窗口打开」即可。</span>
                        <button class="browser-tip-close" style="margin-left:auto;background:none;border:none;color:inherit;opacity:.6;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0;">✕</button>
                    </div>
                    <div class="browser-toolbar" style="flex-shrink: 0; display: flex; padding: 6px 8px; gap: 4px; box-sizing: border-box; height: 46px; align-items: center;">
                        <button class="browser-nav-back p-1 rounded hover:bg-white/10" title="后退"><span class="material-symbols-outlined text-sm">arrow_back</span></button>
                        <button class="browser-nav-forward p-1 rounded hover:bg-white/10" title="前进"><span class="material-symbols-outlined text-sm">arrow_forward</span></button>
                        <button class="browser-nav-reload p-1 rounded hover:bg-white/10" title="刷新"><span class="material-symbols-outlined text-sm">refresh</span></button>
                        <button class="browser-nav-home p-1 rounded hover:bg-white/10" title="主页"><span class="material-symbols-outlined text-sm">home</span></button>
                        <div class="browser-url-pill flex-1 px-3 flex items-center gap-2" style="min-width:0;">
                            <span class="material-symbols-outlined text-xs text-white/50">lock</span>
                            <input type="text" id="browser-url-${id}" class="bg-transparent flex-1 outline-none text-sm text-white" placeholder="输入网址或搜索" value="" autocomplete="off" spellcheck="false">
                        </div>
                        <button class="browser-go p-1 rounded hover:bg-white/10" title="转到"><span class="material-symbols-outlined text-sm">arrow_forward</span></button>
                        <button class="browser-bookmark p-1 rounded hover:bg-white/10" title="书签"><span class="material-symbols-outlined text-sm">star_border</span></button>
                        <button class="browser-history p-1 rounded hover:bg-white/10" title="历史记录"><span class="material-symbols-outlined text-sm">history</span></button>
                    </div>
                    <div id="browser-progress-${id}" style="flex-shrink:0;height:2px;background:#0078d4;width:0;transition:width .25s ease;"></div>
                    <div id="browser-home-${id}" class="browser-home" style="position:relative;inset:auto;flex:1;overflow-y:auto;box-sizing:border-box;">
                        <div class="logo">🦝</div>
                        <div class="title">Raccoon Browser</div>
                        <div class="search-box">
                            <span class="material-symbols-outlined">search</span>
                            <input type="text" id="browser-home-search-${id}" placeholder="搜索或输入网址">
                        </div>
                        <div class="quick-links" id="browser-quick-${id}"></div>
                        <div style="margin-top: 24px; width: 500px; max-width:86%;">
                            <div class="text-sm opacity-70 mb-2">最近访问</div>
                            <div id="recent-history-${id}" class="flex flex-wrap gap-2"></div>
                        </div>
                        <div style="position: absolute; bottom: 20px; font-size: 12px; opacity: 0.5;">安全浏览 · 无痕模式可用</div>
                    </div>
                    <div id="browser-error-${id}" style="display:none; position:absolute; top:94px; left:0; right:0; bottom:0; background:#1a1a1a; z-index:5; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; padding:40px; box-sizing:border-box;">
                        <div style="font-size:52px;">⚠️</div>
                        <div style="font-size:18px; font-weight:600;">此网页无法在此处显示</div>
                        <div style="font-size:13px; color:#aaa; max-width:460px; line-height:1.6;">该网站可能通过 X-Frame-Options 或 CSP 安全策略禁止被嵌入。某些网站也会因 iframe 第三方 Cookie 限制而无法保持登录状态。</div>
                        <div class="flex gap-2" style="flex-wrap:wrap;justify-content:center;">
                            <button class="browser-error-open" style="background:#0078d4; color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:14px;">在容器内新窗口打开</button>
                            <button class="browser-error-external" style="background:#3a3a3a; color:#fff; border:1px solid #555; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:14px;">在浏览器标签页打开</button>
                            <button class="browser-error-retry" style="background:#3a3a3a; color:#fff; border:1px solid #555; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:14px;">重试</button>
                        </div>
                        <div class="browser-error-hint" style="font-size:11px; color:#888; max-width:460px; line-height:1.6;">提示：需要登录态的网站，建议用「在浏览器标签页打开」在系统浏览器中访问。</div>
                        <div id="browser-error-url-${id}" style="font-size:12px; color:#666; word-break:break-all; max-width:460px;"></div>
                    </div>
                    <div id="browser-ext-${id}" style="display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#ccc; text-align:center; padding:30px; box-sizing:border-box;">
                        <span class="material-symbols-outlined" style="font-size:44px;color:#4da3ff;">open_in_new</span>
                        <div style="font-size:15px;">已在系统浏览器的新标签页中打开</div>
                        <div id="browser-ext-url-${id}" style="font-size:12px;color:#888;word-break:break-all;max-width:460px;"></div>
                        <button class="browser-ext-inline" style="background:#3a3a3a;color:#fff;border:1px solid #555;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;">仍在本窗口内显示</button>
                    </div>
                    <iframe id="browser-frame-${id}" style="flex:1;display:none;border:none;box-sizing:border-box;background:#fff;" name="browser-frame-${id}" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-popups"></iframe>
                `;

                const urlInput = content.querySelector(`#browser-url-${id}`);
                const goBtn = content.querySelector('.browser-go');
                const backBtn = content.querySelector('.browser-nav-back');
                const forwardBtn = content.querySelector('.browser-nav-forward');
                const reloadBtn = content.querySelector('.browser-nav-reload');
                const homeBtn = content.querySelector('.browser-nav-home');
                const bookmarkBtn = content.querySelector('.browser-bookmark');
                const historyBtn = content.querySelector('.browser-history');
                const frame = content.querySelector(`#browser-frame-${id}`);
                const homeDiv = content.querySelector(`#browser-home-${id}`);
                const homeSearch = content.querySelector(`#browser-home-search-${id}`);
                const quickWrap = content.querySelector(`#browser-quick-${id}`);
                const recentDiv = content.querySelector(`#recent-history-${id}`);
                const errorDiv = content.querySelector(`#browser-error-${id}`);
                const errorUrlSpan = content.querySelector(`#browser-error-url-${id}`);
                const extDiv = content.querySelector(`#browser-ext-${id}`);
                const extUrlSpan = content.querySelector(`#browser-ext-url-${id}`);
                const progress = content.querySelector(`#browser-progress-${id}`);
                const tipClose = content.querySelector('.browser-tip-close');
                const tipBar = content.querySelector(`#browser-tip-${id}`);
                if (tipClose && tipBar) tipClose.addEventListener('click', () => { tipBar.style.display = 'none'; });

                const engines = {
                    bing: 'https://www.bing.com/search?q=',
                    google: 'https://www.google.com/search?q=',
                    baidu: 'https://www.baidu.com/s?wd='
                };

                let currentUrl = '';
                let stack = [''];
                let stackIndex = 0;
                let pendingUrl = '';

                const isUrl = (input) => {
                    const s = String(input || '').trim();
                    if (!s) return false;
                    if (/\s/.test(s)) return false;
                    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) return true;
                    if (/^(mailto|tel|data|blob):/i.test(s)) return true;
                    if (/^localhost(:\d+)?(\/.*)?$/i.test(s)) return true;
                    if (/^(\d{1,3}\.){3}\d{1,3}(:\d+)?(\/.*)?$/.test(s)) return true;
                    if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(s)) return true;
                    return false;
                };
                const buildUrl = (input) => {
                    const s = String(input || '').trim();
                    if (!s) return '';
                    if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;
                    return 'https://' + s;
                };
                const searchUrl = (q) => {
                    const key = engines[this.settings.searchEngine] ? this.settings.searchEngine : 'bing';
                    return engines[key] + encodeURIComponent(q);
                };
                const resolveInput = (raw) => {
                    const s = String(raw || '').trim();
                    if (!s) return '';
                    return isUrl(s) ? buildUrl(s) : searchUrl(s);
                };

                const setProgress = (pct) => {
                    if (!progress) return;
                    progress.style.width = pct + '%';
                    if (pct >= 100) setTimeout(() => { progress.style.width = '0'; }, 260);
                };

                const updateNavButtons = () => {
                    backBtn.style.opacity = stackIndex > 0 ? '1' : '0.35';
                    forwardBtn.style.opacity = stackIndex < stack.length - 1 ? '1' : '0.35';
                    backBtn.style.pointerEvents = stackIndex > 0 ? 'auto' : 'none';
                    forwardBtn.style.pointerEvents = stackIndex < stack.length - 1 ? 'auto' : 'none';
                };

                const updateBookmarkIcon = () => {
                    const starred = !!this.bookmarks.find(b => b.url === currentUrl);
                    const icon = bookmarkBtn.querySelector('.material-symbols-outlined');
                    if (icon) icon.textContent = starred ? 'star' : 'star_border';
                    bookmarkBtn.style.color = starred ? '#ffd54f' : '';
                };

                const renderQuickLinks = () => {
                    quickWrap.innerHTML = this.bookmarks.length ? this.bookmarks.map(b =>
                        `<div class="quick-link" data-url="${b.url}" title="${b.url}"><span class="material-symbols-outlined text-blue-500">language</span><span>${b.title || b.url}</span></div>`
                    ).join('') : '<div style="font-size:12px;opacity:.5;">还没有书签，浏览网页时点星标即可添加</div>';
                    quickWrap.querySelectorAll('.quick-link').forEach(el => {
                        el.addEventListener('click', () => navigate(el.dataset.url));
                        el.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            const url = el.dataset.url;
                            this.showLinkContextMenu(e.clientX, e.clientY, url, null);
                        });
                    });
                };
                const renderRecent = () => {
                    recentDiv.innerHTML = this.history.slice(0, 6).map(h =>
                        `<div class="text-xs bg-white/10 px-2 py-1 rounded-full cursor-pointer hover:bg-white/20" data-url="${h.url}" title="${h.url}">${h.title || h.url}</div>`
                    ).join('') || '<div style="font-size:12px;opacity:.4;">暂无记录</div>';
                    recentDiv.querySelectorAll('[data-url]').forEach(el => {
                        el.addEventListener('click', () => navigate(el.dataset.url));
                    });
                };

                const showHome = () => {
                    currentUrl = '';
                    urlInput.value = '';
                    frame.src = 'about:blank';
                    frame.style.display = 'none';
                    errorDiv.style.display = 'none';
                    extDiv.style.display = 'none';
                    homeDiv.style.display = 'block';
                    renderQuickLinks();
                    renderRecent();
                    updateBookmarkIcon();
                    win.querySelector('.window-title').innerHTML = '<span class="material-symbols-outlined text-sm">public</span> Raccoon Browser';
                };

                const showBlocked = (url) => {
                    frame.style.display = 'none';
                    homeDiv.style.display = 'none';
                    extDiv.style.display = 'none';
                    errorDiv.style.display = 'flex';
                    errorUrlSpan.textContent = url || '';
                };

                const applyUrlToFrame = (url) => {
                    currentUrl = url;
                    urlInput.value = url;
                    homeDiv.style.display = 'none';
                    errorDiv.style.display = 'none';
                    extDiv.style.display = 'none';
                    frame.style.display = 'block';
                    setProgress(25);
                    pendingUrl = url;
                    try {
                        frame.src = url;
                    } catch (e) {
                        showBlocked(url);
                    }
                    updateBookmarkIcon();
                    try {
                        const host = url.replace(/^[a-z]+:\/\//i, '').split('/')[0];
                        win.querySelector('.window-title').innerHTML = '<span class="material-symbols-outlined text-sm">public</span> ' + host;
                    } catch (e) {}
                    localStorage.setItem('raccoonos_browser_url', url);
                };

                const pushToStack = (url) => {
                    if (stack[stackIndex] === url) return;
                    stack = stack.slice(0, stackIndex + 1);
                    stack.push(url);
                    stackIndex = stack.length - 1;
                    updateNavButtons();
                };

                const go = (url, push) => {
                    if (!url) return;
                    if (this.settings.externalOpen) {
                        const nativeOpen = window.__raccoonNativeOpen || window.open;
                        try { nativeOpen.call(window, url, '_blank', 'noopener'); } catch (e) {}
                        currentUrl = url;
                        urlInput.value = url;
                        homeDiv.style.display = 'none';
                        errorDiv.style.display = 'none';
                        frame.style.display = 'none';
                        extDiv.style.display = 'flex';
                        extUrlSpan.textContent = url;
                        if (push) pushToStack(url);
                        this.addToHistory(url, url);
                        localStorage.setItem('raccoonos_browser_url', url);
                        updateBookmarkIcon();
                        return;
                    }
                    applyUrlToFrame(url);
                    if (push) pushToStack(url);
                    this.addToHistory(url, url);
                    renderRecent();
                };

                const navigate = (raw, push) => {
                    const url = resolveInput(raw);
                    if (!url) return;
                    go(url, push !== false);
                };

                goBtn.onclick = () => navigate(urlInput.value);
                urlInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); navigate(urlInput.value); }
                });
                homeSearch.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); navigate(homeSearch.value); }
                });

                backBtn.onclick = () => {
                    if (stackIndex <= 0) return;
                    stackIndex--;
                    updateNavButtons();
                    const url = stack[stackIndex];
                    if (!url) { showHome(); return; }
                    applyUrlToFrame(url);
                    this.addToHistory(url, url);
                };
                forwardBtn.onclick = () => {
                    if (stackIndex >= stack.length - 1) return;
                    stackIndex++;
                    updateNavButtons();
                    const url = stack[stackIndex];
                    if (!url) { showHome(); return; }
                    applyUrlToFrame(url);
                    this.addToHistory(url, url);
                };
                reloadBtn.onclick = () => {
                    if (!currentUrl) { showHome(); return; }
                    applyUrlToFrame(currentUrl);
                };
                homeBtn.onclick = () => {
                    stack = [''];
                    stackIndex = 0;
                    updateNavButtons();
                    showHome();
                };

                bookmarkBtn.addEventListener('click', () => {
                    const url = currentUrl || urlInput.value.trim();
                    if (!url) { this.showToast('先打开一个网页再收藏', 'star_border'); return; }
                    const existing = this.bookmarks.findIndex(b => b.url === url);
                    if (existing !== -1) {
                        this.bookmarks.splice(existing, 1);
                        this.saveBookmarks();
                        updateBookmarkIcon();
                        renderQuickLinks();
                        this.showToast('已取消收藏', 'star_border');
                        return;
                    }
                    let host = url;
                    try { host = new URL(url).hostname; } catch (e) {}
                    this.showSystemDialog('添加书签', '书签名称（默认使用域名）：', (title) => {
                        this.bookmarks.push({ title: (title || '').trim() || host, url });
                        this.saveBookmarks();
                        updateBookmarkIcon();
                        renderQuickLinks();
                        this.showToast('书签已添加', 'star');
                    }, true);
                });

                historyBtn.addEventListener('click', () => {
                    this.showBrowserPanel('历史记录', this.history, 'history', () => {
                        renderRecent();
                    }, (it) => navigate(it.url));
                });

                content.querySelector('.browser-error-open').addEventListener('click', () => {
                    const target = currentUrl || urlInput.value;
                    if (target) this.openBrowserInContainer(target);
                });
                content.querySelector('.browser-error-external').addEventListener('click', () => {
                    const target = currentUrl || urlInput.value;
                    if (!target) return;
                    const nativeOpen = window.__raccoonNativeOpen || window.open;
                    try { nativeOpen.call(window, target, '_blank', 'noopener'); } catch (e) {}
                });
                content.querySelector('.browser-error-retry').addEventListener('click', () => {
                    if (currentUrl) applyUrlToFrame(currentUrl);
                });
                content.querySelector('.browser-ext-inline').addEventListener('click', () => {
                    const saved = this.settings.externalOpen;
                    this.settings.externalOpen = false;
                    if (currentUrl) applyUrlToFrame(currentUrl);
                    this.settings.externalOpen = saved;
                    this.showToast('已切换到容器内显示', 'public');
                });

                content.addEventListener('contextmenu', (e) => {
                    const link = e.target && e.target.closest ? e.target.closest('a[href], [data-url]') : null;
                    if (!link) return;
                    const url = link.getAttribute('href') || link.dataset.url;
                    if (url && /^[a-z]+:\/\//i.test(url)) {
                        e.preventDefault();
                        this.showLinkContextMenu(e.clientX, e.clientY, url, null);
                    }
                });

                frame.addEventListener('load', () => {
                    setProgress(100);
                    if (frame.src === 'about:blank' || frame.src === 'about:srcdoc') return;
                    let blocked = false;
                    try {
                        const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
                        if (doc && doc.body) {
                            const bodyText = (doc.body.textContent || '').trim();
                            const low = bodyText.toLowerCase();
                            if (bodyText.length < 60 && /(refused to (connect|display)|x-frame-options|frame-ancestors|blocked by|denied by|禁止|拒绝)/.test(low)) blocked = true;
                            if (doc.body.children.length === 0 && bodyText.length < 10) blocked = true;
                            const loc = frame.contentWindow.location.href;
                            if (loc && loc !== 'about:blank' && loc !== currentUrl) {
                                currentUrl = loc;
                                urlInput.value = loc;
                                pushToStack(loc);
                                updateBookmarkIcon();
                            }
                            const t = doc.title;
                            if (t) win.querySelector('.window-title').innerHTML = '<span class="material-symbols-outlined text-sm">public</span> ' + t;
                        }
                    } catch (e) {
                        blocked = false;
                    }
                    if (blocked) showBlocked(currentUrl || pendingUrl);
                    if (!blocked && tipBar && tipBar.style.display !== 'none') {
                        setTimeout(() => { if (tipBar) tipBar.style.display = 'none'; }, 1600);
                    }
                    try { this.injectIframeProxy(id); } catch (e) {}
                });

                frame.addEventListener('error', () => {
                    setProgress(100);
                    showBlocked(currentUrl || pendingUrl);
                });

                const onMessage = (e) => {
                    try {
                        if (e.source !== frame.contentWindow) return;
                    } catch (err) { return; }
                    const d = e.data;
                    if (!d || typeof d !== 'object') return;
                    if (d.type === 'urlUpdated' && d.url) {
                        if (d.url !== currentUrl && d.url !== 'about:blank') {
                            currentUrl = d.url;
                            urlInput.value = d.url;
                            pushToStack(d.url);
                            this.addToHistory(d.url, d.url);
                            renderRecent();
                            updateBookmarkIcon();
                        }
                    }
                };
                window.addEventListener('message', onMessage);

                content.addEventListener('keydown', (e) => {
                    const mod = e.ctrlKey || e.metaKey;
                    if (mod && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); urlInput.focus(); urlInput.select(); }
                    else if (mod && (e.key === 'r' || e.key === 'R')) { e.preventDefault(); reloadBtn.onclick(); }
                    else if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); backBtn.onclick(); }
                    else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); forwardBtn.onclick(); }
                });

                urlInput.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
                urlInput.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
                    if (url) navigate(url);
                });

                const originalRemove = win.remove.bind(win);
                win.remove = () => {
                    try { window.removeEventListener('message', onMessage); } catch (e) {}
                    originalRemove();
                };

                showHome();
                updateNavButtons();
                win._navigate = (u) => navigate(u, true);
                win._openInNewTab = (u) => {
                    const target = u || currentUrl || urlInput.value;
                    if (!target) return;
                    const nativeOpen = window.__raccoonNativeOpen || window.open;
                    try { nativeOpen.call(window, resolveInput(target), '_blank', 'noopener'); } catch (e) {}
                };
                win._showHome = showHome;

                if (this.settings.autoRestoreUrl) {
                    const savedUrl = localStorage.getItem('raccoonos_browser_url');
                    if (savedUrl) setTimeout(() => { if (!currentUrl) navigate(savedUrl); }, 60);
                }
                return win;
            }

            showBrowserPanel(title, items, kind, onChange, onPick) {
                this.removeAllContextMenus();
                const existing = document.querySelector('.browser-panel-overlay');
                if (existing) existing.remove();
                const overlay = document.createElement('div');
                overlay.className = 'browser-panel-overlay';
                overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100002;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;';
                const rows = (items || []).map((it, i) => {
                    const time = it.time ? new Date(it.time).toLocaleString('zh-CN') : '';
                    return `<div class="bp-row" data-index="${i}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:#eee;">

            injectIframeProxy(id) {
                const frame = document.querySelector(`#browser-frame-${id}`);
                if (!frame) return;
                try {
                    const doc = frame.contentDocument || frame.contentWindow.document;
                    const script = doc.createElement('script');
                    script.textContent = `
 (function() {
    function sendMessage(type, data) {
        window.parent.postMessage({ type, ...data }, '*');
    }
    function absUrl(u) {
        try { return new URL(u, window.location.href).href; } catch (e) { return u; }
    }
    window.addEventListener('load', function() {
        sendMessage('urlUpdated', { url: window.location.href });
    });
    setTimeout(function() {
        sendMessage('urlUpdated', { url: window.location.href });
    }, 100);
    if (document.requestStorageAccess) {
        document.requestStorageAccess().then(function() {
            sendMessage('storageAccess', { granted: true });
        }).catch(function() {
            sendMessage('storageAccess', { granted: false });
        });
    }
    var origOpen = window.open;
    if (typeof window.open === 'function') {
        window.open = function(url, target, features) {
            if (url && /^https?:/i.test(String(url))) {
                sendMessage('openInContainer', { url: absUrl(String(url)) });
            }
            return null;
        };
        window.open.toString = function() { return 'function open() { [native code] }'; };
    }
    document.addEventListener('click', function(ev) {
        var a = ev.target && ev.target.closest ? ev.target.closest('a[target]') : null;
        if (!a) return;
        var t = (a.getAttribute('target') || '').toLowerCase();
        if (t === '_blank' || t === '_top' || t === '_parent') {
            ev.preventDefault();
            ev.stopPropagation();
            var href = a.getAttribute('href');
            if (href && /^https?:/i.test(href)) {
                sendMessage('openInContainer', { url: absUrl(href) });
            }
        }
    }, true);
    document.addEventListener('submit', function(ev) {
        var f = ev.target;
        if (f instanceof HTMLFormElement) {
            var t = (f.getAttribute('target') || '').toLowerCase();
            if (t === '_blank' || t === '_top' || t === '_parent') {
                ev.preventDefault();
                var action = f.getAttribute('action');
                if (action && /^https?:/i.test(action)) {
                    sendMessage('openInContainer', { url: absUrl(action) });
                }
            }
        }
    }, true);
    document.addEventListener('contextmenu', function(ev) {
        var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
        if (!a) return;
        var href = a.getAttribute('href');
        if (!href || !/^https?:/i.test(href)) return;
        ev.preventDefault();
        ev.stopPropagation();
        sendMessage('showLinkMenu', { url: absUrl(href), x: ev.clientX, y: ev.clientY });
    }, true);
})();
`;
                    doc.head.appendChild(script);
                } catch (e) {}
            }

            showAddressBarMenu(x, y, urlInput, win) {
                this.removeAllContextMenus();
                const menu = document.createElement('div');
                menu.className = 'context-menu';
                menu.style.position = 'absolute';
                menu.style.zIndex = '1000';
                let top = y;
                const menuHeight = 100;
                if (top + menuHeight > win.offsetHeight) top = y - menuHeight;
                menu.style.left = x + 'px';
                menu.style.top = top + 'px';
                menu.innerHTML =
                    `<div class="context-menu-item" data-action="cut">剪切</div><div class="context-menu-item" data-action="copy">复制</div><div class="context-menu-item" data-action="paste">粘贴</div>`;
                const performCut = async () => {
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(urlInput.value);
                        } else {
                            urlInput.focus();
                            urlInput.select();
                            document.execCommand('cut');
                        }
                    } catch (e) { urlInput.focus();
                        urlInput.select();
                        document.execCommand('cut'); }
                    menu.remove();
                };
                const performCopy = async () => {
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(urlInput.value);
                        } else {
                            urlInput.focus();
                            urlInput.select();
                            document.execCommand('copy');
                        }
                    } catch (e) { urlInput.focus();
                        urlInput.select();
                        document.execCommand('copy'); }
                    menu.remove();
                };
                const performPaste = async () => {
                    try {
                        const text = await navigator.clipboard.readText();
                        const start = urlInput.selectionStart;
                        const end = urlInput.selectionEnd;
                        urlInput.value = urlInput.value.substring(0, start) + text + urlInput.value.substring(end);
                        urlInput.setSelectionRange(start + text.length, start + text.length);
                    } catch (e) { document.execCommand('paste'); }
                    menu.remove();
                };
                menu.querySelector('[data-action="cut"]').addEventListener('click', performCut);
                menu.querySelector('[data-action="copy"]').addEventListener('click', performCopy);
                menu.querySelector('[data-action="paste"]').addEventListener('click', performPaste);
                win.querySelector('.window-content').appendChild(menu);
                const closeHandler = (e) => { if (!menu.contains(e.target)) menu.remove();
                    document.removeEventListener('click', closeHandler); };
                setTimeout(() => document.addEventListener('click', closeHandler), 0);
            }

            showBrowserContentMenu(x, y, frame, win) {
                this.removeAllContextMenus();
                const menu = document.createElement('div');
                menu.className = 'context-menu';
                menu.style.position = 'absolute';
                menu.style.zIndex = '1000';
                let top = y;
                const menuHeight = 100;
                if (top + menuHeight > win.offsetHeight) top = y - menuHeight;
                menu.style.left = x + 'px';
                menu.style.top = top + 'px';
                menu.innerHTML =
                    `<div class="context-menu-item" data-action="back">返回</div><div class="context-menu-item" data-action="forward">前进</div><div class="context-menu-item" data-action="reload">重新加载</div>`;
                const handleBack = () => { try { frame.contentWindow.history.back(); } catch(e) {}
                    menu.remove(); };
                const handleForward = () => { try { frame.contentWindow.history.forward(); } catch(e) {}
                    menu.remove(); };
                const handleReload = () => {
                    try {
                        const w = frame.contentWindow;
                        if (w && w.location && typeof w.location.reload === 'function') {
                            w.location.reload();
                            menu.remove();
                            return;
                        }
                    } catch (e) {}
                    const src = frame.src;
                    if (!src || src === 'about:blank') { menu.remove(); return; }
                    frame.src = 'about:blank';
                    setTimeout(() => { frame.src = src; menu.remove(); }, 10);
                };
                menu.querySelector('[data-action="back"]').addEventListener('click', handleBack);
                menu.querySelector('[data-action="forward"]').addEventListener('click', handleForward);
                menu.querySelector('[data-action="reload"]').addEventListener('click', handleReload);
                win.querySelector('.window-content').appendChild(menu);
                const closeHandler = (e) => { if (!menu.contains(e.target)) menu.remove();
                    document.removeEventListener('click', closeHandler); };
                setTimeout(() => document.addEventListener('click', closeHandler), 0);
            }

            // 终端（增强命令）
            createTerminalWindow(id) {
                const win = this.createBaseWindow(id, 'terminal', 'Raccoon Terminal');
                const content = win.querySelector('.window-content');
                content.style.background = '#0a2a1a';
                content.style.fontFamily = 'monospace';
                const terminalDiv = document.createElement('div');
                terminalDiv.className = 'terminal-body';
                terminalDiv.style.height = '100%';
                terminalDiv.innerHTML = `<div class="terminal-line"><span class="terminal-prompt">🦝></span><span class="terminal-output">Raccoon Terminal v2.0 - 增强版</span></div>
                                         <div class="terminal-line"><span class="terminal-prompt">🦝></span><span class="terminal-output">输入 help 查看所有命令</span></div>`;
                const inputLine = document.createElement('div');
                inputLine.className = 'terminal-line';
                inputLine.innerHTML = `<span class="terminal-prompt">🦝></span><input type="text" class="terminal-input" autofocus>`;
                terminalDiv.appendChild(inputLine);
                const inputField = inputLine.querySelector('input');
                let currentDir = '/home/raccoon';
                const fs = {
                    '/home/raccoon': { type: 'dir', children: ['Documents', 'Downloads', 'Pictures'] },
                    '/home/raccoon/Documents': { type: 'dir', children: ['readme.txt'] },
                    '/home/raccoon/Documents/readme.txt': { type: 'file', content: 'Welcome to Raccoon OS!' }
                };
                const history = [];
                let historyIndex = -1;
                const executeCommand = (cmd) => {
                    const outputLine = document.createElement('div');
                    outputLine.className = 'terminal-line';
                    outputLine.innerHTML = `<span class="terminal-prompt">🦝></span><span class="terminal-output">${cmd}</span>`;
                    terminalDiv.insertBefore(outputLine, inputLine);
                    const resultLine = document.createElement('div');
                    resultLine.className = 'terminal-line';
                    let output = '';
                    const args = cmd.trim().split(/\s+/);
                    const command = args[0].toLowerCase();
                    switch (command) {
                        case 'help':
                            output = '可用命令: help, clear, ls, cd, pwd, mkdir, touch, cat, rm, echo, date, hello, version, exit';
                            break;
                        case 'clear':
                            terminalDiv.innerHTML = '';
                            terminalDiv.appendChild(inputLine);
                            inputField.value = '';
                            inputField.focus();
                            return;
                        case 'ls':
                            const parts = currentDir.split('/');
                            const current = fs[currentDir];
                            if (current && current.type === 'dir') output = current.children.join('  ');
                            else output = '目录不存在';
                            break;
                        case 'cd':
                            if (args[1]) {
                                let newPath = args[1];
                                if (newPath === '..') {
                                    const newDir = currentDir.substring(0, currentDir.lastIndexOf('/'));
                                    if (newDir) currentDir = newDir;
                                } else if (newPath === '/') {
                                    currentDir = '/home/raccoon';
                                } else {
                                    const target = `${currentDir}/${newPath}`;
                                    if (fs[target] && fs[target].type === 'dir') currentDir = target;
                                    else output = `cd: ${newPath}: 不是目录`;
                                }
                            }
                            break;
                        case 'pwd':
                            output = currentDir;
                            break;
                        case 'mkdir':
                            if (args[1]) {
                                const newDir = `${currentDir}/${args[1]}`;
                                if (!fs[newDir]) {
                                    fs[newDir] = { type: 'dir', children: [] };
                                    fs[currentDir].children.push(args[1]);
                                    output = `目录 ${args[1]} 已创建`;
                                } else output = `目录已存在`;
                            }
                            break;
                        case 'touch':
                            if (args[1]) {
                                const newFile = `${currentDir}/${args[1]}`;
                                if (!fs[newFile]) {
                                    fs[newFile] = { type: 'file', content: '' };
                                    fs[currentDir].children.push(args[1]);
                                    output = `文件 ${args[1]} 已创建`;
                                } else output = `文件已存在`;
                            }
                            break;
                        case 'cat':
                            if (args[1]) {
                                const filePath = `${currentDir}/${args[1]}`;
                                if (fs[filePath] && fs[filePath].type === 'file') output = fs[filePath].content ||
                                    '(空文件)';
                                else output = `cat: ${args[1]}: 文件不存在`;
                            }
                            break;
                        case 'rm':
                            if (args[1]) {
                                const target = `${currentDir}/${args[1]}`;
                                if (fs[target]) {
                                    delete fs[target];
                                    fs[currentDir].children = fs[currentDir].children.filter(c => c !== args[1]);
                                    output = `已删除 ${args[1]}`;
                                } else output = `rm: ${args[1]}: 不存在`;
                            }
                            break;
                        case 'echo':
                            output = args.slice(1).join(' ');
                            break;
                        case 'date':
                            output = new Date().toString();
                            break;
                        case 'hello':
                            output = 'Hello, Raccoon User! Welcome to Raccoon OS.';
                            break;
                        case 'version':
                            output = 'Raccoon OS Terminal v2.0 (2026.06)';
                            break;
                        case 'exit':
                            this.closeWindow(this.windows.find(w => w.id === id));
                            return;
                        default:
                            output = `未知命令: ${cmd}. 输入 help 查看帮助。`;
                    }
                    resultLine.innerHTML = `<span class="terminal-prompt"></span><span class="terminal-output">${output}</span>`;
                    terminalDiv.insertBefore(resultLine, inputLine);
                    terminalDiv.scrollTop = terminalDiv.scrollHeight;
                    inputField.value = '';
                    inputField.focus();
                    history.push(cmd);
                    historyIndex = history.length;
                };
                inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') executeCommand(inputField
                    .value); });
                inputField.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowUp') {
                        if (historyIndex > 0) { historyIndex--;
                            inputField.value = history[historyIndex]; }
                        e.preventDefault();
                    } else if (e.key === 'ArrowDown') {
                        if (historyIndex < history.length - 1) { historyIndex++;
                            inputField.value = history[historyIndex]; } else { historyIndex = history.length;
                            inputField.value = ''; }
                        e.preventDefault();
                    }
                });
                content.appendChild(terminalDiv);
                return win;
            }
