                            } else {
                                el.classList.toggle('active');
                                this.showToast(`${el.querySelector('span:last-child').textContent} 已${el.classList.contains('active') ? '开启' : '关闭'}`, 'toggle_on');
                            }
                        });
                    });
                }

                const trayWifi = document.getElementById('tray-wifi');
                const trayBt = document.getElementById('tray-bluetooth');
                if (trayWifi) {
                    trayWifi.addEventListener('click', (e) => { e.stopPropagation();
                        const on = !trayWifi.classList.contains('active');
                        trayWifi.classList.toggle('active');
                        const actionBtn = notifCenter ? notifCenter.querySelector('.notif-action[data-act="wifi"]') : null;
                        if (actionBtn) actionBtn.classList.toggle('active', on);
                        this.showToast(on ? 'WiFi 已连接' : 'WiFi 已断开', 'wifi');
                    });
                }
                if (trayBt) {
                    trayBt.addEventListener('click', (e) => { e.stopPropagation();
                        const on = !trayBt.classList.contains('active');
                        trayBt.classList.toggle('active');
                        const actionBtn = notifCenter ? notifCenter.querySelector('.notif-action[data-act="bluetooth"]') : null;
                        if (actionBtn) actionBtn.classList.toggle('active', on);
                        this.showToast(on ? '蓝牙已开启' : '蓝牙已关闭', 'bluetooth');
                    });
                }

                const volBtn = document.getElementById('volume-btn');
                const volPopup = document.getElementById('volume-popup');
                volBtn.addEventListener('click', (e) => { e.stopPropagation();
                    volPopup.classList.toggle('hidden'); });
                const volSlider = document.getElementById('volume-slider');
                volSlider.value = this.settings.volume;
                const handleVolumeChange = (val) => {
                    this.settings.volume = parseInt(val);
                    this.saveSettings();
                    document.getElementById('volume-value').innerText = val;
                    const settingsVolDisplay = document.getElementById('settings-volume-display');
                    if (settingsVolDisplay) settingsVolDisplay.textContent = val + '%';
                    const settingsVolSlider = document.getElementById('settings-volume-slider');
                    if (settingsVolSlider) settingsVolSlider.value = val;
                    document.querySelectorAll('audio, video').forEach(el => el.volume = val / 100);
                };
                volSlider.addEventListener('input', (e) => handleVolumeChange(e.target.value));
                volSlider.addEventListener('change', (e) => handleVolumeChange(e.target.value));
                document.addEventListener('click', () => volPopup.classList.add('hidden'));

                document.getElementById('taskmgr-btn').addEventListener('click', () => {
                    this.openTaskMgr();
                });

                const taskbarEl = document.getElementById('taskbar');
                taskbarEl.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.target.closest('.taskbar-app')) return;
                    this.showTaskbarContextMenu(e.clientX, e.clientY);
                });

                const desktopArea = document.getElementById('desktop-area');

                desktopArea.addEventListener('click', (e) => {
                    if (e.target === desktopArea || e.target.id === 'desktop-area') {
                        this.deselectAllIcons();
                    }
                });

                desktopArea.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    const windows = document.querySelectorAll('.window');
                    for (const win of windows) {
                        const rect = win.getBoundingClientRect();
                        if (e.clientX >= rect.left && e.clientX <= rect.right &&
                            e.clientY >= rect.top && e.clientY <= rect.bottom) {
                            return;
                        }
                    }
                    const iconEl = e.target.closest('.desktop-icon');
                    if (iconEl) {
                        this.showDesktopIconContextMenu(e, iconEl);
                        return;
                    }
                    this.removeAllContextMenus();
                    const menu = document.createElement('div');
                    menu.className = 'context-menu';
                    menu.style.position = 'absolute';
                    menu.style.zIndex = '500';
                    let top = 0;
                    menu.innerHTML = `
                        <div class="context-menu-item" data-action="view">查看</div>
                        <div class="context-menu-item" data-action="sortby">排序方式</div>
                        <div class="context-menu-divider"></div>
                        <div class="context-menu-item" data-action="newfolder">新建文件夹</div>
                        <div class="context-menu-item" data-action="newfile">新建文本文档</div>
                        <div class="context-menu-divider"></div>
                        <div class="context-menu-item" data-action="refresh">刷新</div>
                        <div class="context-menu-divider"></div>
                        <div class="context-menu-item" data-action="settings">显示设置</div>
                    `;
                    menu.querySelector('[data-action="refresh"]').addEventListener('click', () => {
                        this.refreshDesktop();
                        menu.remove();
                    });
                    menu.querySelector('[data-action="settings"]').addEventListener('click', () => {
                        this.openApp('settings');
                        menu.remove();
                    });
                    menu.querySelector('[data-action="newfolder"]').addEventListener('click', () => {
                        this.showSystemDialog('新建文件夹', '请输入文件夹名称:', (name) => {
                            if (name) {
                                if (!this.fileSystem['desktop']) this.fileSystem['desktop'] = [];
                                this.fileSystem['desktop'].push({ name, type: 'dir', path: 'desktop_' + Date.now() });
                                this.showSystemDialog('创建成功', `文件夹 "${name}" 已创建在桌面`);
                                this.openApp('filemanager');
                            }
                        }, true);
                        menu.remove();
                    });
                    menu.querySelector('[data-action="newfile"]').addEventListener('click', () => {
                        this.showSystemDialog('新建文本文档', '请输入文件名:', (name) => {
                            if (name) {
                                if (!this.fileSystem['desktop']) this.fileSystem['desktop'] = [];
                                this.fileSystem['desktop'].push({ name, type: 'file', content: '' });
                                this.showSystemDialog('创建成功', `文件 "${name}" 已创建在桌面`);
                                this.openApp('filemanager');
                            }
                        }, true);
                        menu.remove();
                    });
                    menu.querySelector('[data-action="view"]').addEventListener('click', () => {
                        menu.remove();
                        const viewMenu = document.createElement('div');
                        viewMenu.className = 'context-menu';
                        viewMenu.style.position = 'absolute';
                        viewMenu.style.zIndex = '501';
                        viewMenu.style.left = (e.clientX + 80) + 'px';
                        viewMenu.style.top = top + 'px';
                        viewMenu.innerHTML = `
                            <div class="context-menu-item" data-action="large">大图标</div>
                            <div class="context-menu-item" data-action="small">小图标</div>
                        `;
                        viewMenu.querySelector('[data-action="large"]').addEventListener('click', () => {
                            document.querySelectorAll('.desktop-icon').forEach(i => {
                                i.style.width = '80px';
                                i.querySelector('span:first-child, img:first-child').style.fontSize = '36px';
                            });
                            viewMenu.remove();
                        });
                        viewMenu.querySelector('[data-action="small"]').addEventListener('click', () => {
                            document.querySelectorAll('.desktop-icon').forEach(i => {
                                i.style.width = '60px';
                                i.querySelector('span:first-child, img:first-child').style.fontSize = '24px';
                            });
                            viewMenu.remove();
                        });
                        document.body.appendChild(viewMenu);
                        const close = (e) => { if (!viewMenu.contains(e.target)) viewMenu.remove();
                            document.removeEventListener('click', close); };
                        setTimeout(() => document.addEventListener('click', close), 0);
                    });
                    menu.querySelector('[data-action="sortby"]').addEventListener('click', () => {
                        menu.remove();
                        const sortMenu = document.createElement('div');
                        sortMenu.className = 'context-menu';
                        sortMenu.style.position = 'absolute';
                        sortMenu.style.zIndex = '501';
                        sortMenu.style.left = (e.clientX + 80) + 'px';
                        sortMenu.style.top = top + 'px';
                        sortMenu.innerHTML = `
                            <div class="context-menu-item" data-action="name">按名称排序</div>
                            <div class="context-menu-item" data-action="type">按类型排序</div>
                        `;
                        sortMenu.querySelector('[data-action="name"]').addEventListener('click', () => {
                            this.desktopIcons.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
                            this.renderDesktop();
                            sortMenu.remove();
                        });
                        sortMenu.querySelector('[data-action="type"]').addEventListener('click', () => {
                            this.desktopIcons.sort((a, b) => a.app.localeCompare(b.app));
                            this.renderDesktop();
                            sortMenu.remove();
                        });
                        document.body.appendChild(sortMenu);
                        const close = (e) => { if (!sortMenu.contains(e.target)) sortMenu.remove();
                            document.removeEventListener('click', close); };
                        setTimeout(() => document.addEventListener('click', close), 0);
                    });
                    document.body.appendChild(menu);
                    const mw = menu.offsetWidth;
                    const mh = menu.offsetHeight;
                    top = e.clientY + mh > window.innerHeight - 4 ? e.clientY - mh : e.clientY;
                    let left = e.clientX;
                    if (left + mw > window.innerWidth - 4) left = window.innerWidth - mw - 4;
                    menu.style.left = Math.max(4, left) + 'px';
                    menu.style.top = Math.max(4, top) + 'px';

                    const close = (e) => { if (!menu.contains(e.target)) menu.remove();
                        document.removeEventListener('click', close); };
                    setTimeout(() => document.addEventListener('click', close), 0);
                });

                document.addEventListener('keydown', (e) => {
                    if (this.lockScreenEl || this.entryConfirmEl) {
                        if (e.key === 'Meta') e.preventDefault();
                        return;
                    }
                    const activeEl = document.activeElement;
                    const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable);

                    if (e.key === 'F1') {
                        e.preventDefault();
                        this.showHelp();
                        return;
                    }

                    if (e.key === 'Meta') {
                        this.metaHeld = true;
                        this.metaUsed = false;
                        e.preventDefault();
                        return;
                    }

                    if (e.metaKey) {
                        switch (e.key.toLowerCase()) {
                            case 'e':
                                e.preventDefault();
                                this.openApp('filemanager');
                                this.metaUsed = true;
                                this.showToast('打开文件管理器', 'folder');
                                return;
                            case 'r':
                                e.preventDefault();
                                this.runProgram();
                                this.metaUsed = true;
                                this.showToast('运行', 'play_arrow');
                                return;
                            case 'd':
                                e.preventDefault();
                                this.minimizeAllWindows();
                                this.metaUsed = true;
                                this.showToast('显示桌面', 'desktop_windows');
                                return;
                            case 'l':
                                e.preventDefault();
                                this.lockScreen();
                                this.metaUsed = true;
                                return;
                            case 'a':
                                e.preventDefault();
                                this.toggleNotifCenter();
                                this.metaUsed = true;
                                return;
                        }
                    }

                    if (e.altKey && e.key === 'F4') {
                        e.preventDefault();
                        if (this.activeWindow) {
                            this.showToast('关闭窗口', 'close');
                            this.closeActiveWindow();
                        }
                        return;
                    }

                    if (e.altKey && e.key === 'Tab') {
                        e.preventDefault();
                        this.cycleWindow();
                        return;
                    }

                    if (e.ctrlKey && e.shiftKey && (e.key === 'Escape' || e.code === 'Escape')) {
                        e.preventDefault();
                        this.openTaskMgr();
                        this.showToast('任务管理器', 'list');
                        return;
                    }

                    if (e.key === 'F11') {
                        e.preventDefault();
                        this.toggleFullscreen();
                        this.showToast('切换全屏', 'fullscreen');
                        return;
                    }

                    if (e.ctrlKey && !e.altKey && !e.shiftKey) {
                        const prevented = ['w', 't', 'n', 'tab'];
                        if (prevented.includes(e.key.toLowerCase())) {
                            e.preventDefault();
                            return;
                        }
                    }

                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        if (isInput) return;
                        if (this.selectedIcons.length > 0) {
                            const names = this.selectedIcons.map(a => {
                                const icon = this.desktopIcons.find(d => d.app === a);
                                return icon ? icon.name : a;
                            }).join('、');
                            this.showSystemDialog('删除', `确定要删除 "${names}" 吗？`, () => {
                                this.selectedIcons.forEach(a => this.deleteDesktopIcon(a));
                                this.selectedIcons = [];
                            });
                        }
                        return;
                    }
                    if (e.key === 'F5') {
                        e.preventDefault();
                        this.refreshDesktop();
                        return;
                    }
                    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                        if (isInput) return;
                        if (this.desktopIcons.length === 0) return;
                        if (this.activeWindow) return;
                        e.preventDefault();
                        this.selectAdjacentIcon(e.key);
                        return;
                    }
                    if (e.key === 'Enter') {
                        if (isInput) return;
                        if (this.selectedIcons.length === 1) {
                            e.preventDefault();
                            const app = this.selectedIcons[0];
                            this.deselectAllIcons();
                            this.openApp(app);
                        }
                        return;
                    }
                    if (e.key === 'Escape') {
                        if (isInput) return;
                        if (this.selectedIcons.length > 0) {
                            this.deselectAllIcons();
                            return;
                        }
                        return;
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                        if (isInput) return;
                        e.preventDefault();
                        document.querySelectorAll('.desktop-icon').forEach(i => i.classList.add('active'));
                        this.selectedIcons = this.desktopIcons.map(d => d.app);
                        this.showToast(`已选择 ${this.desktopIcons.length} 个图标`, 'select_all');
                        return;
                    }
                });

                document.addEventListener('keyup', (e) => {
                    if (e.key === 'Meta') {
                        this.metaHeld = false;
                        if (!this.metaUsed) {
                            this.toggleStartMenu();
                        }
                    }
                });
            }

            showDesktopIconContextMenu(e, iconEl) {
                e.preventDefault();
                e.stopPropagation();
                const app = iconEl.getAttribute('data-app');
                const iconData = this.desktopIcons.find(d => d.app === app);
                this.removeAllContextMenus();
                const menu = document.createElement('div');
                menu.className = 'context-menu';
                let top = e.clientY;
                const menuHeight = 120;
                if (top + menuHeight > window.innerHeight) top = e.clientY - menuHeight;
                menu.style.left = e.clientX + 'px';
                menu.style.top = top + 'px';
                menu.innerHTML = `
                    <div class="context-menu-item" data-action="open">打开</div>
                    <div class="context-menu-item" data-action="rename">重命名</div>
                    <div class="context-menu-divider"></div>
                    <div class="context-menu-item" data-action="delete">删除</div>
                `;
                menu.querySelector('[data-action="open"]').addEventListener('click', () => {
                    if (app) this.openApp(app);
                    menu.remove();
                });
                menu.querySelector('[data-action="rename"]').addEventListener('click', () => {
                    this.showSystemDialog('重命名', '输入新名称:', (newName) => {
                        if (newName && iconData) {
                            iconData.name = newName;
                            this.renderDesktop();
                        }
                    }, true);
                    if (iconData) {
                        setTimeout(() => {
                            const input = document.querySelector('#dialog-input');
                            if (input) input.value = iconData.name;
                        }, 50);
                    }
                    menu.remove();
                });
                menu.querySelector('[data-action="delete"]').addEventListener('click', () => {
                    if (app) {
                        this.showSystemDialog('删除', `确定要删除 "${iconData ? iconData.name : ''}" 吗？`, () => {
                            this.deleteDesktopIcon(app);
                        });
                    }
                    menu.remove();
                });
                document.body.appendChild(menu);
                const close = (e) => { if (!menu.contains(e.target)) menu.remove();
                    document.removeEventListener('click', close); };
                setTimeout(() => document.addEventListener('click', close), 0);
            }

            populateStartMenu() {
                const container = document.getElementById('start-apps-list');
                const apps = [
                    { name: '文件管理器', icon: 'folder', app: 'filemanager' },
                    { name: '浏览器', icon: 'public', app: 'browser' },
                    { name: '图片查看器', icon: 'image', app: 'imagerviewer' },
                    { name: '视频查看器', icon: 'movie', app: 'videoviewer' },
                    { name: '音乐播放器', icon: 'music_note', app: 'musicplayer' },
                    { name: '计算器', icon: 'calculate', app: 'calculator' },
                    { name: '截图工具', icon: 'screenshot', app: 'snippingtool' },
                    { name: '记事本', icon: 'edit_note', app: 'notepad' },
                    { name: '终端', icon: 'terminal', app: 'terminal' },
                    { name: '设置', icon: 'settings', app: 'settings' }
                ];
                container.innerHTML = '';
                apps.forEach(a => {
                    const div = document.createElement('div');
                    div.className = 'start-menu-app';
                    div.innerHTML = `<span class="material-symbols-outlined">${a.icon}</span><span>${a.name}</span>`;
                    div.addEventListener('click', () => {
                        this.openApp(a.app);
                        document.getElementById('start-menu').style.display = 'none';
                    });
                    container.appendChild(div);
                });
                const searchInput = document.getElementById('start-search');
                searchInput.oninput = (e) => {
                    const val = e.target.value.toLowerCase();
                    Array.from(container.children).forEach(child => {
                        const text = child.innerText.toLowerCase();
                        child.style.display = text.includes(val) ? 'flex' : 'none';
                    });
                };
            }

            refreshDesktop() {
                const icons = document.querySelectorAll('.desktop-icon');
                icons.forEach(ic => { ic.style.opacity = '0';
                    setTimeout(() => ic.style.opacity = '1', 150); });
            }

            toggleStartMenu() {
                const startMenu = document.getElementById('start-menu');
                const isVisible = startMenu.style.display === 'block';
                startMenu.style.display = isVisible ? 'none' : 'block';
                if (!isVisible) {
                    this.populateStartMenu();
                    startMenu.classList.add('start-menu-open');
                    setTimeout(() => startMenu.classList.remove('start-menu-open'), 250);
                }
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen({ keyboardLock: 'browser' }).catch(() => {});
                        setTimeout(() => this.showFullscreenHint(), 500);
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen().catch(() => {});
                    }
                }
            }

            showFullscreenHint() {
                if (!document.fullscreenElement) return;
                const el = document.getElementById('fullscreen-hint');
                if (el) return;
                const hint = document.createElement('div');
                hint.id = 'fullscreen-hint';
                hint.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:99999;background:rgba(0,0,0,0.7);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;text-align:center;pointer-events:none;animation:fsFadeIn 0.3s ease;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);';
                hint.innerHTML = '按 <span style="display:inline-block;background:rgba(255,255,255,0.15);padding:1px 8px;border-radius:4px;font-size:12px;margin:0 2px;">ESC</span> 退出全屏';
                document.body.appendChild(hint);
                setTimeout(() => {
                    hint.style.transition = 'opacity 0.5s';
                    hint.style.opacity = '0';
                    setTimeout(() => hint.remove(), 500);
                }, 4000);
            }

            minimizeAllWindows() {
                this.windows.forEach(win => {
                    if (!win.minimized) {
                        win.element.style.display = 'none';
                        win.minimized = true;
                    }
                });
                this.updateTaskbarActive();
            }

            closeActiveWindow() {
                if (this.activeWindow) {
                    this.closeWindow(this.activeWindow);
                }
            }

            cycleWindow() {
                const visible = this.windows.filter(w => !w.minimized);
                if (visible.length === 0) return;
                const idx = this.activeWindow ? visible.indexOf(this.activeWindow) : -1;
                const next = visible[(idx + 1) % visible.length];
                this.activateWindow(next);
            }

            showToast(message, icon = 'info') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<span class="material-symbols-outlined text-sm">${icon}</span><span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 2800);
                if (this.settings && this.settings.systemNotifications) {
                    this.showNativeNotification('RaccoonOS', message);
                }
                this.notifications.push({ message, icon, time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) });
                this.notifBadge++;
                this.updateNotifBadge();
                if (document.getElementById('notif-center')) this.updateNotifList();
            }

            updateNotifBadge() {
                const btn = document.getElementById('notif-btn');
                const panel = document.getElementById('notif-center');
                if (!btn) return;
                const isOpen = panel ? panel.classList.contains('open') : false;
                let badge = btn.querySelector('.notif-badge');
                if (this.notifBadge > 0 && !isOpen) {
                    if (!badge) { badge = document.createElement('span'); badge.className = 'notif-badge'; btn.appendChild(badge); }
                    badge.textContent = this.notifBadge;
                } else {
                    if (badge) badge.remove();
                }
            }

            updateNotifList() {
                const list = document.getElementById('notif-list');
                if (!list) return;
                if (this.notifications.length === 0) {
                    list.innerHTML = '<div style="text-align:center;color:#888;padding:24px;font-size:13px;">暂无通知</div>';
                    return;
                }
                const items = this.notifications.slice(-30).reverse().map(n =>
                    `<div class="notif-item"><span class="material-symbols-outlined">${n.icon || 'info'}</span><div class="notif-text">${n.message}</div><span class="notif-time">${n.time}</span></div>`
                ).join('');
                list.innerHTML = items;
            }

            toggleNotifCenter() {
                const panel = document.getElementById('notif-center');
                if (!panel) return;
                const isOpen = panel.classList.contains('open');
                if (isOpen) {
                    panel.classList.remove('open');
                } else {
                    panel.classList.add('open');
                    this.updateNotifList();
                    this.notifBadge = 0;
                    this.updateNotifBadge();
                }
            }

            showHelp() {
                if (document.getElementById('help-overlay')) return;
                const overlay = document.createElement('div');
                overlay.id = 'help-overlay';
                overlay.className = 'help-overlay';
                overlay.innerHTML = `
                    <div class="help-panel">
                        <h2><span class="material-symbols-outlined">keyboard</span> 键盘快捷键</h2>
                        <div class="help-row"><span>打开开始菜单</span><div class="help-keys"><span class="help-key">Win</span></div></div>
                        <div class="help-row"><span>锁定屏幕</span><div class="help-keys"><span class="help-key">Win</span><span class="help-key">L</span></div></div>
                        <div class="help-row"><span>打开文件管理器</span><div class="help-keys"><span class="help-key">Win</span><span class="help-key">E</span></div></div>
                        <div class="help-row"><span>运行对话框</span><div class="help-keys"><span class="help-key">Win</span><span class="help-key">R</span></div></div>
                        <div class="help-row"><span>显示桌面</span><div class="help-keys"><span class="help-key">Win</span><span class="help-key">D</span></div></div>
                        <div class="help-row"><span>关闭当前窗口</span><div class="help-keys"><span class="help-key">Alt</span><span class="help-key">F4</span></div></div>
                        <div class="help-row"><span>切换窗口</span><div class="help-keys"><span class="help-key">Alt</span><span class="help-key">Tab</span></div></div>
                        <div class="help-row"><span>任务管理器</span><div class="help-keys"><span class="help-key">Ctrl</span><span class="help-key">Shift</span><span class="help-key">Esc</span></div></div>
                        <div class="help-row"><span>全屏切换</span><div class="help-keys"><span class="help-key">F11</span></div></div>
                        <div class="help-row"><span>刷新桌面</span><div class="help-keys"><span class="help-key">F5</span></div></div>
                        <div class="help-row"><span>全选桌面图标</span><div class="help-keys"><span class="help-key">Ctrl</span><span class="help-key">A</span></div></div>
                        <div class="help-row"><span>删除选中图标</span><div class="help-keys"><span class="help-key">Del</span></div></div>
                        <div class="help-row"><span>桌面图标导航（无活动窗口时）</span><div class="help-keys"><span class="help-key">←</span><span class="help-key">→</span><span class="help-key">↑</span><span class="help-key">↓</span></div></div>
                        <div class="help-row"><span>打开选中图标</span><div class="help-keys"><span class="help-key">Enter</span></div></div>
                        <div class="help-row"><span>取消选中</span><div class="help-keys"><span class="help-key">Esc</span></div></div>
                        <div class="help-row"><span>显示此帮助</span><div class="help-keys"><span class="help-key">F1</span></div></div>
                        <div style="margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.1); font-size:11px; color:#888; line-height:1.6;">
                            提示: 部分系统级快捷键 (Win/Alt+Tab) 可能仍会被操作系统优先拦截。如无效，请在桌面区域点击使其获得焦点。
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                const close = () => overlay.remove();
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) close();
                });
                document.addEventListener('keydown', function escHandler(e) {
                    if (e.key === 'Escape') {
                        close();
                        document.removeEventListener('keydown', escHandler);
                    }
                });
            }

            removeGlobalLinkOverlays() {
                try {
                    const vw = window.innerWidth, vh = window.innerHeight;
                    document.querySelectorAll('a').forEach(a => {
                        const r = a.getBoundingClientRect();
                        if (r.width >= vw * 0.85 && r.height >= vh * 0.85) {
                            const style = getComputedStyle(a);
                            const bgAlpha = style.backgroundColor === 'transparent' || style.opacity === '0';
                            const empty = !a.textContent.trim() && a.querySelectorAll('img,svg,canvas,video').length === 0;
                            if (bgAlpha && empty) {
                                a.remove();
                            }
                        }
                    });
                } catch (e) {}
            }

            showEntryConfirm() {
                if (this.lockScreenEl || this.entryConfirmEl) return;
                this.removeGlobalLinkOverlays();
                const overlay = document.createElement('div');
                overlay.className = 'entry-overlay';
                overlay.style.background =
                    `radial-gradient(900px 540px at 50% 6%, rgba(91,157,255,0.24), transparent 62%), radial-gradient(700px 460px at 84% 94%, rgba(139,108,245,0.18), transparent 60%), linear-gradient(180deg, rgba(0,0,0,0.34) 0%, rgba(0,0,0,0.12) 48%, rgba(0,0,0,0.55) 100%), linear-gradient(140deg, ${this.settings.theme} 0%, #05070c 175%)`;
                overlay.innerHTML = `
                    <div class="entry-card">
                        <div class="entry-logo">🦝</div>
                        <h1 class="entry-title">Raccoon OS</h1>
                        <p class="entry-text">是否进入【Raccoon OS】系统？</p>
                        <div class="entry-buttons">
                            <button class="entry-btn" id="entry-cancel">取消</button>
                            <button class="entry-btn primary" id="entry-ok">进入系统</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                this.entryConfirmEl = overlay;

                const enter = () => {
                    overlay.remove();
                    this.entryConfirmEl = null;
                    let fsOk = false;
                    try {
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen({ keyboardLock: 'browser' }).catch(() => {});
                            fsOk = true;
                        }
                    } catch (err) {
                        fsOk = false;
                    }
                    setTimeout(() => {
                        if (fsOk) { try { this.showFullscreenHint(); } catch (e2) {} }
                    }, 500);
                    try {
                        this.showLoginScreen(false);
                    } catch (e3) {
                        this.entryConfirmEl = null;
                        this.showLoginScreen(false);
                    }
                };
                overlay.querySelector('#entry-ok').addEventListener('click', enter);
                overlay.querySelector('#entry-cancel').addEventListener('click', () => {
                    overlay.innerHTML = `
                        <div class="entry-card">
                            <div class="entry-logo">🦝</div>
                            <h1 class="entry-title">Raccoon OS</h1>
                            <button class="entry-btn primary" id="entry-enter-again" style="margin-top:4px;">进入系统</button>
                        </div>
                    `;
                    overlay.querySelector('#entry-enter-again').addEventListener('click', enter);
                });
                overlay.querySelector('#entry-cancel').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') e.target.click();
                });
            }

            showLoginScreen(locked = false) {
                if (this.lockScreenEl) return;
                const bg = this.settings.theme;
                const screen = document.createElement('div');
                screen.className = 'login-screen';
                screen.style.background =
                    `radial-gradient(900px 540px at 50% 6%, rgba(91,157,255,0.22), transparent 62%), radial-gradient(700px 460px at 84% 94%, rgba(139,108,245,0.16), transparent 60%), linear-gradient(180deg, rgba(0,0,0,0.34) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.55) 100%), linear-gradient(140deg, ${bg} 0%, #05070c 175%)`;
                screen.innerHTML = `
                    <div class="login-clock">
                        <div class="login-time" id="login-time"></div>
                        <div class="login-date" id="login-date"></div>
                    </div>
                    <div class="login-user-card">
                        <div class="login-avatar">🦝</div>
                        <div class="login-name">Raccoon</div>
                        <div class="login-form">
                            <input type="password" class="login-password" id="login-password" placeholder="密码（可留空）" autocomplete="off">
                            <button class="login-go" id="login-go"><span class="material-symbols-outlined" style="font-size:20px">arrow_forward</span></button>
                        </div>
                    </div>
                `;
                document.body.appendChild(screen);
                this.lockScreenEl = screen;
                this._isBoot = !locked;

                const updateClock = () => {
                    const now = new Date();
                    const t = document.getElementById('login-time');
                    const d = document.getElementById('login-date');
                    if (t) t.innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
                    if (d) d.innerText = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
                };
                updateClock();
                this._loginClockTimer = setInterval(updateClock, 1000);

                screen.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('.login-form')) {
                        e.stopPropagation();
                        return;
                    }
                    e.preventDefault();
                    if (screen.contains(document.activeElement)) document.activeElement.blur();
                });
                screen.addEventListener('keydown', (e) => {
                    if (e.target !== screen.querySelector('#login-password') && e.key === 'Enter') {
                        this.unlockLogin();
                    }
                });
                screen.querySelector('#login-go').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.unlockLogin();
                });
                screen.querySelector('#login-password').addEventListener('keydown', (e) => {
                    e.stopPropagation();
                    if (e.key === 'Enter') this.unlockLogin();
                });
                if (locked) {
                    if (this.minimizeAllWindows) this.minimizeAllWindows();
                    this.showToast('屏幕已锁定', 'lock');
                }
            }

            lockScreen() {
                this.releaseWakeLock();
                const panel = document.getElementById('notif-center');
                if (panel) panel.classList.remove('open');
                this.showLoginScreen(true);
            }

            unlockLogin() {
                const screen = this.lockScreenEl;
                if (!screen) return;
                clearInterval(this._loginClockTimer);
                this.lockScreenEl = null;
                const isBoot = this._isBoot;
                screen.remove();
                this.requestWakeLock();
                this.setupIdleLock();
                if (isBoot) {
                    const savedUrl = localStorage.getItem('raccoonos_browser_url');
                    if (savedUrl && this.settings.autoRestoreUrl) {
                        setTimeout(() => {
                            this.openApp('browser');
                            setTimeout(() => {
                                const browserWin = this.windows.find(w => w.appName === 'browser');
                                if (browserWin) {
                                    const urlInput = browserWin.element.querySelector('input[placeholder*="网址"]');
                                    if (urlInput) {
                                        urlInput.value = savedUrl;
                                        urlInput.dispatchEvent(new Event('keydown', { key: 'Enter', bubbles: true }));
                                    }
                                }
                            }, 300);
                        }, 200);
                    }
                } else {
                    this.showToast('已解锁', 'lock_open');
                }
            }

            // ---------- Edge API 接入 ----------
            async requestWakeLock() {
                if (!this.wakeLockSupported) return;
                try {
                    this.wakeLock = await navigator.wakeLock.request('screen');
                    this.wakeLock.addEventListener('release', () => { this.wakeLock = null; });
                } catch (e) {}
            }

            releaseWakeLock() {
                if (this.wakeLock && typeof this.wakeLock.release === 'function') {
                    this.wakeLock.release().catch(() => {});
                    this.wakeLock = null;
                }
            }

            initWakeLockVisibility() {
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible' && this.lockScreenEl === null) {
                        this.requestWakeLock();
                    }
                });
                const mediaPlay = () => {
                    const playing = [...document.querySelectorAll('audio, video')].some(m => !m.paused && !m.ended);
                    if (playing) {
                        this.requestWakeLock();
                    } else if (!this.lockScreenEl) {
                        this.requestWakeLock();
                    }
                };
                document.addEventListener('play', mediaPlay, true);
                document.addEventListener('pause', mediaPlay, true);
            }

            async setupIdleLock() {
                if (!('IdleDetector' in window)) return;
                try {
                    if (await IdleDetector.requestPermission() !== 'granted') return;
                    if (this._idleController) this._idleController.abort();
                    this._idleController = new AbortController();
                    const detector = new IdleDetector();
                    await detector.start({ threshold: 120000, signal: this._idleController.signal });
                    detector.addEventListener('change', () => {
                        if (detector.userState === 'idle' && !this.lockScreenEl) {
                            const hasMedia = [...document.querySelectorAll('audio, video')].some(m => !m.paused && !m.ended);
                            if (!hasMedia && !document.hidden) this.lockScreen();
                        }
                    });
                } catch (e) {}
            }

            initSystemNotifications() {
                if (!this.settings.systemNotifications) return;
                if (!('Notification' in window)) return;
                if (Notification.permission !== 'default') return;
                try {
                    Notification.requestPermission().catch(() => {});
                } catch (e) {}
            }
            showNativeNotification(title, body, icon) {
                if (!this.settings.systemNotifications || !('Notification' in window)) return;
                if (Notification.permission !== 'granted') return;
                try {
                    new Notification(title, { body, icon: icon || undefined, tag: 'raccoonos' });
                } catch (e) {}
            }

            updateMediaSession(title, artist) {
                if (!('mediaSession' in navigator)) return;
                try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: title || 'RaccoonOS 浏览器',
                        artist: artist || 'RaccoonOS',
                        album: '网页媒体'
                    });
                } catch (e) {}
            }

            async openLocalFolder(onReady) {
                if (!this.fileSystemAccessSupported) {
                    this.showSystemDialog('提示', '当前浏览器不支持 File System Access API，请在 Edge/Chrome 中使用。');
                    return;
                }
                try {
                    const dirHandle = await window.showDirectoryPicker();
                    let entries = [];
                    for await (const [name, handle] of dirHandle.entries()) {
                        entries.push({ name, type: handle.kind === 'directory' ? 'dir' : 'file' });
                    }
                    if (onReady) onReady(entries);
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                    this.showSystemDialog('提示', '无法读取本地文件夹：' + (e && e.message ? e.message : '未知错误'));
                }
            }

            async openRealFolder(onReady) {
                if (!this.fileSystemAccessSupported) {
                    this.showSystemDialog('提示', '当前浏览器不支持 File System Access API，请在 Edge/Chrome 中使用。');
                    return;
                }
                try {
                    const dirHandle = await window.showDirectoryPicker();
                    if (onReady) onReady(dirHandle);
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                    this.showSystemDialog('提示', '无法读取本地文件夹：' + (e && e.message ? e.message : '未知错误'));
                }
            }

            async shareFile(file) {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: file.name,
                            text: `RaccoonOS 文件: ${file.name}` + (file.content ? `\n${file.content}` : '')
                        });
                        return true;
                    } catch (e) {
                        if (e && e.name === 'AbortError') return false;
                    }
                }
                this.showSystemDialog('分享', `分享文件 "${file.name}"${file.content ? '，内容：' + file.content : ''}。`);
                return false;
            }

            refreshBatteryInfo(el) {
                if (!('getBattery' in navigator)) {
                    el.textContent = 'API 不可用';
                    return;
                }
                navigator.getBattery().then(battery => {
                    const update = () => {
                        const pct = Math.round(battery.level * 100);
                        const charging = battery.charging ? '充电中' : '使用电池';
                        const hours = battery.dischargingTime === Infinity ? '未知' :
                            Math.floor(battery.dischargingTime / 3600) + ' 小时 ' + Math.floor((battery.dischargingTime % 3600) / 60) + ' 分';
                        el.textContent = `${pct}%（${charging}，剩余 ${hours}）`;
                    };
                    update();
                    battery.addEventListener('levelchange', update);
                    battery.addEventListener('chargingchange', update);
                    battery.addEventListener('chargingtimechange', update);
                    battery.addEventListener('dischargingtimechange', update);
                }).catch(() => { el.textContent = '读取失败'; });
            }

            startClock() {
                const update = () => {
                    const now = new Date();
                    const timeEl = document.getElementById('clock-time');
                    const dateEl = document.getElementById('clock-date');
                    if (!timeEl || !dateEl) return;
                    if (this.settings.showSeconds) {
                        timeEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    } else {
                        timeEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
                    }
                    dateEl.textContent = now.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
                };
                update();
                setInterval(update, 1000);
            }

            runProgram() {
                try {
                    const link = document.createElement('a');
                    link.href = 'raccoonos://run';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (e) {
                    this.showSystemDialog('提示', '协议未注册。请双击运行 run-protocol.reg 后再试。');
                }
            }

            getAppLabel(appName) {
                const map = { filemanager: '文件管理器', browser: '浏览器', terminal: '终端', settings: '设置', run: '运行', taskmgr: '任务管理器', imagerviewer: '图片查看器', videoviewer: '视频查看器', musicplayer: '音乐播放器', textviewer: '文本查看器', calculator: '计算器', snippingtool: '截图工具', notepad: '记事本' };
                return map[appName] || appName;
            }

            createTaskManagerWindow(id) {
                const win = this.createBaseWindow(id, 'list', '任务管理器');
                const content = win.querySelector('.window-content');
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.innerHTML = `
                    <div style="display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.1);align-items:center;flex-wrap:wrap;">
                        <button class="tm-btn" data-action="refresh"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">refresh</span> 刷新列表</button>
                        <button class="tm-btn" data-action="topmost"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">vertical_align_top</span> 窗口置顶</button>
                        <button class="tm-btn danger" data-action="kill"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">close</span> 结束进程</button>
                        <span style="margin-left:auto;font-size:11px;color:#888;" id="tm-stats"></span>
                    </div>
                    <div style="flex:1;overflow:auto;">
                        <table style="width:100%;border-collapse:collapse;font-size:13px;">
                            <thead>
                                <tr style="color:#aaa;text-align:left;">
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">进程名</th>
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">PID</th>
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">状态</th>
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">内存</th>
                                    <th style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);">置顶</th>
                                </tr>
                            </thead>
                            <tbody id="tm-body"></tbody>
                        </table>
                    </div>
                `;
                this._procMem = this._procMem || {};
                let selected = null;

                const render = () => {
                    const body = content.querySelector('#tm-body');
                    const rows = [];
                    rows.push({ name: '系统', pid: 'System', status: '运行中', mem: '—', win: null, system: true });
                    rows.push({ name: '桌面外壳 (explorer)', pid: 1, status: '运行中', mem: '45 MB', win: null, system: true });
                    this.windows.forEach(w => {
                        if (!this._procMem[w.id]) {
                            this._procMem[w.id] = (Math.abs((w.id * 2654435761) % 90) + 20) + ' MB';
                        }
                        rows.push({
                            name: this.getAppLabel(w.appName),
                            pid: 1000 + w.id,
                            status: w.minimized ? '最小化' : '运行中',
                            mem: this._procMem[w.id],
                            win: w,
                            system: false
                        });
                    });
                    body.innerHTML = rows.map((r, i) => `
                        <tr data-idx="${i}" style="cursor:pointer;${selected && selected.pid === r.pid ? 'background:rgba(0,120,212,0.25);' : ''}">
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.name}${r.system ? ' <span style="color:#888;font-size:11px;">(系统)</span>' : ''}</td>
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.pid}</td>
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.status}</td>
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.mem}</td>
                            <td style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);">${r.win && r.win.topmost ? '<span style="color:#3fb950;">置顶</span>' : ''}</td>
                        </tr>
                    `).join('');
                    body.querySelectorAll('tr').forEach(tr => {
                        tr.addEventListener('click', () => {
                            const r = rows[parseInt(tr.dataset.idx)];
                            selected = r;
                            render();
                        });
                    });
                    content.querySelector('#tm-stats').textContent =
                        `进程数: ${rows.length - 1} | 窗口: ${this.windows.length}`;
                };

                content.querySelector('[data-action="refresh"]').addEventListener('click', render);
                content.querySelector('[data-action="topmost"]').addEventListener('click', () => {
                    if (!selected || selected.system || !selected.win) {
                        this.showToast('请先选择一个应用进程', 'info');
                        return;
                    }
                    this.toggleTopmost(selected.win);
                    this.activateWindow(selected.win);
                    this.showToast(`${selected.win.topmost ? '已置顶' : '取消置顶'}: ${selected.name}`, 'vertical_align_top');
                    render();
                });
                content.querySelector('[data-action="kill"]').addEventListener('click', () => {
                    if (!selected || selected.system || !selected.win) {
                        this.showToast('系统进程不可结束，请选择一个应用进程', 'lock');
                        return;
                    }
                    const target = selected.win;
                    this.closeWindow(target);
                    this.showToast(`已结束进程: ${selected.name} (PID ${selected.pid})`, 'close');
                    selected = null;
                    setTimeout(render, 200);
                });
                render();
                return win;
            }

            openTaskMgr() {
                const existing = this.windows.find(w => w.appName === 'taskmgr' && !w.minimized);
                if (existing) {
                    this.activateWindow(existing);
                    return;
                }
                const id = this.nextWindowId++;
                const winElement = this.createTaskManagerWindow(id);
                document.getElementById('desktop-area').appendChild(winElement);
                const winObj = { id, element: winElement, appName: 'taskmgr', minimized: false, taskbarButton: null,
                    savedPosition: { left: 150, top: 90, width: 640, height: 420 } };
                this.windows.push(winObj);
                this.addToTaskbar(winObj);
                this.activateWindow(winObj);
                this.placeWindow(winElement, winObj, 640, 420);
            }

            shutdown() {
                const shutdownTime = 3000;
                const shutdownScreen = document.createElement('div');
                shutdownScreen.className = 'fixed inset-0 bg-black z-[100000] flex flex-col items-center justify-center';
                shutdownScreen.innerHTML =
                    `<div class="text-2xl mb-6 text-white">正在关闭 RaccoonOS...</div><div class="w-64 h-1 bg-gray-700 rounded overflow-hidden"><div class="h-full bg-white w-0 transition-all" id="shutdown-bar" style="transition-duration: ${shutdownTime}ms"></div></div>`;
                document.body.appendChild(shutdownScreen);
                const bar = shutdownScreen.querySelector('#shutdown-bar');
                setTimeout(() => bar.style.width = '100%', 50);
                setTimeout(() => { window.close();
                    location.href = 'about:blank'; }, shutdownTime + 100);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.raccoon = new RaccoonOS();
        });
        window.addEventListener('beforeunload', () => {
            const browserWin = window.raccoon && window.raccoon.windows ? window.raccoon.windows.find(w => w.appName === 'browser' && !w.minimized) : null;
            if (browserWin) {
                const input = browserWin.element.querySelector('input[placeholder*="网址"]');
                if (input && input.value) {
                    localStorage.setItem('raccoonos_browser_url', input.value);
                }
            }
        });
    </script>
</body>
</html>
