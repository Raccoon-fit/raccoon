            cascadeWindows() {
                const visible = this.windows.filter(w => !w.minimized);
                if (visible.length === 0) return;
                const startX = 50;
                const startY = 50;
                const offset = 24;
                visible.forEach((win, idx) => {
                    const el = win.element;
                    if (win.maximized || el.classList.contains('window-maximized')) return;
                    el.style.left = (startX + idx * offset) + 'px';
                    el.style.top = (startY + idx * offset) + 'px';
                    win.savedPosition.left = startX + idx * offset;
                    win.savedPosition.top = startY + idx * offset;
                });
                if (visible.length > 0) this.activateWindow(visible[0]);
            }

            createBaseWindow(id, icon, title) {
                const win = document.createElement('div');
                win.className = 'window';
                const baseRect = this.fitWindowRect(800, 550);
                win.style.width = baseRect.width + 'px';
                win.style.height = baseRect.height + 'px';
                win.innerHTML = `
                    <div class="window-header">
                        <div class="window-title"><span class="material-symbols-outlined text-sm">${icon}</span> ${title}</div>
                        <div class="window-controls">
                            <div class="win-btn" data-action="minimize"><span class="material-symbols-outlined text-sm">remove</span></div>
                            <div class="win-btn" data-action="maximize"><span class="material-symbols-outlined text-sm">crop_square</span></div>
                            <div class="win-btn win-close" data-action="close"><span class="material-symbols-outlined text-sm">close</span></div>
                        </div>
                    </div>
                    <div class="window-content"></div>
                `;
                const header = win.querySelector('.window-header');
                if (this.useNativeWindowDrag && this.isStandalonePwa) {
                    header.classList.add('native-drag');
                }
                let offsetX, offsetY, isDragging = false;
                const constrain = (left, top) => {
                    const maxX = window.innerWidth - win.offsetWidth;
                    const maxY = window.innerHeight - this.taskbarHeight() - win.offsetHeight;
                    return { left: Math.max(0, Math.min(left, maxX)), top: Math.max(0, Math.min(top, maxY)) };
                };
                header.addEventListener('mousedown', (e) => {
                    if (this.useNativeWindowDrag && this.isStandalonePwa) return;
                    if (e.target.closest('.win-btn')) return;
                    const draggingWin = this.windows.find(w => w.id === id);
                    if (draggingWin && draggingWin.maximized) return;
                    isDragging = true;
                    offsetX = e.clientX - win.offsetLeft;
                    offsetY = e.clientY - win.offsetTop;
                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) this.activateWindow(winObj);
                });
                const onMouseMove = (e) => {
                    if (!isDragging) return;
                    let newLeft = e.clientX - offsetX;
                    let newTop = e.clientY - offsetY;
                    const constrained = constrain(newLeft, newTop);
                    win.style.left = constrained.left + 'px';
                    win.style.top = constrained.top + 'px';
                    win.style.transform = 'none';
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) {
                        winObj.savedPosition.left = constrained.left;
                        winObj.savedPosition.top = constrained.top;
                    }
                };
                const onMouseUp = () => {
                    isDragging = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                win.querySelector('[data-action="minimize"]').addEventListener('click', () => {
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) this.toggleMinimizeWindow(winObj);
                });
                win.querySelector('[data-action="close"]').addEventListener('click', () => {
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) this.closeWindow(winObj);
                });
                const maximizeBtn = win.querySelector('[data-action="maximize"]');
                maximizeBtn.title = '最大化';
                const applyMaximize = (maximize) => {
                    const winObj = this.windows.find(w => w.id === id);
                    if (!winObj) return;
                    const winContent = win.querySelector('.window-content');
                    if (maximize) {
                        const r = win.getBoundingClientRect();
                        winObj.restoreRect = {
                            left: Math.round(r.left),
                            top: Math.round(r.top),
                            width: Math.round(r.width),
                            height: Math.round(r.height)
                        };
                        winObj.maximized = true;
                        win.classList.add('window-maximized');
                        win.style.width = window.innerWidth + 'px';
                        win.style.height = Math.max(200, window.innerHeight - this.taskbarHeight()) + 'px';
                        win.style.left = '0px';
                        win.style.top = '0px';
                        win.style.borderRadius = '0';
                        win.style.boxSizing = 'border-box';
                        if (winContent) winContent.style.borderRadius = '0';
                        maximizeBtn.innerHTML = '<span class="material-symbols-outlined text-sm">fullscreen_exit</span>';
                        maximizeBtn.title = '还原';
                    } else {
                        const r = winObj.restoreRect || { left: 80, top: 60, width: 800, height: 550 };
                        winObj.maximized = false;
                        win.classList.remove('window-maximized');
                        win.style.width = Math.max(280, r.width) + 'px';
                        win.style.height = Math.max(220, r.height) + 'px';
                        win.style.left = r.left + 'px';
                        win.style.top = r.top + 'px';
                        win.style.borderRadius = '';
                        win.style.boxSizing = '';
                        if (winContent) winContent.style.borderRadius = '';
                        maximizeBtn.innerHTML = '<span class="material-symbols-outlined text-sm">crop_square</span>';
                        maximizeBtn.title = '最大化';
                        this.clampWindowToViewport(win);
                    }
                    winObj.savedPosition.left = parseInt(win.style.left) || 0;
                    winObj.savedPosition.top = parseInt(win.style.top) || 0;
                    winObj.savedPosition.width = win.style.width;
                    winObj.savedPosition.height = win.style.height;
                };
                maximizeBtn.addEventListener('click', () => {
                    const winObj = this.windows.find(w => w.id === id);
                    if (!winObj) return;
                    applyMaximize(!winObj.maximized);
                });
                win._setMaximized = applyMaximize;
                win.addEventListener('mousedown', () => {
                    const winObj = this.windows.find(w => w.id === id);
                    if (winObj) this.activateWindow(winObj);
                });
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        win.classList.add('window-open');
                        this.clampWindowToViewport(win);
                    });
                });
                return win;
            }

            taskbarHeight() {
                const tb = document.getElementById('taskbar');
                return (tb && tb.offsetHeight) ? tb.offsetHeight : 44;
            }

            isNarrow() {
                return window.innerWidth <= 900;
            }

            fitWindowRect(prefW, prefH) {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const tb = this.taskbarHeight();
                const maxW = Math.max(280, vw - 8);
                const maxH = Math.max(220, vh - tb - 10);
                if (this.isNarrow()) {
                    return {
                        width: Math.min(Math.round(vw * 0.94), maxW),
                        height: Math.min(vh - tb - 14, maxH),
                        narrow: true
                    };
                }
                return {
                    width: Math.min(Math.max(320, prefW || 800), Math.min(maxW, vw - 40)),
                    height: Math.min(Math.max(240, prefH || 550), Math.min(maxH, vh - tb - 32)),
                    narrow: false
                };
            }

            placeWindow(winElement, winObj, prefW, prefH) {
                const rect = this.fitWindowRect(prefW, prefH);
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const tb = this.taskbarHeight();
                let left, top;
                if (rect.narrow) {
                    left = Math.round((vw - rect.width) / 2);
                    top = 6;
                } else {
                    const cascade = Math.min(this.windows.length, 6) * 18;
                    left = 80 + cascade;
                    top = 56 + Math.round(cascade * 0.7);
                    if (left + rect.width > vw) left = Math.max(0, vw - rect.width);
                    if (top + rect.height > vh - tb) top = Math.max(0, vh - tb - rect.height);
                }
                winElement.style.width = rect.width + 'px';
                winElement.style.height = rect.height + 'px';
                winElement.style.left = left + 'px';
                winElement.style.top = top + 'px';
                if (winObj) {
                    winObj.maximized = false;
                    winObj.savedPosition = winObj.savedPosition || {};
                    winObj.savedPosition.left = left;
                    winObj.savedPosition.top = top;
                    winObj.savedPosition.width = rect.width + 'px';
                    winObj.savedPosition.height = rect.height + 'px';
                }
                return { left, top, width: rect.width, height: rect.height };
            }

            clampWindowToViewport(win) {
                try {
                    const vw = window.innerWidth;
                    const vh = window.innerHeight - this.taskbarHeight();
                    const winObj = this.windows.find(w => w.element === win);
                    if (winObj && winObj.maximized) return;
                    const rect = win.getBoundingClientRect();
                    let width = Math.min(Math.max(280, rect.width), vw);
                    let height = Math.min(Math.max(220, rect.height), vh);
                    if (width !== rect.width) win.style.width = width + 'px';
                    if (height !== rect.height) win.style.height = height + 'px';
                    const r2 = win.getBoundingClientRect();
                    let left = parseFloat(win.style.left);
                    let top = parseFloat(win.style.top);
                    if (isNaN(left)) left = win.offsetLeft || 0;
                    if (isNaN(top)) top = win.offsetTop || 0;
                    if (left + r2.width > vw) left = Math.max(0, vw - r2.width);
                    if (top + r2.height > vh) top = Math.max(0, vh - r2.height);
                    left = Math.max(0, Math.min(left, Math.max(0, vw - r2.width)));
                    top = Math.max(0, Math.min(top, Math.max(0, vh - r2.height)));
                    win.style.left = left + 'px';
                    win.style.top = top + 'px';
                    if (winObj) {
                        winObj.savedPosition.left = left;
                        winObj.savedPosition.top = top;
                        winObj.savedPosition.width = win.style.width || (r2.width + 'px');
                        winObj.savedPosition.height = win.style.height || (r2.height + 'px');
                    }
                } catch (e) {}
            }

            handleViewportResize() {
                const tb = this.taskbarHeight();
                const desktop = document.getElementById('desktop-area');
                if (desktop) desktop.style.height = Math.max(200, window.innerHeight - tb) + 'px';
                this.windows.forEach(winObj => {
                    const win = winObj.element;
                    if (!win || !win.isConnected) return;
                    if (winObj.maximized) {
                        win.style.width = window.innerWidth + 'px';
                        win.style.height = Math.max(200, window.innerHeight - tb) + 'px';
                        win.style.left = '0px';
                        win.style.top = '0px';
                        return;
                    }
                    this.clampWindowToViewport(win);
                });
            }

            initViewportHandling() {
                if (this._viewportHandlingBound) return;
                this._viewportHandlingBound = true;
                let timer = null;
                const schedule = () => {
                    clearTimeout(timer);
                    timer = setTimeout(() => {
                        try { this.handleViewportResize(); } catch (e) {}
                    }, 120);
                };
                window.addEventListener('resize', schedule);
                window.addEventListener('orientationchange', schedule);
                document.addEventListener('fullscreenchange', schedule);
                if (window.visualViewport) window.visualViewport.addEventListener('resize', schedule);
            }

            fileIconOf(name, type) {
                if (type === 'dir') return { icon: 'folder', cls: 'fm-folder-icon' };
                const ext = (name.split('.').pop() || '').toLowerCase();
                if (['txt', 'md', 'log', 'readme'].includes(ext)) return { icon: 'description', cls: 'fm-doc-icon' };
                if (['doc', 'docx'].includes(ext)) return { icon: 'article', cls: 'fm-doc-icon' };
                if (['xls', 'xlsx', 'csv'].includes(ext)) return { icon: 'table_chart', cls: 'fm-doc-icon' };
                if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg'].includes(ext)) return { icon: 'image', cls: 'fm-img-icon' };
                if (['mp3', 'wav', 'flac', 'ogg', 'm4a'].includes(ext)) return { icon: 'music_note', cls: 'fm-audio-icon' };
                if (['mp4', 'avi', 'mkv', 'mov', 'wmv', 'webm'].includes(ext)) return { icon: 'movie', cls: 'fm-video-icon' };
                if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return { icon: 'folder_zip', cls: 'fm-zip-icon' };
                if (['exe', 'msi', 'bat', 'cmd'].includes(ext)) return { icon: 'apps', cls: 'fm-exe-icon' };
                return { icon: 'insert_drive_file', cls: 'fm-other-icon' };
            }

                            <div class="fm-tree-item" data-path="documents"><span class="material-symbols-outlined">description</span>文档</div>
                            <div class="fm-tree-item" data-path="downloads"><span class="material-symbols-outlined">download</span>下载</div>
                            <div class="fm-tree-item" data-path="pictures"><span class="material-symbols-outlined">image</span>图片</div>
                            <div class="fm-tree-item" data-path="music"><span class="material-symbols-outlined">music_note</span>音乐</div>
                            <div class="fm-tree-item" data-path="videos"><span class="material-symbols-outlined">video_library</span>视频</div>
                            <div class="fm-side-group">本机</div>
                            <div class="fm-tree-item" data-path="__local__"><span class="material-symbols-outlined">hard_drive</span>本机文件</div>
                        </div>
                        <div class="fm-right">
                            <div class="fm-content" id="fm-content"></div>
                            <div class="fm-statusbar"><span id="fm-status"></span></div>
                        </div>
                    </div>
                `;

                const breadcrumb = content.querySelector('#fm-breadcrumb');
                const fmContent = content.querySelector('#fm-content');
                const statusEl = content.querySelector('#fm-status');
                const searchInput = content.querySelector('#fm-search-input');
                const toolbar = content.querySelector('.fm-toolbar');
                const btn = (name) => toolbar.querySelector(`[data-nav="${name}"]`);

                const dirMeta = {
                    desktop: { name: '桌面', icon: 'desktop_windows', cls: 'fm-folder-icon' },
                    documents: { name: '文档', icon: 'description', cls: 'fm-doc-icon' },
                    downloads: { name: '下载', icon: 'download', cls: 'fm-folder-icon' },
                    pictures: { name: '图片', icon: 'image', cls: 'fm-img-icon' },
                    music: { name: '音乐', icon: 'music_note', cls: 'fm-audio-icon' },
                    videos: { name: '视频', icon: 'video_library', cls: 'fm-video-icon' }
                };

                let currentPath = 'root';
                let currentDirHandle = null;
                let currentDirLabel = null;
                let selectedFile = null;
                let realEntries = [];
                const historyBack = [];
                const historyForward = [];

                const fsList = (path) => (this.fileSystem[path] = this.fileSystem[path] || []);
                const persist = () => { try { this.saveFileSystem(); } catch (e) {} };

                const findParentPath = (path) => {
                    for (const key of Object.keys(this.fileSystem)) {
                        const hit = (this.fileSystem[key] || []).find(f => f && f.type === 'dir' && f.path === path);
                        if (hit) return key;
                    }
                    return 'root';
                };

                const pathChain = (path) => {
                    const chain = [];
                    let cur = path;
                    let guard = 0;
                    while (cur && cur !== 'root' && guard++ < 20) {
                        chain.unshift(cur);
                        cur = findParentPath(cur);
                    }
                    return chain;
                };

                const labelOfPath = (path) => {
                    if (dirMeta[path]) return dirMeta[path].name;
                    for (const key of Object.keys(this.fileSystem)) {
                        const hit = (this.fileSystem[key] || []).find(f => f && f.type === 'dir' && f.path === path);
                        if (hit) return hit.name;
                    }
                    return path;
                };

                const renderBreadcrumb = () => {
                    let html = `<span class="fm-crumb" data-path="root">此电脑</span>`;
                    if (currentDirHandle) {
                        html += `<span class="fm-crumb-sep">›</span><span class="fm-crumb" style="cursor:default;color:#fff;">${currentDirLabel || '本机文件夹'}</span>`;
                    } else if (currentPath !== 'root') {
                        pathChain(currentPath).forEach((p) => {
                            html += `<span class="fm-crumb-sep">›</span><span class="fm-crumb" data-path="${p}">${labelOfPath(p)}</span>`;
                        });
                    }
                    breadcrumb.innerHTML = html;
                    breadcrumb.querySelectorAll('.fm-crumb[data-path]').forEach(el => {
                        el.addEventListener('click', () => navigateTo(el.dataset.path));
                    });
                };

                const renderHome = () => {
                    const localSupported = this.fileSystemAccessSupported || ('FileReader' in window);
                    fmContent.innerHTML = `
                        <div class="fm-section-title">设备名称：RACCOON-OS</div>
                        <div class="fm-section-title">设备和驱动器</div>
                        <div class="fm-home-grid">
                            <div class="fm-card" data-path="__local__">
                                <span class="material-symbols-outlined fm-icon fm-drive-icon">hard_drive</span>
                                <div class="fm-card-info"><div class="fm-card-name">本机文件</div><div class="fm-card-sub">${this.fileSystemAccessSupported ? '选择本机目录实时浏览' : '选择本机文件导入浏览'}</div></div>
                            </div>
                        </div>
                        <div class="fm-section-title">文件夹</div>
                        <div class="fm-home-grid">
                            ${Object.entries(dirMeta).map(([path, m]) => `
                                <div class="fm-card" data-path="${path}">
                                    <span class="material-symbols-outlined fm-icon ${m.cls}">${m.icon}</span>
                                    <div class="fm-card-info"><div class="fm-card-name">${m.name}</div><div class="fm-card-sub">${fsList(path).length} 个项目</div></div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    fmContent.querySelectorAll('.fm-card').forEach(card => {
                        const open = () => {
                            const p = card.dataset.path;
                            if (p === '__local__') this.openLocalFolderFromDesktop((handle, label) => {
                                if (handle) navigateToReal(handle, label);
                                else render();
                            });
                            else navigateTo(p);
                        };
                        card.addEventListener('click', () => {
                            fmContent.querySelectorAll('.fm-card').forEach(c => c.classList.remove('selected'));
                            card.classList.add('selected');
                            selectedFile = null;
                            renderStatus();
                            clearTimeout(card._tapTimer);
                            card._tapTimer = setTimeout(() => { if (card.classList.contains('selected')) open(); }, 320);
                        });
                        card.addEventListener('dblclick', open);
                    });
                };

                const bindItemEvents = (itemEl, file, onOpen) => {
                    let pressTimer = null;
                    let longPressed = false;
                    let startX = 0, startY = 0;

                    itemEl.addEventListener('pointerdown', (e) => {
                        if (e.pointerType === 'mouse' && e.button !== 0) return;
                        longPressed = false;
                        startX = e.clientX; startY = e.clientY;
                        clearTimeout(pressTimer);
                        pressTimer = setTimeout(() => {
                            longPressed = true;
                            selectItem(file);
                            openContextMenu(e.clientX, e.clientY, file);
                        }, 550);
                    });
                    itemEl.addEventListener('pointermove', (e) => {
                        if (!pressTimer) return;
                        if (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12) {
                            clearTimeout(pressTimer);
                            pressTimer = null;
                        }
                    });
                    itemEl.addEventListener('pointerup', () => { clearTimeout(pressTimer); pressTimer = null; });
                    itemEl.addEventListener('pointercancel', () => { clearTimeout(pressTimer); pressTimer = null; });

                    itemEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (longPressed) { longPressed = false; return; }
                        const now = Date.now();
                        const last = itemEl._lastTap || 0;
                        const wasSelected = itemEl.classList.contains('selected') &&
                            fmContent.querySelectorAll('.fm-item.selected').length === 1;
                        selectItem(file);
                        itemEl._lastTap = now;
                        if (wasSelected && now - last < 420) {
                            onOpen();
                        }
                    });
                    itemEl.addEventListener('dblclick', (e) => { e.stopPropagation(); onOpen(); });
                    itemEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        selectItem(file);
                        openContextMenu(e.clientX, e.clientY, file);
                    });
                };

                const selectItem = (file) => {
                    selectedFile = file;
                    fmContent.querySelectorAll('.fm-item').forEach(i => i.classList.remove('selected'));
                    const name = String(file.name || '').replace(/["\\]/g, '\\$&');
                    const el = fmContent.querySelector(`.fm-item[data-name="${name}"]`);
                    if (el) el.classList.add('selected');
                    const editable = !currentDirHandle && currentPath !== 'root';
                    btn('delete').disabled = !editable || !selectedFile;
                    btn('rename').disabled = !editable || !selectedFile;
                    renderStatus();
                };

                const openItem = (file) => {
                    if (!file) return;
                    if (file.type === 'dir') {
                        navigateTo(file.path);
                    } else if (file.handle) {
                        this.openFileWithApp(file, file.handle);
                    } else if (file.dataUrl) {
                        this.openFileWithApp(file, null);
                    } else {
                        this.openFileWithApp(file, null);
                    }
                };

                const renderInternalDir = () => {
                    const files = fsList(currentPath);
                    const query = searchInput.value.trim().toLowerCase();
                    const shown = query ? files.filter(f => f.name.toLowerCase().includes(query)) : files.slice();
                    shown.sort((a, b) => {
                        if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
                        return a.name.localeCompare(b.name, 'zh-CN');
                    });
                    if (shown.length === 0) {
                        fmContent.innerHTML = `<div class="fm-empty">此文件夹为空${query ? '，无匹配搜索结果' : ''}</div>`;
                        renderStatus();
                        return;
                    }
                    fmContent.innerHTML = `<div class="fm-grid">
                        ${shown.map((file) => {
                            const { icon, cls } = this.fileIconOf(file.name, file.type);
                            return `<div class="fm-item" data-name="${file.name}" draggable="false">
                                <span class="material-symbols-outlined fm-icon ${cls}">${icon}</span>
                                <span class="fm-name">${file.name}</span>
                            </div>`;
                        }).join('')}
                    </div>`;
                    fmContent.querySelectorAll('.fm-item').forEach((itemEl) => {
                        const file = shown.find(f => f.name === itemEl.dataset.name);
                        if (!file) return;
                        bindItemEvents(itemEl, file, () => openItem(file));
                    });
                    renderStatus();
                };

                const renderRealDir = async () => {
                    if (!currentDirHandle) return;
                    const query = searchInput.value.trim().toLowerCase();
                    realEntries = [];
                    try {
                        for await (const [name, handle] of currentDirHandle.entries()) {
                            realEntries.push({ name, type: handle.kind === 'directory' ? 'dir' : 'file', handle });
                        }
                    } catch (e) {
                        fmContent.innerHTML = `<div class="fm-empty">无法读取该目录（可能未授权）</div>`;
                        return;
                    }
                    realEntries.sort((a, b) => {
                        if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
                        return a.name.localeCompare(b.name, 'zh-CN');
                    });
                    const shown = query ? realEntries.filter(f => f.name.toLowerCase().includes(query)) : realEntries;
                    if (shown.length === 0) {
                        fmContent.innerHTML = `<div class="fm-empty">此文件夹为空${query ? '，无匹配搜索结果' : ''}</div>`;
                        renderStatus();
                        return;
                    }
                    fmContent.innerHTML = `<div class="fm-grid">
                        ${shown.map((file) => {
                            const { icon, cls } = this.fileIconOf(file.name, file.type);
                            return `<div class="fm-item" data-name="${file.name}">
                                <span class="material-symbols-outlined fm-icon ${cls}">${icon}</span>
                                <span class="fm-name">${file.name}</span>
                            </div>`;
                        }).join('')}
                    </div>`;
                    fmContent.querySelectorAll('.fm-item').forEach((itemEl) => {
                        const file = shown.find(f => f.name === itemEl.dataset.name);
                        if (!file) return;
                        bindItemEvents(itemEl, file, () => {
                            if (file.type === 'dir') navigateToReal(file.handle, file.name);
                            else this.openFileWithApp(file, file.handle);
                        });
                    });
                    renderStatus();
                };

                const render = () => {
                    renderBreadcrumb();
                    try {
                        const titleText = currentDirHandle
                            ? (currentDirLabel || '本机文件夹')
                            : (currentPath === 'root' ? '此电脑' : labelOfPath(currentPath));
                        win.querySelector('.window-title').innerHTML =
                            '<span class="material-symbols-outlined text-sm">folder</span> ' + titleText;
                    } catch (e) {}
                    content.querySelectorAll('.fm-tree-item').forEach(t => {
                        const active = currentDirHandle ? t.dataset.path === '__local__' : t.dataset.path === currentPath;
                        t.classList.toggle('active', active);
                    });
                    if (currentPath === 'root' && !currentDirHandle) renderHome();
                    else if (currentDirHandle) renderRealDir();
                    else renderInternalDir();
                    renderStatus();
                    btn('back').disabled = historyBack.length === 0;
                    btn('forward').disabled = historyForward.length === 0;
                    btn('up').disabled = !currentDirHandle && currentPath === 'root';
                    btn('newfolder').disabled = !!currentDirHandle || currentPath === 'root';
                    btn('newfile').disabled = !!currentDirHandle || currentPath === 'root';
                    btn('paste').disabled = !!currentDirHandle || currentPath === 'root';
                    btn('delete').disabled = !!currentDirHandle || currentPath === 'root' || !selectedFile;
                    btn('rename').disabled = !!currentDirHandle || currentPath === 'root' || !selectedFile;
                };

                const renderStatus = () => {
                    if (currentPath === 'root' && !currentDirHandle) {
                        statusEl.textContent = `${Object.keys(dirMeta).length} 个文件夹 · 本机文件可导入`;
                        return;
                    }
                    if (currentDirHandle) {
                        const count = realEntries.length;
                        statusEl.textContent = selectedFile ? `已选择: ${selectedFile.name}` : `${count} 个项目（本机只读浏览）`;
                        return;
                    }
                    const files = fsList(currentPath);
                    statusEl.textContent = selectedFile
                        ? `已选择: ${selectedFile.name}${selectedFile.size ? ' · ' + formatSize(selectedFile.size) : ''}`
                        : `${files.length} 个项目`;
                };

                const formatSize = (bytes) => {
                    if (!bytes) return '';
                    if (bytes < 1024) return bytes + ' B';
                    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
                };

                const navigateTo = (path) => {
                    if (path === currentPath && !currentDirHandle) return;
                    historyBack.push({ path: currentPath, handle: currentDirHandle, label: currentDirLabel });
                    historyForward.length = 0;
                    currentPath = path;
                    currentDirHandle = null;
                    currentDirLabel = null;
                    selectedFile = null;
                    searchInput.value = '';
                    render();
                };

                const navigateToReal = (handle, label) => {
                    historyBack.push({ path: currentPath, handle: currentDirHandle, label: currentDirLabel });
                    historyForward.length = 0;
                    currentPath = null;
                    currentDirHandle = handle;
                    currentDirLabel = label || '本机文件夹';
                    selectedFile = null;
                    searchInput.value = '';
                    render();
                };

                const restoreState = (entry) => {
                    currentPath = entry.path;
                    currentDirHandle = entry.handle;
                    currentDirLabel = entry.label;
                    selectedFile = null;
                    searchInput.value = '';
                    render();
                };

                const refresh = () => { if (currentDirHandle) renderRealDir(); else render(); };

                const openContextMenu = (x, y, file) => {
                    this.removeAllContextMenus();
                    const menu = document.createElement('div');
                    menu.className = 'context-menu';
                    menu.style.position = 'absolute';
                    menu.style.zIndex = '1000';
                    const rect = content.getBoundingClientRect();
                    menu.style.left = Math.max(4, Math.min(x - rect.left, rect.width - 150)) + 'px';
                    menu.style.top = Math.max(4, Math.min(y - rect.top, rect.height - 190)) + 'px';
                    const isReal = !!file.handle;
                    menu.innerHTML = `
                        <div class="context-menu-item" data-action="open">打开</div>
                        <div class="context-menu-divider"></div>
                        ${isReal ? `
                        <div class="context-menu-item" data-action="props">属性</div>
                        ` : `
                        <div class="context-menu-item" data-action="rename">重命名</div>
                        <div class="context-menu-item" data-action="copy">复制</div>
                        <div class="context-menu-item" data-action="cut">剪切</div>
                        <div class="context-menu-divider"></div>
                        <div class="context-menu-item" data-action="props">属性</div>
                        <div class="context-menu-item" data-action="share">分享</div>
                        <div class="context-menu-item" data-action="delete">删除</div>
                        `}
                    `;
                    content.appendChild(menu);
                    const close = () => menu.remove();
                    menu.querySelector('[data-action="open"]').addEventListener('click', () => { close(); openItem(file); });
                    const renameEl = menu.querySelector('[data-action="rename"]');
                    if (renameEl) renameEl.addEventListener('click', () => { close(); renameFile(file); });
                    const copyEl = menu.querySelector('[data-action="copy"]');
                    if (copyEl) copyEl.addEventListener('click', () => {
                        this.copyFile = file; this.copyFilePath = currentPath; this.cutFile = null; this.cutFilePath = null;
                        close(); this.showToast('已复制，可到其它文件夹粘贴', 'content_copy');
                    });
                    const cutEl = menu.querySelector('[data-action="cut"]');
                    if (cutEl) cutEl.addEventListener('click', () => {
                        this.cutFile = file; this.cutFilePath = currentPath; this.copyFile = null; this.copyFilePath = null;
                        close(); this.showToast('已剪切，可到其它文件夹粘贴', 'content_cut');
                    });
                    const delEl = menu.querySelector('[data-action="delete"]');
                    if (delEl) delEl.addEventListener('click', () => { close(); removeFile(file); });
                    const shareEl = menu.querySelector('[data-action="share"]');
                    if (shareEl) shareEl.addEventListener('click', () => { close(); this.shareFile(file); });
                    menu.querySelector('[data-action="props"]').addEventListener('click', () => {
                        close();
                        this.showSystemDialog('属性',
                            `<div style="line-height:1.9;font-size:13px;">
                                <div>名称：${file.name}</div>
                                <div>类型：${file.type === 'dir' ? '文件夹' : (file.name.split('.').pop() || '文件')}</div>
                                <div>位置：${currentDirHandle ? (currentDirLabel || '本机文件夹') : labelOfPath(currentPath)}</div>
                                ${file.size ? `<div>大小：${formatSize(file.size)}</div>` : ''}
                                ${file.handle ? '<div style="color:#2ea043;">本机真实文件（只读）</div>' : '<div style="color:#888;">虚拟文件</div>'}
                            </div>`);
                    });
                    const onDoc = (e) => { if (!menu.contains(e.target)) { close(); document.removeEventListener('click', onDoc); } };
                    setTimeout(() => document.addEventListener('click', onDoc), 0);
                };

                const renameFile = (file) => {
                    if (!file || currentDirHandle) return;
                    this.showSystemDialog('重命名', '请输入新名称：', (newName) => {
                        const name = (newName || '').trim();
                        if (!name) return;
                        if (fsList(currentPath).some(f => f !== file && f.name === name)) {
                            this.showToast('同名文件已存在', 'error');
                            return;
                        }
                        file.name = name;
                        persist();
                        refresh();
                        this.showToast('已重命名', 'drive_file_rename_outline');
                    }, true);
                };

                const removeFile = (file) => {
                    if (!file || currentDirHandle) return;
                    this.showSystemDialog('删除', `确定要删除「${file.name}」吗？此操作不可撤销。`, () => {
                        const list = fsList(currentPath);
                        const idx = list.indexOf(file);
                        if (idx !== -1) list.splice(idx, 1);
                        selectedFile = null;
                        persist();
                        refresh();
                        this.showToast('已删除', 'delete');
                    });
                };

                const createEntry = (name, type) => {
                    const n = (name || '').trim();
                    if (!n) return;
                    const list = fsList(currentPath);
                    if (list.some(f => f.name === n)) { this.showToast('同名项目已存在', 'error'); return; }
                    if (type === 'dir') {
                        const key = `${currentPath}_${Date.now().toString(36)}`;
                        list.push({ name: n, type: 'dir', path: key });
                        this.fileSystem[key] = [];
                    } else {
                        list.push({ name: /\.\w+$/.test(n) ? n : n + '.txt', type: 'file', content: '' });
                    }
                    persist();
                    refresh();
                };

                btn('back').addEventListener('click', () => {
                    if (!historyBack.length) return;
                    historyForward.unshift({ path: currentPath, handle: currentDirHandle, label: currentDirLabel });
                    restoreState(historyBack.pop());
                });
                btn('forward').addEventListener('click', () => {
                    if (!historyForward.length) return;
                    historyBack.push({ path: currentPath, handle: currentDirHandle, label: currentDirLabel });
                    restoreState(historyForward.shift());
                });
                btn('up').addEventListener('click', () => {
                    if (currentDirHandle) { navigateTo('root'); return; }
                    if (currentPath === 'root') return;
                    const parent = findParentPath(currentPath);
                    navigateTo(parent || 'root');
                });
                btn('refresh').addEventListener('click', () => {
                    refresh();
                    this.showToast('已刷新', 'refresh');
                });
                btn('newfolder').addEventListener('click', () => {
                    if (currentDirHandle) { this.showToast('本机目录为只读浏览，请在虚拟文件夹中新建', 'lock'); return; }
                    if (currentPath === 'root') { this.showToast('请先进入一个文件夹', 'info'); return; }
                    this.showSystemDialog('新建文件夹', '请输入文件夹名称：', (name) => createEntry(name, 'dir'), true);
                });
                btn('newfile').addEventListener('click', () => {
                    if (currentDirHandle) { this.showToast('本机目录为只读浏览，请在虚拟文件夹中新建', 'lock'); return; }
                    if (currentPath === 'root') { this.showToast('请先进入一个文件夹', 'info'); return; }
                    this.showSystemDialog('新建文本文件', '文件名（可省略 .txt）：', (name) => createEntry(name, 'file'), true);
                });
                btn('delete').addEventListener('click', () => {
                    if (selectedFile) removeFile(selectedFile);
                });
                btn('rename').addEventListener('click', () => {
                    if (selectedFile) renameFile(selectedFile);
                });
                btn('paste').addEventListener('click', () => {
                    if (currentDirHandle) { this.showToast('本机目录为只读浏览，不能粘贴', 'lock'); return; }
                    if (currentPath === 'root') { this.showToast('请先进入一个文件夹', 'info'); return; }
                    const list = fsList(currentPath);
                    if (this.copyFile) {
                        const base = this.copyFile.name.replace(/(\.[^.]+)?$/, '');
                        const ext = (this.copyFile.name.match(/(\.[^.]+)$/) || [''])[0];
                        let name = `副本 - ${this.copyFile.name}`;
                        let n = 1;
                        while (list.some(f => f.name === name)) { name = `副本 (${n++}) - ${base}${ext}`; }
                        const cloned = JSON.parse(JSON.stringify(this.copyFile));
                        cloned.name = name;
                        if (cloned.type === 'dir') {
                            const key = `${currentPath}_${Date.now().toString(36)}`;
                            cloned.path = key;
                            this.fileSystem[key] = [];
                        }
                        list.push(cloned);
                        persist(); refresh();
                        this.showToast('已粘贴', 'content_paste');
                    } else if (this.cutFile) {
                        const srcPath = this.cutFilePath;
                        const srcList = fsList(srcPath);
                        const idx = srcList.indexOf(this.cutFile);
                        if (idx !== -1 && srcPath !== currentPath) {
                            srcList.splice(idx, 1);
                            list.push(this.cutFile);
                            persist(); refresh();
                            this.showToast('已移动', 'content_paste');
                        } else if (srcPath === currentPath) {
                            this.showToast('已在该文件夹内', 'info');
                        }
                        this.cutFile = null; this.cutFilePath = null;
                    } else {
                        this.showToast('剪贴板中没有内容', 'content_paste');
                    }
                });

                content.querySelectorAll('.fm-tree-item').forEach(el => {
                    el.addEventListener('click', () => {
                        if (el.dataset.path === '__local__') {
                            this.openLocalFolderFromDesktop((handle, label) => {
                                if (handle) navigateToReal(handle, label);
                            });
                            return;
                        }
                        navigateTo(el.dataset.path);
                        if (dirMeta[el.dataset.path]) fsList(el.dataset.path);
                    });
                });

                fmContent.addEventListener('contextmenu', (e) => {
                    if (e.target.closest('.fm-item') || e.target.closest('.fm-card')) return;
                    if (currentPath === 'root' || currentDirHandle) return;
                    e.preventDefault();
                    selectedFile = null;
                    renderStatus();
                    this.removeAllContextMenus();

            saveFileSystem() {
                const strip = (keepData) => {
                    const plain = {};
                    Object.keys(this.fileSystem).forEach(k => {
                        plain[k] = (this.fileSystem[k] || []).map(f => {
                            const o = { name: f.name, type: f.type };
                            if (f.path) o.path = f.path;
                            if (typeof f.content === 'string') o.content = f.content;
                            if (f.size) o.size = f.size;
                            if (keepData && f.dataUrl && f.dataUrl.length < 400000) o.dataUrl = f.dataUrl;
                            return o;
                        });
                    });
                    return JSON.stringify(plain);
                };
                try {
                    localStorage.setItem('raccoonos_filesystem', strip(true));
                } catch (e) {
                    try { localStorage.setItem('raccoonos_filesystem', strip(false)); } catch (e2) {}
                }
            }

            openLocalFolderFromDesktop(onReady) {
                if (this.fileSystemAccessSupported) {
                    this.openRealFolder((handle) => {
                        if (handle) onReady(handle, handle.name || '本机文件夹');
                    });
                    return;
                }
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.style.display = 'none';
                document.body.appendChild(input);
                input.addEventListener('change', async () => {
                    const files = Array.from(input.files || []);
                    input.remove();
                    if (!files.length) return;
                    const list = this.fileSystem['downloads'] = this.fileSystem['downloads'] || [];
                    let imported = 0;
                    for (const f of files) {
                        const kind = this.getFileKind(f.name);
                        const entry = { name: f.name, type: 'file', size: f.size };
                        if (kind === 'text' && f.size < 512 * 1024) {
                            try { entry.content = await f.text(); } catch (e) {}
                        } else if (kind === 'image' && f.size < 2 * 1024 * 1024) {
                            try {
                                entry.dataUrl = await new Promise((res, rej) => {
                                    const r = new FileReader();
                                    r.onload = () => res(r.result);
                                    r.onerror = rej;
                                    r.readAsDataURL(f);
                                });
                            } catch (e) {}
                        }
                        list.push(entry);
                        imported++;
                    }
                    this.saveFileSystem();
                    this.showToast('已导入 ' + imported + ' 个文件到「下载」', 'folder_open');
                    onReady(null, null);
                });
                input.click();
            }
            getFileKind(name) {
                const ext = (name.split('.').pop() || '').toLowerCase();
                if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'].includes(ext)) return 'image';
                if (['mp4', 'avi', 'mkv', 'mov', 'wmv', 'webm', 'flv', 'm4v', '3gp'].includes(ext)) return 'video';
                if (['mp3', 'wav', 'flac', 'ogg', 'm4a', 'aac', 'opus', 'mid', 'midi'].includes(ext)) return 'audio';
                if (['txt', 'md', 'log', 'json', 'js', 'css', 'html', 'xml', 'yml', 'yaml', 'ini', 'csv', 'bat', 'sh'].includes(ext)) return 'text';
                return 'other';
            }

            makeSvgImageUrl(name) {
                const palette = ['#2c3e50', '#20639b', '#16a085', '#c0392b', '#8e44ad', '#d35400'];
                const c = palette[(name.charCodeAt(0) || 0) % palette.length];
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420"><rect width="100%" height="100%" fill="${c}"/><rect x="20" y="20" width="600" height="380" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" rx="10"/><circle cx="320" cy="180" r="70" fill="rgba(255,255,255,0.18)"/><text x="320" y="300" font-size="26" fill="#fff" text-anchor="middle" font-family="sans-serif">${name}</text><text x="320" y="340" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle" font-family="sans-serif">示例图片（虚拟文件）</text></svg>`;
                return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            }

            makeToneWav(freq) {
                const sampleRate = 44100;
                const seconds = 2;
                const n = Math.floor(sampleRate * seconds);
                const buffer = new ArrayBuffer(44 + n * 2);
                const view = new DataView(buffer);
                const writeStr = (offset, text) => { for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i)); };
                writeStr(0, 'RIFF');
                view.setUint32(4, 36 + n * 2, true);
                writeStr(8, 'WAVE');
                writeStr(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, 1, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                writeStr(36, 'data');
                view.setUint32(40, n * 2, true);
                for (let i = 0; i < n; i++) {
                    const t = i / sampleRate;
                    const env = Math.min(1, t / 0.02) * Math.min(1, (seconds - t) / 0.02);
                    const v = Math.sin(2 * Math.PI * freq * t) * 0.5 * env;
                    view.setInt16(44 + i * 2, v * 32767, true);
                }
                return URL.createObjectURL(new Blob([view], { type: 'audio/wav' }));
            }

            async openFileWithApp(file, handle) {
                const kind = this.getFileKind(file.name);
                const winId = this.nextWindowId++;
                if (kind === 'image') {
                    let url = null;
                    if (handle) {
                        try { const blob = await handle.getFile(); if (blob) url = URL.createObjectURL(blob); } catch (e) {}
                    }
                    if (!url && file.dataUrl) url = file.dataUrl;
                    if (!url) url = this.makeSvgImageUrl(file.name);
                    const winElement = this.createImageViewerWindow(winId, [{ name: file.name, url }]);
                    this.finishOpenWindow(winElement, 'imagerviewer', winId);
                } else if (kind === 'video') {
                    let url = null;
                    if (handle) {
                        try { const blob = await handle.getFile(); if (blob) url = URL.createObjectURL(blob); } catch (e) {}
                    }
                    if (!url && file.dataUrl) url = file.dataUrl;
                    const winElement = this.createVideoViewerWindow(winId, [{ name: file.name, url, isVirtual: !handle }]);
                    this.finishOpenWindow(winElement, 'videoviewer', winId);
                } else if (kind === 'audio') {
                    let url = null;
                    if (handle) {
                        try { const blob = await handle.getFile(); if (blob) url = URL.createObjectURL(blob); } catch (e) {}
                    }
                    if (!url && file.dataUrl) url = file.dataUrl;
                    if (!url) url = this.makeToneWav(440 + (file.name.charCodeAt(0) % 400));
                    const winElement = this.createMusicPlayerWindow(winId, [{ name: file.name, url, isVirtual: !handle }]);
                    this.finishOpenWindow(winElement, 'musicplayer', winId);
                } else if (kind === 'text') {
                    let text = file.content || '';
                    if (handle) {
                        try { const blob = await handle.getFile(); text = await blob.text(); } catch (e) {}
                    }
                    const winElement = this.createTextViewerWindow(winId, file.name, text);
                    this.finishOpenWindow(winElement, 'textviewer', winId);
                } else {
                    this.showSystemDialog('打开文件', `暂不支持预览 "${file.name}"。`);
                }
            }

            finishOpenWindow(winElement, appName, id) {
                document.getElementById('desktop-area').appendChild(winElement);
                const winObj = { id, element: winElement, appName, minimized: false, taskbarButton: null,
                    savedPosition: { left: 120, top: 90, width: 800, height: 500 } };
                this.windows.push(winObj);
                this.addToTaskbar(winObj);
                this.activateWindow(winObj);
                this.placeWindow(winElement, winObj, 800, 500);
            }

                audio.addEventListener('play', updatePlaying);
                audio.addEventListener('pause', updatePlaying);
                audio.addEventListener('loadedmetadata', () => { seek.max = audio.duration || 0; durEl.textContent = fmt(audio.duration); });
                if (tracks.length > 0) {
                    renderPlaylist();
                    updatePlaying();
                    if (tracks[0] && tracks[0].url) { audio.src = tracks[0].url; audio.play().catch(() => {}); }

            createCalculatorWindow(id) {
                const win = this.createBaseWindow(id, 'calculate', '计算器');
                const content = win.querySelector('.window-content');
                content.style.display = 'flex';
                content.style.flexDirection = 'column';
                content.style.height = '100%';
                content.innerHTML = `
                    <div style="padding:16px 16px 8px;background:#2b2b2b;border-bottom:1px solid rgba(255,255,255,0.08);">
                        <div id="calc-expr" style="text-align:right;font-size:13px;color:#8a8a8a;height:20px;overflow:hidden;white-space:nowrap;"></div>
                        <div id="calc-display" style="text-align:right;font-size:38px;font-weight:300;color:#fff;height:50px;line-height:50px;overflow:hidden;">0</div>
                    </div>
                    <div class="calc-grid">
                        <button class="calc-btn fn" data-v="C">C</button>
                        <button class="calc-btn fn" data-v="&#177;">±</button>
                        <button class="calc-btn fn" data-v="%">%</button>
                        <button class="calc-btn op" data-v="/">÷</button>
                        <button class="calc-btn num" data-v="7">7</button>
                        <button class="calc-btn num" data-v="8">8</button>
                        <button class="calc-btn num" data-v="9">9</button>
                        <button class="calc-btn op" data-v="*">×</button>
                        <button class="calc-btn num" data-v="4">4</button>
                        <button class="calc-btn num" data-v="5">5</button>
                        <button class="calc-btn num" data-v="6">6</button>
                        <button class="calc-btn op" data-v="-">−</button>
                        <button class="calc-btn num" data-v="1">1</button>
                        <button class="calc-btn num" data-v="2">2</button>
                        <button class="calc-btn num" data-v="3">3</button>
                        <button class="calc-btn op" data-v="+">+</button>
                        <button class="calc-btn zero" data-v="0">0</button>
                        <button class="calc-btn num" data-v=".">.</button>
                        <button class="calc-btn op" data-v="(">(</button>
                        <button class="calc-btn op" data-v=")">)</button>
                        <button class="calc-btn op back" data-v="back">⌫</button>
                        <button class="calc-btn eq" data-v="=">=</button>
                    </div>
                `;
                const exprEl = content.querySelector('#calc-expr');
                const dispEl = content.querySelector('#calc-display');
                let expression = '';

                const update = () => {
                    dispEl.textContent = expression === '' ? '0' : expression;
                    exprEl.textContent = expression;
                };
                const calcResult = () => {
                    try {
                        let exp = expression;
                        exp = exp.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
                        if (!exp) return;
                        const result = Function('"use strict";return (' + exp + ')')();
                        const formatted = Number.isFinite(result) ? parseFloat(result.toPrecision(12)).toString() : '错误';
                        expression = formatted;
                        exprEl.textContent = exp + ' =';
                    } catch (e) { expression = '错误'; }
                    update();
                };
                content.querySelectorAll('.calc-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const v = btn.dataset.v;
                        if (v === 'C') { expression = ''; }
                        else if (v === 'back') { expression = expression.slice(0, -1); }
                        else if (v === '=') { calcResult(); return; }
                        else if (v === '±') {
                            try {
                                const m = expression.match(/^[+-]?(.*)$/);
                                expression = (expression.startsWith('-') ? expression.slice(1) : '-' + expression);
                            } catch (e) {}
                        }
                        else if (v === '%') {
                            expression = (parseFloat(expression) / 100).toString();
                        }
                        else { expression += v; }
                        update();
                    });
                });
                function calcKey(e) {
                    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
                    if (/^[0-9+\-*/.()]$/.test(e.key)) { expression += e.key; update(); }
                    else if (e.key === 'Enter') { calcResult(); }
                    else if (e.key === 'Backspace') { expression = expression.slice(0, -1); update(); }
                    else if (e.key.toLowerCase() === 'c') { expression = ''; update(); }
                }
                document.addEventListener('keydown', calcKey);
                const observer = new MutationObserver(() => {
                    if (!win.isConnected) { observer.disconnect(); document.removeEventListener('keydown', calcKey); }
                });
                observer.observe(win.parentNode || document.body, { childList: true, subtree: true });
                update();
                return win;
            }
