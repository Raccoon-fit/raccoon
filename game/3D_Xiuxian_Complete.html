            <!-- 通知区域 -->
            <div id="notification" class="notification"></div>
        </div>
    </div>

    <script>
        // 游戏主类
        class ImmortalCultivationGame {
            constructor() {
                // 游戏状态
                this.gameState = 'loading';
                this.gameTime = 0;
                this.lastTime = 0;
                this.deltaTime = 0;
                
                // Three.js相关
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                
                // 游戏对象
                this.player = null;
                this.npcs = [];
                this.enemies = [];
                this.items = [];
                this.terrain = null;
                this.skybox = null;
                
                // 游戏系统
                this.inputSystem = new InputSystem();
                this.uiSystem = new UISystem();
                this.inventorySystem = new InventorySystem(this);
                this.questSystem = new QuestSystem(this);
                this.combatSystem = new CombatSystem(this);
                this.craftingSystem = new CraftingSystem(this);
                this.dialogueSystem = new DialogueSystem(this);
                
                // 技能冷却状态
                this.skillCooldowns = {};
                
                // 游戏数据
                this.gameData = {
                    player: {
                        name: "无名修士",
                        level: 1,
                        xp: 0,
                        xpToNext: 100,
                        hp: 100,
                        maxHp: 100,
                        mp: 50,
                        maxMp: 50,
                        stats: {
                            attack: 10,
                            defense: 5,
                            spirit: 15,
                            mind: 8,
                            agility: 12,
                            luck: 5
                        },
                        cultivation: "炼气期",
                        realm: "一层",
                        skills: [
                            { id: 0, name: "火球术", damage: 15, cost: 5, cooldown: 1, element: "fire" },
                            { id: 1, name: "冰锥术", damage: 12, cost: 4, cooldown: 0.8, element: "ice" },
                            { id: 2, name: "雷击术", damage: 20, cost: 8, cooldown: 2, element: "lightning" },
                            { id: 3, name: "风刃术", damage: 10, cost: 3, cooldown: 0.5, element: "wind" },
                            { id: 4, name: "土墙术", damage: 5, cost: 6, cooldown: 3, element: "earth" },
                            { id: 5, name: "回春术", heal: 20, cost: 10, cooldown: 5, element: "wood" }
                        ],
                        position: { x: 0, y: 0, z: 0 },
                        rotation: 0
                    },
                    inventory: [],
                    quests: [],
                    completedQuests: [],
                    discoveredLocations: ["新手村"],
                    gameTime: 0,
                    settings: {
                        volume: 0.7,
                        graphics: "medium",
                        controls: "keyboard"
                    }
                };
                
                // 初始化游戏
                this.init();
            }
            
            async init() {
                console.log("开始初始化修仙游戏...");
                
                // 更新加载界面
                this.updateLoadingProgress(10, "正在初始化Three.js引擎...");
                
                try {
                    // 加载Three.js库
                    await this.loadThreeJS();
                    this.updateLoadingProgress(20, "Three.js加载完成，正在创建场景...");
                    
                    // 初始化Three.js场景
                    this.initThreeJS();
                    this.updateLoadingProgress(30, "场景创建完成，正在生成地形...");
                    
                    // 创建游戏世界
                    this.createWorld();
                    this.updateLoadingProgress(50, "世界生成完成，正在创建玩家...");
                    
                    // 创建玩家角色
                    this.createPlayer();
                    this.updateLoadingProgress(60, "玩家创建完成，正在初始化NPC...");
                    
                    // 创建NPC和敌人
                    this.createNPCs();
                    this.updateLoadingProgress(70, "NPC初始化完成，正在加载UI系统...");
                    
                    // 初始化UI系统
                    this.uiSystem.init(this);
                    this.updateLoadingProgress(80, "UI系统加载完成，正在初始化游戏系统...");
                    
                    // 初始化游戏系统
                    this.initGameSystems();
                    this.updateLoadingProgress(90, "游戏系统初始化完成，正在准备开始...");
                    
                    // 加载提示
                    this.loadTips();
                    
                    // 隐藏加载界面，显示主菜单
                    setTimeout(() => {
                        this.updateLoadingProgress(100, "游戏加载完成！");
                        setTimeout(() => {
                            document.getElementById('loadingScreen').style.opacity = '0';
                            setTimeout(() => {
                                document.getElementById('loadingScreen').style.display = 'none';
                                document.getElementById('mainMenu').style.display = 'flex';
                                this.gameState = 'menu';
                            }, 500);
                        }, 1000);
                    }, 1000);
                    
                } catch (error) {
                    console.error("游戏初始化失败:", error);
                    document.getElementById('loadingText').textContent = "初始化失败: " + error.message;
                }
            }
            
            updateLoadingProgress(percent, text) {
                document.getElementById('loadingBar').style.width = percent + '%';
                document.getElementById('loadingText').textContent = text;
            }
            
            loadTips() {
                const tips = [
                    "修炼之道，贵在坚持，日积月累方成大道",
                    "丹药可助你快速突破瓶颈，但过度依赖会根基不稳",
                    "不同的敌人有不同的弱点，观察是制胜的关键",
                    "探索世界寻找机缘，天材地宝往往藏在危险之地",
                    "与其他修士交好可获得帮助，但也要小心人心叵测",
                    "炼器可增强你的实力，一件好的法宝可越级挑战",
                    "注意你的灵力消耗，枯竭时连凡人都不如",
                    "洞天福地是修炼的绝佳场所，灵气浓度决定修炼速度",
                    "心魔是每个修士的大敌，保持道心清明至关重要",
                    "境界突破时会有天劫降临，务必做好充分准备"
                ];
                
                const randomTip = tips[Math.floor(Math.random() * tips.length)];
                document.getElementById('tipContainer').textContent = "提示: " + randomTip;
            }
            
            async loadThreeJS() {
                // 如果Three.js未加载，动态加载
                if (typeof THREE === 'undefined') {
                    return new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                }
            }
            
            initThreeJS() {
                // 创建场景
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x1a1a3a);
                this.scene.fog = new THREE.Fog(0x1a1a3a, 50, 200);
                
                // 创建相机
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.camera.position.set(0, 15, 20);
                this.camera.lookAt(0, 0, 0);
                
                // 创建渲染器
                this.renderer = new THREE.WebGLRenderer({
                    canvas: document.getElementById('gameCanvas'),
                    antialias: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                
                // 添加光源
                const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(50, 100, 50);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                directionalLight.shadow.camera.near = 0.5;
                directionalLight.shadow.camera.far = 500;
                directionalLight.shadow.camera.left = -100;
                directionalLight.shadow.camera.right = 100;
                directionalLight.shadow.camera.top = 100;
                directionalLight.shadow.camera.bottom = -100;
                this.scene.add(directionalLight);
                
                // 添加半球光
                const hemisphereLight = new THREE.HemisphereLight(0x6060ff, 0x404040, 0.3);
                this.scene.add(hemisphereLight);
                
                // 初始化输入系统
                this.inputSystem.init(this);
                
                // 窗口调整事件
                window.addEventListener('resize', () => this.onWindowResize());
            }
            
            createWorld() {
                // 创建地形
                this.createTerrain();
                
                // 添加环境元素
                this.addEnvironmentalElements();
                
                // 创建天空
                this.createSky();
            }
            
            createTerrain() {
                const terrainSize = 500;
                const segments = 100;
                
                // 使用PlaneGeometry创建地形
                const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);
                
                // 修改顶点高度创建地形起伏
                const vertices = geometry.attributes.position.array;
                for (let i = 0; i < vertices.length; i += 3) {
                    const x = vertices[i];
                    const y = vertices[i + 1];
                    // 使用噪声函数创建自然地形
                    vertices[i + 2] = Math.sin(x * 0.02) * 5 + Math.cos(y * 0.02) * 5;
                }
                geometry.computeVertexNormals();
                
                // 创建地形材质
                const material = new THREE.MeshStandardMaterial({
                    color: 0x2a4a2a,
                    roughness: 0.8,
                    metalness: 0.2
                });
                
                this.terrain = new THREE.Mesh(geometry, material);
                this.terrain.rotation.x = -Math.PI / 2;
                this.terrain.receiveShadow = true;
                this.scene.add(this.terrain);
                
                // 添加水面
                const waterGeometry = new THREE.PlaneGeometry(terrainSize, terrainSize);
                const waterMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a3a5a,
                    transparent: true,
                    opacity: 0.7,
                    roughness: 0.1,
                    metalness: 0.8
                });
                const water = new THREE.Mesh(waterGeometry, waterMaterial);
                water.rotation.x = -Math.PI / 2;
                water.position.y = -2;
                this.scene.add(water);
            }
            
            addEnvironmentalElements() {
                // 添加树木
                for (let i = 0; i < 100; i++) {
                    const tree = this.createTree();
                    const x = (Math.random() - 0.5) * 400;
                    const z = (Math.random() - 0.5) * 400;
                    
                    // 避免在出生点附近生成
                    if (Math.abs(x) < 20 && Math.abs(z) < 20) continue;
                    
                    tree.position.set(x, 0, z);
                    tree.castShadow = true;
                    tree.receiveShadow = true;
                    this.scene.add(tree);
                }
                
                // 添加石头
                for (let i = 0; i < 50; i++) {
                    const rock = this.createRock();
                    const x = (Math.random() - 0.5) * 400;
                    const z = (Math.random() - 0.5) * 400;
                    
                    if (Math.abs(x) < 20 && Math.abs(z) < 20) continue;
                    
                    rock.position.set(x, 0, z);
                    rock.castShadow = true;
                    rock.receiveShadow = true;
                    this.scene.add(rock);
                }
                
                // 添加花朵
                for (let i = 0; i < 200; i++) {
                    const flower = this.createFlower();
                    const x = (Math.random() - 0.5) * 400;
                    const z = (Math.random() - 0.5) * 400;
                    
                    if (Math.abs(x) < 20 && Math.abs(z) < 20) continue;
                    
                    flower.position.set(x, 0, z);
                    this.scene.add(flower);
                }
                
                // 添加发光粒子
                this.createParticles();
            }
            
            createTree() {
                const group = new THREE.Group();
                
                // 树干
                const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.8, 5, 8);
                const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x4a3020 });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.y = 2.5;
                trunk.castShadow = true;
                group.add(trunk);
                
                // 树冠
                const leavesGeometry = new THREE.ConeGeometry(3, 6, 8);
                const leavesMaterial = new THREE.MeshStandardMaterial({ color: 0x2a6a2a });
                const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                leaves.position.y = 7;
                leaves.castShadow = true;
                group.add(leaves);
                
                return group;
            }
            
            createRock() {
                const geometry = new THREE.DodecahedronGeometry(Math.random() * 2 + 1, 0);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x606060,
                    roughness: 0.9
                });
                const rock = new THREE.Mesh(geometry, material);
                rock.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                rock.scale.y = 0.5;
                return rock;
            }
            
            createFlower() {
                const group = new THREE.Group();
                
                // 花茎
                const stemGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 4);
                const stemMaterial = new THREE.MeshStandardMaterial({ color: 0x2a8a2a });
                const stem = new THREE.Mesh(stemGeometry, stemMaterial);
                stem.position.y = 0.25;
                group.add(stem);
                
                // 花瓣
                const petalGeometry = new THREE.SphereGeometry(0.1, 4, 4);
                const petalColors = [0xff6666, 0xff66ff, 0x66ffff, 0xffff66, 0x66ff66];
                const petalMaterial = new THREE.MeshStandardMaterial({
                    color: petalColors[Math.floor(Math.random() * petalColors.length)]
                });
                const petal = new THREE.Mesh(petalGeometry, petalMaterial);
                petal.position.y = 0.5;
                group.add(petal);
                
                return group;
            }
            
            createParticles() {
                const particleCount = 500;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);
                
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 400;
                    positions[i * 3 + 1] = Math.random() * 20;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 400;
                    
                    colors[i * 3] = 0.5 + Math.random() * 0.5;
                    colors[i * 3 + 1] = 0.5 + Math.random() * 0.5;
                    colors[i * 3 + 2] = 1;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                const material = new THREE.PointsMaterial({
                    size: 0.3,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6
                });
                
                const particles = new THREE.Points(geometry, material);
                this.scene.add(particles);
            }
            
            createSky() {
                const skyGeometry = new THREE.SphereGeometry(400, 32, 32);
                const skyMaterial = new THREE.MeshBasicMaterial({
                    color: 0x0a0a2a,
                    side: THREE.BackSide
                });
                this.skybox = new THREE.Mesh(skyGeometry, skyMaterial);
                this.scene.add(this.skybox);
                
                // 添加星星
                const starGeometry = new THREE.BufferGeometry();
                const starCount = 1000;
                const starPositions = new Float32Array(starCount * 3);
                
                for (let i = 0; i < starCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    const radius = 350;
                    
                    starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    starPositions[i * 3 + 1] = radius * Math.cos(phi);
                    starPositions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
                }
                
                starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
                const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1 });
                const stars = new THREE.Points(starGeometry, starMaterial);
                this.scene.add(stars);
            }
            
            createPlayer() {
                // 创建玩家网格
                const playerGroup = new THREE.Group();
                
                // 身体
                const bodyGeometry = new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8);
                const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a8a });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.position.y = 0.75;
                body.castShadow = true;
                playerGroup.add(body);
                
                // 头部
                const headGeometry = new THREE.SphereGeometry(0.35, 8, 8);
                const headMaterial = new THREE.MeshStandardMaterial({ color: 0xffccaa });
                const head = new THREE.Mesh(headGeometry, headMaterial);
                head.position.y = 1.7;
                head.castShadow = true;
                playerGroup.add(head);
                
                // 眼睛
                const eyeGeometry = new THREE.SphereGeometry(0.05, 4, 4);
                const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                leftEye.position.set(-0.1, 1.75, 0.3);
                playerGroup.add(leftEye);
                
                const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                rightEye.position.set(0.1, 1.75, 0.3);
                playerGroup.add(rightEye);
                
                // 手臂
                const armGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 4);
                const armMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a8a });
                
                const leftArm = new THREE.Mesh(armGeometry, armMaterial);
                leftArm.position.set(-0.5, 0.9, 0);
                leftArm.rotation.z = 0.3;
                leftArm.castShadow = true;
                playerGroup.add(leftArm);
                
                const rightArm = new THREE.Mesh(armGeometry, armMaterial);
                rightArm.position.set(0.5, 0.9, 0);
                rightArm.rotation.z = -0.3;
                rightArm.castShadow = true;
                playerGroup.add(rightArm);
                
                // 剑
                const swordHandleGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 4);
                const swordHandleMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                const swordHandle = new THREE.Mesh(swordHandleGeometry, swordHandleMaterial);
                swordHandle.position.set(0.5, 0.5, 0.3);
                swordHandle.rotation.x = Math.PI / 4;
                playerGroup.add(swordHandle);
                
                const swordBladeGeometry = new THREE.BoxGeometry(0.08, 1, 0.02);
                const swordBladeMaterial = new THREE.MeshStandardMaterial({
                    color: 0xcccccc,
                    metalness: 0.8,
                    roughness: 0.2
                });
                const swordBlade = new THREE.Mesh(swordBladeGeometry, swordBladeMaterial);
                swordBlade.position.set(0.5, 0.1, 0.55);
                swordBlade.rotation.x = Math.PI / 4;
                swordBlade.castShadow = true;
                playerGroup.add(swordBlade);
                
                this.player = playerGroup;
                this.player.position.set(0, 0, 0);
                this.scene.add(this.player);
            }
            
            createNPCs() {
                // 神秘老人
                const oldMan = this.createNPC('神秘老人', 0x666666);
                oldMan.position.set(10, 0, 15);
                oldMan.userData = {
                    name: '神秘老人',
                    dialogues: [
                        { speaker: '神秘老人', text: '少年，我看你骨骼清奇，是修炼的好材料。这本基础修炼法诀就送给你了。' },
                        { speaker: '神秘老人', text: '修炼之道，贵在坚持。日积月累，方可突破瓶颈。' },
                        { speaker: '神秘老人', text: '东边有一片妖兽森林，那里有不少修炼资源，但也要小心其中的妖兽。' }
                    ]
                };
                this.npcs.push(oldMan);
                this.scene.add(oldMan);
                
                // 炼丹师
                const alchemist = this.createNPC('炼丹师', 0x4a3020);
                alchemist.position.set(-15, 0, 10);
                alchemist.userData = {
                    name: '炼丹师',
                    dialogues: [
                        { speaker: '炼丹师', text: '炼制丹药需要各种灵草和材料，你可以采集后拿来换取丹药。' },
                        { speaker: '炼丹师', text: '回春丹可恢复生命，聚气丹可恢复灵力，都是出门历练的必备之物。' }
                    ]
                };
                this.npcs.push(alchemist);
                this.scene.add(alchemist);
                
                // 武器商人
                const weaponMerchant = this.createNPC('武器商', 0x8B4513);
                weaponMerchant.position.set(20, 0, -10);
                weaponMerchant.userData = {
                    name: '武器商',
                    dialogues: [
                        { speaker: '武器商', text: '我这有各种法器，助你斩妖除魔。' },
                        { speaker: '武器商', text: '更好的武器需要更高级的材料来换取。' }
                    ]
                };
                this.npcs.push(weaponMerchant);
                this.scene.add(weaponMerchant);
                
                // 创建敌人
                this.createEnemies();
            }
            
            createNPC(name, color) {
                const group = new THREE.Group();
                
                // 身体
                const bodyGeometry = new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8);
                const bodyMaterial = new THREE.MeshStandardMaterial({ color: color });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.position.y = 0.75;
                body.castShadow = true;
                group.add(body);
                
                // 头部
                const headGeometry = new THREE.SphereGeometry(0.35, 8, 8);
                const headMaterial = new THREE.MeshStandardMaterial({ color: 0xffccaa });
                const head = new THREE.Mesh(headGeometry, headMaterial);
                head.position.y = 1.7;
                head.castShadow = true;
                group.add(head);
                
                return group;
            }
            
            createEnemies() {
                // 创建几种不同类型的敌人
                const enemyTypes = [
                    { name: '妖兽', color: 0x8B0000, health: 50, damage: 5 },
                    { name: '僵尸', color: 0x2F4F4F, health: 30, damage: 3 },
                    { name: '妖怪', color: 0x4B0082, health: 40, damage: 4 }
                ];
                
                // 在世界各处生成敌人
                for (let i = 0; i < 15; i++) {
                    const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                    const enemy = this.createEnemy(type);
                    
                    // 随机位置
                    let x, z;
                    do {
                        x = (Math.random() - 0.5) * 300;
                        z = (Math.random() - 0.5) * 300;
                    } while (Math.abs(x) < 30 && Math.abs(z) < 30);
                    
                    enemy.position.set(x, 0, z);
                    enemy.userData = {
                        name: type.name,
                        health: type.health,
                        maxHealth: type.health,
                        damage: type.damage,
                        lastAttack: 0
                    };
                    
                    this.enemies.push(enemy);
                    this.scene.add(enemy);
                }
            }
            
            createEnemy(type) {
                const group = new THREE.Group();
                
                // 身体 - 根据类型使用不同形状
                let bodyGeometry;
                if (type.name === '妖兽') {
                    bodyGeometry = new THREE.BoxGeometry(2, 2, 3);
                } else if (type.name === '僵尸') {
                    bodyGeometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 8);
                } else {
                    bodyGeometry = new THREE.SphereGeometry(1, 8, 8);
                }
                
                const bodyMaterial = new THREE.MeshStandardMaterial({ color: type.color });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.position.y = 1;
                body.castShadow = true;
                group.add(body);
                
                // 眼睛
                const eyeGeometry = new THREE.SphereGeometry(0.15, 4, 4);
                const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                
                const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                leftEye.position.set(-0.3, 1.5, 0.8);
                group.add(leftEye);
                
                const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                rightEye.position.set(0.3, 1.5, 0.8);
                group.add(rightEye);
                
                return group;
            }
            
            initGameSystems() {
                // 初始化背包系统
                this.inventorySystem.init();
                
                // 初始化任务系统
                this.questSystem.init();
                
                // 初始化制作系统
                this.craftingSystem.init();
                
                // 初始化对话系统
                this.dialogueSystem.init();
            }
            
            startGame() {
                this.gameState = 'playing';
                document.getElementById('mainMenu').style.display = 'none';
                this.showNotification("欢迎来到修仙世界！", 0x00FFFF);
            }
            
            update() {
                if (this.gameState !== 'playing') return;
                
                // 计算时间增量
                const currentTime = performance.now();
                this.deltaTime = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;
                
                // 更新玩家移动
                this.updatePlayerMovement();
                
                // 更新敌人
                this.updateEnemies();
                
                // 更新相机
                this.updateCamera();
                
                // 更新UI
                this.uiSystem.update();
                
                // 更新技能冷却
                this.updateSkillCooldowns();
                
                // 渲染场景
                this.render();
                
                // 继续循环
                requestAnimationFrame(() => this.update());
            }
            
            updatePlayerMovement() {
                const input = this.inputSystem.getInput();
                const speed = 15;
                const rotationSpeed = 3;
                
                // 计算移动方向
                if (input.forward) {
                    this.player.position.x -= Math.sin(this.player.rotation.y) * speed * this.deltaTime;
                    this.player.position.z -= Math.cos(this.player.rotation.y) * speed * this.deltaTime;
                }
                if (input.backward) {
                    this.player.position.x += Math.sin(this.player.rotation.y) * speed * 0.5 * this.deltaTime;
                    this.player.position.z += Math.cos(this.player.rotation.y) * speed * 0.5 * this.deltaTime;
                }
                if (input.left) {
                    this.player.rotation.y += rotationSpeed * this.deltaTime;
                }
                if (input.right) {
                    this.player.rotation.y -= rotationSpeed * this.deltaTime;
                }
                
                // 限制移动范围
                this.player.position.x = Math.max(-200, Math.min(200, this.player.position.x));
                this.player.position.z = Math.max(-200, Math.min(200, this.player.position.z));
                
                // 跳跃
                if (input.jump) {
                    this.player.position.y = Math.abs(Math.sin(Date.now() * 0.003)) * 3;
                }
                
                // 更新游戏数据
                this.gameData.player.position.x = this.player.position.x;
                this.gameData.player.position.y = this.player.position.y;
                this.gameData.player.position.z = this.player.position.z;
                this.gameData.player.rotation = this.player.rotation.y;
            }
            
            updateEnemies() {
                this.enemies.forEach(enemy => {
                    if (enemy.userData.health <= 0) return;
                    
                    // 计算与玩家的距离
                    const dx = this.player.position.x - enemy.position.x;
                    const dz = this.player.position.z - enemy.position.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    
                    // 如果玩家在附近，追击玩家
                    if (distance < 50) {
                        const speed = 5;
                        const directionX = dx / distance;
                        const directionZ = dz / distance;
                        
                        enemy.position.x += directionX * speed * this.deltaTime;
                        enemy.position.z += directionZ * speed * this.deltaTime;
                        
                        // 朝向玩家
                        enemy.lookAt(this.player.position.x, enemy.position.y, this.player.position.z);
                        
                        // 攻击玩家
                        if (distance < 3) {
                            this.combatSystem.enemyAttack(enemy);
                        }
                    }
                });
            }
            
            updateCamera() {
                // 第三人称相机跟随
                const cameraOffset = new THREE.Vector3(0, 15, 20);
                const targetPosition = new THREE.Vector3(
                    this.player.position.x,
                    this.player.position.y,
                    this.player.position.z
                );
                
                // 相机平滑跟随
                this.camera.position.lerp(
                    targetPosition.clone().add(cameraOffset),
                    0.05
                );
                this.camera.lookAt(targetPosition);
            }
            
            updateSkillCooldowns() {
                const now = Date.now();
                Object.keys(this.skillCooldowns).forEach(skillId => {
                    if (this.skillCooldowns[skillId] <= now) {
                        delete this.skillCooldowns[skillId];
                        // 更新UI显示
                        const slot = document.querySelector(`.skill-slot[data-skill="${skillId}"]`);
                        if (slot) {
                            const cooldownEl = slot.querySelector('.skill-cooldown');
                            if (cooldownEl) cooldownEl.remove();
                        }
                    }
                });
            }
            
            castSkill(skillIndex) {
                if (this.gameState !== 'playing') return;
                
                const skill = this.gameData.player.skills[skillIndex];
                if (!skill) return;
                
                // 检查冷却
                if (this.skillCooldowns[skillIndex]) {
                    this.showNotification("技能冷却中...", 0xff6666);
                    return;
                }
                
                // 检查MP
                if (this.gameData.player.mp < skill.cost) {
                    this.showNotification("灵力不足！", 0x6666ff);
                    return;
                }
                
                // 消耗MP
                this.gameData.player.mp -= skill.cost;
                this.uiSystem.updatePlayerInfo();
                
                // 设置冷却
                this.skillCooldowns[skillIndex] = Date.now() + skill.cooldown * 1000;
                
                // 显示冷却
                const slot = document.querySelector(`.skill-slot[data-skill="${skillIndex}"]`);
                if (slot) {
                    let cooldownEl = slot.querySelector('.skill-cooldown');
                    if (!cooldownEl) {
                        cooldownEl = document.createElement('div');
                        cooldownEl.className = 'skill-cooldown';
                        slot.appendChild(cooldownEl);
                    }
                    cooldownEl.textContent = skill.cooldown;
                }
                
                // 播放技能特效
                this.showSkillEffect(skillIndex);
                
                // 播放音效
                this.playSkillSound(skillIndex);
                
                // 根据元素类型执行技能
                switch(skill.element) {
                    case 'fire':
                        this.combatSystem.castFireball(skill);
                        break;
                    case 'ice':
                        this.combatSystem.castIceBolt(skill);
                        break;
                    case 'lightning':
                        this.combatSystem.castLightning(skill);
                        break;
                    case 'wind':
                        this.combatSystem.castWindSlash(skill);
                        break;
                    case 'earth':
                        this.combatSystem.castEarthWall(skill);
                        break;
                    case 'wood':
                        this.combatSystem.castHeal(skill);
                        break;
                }
            }
            
            showSkillEffect(skillIndex) {
                const skillEffects = {
                    0: { color: 0xFF5500, size: 1 }, // 火
                    1: { color: 0x00AAFF, size: 0.8 }, // 冰
                    2: { color: 0xFFDD00, size: 1.2 }, // 雷
                    3: { color: 0x00FF00, size: 0.7 }, // 风
                    4: { color: 0x8B4513, size: 1.5 }, // 土
                    5: { color: 0x00FF00, size: 1 } // 木
                };
                
                const effect = skillEffects[skillIndex];
                if (!effect) return;
                
                // 创建技能特效
                const geometry = new THREE.SphereGeometry(effect.size, 16, 16);
                const material = new THREE.MeshBasicMaterial({
                    color: effect.color,
                    transparent: true,
                    opacity: 0.8
                });
                
                const skillMesh = new THREE.Mesh(geometry, material);
                skillMesh.position.copy(this.player.position);
                skillMesh.position.y += 2;
                this.scene.add(skillMesh);
                
                // 动画效果
                let scale = 0.1;
                const animate = () => {
                    scale += 0.1;
                    skillMesh.scale.set(scale, scale, scale);
                    material.opacity -= 0.05;
                    
                    if (material.opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        this.scene.remove(skillMesh);
                    }
                };
                
                animate();
            }
            
            showDamageText(x, y, z, text, color) {
                // 创建2D文字元素
                const damageText = document.createElement('div');
                damageText.className = 'damage-text';
                damageText.textContent = text;
                damageText.style.color = `rgb(${(color >> 16) & 255}, ${(color >> 8) & 255}, ${color & 255})`;
                damageText.style.position = 'absolute';
                damageText.style.left = '50%';
                damageText.style.top = '50%';
                
                document.getElementById('uiOverlay').appendChild(damageText);
                
                // 3D到2D坐标转换
                const vector = new THREE.Vector3(x, y, z);
                vector.project(this.camera);
                
                const xPos = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const yPos = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                
                damageText.style.left = `${xPos}px`;
                damageText.style.top = `${yPos}px`;
                
                // 移除动画
                setTimeout(() => {
                    damageText.remove();
                }, 1000);
            }
            
            showNotification(message, color = 0xFFFFFF) {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.style.color = `rgb(${(color >> 16) & 255}, ${(color >> 8) & 255}, ${color & 255})`;
                notification.style.display = 'block';
                
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 3000);
            }
            
            playSkillSound(skillIndex) {
                // 在实际游戏中，这里会播放音效
                console.log(`播放技能 ${skillIndex} 的音效`);
            }
            
            startDialogue(npc) {
                this.gameState = 'dialogue';
                this.dialogueSystem.startDialogue(npc);
            }
            
            render() {
                // 渲染场景
                if (this.renderer && this.scene && this.camera) {
                    this.renderer.render(this.scene, this.camera);
                }
            }
            
            onWindowResize() {
                if (this.camera && this.renderer) {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                }
            }
        }
        
        // 输入系统
        class InputSystem {
            constructor() {
                this.keys = {};
                this.mouse = { x: 0, y: 0 };
                this.mouseButtons = {};
            }
            
            init(game) {
                this.game = game;
                
                // 键盘事件
                document.addEventListener('keydown', (e) => this.onKeyDown(e));
                document.addEventListener('keyup', (e) => this.onKeyUp(e));
                
                // 鼠标事件
                document.addEventListener('mousemove', (e) => this.onMouseMove(e));
                document.addEventListener('mousedown', (e) => this.onMouseDown(e));
                document.addEventListener('mouseup', (e) => this.onMouseUp(e));
                
                // 防止上下文菜单
                document.addEventListener('contextmenu', (e) => e.preventDefault());
                
                // 窗口失去焦点时重置按键
                window.addEventListener('blur', () => this.resetKeys());
            }
            
            onKeyDown(e) {
                this.keys[e.key.toLowerCase()] = true;
                
                // 处理快捷键
                if (this.game.gameState === 'playing') {
                    // 技能快捷键
                    if (e.key >= '1' && e.key <= '6') {
                        const skillIndex = parseInt(e.key) - 1;
                        this.game.castSkill(skillIndex);
                    }
                    
                    // 打开背包
                    if (e.key === 'i' || e.key === 'I') {
                        this.game.uiSystem.toggleInventory();
                    }
                    
                    // 打开角色面板
                    if (e.key === 'c' || e.key === 'C') {
                        this.game.uiSystem.toggleCharacterPanel();
                    }
                    
                    // 打开地图
                    if (e.key === 'm' || e.key === 'M') {
                        this.game.uiSystem.toggleMap();
                    }
                    
                    // 打开任务
                    if (e.key === 'q' || e.key === 'Q') {
                        this.game.uiSystem.toggleQuestPanel();
                    }
                    
                    // 打开制作
                    if (e.key === 'f' || e.key === 'F') {
                        this.game.uiSystem.toggleCrafting();
                    }
                    
                    // 退出菜单
                    if (e.key === 'Escape') {
                        this.game.uiSystem.toggleMainMenu();
                    }
                }
            }
            
            onKeyUp(e) {
                this.keys[e.key.toLowerCase()] = false;
            }
            
            onMouseMove(e) {
                this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            }
            
            onMouseDown(e) {
                this.mouseButtons[e.button] = true;
            }
            
            onMouseUp(e) {
                this.mouseButtons[e.button] = false;
            }
            
            resetKeys() {
                this.keys = {};
                this.mouseButtons = {};
            }
            
            getInput() {
                return {
                    forward: this.keys['w'] || this.keys['arrowup'],
                    backward: this.keys['s'] || this.keys['arrowdown'],
                    left: this.keys['a'] || this.keys['arrowleft'],
                    right: this.keys['d'] || this.keys['arrowright'],
                    jump: this.keys[' '],
                    interact: this.keys['e'],
                    attack: this.mouseButtons[0]
                };
            }
        }
        
        // UI系统
        class UISystem {
            constructor() {
                this.game = null;
                this.interactionHint = null;
            }
            
            init(game) {
                this.game = game;
                
                // 初始化UI事件
                this.initEvents();
                
                // 更新玩家信息
                this.updatePlayerInfo();
                
                // 初始化任务列表
                this.initQuests();
                
                // 初始化背包
                this.initInventory();
                
                // 初始化技能
                this.initSkills();
            }
            
            initEvents() {
                // 主菜单按钮
                document.getElementById('continueButton').addEventListener('click', () => this.toggleMainMenu());
                document.getElementById('newGameButton').addEventListener('click', () => this.startNewGame());
                document.getElementById('settingsButton').addEventListener('click', () => this.showSettings());
                document.getElementById('aboutButton').addEventListener('click', () => this.showAbout());
                
                // 技能点击
                document.querySelectorAll('.skill-slot').forEach(slot => {
                    slot.addEventListener('click', (e) => {
                        const skillIndex = parseInt(e.currentTarget.dataset.skill);
                        this.game.castSkill(skillIndex);
                    });
                });
                
                // 背包标签
                document.querySelectorAll('.inventory-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        document.querySelectorAll('.inventory-tab').forEach(t => t.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                        this.filterInventory(e.currentTarget.dataset.tab);
                    });
                });
                
                // 关闭按钮
                document.getElementById('closeInventoryButton').addEventListener('click', () => this.toggleInventory());
                document.getElementById('closeCharacterButton').addEventListener('click', () => this.toggleCharacterPanel());
                document.getElementById('closeMapButton').addEventListener('click', () => this.toggleMap());
                document.getElementById('closeCraftingButton').addEventListener('click', () => this.toggleCrafting());
                document.getElementById('toggleMapButton').addEventListener('click', () => this.toggleMap());
            }
            
            update() {
                // 更新小地图
                this.updateMinimap();
                
                // 更新交互提示
                this.updateInteractionHint();
            }
            
            updatePlayerInfo() {
                const player = this.game.gameData.player;
                
                // 更新文本
                document.getElementById('playerName').textContent = player.name;
                document.getElementById('playerLevel').textContent = `${player.cultivation} ${player.realm}`;
                
                // 更新血条
                const hpPercent = (player.hp / player.maxHp) * 100;
                document.getElementById('hpBar').style.width = `${hpPercent}%`;
                document.getElementById('hpText').textContent = `${Math.floor(player.hp)}/${player.maxHp}`;
                
                // 更新蓝条
                const mpPercent = (player.mp / player.maxMp) * 100;
                document.getElementById('mpBar').style.width = `${mpPercent}%`;
                document.getElementById('mpText').textContent = `${Math.floor(player.mp)}/${player.maxMp}`;
                
                // 更新经验条
                const xpPercent = (player.xp / player.xpToNext) * 100;
                document.getElementById('xpBar').style.width = `${xpPercent}%`;
                document.getElementById('xpText').textContent = `${player.xp}/${player.xpToNext}`;
                
                // 更新属性
                document.getElementById('attackValue').textContent = player.stats.attack;
                document.getElementById('defenseValue').textContent = player.stats.defense;
                document.getElementById('spiritValue').textContent = player.stats.spirit;
                document.getElementById('mindValue').textContent = player.stats.mind;
            }
            
            updateMinimap() {
                const canvas = document.getElementById('minimapCanvas');
                const ctx = canvas.getContext('2d');
                
                if (!canvas || !ctx) return;
                
                // 设置画布大小
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                
                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制地图背景
                ctx.fillStyle = '#1a1a3a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格
                ctx.strokeStyle = '#3a3a8a';
                ctx.lineWidth = 1;
                
                const gridSize = 20;
                
                for (let x = 0; x < canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                for (let y = 0; y < canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                
                // 中心点（玩家位置）
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                // 绘制玩家
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制玩家方向
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(
                    centerX + Math.sin(this.game.player.rotation.y) * 10,
                    centerY + Math.cos(this.game.player.rotation.y) * 10
                );
                ctx.stroke();
                
                // 绘制NPC
                ctx.fillStyle = '#00ff00';
                this.game.npcs.forEach(npc => {
                    const dx = npc.position.x - this.game.player.position.x;
                    const dz = npc.position.z - this.game.player.position.z;
                    
                    // 限制显示范围
                    if (Math.abs(dx) < 50 && Math.abs(dz) < 50) {
                        const x = centerX + dx;
                        const y = centerY + dz;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                
                // 绘制敌人
                ctx.fillStyle = '#ff0000';
                this.game.enemies.forEach(enemy => {
                    if (enemy.userData.health <= 0) return;
                    
                    const dx = enemy.position.x - this.game.player.position.x;
                    const dz = enemy.position.z - this.game.player.position.z;
                    
                    // 限制显示范围
                    if (Math.abs(dx) < 50 && Math.abs(dz) < 50) {
                        const x = centerX + dx;
                        const y = centerY + dz;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                
                // 绘制地图边界
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
            }
            
            showInteractionHint(npcName) {
                if (!this.interactionHint) {
                    this.interactionHint = document.createElement('div');
                    this.interactionHint.style.position = 'absolute';
                    this.interactionHint.style.bottom = '100px';
                    this.interactionHint.style.left = '50%';
                    this.interactionHint.style.transform = 'translateX(-50%)';
                    this.interactionHint.style.background = 'rgba(0, 0, 0, 0.7)';
                    this.interactionHint.style.color = '#fff';
                    this.interactionHint.style.padding = '10px 20px';
                    this.interactionHint.style.borderRadius = '5px';
                    this.interactionHint.style.zIndex = '100';
                    
                    document.getElementById('uiOverlay').appendChild(this.interactionHint);
                }
                
                this.interactionHint.textContent = `按 E 与 ${npcName} 交谈`;
                this.interactionHint.style.display = 'block';
            }
            
            updateInteractionHint() {
                if (this.interactionHint) {
                    // 检查玩家是否还在NPC附近
                    let showHint = false;
                    let nearestNPC = null;
                    
                    this.game.npcs.forEach(npc => {
                        const dx = this.game.player.position.x - npc.position.x;
                        const dz = this.game.player.position.z - npc.position.z;
                        const distance = Math.sqrt(dx * dx + dz * dz);
                        
                        if (distance < 3) {
                            showHint = true;
                            nearestNPC = npc.userData.name;
                        }
                    });
                    
                    if (showHint && nearestNPC) {
                        this.showInteractionHint(nearestNPC);
                    } else if (!showHint && this.interactionHint.style.display !== 'none') {
                        this.interactionHint.style.display = 'none';
                    }
                }
            }
            
            toggleMainMenu() {
                const menu = document.getElementById('mainMenu');
                
                if (menu.style.display === 'flex') {
                    menu.style.display = 'none';
                    if (this.game.gameState === 'menu') {
                        this.game.gameState = 'playing';
                        this.game.lastTime = performance.now();
                        this.game.update();
                    }
                } else {
                    menu.style.display = 'flex';
                    this.game.gameState = 'menu';
                }
            }
            
            startNewGame() {

            updateInventory() {
                const grid = document.getElementById('inventoryGrid');
                
                grid.innerHTML = '';
                
                this.game.gameData.inventory.forEach((item, index) => {
                    const slot = document.createElement('div');
                    slot.className = 'inventory-slot';
                    slot.dataset.index = index;
                    
                    slot.innerHTML = `
                        <div class="item-icon">${item.icon}</div>
                        ${item.count > 1 ? `<div class="item-count">${item.count}</div>` : ''}
                    `;
                    
                    slot.addEventListener('click', () => this.useItem(index));
                    
                    grid.appendChild(slot);
                });
                
                // 添加空槽位
                for (let i = this.game.gameData.inventory.length; i < 40; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'inventory-slot';
                    grid.appendChild(slot);
                }
            }
            
            filterInventory(filter) {
                const grid = document.getElementById('inventoryGrid');
                const items = this.game.gameData.inventory;
                
                grid.innerHTML = '';
                
                items.forEach((item, index) => {
                    if (filter === 'all' || item.type === filter) {
                        const slot = document.createElement('div');
                        slot.className = 'inventory-slot';
                        slot.dataset.index = index;
                        
                        slot.innerHTML = `
                            <div class="item-icon">${item.icon}</div>
                            ${item.count > 1 ? `<div class="item-count">${item.count}</div>` : ''}
                        `;
                        
                        slot.addEventListener('click', () => this.useItem(index));
                        
                        grid.appendChild(slot);
                    }
                });
                
                // 添加空槽位
                const remainingSlots = 40 - grid.children.length;
                
                for (let i = 0; i < remainingSlots; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'inventory-slot';
                    grid.appendChild(slot);
                }
            }
            
            useItem(index) {
                const item = this.game.gameData.inventory[index];
                
                if (!item) return;
                
                switch(item.type) {
                    case 'potion':
                        if (item.name === "回春丹") {
                            this.game.gameData.player.hp = Math.min(
                                this.game.gameData.player.maxHp,
                                this.game.gameData.player.hp + 50
                            );
                            this.game.showNotification("使用回春丹，恢复50生命", 0x00FF00);
                        } else if (item.name === "聚气丹") {
                            this.game.gameData.player.mp = Math.min(
                                this.game.gameData.player.maxMp,
                                this.game.gameData.player.mp + 30
                            );
                            this.game.showNotification("使用聚气丹，恢复30灵力", 0x00AAFF);
                        }
                        break;
                    case 'weapon':
                        this.game.showNotification(`装备了 ${item.name}`, 0xFFAA00);
                        break;
                    case 'armor':
                        this.game.showNotification(`装备了 ${item.name}`, 0xFFAA00);
                        break;
                    default:
                        this.game.showNotification(`使用了 ${item.name}`, 0xFFFF00);
                }
                
                // 减少数量或移除物品
                if (item.count > 1) {
                    item.count--;
                } else {
                    this.game.gameData.inventory.splice(index, 1);
                }
                
                this.updatePlayerInfo();
                this.updateInventory();
            }
