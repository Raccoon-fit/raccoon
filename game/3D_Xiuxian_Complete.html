            updateWorldMap() {
                const canvas = document.getElementById('worldMapCanvas');
                const ctx = canvas.getContext('2d');
                
                if (!canvas || !ctx) return;
                
                // 设置画布大小
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                
                // 绘制地图背景
                ctx.fillStyle = '#0a0a2a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制地形
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const scale = 2;
                
                // 绘制网格
                ctx.strokeStyle = '#3a3a8a';
                ctx.lineWidth = 1;
                
                for (let x = 0; x < canvas.width; x += 50) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                for (let y = 0; y < canvas.height; y += 50) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                
                // 绘制玩家位置
                const playerX = centerX + this.game.player.position.x * scale;
                const playerY = centerY + this.game.player.position.z * scale;
                
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(playerX, playerY, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制玩家标识
                ctx.fillStyle = '#00ffff';
                ctx.font = 'bold 12px Arial';
                ctx.fillText('你', playerX - 4, playerY + 4);
                
                // 绘制地点
                const locations = [
                    { name: "新手村", x: 0, y: 0, type: "village" },
                    { name: "灵兽山", x: 50, y: 30, type: "mountain" },
                    { name: "炼丹谷", x: -40, y: 20, type: "valley" },
                    { name: "藏经阁", x: 20, y: -30, type: "temple" },
                    { name: "妖兽森林", x: -30, y: -40, type: "forest" }
                ];
                
                locations.forEach(loc => {
                    const x = centerX + loc.x * scale;
                    const y = centerY + loc.y * scale;
                    
                    // 根据类型设置颜色
                    let color = '#ffffff';
                    switch(loc.type) {
                        case 'village': color = '#00ff00'; break;
                        case 'mountain': color = '#aaaaaa'; break;
                        case 'valley': color = '#ffaa00'; break;
                        case 'temple': color = '#ff00ff'; break;
                        case 'forest': color = '#00aa00'; break;
                    }
                    
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 绘制名称
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px Arial';
                    ctx.fillText(loc.name, x - 15, y - 10);
                });
                
                // 绘制地图边界
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
            }
        }
        
        // 背包系统
        class InventorySystem {
            constructor(game) {
                this.game = game;
                this.maxSlots = 40;
            }
            
            init() {
                console.log("背包系统已初始化");
            }
            
            addItem(item) {
                // 检查是否已存在相同物品
                const existingItem = this.game.gameData.inventory.find(i => i.name === item.name);
                
                if (existingItem) {
                    existingItem.count++;
                } else {
                    this.game.gameData.inventory.push({ ...item, count: 1 });
                }
                
                this.game.uiSystem.updateInventory();
            }
            
            removeItem(itemName, count = 1) {
                const itemIndex = this.game.gameData.inventory.findIndex(i => i.name === itemName);
                
                if (itemIndex > -1) {
                    const item = this.game.gameData.inventory[itemIndex];
                    
                    if (item.count > count) {
                        item.count -= count;
                    } else {
                        this.game.gameData.inventory.splice(itemIndex, 1);
                    }
                    
                    this.game.uiSystem.updateInventory();
                    return true;
                }
                
                return false;
            }
            
            hasItem(itemName, count = 1) {
                const item = this.game.gameData.inventory.find(i => i.name === itemName);
                return item && item.count >= count;
            }
            
            getItem(itemName) {
                return this.game.gameData.inventory.find(i => i.name === itemName);
            }
            
            getAllItems() {
                return this.game.gameData.inventory;
            }
        }
        
        // 任务系统
        class QuestSystem {
            constructor(game) {
                this.game = game;
            }
            
            init() {
                console.log("任务系统已初始化");
            }
            
            acceptQuest(questId) {
                const quest = this.game.gameData.quests.find(q => q.id === questId);
                
                if (quest && quest.status === 'inactive') {
                    quest.status = 'active';
                    quest.currentCount = 0;
                    this.game.uiSystem.updateQuestList();
                    this.game.showNotification(`已接受任务: ${quest.title}`, 0x00FF00);
                    return true;
                }
                
                return false;
            }
            
            completeQuest(questId) {
                const quest = this.game.gameData.quests.find(q => q.id === questId);
                
                if (quest && quest.status === 'active') {
                    quest.status = 'completed';
                    this.game.gameData.completedQuests.push(quest);
                    
                    // 给予奖励
                    this.game.gainExperience(quest.reward.xp);
                    
                    quest.reward.items.forEach(item => {
                        this.game.inventorySystem.addItem(item);
                    });
                    
                    this.game.uiSystem.updateQuestList();
                    this.game.showNotification(`任务完成: ${quest.title}!`, 0x00FF00);
                    return true;
                }
                
                return false;
            }
            
            updateQuestProgress(target, amount = 1) {
                let updated = false;
                
                this.game.gameData.quests.forEach(quest => {
                    if (quest.status === 'active' && quest.target === target) {
                        quest.currentCount = Math.min(quest.currentCount + amount, quest.targetCount);
                        updated = true;
                        
                        // 检查是否完成
                        if (quest.currentCount >= quest.targetCount) {
                            this.game.showNotification(`任务目标完成: ${quest.title}`, 0x00FF00);
                        }
                        
                        this.game.uiSystem.updateQuestList();
                    }
                });
                
                return updated;
            }
            
            getActiveQuests() {
                return this.game.gameData.quests.filter(q => q.status === 'active');
            }
        }
        
        // 战斗系统
        class CombatSystem {
            constructor(game) {
                this.game = game;
            }
            
            init() {
                console.log("战斗系统已初始化");
            }
            
            playerAttack(enemy) {
                if (!enemy || enemy.userData.health <= 0) return;
                
                // 计算伤害
                const damage = this.game.gameData.player.stats.attack;
                const actualDamage = Math.max(1, damage - Math.random() * 2);
                
                // 扣除敌人血量
                enemy.userData.health -= actualDamage;
                
                // 显示伤害
                this.game.showDamageText(
                    enemy.position.x,
                    enemy.position.y + 2,
                    enemy.position.z,
                    `-${Math.floor(actualDamage)}`,
                    0xff3333
                );
                
                // 敌人死亡
                if (enemy.userData.health <= 0) {
                    this.enemyDeath(enemy);
                }
            }
            
            enemyAttack(enemy) {
                const now = Date.now();
                
                // 检查攻击间隔
                if (now - enemy.userData.lastAttack < 1000) return;
                
                enemy.userData.lastAttack = now;
                
                // 计算伤害
                const damage = enemy.userData.damage;
                const actualDamage = Math.max(1, damage - this.game.gameData.player.stats.defense * 0.5);
                
                // 扣除玩家血量
                this.game.gameData.player.hp -= actualDamage;
                
                // 显示伤害
                this.game.showDamageText(
                    this.game.player.position.x,
                    this.game.player.position.y + 2,
                    this.game.player.position.z,
                    `-${Math.floor(actualDamage)}`,
                    0xff0000
                );
                
                // 更新UI
                this.game.uiSystem.updatePlayerInfo();
                
                // 检查玩家是否死亡
                if (this.game.gameData.player.hp <= 0) {
                    this.playerDeath();
                }
            }
            
            castFireball(skill) {
                this.game.showNotification(`释放 ${skill.name}!`, 0xFF5500);
                
                // 对范围内敌人造成伤害
                let hitCount = 0;
                this.game.enemies.forEach(enemy => {
                    if (enemy.userData.health <= 0) return;
                    
                    const dx = this.game.player.position.x - enemy.position.x;
                    const dz = this.game.player.position.z - enemy.position.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    
                    if (distance < 10) {
                        const damage = skill.damage + this.game.gameData.player.stats.spirit * 0.5;
                        this.attackEnemy(enemy, damage, 0xFF5500);
                        hitCount++;
                    }
                });
                
                if (hitCount === 0) {
                    this.game.showNotification("没有击中任何敌人", 0xaaaaaa);
                }
            }
            
            castIceBolt(skill) {
                this.game.showNotification(`释放 ${skill.name}!`, 0x00AAFF);
                
                // 减速效果
                this.game.enemies.forEach(enemy => {
                    if (enemy.userData.health <= 0) return;
                    
                    const dx = this.game.player.position.x - enemy.position.x;
                    const dz = this.game.player.position.z - enemy.position.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    
                    if (distance < 8) {
                        const damage = skill.damage + this.game.gameData.player.stats.spirit * 0.5;
                        this.attackEnemy(enemy, damage, 0x00AAFF);
                    }
                });
            }
            
            castLightning(skill) {
                this.game.showNotification(`释放 ${skill.name}!`, 0xFFDD00);
                
                // 高伤害单体攻击
                const nearestEnemy = this.findNearestEnemy(20);
                
                if (nearestEnemy) {
                    const damage = skill.damage + this.game.gameData.player.stats.spirit;
                    this.attackEnemy(nearestEnemy, damage, 0xFFDD00);
                    this.game.showSkillEffect(2);
                } else {
                    this.game.showNotification("没有找到目标", 0xaaaaaa);
                }
            }
            
            castWindSlash(skill) {
                this.game.showNotification(`释放 ${skill.name}!`, 0x00FF00);
                
                // 多目标攻击
                let hitCount = 0;
                this.game.enemies.forEach(enemy => {
                    if (enemy.userData.health <= 0) return;
                    
                    const dx = this.game.player.position.x - enemy.position.x;
                    const dz = this.game.player.position.z - enemy.position.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    
                    if (distance < 8) {
                        const damage = skill.damage + this.game.gameData.player.stats.spirit * 0.3;
                        this.attackEnemy(enemy, damage, 0x00FF00);
                        hitCount++;
                    }
                });
            }
            
            castEarthWall(skill) {
                this.game.showNotification(`释放 ${skill.name}!`, 0x8B4513);
                
                // 增加防御
                const defenseBonus = 5;
                this.game.gameData.player.stats.defense += defenseBonus;
                this.game.showNotification(`防御力增加 ${defenseBonus}`, 0x8B4513);
                
                // 5秒后恢复
                setTimeout(() => {
                    this.game.gameData.player.stats.defense -= defenseBonus;
                    this.game.uiSystem.updatePlayerInfo();
                }, 5000);
                
                this.game.uiSystem.updatePlayerInfo();
            }
            
            castHeal(skill) {
                this.game.showNotification(`释放 ${skill.name}!`, 0x00FF00);
                
                // 治疗玩家
                const healAmount = skill.heal + this.game.gameData.player.stats.spirit * 0.5;
                this.game.gameData.player.hp = Math.min(
                    this.game.gameData.player.maxHp,
                    this.game.gameData.player.hp + healAmount
                );
                
                // 显示治疗数字
                this.game.showDamageText(
                    this.game.player.position.x,
                    this.game.player.position.y + 2,
                    this.game.player.position.z,
                    `+${Math.floor(healAmount)}`,
                    0x00FF00
                );
                
                this.game.uiSystem.updatePlayerInfo();
            }
            
            findNearestEnemy(maxDistance) {
                let nearestEnemy = null;
                let nearestDistance = maxDistance;
                
                this.game.enemies.forEach(enemy => {
                    if (enemy.userData.health <= 0) return;
                    
                    const dx = this.game.player.position.x - enemy.position.x;
                    const dz = this.game.player.position.z - enemy.position.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    
                    if (distance < nearestDistance) {
                        nearestDistance = distance;
                        nearestEnemy = enemy;
                    }
                });
                
                return nearestEnemy;
            }
            
            attackEnemy(enemy, damage, color) {
                if (enemy.userData.health <= 0) return;
                
                // 计算实际伤害
                const actualDamage = Math.max(1, damage);
                enemy.userData.health -= actualDamage;
                
                // 显示伤害数字
                this.game.showDamageText(
                    enemy.position.x,
                    enemy.position.y + 2,
                    enemy.position.z,
                    `-${Math.floor(actualDamage)}`,
                    color
                );
                
                // 敌人死亡
                if (enemy.userData.health <= 0) {
                    this.enemyDeath(enemy);
                }
            }
            
            enemyDeath(enemy) {
                // 移除敌人
                this.game.scene.remove(enemy);
                
                const index = this.game.enemies.indexOf(enemy);
                if (index > -1) {
                    this.game.enemies.splice(index, 1);
                }
                
                // 掉落物品
                this.dropLoot(enemy);
                
                // 给予经验
                this.game.gainExperience(20);
                
                // 更新任务进度
                this.game.questSystem.updateQuestProgress("击败妖兽");
                
                // 显示通知
                this.game.showNotification(`${enemy.userData.name}已被击败!`, 0x00FF00);
            }
            
            dropLoot(enemy) {
                // 随机掉落
                const lootTypes = [
                    { type: 'potion', name: '回春丹', effect: '恢复50生命', icon: '❤️' },
                    { type: 'potion', name: '聚气丹', effect: '恢复30灵力', icon: '💧' },
                    { type: 'material', name: '妖兽内丹', effect: '炼丹材料', icon: '🔴' },
                    { type: 'material', name: '灵草', effect: '炼丹材料', icon: '🌿' },
                    { type: 'weapon', name: '普通飞剑', effect: '攻击+5', icon: '⚔️' }
                ];
                
                // 30%几率掉落物品
                if (Math.random() < 0.3) {
                    const loot = lootTypes[Math.floor(Math.random() * lootTypes.length)];
                    this.game.showNotification(`获得 ${loot.name}`, 0xFFAA00);
                    this.game.inventorySystem.addItem(loot);
                }
            }
            
            playerDeath() {
                this.game.showNotification("你被击败了!", 0xff0000);
                
                // 复活
                this.game.gameData.player.hp = this.game.gameData.player.maxHp;
                this.game.gameData.player.mp = this.game.gameData.player.maxMp;
                
                // 传送回出生点
                this.game.player.position.set(0, 0, 0);
                this.game.player.rotation.y = 0;
                
                // 更新UI
                this.game.uiSystem.updatePlayerInfo();
                
                this.game.showNotification("已复活", 0x00FF00);
            }
        }
        
        // 制作系统
        class CraftingSystem {
            constructor(game) {
                this.game = game;
                this.recipes = [];
            }
            
            init() {
                // 初始化配方
                this.recipes = [
                    {
                        name: "回春丹",
                        inputs: [
                            { name: "灵草", count: 2 }
                        ],
                        output: { name: "回春丹", type: "potion", effect: "恢复50生命", icon: "❤️" }
                    },
                    {
                        name: "聚气丹",
                        inputs: [
                            { name: "灵草", count: 3 }
                        ],
                        output: { name: "聚气丹", type: "potion", effect: "恢复30灵力", icon: "💧" }
                    },
                    {
                        name: "淬体丹",
                        inputs: [
                            { name: "灵草", count: 3 },
                            { name: "妖兽内丹", count: 1 }
                        ],
                        output: { name: "淬体丹", type: "potion", effect: "永久增加体质", icon: "💪" }
                    }
                ];
                
                console.log("制作系统已初始化");
            }
            
            getRecipes() {
                return this.recipes;
            }
            
            canCraft(recipeName) {
                const recipe = this.recipes.find(r => r.name === recipeName);
                if (!recipe) return false;
                
                return recipe.inputs.every(input => 
                    this.game.inventorySystem.hasItem(input.name, input.count)
                );
            }
            
            craft(recipeName) {
                const recipe = this.recipes.find(r => r.name === recipeName);
                if (!recipe || !this.canCraft(recipeName)) {
                    this.game.showNotification("材料不足!", 0xff6666);
                    return false;
                }
                
                // 消耗材料
                recipe.inputs.forEach(input => {
                    this.game.inventorySystem.removeItem(input.name, input.count);
                });
                
                // 添加产物
                this.game.inventorySystem.addItem(recipe.output);
                
                this.game.showNotification(`成功炼制 ${recipe.name}!`, 0x00FF00);
                return true;
            }
        }
        
        // 对话系统
        class DialogueSystem {
            constructor(game) {
                this.game = game;
                this.currentDialogue = null;
                this.currentIndex = 0;
            }
            
            init() {
                console.log("对话系统已初始化");
            }
            
            startDialogue(npc) {
                if (!npc.userData.dialogues || npc.userData.dialogues.length === 0) return;
                
                this.currentDialogue = npc.userData.dialogues;
                this.currentIndex = 0;
                
                this.showCurrentLine();
                this.game.uiSystem.showInteractionHint(null);
            }
            
            showCurrentLine() {
                if (!this.currentDialogue || this.currentIndex >= this.currentDialogue.length) {
                    this.endDialogue();
                    return;
                }
                
                const line = this.currentDialogue[this.currentIndex];
                
                // 更新对话面板
                document.getElementById('dialoguePanel').style.display = 'block';
                document.getElementById('dialogueSpeaker').textContent = line.speaker;
                document.getElementById('dialogueText').textContent = line.text;
                
                // 清除旧选项
                const optionsContainer = document.getElementById('dialogueOptions');
                optionsContainer.innerHTML = '';
                
                // 添加选项
                if (this.currentIndex < this.currentDialogue.length - 1) {
                    const nextButton = document.createElement('div');
                    nextButton.className = 'dialogue-option';
                    nextButton.textContent = '继续...';
                    nextButton.addEventListener('click', () => {
                        this.currentIndex++;
                        this.showCurrentLine();
                    });
                    optionsContainer.appendChild(nextButton);
                }
                
                const endButton = document.createElement('div');
                endButton.className = 'dialogue-option';
                endButton.textContent = '离开';
                endButton.addEventListener('click', () => {
                    this.endDialogue();
                });
                optionsContainer.appendChild(endButton);
            }
            
            endDialogue() {
                document.getElementById('dialoguePanel').style.display = 'none';
                this.currentDialogue = null;
                this.currentIndex = 0;
                this.game.gameState = 'playing';
            }
        }
        
        // 扩展游戏主类的增益经验方法
        ImmortalCultivationGame.prototype.gainExperience = function(amount) {
            this.gameData.player.xp += amount;
            
            // 显示经验获得
            this.showDamageText(
                this.player.position.x,
                this.player.position.y + 3,
                this.player.position.z,
                `+${amount} XP`,
                0xFFFF00
            );
            
            // 检查升级
            if (this.gameData.player.xp >= this.gameData.player.xpToNext) {
                this.levelUp();
            }
            
            // 更新UI
            this.uiSystem.updatePlayerInfo();
        };
        
        // 扩展游戏主类的升级方法
        ImmortalCultivationGame.prototype.levelUp = function() {
            this.gameData.player.level++;
            this.gameData.player.xp -= this.gameData.player.xpToNext;
            this.gameData.player.xpToNext = Math.floor(this.gameData.player.xpToNext * 1.5);
            
            // 提升属性
            this.gameData.player.maxHp += 20;
            this.gameData.player.maxMp += 10;
            this.gameData.player.hp = this.gameData.player.maxHp;
            this.gameData.player.mp = this.gameData.player.maxMp;
            this.gameData.player.stats.attack += 2;
            this.gameData.player.stats.defense += 1;
            this.gameData.player.stats.spirit += 2;
            this.gameData.player.stats.mind += 1;
            this.gameData.player.stats.agility += 1;
            this.gameData.player.stats.luck += Math.floor(Math.random() * 2);
            
            // 更新境界
            this.updateCultivationRealm();
            
            // 显示升级信息
            this.showNotification(`恭喜突破到 ${this.gameData.player.cultivation} ${this.gameData.player.realm}`, 0x00FFFF);
            
            // 更新UI
            this.uiSystem.updatePlayerInfo();
        };
        
        // 扩展游戏主类的境界更新方法
        ImmortalCultivationGame.prototype.updateCultivationRealm = function() {
            const realms = [
                { level: 1, name: "炼气期", subRealms: ["一层", "二层", "三层", "四层", "五层", "六层", "七层", "八层", "九层", "大圆满"] },
                { level: 10, name: "筑基期", subRealms: ["初期", "中期", "后期", "大圆满"] },
                { level: 14, name: "金丹期", subRealms: ["初期", "中期", "后期", "大圆满"] },
                { level: 18, name: "元婴期", subRealms: ["初期", "中期", "后期", "大圆满"] },
                { level: 22, name: "化神期", subRealms: ["初期", "中期", "后期", "大圆满"] }
            ];
            
            for (let i = realms.length - 1; i >= 0; i--) {
                if (this.gameData.player.level >= realms[i].level) {
                    const realmIndex = Math.min(
                        Math.floor((this.gameData.player.level - realms[i].level) / 2),
                        realms[i].subRealms.length - 1
                    );
                    
                    this.gameData.player.cultivation = realms[i].name;
                    this.gameData.player.realm = realms[i].subRealms[realmIndex];
                    
                    break;
                }
            }
        };
        
        // 扩展UI系统的快捷键处理
        const originalKeyDown = InputSystem.prototype.onKeyDown;
        InputSystem.prototype.onKeyDown = function(e) {
            originalKeyDown.call(this, e);
            
            // 检查交互键
            if (this.game.gameState === 'playing' && e.key.toLowerCase() === 'e') {
                this.game.npcs.forEach(npc => {
                    const dx = this.game.player.position.x - npc.position.x;
                    const dz = this.game.player.position.z - npc.position.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    
                    if (distance < 3) {
                        this.game.startDialogue(npc);
                    }
                });
            }
        };
        
        // 启动游戏
        const game = new ImmortalCultivationGame();
    </script>
