<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D修仙游戏 - 修仙问道</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            overflow: hidden;
            background: #0a0a1a;
            color: #e0e0ff;
            user-select: none;
        }
        
        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #gameCanvas {
            display: block;
            background: #000;
        }
        
        /* 加载界面 */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a2a, #000010);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        .game-title {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 20px #6a6aff, 0 0 40px #4a4aaa;
            margin-bottom: 2rem;
            font-weight: bold;
            letter-spacing: 5px;
        }
        
        .game-subtitle {
            font-size: 1.5rem;
            color: #a0a0ff;
            margin-bottom: 3rem;
        }
        
        .loading-bar-container {
            width: 400px;
            height: 25px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            margin-top: 20px;
            overflow: hidden;
            border: 2px solid #3a3a8a;
        }
        
        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #3a3a8a, #6a6aff, #8a8aff);
            width: 0%;
            transition: width 0.3s;
            position: relative;
        }
        
        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .loading-text {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #aaaaff;
        }
        
        .tip-container {
            position: absolute;
            bottom: 50px;
            width: 600px;
            text-align: center;
            color: #8888cc;
            font-size: 1.1rem;
        }
        
        /* UI系统样式 */
        .ui-panel {
            background: rgba(10, 10, 30, 0.85);
            border: 2px solid #3a3a8a;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(100, 100, 255, 0.2);
            backdrop-filter: blur(5px);
            pointer-events: all;
        }
        
        .ui-header {
            color: #a0a0ff;
            border-bottom: 1px solid #3a3a8a;
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .ui-button {
            background: linear-gradient(to bottom, #3a3a8a, #2a2a5a);
            color: #e0e0ff;
            border: 1px solid #4a4aaa;
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .ui-button:hover {
            background: linear-gradient(to bottom, #4a4aaa, #3a3a7a);
            box-shadow: 0 0 10px rgba(100, 100, 255, 0.5);
        }
        
        .ui-button:active {
            transform: translateY(1px);
        }
        
        .ui-button-red {
            background: linear-gradient(to bottom, #8a1a1a, #5a0a0a);
            border: 1px solid #aa3a3a;
        }
        
        .ui-button-red:hover {
            background: linear-gradient(to bottom, #aa3a3a, #7a1a1a);
        }
        
        .ui-button-green {
            background: linear-gradient(to bottom, #1a8a1a, #0a5a0a);
            border: 1px solid #3aaa3a;
        }
        
        .ui-button-green:hover {
            background: linear-gradient(to bottom, #3aaa3a, #1a7a1a);
        }
        
        .stat-bar {
            height: 20px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
            position: relative;
        }
        
        .stat-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s;
        }
        
        .stat-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #fff;
            text-shadow: 1px 1px 1px #000;
        }
        
        .hp-fill {
            background: linear-gradient(90deg, #8a1a1a, #ff3a3a, #ff6a6a);
        }
        
        .mp-fill {
            background: linear-gradient(90deg, #1a3a8a, #3a6aff, #6a8aff);
        }
        
        .xp-fill {
            background: linear-gradient(90deg, #1a8a1a, #3aff3a, #6aff6a);
        }
        
        /* 布局面板样式 */
        #playerInfo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 280px;
        }
        
        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #3a3a8a, #6a6aff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin-right: 15px;
        }
        
        .player-basic-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .player-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        
        .player-level {
            font-size: 16px;
            color: #ffaa00;
            margin-top: 5px;
        }
        
        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(100, 100, 200, 0.2);
        }
        
        .stat-name {
            color: #aaaaff;
        }
        
        .stat-value {
            color: #fff;
            font-weight: bold;
        }
        
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            overflow: hidden;
        }
        
        .minimap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .minimap-canvas-container {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #3a3a8a;
            border-radius: 5px;
            overflow: hidden;
        }
        
        #minimapCanvas {
            width: 100%;
            height: 100%;
        }
        
        #skillsPanel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 400px;
        }
        
        .skill-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        
        .skill-slot {
            width: 60px;
            height: 60px;
            background: rgba(30, 30, 60, 0.7);
            border: 2px solid #4a4aaa;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            position: relative;
            cursor: pointer;
        }
        
        .skill-slot:hover {
            border-color: #6a6aff;
            background: rgba(50, 50, 100, 0.9);
        }
        
        .skill-slot.active {
            border-color: #ffaa00;
            box-shadow: 0 0 10px #ffaa00;
        }
        
        .skill-cooldown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #fff;
            border-radius: 8px;
        }
        
        .skill-key {
            position: absolute;
            bottom: 2px;
            right: 5px;
            font-size: 12px;
            color: #aaa;
        }
        
        #questPanel {
            position: absolute;
            top: 20px;
            left: 320px;
            width: 300px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .quest-item {
            background: rgba(20, 20, 40, 0.5);
            border-left: 3px solid #4a4aaa;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 0 5px 5px 0;
        }
        
        .quest-item.active {
            border-left-color: #ffaa00;
            background: rgba(30, 30, 60, 0.7);
        }
        
        .quest-title {
            font-weight: bold;
            color: #a0a0ff;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        
        .quest-level {
            color: #ffaa00;
            font-size: 12px;
        }
        
        .quest-description {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .quest-progress {
            font-size: 12px;
            color: #6aff6a;
        }
        
        .quest-reward {
            font-size: 12px;
            color: #ffaa00;
            margin-top: 5px;
        }
        
        #dialoguePanel {
            position: absolute;
            bottom: 20px;
            width: 600px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }
        
        .dialogue-speaker {
            font-size: 18px;
            color: #ffaa00;
            margin-bottom: 10px;
        }
        
        .dialogue-text {
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 15px;
            min-height: 60px;
        }
        
        .dialogue-options {
            display: flex;
            flex-direction: column;
        }
        
        .dialogue-option {
            background: rgba(30, 30, 60, 0.7);
            border: 1px solid #4a4aaa;
            border-radius: 5px;
            padding: 10px;
            margin-top: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .dialogue-option:hover {
            background: rgba(50, 50, 100, 0.9);
            border-color: #6a6aff;
        }
        
        #inventoryPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 500px;
            display: none;
        }
        
        .inventory-tabs {
            display: flex;
            border-bottom: 1px solid #3a3a8a;
            margin-bottom: 15px;
        }
        
        .inventory-tab {
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
        }
        
        .inventory-tab.active {
            background: rgba(100, 100, 200, 0.3);
            border-bottom: 2px solid #6a6aff;
        }
        
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin-top: 15px;
            height: 300px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .inventory-slot {
            width: 60px;
            height: 60px;
            background: rgba(30, 30, 60, 0.7);
            border: 1px solid #4a4aaa;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }
        
        .inventory-slot:hover {
            background: rgba(50, 50, 100, 0.9);
            border-color: #6a6aff;
        }
        
        .item-icon {
            width: 50px;
            height: 50px;
            background: rgba(100, 100, 200, 0.3);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        
        .item-count {
            position: absolute;
            bottom: 2px;
            right: 5px;
            font-size: 12px;
            color: #fff;
            text-shadow: 1px 1px 1px #000;
        }
        
        .item-quality-common { border-color: #aaa; }
        .item-quality-uncommon { border-color: #1a8a1a; }
        .item-quality-rare { border-color: #3a6aff; }
        .item-quality-epic { border-color: #8a3aff; }
        .item-quality-legendary { border-color: #ffaa00; }
        
        #craftingPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 600px;
            display: none;
        }
        
        .crafting-area {
            display: grid;
            grid-template-columns: 1fr 100px 1fr;
            gap: 20px;
            height: 300px;
            margin-top: 20px;
        }
        
        .crafting-input, .crafting-output {
            background: rgba(20, 20, 40, 0.7);
            border-radius: 10px;
            padding: 20px;
        }
        
        .crafting-arrow {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: #6a6aff;
        }
        
        #characterPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 500px;
            display: none;
        }
        
        .character-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background: rgba(30, 30, 60, 0.5);
            border-radius: 5px;
        }
        
        #mapPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 500px;
            display: none;
        }
        
        .map-container {
            width: 100%;
            height: 400px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        #worldMapCanvas {
            width: 100%;
            height: 100%;
        }
        
        .notification {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 40, 0.9);
            border: 1px solid #4a4aaa;
            border-radius: 5px;
            padding: 10px 20px;
            display: none;
            z-index: 50;
            animation: fadeInOut 3s;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; top: 0; }
            10% { opacity: 1; top: 20px; }
            90% { opacity: 1; top: 20px; }
            100% { opacity: 0; top: 0; }
        }
        
        .damage-text {
            position: absolute;
            color: #ff3333;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 2px #000;
            pointer-events: none;
            z-index: 40;
            animation: floatUp 1s;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
        
        .heal-text {
            color: #33ff33;
        }
        
        .xp-text {
            color: #ffff33;
        }
        
        /* 主菜单 */
        #mainMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }
        
        .menu-title {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 20px #6a6aff;
            margin-bottom: 3rem;
        }
        
        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }
        
        .menu-button {
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
        }
        
        .settings-panel {
            background: rgba(10, 10, 30, 0.95);
            border: 2px solid #3a3a8a;
            border-radius: 10px;
            padding: 20px;
            width: 500px;
            display: none;
        }
        
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }
        
        .slider-container {
            width: 200px;
        }
        
        .settings-slider {
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- 游戏主画布 -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- 加载界面 -->
        <div id="loadingScreen">
            <div class="game-title">修仙问道</div>
            <div class="game-subtitle">Immortal Cultivation Journey</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <div class="loading-text" id="loadingText">正在初始化游戏引擎...</div>
            <div class="tip-container" id="tipContainer"></div>
        </div>
        
        <!-- 主菜单 -->
        <div id="mainMenu">
            <div class="menu-title">修仙问道</div>
            <div class="menu-options">
                <button class="ui-button menu-button" id="continueButton">继续游戏</button>
                <button class="ui-button menu-button" id="newGameButton">新的征途</button>
                <button class="ui-button menu-button" id="loadGameButton">修仙传承</button>
                <button class="ui-button menu-button" id="settingsButton">大道法则</button>
                <button class="ui-button menu-button" id="aboutButton">关于此道</button>
            </div>
        </div>
        
        <!-- 游戏UI界面 -->
        <div id="uiOverlay">
            <!-- 玩家信息面板 -->
            <div id="playerInfo" class="ui-panel">
                <div class="player-basic-info">
                    <div class="player-avatar">道</div>
                    <div>
                        <div class="player-name" id="playerName">无名修士</div>
                        <div class="player-level" id="playerLevel">炼气期 一层</div>
                    </div>
                </div>
                
                <div class="stat-bar">
                    <div class="stat-fill hp-fill" id="hpBar" style="width: 100%"></div>
                    <div class="stat-text" id="hpText">100/100</div>
                </div>
                <div class="stat-bar">
                    <div class="stat-fill mp-fill" id="mpBar" style="width: 100%"></div>
                    <div class="stat-text" id="mpText">50/50</div>
                </div>
                <div class="stat-bar">
                    <div class="stat-fill xp-fill" id="xpBar" style="width: 0%"></div>
                    <div class="stat-text" id="xpText">0/100</div>
                </div>
                
                <div class="player-stats">
                    <div class="stat-item">
                        <span class="stat-name">攻击力</span>
                        <span class="stat-value" id="attackValue">10</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">防御力</span>
                        <span class="stat-value" id="defenseValue">5</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">灵力</span>
                        <span class="stat-value" id="spiritValue">15</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">神识</span>
                        <span class="stat-value" id="mindValue">8</span>
                    </div>
                </div>
            </div>
            
            <!-- 小地图面板 -->
            <div id="minimap" class="ui-panel">
                <div class="ui-header minimap-header">
                    <span>九州地图</span>
                    <button class="ui-button" id="toggleMapButton">全图</button>
                </div>
                <div class="minimap-canvas-container">
                    <canvas id="minimapCanvas"></canvas>
                </div>
            </div>
            
            <!-- 技能面板 -->
            <div id="skillsPanel" class="ui-panel">
                <div class="ui-header">道法神通</div>
                <div class="skill-bar">
                    <div class="skill-slot" data-skill="0">
                        <div class="skill-icon">火</div>
                        <div class="skill-key">1</div>
                    </div>
                    <div class="skill-slot" data-skill="1">
                        <div class="skill-icon">冰</div>
                        <div class="skill-key">2</div>
                    </div>
                    <div class="skill-slot" data-skill="2">
                        <div class="skill-icon">雷</div>
                        <div class="skill-key">3</div>
                    </div>
                    <div class="skill-slot" data-skill="3">
                        <div class="skill-icon">风</div>
                        <div class="skill-key">4</div>
                    </div>
                    <div class="skill-slot" data-skill="4">
                        <div class="skill-icon">土</div>
                        <div class="skill-key">5</div>
                    </div>
                    <div class="skill-slot" data-skill="5">
                        <div class="skill-icon">木</div>
                        <div class="skill-key">6</div>
                    </div>
                </div>
            </div>
            
            <!-- 任务面板 -->
            <div id="questPanel" class="ui-panel">
                <div class="ui-header">修炼任务</div>
                <div id="questList">
                    <!-- 任务将通过JS动态添加 -->
                </div>
            </div>
            
            <!-- 对话面板 -->
            <div id="dialoguePanel" class="ui-panel">
                <div class="dialogue-speaker" id="dialogueSpeaker">神秘老人</div>
                <div class="dialogue-text" id="dialogueText">少年，我看你骨骼清奇，是修炼的好材料...</div>
                <div class="dialogue-options" id="dialogueOptions">
                    <!-- 选项将通过JS动态添加 -->
                </div>
            </div>
            
            <!-- 背包面板 -->
            <div id="inventoryPanel" class="ui-panel">
                <div class="ui-header">
                    <span>乾坤袋</span>
                    <button class="ui-button" id="closeInventoryButton">关闭</button>
                </div>
                <div class="inventory-tabs">
                    <div class="inventory-tab active" data-tab="all">全部</div>
                    <div class="inventory-tab" data-tab="weapon">法器</div>
                    <div class="inventory-tab" data-tab="armor">防具</div>
                    <div class="inventory-tab" data-tab="potion">丹药</div>
                    <div class="inventory-tab" data-tab="material">材料</div>
                </div>
                <div class="inventory-grid" id="inventoryGrid">
                    <!-- 物品将通过JS动态添加 -->
                </div>
            </div>
            
            <!-- 制作面板 -->
            <div id="craftingPanel" class="ui-panel">
                <div class="ui-header">
                    <span>炼丹炼器</span>
                    <button class="ui-button" id="closeCraftingButton">关闭</button>

                <div class="crafting-area">
                    <div class="crafting-input" id="craftingInput">

                    <div class="crafting-output" id="craftingOutput">
                        <h3>成果</h3>
                    </div>

            <!-- 角色面板 -->
            <div id="characterPanel" class="ui-panel">
                <div class="ui-header">
                    <span>修为境界</span>
                    <button class="ui-button" id="closeCharacterButton">关闭</button>
                </div>
                <div class="character-stats" id="characterStats">
                    <!-- 属性将通过JS动态添加 -->
                </div>
            </div>
            
            <!-- 地图面板 -->
            <div id="mapPanel" class="ui-panel">
                <div class="ui-header">
                    <span>九州全图</span>
                    <button class="ui-button" id="closeMapButton">关闭</button>

                <div class="map-container">
                    <canvas id="worldMapCanvas"></canvas>
                </div>
