<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>黄小仙 · 讨封之卷</title>
    <style>
        :root {
            --nav-height: 52px;
            --gold: #D4AF37;
            --gold-dark: #8B7355;
            --gold-light: #F0D080;
            --border-subtle: #222;
            --font-stack: "SimSun", "Songti SC", "Noto Serif SC", serif;
            --scroll-bg-start: #5a3e2b;
            --scroll-bg-end: #d4a457;
            --scroll-text: #f5e6c8;
            --scroll-border: #c9a84c;
            --bg-deep: #0a0806;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg-deep);
            font-family: var(--font-stack);
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }

        /* ===== 断网红色横幅 ===== */
        .offline-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            background: #c0392b;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            text-align: center;
            padding: 12px 16px;
            font-size: 15px;
            font-family: var(--font-stack);
            transform: translateY(-100%);
            transition: transform 0.45s cubic-bezier(0.34, 1.0, 0.64, 1);
            box-shadow: 0 3px 14px rgba(192, 57, 43, 0.45);
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            will-change: transform;
        }
        .offline-banner.show {
            transform: translateY(0);
        }
        .offline-banner .banner-icon {
            font-size: 18px;
            flex-shrink: 0;
            animation: pulse-warn 1.8s ease-in-out infinite;
        }
        .offline-banner .banner-text {
            flex: 1;
            text-align: center;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .offline-banner .banner-close {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
            font-family: var(--font-stack);
            padding: 0;
            line-height: 1;
        }
        .offline-banner .banner-close:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.9);
        }
        @keyframes pulse-warn {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        /* ===== iframe 容器 ===== */
        .iframe-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: var(--bg-deep);
        }
        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.25s ease;
        }
        /* 讨封iframe */
        .iframe-tao {
            z-index: 1;
            opacity: 1;
            pointer-events: auto;
        }
        .iframe-tao.dimmed {
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }
        /* 其他页面iframe */
        .iframe-other {
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }
        .iframe-other.active {
            z-index: 2;
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== 加载遮罩 ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            font-size: 16px;
            background: rgba(10, 8, 6, 0.92);
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.35s;
        }
        .loading-overlay.fading-out {
            opacity: 0;
            pointer-events: none;
        }
        .loading-overlay.hidden {
            display: none;
        }
        .loading-overlay .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        .loading-overlay .status-text {
            font-size: 15px;
            letter-spacing: 2px;
            text-align: center;
            padding: 0 20px;
            transition: color 0.3s;
        }
        .loading-overlay .retry-btn {
            margin-top: 16px;
            padding: 10px 24px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-stack);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: auto;
            display: none;
            transition: all 0.25s;
        }
        .loading-overlay .retry-btn:active {
            background: rgba(212, 175, 55, 0.15);
        }
        .loading-overlay .retry-btn.visible {
            display: block;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== 底部导航栏 ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #0a0806;
            border-top: 1px solid var(--border-subtle);
            padding-bottom: env(safe-area-inset-bottom, 0);
            z-index: 1000;
            min-height: var(--nav-height);
            transition: all 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }
        .nav-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            background: transparent;
            border: none;
            color: #777;
            font-size: 13px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: color 0.28s, background 0.28s, transform 0.2s, box-shadow 0.3s, opacity 0.3s;
            min-height: 44px;
            font-family: var(--font-stack);
            position: relative;
            border-radius: 0;
            white-space: nowrap;
        }
        .nav-btn.active {
            color: var(--gold);
            font-weight: bold;
        }
        .nav-btn.hidden-btn {
            display: none !important;
        }
        .nav-btn:active {
            transform: scale(0.95);
        }

        /* ===== 卷轴按钮（断网专用讨封按钮） ===== */
        .nav-btn.scroll-btn {
            flex: 0 1 auto;
            display: flex !important;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            margin: 4px 12px;
            padding: 0 18px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(145deg, var(--scroll-bg-start), var(--scroll-bg-end));
            color: var(--scroll-text);
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 6px;
            font-family: var(--font-stack);
            cursor: pointer;
            position: relative;
            box-shadow: 0 2px 12px rgba(212, 175, 55, 0.25),
                inset 0 1px 0 rgba(255, 220, 140, 0.5),
                inset 0 -2px 0 rgba(60, 40, 20, 0.6);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            transition: transform 0.25s, box-shadow 0.3s;
            z-index: 2;
        }
        .nav-btn.scroll-btn::before,
        .nav-btn.scroll-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 28px;
            border-radius: 4px;
            background: linear-gradient(180deg, #c9a84c, #8b7355);
            box-shadow: inset 0 1px 2px rgba(255, 220, 140, 0.3), 0 1px 4px rgba(0, 0, 0, 0.4);
            border: 1px solid #a08040;
        }
        .nav-btn.scroll-btn::before {
            left: -4px;
            border-radius: 4px 0 0 4px;
        }
        .nav-btn.scroll-btn::after {
            right: -4px;
            border-radius: 0 4px 4px 0;
        }
        .nav-btn.scroll-btn:active {
            transform: scale(0.96);
            box-shadow: 0 1px 6px rgba(212, 175, 55, 0.15), inset 0 1px 2px rgba(255, 220, 140, 0.3);
        }
        .nav-btn.scroll-btn .btn-glow {
            position: absolute;
            top: -1px;
            left: 10%;
            right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
            opacity: 0.6;
            border-radius: 50%;
            filter: blur(1px);
        }
        .nav-btn.scroll-btn .btn-glow-bottom {
            top: auto;
            bottom: -1px;
            opacity: 0.3;
        }
        .nav-btn.scroll-btn .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        .nav-btn.scroll-btn .btn-text::before,
        .nav-btn.scroll-btn .btn-text::after {
            content: '◆';
            font-size: 10px;
            color: var(--gold-light);
            opacity: 0.5;
            letter-spacing: 0;
        }

        /* ===== 设置面板 ===== */
        .overlay-bg {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1999;
        }
        .overlay-bg.show {
            display: block;
        }
        .settings-panel {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            width: 300px;
            z-index: 2000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }
        .settings-panel.show {
            display: block;
        }
        .settings-panel h4 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 16px;
            font-size: 16px;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #0f0f0f;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .setting-label {
            color: #ccc;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .toggle-switch {
            width: 48px;
            height: 28px;
            background: #333;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        .toggle-switch.on {
            background: var(--gold-dark);
        }
        .toggle-switch.on::after {
            transform: translateX(20px);
        }
        .setting-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .setting-btn:active {
            background: #222;
        }

        /* ===== 断网模式 ===== */
        .app-container.offline-mode .bottom-nav {
            background: #0a0806;
            border-top-color: #3a2a1a;
            justify-content: center;
        }
        .app-container.offline-mode .bottom-nav .nav-btn:not(.scroll-btn) {
            display: none !important;
        }
        .app-container.offline-mode .bottom-nav .nav-btn.scroll-btn {
            flex: 0 1 auto;
            min-width: 160px;
            max-width: 220px;
        }
        .app-container.offline-mode .nav-btn[data-page="settings"] {
            display: none !important;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            .nav-btn.scroll-btn {
                font-size: 16px;
                letter-spacing: 4px;
                min-width: 130px;
                padding: 0 14px;
            }
            .nav-btn.scroll-btn::before,
            .nav-btn.scroll-btn::after {
                width: 7px;
                height: 22px;
            }
            .nav-btn.scroll-btn .btn-text::before,
            .nav-btn.scroll-btn .btn-text::after {
                font-size: 8px;
            }
            .settings-panel {
                width: 260px;
                padding: 16px;
                bottom: 70px;
            }
            .offline-banner {
                font-size: 13px;
                padding: 10px 12px;
                gap: 8px;
            }
            .offline-banner .banner-icon {
                font-size: 16px;
            }
            .offline-banner .banner-close {
                width: 24px;
                height: 24px;
                font-size: 14px;
            }
        }
        @media (min-width: 600px) {
            .nav-btn.scroll-btn {
                min-width: 200px;
                font-size: 20px;
                letter-spacing: 8px;
                padding: 0 28px;
                min-height: 54px;
            }
            .nav-btn.scroll-btn::before,
            .nav-btn.scroll-btn::after {
                width: 13px;
                height: 34px;
            }
            .offline-banner {
                font-size: 17px;
                padding: 14px 24px;
            }
        }

        /* 当横幅显示时，给app-container顶部留出空间（避免遮挡内容） */
        .offline-banner.show~.app-container .iframe-wrapper {
            /* 不额外留空，横幅覆盖在内容之上，但iframe内容可能被遮挡顶部一小部分 */
            /* 通过给iframe-wrapper加padding-top来让内容下移 */
        }
        /* 更好的方式：在横幅显示时，给iframe-wrapper添加一个顶部内边距 */
        .offline-banner.show~.app-container .iframe-wrapper {
            padding-top: 0;
            /* 默认不加，因为横幅是fixed定位，覆盖在内容之上，不占用文档流空间 */
        }
        /* 但如果想要内容不被遮挡，可以取消注释下面的代码 */
        /*
        .offline-banner.show ~ .app-container .iframe-wrapper {
            padding-top: 52px;
        }
        .offline-banner.show ~ .app-container .bottom-nav {
            margin-bottom: 0;
        }
        */
        /* 但是保持原样，横幅覆盖在内容之上，不改变布局 */
    </style>
</head>
<body>
    <!-- ===== 断网红色横幅 ===== -->
    <div class="offline-banner" id="offlineBanner" role="alert" aria-live="polite">
        <span class="banner-icon">⚠️</span>
        <span class="banner-text">网络连接已断开</span>
        <button class="banner-close" id="bannerCloseBtn" aria-label="关闭提示">✕</button>
    </div>

    <div class="app-container" id="appContainer">
        <!-- iframe 容器（双iframe） -->
        <div class="iframe-wrapper" id="iframeWrapper">
            <!-- 讨封专用iframe - 始终存在于DOM中 -->
            <iframe
            class="iframe-tao"
            id="iframeTao"
            title="讨封"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
            ></iframe>
            <!-- 其他页面共用iframe -->
            <iframe
            class="iframe-other"
            id="iframeOther"
            title="其他页面"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
            ></iframe>

            <!-- 加载遮罩 -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <span class="status-text" id="statusText">讨封仙籍加载中...</span>
                <button class="retry-btn" id="retryBtn">加载失败？点此重试</button>
            </div>
        </div>

        <!-- 底部导航栏 -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-btn active" data-page="taofeng">讨封</button>
            <button class="nav-btn" data-page="achievement">成就</button>
            <button class="nav-btn" data-page="about">关于</button>
            <button class="nav-btn" data-page="daozhu">道主</button>
            <button class="nav-btn" data-page="settings">设置</button>
        </nav>

        <!-- 设置遮罩 & 面板 -->
        <div class="overlay-bg" id="overlayBg"></div>
        <div class="settings-panel" id="settingsPanel">
            <h4>显示设置</h4>
            <div class="setting-row">
                <span class="setting-label">皮质卷轴</span>
                <div class="toggle-switch on" id="themeSwitch" title="开启使用v1.2.0新UI，关闭使用原版UI"></div>
            </div>
            <div class="setting-row">
                <span class="setting-label">平板模式</span>
                <div class="toggle-switch" id="tabletSwitch" title="平板模式（实验性）"></div>
            </div>
            <button class="setting-btn" id="closeSettingsBtn">关闭</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==================== DOM 引用 ====================
            const appContainer = document.getElementById('appContainer');
            const iframeWrapper = document.getElementById('iframeWrapper');
            const iframeTao = document.getElementById('iframeTao');
            const iframeOther = document.getElementById('iframeOther');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const statusText = document.getElementById('statusText');
            const retryBtn = document.getElementById('retryBtn');
            const themeSwitch = document.getElementById('themeSwitch');
            const tabletSwitch = document.getElementById('tabletSwitch');
            const bottomNav = document.getElementById('bottomNav');
            const overlayBg = document.getElementById('overlayBg');
            const settingsPanel = document.getElementById('settingsPanel');
            const navBtns = document.querySelectorAll('.nav-btn');

            // ===== 断网横幅 DOM =====
            const offlineBanner = document.getElementById('offlineBanner');
            const bannerCloseBtn = document.getElementById('bannerCloseBtn');

            // ==================== URL 配置 ====================
            const LOCAL_BASE = (function() {
                const path = window.location.pathname;
                const lastSlash = path.lastIndexOf('/');
                return window.location.origin + (lastSlash >= 0 ? path.substring(0, lastSlash + 1) : '/');
            })();

            // 远程基础URL
            const REMOTE_BASE = 'https://raccoon.fit/game/%E3%80%90%E6%B8%B8%E6%88%8F%E9%A1%B9%E7%9B%AE%E3%80%91%E9%BB%84%E5%B0%8F%E4%BB%99%E8%AE%A8%E5%B0%81/';
            const REMOTE_BASE_V2 = REMOTE_BASE + 'v1.2.0%E6%96%B0UI/';

            // 讨封URL（联网·卷轴关闭）
            function getTaoUrlOff() {
                return REMOTE_BASE + 'index.html';
            }
            // 讨封URL（联网·卷轴开启）
            function getTaoUrlOn() {
                return REMOTE_BASE_V2 + '%E8%AE%A8%E5%B0%81.html';
            }
            // 讨封URL（断网·本地）
            function getTaoUrlLocal() {
                return LOCAL_BASE + '%E8%AE%A8%E5%B0%81.html';
            }

            // 其他页面URL映射
            function getOtherUrl(pageKey, themeOn) {
                if (themeOn) {
                    // 卷轴开启：v1.2.0新UI路径
                    const map = {
                        achievement: REMOTE_BASE_V2 + '%E6%88%90%E5%B0%B1.html',
                        about: REMOTE_BASE_V2 + '%E5%85%B3%E4%BA%8E.html',
                        daozhu: REMOTE_BASE_V2 + '%E9%81%93%E4%B8%BB.html',
                    };
                    return map[pageKey] || null;
                } else {
                    // 卷轴关闭：原路径
                    const map = {
                        achievement: REMOTE_BASE + '%E6%88%90%E5%B0%B1/',
                        about: REMOTE_BASE + '%E5%85%B3%E4%BA%8E/index.html',
                        daozhu: REMOTE_BASE + '%E9%81%93%E4%B8%BB.html',
                    };
                    return map[pageKey] || null;
                }
            }

            // ==================== 状态变量 ====================
            let playerName = '';
            let isOffline = false; // 当前是否断网模式
            let wasThemeOnBeforeOffline = true; // 断网前卷轴模式状态
            let currentVisibleIframe = 'tao'; // 'tao' | 'other'
            let taoLoadedUrl = null; // 讨封iframe已加载的URL（用于判断是否需要重新加载）
            let otherLoadedPage = null; // 其他iframe当前加载的页面键名
            let otherLoadedUrl = null; // 其他iframe当前加载的URL
            let isTaoLoading = false;
            let isOtherLoading = false;
            let isInitialLoad = true;
            let sessionTimestamp = Date.now(); // 会话级时间戳，讨封URL保持稳定

            // ==================== 横幅控制 ====================
            function showOfflineBanner() {
                offlineBanner.classList.add('show');
            }

            function hideOfflineBanner() {
                offlineBanner.classList.remove('show');
            }

            // 横幅关闭按钮 - 用户可手动关闭
            bannerCloseBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                hideOfflineBanner();
            });

            // 点击横幅本身不关闭（只有关闭按钮可关闭）
            offlineBanner.addEventListener('click', function(e) {
                // 如果点击的是关闭按钮，已经由上面的监听处理了
                // 这里不做任何操作
            });

            // ==================== 玩家名称 ====================
            function initPlayerName() {
                const params = new URLSearchParams(window.location.search);
                playerName = params.get('player') || '';
                if (!playerName) {
                    playerName = localStorage.getItem('playerName') || '';
                }
                if (playerName) {
                    localStorage.setItem('playerName', playerName);
                }
            }

            function appendPlayerParam(url) {
                if (!url) return url;
                let result = url;
                if (playerName) {
                    result += (result.includes('?') ? '&' : '?') + 'player=' + encodeURIComponent(playerName);
                }
                return result;
            }

            // ==================== 讨封URL构建 ====================
            function buildTaoUrl(forceLocal = false) {
                if (forceLocal || isOffline) {
                    return getTaoUrlLocal();
                }
                const themeOn = themeSwitch.classList.contains('on');
                const baseUrl = themeOn ? getTaoUrlOn() : getTaoUrlOff();
                // 讨封URL使用会话级时间戳保持稳定
                let url = baseUrl;
                url += (url.includes('?') ? '&' : '?') + '_st=' + sessionTimestamp;
                url = appendPlayerParam(url);
                return url;
            }

            // ==================== 加载遮罩 ====================
            function showLoading(text) {
                statusText.textContent = text || '仙途引路中...';
                loadingOverlay.classList.remove('hidden', 'fading-out');
                retryBtn.classList.remove('visible');
            }

            function hideLoading() {
                loadingOverlay.classList.add('fading-out');
                // 动画结束后彻底隐藏
                setTimeout(() => {
                    if (loadingOverlay.classList.contains('fading-out')) {
                        loadingOverlay.classList.add('hidden');
                        loadingOverlay.classList.remove('fading-out');
                    }
                }, 350);
            }

            function showRetryButton() {
                retryBtn.classList.add('visible');
            }

            function updateLoadingText(text) {
                statusText.textContent = text;
            }

            // ==================== iframe 显示切换 ====================
            function showTaoIframe() {
                if (currentVisibleIframe === 'tao') return;
                currentVisibleIframe = 'tao';
                iframeTao.classList.remove('dimmed');
                iframeOther.classList.remove('active');
                // 确保讨封iframe在DOM中可见
                iframeTao.style.display = '';
            }

            function showOtherIframe() {
                if (currentVisibleIframe === 'other') return;
                currentVisibleIframe = 'other';
                iframeTao.classList.add('dimmed');
                iframeOther.classList.add('active');
                iframeOther.style.display = '';
            }

            // ==================== 讨封加载 ====================
            function loadTao(forceLocal = false) {
                const url = buildTaoUrl(forceLocal);
                // 如果讨封已经加载了相同URL，不重新加载
                if (taoLoadedUrl === url && !isTaoLoading) {
                    // URL相同，无需重新加载，但需要显示讨封iframe
                    showTaoIframe();
                    hideLoading();
                    return;
                }
                // 如果正在加载相同URL，不重复触发
                if (isTaoLoading && taoLoadedUrl === url) {
                    showTaoIframe();
                    return;
                }

                isTaoLoading = true;
                taoLoadedUrl = url;
                showLoading('讨封仙籍加载中...');
                iframeTao.src = url;
                showTaoIframe();
            }

            function reloadTao() {
                // 强制重新加载讨封（卷轴模式切换时使用）
                taoLoadedUrl = null;
                isTaoLoading = false;
                loadTao(isOffline);
            }

            // ==================== 其他页面加载 ====================
            function loadOtherPage(pageKey) {
                if (isOffline) {
                    // 断网时不加载其他页面，切回讨封
                    switchToTao();
                    return;
                }
                const themeOn = themeSwitch.classList.contains('on');
                const url = getOtherUrl(pageKey, themeOn);
                if (!url) {
                    switchToTao();
                    return;
                }
                const finalUrl = appendPlayerParam(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());

                // 如果其他iframe已经加载了相同页面，不重新加载
                if (otherLoadedPage === pageKey && otherLoadedUrl === finalUrl && !isOtherLoading) {
                    showOtherIframe();
                    hideLoading();
                    return;
                }
                if (isOtherLoading && otherLoadedPage === pageKey && otherLoadedUrl === finalUrl) {
                    showOtherIframe();
                    return;
                }

                isOtherLoading = true;
                otherLoadedPage = pageKey;
                otherLoadedUrl = finalUrl;
                showLoading('仙途引路中...');
                iframeOther.src = finalUrl;
                showOtherIframe();
            }

            function switchToTao() {
                // 切回讨封（不重新加载）
                if (currentVisibleIframe === 'tao' && taoLoadedUrl) {
                    hideLoading();
                    return;
                }
                if (taoLoadedUrl) {
                    // 讨封已加载，直接显示
                    showTaoIframe();
                    hideLoading();
                } else {
                    // 讨封尚未加载，加载之
                    loadTao(isOffline);
                }
            }

            // ==================== 导航切换 ====================
            function switchPage(pageKey) {
                // 关闭设置面板
                overlayBg.classList.remove('show');
                settingsPanel.classList.remove('show');

                // 更新导航高亮
                navBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.page === pageKey);
                });

                if (pageKey === 'taofeng') {
                    switchToTao();
                } else if (pageKey === 'settings') {
                    // 设置面板通过点击事件处理，这里不操作iframe
                    return;
                } else {
                    // 其他页面
                    if (isOffline) {
                        switchToTao();
                        // 更新高亮为讨封
                        navBtns.forEach(btn => {
                            btn.classList.toggle('active', btn.dataset.page === 'taofeng');
                        });
                    } else {
                        loadOtherPage(pageKey);
                    }
                }
            }

            // ==================== 断网模式 ====================
            function enterOfflineMode() {
                if (isOffline) return;
                isOffline = true;
                wasThemeOnBeforeOffline = themeSwitch.classList.contains('on');

                // 强制开启卷轴模式样式（断网时使用本地讨封，UI上保持卷轴风格）
                if (!wasThemeOnBeforeOffline) {
                    themeSwitch.classList.add('on');
                }

                appContainer.classList.add('offline-mode');

                // 改造讨封按钮为卷轴风格
                const taofengBtn = document.querySelector('.nav-btn[data-page="taofeng"]');
                if (taofengBtn && !taofengBtn.classList.contains('scroll-btn')) {
                    taofengBtn.classList.add('scroll-btn');
                    taofengBtn.classList.add('active');
                    // 添加装饰元素
                    if (!taofengBtn.querySelector('.btn-glow')) {
                        const glowTop = document.createElement('span');
                        glowTop.className = 'btn-glow';
                        const glowBottom = document.createElement('span');
                        glowBottom.className = 'btn-glow btn-glow-bottom';
                        taofengBtn.prepend(glowTop);
                        taofengBtn.appendChild(glowBottom);
                    }
                    if (!taofengBtn.querySelector('.btn-text')) {
                        const existingText = taofengBtn.textContent.trim();
                        taofengBtn.childNodes.forEach(node => {
                            if (node.nodeType === 3) node.textContent = '';
                        });
                        const span = document.createElement('span');
                        span.className = 'btn-text';
                        span.textContent = existingText || '讨封';
                        taofengBtn.appendChild(span);
                    }
                }

                // 隐藏其他导航按钮
                navBtns.forEach(btn => {
                    if (btn.dataset.page !== 'taofeng') {
                        btn.classList.add('hidden-btn');
                        btn.classList.remove('active');
                    }
                });
                if (taofengBtn) taofengBtn.classList.add('active');

                // 关闭设置面板
                overlayBg.classList.remove('show');
                settingsPanel.classList.remove('show');

                // 如果当前显示的是其他iframe，切回讨封
                if (currentVisibleIframe === 'other') {
                    // 讨封需要加载本地版本
                    taoLoadedUrl = null;
                    isTaoLoading = false;
                    loadTao(true);
                } else {
                    // 当前显示讨封，但如果之前是远程URL，需要切换到本地
                    const localUrl = getTaoUrlLocal();
                    if (taoLoadedUrl && taoLoadedUrl !== localUrl) {
                        taoLoadedUrl = null;
                        isTaoLoading = false;
                        loadTao(true);
                    }
                }

                updateLoadingText('讨封卷轴 · 离线');
                retryBtn.classList.remove('visible');

                // ===== 断网时显示红色横幅 =====
                showOfflineBanner();
            }

            function exitOfflineMode() {
                if (!isOffline) return;
                isOffline = false;

                appContainer.classList.remove('offline-mode');

                // 移除卷轴样式
                const taofengBtn = document.querySelector('.nav-btn[data-page="taofeng"]');
                if (taofengBtn) {
                    taofengBtn.classList.remove('scroll-btn');
                    const glowTop = taofengBtn.querySelector('.btn-glow');
                    const glowBottom = taofengBtn.querySelector('.btn-glow-bottom');
                    if (glowTop) glowTop.remove();
                    if (glowBottom) glowBottom.remove();
                    const textSpan = taofengBtn.querySelector('.btn-text');
                    if (textSpan) {
                        const txt = document.createTextNode('讨封');
                        textSpan.parentNode.replaceChild(txt, textSpan);
                    }
                    // 清理空白文本节点，恢复文字
                    let hasText = false;
                    taofengBtn.childNodes.forEach(node => {
                        if (node.nodeType === 3 && node.textContent.trim() === '讨封') hasText = true;
                    });
                    if (!hasText) {
                        const txtNode = document.createTextNode('讨封');
                        taofengBtn.appendChild(txtNode);
                    }
                }

                // 恢复所有导航按钮
                navBtns.forEach(btn => {
                    btn.classList.remove('hidden-btn', 'scroll-btn');
                    // 清理残留装饰
                    const gts = btn.querySelectorAll('.btn-glow, .btn-glow-bottom, .btn-text');
                    gts.forEach(el => {
                        if (el.classList.contains('btn-text')) {
                            const txt = document.createTextNode(el.textContent || '');
                            el.parentNode.replaceChild(txt, el);
                        } else {
                            el.remove();
                        }
                    });
                });

                // 恢复卷轴模式设置
                if (!wasThemeOnBeforeOffline) {
                    themeSwitch.classList.remove('on');
                }

                // 恢复高亮
                navBtns.forEach(btn => {
                    const shouldBeActive = (currentVisibleIframe === 'tao' && btn.dataset.page === 'taofeng') ||
                        (currentVisibleIframe === 'other' && btn.dataset.page === otherLoadedPage);
                    btn.classList.toggle('active', shouldBeActive);
                });

                // 重新加载讨封（使用远程URL）
                taoLoadedUrl = null;
                isTaoLoading = false;
                if (currentVisibleIframe === 'tao') {
                    loadTao(false);
                } else {
                    // 后台更新讨封URL
                    const newTaoUrl = buildTaoUrl(false);
                    if (taoLoadedUrl !== newTaoUrl) {
                        isTaoLoading = true;
                        taoLoadedUrl = newTaoUrl;
                        iframeTao.src = newTaoUrl;
                    }
                }

                // ===== 网络恢复时隐藏红色横幅 =====
                hideOfflineBanner();
            }

            function checkOnlineStatus() {
                const online = navigator.onLine;
                if (!online && !isOffline) {
                    enterOfflineMode();
                } else if (online && isOffline) {
                    exitOfflineMode();
                }
                return online;
            }

            // ==================== 事件绑定 ====================

            // 讨封iframe加载完成
            iframeTao.addEventListener('load', function() {
                isTaoLoading = false;
                if (currentVisibleIframe === 'tao') {
                    hideLoading();
                }
                // 更新taoLoadedUrl为实际加载的URL
                try {
                    const actualSrc = iframeTao.contentWindow?.location?.href;
                    if (actualSrc && actualSrc !== 'about:blank') {
                        taoLoadedUrl = actualSrc;
                    }
                } catch (e) {
                    // 跨域无法读取，使用之前设置的URL
                }
                isInitialLoad = false;
            });

            // 讨封iframe加载错误
            iframeTao.addEventListener('error', function() {
                isTaoLoading = false;
                if (isOffline) {
                    // 断网模式下本地加载也失败
                    if (currentVisibleIframe === 'tao') {
                        updateLoadingText('讨封卷轴暂不可用');
                        showRetryButton();
                    }
                } else {
                    // 联网加载失败，尝试断网模式
                    if (!isOffline) {
                        enterOfflineMode();
                    } else if (currentVisibleIframe === 'tao') {
                        updateLoadingText('讨封加载失败');
                        showRetryButton();
                    }
                }
            });

            // 其他iframe加载完成
            iframeOther.addEventListener('load', function() {
                isOtherLoading = false;
                if (currentVisibleIframe === 'other') {
                    hideLoading();
                }
                try {
                    const actualSrc = iframeOther.contentWindow?.location?.href;
                    if (actualSrc && actualSrc !== 'about:blank') {
                        otherLoadedUrl = actualSrc;
                    }
                } catch (e) { /* 跨域 */ }
            });

            // 其他iframe加载错误
            iframeOther.addEventListener('error', function() {
                isOtherLoading = false;
                if (currentVisibleIframe === 'other') {
                    updateLoadingText('页面加载失败');
                    showRetryButton();
                }
            });

            // 重试按钮
            retryBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isOffline || currentVisibleIframe === 'tao') {
                    taoLoadedUrl = null;
                    isTaoLoading = false;
                    loadTao(isOffline);
                } else {
                    otherLoadedPage = null;
                    otherLoadedUrl = null;
                    isOtherLoading = false;
                    const pageKey = otherLoadedPage || 'achievement';
                    // 找到当前高亮的非讨封按钮
                    const activeBtn = document.querySelector('.nav-btn.active:not([data-page="taofeng"]):not([data-page="settings"])');
                    const targetPage = activeBtn ? activeBtn.dataset.page : pageKey;
                    loadOtherPage(targetPage);
                }
            });

            // 导航栏点击
            bottomNav.addEventListener('click', function(e) {
                const btn = e.target.closest('.nav-btn');
                if (!btn || !btn.dataset.page) return;

                const pageKey = btn.dataset.page;

                // 断网模式下只允许讨封
                if (isOffline && pageKey !== 'taofeng') {
                    return;
                }

                if (pageKey === 'settings') {
                    if (!isOffline) {
                        overlayBg.classList.add('show');
                        settingsPanel.classList.add('show');
                    }
                    return;
                }

                if (pageKey === 'taofeng') {
                    // 切回讨封，不重新加载
                    switchToTao();
                    navBtns.forEach(b => b.classList.toggle('active', b.dataset.page === 'taofeng'));
                } else {
                    switchPage(pageKey);
                }
            });

            // 设置面板
            document.getElementById('closeSettingsBtn').addEventListener('click', function() {
                overlayBg.classList.remove('show');
                settingsPanel.classList.remove('show');
            });
            overlayBg.addEventListener('click', function() {
                overlayBg.classList.remove('show');
                settingsPanel.classList.remove('show');
            });

            // 卷轴模式开关
            themeSwitch.addEventListener('click', function() {
                if (isOffline) return; // 断网时不允许切换
                this.classList.toggle('on');
                // 卷轴模式改变，讨封需要重新加载
                taoLoadedUrl = null;
                isTaoLoading = false;
                if (currentVisibleIframe === 'tao') {
                    loadTao(false);
                } else {
                    // 后台更新讨封URL
                    const newTaoUrl = buildTaoUrl(false);
                    isTaoLoading = true;
                    taoLoadedUrl = newTaoUrl;
                    iframeTao.src = newTaoUrl;
                }
                // 如果其他iframe当前有页面，也重新加载
                if (currentVisibleIframe === 'other' && otherLoadedPage) {
                    const pageKey = otherLoadedPage;
                    otherLoadedPage = null;
                    otherLoadedUrl = null;
                    isOtherLoading = false;
                    loadOtherPage(pageKey);
                }
            });

            // 平板模式开关
            tabletSwitch.addEventListener('click', function() {
                this.classList.toggle('on');
                // 平板模式为实验性功能，暂不添加具体逻辑
            });

            // ==================== 网络状态监听 ====================
            window.addEventListener('online', function() {
                if (isOffline) exitOfflineMode();
            });
            window.addEventListener('offline', function() {
                if (!isOffline) enterOfflineMode();
            });

            // 页面可见性变化时检测
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    const online = navigator.onLine;
                    if (!online && !isOffline) {
                        enterOfflineMode();
                    } else if (online && isOffline) {
                        exitOfflineMode();
                    }
                }
            });

            // 定期检测网络（补充手段）
            setInterval(function() {
                const online = navigator.onLine;
                if (!online && !isOffline) {
                    enterOfflineMode();
                } else if (online && isOffline) {
                    exitOfflineMode();
                }
            }, 30000);

            // ==================== 初始化 ====================
            function init() {
                initPlayerName();

                // 初始时其他iframe隐藏
                iframeOther.style.display = '';
                iframeOther.classList.remove('active');
                iframeTao.classList.remove('dimmed');
                currentVisibleIframe = 'tao';

                const online = navigator.onLine;
                if (!online) {
                    // 直接进入断网模式
                    enterOfflineMode();
                    // 确保讨封加载本地版本
                    taoLoadedUrl = null;
                    isTaoLoading = false;
                    loadTao(true);
                } else {
                    isOffline = false;
                    appContainer.classList.remove('offline-mode');
                    // 正常加载讨封
                    loadTao(false);
                    // 高亮讨封按钮
                    navBtns.forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.page === 'taofeng');
                    });
                    // 确保横幅隐藏
                    hideOfflineBanner();
                }

                // 延迟二次检测
                setTimeout(function() {
                    if (!navigator.onLine && !isOffline) {
                        enterOfflineMode();
                        taoLoadedUrl = null;
                        isTaoLoading = false;
                        loadTao(true);
                    } else if (navigator.onLine && isOffline) {
                        exitOfflineMode();
                    } else if (navigator.onLine) {
                        // 确保横幅隐藏
                        hideOfflineBanner();
                    }
                }, 600);
            }

            init();
        })();
    </script>
</body>
</html>
