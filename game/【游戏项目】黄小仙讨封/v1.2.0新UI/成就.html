<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>道主仙府 · 功德卷</title>
    <meta name="theme-color" content="#5D4037">
    <style>
        :root {
            --scroll-bg: #F5DEB3;
            --scroll-dark: #8B4513;
            --scroll-gold: #B8860B;
            --scroll-text: #3E2723;
            --scroll-light: #FFF8DC;
            --card-bg: rgba(255, 248, 220, 0.7);
            --card-border: #A0522D;
            --unlocked-glow: rgba(184, 134, 11, 0.35);
            --legendary-glow: rgba(139, 69, 19, 0.5);
            --font-stack: "SimSun", "Songti SC", "Noto Serif SC", serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: var(--scroll-bg);
            color: var(--scroll-text);
            font-family: var(--font-stack);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139,69,19,0.03) 2px, rgba(139,69,19,0.03) 4px),
                radial-gradient(ellipse at 50% 0%, rgba(210,180,140,0.2) 0%, transparent 60%);
        }
        .page-container {
            max-width: 720px;
            width: 100%;
            padding: 24px 20px 40px;
            background: rgba(255, 248, 220, 0.5);
            border-left: 4px solid var(--scroll-dark);
            border-right: 4px solid var(--scroll-dark);
            box-shadow: 0 0 30px rgba(0,0,0,0.2);
            position: relative;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid var(--scroll-dark);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        .header h1 {
            color: var(--scroll-gold);
            font-size: 36px;
            letter-spacing: 6px;
            text-shadow: 2px 2px 0 var(--scroll-dark);
        }
        .subtitle {
            color: #5D4037;
            font-size: 14px;
            letter-spacing: 4px;
            font-style: italic;
        }
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: linear-gradient(180deg, #D2B48C, #A0522D);
            border: 2px solid var(--scroll-dark);
            border-radius: 20px;
            padding: 6px 20px;
            font-size: 14px;
            color: var(--scroll-light);
            letter-spacing: 1px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
        }
        .stat-count {
            font-weight: bold;
            font-size: 24px;
            color: #FFE4B5;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .seal-btn {
            padding: 12px 8px;
            font-size: 1em;
            font-weight: bold;
            color: #f5e8c9;
            background: #8B4513;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-stack);
            box-shadow: 0 4px 0 #5D2906;
            text-align: center;
            letter-spacing: 1px;
        }
        .seal-btn:hover { transform: translateY(-2px); }
        .red-seal { background: #A52A2A; box-shadow: 0 4px 0 #5D1F1F; }
        .gray-seal { background: #696969; box-shadow: 0 4px 0 #3D3D3D; }

        .section-title {
            color: var(--scroll-dark);
            font-size: 14px;
            letter-spacing: 4px;
            text-align: center;
            padding: 16px 0 10px;
            border-top: 2px solid var(--scroll-dark);
            margin-top: 10px;
            font-weight: bold;
        }
        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .achievement-row {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px dashed var(--scroll-dark);
            min-height: 60px;
            gap: 16px;
            background: var(--card-bg);
            margin-bottom: 4px;
            border-radius: 6px;
        }
        .achievement-row:last-child { border-bottom: none; }
        .achievement-icon-cell {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border: 2px solid var(--scroll-dark);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: linear-gradient(135deg, #F5DEB3, #DEB887);
        }
        .achievement-row.unlocked .achievement-icon-cell {
            border-color: var(--scroll-gold);
            box-shadow: 0 0 10px var(--unlocked-glow);
        }
        .achievement-row.locked .achievement-icon-cell {
            opacity: 0.4;
            filter: grayscale(0.4);
        }
        .achievement-row.legendary .achievement-icon-cell {
            border-color: var(--scroll-dark);
            background: linear-gradient(135deg, #FFE4B5, #D2B48C);
            box-shadow: 0 0 16px var(--legendary-glow);
        }
        .achievement-name {
            flex: 1;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .achievement-row.locked .achievement-name {
            color: #8B7355;
            font-style: italic;
            font-weight: normal;
        }
        .achievement-badge {
            font-size: 10px;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 14px;
            border: 1px solid;
        }
        .unlocked .achievement-badge { border-color: var(--scroll-gold); color: var(--scroll-dark); background: rgba(184,134,11,0.15); }
        .legendary .achievement-badge { background: #8B4513; color: #FFE4B5; }
        .locked .achievement-badge { border-color: var(--scroll-dark); color: #8B7355; opacity: 0.6; }
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--scroll-dark);
            font-style: italic;
        }
        .save-time {
            text-align: center;
            color: #8b5a2b;
            font-size: 0.85em;
            margin: 10px 0;
            padding: 8px;
            background: rgba(139,90,43,0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <h1>道主仙府</h1>
            <p class="subtitle">功德卷 · 成就图鉴</p>
            <div class="stats-row">
                <div class="stat-item">
                    已解锁 <span class="stat-count" id="unlockedCount">0</span> / <span id="totalCount">40</span>
                </div>
                <div class="stat-item" id="legendaryStat" style="display:none;">
                    传说 <span class="stat-count" id="legendaryCount">0</span>
                </div>
            </div>
        </div>

        <!-- 道主信息卡片 -->
        <div style="background: rgba(255,255,255,0.7); padding: 16px; border-left: 4px solid #8B4513; border-radius: 4px; margin-bottom: 20px;">
            <div style="display:flex; justify-content: space-between; margin-bottom:8px;">
                <span>道号：</span><strong id="display-daoHao">-</strong>
            </div>
            <div style="display:flex; justify-content: space-between; margin-bottom:8px;">
                <span>灵韵：</span><strong id="display-lingYun">-</strong>
            </div>
            <div style="display:flex; justify-content: space-between; margin-bottom:8px;">
                <span>浊念：</span><strong id="display-zhuoNian">-</strong>
            </div>
            <div style="display:flex; justify-content: space-between; margin-bottom:8px;">
                <span>当前节点：</span><strong id="display-storyNode">-</strong>
            </div>
            <div class="save-time" id="lastSaveTime">上次云端同步：<strong>从未同步</strong></div>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-group">
            <button class="seal-btn red-seal" onclick="pushCloudSave()">封存修为</button>
            <button class="seal-btn red-seal" onclick="pullCloudSave()">接续仙缘</button>
            <button class="seal-btn gray-seal" onclick="exportAllData()">导出仙籍</button>
            <button class="seal-btn gray-seal" onclick="importAllDataPrompt()">导入仙籍</button>
            <button class="seal-btn gray-seal" onclick="logout()">重入轮回</button>
        </div>

        <!-- 成就区域 -->
        <div id="unlockedSection">
            <div class="section-title legendary-title" id="unlockedTitle" style="display:none;">✦ 已历劫 · 道心圆满 ✦</div>
            <div class="achievement-list" id="unlockedList"></div>
            <div class="empty-state" id="unlockedEmpty">尚无成就，去红尘走一遭吧</div>
        </div>
        <div id="lockedSection">
            <div class="section-title" id="lockedTitle">尘缘未了</div>
            <div class="achievement-list" id="lockedList"></div>
        </div>
        <div style="text-align:center; font-size:11px; color:#5D4037; margin-top:10px;">卷轴仙籍 · 万世不易</div>
    </div>

    <script>
        // ========== 配置解密（Base64混淆） ==========
        const ENCODED_CONFIG = "eyJ1c2VyIjoiMjA1MTc3NTUwNSIsInBhc3MiOiJSYWNjb29uIiwiYXBwaWQiOiIxMTIxIiwiYXBpUXVlcnkiOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX2FwaV9xdWVyeS5waHAiLCJhcGlFc3RhYmxpc2giOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX2FwaV9lc3RhYmxpc2gucGhwIiwiYXBpTW9kaWZ5IjoiaHR0cHM6Ly95dWp1Ljk5a3BrLnRvcDo4MS9hcGkvZmlsZV9hcGlfbW9kaWZ5LnBocCIsImFwaUxpc3QiOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX29idGFpbl9saXN0LnBocCJ9";
        let CONFIG = null;
        function getConfig() {
            if (!CONFIG) {
                try {
                    CONFIG = JSON.parse(atob(ENCODED_CONFIG));
                } catch(e) {
                    console.error('配置解密失败，请检查完整性');
                    return {};
                }
            }
            return CONFIG;
        }

        // ========== 成就定义 ==========
        const achievementIcons = [
            { id: 'witness', title: '无对无错，善良依旧', icon: '✦', legendary: true },
            { id: 'sacrifice', title: '舍身成仁', icon: '†', legendary: true },
            { id: 'true', title: '本相自在', icon: '◯', legendary: false },
            { id: 'god', title: '点化成仙', icon: '☀', legendary: false },
            { id: 'mortal', title: '尘世轮回', icon: '人', legendary: false },
            { id: 'fail_scholar', title: '功亏一篑', icon: '✗', legendary: false },
            { id: 'fail_kid', title: '原形毕露', icon: '✗', legendary: false },
            { id: 'farmer', title: '山野村夫', icon: '🌾', legendary: false },
            { id: 'star', title: '文曲星耀', icon: '⭐', legendary: false },
            { id: 'demon_king', title: '妖王之路', icon: '◆', legendary: false },
            { id: 'mad', title: '执念成魔', icon: '◇', legendary: false },
            { id: 'love', title: '红尘情缘', icon: '♡', legendary: false },
            { id: 'guardian', title: '守山之人', icon: '⛰', legendary: false },
            { id: 'lost', title: '雨夜迷途', icon: '?', legendary: false },
            { id: 'severed', title: '断缘而去', icon: '—', legendary: false },
            { id: 'dawn', title: '黎明归宿', icon: '☽', legendary: false },
            { id: 'sword_friend', title: '剑影知交', icon: '⚔', legendary: false },
            { id: 'sword_master', title: '剑道传承', icon: '剑', legendary: false },
            { id: 'green_memory', title: '前尘往事', icon: '记', legendary: false },
            { id: 'green_fate', title: '三世因缘', icon: '缘', legendary: false },
            { id: 'great_good', title: '大善若水', icon: '☯', legendary: false },
            { id: 'great_evil', title: '大恶如魔', icon: '💀', legendary: false },
            { id: 'balance_sage', title: '中庸之道', icon: '⚖', legendary: false },
            { id: 'ghost_friend', title: '鬼魂之交', icon: '👻', legendary: false },
            { id: 'star_seeker', title: '星辰指引', icon: '星', legendary: false },
            { id: 'hermit', title: '隐士之道', icon: '隐', legendary: false },
            { id: 'treasure', title: '寻宝猎人', icon: '宝', legendary: false },
            { id: 'dragon_friend', title: '蛟龙之友', icon: '龙', legendary: false },
            { id: 'spirit_guardian', title: '灵脉守护', icon: '脉', legendary: false },
            { id: 'forest_king', title: '森林之王', icon: '林', legendary: false },
            { id: 'underworld', title: '黄泉交易', icon: '泉', legendary: false },
            { id: 'immortal', title: '长生不老', icon: '寿', legendary: false },
            { id: 'forgotten_god', title: '遗忘之神', icon: '忘', legendary: false },
            { id: 'fake_god', title: '伪仙真相', icon: '假', legendary: false },
            { id: 'fake_enemy', title: '宿敌真相', icon: '敌', legendary: false },
            { id: 'dream_ending', title: '黄粱一梦', icon: '梦', legendary: false },
            { id: 'time_loop', title: '时光倒流', icon: '循环', legendary: false },
            { id: 'destiny_symphony', title: '命运交响', icon: '命', legendary: false },
            { id: 'fate_encounter', title: '因缘际会', icon: '会', legendary: false },
            { id: 'suspicious', title: '疑心失缘', icon: '疑', legendary: false }
        ];

        const STORAGE_KEY = 'huangdaxian_achievements';
        const ORDER_KEY = 'huangdaxian_achievement_order';
        let cachedAchievements = null, cachedOrder = null;

        // ========== 成就存储（直接使用localStorage，兼容iframe父窗口） ==========
        function getAchievements() {
            if (cachedAchievements) return cachedAchievements;
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    if (data && typeof data === 'object' && !Array.isArray(data)) {
                        cachedAchievements = data;
                        return data;
                    }
                } catch(e) {}
            }
            // 尝试从父窗口读取
            try {
                if (window.parent && window.parent !== window) {
                    const pRaw = window.parent.localStorage.getItem(STORAGE_KEY);
                    if (pRaw) {
                        const data = JSON.parse(pRaw);
                        if (data && typeof data === 'object') {
                            cachedAchievements = data;
                            return data;
                        }
                    }
                }
            } catch(e) {}
            return {};
        }

        function saveAchievements(ach) {
            cachedAchievements = ach;
            const json = JSON.stringify(ach);
            localStorage.setItem(STORAGE_KEY, json);
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.localStorage.setItem(STORAGE_KEY, json);
                }
            } catch(e) {}
        }

        function getOrder() {
            if (cachedOrder) return cachedOrder;
            const raw = localStorage.getItem(ORDER_KEY);
            if (raw) {
                try {
                    const arr = JSON.parse(raw);
                    if (Array.isArray(arr)) {
                        cachedOrder = arr;
                        return arr;
                    }
                } catch(e) {}
            }
            return [];
        }

        function saveOrder(order) {
            cachedOrder = order;
            localStorage.setItem(ORDER_KEY, JSON.stringify(order));
        }

        function getAchievementTitles() {
            const ach = getAchievements();
            return Object.keys(ach).filter(id => ach[id]).map(id => {
                const found = achievementIcons.find(a => a.id === id);
                return found ? found.title : id;
            });
        }

        // ========== 渲染成就列表 ==========
        function renderAchievements() {
            const ach = getAchievements();
            const order = getOrder();
            const unlockedIds = Object.keys(ach).filter(id => ach[id]);
            let sortedUnlocked = [];
            if (order.length) {
                sortedUnlocked = order.filter(id => unlockedIds.includes(id));
                const newIds = unlockedIds.filter(id => !order.includes(id));
                sortedUnlocked = [...newIds, ...sortedUnlocked];
            } else {
                sortedUnlocked = unlockedIds;
            }
            const lockedAll = achievementIcons.filter(a => !unlockedIds.includes(a.id));

            const unlockedList = document.getElementById('unlockedList');
            unlockedList.innerHTML = '';
            if (sortedUnlocked.length) {
                document.getElementById('unlockedTitle').style.display = 'block';
                document.getElementById('unlockedEmpty').style.display = 'none';
                sortedUnlocked.forEach(id => {
                    const achItem = achievementIcons.find(a => a.id === id);
                    if (achItem) unlockedList.appendChild(createRow(achItem, true));
                });
            } else {
                document.getElementById('unlockedTitle').style.display = 'none';
                document.getElementById('unlockedEmpty').style.display = 'block';
            }

            const lockedList = document.getElementById('lockedList');
            lockedList.innerHTML = '';
            if (lockedAll.length) {
                document.getElementById('lockedTitle').style.display = 'block';
                lockedAll.forEach(a => lockedList.appendChild(createRow(a, false)));
            } else {
                document.getElementById('lockedTitle').style.display = 'none';
            }

            document.getElementById('unlockedCount').textContent = sortedUnlocked.length;
            document.getElementById('totalCount').textContent = achievementIcons.length;
            const legendUnlocked = sortedUnlocked.filter(id => achievementIcons.find(a => a.id === id)?.legendary).length;
            const totalLegend = achievementIcons.filter(a => a.legendary).length;
            const ls = document.getElementById('legendaryStat');
            if (legendUnlocked) {
                ls.style.display = 'inline-flex';
                document.getElementById('legendaryCount').textContent = legendUnlocked + '/' + totalLegend;
            } else ls.style.display = 'none';
        }

        function createRow(achItem, unlocked) {
            const row = document.createElement('div');
            const classNames = ['achievement-row'];
            if (unlocked) {
                classNames.push('unlocked');
                if (achItem.legendary) classNames.push('legendary');
            } else {
                classNames.push('locked');
            }
            row.className = classNames.join(' ');
            row.innerHTML = `
                <div class="achievement-icon-cell">${unlocked ? achItem.icon : '?'}</div>
                <div class="achievement-name">${achItem.title}</div>
                <span class="achievement-badge">${unlocked ? (achItem.legendary ? '传说' : '已解锁') : '未解锁'}</span>
            `;
            return row;
        }

        // ========== 道主信息 & 云端操作 ==========
        let playerName = '';
        let cloudDocId = '';

        function updateUserInfo() {
            document.getElementById('display-daoHao').textContent = playerName || '未登录';
            document.getElementById('display-lingYun').textContent = localStorage.getItem('lingYun') || '100';
            document.getElementById('display-zhuoNian').textContent = localStorage.getItem('zhuoNian') || '0';
            document.getElementById('display-storyNode').textContent = localStorage.getItem('storyNode') || 'start';
            const last = localStorage.getItem('lastCloudSaveTime');
            if (last) {
                document.getElementById('lastSaveTime').innerHTML = `上次云端同步：<strong>${new Date(parseInt(last)).toLocaleString('zh-CN')}</strong>`;
            }
        }

        async function findDocByTitle() {
            const cfg = getConfig();
            const url = `${cfg.apiList}?user=${cfg.user}&pass=${cfg.pass}&appid=${cfg.appid}`;
            const res = await fetch(url);
            const result = await res.json();
            return (result.code == 1 && result.list) ? result.list.find(i => i.title === playerName)?.id : null;
        }

        async function pushCloudSave() {
            if (!playerName) return alert('道号未知，无法封存');
            const achievements = getAchievementTitles();
            const saveData = {
                achievements: achievements,
                storyNode: localStorage.getItem('storyNode') || 'start',
                lingYun: parseInt(localStorage.getItem('lingYun') || '100'),
                zhuoNian: parseInt(localStorage.getItem('zhuoNian') || '0'),
                updateTime: Date.now()
            };
            const contentStr = JSON.stringify(saveData);
            const cfg = getConfig();
            try {
                if (!cloudDocId) {
                    const existingId = await findDocByTitle();
                    if (existingId) {
                        cloudDocId = existingId;
                        localStorage.setItem('cloudDocId', cloudDocId);
                    }
                }
                let url, options;
                if (cloudDocId) {
                    url = `${cfg.apiModify}?user=${cfg.user}&pass=${cfg.pass}&appid=${cfg.appid}&id=${cloudDocId}`;
                    options = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `title=${encodeURIComponent(playerName)}&content=${encodeURIComponent(contentStr)}`
                    };
                } else {
                    url = `${cfg.apiEstablish}?user=${cfg.user}&pass=${cfg.pass}&appid=${cfg.appid}`;
                    options = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `title=${encodeURIComponent(playerName)}&content=${encodeURIComponent(contentStr)}`
                    };
                }
                const res = await fetch(url, options);
                const result = await res.json();
                if (result.code == 1) {
                    if (!cloudDocId) {
                        let newId = result.id || result.data || await findDocByTitle();
                        if (newId) {
                            cloudDocId = newId;
                            localStorage.setItem('cloudDocId', newId);
                        }
                    }
                    localStorage.setItem('lastCloudSaveTime', Date.now());
                    updateUserInfo();
                    alert('修为已封存至云端！');
                } else {
                    alert('封存失败：' + (result.msg || '未知错误'));
                }
            } catch(e) {
                alert('网络错误：' + e.message);
            }
        }

        async function pullCloudSave() {
            if (!cloudDocId) return alert('未找到仙籍ID');
            const cfg = getConfig();
            const url = `${cfg.apiQuery}?user=${cfg.user}&pass=${cfg.pass}&appid=${cfg.appid}&id=${cloudDocId}`;
            try {
                const res = await fetch(url);
                const result = await res.json();
                if (result.code == 1) {
                    const data = JSON.parse(result.content);
                    const titles = data.achievements || [];
                    const achObj = {};
                    titles.forEach(title => {
                        const found = achievementIcons.find(a => a.title === title);
                        if (found) achObj[found.id] = true;
                    });
                    saveAchievements(achObj);
                    localStorage.setItem('storyNode', data.storyNode || 'start');
                    localStorage.setItem('lingYun', data.lingYun || 100);
                    localStorage.setItem('zhuoNian', data.zhuoNian || 0);
                    localStorage.setItem('lastCloudSaveTime', Date.now());
                    renderAchievements();
                    updateUserInfo();
                    alert('仙缘已接续！');
                } else {
                    alert('接续失败：' + result.msg);
                }
            } catch(e) {
                alert('网络错误：' + e.message);
            }
        }

        // ========== 导出/导入 ==========
        async function exportAllData() {
            const ach = getAchievements();
            const order = getOrder();
            const payload = {
                version: 2,
                exportTime: new Date().toISOString(),
                achievements: ach,
                order: order,
                playerName: playerName,
                storyNode: localStorage.getItem('storyNode'),
                lingYun: localStorage.getItem('lingYun'),
                zhuoNian: localStorage.getItem('zhuoNian')
            };
            const str = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
            try {
                await navigator.clipboard.writeText(str);
                alert('仙籍已复制至剪贴板');
            } catch(e) {
                prompt('请手动复制：', str);
            }
        }

        async function importAllDataPrompt() {
            const input = prompt('请粘贴仙籍备份：');
            if (!input) return;
            let json;
            try { json = decodeURIComponent(escape(atob(input))); } catch { json = input; }
            try {
                const data = JSON.parse(json);
                if (data.achievements) {
                    const merged = { ...getAchievements(), ...data.achievements };
                    saveAchievements(merged);
                }
                if (data.order) saveOrder(data.order);
                if (data.playerName) { playerName = data.playerName; localStorage.setItem('playerName', playerName); }
                if (data.storyNode) localStorage.setItem('storyNode', data.storyNode);
                if (data.lingYun) localStorage.setItem('lingYun', data.lingYun);
                if (data.zhuoNian) localStorage.setItem('zhuoNian', data.zhuoNian);
                renderAchievements();
                updateUserInfo();
                alert('仙籍导入成功！');
            } catch(e) {
                alert('导入失败：格式错误');
            }
        }

        function logout() {
            if (confirm('确定重入轮回？所有本地数据将被清除。')) {
                localStorage.clear();
                location.reload();
            }
        }

        // ========== 初始化 ==========
        window.addEventListener('load', () => {
            const params = new URLSearchParams(location.search);
            playerName = params.get('player') || localStorage.getItem('playerName') || '';
            cloudDocId = params.get('docId') || localStorage.getItem('cloudDocId') || '';
            if (!playerName) {
                try {
                    if (window.parent && window.parent !== window) {
                        playerName = window.parent.localStorage.getItem('playerName') || '';
                        cloudDocId = cloudDocId || window.parent.localStorage.getItem('cloudDocId') || '';
                    }
                } catch(e) {}
            }
            if (playerName) localStorage.setItem('playerName', playerName);
            if (cloudDocId) localStorage.setItem('cloudDocId', cloudDocId);

            updateUserInfo();
            renderAchievements();
        });
    </script>
</body>
</html>
