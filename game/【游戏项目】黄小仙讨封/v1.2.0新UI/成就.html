<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>道主仙府 · 功德卷</title>
    <meta name="theme-color" content="#5D4037">
    <style>
        :root {
            --scroll-bg: #F5DEB3;
            --scroll-dark: #8B4513;
            --scroll-gold: #B8860B;
            --scroll-text: #3E2723;
            --scroll-light: #FFF8DC;
            --card-bg: rgba(255, 248, 220, 0.7);
            --unlocked-glow: rgba(184, 134, 11, 0.35);
            --legendary-glow: rgba(139, 69, 19, 0.5);
            --font-stack: "SimSun", "Songti SC", "Noto Serif SC", serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: var(--scroll-bg);
            color: var(--scroll-text);
            font-family: var(--font-stack);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 69, 19, 0.03) 2px, rgba(139, 69, 19, 0.03) 4px),
                radial-gradient(ellipse at 50% 0%, rgba(210, 180, 140, 0.2) 0%, transparent 60%);
        }
        .page-container {
            max-width: 720px;
            width: 100%;
            padding: 24px 20px 40px;
            background: rgba(255, 248, 220, 0.5);
            border-left: 4px solid var(--scroll-dark);
            border-right: 4px solid var(--scroll-dark);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid var(--scroll-dark);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        .header h1 {
            color: var(--scroll-gold);
            font-size: 36px;
            letter-spacing: 6px;
            text-shadow: 2px 2px 0 var(--scroll-dark);
        }
        .subtitle {
            color: #5D4037;
            font-size: 14px;
            letter-spacing: 4px;
            font-style: italic;
        }
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: linear-gradient(180deg, #D2B48C, #A0522D);
            border: 2px solid var(--scroll-dark);
            border-radius: 20px;
            padding: 6px 20px;
            font-size: 14px;
            color: var(--scroll-light);
            letter-spacing: 1px;
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.4);
        }
        .stat-count {
            font-weight: bold;
            font-size: 24px;
            color: #FFE4B5;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .seal-btn {
            padding: 12px 8px;
            font-size: 1em;
            font-weight: bold;
            color: #f5e8c9;
            background: #8B4513;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-stack);
            box-shadow: 0 4px 0 #5D2906;
            text-align: center;
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .seal-btn:hover {
            transform: translateY(-2px);
        }
        .seal-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #5D2906;
        }
        .red-seal {
            background: #A52A2A;
            box-shadow: 0 4px 0 #5D1F1F;
        }
        .red-seal:active {
            box-shadow: 0 2px 0 #5D1F1F;
        }
        .gray-seal {
            background: #696969;
            box-shadow: 0 4px 0 #3D3D3D;
        }
        .gray-seal:active {
            box-shadow: 0 2px 0 #3D3D3D;
        }
        .section-title {
            color: var(--scroll-dark);
            font-size: 14px;
            letter-spacing: 4px;
            text-align: center;
            padding: 16px 0 10px;
            border-top: 2px solid var(--scroll-dark);
            margin-top: 10px;
            font-weight: bold;
        }
        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .achievement-row {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px dashed var(--scroll-dark);
            min-height: 60px;
            gap: 16px;
            background: var(--card-bg);
            margin-bottom: 4px;
            border-radius: 6px;
        }
        .achievement-row:last-child {
            border-bottom: none;
        }
        .achievement-icon-cell {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border: 2px solid var(--scroll-dark);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: linear-gradient(135deg, #F5DEB3, #DEB887);
        }
        .achievement-row.unlocked .achievement-icon-cell {
            border-color: var(--scroll-gold);
            box-shadow: 0 0 10px var(--unlocked-glow);
        }
        .achievement-row.locked .achievement-icon-cell {
            opacity: 0.4;
            filter: grayscale(0.4);
        }
        .achievement-row.legendary .achievement-icon-cell {
            border-color: var(--scroll-dark);
            background: linear-gradient(135deg, #FFE4B5, #D2B48C);
            box-shadow: 0 0 16px var(--legendary-glow);
        }
        .achievement-name {
            flex: 1;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .achievement-row.locked .achievement-name {
            color: #8B7355;
            font-style: italic;
            font-weight: normal;
        }
        .achievement-badge {
            font-size: 10px;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 14px;
            border: 1px solid;
            white-space: nowrap;
        }
        .unlocked .achievement-badge {
            border-color: var(--scroll-gold);
            color: var(--scroll-dark);
            background: rgba(184, 134, 11, 0.15);
        }
        .legendary .achievement-badge {
            background: #8B4513;
            color: #FFE4B5;
        }
        .locked .achievement-badge {
            border-color: var(--scroll-dark);
            color: #8B7355;
            opacity: 0.6;
        }
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--scroll-dark);
            font-style: italic;
        }
        .save-time {
            text-align: center;
            color: #8b5a2b;
            font-size: 0.85em;
            margin: 10px 0;
            padding: 8px;
            background: rgba(139, 90, 43, 0.1);
            border-radius: 4px;
        }
        .edit-link {
            font-size: 12px;
            color: var(--scroll-gold);
            cursor: pointer;
            margin-left: 8px;
            text-decoration: underline;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .achievement-note {
            font-size: 10px;
            color: var(--scroll-gold);
            margin-left: 8px;
            font-style: italic;
        }

        /* ==================== 自定义弹窗样式 ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-dialog {
            background: linear-gradient(180deg, #FFF8DC, #F5DEB3);
            border: 3px solid var(--scroll-dark);
            border-radius: 12px;
            padding: 24px 20px 20px;
            max-width: 400px;
            width: 88%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 6px rgba(139, 69, 19, 0.25);
            text-align: center;
            animation: slideUp 0.25s ease;
            font-family: var(--font-stack);
            position: relative;
        }
        .modal-dialog::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #D2B48C, #8B4513);
            border-radius: 50%;
            border: 2px solid var(--scroll-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        .modal-dialog .modal-icon {
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
            position: relative;
            z-index: 2;
        }
        .modal-dialog .modal-message {
            color: var(--scroll-text);
            font-size: 15px;
            line-height: 1.7;
            margin: 8px 0 16px;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
            z-index: 2;
        }
        .modal-dialog .modal-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            font-family: var(--font-stack);
            border: 2px solid var(--scroll-dark);
            border-radius: 6px;
            background: #FFFEF5;
            color: var(--scroll-text);
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
            position: relative;
            z-index: 2;
        }
        .modal-dialog .modal-input:focus {
            border-color: var(--scroll-gold);
            box-shadow: 0 0 8px rgba(184, 134, 11, 0.3);
        }
        .modal-dialog .modal-textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: var(--font-stack);
            border: 2px solid var(--scroll-dark);
            border-radius: 6px;
            background: #FFFEF5;
            color: var(--scroll-text);
            margin-bottom: 16px;
            outline: none;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.2s;
            position: relative;
            z-index: 2;
        }
        .modal-dialog .modal-textarea:focus {
            border-color: var(--scroll-gold);
            box-shadow: 0 0 8px rgba(184, 134, 11, 0.3);
        }
        .modal-btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }
        .modal-btn {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            font-family: var(--font-stack);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            min-width: 80px;
        }
        .modal-btn:active {
            transform: translateY(1px);
        }
        .modal-btn-confirm {
            background: #8B4513;
            color: #f5e8c9;
            box-shadow: 0 3px 0 #5D2906;
        }
        .modal-btn-confirm:active {
            box-shadow: 0 1px 0 #5D2906;
        }
        .modal-btn-cancel {
            background: #696969;
            color: #f5e8c9;
            box-shadow: 0 3px 0 #3D3D3D;
        }
        .modal-btn-cancel:active {
            box-shadow: 0 1px 0 #3D3D3D;
        }
        .modal-btn-danger {
            background: #A52A2A;
            color: #f5e8c9;
            box-shadow: 0 3px 0 #5D1F1F;
        }
        .modal-btn-danger:active {
            box-shadow: 0 1px 0 #5D1F1F;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <h1>道主仙府</h1>
            <p class="subtitle">功德卷 · 成就图鉴</p>
            <div class="stats-row">
                <div class="stat-item">已解锁 <span class="stat-count" id="unlockedCount">0</span> / <span id="totalCount">40</span></div>
                <div class="stat-item" id="legendaryStat" style="display:none;">传说 <span class="stat-count" id="legendaryCount">0</span></div>
            </div>
        </div>

        <!-- 道主信息卡片 -->
        <div style="background: rgba(255,255,255,0.7); padding: 16px; border-left: 4px solid #8B4513; border-radius: 4px; margin-bottom: 20px;">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:8px;">
                <span>道号：</span>
                <strong id="display-daoHao">-</strong>
            </div>
            <div style="display:flex; justify-content: space-between; margin-bottom:8px;"><span>灵韵：</span><strong id="display-lingYun">-</strong></div>
            <div style="display:flex; justify-content: space-between; margin-bottom:8px;"><span>浊念：</span><strong id="display-zhuoNian">-</strong></div>
            <div style="display:flex; justify-content: space-between; margin-bottom:8px;"><span>当前节点：</span><strong id="display-storyNode">-</strong></div>
            <div class="save-time" id="lastSaveTime">上次云端同步：<strong>从未同步</strong></div>
        </div>

        <div class="btn-group">
            <button class="seal-btn red-seal" onclick="pushCloudSave()">上传云端</button>
            <button class="seal-btn red-seal" onclick="pullCloudSave()">云端下载</button>
            <button class="seal-btn gray-seal" onclick="exportAllData()">导出仙籍</button>
            <button class="seal-btn gray-seal" onclick="importAllDataPrompt()">导入仙籍</button>
            <button class="seal-btn gray-seal" onclick="logout()">重入轮回</button>
        </div>

        <!-- 兑换码区域 -->
        <div style="display: flex; justify-content: center; margin-bottom: 20px;">
            <button class="seal-btn gray-seal" onclick="redeemCode()" style="width: auto; padding: 10px 30px;">🎁 兑换码</button>
        </div>

        <!-- 特殊成就 -->
        <div id="specialSection" style="display:none;">
            <div class="section-title">✦ 特殊成就 · 天赐仙缘 ✦</div>
            <div class="achievement-list" id="specialList"></div>
        </div>

        <!-- 常规成就 -->
        <div id="unlockedSection">
            <div class="section-title" id="unlockedTitle" style="display:none;">✦ 已历劫 · 道心圆满 ✦</div>
            <div class="achievement-list" id="unlockedList"></div>
            <div class="empty-state" id="unlockedEmpty">尚无成就，去红尘走一遭吧</div>
        </div>
        <div id="lockedSection">
            <div class="section-title" id="lockedTitle">尘缘未了</div>
            <div class="achievement-list" id="lockedList"></div>
        </div>
        <div style="text-align:center; font-size:11px; color:#5D4037; margin-top:10px;">卷轴仙籍 · 万世不易</div>
    </div>

    <!-- ==================== 自定义弹窗容器 ==================== -->
    <div id="modalContainer"></div>

    <script>
        // ==================== 自定义弹窗系统 ====================
        function createModalOverlay() {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            return overlay;
        }

        function createModalDialog(icon, messageHtml, inputConfig, buttons) {
            const dialog = document.createElement('div');
            dialog.className = 'modal-dialog';

            if (icon) {
                const iconEl = document.createElement('span');
                iconEl.className = 'modal-icon';
                iconEl.textContent = icon;
                dialog.appendChild(iconEl);
            }

            const msgEl = document.createElement('div');
            msgEl.className = 'modal-message';
            msgEl.innerHTML = messageHtml;
            dialog.appendChild(msgEl);

            let inputEl = null;
            if (inputConfig) {
                if (inputConfig.type === 'textarea') {
                    inputEl = document.createElement('textarea');
                    inputEl.className = 'modal-textarea';
                    inputEl.placeholder = inputConfig.placeholder || '';
                    inputEl.value = inputConfig.defaultValue || '';
                    inputEl.rows = inputConfig.rows || 3;
                } else {
                    inputEl = document.createElement('input');
                    inputEl.type = inputConfig.type || 'text';
                    inputEl.className = 'modal-input';
                    inputEl.placeholder = inputConfig.placeholder || '';
                    inputEl.value = inputConfig.defaultValue || '';
                }
                inputEl.id = 'modalInput';
                dialog.appendChild(inputEl);
            }

            const btnRow = document.createElement('div');
            btnRow.className = 'modal-btn-row';
            buttons.forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = 'modal-btn ' + (btn.cls || 'modal-btn-confirm');
                btnEl.textContent = btn.text;
                btnEl.addEventListener('click', () => {
                    const inputValue = inputEl ? inputEl.value : null;
                    removeModal();
                    if (btn.callback) btn.callback(inputValue);
                });
                btnRow.appendChild(btnEl);
            });
            dialog.appendChild(btnRow);

            return dialog;
        }

        function removeModal() {
            const existing = document.getElementById('modalOverlay');
            if (existing) {
                existing.style.opacity = '0';
                existing.style.transition = 'opacity 0.15s ease';
                setTimeout(() => {
                    if (existing.parentNode) existing.parentNode.removeChild(existing);
                }, 150);
            }
        }

        function showModal({ icon, message, inputConfig, buttons, onBackgroundClick } = {}) {
            removeModal();
            const overlay = createModalOverlay();
            const dialog = createModalDialog(icon || '', message || '', inputConfig || null, buttons || []);
            overlay.appendChild(dialog);
            document.getElementById('modalContainer').appendChild(overlay);

            const inputEl = document.getElementById('modalInput');
            if (inputEl) {
                setTimeout(() => inputEl.focus(), 300);
            }

            if (onBackgroundClick !== false) {
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) {
                        removeModal();
                        if (onBackgroundClick && typeof onBackgroundClick === 'function') {
                            onBackgroundClick();
                        }
                    }
                });
            }
        }

        function modalAlert(message, icon = '📜') {
            return new Promise((resolve) => {
                showModal({
                    icon: icon,
                    message: message,
                    buttons: [{
                        text: '确 认',
                        cls: 'modal-btn-confirm',
                        callback: () => resolve(true)
                    }],
                    onBackgroundClick: () => resolve(true)
                });
            });
        }

        function modalPrompt(message, options = {}) {
            const {
                defaultValue = '',
                    placeholder = '',
                    icon = '✍️',
                    type = 'text',
                    textarea = false,
                    rows = 3
            } = options;
            return new Promise((resolve) => {
                showModal({
                    icon: icon,
                    message: message,
                    inputConfig: textarea ? {
                        type: 'textarea',
                        placeholder: placeholder,
                        defaultValue: defaultValue,
                        rows: rows
                    } : {
                        type: type,
                        placeholder: placeholder,
                        defaultValue: defaultValue
                    },
                    buttons: [{
                        text: '确 认',
                        cls: 'modal-btn-confirm',
                        callback: (val) => resolve(val !== null ? val : defaultValue)
                    }, {
                        text: '取 消',
                        cls: 'modal-btn-cancel',
                        callback: () => resolve(null)
                    }],
                    onBackgroundClick: () => resolve(null)
                });
            });
        }

        function modalConfirm(message, options = {}) {
            const {
                confirmText = '确 认',
                    cancelText = '取 消',
                    icon = '⚠️',
                    dangerConfirm = false
            } = options;
            return new Promise((resolve) => {
                showModal({
                    icon: icon,
                    message: message,
                    buttons: [{
                        text: confirmText,
                        cls: dangerConfirm ? 'modal-btn-danger' : 'modal-btn-confirm',
                        callback: () => resolve(true)
                    }, {
                        text: cancelText,
                        cls: 'modal-btn-cancel',
                        callback: () => resolve(false)
                    }],
                    onBackgroundClick: () => resolve(false)
                });
            });
        }

        // ==================== 配置解密 ====================
        const ENCODED_CONFIG =
            "eyJ1c2VyIjoiMjA1MTc3NTUwNSIsInBhc3MiOiJSYWNjb29uIiwiYXBwaWQiOiIxMTIxIiwiYXBpUXVlcnkiOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX2FwaV9xdWVyeS5waHAiLCJhcGlFc3RhYmxpc2giOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX2FwaV9lc3RhYmxpc2gucGhwIiwiYXBpTW9kaWZ5IjoiaHR0cHM6Ly95dWp1Ljk5a3BrLnRvcDo4MS9hcGkvZmlsZV9hcGlfbW9kaWZ5LnBocCIsImFwaUxpc3QiOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX29idGFpbl9saXN0LnBocCJ9";
        let CONFIG = null;

        function getConfig() {
            if (!CONFIG) try { CONFIG = JSON.parse(atob(ENCODED_CONFIG)); } catch (e) { return {}; }
            return CONFIG;
        }

        // ==================== 成就定义 ====================
        const achievementIcons = [
            { id: 'witness', title: '无对无错，善良依旧', icon: '✦', legendary: true },
            { id: 'sacrifice', title: '舍身成仁', icon: '†', legendary: true },
            { id: 'true', title: '本相自在', icon: '◯', legendary: false },
            { id: 'god', title: '点化成仙', icon: '☀', legendary: false },
            { id: 'mortal', title: '尘世轮回', icon: '人', legendary: false },
            { id: 'fail_scholar', title: '功亏一篑', icon: '✗', legendary: false },
            { id: 'fail_kid', title: '原形毕露', icon: '✗', legendary: false },
            { id: 'farmer', title: '山野村夫', icon: '🌾', legendary: false },
            { id: 'star', title: '文曲星耀', icon: '⭐', legendary: false },
            { id: 'demon_king', title: '妖王之路', icon: '◆', legendary: false },
            { id: 'mad', title: '执念成魔', icon: '◇', legendary: false },
            { id: 'love', title: '红尘情缘', icon: '♡', legendary: false },
            { id: 'guardian', title: '守山之人', icon: '⛰', legendary: false },
            { id: 'lost', title: '雨夜迷途', icon: '?', legendary: false },
            { id: 'severed', title: '断缘而去', icon: '—', legendary: false },
            { id: 'dawn', title: '黎明归宿', icon: '☽', legendary: false },
            { id: 'sword_friend', title: '剑影知交', icon: '⚔', legendary: false },
            { id: 'sword_master', title: '剑道传承', icon: '剑', legendary: false },

        async function loadCodesFromRemote() {
            try {
                const res = await fetch(CODES_URL);
                if (!res.ok) throw new Error('网络错误');
                const text = await res.text();
                const lines = text.split('\n');
                const newCodes = {};
                for (let line of lines) {
                    line = line.trim();
                    if (!line || line.startsWith('#')) continue;
                    const parts = line.split(':');
                    if (parts.length < 3) continue;
                    const code = parts[0].trim().toUpperCase();
                    const type = parts[1].trim();
                    const param = parts.slice(2).join(':').trim();
                    if (type === 'lingYun' || type === 'zhuoNian') {
                        const amount = parseInt(param);
                        if (!isNaN(amount)) newCodes[code] = { type, amount };
                    } else if (type === 'achievement') {
                        const titleAndNote = param.split('|');
                        const title = titleAndNote[0].trim();
                        const note = titleAndNote[1] ? titleAndNote[1].trim() : '';
                        if (title) newCodes[code] = { type, title, note };
                    }
                }
                if (Object.keys(newCodes).length === 0) {
                    console.warn('远程兑换码为空，使用默认码');
                    return false;
                }
                VALID_CODES = newCodes;
                console.log('✅ 已从远程加载兑换码', Object.keys(newCodes).length, '个');
                return true;
            } catch (e) {
                console.warn('远程兑换码加载失败，使用默认码', e);
                return false;
            }
        }

        // ---------- 渲染成就 ----------
        function renderAchievements() {
            const ach = getAchievements();
            const order = getOrder();
            const unlockedIds = Object.keys(ach).filter(id => ach[id]);
            let sorted = [];
            if (order.length) { sorted = order.filter(id => unlockedIds.includes(id));
                sorted = [...unlockedIds.filter(id => !order.includes(id)), ...sorted]; } else sorted = unlockedIds;
            const lockedAll = achievementIcons.filter(a => !unlockedIds.includes(a.id));

            const unlockedList = document.getElementById('unlockedList');
            unlockedList.innerHTML = '';
            if (sorted.length) {
                document.getElementById('unlockedTitle').style.display = 'block';
                document.getElementById('unlockedEmpty').style.display = 'none';
                sorted.forEach(id => { const item = achievementIcons.find(a => a.id === id); if (item) unlockedList.appendChild(
                        createRow(item, true)); });
            } else {
                document.getElementById('unlockedTitle').style.display = 'none';
                document.getElementById('unlockedEmpty').style.display = 'block';
            }
            const lockedList = document.getElementById('lockedList');
            lockedList.innerHTML = '';
            if (lockedAll.length) {
                document.getElementById('lockedTitle').style.display = 'block';
                lockedAll.forEach(a => lockedList.appendChild(createRow(a, false)));
            } else document.getElementById('lockedTitle').style.display = 'none';

            document.getElementById('unlockedCount').textContent = sorted.length;
            document.getElementById('totalCount').textContent = achievementIcons.length;
            const leg = sorted.filter(id => achievementIcons.find(a => a.id === id)?.legendary).length;
            const totalLeg = achievementIcons.filter(a => a.legendary).length;
            const ls = document.getElementById('legendaryStat');
            if (leg) { ls.style.display = 'inline-flex';
                document.getElementById('legendaryCount').textContent = leg + '/' + totalLeg; } else ls.style.display = 'none';

            renderSpecial();

        // ==================== 兑换码逻辑 ====================
        async function redeemCode() {
            const code = await modalPrompt('请输入兑换码：', {
                placeholder: '兑换码',
                icon: '🎁'
            });
            if (!code || !code.trim()) return;
            const trimmedCode = code.trim().toUpperCase();

            if (!VALID_CODES[trimmedCode]) {
                await modalAlert('无效的兑换码！', '❌');
                return;
            }

            const used = getUsedCodes();
            if (used.includes(trimmedCode)) {
                await modalAlert('该兑换码已被使用！', '⚠️');
                return;
            }

            const reward = VALID_CODES[trimmedCode];

            if (reward.type === 'lingYun') {
                const current = parseInt(localStorage.getItem('lingYun') || '100');
                localStorage.setItem('lingYun', current + reward.amount);
                addUsedCode(trimmedCode);
                updateUserInfo();
                await modalAlert(`兑换成功！灵韵 +${reward.amount}（当前：${current + reward.amount}）`, '✨');
            } else if (reward.type === 'zhuoNian') {
                const current = parseInt(localStorage.getItem('zhuoNian') || '0');
                localStorage.setItem('zhuoNian', current + reward.amount);
                addUsedCode(trimmedCode);
                updateUserInfo();
                await modalAlert(`兑换成功！浊念 +${reward.amount}（当前：${current + reward.amount}）`, '✨');
            } else if (reward.type === 'achievement') {
                const special = getSpecialAchievements();
                if (special.includes(reward.title)) {
                    await modalAlert('该成就已存在！', '⚠️');
                    return;
                }
                const updated = [...special, reward.title];
                saveSpecialAchievements(updated);
                const notes = getSpecialNotes();
                if (reward.note) notes[reward.title] = reward.note;
                saveSpecialNotes(notes);
                addUsedCode(trimmedCode);
                renderAchievements();
                await modalAlert(`兑换成功！获得特殊成就：${reward.title}`, '🌟');
            }
        }

            const cfg = getConfig();
            const url =
            `${cfg.apiQuery}?user=${cfg.user}&pass=${cfg.pass}&appid=${cfg.appid}&id=${cloudDocId}`;
            try {

                if (result.code == 1) {

                    const remoteAchievements = data.achievements || [];

                    return remoteAchievements.length + remoteSpecial.length;

        async function pushCloudSave() {
            if (!playerName) {
                await modalAlert('请先设置道号！', '📛');
                await promptSetPlayerName();
                if (!playerName) return;
            }

            const achievements = getAchievementTitles();
            const special = getSpecialAchievements();
            const notes = getSpecialNotes();
            const usedCodes = getUsedCodes();
            const totalLocal = achievements.length + special.length;

            if (!cloudDocId) {
                const existing = await findDocByTitle();
                if (existing) { cloudDocId = existing;
                    localStorage.setItem('cloudDocId', existing); }
            }

            if (cloudDocId) {
                const remoteCount = await getRemoteAchievementCount();
                if (remoteCount > totalLocal) {
                    const msg =
                        `⚠️ 云端有 ${remoteCount} 个成就，本地仅有 ${totalLocal} 个！\n封存会用本地数据覆盖云端，可能导致成就丢失。\n\n请输入"确认覆盖"后继续：`;
                    const input = await modalPrompt(msg, {
                        placeholder: '输入"确认覆盖"',
                        icon: '⚠️'
                    });
                    if (input !== '确认覆盖') {
                        await modalAlert('已取消上传，云端数据未受影响。', '↩️');
                        return;
                    }
                }
            }

            const saveData = {
                playerName: playerName,
                achievements: achievements,
                specialAchievements: special,
                specialNotes: notes,
                usedCodes: usedCodes,
                storyNode: localStorage.getItem('storyNode') || 'start',
                lingYun: parseInt(localStorage.getItem('lingYun') || '100'),
                zhuoNian: parseInt(localStorage.getItem('zhuoNian') || '0'),
                updateTime: Date.now()
            };
            const contentStr = JSON.stringify(saveData);
            const cfg = getConfig();
            try {
                let url, options;
                if (cloudDocId) {
                    url =
                        `${cfg.apiModify}?user=${cfg.user}&pass=${cfg.pass}&appid=${cfg.appid}&id=${cloudDocId}`;
                    options = { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `title=${encodeURIComponent(playerName)}&content=${encodeURIComponent(contentStr)}` };
                } else {
                    url = `${cfg.apiEstablish}?user=${cfg.user}&pass=${cfg.pass}&appid=${cfg.appid}`;
                    options = { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `title=${encodeURIComponent(playerName)}&content=${encodeURIComponent(contentStr)}` };
                }
                const res = await fetch(url, options);
                const result = await res.json();
                if (result.code == 1) {
                    if (!cloudDocId) {
                        let newId = result.id || result.data;
                        if (!newId) { newId = await findDocByTitle(); }
                        if (newId) { cloudDocId = newId;
                            localStorage.setItem('cloudDocId', newId); }
                    }
                    localStorage.setItem('lastCloudSaveTime', Date.now());
                    updateUserInfo();
                    await modalAlert('修为已上传至云端！' + (cloudDocId ? `（文档ID：${cloudDocId}）` : ''), '☁️');
                } else await modalAlert('上传失败：' + (result.msg || '未知'), '❌');
            } catch (e) { await modalAlert('网络错误：' + e.message, '❌'); }
        }

        async function pullCloudSave() {
            if (!playerName) {
                await modalAlert('道号为空，请先设置道号！', '📛');
                await promptSetPlayerName();
                if (!playerName) return;
            }

            if (!cloudDocId) {
                const foundId = await findDocByTitle();
                if (foundId) {
                    cloudDocId = foundId;
                    localStorage.setItem('cloudDocId', cloudDocId);
                } else {
                    const manualId = await modalPrompt('未找到云端仙籍，请手动输入文档ID：', {
                        placeholder: '文档ID',
                        icon: '🔍'
                    });
                    if (manualId && manualId.trim()) {
                        cloudDocId = manualId.trim();
                        localStorage.setItem('cloudDocId', cloudDocId);
                    } else return;
                }
            }

            const cfg = getConfig();
            const url =
            `${cfg.apiQuery}?user=${cfg.user}&pass=${cfg.pass}&appid=${cfg.appid}&id=${cloudDocId}`;
            try {
                const res = await fetch(url);
                const result = await res.json();
                if (result.code == 1) {
                    let data;
                    try { data = JSON.parse(result.content); } catch (e) { await modalAlert('云端数据损坏！', '❌');
                        return; }
                    const titles = data.achievements || [];
                    const achObj = {};
                    const notFound = [];
                    titles.forEach(title => {
                        const found = achievementIcons.find(a => a.title === title);
                        if (found) achObj[found.id] = true;
                        else notFound.push(title);
                    });
                    saveAchievements(achObj);
                    if (data.specialAchievements) saveSpecialAchievements(data.specialAchievements);
                    if (data.specialNotes) saveSpecialNotes(data.specialNotes);
                    if (data.usedCodes) {
                        cachedUsedCodes = data.usedCodes;
                        localStorage.setItem(USED_CODES_KEY, JSON.stringify(data.usedCodes));
                    }
                    if (data.storyNode) localStorage.setItem('storyNode', data.storyNode);
                    if (data.lingYun !== undefined) localStorage.setItem('lingYun', data.lingYun);
                    if (data.zhuoNian !== undefined) localStorage.setItem('zhuoNian', data.zhuoNian);
                    if (data.playerName) setPlayerName(data.playerName);
                    localStorage.setItem('lastCloudSaveTime', Date.now());
                    renderAchievements();
                    updateUserInfo();
                    let msg = '仙缘已接续！';
                    if (notFound.length) msg +=
                        `\n⚠️ ${notFound.length} 个成就标题未识别：${notFound.join('、')}`;
                    await modalAlert(msg, '☁️');
                } else await modalAlert('下载失败：' + (result.msg || '未知错误'), '❌');
            } catch (e) { await modalAlert('网络错误：' + e.message, '❌'); }
        }

        async function importAllDataPrompt() {

                placeholder: '粘贴仙籍备份内容',
                textarea: true,
                rows: 5,
                icon: '📥'

            let json;
            try { json = decodeURIComponent(escape(atob(input))); } catch { json = input; }

                const data = JSON.parse(json);
                if (data.achievements) { const merged = { ...getAchievements(), ...data.achievements };
                    saveAchievements(merged); }
                if (data.order) saveOrder(data.order);
                if (data.specialAchievements) saveSpecialAchievements(data.specialAchievements);
                if (data.specialNotes) saveSpecialNotes(data.specialNotes);
                if (data.usedCodes) {
                    cachedUsedCodes = data.usedCodes;
                    localStorage.setItem(USED_CODES_KEY, JSON.stringify(data.usedCodes));
                }
                if (data.playerName) setPlayerName(data.playerName);
                if (data.storyNode) localStorage.setItem('storyNode', data.storyNode);
                if (data.lingYun) localStorage.setItem('lingYun', data.lingYun);
                if (data.zhuoNian) localStorage.setItem('zhuoNian', data.zhuoNian);

        async function logout() {
            const confirmed = await modalConfirm('确定重入轮回？此操作将清除所有本地数据！', {
                confirmText: '确 定',
                cancelText: '取 消',
                icon: '🔥',
                dangerConfirm: true
            });
            if (confirmed) {
                localStorage.clear();
                location.reload();
            }
        }

        // ==================== 初始化 ====================
        window.addEventListener('load', async () => {
            const loaded = await loadCodesFromRemote();
            if (!loaded) VALID_CODES = DEFAULT_CODES;

            const params = new URLSearchParams(location.search);
            playerName = params.get('player') || localStorage.getItem('playerName') || '';
            cloudDocId = params.get('docId') || localStorage.getItem('cloudDocId') || '';
            if (!playerName) {
                try { if (window.parent && window.parent !== window) { playerName = window.parent.localStorage.getItem(
                            'playerName') || '';
                        cloudDocId = cloudDocId || window.parent.localStorage.getItem('cloudDocId') || ''; } } catch (
                e) {}
            }
            if (playerName) localStorage.setItem('playerName', playerName);
            if (cloudDocId) localStorage.setItem('cloudDocId', cloudDocId);
            updateUserInfo();
            renderAchievements();
            if (!playerName) setTimeout(() => { if (!playerName) promptSetPlayerName(); }, 800);
            document.getElementById('editPlayerName').addEventListener('click', promptSetPlayerName);
        });
    </script>
</body>
</html>
