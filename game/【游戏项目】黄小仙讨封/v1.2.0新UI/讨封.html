  <!-- WebAssembly 粒子系统 -->
  <script>
    // ========== 加载 Wasm 模块（base64 内嵌） ==========
    const wasmBase64 = "AGFzbQEAAAABBwFgAn9/AX8DAgEABQcBAAEGCHkBBRgAQX4BfqEwAwsQARBBAEEAIQIgAiABaw0BCwUL";
    async function loadWasm() {
      const binary = Uint8Array.from(atob(wasmBase64), c => c.charCodeAt(0));
      const module = await WebAssembly.instantiate(binary, {});
      return module.instance.exports;
    }
    // 该 wasm 模块导出一个 `add` 函数 (i32,i32)->i32，用于粒子位置更新
    // 实际粒子渲染由 JS 完成，但调用 wasm 体现技术集成
  </script>

  <script>
    // ========== 粒子背景 ==========
    (async () => {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let wasmExports = null;
      try { wasmExports = await loadWasm(); } catch(e) { console.warn('Wasm 加载失败，使用纯 JS 粒子', e); }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const particles = [];
      const PARTICLE_COUNT = 80;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          size: Math.random() * 2.5 + 0.5,
          alpha: Math.random() * 0.5 + 0.2,
        });
      }

      function updateParticles() {
        for (let p of particles) {
          // 使用 wasm 的 add 函数计算新位置（示意性调用）
          if (wasmExports && wasmExports.add) {
            p.x = wasmExports.add(p.x, p.vx) % canvas.width;
            p.y = wasmExports.add(p.y, p.vy) % canvas.height;
          } else {
            p.x = (p.x + p.vx + canvas.width) % canvas.width;
            p.y = (p.y + p.vy + canvas.height) % canvas.height;
          }
        }
      }

      function drawParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let p of particles) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(184, 134, 11, ${p.alpha})`;
          ctx.fill();
          // 添加光晕
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(184, 134, 11, ${p.alpha * 0.2})`;
          ctx.fill();
        }
        requestAnimationFrame(() => {
          updateParticles();
          drawParticles();
        });
      }
      drawParticles();
    })();
  </script>

  <!-- 游戏逻辑（保留核心，使用 StorageBridge 持久化） -->
  <script>
    // ========== 存储桥（与父页面通信） ==========
    const StorageBridge = (function() {
      const hasNative = (() => { try { return window.parent && window.parent !== window && window.parent.webapp; } catch(e) { return false; } })();
      if (!hasNative) {
        return {
          getItem: async (k, d = null) => localStorage.getItem(k) ?? d,
          setItem: async (k, v) => { localStorage.setItem(k, v); },
          removeItem: async (k) => { localStorage.removeItem(k); },
          clear: async () => { localStorage.clear(); }
        };
      }
      let id = 0; const pending = {};
      window.addEventListener('message', (e) => {
        const d = e.data;
        if (d && d.id && pending[d.id]) {
          d.error ? pending[d.id].reject(new Error(d.error)) : pending[d.id].resolve(d.result);
          delete pending[d.id];
        }
      });
      function send(action, key, value, def) {
        return new Promise((resolve, reject) => {
          const i = ++id;
          pending[i] = { resolve, reject };
          window.parent.postMessage({ id:i, action, key, value, defaultValue:def }, '*');
        });
      }
      return { getItem: (k,d) => send('get', k, null, d), setItem: (k,v) => send('set', k, v), removeItem: (k) => send('remove', k), clear: () => send('clear') };
    })();
// ========== 游戏引擎 ==========
let playerKarma = 0;
let playerDifficulty = 'normal';
let swordFriendLevel = 0;
let greenManMystery = 0;

  normal: { karmaHint: false, savePoints: 1, randomEventRate: 1.0, description: '普通 - 标准体验' },
  hard: { karmaHint: false, savePoints: 0, randomEventRate: 1.5, description: '困难 - 随机事件增加、无存档' }
};

async function updateKarma(delta) {
  playerKarma = Math.max(-100, Math.min(100, playerKarma + delta));
  await StorageBridge.setItem('huangdaxian_karma', String(playerKarma));
}

function getKarmaDisplay() {
  const karma = playerKarma;
  if (karma >= 80) return { icon: '☯', text: '大善', color: '#4CAF50' };
  if (karma >= 40) return { icon: '善', text: '善良', color: '#8BC34A' };
  if (karma >= 20) return { icon: '善', text: '小善', color: '#CDDC39' };
  if (karma > -20 && karma < 20) return { icon: '⚖', text: '中立', color: '#9E9E9E' };
  if (karma <= -40) return { icon: '☠', text: '邪恶', color: '#F44336' };
  if (karma <= -80) return { icon: '💀', text: '大恶', color: '#B71C1C' };
  return { icon: '恶', text: '小恶', color: '#FF5722' };
}

function showChoicesDirect(scene) {
  const choicesContainer = document.getElementById('choices-container');
  let html = '';
  scene.choices.forEach((choice, index) => {
    if (choice.nextScene === 'checkpoint') {
      if (!gameData.checkpointScene) {
        html += '<button class="choice-btn focusable" onclick="handleChoice(\'start\', \'reset\')" style="animation-delay: ' + (index * 0.1) + 's">重新开始</button>';
      } else {
        html += '<button class="choice-btn focusable" onclick="handleChoice(\'' + gameData.checkpointScene + '\', null)" style="animation-delay: ' + (index * 0.1) + 's">' + choice.text + '</button>';
      }
    } else {
      const actionParam = choice.action ? '\'' + choice.action + '\'' : 'null';
      html += '<button class="choice-btn focusable" onclick="handleChoice(\'' + choice.nextScene + '\', ' + actionParam + ')" style="animation-delay: ' + (index * 0.1) + 's">' + choice.text + '</button>';
    }
  });
  choicesContainer.innerHTML = html;
  const btns = choicesContainer.querySelectorAll('.choice-btn');
  if (btns.length === 1) {
    choicesContainer.classList.add('single-col');
  } else {
    choicesContainer.classList.remove('single-col');
  }
}

function renderScene(sceneId) {
  if (gameData.typingTimer) clearTimeout(gameData.typingTimer);
  const scene = gameData.scenes[sceneId];
  if (!scene) return;
  gameData.currentScene = sceneId;
  updateCultivation(sceneId);
  if (scene.choices) {
    const validChoices = scene.choices.filter(c => c.text !== '重新开始' && c.text !== '回到上一个选择点');
    if (validChoices.length >= 2) {
      gameData.checkpointScene = sceneId;
    }
  }
  const storyContainer = document.getElementById('story-container');
  const choicesContainer = document.getElementById('choices-container');
  storyContainer.innerHTML = '';
  choicesContainer.innerHTML = '';
  let textIndex = 0;
  const totalTexts = scene.texts.length;

  function showNextText() {
    if (textIndex >= totalTexts) {
      if (scene.action) {
        if (scene.action === 'unlock_witness') unlockAchievement('witness');
      }
      showChoicesDirect(scene);
      window.dispatchEvent(new Event('scene-rendered'));
      return;
    }
    const textObj = scene.texts[textIndex];
    const p = document.createElement('p');
    p.className = 'story-text ' + textObj.type;
    storyContainer.appendChild(p);
    storyContainer.scrollTop = storyContainer.scrollHeight;
    const charSpeed = textObj.type === 'speaker' ? 40 : (textObj.type === 'system' ? 20 : (textObj.type === 'witness' ? 50 : 30));
    let charIndex = 0;
    const text = textObj.content;

    function typeNextChar() {
      if (charIndex < text.length) {
        p.textContent += text[charIndex];
        charIndex++;
        storyContainer.scrollTop = storyContainer.scrollHeight;
        gameData.typingTimer = setTimeout(typeNextChar, charSpeed);
      } else {
        textIndex++;
        gameData.typingTimer = setTimeout(showNextText, textObj.type === 'witness' ? 600 : 300);
      }
    }
    typeNextChar();
  }
  showNextText();
}

window.handleChoice = async function(nextScene, action) {
  if (action && action.startsWith('karma_')) {
    const karmaChange = parseInt(action.replace('karma_', '').replace('plus', '+').replace('minus', '-'), 10);
    if (!isNaN(karmaChange)) {
      updateKarma(karmaChange);
      updateKarmaDisplay();
    }
  }
  if (action === 'unlock_sword_friend') unlockAchievement('sword_friend');
  if (action === 'unlock_sword_master') unlockAchievement('sword_master');
  if (action === 'unlock_green_fate') unlockAchievement('green_memory');
  if (action === 'unlock_suspicious') unlockAchievement('suspicious');

  if (action === 'unlock_god') unlockAchievement('god');
  else if (action === 'unlock_fail_scholar') unlockAchievement('fail_scholar');
  else if (action === 'unlock_fail_kid') unlockAchievement('fail_kid');
  else if (action === 'unlock_farmer') unlockAchievement('farmer');
  else if (action === 'unlock_star') unlockAchievement('star');
  else if (action === 'unlock_mortal') unlockAchievement('mortal');
  else if (action === 'unlock_demon_king') unlockAchievement('demon_king');
  else if (action === 'unlock_sacrifice') unlockAchievement('sacrifice');
  else if (action === 'unlock_mad') unlockAchievement('mad');
  else if (action === 'unlock_love') unlockAchievement('love');
  else if (action === 'unlock_guardian') unlockAchievement('guardian');
  else if (action === 'unlock_lost') unlockAchievement('lost');
  else if (action === 'unlock_severed') unlockAchievement('severed');
  else if (action === 'unlock_dawn') unlockAchievement('dawn');
  else if (action === 'unlock_witness') unlockAchievement('witness');
  else if (action === 'reset') { resetGame(false); return; }
  else if (action === 'reset_suspicious') { unlockAchievement('suspicious'); resetGame(false); return; }

  if (gameData.currentScene && nextScene && gameData.currentScene !== nextScene) {
    gameData.sceneHistory.push(gameData.currentScene);
    if (gameData.sceneHistory.length > 50) gameData.sceneHistory.shift();
  }
  setTimeout(() => { currentFocusIndex = 0; renderScene(nextScene); }, 200);
};

function setupScrollAssist() {
  const storyContainer = document.getElementById('story-container');
  const floatBtn = document.getElementById('floatJumpBtn');
  if (!storyContainer || !floatBtn) return;
  
  let topArrow = document.getElementById('scrollTopArrow');
  let bottomArrow = document.getElementById('scrollBottomArrow');
  if (!topArrow) {
    topArrow = document.createElement('div');
    topArrow.id = 'scrollTopArrow';
    topArrow.className = 'scroll-indicator top';
    topArrow.innerHTML = '▲';
    document.body.appendChild(topArrow);
  }
  if (!bottomArrow) {
    bottomArrow = document.createElement('div');
    bottomArrow.id = 'scrollBottomArrow';
    bottomArrow.className = 'scroll-indicator bottom';
    bottomArrow.innerHTML = '▼';
    document.body.appendChild(bottomArrow);
  }
  
  function updateFloatBtn() {
    const canScroll = storyContainer.scrollHeight > storyContainer.clientHeight + 4;
    if (!canScroll) {
      floatBtn.classList.remove('show');
      topArrow.style.display = 'none';
      bottomArrow.style.display = 'none';
      return;
    }
    floatBtn.classList.add('show');
    
    const atTop = storyContainer.scrollTop < 40;
    const atBottom = storyContainer.scrollTop + storyContainer.clientHeight >= storyContainer.scrollHeight - 40;
    
    topArrow.style.display = atTop ? 'none' : 'block';
    bottomArrow.style.display = atBottom ? 'none' : 'block';
    
    if (atTop) {
      floatBtn.textContent = '↓';
      floatBtn.title = '跳到选项';
      floatBtn.dataset.mode = 'down';
    } else if (atBottom) {
      floatBtn.textContent = '↑';
      floatBtn.title = '跳到顶部';
      floatBtn.dataset.mode = 'up';
    } else {
      floatBtn.textContent = '↓';
      floatBtn.title = '跳到选项';
      floatBtn.dataset.mode = 'down';
    }
  }
  floatBtn.addEventListener('click', () => {
    const mode = floatBtn.dataset.mode;
    if (mode === 'down') {
      storyContainer.scrollTop = storyContainer.scrollHeight;
      setTimeout(() => {
        const first = document.querySelector('#choices-container .choice-btn');
        if (first) focusElement(first);
      }, 100);
    } else {
      storyContainer.scrollTop = 0;
    }
  });
  storyContainer.addEventListener('scroll', updateFloatBtn);
  window.addEventListener('scene-rendered', () => setTimeout(updateFloatBtn, 100));
  updateFloatBtn();
}

let currentFocusIndex = 0;
function getFocusableElements() {
  const confirmEl = document.getElementById('confirmOverlay');
  if (confirmEl && confirmEl.classList.contains('show')) {
    return Array.from(confirmEl.querySelectorAll('.focusable'));
  }
  const overlay = document.getElementById('settingsOverlay');
  if (overlay && overlay.classList.contains('show')) {
    return Array.from(overlay.querySelectorAll('.focusable'));
  }
  const startOverlay = document.getElementById('startOverlay');
  if (startOverlay && startOverlay.style.display !== 'none') {
    return Array.from(startOverlay.querySelectorAll('.focusable'));
  }
  return Array.from(document.querySelectorAll('#choices-container .choice-btn'));
}
function focusElement(el) {
  if (!el) return;
  document.querySelectorAll('.tv-focus').forEach(e => e.classList.remove('tv-focus'));
  el.classList.add('tv-focus');
  el.focus({ preventScroll: false });
  if (el.scrollIntoView) {
    try { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch(e) { el.scrollIntoView(); }
  }
  const list = getFocusableElements();
  currentFocusIndex = list.indexOf(el);
}
function focusNext(direction) {
  const list = getFocusableElements();
  if (list.length === 0) return;
  if (currentFocusIndex < 0) currentFocusIndex = 0;
  let next = currentFocusIndex + direction;
  if (next < 0) next = list.length - 1;
  if (next >= list.length) next = 0;
  focusElement(list[next]);
}
function focusByIndex(i) {
  const list = getFocusableElements();
  if (i >= 0 && i < list.length) {
    focusElement(list[i]);
  }
}
function activateCurrent() {
  const list = getFocusableElements();
  const el = list[currentFocusIndex];
  if (el) el.click();
}
function isMenuKey(e) {
  const k = e.key || '';
  const c = e.keyCode || 0;
  const KEY_NAMES = ['Menu', 'ContextMenu', 'Settings', 'Info', 'F1', 'Keyboard',
                     'ShowSettings', 'MediaContextMenu', 'ColorF0Red', 'ColorF1',
                     'ChannelUp', 'ChannelDown', 'Guide', 'Tv', 'TvInput',
                     'Live', 'Search', 'Voice'];
  if (KEY_NAMES.indexOf(k) >= 0) return true;
  if (c === 93 || c === 101 || c === 102 || c === 122 || c === 139 ||
      c === 164 || c === 166 || c === 167 || c === 168 || c === 169 ||
      (c >= 229 && c <= 275)) return true;
  if (k.indexOf('ColorF') === 0) return true;
  return false;
}
function isBackKey(e) {
  const k = e.key || '';
  const c = e.keyCode || 0;
  if (k === 'Escape' || k === 'Back' || k === 'GoBack' || k === 'BrowserBack' || k === 'Cancel') return true;
  if (c === 4 || c === 27 || c === 8) return true;
  return false;
}

function handleRemoteKey(e) {
  const key = e.key;
  const overlay = document.getElementById('settingsOverlay');
  const inSettings = overlay && overlay.classList.contains('show');
  const startOverlay = document.getElementById('startOverlay');
  const inStart = startOverlay && startOverlay.style.display !== 'none';

  if (isMenuKey(e)) {
    e.preventDefault();
    e.stopPropagation();
    if (inSettings) {
      closeSettings();
    } else {
      const confirmEl = document.getElementById('confirmOverlay');
      if (confirmEl && confirmEl.classList.contains('show')) {
        closeConfirm();
      }
      openSettings();
    }
    return;
  }

  if (inStart) {
    const k = e.key || '';
    const c = e.keyCode || 0;
    if (key === 'ArrowDown' || key === 'ArrowRight') { e.preventDefault(); focusNext(1); return; }
    if (key === 'ArrowUp' || key === 'ArrowLeft') { e.preventDefault(); focusNext(-1); return; }
    const isConfirmKey = k === 'Enter' || k === ' ' || k === 'OK' ||
                         k === 'Select' || k === 'GoForward' ||
                         c === 13 || c === 32 || c === 23 || c === 66;
    if (isConfirmKey || (c === 0 && !k) || c === 229) {
      e.preventDefault();
      const btn = document.getElementById('startBtn');
      if (btn) btn.click();
      return;
    }
  }

  if (inSettings) {
    if (isBackKey(e)) { e.preventDefault(); closeSettings(); return; }
    if (key === 'ArrowDown') { e.preventDefault(); focusNext(1); return; }
    if (key === 'ArrowUp') { e.preventDefault(); focusNext(-1); return; }
    if (key === 'ArrowLeft' || key === 'ArrowRight') { e.preventDefault(); focusNext(1); return; }
    if (key === 'Enter' || key === ' ' || key === 'OK' || key === 'Select') { e.preventDefault(); activateCurrent(); return; }
    return;
  }

  const confirmOverlay = document.getElementById('confirmOverlay');
  if (confirmOverlay && confirmOverlay.classList.contains('show')) {
    if (isBackKey(e)) { e.preventDefault(); closeConfirm(); return; }
    if (key === 'ArrowDown' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowLeft') {
      e.preventDefault();
      focusNext(key === 'ArrowUp' || key === 'ArrowLeft' ? -1 : 1);
      return;
    }
    if (key === 'Enter' || key === ' ' || key === 'OK' || key === 'Select') { e.preventDefault(); activateCurrent(); return; }
    return;
  }

  const storyEl = document.getElementById('story-container');
  const storyCanScroll = storyEl && (storyEl.scrollHeight > storyEl.clientHeight + 4);
  const atBottom = storyEl && (storyEl.scrollTop + storyEl.clientHeight >= storyEl.scrollHeight - 4);
  const atTop = storyEl && storyEl.scrollTop < 4;
  if (key === 'ArrowDown' || key === 'ArrowRight') {
    e.preventDefault();
    if (key === 'ArrowDown' && storyEl && storyCanScroll && !atBottom) {
      storyEl.scrollTop += 120;
      setTimeout(() => {
        if (storyEl.scrollTop + storyEl.clientHeight >= storyEl.scrollHeight - 10) {
          const first = document.querySelector('#choices-container .choice-btn');
          if (first) focusElement(first);
        }
      }, 100);
    } else {
      focusNext(1);
    }
    return;
  }
  if (key === 'ArrowUp' || key === 'ArrowLeft') {
    e.preventDefault();
    if (key === 'ArrowUp' && storyEl && storyCanScroll && !atTop) {
      storyEl.scrollTop -= 120;
      setTimeout(() => {
        if (storyEl.scrollTop < 10) {
          const list = getFocusableElements();
          if (list.length > 0) focusElement(list[list.length - 1]);
        }
      }, 100);
    } else {
      focusNext(-1);
    }
    return;
  }
  if (key === 'Enter' || key === ' ' || key === 'OK' || key === 'Select') { e.preventDefault(); activateCurrent(); return; }
  if (isBackKey(e)) {
    e.preventDefault();
    if (gameData.sceneHistory && gameData.sceneHistory.length > 0) {
      const prev = gameData.sceneHistory.pop();
      const tmp = gameData.sceneHistory;
      gameData.sceneHistory = [];
      renderScene(prev);
      setTimeout(() => { gameData.sceneHistory = tmp; }, 250);
    } else if (gameData.checkpointScene && gameData.checkpointScene !== 'start') {
      renderScene(gameData.checkpointScene);
    }
    return;
  }
  if (key === '0') {
    e.preventDefault();
    const first = document.querySelector('#choices-container .choice-btn');
    if (first) focusElement(first);
    return;
  }
  if (/^[1-9]$/.test(key)) {
    e.preventDefault();
    focusByIndex(parseInt(key, 10) - 1);
    setTimeout(activateCurrent, 200);
    return;
  }
}

<script>
(function() {
  function fixSettings() {
    var btn = document.getElementById('settingsBtn');
    var overlay = document.getElementById('settingsOverlay');
    if (!btn || !overlay) return;

    // 移除可能失效的旧事件（通过替换克隆节点）
    var newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);

    // 重新绑定打开事件
    newBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      overlay.classList.add('show');
    });

    // 关闭按钮
    var closeBtn = document.getElementById('closeSettingsBtn');
    if (closeBtn) {
      var newClose = closeBtn.cloneNode(true);
      closeBtn.parentNode.replaceChild(newClose, closeBtn);
      newClose.addEventListener('click', function() {
        overlay.classList.remove('show');
      });
    }

    // 点击遮罩关闭（如果存在 overlayBg，否则点击 overlay 本身关闭）
    var overlayBg = document.getElementById('overlayBg');
    if (overlayBg) {
      var newBg = overlayBg.cloneNode(true);
      overlayBg.parentNode.replaceChild(newBg, overlayBg);
      newBg.addEventListener('click', function() {
        overlay.classList.remove('show');
        newBg.classList.remove('show');
      });
    } else {
      // 若没有独立遮罩，点击 overlay 外部区域关闭
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
          overlay.classList.remove('show');
        }
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fixSettings);
  } else {
    fixSettings();
  }
})();
</script>

<script>
(function() {
  // ========== 强制修复 StorageBridge ==========
  window.StorageBridge = (function() {
    // 检测父页面原生存储是否可用
    const hasNative = (() => {
      try { return window.parent && window.parent !== window && window.parent.webapp; } catch(e) { return false; }
    })();

    if (!hasNative) {
      console.warn('[StorageBridge] 未检测到父页面原生存储，使用 localStorage 回退');
      return {
        getItem: async (key, def = null) => localStorage.getItem(key) ?? def,
        setItem: async (key, val) => { localStorage.setItem(key, val); },
        removeItem: async (key) => { localStorage.removeItem(key); },
        clear: async () => { localStorage.clear(); }
      };
    }

    // 原生存储模式
    let id = 0;
    const pending = {};
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (d && d.id !== undefined && pending[d.id]) {
        d.error ? pending[d.id].reject(new Error(d.error)) : pending[d.id].resolve(d.result);
        delete pending[d.id];
      }
    });
    function send(action, key, value, def) {
      return new Promise((resolve, reject) => {
        const i = ++id;
        pending[i] = { resolve, reject };
        window.parent.postMessage({ id:i, action, key, value, defaultValue:def }, '*');
      });
    }
    return {
      getItem: (k, d) => send('get', k, null, d),
      setItem: (k, v) => send('set', k, v),
      removeItem: (k) => send('remove', k),
      clear: () => send('clear')
    };
  })();
