<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, interactive-widget=resizes-content, viewport-fit=cover">
    <title>黄小仙 · 讨封之卷</title>
    <meta name="theme-color" content="#5D4037">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --scroll-bg: #F5DEB3;
            --scroll-dark: #8B4513;
            --scroll-gold: #B8860B;
            --scroll-text: #3E2723;
            --scroll-light: #FFF8DC;
            --accent-color: #A93226;
        }
        body {
            background-color: var(--scroll-bg);
            color: var(--scroll-text);
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            line-height: 1.8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139,69,19,0.03) 2px, rgba(139,69,19,0.03) 4px),
                radial-gradient(ellipse at 50% 0%, rgba(210,180,140,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(210,180,140,0.1) 0%, transparent 60%);
        }
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .game-container {
            max-width: 600px; width: 100%; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            position: relative; z-index: 1; border-left: 6px solid var(--scroll-dark); border-right: 6px solid var(--scroll-dark);
            background: rgba(255,248,220,0.6); box-shadow: 0 0 30px rgba(0,0,0,0.2);
        }
        .game-container::before, .game-container::after {
            content: ""; position: absolute; top: 0; bottom: 0; width: 12px;
            background: linear-gradient(to bottom, var(--scroll-dark), #A0522D, var(--scroll-dark));
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.3), inset -2px 0 5px rgba(0,0,0,0.2); z-index: -1; pointer-events: none;
        }
        .game-container::before { left: -6px; border-radius: 4px 0 0 4px; }
        .game-container::after { right: -6px; border-radius: 0 4px 4px 0; }
        .status-bar {
            flex-shrink: 0; z-index: 100; background: linear-gradient(to bottom, rgba(245,222,179,0.95) 75%, rgba(240,220,170,0.8) 92%, transparent);
            padding: 12px 20px 10px; border-bottom: 1px solid var(--scroll-dark);
        }
        .cultivation { font-size: 14px; color: #5D4037; }
        .cultivation span { color: var(--scroll-gold); font-weight: bold; }
        .karma-display { display: flex; gap: 12px; font-size: 12px; }
        .karma-lingyun { color: #2E7D32; }
        .karma-zhuonian { color: #C62828; }
        .env-bar { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; font-size: 12px; color: #5D4037; }
        .env-item { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; background: rgba(139,69,19,0.1); border-radius: 10px; border: 1px solid rgba(139,69,19,0.2); }
        .env-item .env-icon { font-size: 14px; }
        .env-item .env-label { color: #8B4513; font-weight: bold; }
        .env-item.moon .env-icon { color: var(--scroll-gold); }
        .env-effect { width: 100%; font-size: 11px; color: #A0522D; font-style: italic; margin-top: 2px; }
        .story-container {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 20px;
            scrollbar-width: thin; scrollbar-color: var(--scroll-dark) rgba(245,222,179,0.5);
        }
        .story-container::-webkit-scrollbar { width: 6px; }
        .story-container::-webkit-scrollbar-track { background: rgba(245,222,179,0.5); }
        .story-container::-webkit-scrollbar-thumb { background: var(--scroll-dark); border-radius: 3px; }
        .choices-container {
            flex-shrink: 0; z-index: 100; background: linear-gradient(to top, rgba(245,222,179,0.95) 75%, rgba(240,220,170,0.8) 92%, transparent);
            padding: 14px 20px 10px; border-top: 1px solid var(--scroll-dark); display: flex; flex-wrap: wrap;
        }
        .choices-container .choice-btn { width: calc(50% - 6px); margin-bottom: 12px; }
        .choices-container .choice-btn:nth-child(odd) { margin-right: 12px; }
        .choices-container.single-col .choice-btn { width: 100%; margin-right: 0; }
        .story-text { font-size: 17px; margin-bottom: 15px; opacity: 0; animation: fadeIn 0.8s ease forwards; }
        .story-text.narrator { color: #4E342E; font-style: italic; }
        .story-text.speaker { color: #3E2723; font-weight: bold; }
        .story-text.system { color: var(--accent-color); text-align: center; padding: 20px 0; border-top: 1px solid var(--scroll-dark); border-bottom: 1px solid var(--scroll-dark); margin: 20px 0; }
        .story-text.witness { color: var(--scroll-gold); font-weight: bold; text-align: center; letter-spacing: 1px; padding: 10px 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .choice-btn, .start-btn, .settings-btn-action {
            background: linear-gradient(180deg, #D2B48C 0%, #A0522D 100%); border: 2px solid var(--scroll-dark);
            color: var(--scroll-light); text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3), inset 2px 2px 4px rgba(255,255,255,0.2), inset -2px -2px 4px rgba(0,0,0,0.3);
            border-radius: 6px; font-family: inherit; letter-spacing: 2px; font-weight: bold;
            padding: 15px 20px; font-size: 15px; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .choice-btn::after, .start-btn::after {
            content: ""; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px dashed rgba(255,255,255,0.3); border-radius: 4px; pointer-events: none;
        }
        .choice-btn:hover, .start-btn:hover { background: linear-gradient(180deg, #E0C090 0%, #B06030 100%); transform: translateY(-3px); box-shadow: 5px 5px 0 rgba(0,0,0,0.4), inset 2px 2px 6px rgba(255,255,255,0.3), inset -2px -2px 6px rgba(0,0,0,0.4); }
        .choice-btn:active, .start-btn:active { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.3), inset 2px 2px 6px rgba(0,0,0,0.4); }
        .footer { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 8px 20px; font-size: 12px; color: #5D4037; background: rgba(245,222,179,0.9); border-top: 1px solid var(--scroll-dark); }
        .start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #B0B0B0; transition: opacity 0.3s; }
        .start-content { text-align: center; max-width: 80%; }
        .start-content h1 { font-family: 'Ma Shan Zheng', 'KaiTi', serif; color: var(--scroll-gold); font-size: 56px; margin-bottom: 16px; text-shadow: 2px 2px 0 var(--scroll-dark); letter-spacing: 8px; }
        .start-subtitle { font-size: 18px; margin-bottom: 48px; color: #5D4037; font-style: italic; letter-spacing: 2px; }
        .settings-btn { position: fixed; top: 12px; right: 12px; width: 40px; height: 40px; background: linear-gradient(180deg, #D2B48C, #A0522D); border: 2px solid var(--scroll-dark); color: var(--scroll-light); border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 1500; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
        .settings-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; display: none; justify-content: center; align-items: center; }
        .settings-overlay.show { display: flex; }
        .settings-modal { background: #F5DEB3; border: 2px solid var(--scroll-dark); border-radius: 8px; padding: 28px; max-width: 360px; width: 90%; color: #3E2723; }
        .settings-modal h3 { color: var(--scroll-gold); text-align: center; border-bottom: 1px solid var(--scroll-dark); padding-bottom: 10px; margin-bottom: 18px; }
        .settings-item { margin-bottom: 12px; }
        .settings-item .label { color: #5D4037; font-size: 13px; display: block; margin-bottom: 6px; }
        .settings-row { display: flex; gap: 10px; margin-top: 20px; }
        .settings-btn-action { flex: 1; padding: 12px 16px; font-size: 14px; }
        .settings-btn-action.danger { border-color: #A93226; color: #FFD2D2; background: linear-gradient(180deg, #8B4513, #5D4037); }
        .toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%) translateY(40px); background: #3E2723; border: 2px solid var(--scroll-gold); color: #FFE4B5; padding: 12px 24px; border-radius: 5px; font-size: 14px; z-index: 5000; opacity: 0; transition: all 0.3s; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .confirm-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 4000; display: none; justify-content: center; align-items: center; }
        .confirm-overlay.show { display: flex; }
        .confirm-modal { background: #F5DEB3; border: 2px solid #A93226; border-radius: 8px; padding: 24px 28px; max-width: 320px; width: 90%; color: #3E2723; }
        .confirm-modal h4 { color: #A93226; margin-bottom: 12px; }
        .confirm-row { display: flex; gap: 10px; }
        .float-jump-btn { position: fixed; right: 16px; bottom: 80px; z-index: 90; width: 44px; height: 44px; border-radius: 50%; background: rgba(26,21,16,0.85); border: 2px solid var(--scroll-gold); color: var(--scroll-gold); font-size: 20px; cursor: pointer; display: none; align-items: center; justify-content: center; }
        .float-jump-btn.show { display: flex; }
        .tv-focus { outline: 3px solid #FFD700 !important; outline-offset: 2px; box-shadow: 0 0 20px rgba(255,215,0,0.5) !important; }
        .achievement-popup { position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%) translateY(80px); background: #2C1810; border: 2px solid var(--scroll-gold); color: #FFE4B5; padding: 14px 28px; border-radius: 8px; font-size: 15px; z-index: 6000; opacity: 0; transition: all 0.4s ease; pointer-events: none; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.6); max-width: 85%; }
        .achievement-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .achievement-popup.golden { border-color: #FFD700; background: #3D2B1F; box-shadow: 0 0 40px rgba(255,215,0,0.3); }
        .achievement-popup .title { font-weight: bold; font-size: 17px; }
        .achievement-popup .icon { font-size: 24px; margin-right: 10px; }
        .version-btn { background: none; border: none; color: #5D4037; cursor: pointer; font-family: inherit; font-size: 12px; padding: 2px 6px; border-radius: 3px; transition: background 0.2s; }
        .version-btn:hover { background: rgba(139,69,19,0.15); }
        .changelog-popup { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px); background: #F5DEB3; border: 2px solid var(--scroll-dark); border-radius: 8px; padding: 16px 24px; max-width: 340px; width: 90%; z-index: 7000; opacity: 0; pointer-events: none; transition: all 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.4); color: #3E2723; font-size: 13px; max-height: 50vh; overflow-y: auto; }
        .changelog-popup.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .changelog-popup h4 { color: var(--scroll-gold); margin-bottom: 8px; text-align: center; border-bottom: 1px solid var(--scroll-dark); padding-bottom: 6px; }
        .changelog-popup ul { padding-left: 18px; margin: 6px 0; }
        .changelog-popup li { margin-bottom: 4px; }
        .changelog-popup .close-changelog { display: block; margin: 10px auto 0; background: var(--scroll-dark); color: var(--scroll-light); border: none; padding: 6px 20px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 13px; }
        .tablet-mode .game-container { max-width: 800px; border-left-width: 4px; border-right-width: 4px; }
        .tablet-mode .choice-btn { padding: 18px 24px; font-size: 17px; }
        .tablet-mode .story-text { font-size: 19px; line-height: 2; }
        .tablet-mode .status-bar { padding: 16px 28px; }
        .tablet-mode .choices-container { padding: 18px 28px 14px; }
        .tablet-mode .story-container { padding: 20px 28px; }
        .tablet-mode .footer { padding: 10px 28px; }
        .tablet-mode .start-content h1 { font-size: 72px; }
        .tablet-mode .start-subtitle { font-size: 22px; }
        @media (max-width: 480px) { .story-text { font-size: 15px; } }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="achievement-popup" id="achievementPopup">
        <span class="icon" id="achIcon">✦</span>
        <span class="title" id="achTitle">成就</span>
    </div>

    <div class="changelog-popup" id="changelogPopup">
        <h4>📜 更新日志</h4>
        <ul>
            <li><b>v2.0.4</b> — 自动云端合并，成就永不丢失</li>
            <li><b>v2.0.3</b> — 修复覆盖问题</li>
            <li><b>v2.0.2</b> — 云端合并同步</li>
            <li><b>v2.0.1</b> — 修复成就映射与复合动作</li>
        </ul>
        <button class="close-changelog" onclick="document.getElementById('changelogPopup').classList.remove('show')">关闭</button>
    </div>

    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <h1>黄小仙</h1>
            <p class="start-subtitle">五百年修为一念之间</p>
            <button class="start-btn focusable" id="startBtn" onclick="startGame()">开始讨封</button>
            <div style="color:#5D4037; margin-top:36px; font-size:13px;">
                剧情页面：<b style="color:var(--scroll-gold);">↑↓</b> 滚动　<b style="color:var(--scroll-gold);">←→</b> 切换选项　<b style="color:var(--scroll-gold);">Enter</b> 确认　<b style="color:var(--scroll-gold);">Esc</b> 后退
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="status-bar">
            <div class="cultivation">道行：<span id="cultivation-level">五百年</span></div>
            <div class="karma-display" id="karmaDisplay"></div>
            <div class="env-bar" id="envBar"></div>
        </div>
        <div class="story-container" id="story-container"></div>
        <div class="choices-container" id="choices-container"></div>
        <div class="footer">
            <div><button class="version-btn" id="versionBtn">v2.0.4</button></div>
            <div><a href="https://raccoon.fit/" target="_blank" style="color:#5D4037;text-decoration:none;">2026 软软的小窝</a></div>
        </div>
    </div>

    <button class="settings-btn" id="settingsBtn" title="设置">⚙</button>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-modal">
            <h3>设置</h3>
            <div class="settings-item">
                <span class="label">当前进度</span>
                <div id="progressInfo" style="color:var(--scroll-gold);">加载中...</div>
            </div>
            <div class="settings-item">
                <span class="label">显示模式</span>
                <button class="settings-btn-action focusable" id="tabletModeBtn">切换平板模式</button>
            </div>
            <div class="settings-row">
                <button class="settings-btn-action focusable" id="closeSettingsBtn">关闭</button>
                <button class="settings-btn-action danger focusable" id="clearProgressBtn">清除进度</button>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-modal">
            <h4 id="confirmTitle">确认操作</h4>
            <p id="confirmMessage"></p>
            <div class="confirm-row">
                <button class="settings-btn-action focusable" id="confirmCancelBtn">取消</button>
                <button class="settings-btn-action danger focusable" id="confirmOkBtn">确定</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <button class="float-jump-btn" id="floatJumpBtn" title="跳至选项">↓</button>

    <script src="story.js"></script>
    <script>
        // ==================== 云居API配置 ====================
        const ENCODED_CONFIG = "eyJ1c2VyIjoiMjA1MTc3NTUwNSIsInBhc3MiOiJSYWNjb29uIiwiYXBwaWQiOiIxMTIxIiwiYXBpUXVlcnkiOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX2FwaV9xdWVyeS5waHAiLCJhcGlFc3RhYmxpc2giOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX2FwaV9lc3RhYmxpc2gucGhwIiwiYXBpTW9kaWZ5IjoiaHR0cHM6Ly95dWp1Ljk5a3BrLnRvcDo4MS9hcGkvZmlsZV9hcGlfbW9kaWZ5LnBocCIsImFwaUxpc3QiOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX29idGFpbl9saXN0LnBocCJ9";
        const CONFIG = JSON.parse(atob(ENCODED_CONFIG));

        let playerName = localStorage.getItem('playerName') || '';
        let cloudDocId = localStorage.getItem('cloudDocId') || '';
        try {
            if (!playerName && window.parent !== window) playerName = window.parent.localStorage.getItem('playerName') || '';
            if (!cloudDocId && window.parent !== window) cloudDocId = window.parent.localStorage.getItem('cloudDocId') || '';
        } catch(e) {}

        const STORAGE_KEY = 'huangdaxian_achievements';
        const SPECIAL_KEY = 'huangdaxian_special_achievements';
        const SPECIAL_NOTES_KEY = 'huangdaxian_special_notes';
        const USED_CODES_KEY = 'huangdaxian_used_codes';

        const achievementIcons = [
            { id: 'witness', title: '无对无错，善良依旧', icon: '✦', legendary: true },
            { id: 'sacrifice', title: '舍身成仁', icon: '†', legendary: true },
            { id: 'seven_days', title: '七日圆满，本相归真', icon: '🌟', legendary: true },
            { id: 'empty_face', title: '空相无相', icon: '○', legendary: true },
            { id: 'true', title: '本相自在', icon: '◯', legendary: false },
            { id: 'god', title: '点化成仙', icon: '☀', legendary: false },
            { id: 'mortal', title: '尘世轮回', icon: '人', legendary: false },
            { id: 'fail_scholar', title: '功亏一篑', icon: '✗', legendary: false },
            { id: 'fail_kid', title: '原形毕露', icon: '✗', legendary: false },
            { id: 'farmer', title: '山野村夫', icon: '🌾', legendary: false },
            { id: 'star', title: '文曲星耀', icon: '⭐', legendary: false },
            { id: 'demon_king', title: '妖王之路', icon: '◆', legendary: false },
            { id: 'mad', title: '执念成魔', icon: '◇', legendary: false },
            { id: 'love', title: '红尘情缘', icon: '♡', legendary: false },
            { id: 'guardian', title: '守山之人', icon: '⛰', legendary: false },
            { id: 'lost', title: '雨夜迷途', icon: '?', legendary: false },
            { id: 'severed', title: '断缘而去', icon: '—', legendary: false },
            { id: 'dawn', title: '黎明归宿', icon: '☽', legendary: false },
            { id: 'sword_friend', title: '剑影知交', icon: '⚔', legendary: false },
            { id: 'sword_master', title: '剑道传承', icon: '剑', legendary: false },
            { id: 'green_memory', title: '前尘往事', icon: '记', legendary: false },
            { id: 'great_good', title: '大善若水', icon: '☯', legendary: false },
            { id: 'great_evil', title: '大恶如魔', icon: '💀', legendary: false },
            { id: 'balance_sage', title: '中庸之道', icon: '⚖', legendary: false },
            { id: 'ghost_friend', title: '鬼魂之交', icon: '👻', legendary: false },
            { id: 'suspicious', title: '疑心失缘', icon: '疑', legendary: false },
            { id: 'moon_fox', title: '月下同行', icon: '🦊', legendary: false },
            { id: 'drought_hero', title: '润物无声', icon: '🌧', legendary: false },
            { id: 'well_insight', title: '井中悟道', icon: '🕳', legendary: false },
            { id: 'chess_sage', title: '棋道天成', icon: '♟', legendary: false }
        ];

        const gameState = {
            currentScene: 'start',
            storyHistory: [],
            sceneHistory: [],
            typingTimer: null,
            checkpointScene: 'start',
            achievements: { ...window.ACHIEVEMENTS_INIT },
            playerLingYun: 0,
            playerZhuoNian: 0,
            playerDifficulty: 'normal'
        };

        // ========== 本地存储工具函数 ==========
        function getLocalAchievements() {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : {};
        }
        function saveLocalAchievements(obj) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
        }
        function getAchievementTitles() {
            const ach = getLocalAchievements();
            return Object.keys(ach).filter(k => ach[k]).map(k => {
                const found = achievementIcons.find(a => a.id === k);
                return found ? found.title : k;
            });
        }
        function getSpecialAchievements() {
            const raw = localStorage.getItem(SPECIAL_KEY);
            return raw ? JSON.parse(raw) : [];
        }
        function saveSpecialAchievements(arr) {
            localStorage.setItem(SPECIAL_KEY, JSON.stringify(arr));
        }
        function getSpecialNotes() {
            const raw = localStorage.getItem(SPECIAL_NOTES_KEY);
            return raw ? JSON.parse(raw) : {};
        }
        function saveSpecialNotes(obj) {
            localStorage.setItem(SPECIAL_NOTES_KEY, JSON.stringify(obj));
        }
        function getUsedCodes() {
            const raw = localStorage.getItem(USED_CODES_KEY);
            return raw ? JSON.parse(raw) : [];
        }
        function addUsedCode(code) {
            const arr = getUsedCodes();
            arr.push(code);
            localStorage.setItem(USED_CODES_KEY, JSON.stringify(arr));
        }

        // ========== 云端API ==========
        async function apiListDocuments() {
            const url = `${CONFIG.apiList}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.code != 1) throw new Error(data.msg || '获取列表失败');
            return data.list || [];
        }
        async function apiQueryDocument(docId) {
            const url = `${CONFIG.apiQuery}?user=${CONFIG.user}&appid=${CONFIG.appid}&id=${docId}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.code != 1) throw new Error(data.msg || '查询文档失败');
            return { title: data.title, content: JSON.parse(data.content) };
        }
        async function apiModifyDocument(docId, title, contentObj) {
            const url = `${CONFIG.apiModify}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}&id=${docId}`;
            const body = `title=${encodeURIComponent(title)}&content=${encodeURIComponent(JSON.stringify(contentObj))}`;
            const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
            const data = await res.json();
            if (data.code != 1) throw new Error(data.msg || '修改文档失败');
        }
        async function apiEstablishDocument(title, contentObj) {
            const url = `${CONFIG.apiEstablish}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}`;
            const body = `title=${encodeURIComponent(title)}&content=${encodeURIComponent(JSON.stringify(contentObj))}`;
            const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
            const data = await res.json();
            if (data.code != 1) throw new Error(data.msg || '创建文档失败');
            return data.id || data.data;
        }
        async function findDocByPlayerName() {
            if (!playerName) return null;
            const list = await apiListDocuments();
            const found = list.find(item => item.title === playerName);
            return found ? found.id : null;
        }

        // ========== 核心：自动合并同步 ==========
        let syncTimer = null;
        // 防抖函数：2秒内多次调用只执行最后一次
        function debounceSync() {
            if (syncTimer) clearTimeout(syncTimer);
            syncTimer = setTimeout(() => autoSyncToCloud(), 2000);
        }

        // 自动同步：拉取云端 -> 合并本地 -> 上传
        async function autoSyncToCloud() {
            if (!playerName || !cloudDocId) return;
            try {
                // 1. 拉取云端最新数据
                const remoteDoc = await apiQueryDocument(cloudDocId);
                const remote = remoteDoc.content;
                // 2. 合并成就（并集）
                const localAch = getLocalAchievements();
                const remoteTitles = remote.achievements || [];
                const mergedAch = { ...localAch };
                remoteTitles.forEach(title => {
                    const found = achievementIcons.find(a => a.title === title);
                    if (found) mergedAch[found.id] = true;
                });
                saveLocalAchievements(mergedAch);
                gameState.achievements = mergedAch;

                // 3. 合并特殊成就、备注、兑换码
                const localSpecial = getSpecialAchievements();
                const remoteSpecial = remote.specialAchievements || [];
                saveSpecialAchievements([...new Set([...localSpecial, ...remoteSpecial])]);

                const localNotes = getSpecialNotes();
                const remoteNotes = remote.specialNotes || {};
                saveSpecialNotes({ ...localNotes, ...remoteNotes });

                const localCodes = getUsedCodes();
                const remoteCodes = remote.usedCodes || [];
                localStorage.setItem(USED_CODES_KEY, JSON.stringify([...new Set([...localCodes, ...remoteCodes])]));

                // 4. 准备上传数据（使用合并后的数据）
                const uploadData = {
                    playerName: playerName,
                    achievements: getAchievementTitles(),
                    specialAchievements: getSpecialAchievements(),
                    specialNotes: getSpecialNotes(),
                    usedCodes: JSON.parse(localStorage.getItem(USED_CODES_KEY) || '[]'),
                    storyNode: localStorage.getItem('storyNode') || 'start',
                    lingYun: parseInt(localStorage.getItem('lingYun') || '100'),
                    zhuoNian: parseInt(localStorage.getItem('zhuoNian') || '0'),
                    updateTime: Date.now()
                };

                // 5. 上传到云端
                await apiModifyDocument(cloudDocId, playerName, uploadData);
                localStorage.setItem('lastCloudSaveTime', Date.now());
                updateKarmaUI();
            } catch (e) {
                console.warn('自动同步云端失败：', e.message);
            }
        }

        // ========== 云端下载（手动触发，但也执行合并） ==========
        async function pullCloudSave() {
            if (!playerName) {
                alert('请先设置道号！');
                return;
            }
            if (!cloudDocId) {
                const foundId = await findDocByPlayerName();
                if (foundId) { cloudDocId = foundId; localStorage.setItem('cloudDocId', cloudDocId); }
                else {
                    const manualId = prompt('未找到云端仙籍，请手动输入文档ID：');
                    if (manualId && manualId.trim()) { cloudDocId = manualId.trim(); localStorage.setItem('cloudDocId', cloudDocId); } else return;
                }
            }
            try {
                const remoteDoc = await apiQueryDocument(cloudDocId);
                const remote = remoteDoc.content;
                // 合并成就
                const localAch = getLocalAchievements();
                const remoteTitles = remote.achievements || [];
                const mergedAch = { ...localAch };
                remoteTitles.forEach(title => {
                    const found = achievementIcons.find(a => a.title === title);
                    if (found) mergedAch[found.id] = true;
                });
                saveLocalAchievements(mergedAch);
                gameState.achievements = mergedAch;

                // 合并特殊成就
                const localSpecial = getSpecialAchievements();
                const remoteSpecial = remote.specialAchievements || [];
                saveSpecialAchievements([...new Set([...localSpecial, ...remoteSpecial])]);

                // 合并备注
                const localNotes = getSpecialNotes();
                const remoteNotes = remote.specialNotes || {};
                saveSpecialNotes({ ...localNotes, ...remoteNotes });

                // 合并兑换码
                const localCodes = getUsedCodes();
                const remoteCodes = remote.usedCodes || [];
                localStorage.setItem(USED_CODES_KEY, JSON.stringify([...new Set([...localCodes, ...remoteCodes])]));

                // 数值：云端覆盖（保持最新）
                if (remote.storyNode) localStorage.setItem('storyNode', remote.storyNode);
                if (remote.lingYun !== undefined) localStorage.setItem('lingYun', remote.lingYun);
                if (remote.zhuoNian !== undefined) localStorage.setItem('zhuoNian', remote.zhuoNian);
                if (remote.playerName) { playerName = remote.playerName; localStorage.setItem('playerName', playerName); }

                localStorage.setItem('lastCloudSaveTime', Date.now());
                updateKarmaUI();
                alert('仙缘已接续，成就已合并！');
            } catch (e) {
                alert('网络错误：' + e.message);
            }
        }

        // ========== 云端上传（手动触发，也执行合并） ==========
        async function pushCloudSave() {
            if (!playerName) {
                alert('请先设置道号！');
                return;
            }
            // 确保有文档ID
            if (!cloudDocId) {
                const foundId = await findDocByPlayerName();
                if (foundId) { cloudDocId = foundId; localStorage.setItem('cloudDocId', cloudDocId); }
            }
            // 先执行合并下载，再上传
            await autoSyncToCloud();
            alert('修为已合并上传至云端！');
        }

        // ========== 原有游戏逻辑 ==========
        async function updateLingYun(delta) {
            if (!cloudDocId) return;
            try {
                const doc = await apiQueryDocument(cloudDocId);
                const newVal = Math.max(0, Math.min(100, (doc.content.lingYun || 0) + delta));
                doc.content.lingYun = newVal;
                await apiModifyDocument(cloudDocId, playerName, doc.content);
                gameState.playerLingYun = newVal;
                updateKarmaUI();
            } catch(e) {}
        }
        async function updateZhuoNian(delta) {
            if (!cloudDocId) return;
            try {
                const doc = await apiQueryDocument(cloudDocId);
                const newVal = Math.max(0, Math.min(100, (doc.content.zhuoNian || 0) + delta));
                doc.content.zhuoNian = newVal;
                await apiModifyDocument(cloudDocId, playerName, doc.content);
                gameState.playerZhuoNian = newVal;
                updateKarmaUI();
            } catch(e) {}
        }
        function updateKarmaUI() {
            const el = document.getElementById('karmaDisplay');
            if (!el) return;
            const ly = gameState.playerLingYun, zn = gameState.playerZhuoNian;
            let lyL = '', znL = '';
            if (ly >= 80) lyL = '仙光护体'; else if (ly >= 50) lyL = '心怀慈悲'; else if (ly >= 20) lyL = '心存善念'; else lyL = '初入道途';
            if (zn >= 80) znL = '魔障缠身'; else if (zn >= 50) znL = '心魔暗生'; else if (zn >= 20) znL = '偶生恶念'; else znL = '心台明净';
            el.innerHTML = `<span class="karma-lingyun">☯ 灵韵 ${ly} · ${lyL}</span><span class="karma-zhuonian">☠ 浊念 ${zn} · ${znL}</span>`;
        }

        function getScene(id) { return window.SCENES[id] || null; }
        function getCultivation(sceneId) { return window.CULTIVATION_MAP[sceneId] || '五百年'; }
        function updateCultivationUI(sceneId) { const el = document.getElementById('cultivation-level'); if (el) el.textContent = getCultivation(sceneId); }
        function updateEnvUI(scene) {
            const bar = document.getElementById('envBar');
            if (!bar || !scene || !scene.env) { bar.innerHTML = ''; return; }
            const env = scene.env;
            const w = window.WEATHER_TYPES[env.weather] || { name: '—', icon: '·' };
            const t = window.TIME_OF_DAY[env.timeOfDay] || { name: '—', icon: '·' };
            const m = window.MOON_PHASES[env.moonPhase] || { name: '—', icon: '·' };
            let eff = window.ENV_EFFECTS[env.weather] || '';
            let html = `<span class="env-item"><span class="env-icon">${w.icon}</span><span class="env-label">${w.name}</span></span><span class="env-item"><span class="env-icon">${t.icon}</span><span class="env-label">${t.name}</span></span><span class="env-item"><span class="env-label">第${env.day||'—'}日</span></span><span class="env-item moon"><span class="env-icon">${m.icon}</span><span class="env-label">${m.name}</span></span>`;
            if (eff) html += `<span class="env-effect">${eff}</span>`;
            bar.innerHTML = html;
        }

        // 解锁成就（写入本地后立即触发自动同步）
        async function unlockAchievement(id) {
            const currentAch = getLocalAchievements();
            if (!currentAch[id]) {
                currentAch[id] = true;
                saveLocalAchievements(currentAch);
                gameState.achievements = currentAch;
                const name = window.ACHIEVEMENT_NAME_MAP[id] || id;
                const golden = window.GOLDEN_ACHIEVEMENTS && window.GOLDEN_ACHIEVEMENTS.includes(id);
                showAchievementPopup(name, golden);
                if (window.parent) window.parent.postMessage({ type: 'achievements-updated' }, '*');
                try { new BroadcastChannel('huangdaxian_sync').postMessage({ type: 'achievements-updated' }); } catch(e) {}
                // 自动同步到云端
                debounceSync();
            }
        }

        function showAchievementPopup(name, golden) {
            const popup = document.getElementById('achievementPopup'), title = document.getElementById('achTitle'), icon = document.getElementById('achIcon');
            if (!popup) return;
            title.textContent = name; icon.textContent = '✦';
            popup.className = 'achievement-popup' + (golden ? ' golden' : '');
            popup.classList.add('show');
            clearTimeout(popup._timer);
            popup._timer = setTimeout(() => popup.classList.remove('show'), 3500);
        }

        async function loadAchievements() {
            const localAch = getLocalAchievements();
            if (Object.keys(localAch).length > 0) {
                gameState.achievements = localAch;
                return;
            }
            const saved = await StorageBridge?.getItem?.(STORAGE_KEY);
            if (saved) { gameState.achievements = JSON.parse(saved); saveLocalAchievements(gameState.achievements); }
        }

        function getUnlockedCount() { return Object.values(gameState.achievements).filter(v => v).length; }

        function renderScene(sceneId) {
            if (gameState.typingTimer) clearTimeout(gameState.typingTimer);
            const scene = getScene(sceneId);
            if (!scene) return;
            gameState.currentScene = sceneId;
            updateCultivationUI(sceneId);
            updateEnvUI(scene);
            if (scene.choices) { const valid = scene.choices.filter(c => c.text !== '重新开始' && c.text !== '回到上一个选择点'); if (valid.length >= 2) gameState.checkpointScene = sceneId; }
            const storyContainer = document.getElementById('story-container'), choicesContainer = document.getElementById('choices-container');
            storyContainer.innerHTML = ''; choicesContainer.innerHTML = '';
            let textIndex = 0, total = scene.texts.length;
            function showNextText() {
                if (textIndex >= total) { showChoicesDirect(scene); window.dispatchEvent(new Event('scene-rendered')); return; }
                const obj = scene.texts[textIndex], p = document.createElement('p');
                p.className = 'story-text ' + obj.type; storyContainer.appendChild(p); storyContainer.scrollTop = storyContainer.scrollHeight;
                const speed = obj.type === 'speaker' ? 40 : obj.type === 'system' ? 20 : obj.type === 'witness' ? 50 : 30;
                let ci = 0; const txt = obj.content;
                function typeChar() {
                    if (ci < txt.length) { p.textContent += txt[ci]; ci++; storyContainer.scrollTop = storyContainer.scrollHeight; gameState.typingTimer = setTimeout(typeChar, speed); }
                    else { textIndex++; gameState.typingTimer = setTimeout(showNextText, obj.type === 'witness' ? 600 : 300); }
                }
                typeChar();
            }
            showNextText();
        }

        function showChoicesDirect(scene) {
            const container = document.getElementById('choices-container'); let html = '';
            scene.choices.forEach((choice, idx) => {
                if (choice.nextScene === 'checkpoint') {
                    const label = gameState.checkpointScene ? '回到上一个选择点' : '重新开始', target = gameState.checkpointScene || 'start';
                    html += `<button class="choice-btn focusable" onclick="handleChoice('${target}',null)" style="animation-delay:${idx*0.1}s">${label}</button>`;
                } else {
                    html += `<button class="choice-btn focusable" onclick="handleChoice('${choice.nextScene}','${choice.action||''}')" style="animation-delay:${idx*0.1}s">${choice.text}</button>`;
                }
            });
            container.innerHTML = html;
            container.classList.toggle('single-col', container.querySelectorAll('.choice-btn').length === 1);
            setTimeout(() => { const first = container.querySelector('.choice-btn'); if (first) focusElement(first); }, 50);
        }

        window.handleChoice = async function(nextScene, action) {
            if (action) {
                const actions = action.split(',').map(a => a.trim());
                for (let act of actions) {
                    if (act.startsWith('lingyun_')) { const v = parseInt(act.replace('lingyun_',''),10); if (!isNaN(v)) await updateLingYun(v); }
                    else if (act.startsWith('zhuonian_')) { const v = parseInt(act.replace('zhuonian_',''),10); if (!isNaN(v)) await updateZhuoNian(v); }
                    else if (act.startsWith('karma_plus_')) { const v = parseInt(act.replace('karma_plus_',''),10); if (!isNaN(v)) await updateLingYun(v); }
                    else if (act.startsWith('karma_minus_')) { const v = parseInt(act.replace('karma_minus_',''),10); if (!isNaN(v)) await updateZhuoNian(v); }
                    const unlockMap = {
                        'unlock_god':'god', 'unlock_fail_scholar':'fail_scholar', 'unlock_fail_kid':'fail_kid',
                        'unlock_farmer':'farmer', 'unlock_star':'star', 'unlock_mortal':'mortal',
                        'unlock_demon_king':'demon_king', 'unlock_sacrifice':'sacrifice', 'unlock_mad':'mad',
                        'unlock_love':'love', 'unlock_guardian':'guardian', 'unlock_lost':'lost',
                        'unlock_severed':'severed', 'unlock_dawn':'dawn', 'unlock_witness':'witness',
                        'unlock_suspicious':'suspicious', 'unlock_sword_friend':'sword_friend',
                        'unlock_sword_master':'sword_master', 'unlock_green_fate':'green_memory',
                        'unlock_ghost_friend':'ghost_friend', 'unlock_seven_days':'seven_days',
                        'unlock_moon_fox':'moon_fox', 'unlock_drought_hero':'drought_hero',
                        'unlock_well_insight':'well_insight', 'unlock_chess_sage':'chess_sage',
                        'unlock_empty_face':'empty_face', 'unlock_true': 'true'
                    };
                    if (unlockMap[act]) await unlockAchievement(unlockMap[act]);
                    if (act === 'reset' || act === 'reset_suspicious') {
                        if (act === 'reset_suspicious') await unlockAchievement('suspicious');
                        resetGame(false);
                        return;
                    }
                }
            }
            if (gameState.currentScene && nextScene && gameState.currentScene !== nextScene) {
                gameState.sceneHistory.push(gameState.currentScene);
                if (gameState.sceneHistory.length > 50) gameState.sceneHistory.shift();
            }
            setTimeout(() => { currentFocusIndex = 0; renderScene(nextScene); }, 200);
        };

        async function resetGame(fullReset) { /* 保持不变 */ }
        window.startGame = function() { /* 保持不变 */ };

        // ========== UI控制 ==========
        let currentFocusIndex = 0;
        function getFocusableElements() { /* 保持不变 */ }
        function focusElement(el) { /* 保持不变 */ }
        // ... 其余UI函数保持不变，请复用之前版本的完整按键处理 ...

        function openSettings() {
            const total = window.ACHIEVEMENT_ICONS ? window.ACHIEVEMENT_ICONS.length : 0;
            document.getElementById('progressInfo').textContent = `已解锁 ${getUnlockedCount()} / ${total} 项成就`;
            document.getElementById('settingsOverlay').classList.add('show');
        }
        function closeSettings() { document.getElementById('settingsOverlay').classList.remove('show'); }

        // ===== 启动 =====
        window.onload = async function() {
            if (!window.SCENES) return;
            await loadAchievements();
            // 加载灵韵/浊念
            if (cloudDocId) {
                try {
                    const doc = await apiQueryDocument(cloudDocId);
                    gameState.playerLingYun = doc.content.lingYun || 0;
                    gameState.playerZhuoNian = doc.content.zhuoNian || 0;
                    updateKarmaUI();
                } catch(e) {}
            }
            updateCultivationUI('start');
            document.getElementById('startOverlay').style.display = 'flex';
            setTimeout(() => { const btn = document.getElementById('startBtn'); if (btn) focusElement(btn); }, 100);
            initControls();
            setupScrollAssist();
        };
    </script>
</body>
