<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>黄小仙 · 讨封之卷</title>
    <style>
        :root {
            --nav-height: 56px;
            --gold: #c7a64a;
            --gold-light: #e8cc80;
            --gold-glow: #fff0c8;
            --gold-ghost: #6e5d3a;
            --jade: #5a8a78;
            --jade-light: #8ab8a6;
            --jade-deep: #2a4a3e;
            --bronze: #7a5230;
            --bronze-light: #c89860;
            --bronze-deep: #3a1a10;
            --plaque-bg: #2c1410;
            --plaque-border: #c7a64a;
            --plaque-inner: #a07830;
            --zitan: #3a1810;
            --zitan-light: #5a2818;
            --zitan-deep: #1a0808;
            --ink: #d4cec0;
            --ink-dim: #7a7568;
            --ink-deep: #4a4540;
            --border-subtle: #1a2a22;
            --font-stack: "SimSun", "Songti SC", "Noto Serif SC", serif;
            --bg-deep: #061210;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg-deep);
            font-family: var(--font-stack);
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }

        /* ===== iframe 容器 ===== */
        .iframe-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: var(--bg-deep);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.4);
        }
        /* 顶部装饰金光（呼应底栏） */
        .iframe-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 4%;
            right: 4%;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(199, 166, 74, 0.4) 20%,
                rgba(232, 204, 128, 0.55) 50%,
                rgba(199, 166, 74, 0.4) 80%,
                transparent 100%);
            box-shadow: 0 0 4px rgba(199, 166, 74, 0.25);
            z-index: 10;
            pointer-events: none;
        }
        /* 顶部流光扫过 */
        .iframe-wrapper::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 30%;
            height: 1px;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 240, 200, 0.8),
                transparent);
            z-index: 11;
            pointer-events: none;
            animation: top-sweep 5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes top-sweep {
            0% { transform: translateX(-30%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(400%); opacity: 0; }
        }
        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.3s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), filter 0.38s ease;
        }
        /* 讨封iframe */
        .iframe-tao {
            z-index: 1;
            opacity: 1;
            pointer-events: auto;
        }
        .iframe-tao.dimmed {
            opacity: 0;
            pointer-events: none;
            z-index: 0;
            transform: translateY(8px) scale(0.995);
            filter: blur(1px);
        }
        /* 其他页面iframe */
        .iframe-other {
            z-index: 0;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px) scale(0.995);
            filter: blur(1px);
        }
        .iframe-other.active {
            z-index: 2;
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
            filter: none;
        }
        .iframe-wrapper iframe.page-enter {
            animation: page-enter 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes page-enter {
            from { opacity: 0; transform: translateY(10px) scale(0.995); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== 加载遮罩 ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            font-size: 16px;
            background: rgba(10, 8, 6, 0.92);
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.35s;
        }
        .loading-overlay.fading-out {
            opacity: 0;
            pointer-events: none;
        }
        .loading-overlay.hidden {
            display: none;
        }
        .loading-overlay .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1.1s cubic-bezier(0.55, 0.1, 0.45, 0.9) infinite;
            margin-bottom: 15px;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.18);
        }
        .loading-overlay .status-text {
            font-size: 15px;
            letter-spacing: 2px;
            text-align: center;
            padding: 0 20px;
            transition: color 0.3s;
        }
        .loading-overlay .retry-btn {
            margin-top: 16px;
            padding: 10px 24px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-stack);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: auto;
            display: none;
            transition: all 0.25s;
        }
        .loading-overlay .retry-btn:active {
            background: rgba(212, 175, 55, 0.15);
        }
        .loading-overlay .retry-btn.visible {
            display: block;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== 底部导航栏 · 紫檀木面板 ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background:
                radial-gradient(1.2px 1.2px at 12% 30%, rgba(232, 204, 128, 0.55), transparent),
                radial-gradient(1px 1px at 28% 70%, rgba(199, 166, 74, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 45% 45%, rgba(232, 204, 128, 0.5), transparent),
                radial-gradient(1px 1px at 62% 25%, rgba(199, 166, 74, 0.35), transparent),
                radial-gradient(1.2px 1.2px at 78% 65%, rgba(232, 204, 128, 0.5), transparent),
                radial-gradient(1px 1px at 92% 40%, rgba(199, 166, 74, 0.4), transparent),
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><path d='M0 20 Q10 14 20 20 T40 20' fill='none' stroke='rgba(199,166,74,0.05)' stroke-width='1'/><path d='M0 30 Q10 24 20 30 T40 30' fill='none' stroke='rgba(138,184,166,0.04)' stroke-width='1'/></svg>"),
                linear-gradient(180deg,
                    var(--zitan-light) 0%,
                    var(--zitan) 18%,
                    #2a1208 65%,
                    var(--zitan-deep) 100%);
            background-size:
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                40px 40px,
                100% 100%;
            background-repeat:
                no-repeat,
                no-repeat,
                no-repeat,
                no-repeat,
                no-repeat,
                no-repeat,
                repeat,
                no-repeat;
            border-top: 1px solid rgba(199, 166, 74, 0.18);
            border-bottom: 1px solid rgba(199, 166, 74, 0.1);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-top: 2px;
            z-index: 1000;
            min-height: var(--nav-height);
            transition: all 0.3s ease;
            position: relative;
            flex-shrink: 0;
            box-shadow:
                0 -6px 28px rgba(0, 0, 0, 0.65),
                0 -1px 0 rgba(232, 204, 128, 0.08),
                inset 0 2px 0 rgba(199, 166, 74, 0.06),
                inset 0 -1px 0 rgba(0, 0, 0, 0.4);
        }
        /* 顶部金线：贯穿高光 */
        .bottom-nav::before {
            content: "";
            position: absolute;
            top: 0;
            left: 4%;
            right: 4%;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(199, 166, 74, 0.55) 20%,
                rgba(255, 240, 200, 0.85) 50%,
                rgba(199, 166, 74, 0.55) 80%,
                transparent 100%);
            box-shadow: 0 0 6px rgba(199, 166, 74, 0.4);
            overflow: hidden;
        }
        /* 顶部副高光：内层极细 */
        .bottom-nav::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 18%;
            right: 18%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232, 204, 128, 0.14), transparent);
            pointer-events: none;
        }
        /* ===== 氛围层：仙台悬浮夜色 =====
           向上溢出的远山 + 灵光 + 仙雾 + 星尘，衔接游戏画面底部 */
        .nav-ambient {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 100%;
            height: 120px;
            pointer-events: none;
            z-index: 990;
            overflow: hidden;
        }
        /* 远山剪影（双层，极暗） */
        .nav-ambient .atm-peaks {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100%;
            background-repeat: repeat-x;
            background-position: bottom center;
            background-size: 220px 100%;
        }
        .nav-ambient .atm-peaks-a {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 80' preserveAspectRatio='none'><path d='M0 80 L0 52 Q30 34 60 44 T120 38 T180 46 T220 40 L220 80 Z' fill='rgba(2,8,10,0.5)'/></svg>");
            opacity: 0.9;
        }
        .nav-ambient .atm-peaks-b {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 80' preserveAspectRatio='none'><path d='M0 80 L0 60 Q35 48 70 56 T140 50 T200 58 T220 52 L220 80 Z' fill='rgba(4,12,14,0.65)'/></svg>");
            background-size: 300px 70%;
            opacity: 0.85;
        }
        /* 青玉灵光：黄仙月华 */
        .nav-ambient .atm-glow {
            position: absolute;
            left: 50%;
            bottom: -16px;
            width: 200px;
            height: 100px;
            transform: translateX(-50%);
            background: radial-gradient(ellipse at center bottom,
                rgba(138, 184, 166, 0.32) 0%,
                rgba(199, 166, 74, 0.12) 45%,
                transparent 68%);
            filter: blur(7px);
            animation: atm-glow-breathe 4.5s ease-in-out infinite;
        }
        @keyframes atm-glow-breathe {
            0%, 100% { opacity: 0.65; transform: translateX(-50%) scaleY(1); }
            50% { opacity: 1; transform: translateX(-50%) scaleY(1.12); }
        }
        /* 仙雾：双层错位漂移 */
        .nav-ambient .atm-mist {
            position: absolute;
            left: -10%;
            right: -10%;
            bottom: -4px;
            height: 72px;
            filter: blur(10px);
            background:
                radial-gradient(ellipse 42% 60% at 18% 100%, rgba(216, 226, 208, 0.14), transparent 70%),
                radial-gradient(ellipse 38% 55% at 46% 100%, rgba(216, 226, 208, 0.12), transparent 70%),
                radial-gradient(ellipse 40% 58% at 78% 100%, rgba(216, 226, 208, 0.14), transparent 70%);
        }
        .nav-ambient .atm-mist-a {
            animation: mist-drift-a 16s ease-in-out infinite alternate;
        }
        .nav-ambient .atm-mist-b {
            height: 58px;
            opacity: 0.7;
            background:
                radial-gradient(ellipse 46% 60% at 32% 100%, rgba(216, 226, 208, 0.1), transparent 70%),
                radial-gradient(ellipse 40% 55% at 66% 100%, rgba(216, 226, 208, 0.12), transparent 70%);
            animation: mist-drift-b 20s ease-in-out infinite alternate;
        }
        @keyframes mist-drift-a {
            0% { transform: translateX(-2.5%); }
            100% { transform: translateX(2.5%); }
        }
        @keyframes mist-drift-b {
            0% { transform: translateX(3%); }
            100% { transform: translateX(-3%); }
        }
        /* 星尘：稀疏闪烁 */
        .nav-ambient .atm-stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 8% 20%, rgba(232, 204, 128, 0.6), transparent),
                radial-gradient(1.5px 1.5px at 23% 55%, rgba(216, 226, 208, 0.5), transparent),
                radial-gradient(1px 1px at 37% 25%, rgba(232, 204, 128, 0.45), transparent),
                radial-gradient(1px 1px at 54% 15%, rgba(216, 226, 208, 0.55), transparent),
                radial-gradient(1.5px 1.5px at 68% 40%, rgba(232, 204, 128, 0.5), transparent),
                radial-gradient(1px 1px at 84% 20%, rgba(216, 226, 208, 0.5), transparent),
                radial-gradient(1px 1px at 93% 50%, rgba(232, 204, 128, 0.4), transparent);
            animation: atm-star-twinkle 5s ease-in-out infinite alternate;
        }
        @keyframes atm-star-twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }
        /* 金粉微粒升华 */
        .nav-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .nav-particles .dust {
            position: absolute;
            bottom: 4px;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 240, 200, 0.95), rgba(199, 166, 74, 0.4) 60%, transparent);
            box-shadow: 0 0 4px rgba(232, 204, 128, 0.7);
            opacity: 0;
            animation: dust-rise 6s ease-in-out infinite;
        }
        .nav-particles .d1 { left:  6%; animation-delay: 0s;   animation-duration: 5.5s; }
        .nav-particles .d2 { left: 16%; animation-delay: 1.2s; animation-duration: 7s;   width: 1.5px; height: 1.5px; }
        .nav-particles .d3 { left: 26%; animation-delay: 2.4s; animation-duration: 6s;   }
        .nav-particles .d4 { left: 38%; animation-delay: 0.8s; animation-duration: 8s;   width: 1px; height: 1px; }
        .nav-particles .d5 { left: 50%; animation-delay: 3.2s; animation-duration: 6.5s; }
        .nav-particles .d6 { left: 62%; animation-delay: 1.6s; animation-duration: 7.5s; width: 1.5px; height: 1.5px; }
        .nav-particles .d7 { left: 74%; animation-delay: 2.8s; animation-duration: 5.8s; }
        .nav-particles .d8 { left: 88%; animation-delay: 0.4s; animation-duration: 7.2s; width: 1px; height: 1px; }
        @keyframes dust-rise {
            0% {
                transform: translate(0, 0) scale(0.4);
                opacity: 0;
            }
            15% {
                opacity: 0.9;
            }
            50% {
                transform: translate(6px, -22px) scale(1);
                opacity: 0.7;
            }
            85% {
                opacity: 0.3;
            }
            100% {
                transform: translate(-4px, -54px) scale(0.6);
                opacity: 0;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .nav-particles .dust { animation: none; }
            .nav-ambient .atm-mist,
            .nav-ambient .atm-glow,
            .nav-ambient .atm-stars { animation: none; }
            .nav-indicator::after { animation: none; }
        }
        .nav-indicator {
            position: absolute;
            top: 5px;
            left: 0;
            height: calc(100% - 10px - env(safe-area-inset-bottom, 0px));
            border: 1px solid rgba(199, 166, 74, 0.45);
            border-radius: 5px;
            background:
                radial-gradient(60% 40% at 50% 30%, rgba(255, 220, 140, 0.1), transparent 70%),
                linear-gradient(180deg,
                    rgba(138, 184, 166, 0.12) 0%,
                    rgba(90, 138, 120, 0.08) 50%,
                    rgba(42, 74, 62, 0.14) 100%);
            box-shadow:
                inset 0 1px 0 rgba(232, 204, 128, 0.18),
                inset 0 -1px 0 rgba(0, 0, 0, 0.35),
                inset 0 0 0 1px rgba(160, 120, 48, 0.2),
                0 0 12px rgba(199, 166, 74, 0.12),
                0 2px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transform: translateX(0);
            transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), width 0.3s ease, opacity 0.2s ease;
            will-change: transform, width;
        }
        .nav-indicator::before {
            content: "";
            position: absolute;
            top: 1px;
            left: 6%;
            right: 6%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 240, 200, 0.5), transparent);
            opacity: 0.6;
        }
        /* 金光扫过：循环流光 */
        .nav-indicator::after {
            content: "";
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 240, 200, 0.0) 20%,
                rgba(255, 240, 200, 0.25) 50%,
                rgba(232, 204, 128, 0.0) 80%,
                transparent);
            animation: indicator-sweep 2.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            pointer-events: none;
            mix-blend-mode: screen;
        }
        @keyframes indicator-sweep {
            0% { transform: translateX(0%); }
            100% { transform: translateX(300%); }
        }
        .nav-indicator.ready { opacity: 1; }
        .nav-btn {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 4px 2px;
            background: transparent;
            border: none;
            color: var(--ink-dim);
            font-size: 14px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: color 0.24s ease, transform 0.24s ease, filter 0.28s ease;
            min-height: 44px;
            font-family: var(--font-stack);
            position: relative;
            border-radius: 6px;
            white-space: nowrap;
            z-index: 1;
            isolation: isolate;
        }
        .nav-btn .nav-ico {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            color: var(--ink-deep);
            position: relative;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, rgba(232, 204, 128, 0.06), transparent 60%),
                linear-gradient(180deg, rgba(60, 30, 18, 0.55), rgba(20, 10, 6, 0.7));
            box-shadow:
                inset 0 1px 0 rgba(232, 204, 128, 0.08),
                inset 0 -1px 0 rgba(0, 0, 0, 0.4),
                0 1px 2px rgba(0, 0, 0, 0.4);
            transition: color 0.24s ease, filter 0.24s ease, transform 0.24s ease, background 0.24s ease, box-shadow 0.3s ease;
        }
        .nav-btn .nav-ico::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 1px solid rgba(199, 166, 74, 0);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            pointer-events: none;
        }
        .nav-btn .nav-ico svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            position: relative;
            z-index: 1;
        }
        .nav-btn .nav-txt {
            font-size: 11px;
            letter-spacing: 1.5px;
            line-height: 1;
            transition: text-shadow 0.3s ease, letter-spacing 0.3s ease;
        }
        .nav-btn.active .nav-txt {
            text-shadow:
                0 0 6px rgba(232, 204, 128, 0.5),
                0 0 12px rgba(199, 166, 74, 0.3);
            letter-spacing: 2px;
            font-weight: 600;
        }
        .nav-btn.active {
            color: var(--gold);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(199, 166, 74, 0.45);
            transform: translateY(-1px);
        }
        /* 非卷轴 tab 选中：翠玉衬底 + 金描边 */
        .nav-btn.active:not(.scroll-btn) {
            background:
                linear-gradient(180deg, rgba(90, 138, 120, 0.16), rgba(42, 74, 62, 0.22));
            box-shadow:
                inset 0 1px 0 rgba(232, 204, 128, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(199, 166, 74, 0.32),
                0 1px 8px rgba(0, 0, 0, 0.25),
                0 0 10px rgba(199, 166, 74, 0.08);
        }
        .nav-btn.active .nav-ico {
            color: var(--gold-light);
            filter: drop-shadow(0 0 5px rgba(199, 166, 74, 0.55));
            transform: translateY(-1px);
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 220, 140, 0.18), transparent 65%),
                linear-gradient(180deg, rgba(199, 166, 74, 0.1), rgba(90, 60, 20, 0.25));
            box-shadow:
                inset 0 1px 0 rgba(255, 240, 200, 0.25),
                inset 0 -1px 0 rgba(0, 0, 0, 0.35),
                0 0 8px rgba(199, 166, 74, 0.25),
                0 1px 2px rgba(0, 0, 0, 0.4);
        }
        .nav-btn.active .nav-ico::before {
            border-color: rgba(199, 166, 74, 0.5);
            box-shadow: 0 0 6px rgba(199, 166, 74, 0.4);
        }
        /* 选中Tab底部2px金色细线（卷轴主按钮除外） */
        .nav-btn.active:not(.scroll-btn)::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 36%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 1px;
            box-shadow: 0 0 6px rgba(199, 166, 74, 0.6);
            animation: nav-line-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes nav-line-in {
            from { opacity: 0; transform: translateX(-50%) scaleX(0.2); }

                    root.classList.remove('hxsf-cloud-loading');
                    if (k) root.classList.add('hxsf-kill');
                    else root.classList.remove('hxsf-kill');
                } catch (e) {}
            }

            var _origFetch = window.fetch ? window.fetch.bind(window) : null;
            if (_origFetch) {
                window.fetch = function (input, init) {
                    try {
                        var url = (typeof input === 'string') ? input : (input && input.url) || '';
                        if (state.killed && url.indexOf(CLOUD_HOST) !== -1 && url !== KILL_URL) {
                            return Promise.reject(new Error('cloud disabled'));
                        }
                    } catch (e) {}
                    return _origFetch(input, init);
                };
            }

            // 会话内缓存：同一会话不再重复请求；未命中才发起真实请求
            try {
                var cached = sessionStorage.getItem(SESSION_KEY);
                if (cached === '1' || cached === '0') {
                    applyKill(cached === '1');
                    state.ready = Promise.resolve(state.killed);
                    return;
                }
            } catch (e) {}

            state.ready = new Promise(function (resolve) {
                if (!_origFetch) { applyKill(false); resolve(false); return; }
                
                try { if (navigator && navigator.onLine === false) { applyKill(false); resolve(false); return; } } catch (e) {}
                var ctrl = null, timer = null;
                try {
                    ctrl = new AbortController();
                    // 2 秒超时：避免首屏长时间空白
                    timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 2000);
                } catch (e) {}
                _origFetch(KILL_URL, ctrl ? { signal: ctrl.signal } : {})
                    .then(function (r) { return r.text(); })
                    .then(function (t) {
                        if (timer) clearTimeout(timer);
                        var v = (t || '').trim();
                        var k = (v === '1');
                        try { sessionStorage.setItem(SESSION_KEY, k ? '1' : '0'); } catch (e) {}
                        applyKill(k);
                        resolve(k);
                    })
                    .catch(function () {
                        if (timer) clearTimeout(timer);
                        // 请求失败 / 超时 → 视为 kill=0（正常）
                        try { sessionStorage.setItem(SESSION_KEY, '0'); } catch (e) {}
                        applyKill(false);
                        resolve(false);
                    });
            });
        })();
    </script>
    
    <script>
        // localStorage 沙盒兜底：某些嵌入/隐私模式下 localStorage 会抛异常
        (function () {
            try {
                var testKey = '__hxsf_ls_test__';
                localStorage.setItem(testKey, '1');
                localStorage.removeItem(testKey);
            } catch (e) {
                var memStore = {};
                Object.defineProperty(window, 'localStorage', {
                    value: {
                        getItem: function(k){ return Object.prototype.hasOwnProperty.call(memStore,k) ? memStore[k] : null; },
                        setItem: function(k,v){ memStore[k] = String(v); },
                        removeItem: function(k){ delete memStore[k]; },
                        clear: function(){ for (var k in memStore) delete memStore[k]; },
                        key: function(i){ return Object.keys(memStore)[i] || null; },
                        get length(){ return Object.keys(memStore).length; }
                    },
                    configurable: true
                });
            }
        })();
    </script>

    <script>
        (function() {
            'use strict';

            // ==================== DOM 引用 ====================
            const appContainer = document.getElementById('appContainer');
            const iframeWrapper = document.getElementById('iframeWrapper');
            const iframeTao = document.getElementById('iframeTao');
            const iframeOther = document.getElementById('iframeOther');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const statusText = document.getElementById('statusText');
            const retryBtn = document.getElementById('retryBtn');
            const themeSwitch = document.getElementById('themeSwitch');
            const tabletSwitch = document.getElementById('tabletSwitch');
            // v1.3.0 临时策略：强制卷轴模式=开，平板模式=关；与"功能维护中"提示并存
            if (themeSwitch) themeSwitch.classList.add('on');
            if (tabletSwitch) tabletSwitch.classList.remove('on');
            const bottomNav = document.getElementById('bottomNav');
            const navIndicator = document.getElementById('navIndicator');
            const overlayBg = document.getElementById('overlayBg');
            const settingsPanel = document.getElementById('settingsPanel');
            const navBtns = document.querySelectorAll('.nav-btn');
            let lastSettingsTrigger = null;
            // ===== 云控公告 DOM =====
            const announcementOverlay = document.getElementById('announcementOverlay');
            const announcementModal = document.getElementById('announcementModal');
            const annTitle = document.getElementById('annTitle');
            const annDatetime = document.getElementById('annDatetime');
            const annBody = document.getElementById('annBody');
            const annCloseBtn = document.getElementById('annCloseBtn');

            // ==================== URL 配置 ====================
            const LOCAL_BASE = (function() {
                const path = window.location.pathname;
                const lastSlash = path.lastIndexOf('/');
                return window.location.origin + (lastSlash >= 0 ? path.substring(0, lastSlash + 1) : '/');
            })();

            // 远程基础URL
            const REMOTE_BASE = '../';
            const REMOTE_BASE_V2 = REMOTE_BASE + 'v1.3.0新UI/';

            
            function getTaoUrlOff() {
                return REMOTE_BASE + 'index.html';
            }
            
            function getTaoUrlOn() {
                return REMOTE_BASE_V2 + '讨封.html';
            }
            
            function getTaoUrlLocal() {
                return LOCAL_BASE + '讨封.html';
            }

            // 其他页面URL映射
            function getOtherUrl(pageKey, themeOn) {
                if (themeOn) {
                    // 卷轴开启：v1.3.0新UI路径
                    const map = {
                        achievement: REMOTE_BASE_V2 + '成就.html',
                        about: REMOTE_BASE_V2 + '关于.html',
                        daozhu: REMOTE_BASE_V2 + '道主.html',
                        library: REMOTE_BASE_V2 + '藏经阁.html',
                        qian: REMOTE_BASE_V2 + '求签.html',
                        rank: REMOTE_BASE_V2 + '道主榜.html',
                    };
                    return map[pageKey] || null;
                } else {
                    // 卷轴关闭：原路径
                    const map = {
                        achievement: REMOTE_BASE + '成就/',
                        about: REMOTE_BASE + '关于/index.html',
                        daozhu: REMOTE_BASE + '道主.html',
                        // 新玩法只在 v1.3.0 新UI 提供,卷轴关闭时回退到新UI
                        library: REMOTE_BASE_V2 + '藏经阁.html',
                        qian: REMOTE_BASE_V2 + '求签.html',
                        rank: REMOTE_BASE_V2 + '道主榜.html',
                    };
                    return map[pageKey] || null;
                }
            }

            // ==================== 状态变量 ====================
            let playerName = '';
            let isOffline = false; 
            let wasThemeOnBeforeOffline = true; 
            let currentVisibleIframe = 'tao'; // 'tao' | 'other'
            let taoLoadedUrl = null; // 讨封iframe已加载的URL（用于判断是否需要重新加载）
            let otherLoadedPage = null; // 其他iframe当前加载的页面键名
            let otherLoadedUrl = null; // 其他iframe当前加载的URL
            let isTaoLoading = false;
            let isOtherLoading = false;
            let isInitialLoad = true;
            let sessionTimestamp = Date.now(); // 会话级时间戳，讨封URL保持稳定
            /*
{
                e.stopPropagation();
            });
{
                // 如果点击的是关闭按钮，已经由上面的监听处理了
                // 这里不做任何操作
            });
            */

            // ==================== 玩家名称 ====================
            function initPlayerName() {
                const params = new URLSearchParams(window.location.search);
                playerName = params.get('player') || '';
                if (!playerName) {
                    playerName = localStorage.getItem('playerName') || '';
                }
                if (playerName) {
                    localStorage.setItem('playerName', playerName);
                }
            }

            function appendPlayerParam(url) {
                if (!url) return url;
                let result = url;
                if (playerName) {
                    result += (result.includes('?') ? '&' : '?') + 'player=' + encodeURIComponent(playerName);
                }
                return result;
            }

            // ==================== 讨封URL构建 ====================
            function buildTaoUrl(forceLocal = false) {
                if (forceLocal || isOffline) {
                    return getTaoUrlLocal();
                }
                const themeOn = themeSwitch.classList.contains('on');
                const baseUrl = themeOn ? getTaoUrlOn() : getTaoUrlOff();
                // 讨封URL使用会话级时间戳保持稳定
                let url = baseUrl;
                url += (url.includes('?') ? '&' : '?') + '_st=' + sessionTimestamp;
                url = appendPlayerParam(url);
                return url;
            }

            // ==================== 加载遮罩 ====================
            function showLoading(text) {
                statusText.textContent = text || '仙途引路中...';
                loadingOverlay.classList.remove('hidden', 'fading-out');
                retryBtn.classList.remove('visible');
            }

            function hideLoading() {
                loadingOverlay.classList.add('fading-out');
                // 动画结束后彻底隐藏
                setTimeout(() => {
                    if (loadingOverlay.classList.contains('fading-out')) {
                        loadingOverlay.classList.add('hidden');
                        loadingOverlay.classList.remove('fading-out');
                    }
                }, 350);
            }

            function showRetryButton() {
                retryBtn.classList.add('visible');
            }

            function updateLoadingText(text) {
                statusText.textContent = text;
            }

            // ==================== 动效与导航高亮 ====================
            function animatePage(iframe) {
                if (!iframe || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                iframe.classList.remove('page-enter');
                void iframe.offsetWidth;
                iframe.classList.add('page-enter');
            }

            function updateNavIndicator() {
                const activeBtn = bottomNav.querySelector('.nav-btn.active:not(.hidden-btn)');
                if (!navIndicator || !activeBtn || activeBtn.offsetParent === null) return;
                navIndicator.style.width = activeBtn.offsetWidth + 'px';
                navIndicator.style.transform = 'translateX(' + activeBtn.offsetLeft + 'px)';
                navIndicator.classList.add('ready');
            }

            function setActiveNav(pageKey) {
                // 抽屉项（成就/道主榜/关于）归属"更多"tab；仙籍是独立主tab
                const fallbackPages = ['achievement', 'rank', 'about'];
                const activePage = fallbackPages.includes(pageKey) ? 'more' : pageKey;
                navBtns.forEach(btn => {
                    const isActive = btn.dataset.page === activePage;
                    btn.classList.toggle('active', isActive);
                    if (isActive) btn.setAttribute('aria-current', 'page');
                    else btn.removeAttribute('aria-current');
                });
                requestAnimationFrame(updateNavIndicator);
            }

            function openSettings() {
                if (isOffline) return;
                lastSettingsTrigger = document.activeElement;
                overlayBg.classList.add('show');
                overlayBg.setAttribute('aria-hidden', 'false');
                settingsPanel.classList.add('show');
                settingsPanel.setAttribute('aria-hidden', 'false');
            }

            function closeSettings() {
                overlayBg.classList.remove('show');
                overlayBg.setAttribute('aria-hidden', 'true');
                settingsPanel.classList.remove('show');
                settingsPanel.setAttribute('aria-hidden', 'true');
                if (lastSettingsTrigger && typeof lastSettingsTrigger.focus === 'function') lastSettingsTrigger.focus();
            }

            // ==================== iframe 显示切换 ====================
            function showTaoIframe() {
                if (currentVisibleIframe === 'tao') return;
                currentVisibleIframe = 'tao';
                iframeTao.classList.remove('dimmed');
                iframeOther.classList.remove('active');
                // 确保讨封iframe在DOM中可见
                iframeTao.style.display = '';
                animatePage(iframeTao);
            }

            function showOtherIframe() {
                if (currentVisibleIframe === 'other') return;
                currentVisibleIframe = 'other';
                iframeTao.classList.add('dimmed');
                iframeOther.classList.add('active');
                iframeOther.style.display = '';
                animatePage(iframeOther);
            }

            // ==================== 讨封加载 ====================
            function loadTao(forceLocal = false) {
                const url = buildTaoUrl(forceLocal);
                // 如果讨封已经加载了相同URL，不重新加载
                if (taoLoadedUrl === url && !isTaoLoading) {
                    // URL相同，无需重新加载，但需要显示讨封iframe
                    showTaoIframe();
                    hideLoading();
                    return;
                }
                // 如果正在加载相同URL，不重复触发
                if (isTaoLoading && taoLoadedUrl === url) {
                    showTaoIframe();
                    return;
                }

                isTaoLoading = true;
                taoLoadedUrl = url;
                showLoading('讨封仙籍加载中...');
                iframeTao.src = url;
                showTaoIframe();
            }

            function reloadTao() {
                // 强制重新加载讨封（卷轴模式切换时使用）
                taoLoadedUrl = null;
                isTaoLoading = false;
                loadTao(isOffline);
            }

            // ==================== 其他页面加载 ====================
            function loadOtherPage(pageKey) {
                const themeOn = themeSwitch.classList.contains('on');
                const url = getOtherUrl(pageKey, themeOn);
                if (!url) {
                    switchToTao();
                    return;
                }
                const finalUrl = appendPlayerParam(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());

                // 如果其他iframe已经加载了相同页面，不重新加载
                if (otherLoadedPage === pageKey && otherLoadedUrl === finalUrl && !isOtherLoading) {
                    showOtherIframe();
                    hideLoading();
                    return;
                }
                if (isOtherLoading && otherLoadedPage === pageKey && otherLoadedUrl === finalUrl) {
                    showOtherIframe();
                    return;
                }

                isOtherLoading = true;
                otherLoadedPage = pageKey;
                otherLoadedUrl = finalUrl;
                showLoading('仙途引路中...');
                iframeOther.src = finalUrl;
                showOtherIframe();
            }

            function switchToTao() {
                // 切回讨封（不重新加载）
                if (currentVisibleIframe === 'tao' && taoLoadedUrl) {
                    hideLoading();
                    return;
                }
                if (taoLoadedUrl) {
                    // 讨封已加载，直接显示
                    showTaoIframe();
                    hideLoading();
                } else {
                    // 讨封尚未加载，加载之
                    loadTao(isOffline);
                }
            }

            // ==================== 导航切换 ====================
            function switchPage(pageKey) {
                // 关闭设置面板
                if (settingsPanel.classList.contains('show')) closeSettings();

                // 更新导航高亮
                setActiveNav(pageKey);

                if (pageKey === 'taofeng') {
                    switchToTao();
                } else if (pageKey === 'settings') {
                    // 设置面板通过点击事件处理，这里不操作iframe
                    return;
                } else {
                    // 其他页面：无论是否联网都尝试加载（藏经阁/求签/成就等本地页面可离线运行）
                    loadOtherPage(pageKey);
                }
            }

            
            function enterOfflineMode() {
                if (isOffline) return;
                isOffline = true;
                // 断网仅作内部状态标记：讨封URL自动回落本地资源
                // 其他 tab（藏经阁/求签/成就/道主/道主榜/关于）不再隐藏，不再拦截点击
            }

            function exitOfflineMode() {
                if (!isOffline) return;
                isOffline = false;
                // 恢复联网后无需还原 UI（离线时也未做过 UI 变形）
            }

            function checkOnlineStatus() {
                const online = navigator.onLine;
                if (!online && !isOffline) {
                    enterOfflineMode();
                } else if (online && isOffline) {
                    exitOfflineMode();
                }
                return online;
            }

            // ==================== 云控公告 ====================
            const ANNOUNCEMENT_URL = 'ht'+'tps://yuju.99kpk.top:81/doc/visit.php?appid=1121&id=c5b3054bfaea';

            function parseAnnouncement(text) {
                const rawLines = text.split('\n');
                const lines = [];
                for (let i = 0; i < rawLines.length; i++) {
                    const trimmed = rawLines[i].trim();
                    if (trimmed.length > 0) lines.push(trimmed);
                }
                if (lines.length < 4) return null;

                // 第1行：去除所有空格和 // 注释
                let firstLine = lines[0].replace(/\s/g, '').replace(/\/\/.*/g, '');
                const type = parseInt(firstLine, 10);
                if (isNaN(type) || type < 0 || type > 2) return null;
                if (type === 0) return { type: 0 };

                return {
                    type: type,
                    title: lines[1] || '',
                    datetime: lines[2] || '',
                    content: lines.slice(3).join('\n')
                };
            }

            function getAnnouncementId(ann) {
                try {
                    const raw = ann.title + '|' + ann.datetime + '|' + ann.content.substring(0, 60);
                    let hash = 0;
                    for (let i = 0; i < raw.length; i++) {
                        const char = raw.charCodeAt(i);
                        hash = ((hash << 5) - hash) + char;
                        hash = hash & hash;
                    }
                    return 'ann_read_' + Math.abs(hash).toString(36);
                } catch (e) {
                    return 'ann_read_' + Date.now();
                }
            }

            function showAnnouncement(ann) {
                annTitle.textContent = ann.title;
                annDatetime.textContent = ann.datetime;
                annBody.textContent = ann.content;

                announcementModal.classList.remove('force');

                if (ann.type === 1) {
                    // 强制弹窗：无法关闭，遮罩不可点击关闭
                    announcementModal.classList.add('force');
                }

                announcementOverlay.classList.add('show');
                announcementModal.classList.add('show');
            }

            function hideAnnouncement() {
                announcementOverlay.classList.remove('show');
                announcementModal.classList.remove('show');
            }

            function fetchAnnouncement() {
                window['fet'+'ch'](ANNOUNCEMENT_URL + '&_t=' + Date.now(), {
                    method: 'GET',
                    cache: 'no-cache'
                })
                .then(function(r) { return r.text(); })
                .then(function(text) {
                    const ann = parseAnnouncement(text);
                    if (!ann) return;

                    if (ann.type === 0) {
                        // 无公告，若当前有弹窗则隐藏
                        hideAnnouncement();
                        return;
                    }

                    if (ann.type === 1) {
                        // 强制维护公告：始终显示，无法关闭
                        showAnnouncement(ann);
                    } else if (ann.type === 2) {
                        // 更新公告：仅弹一次（localStorage记录）
                        const annId = getAnnouncementId(ann);
                        const hasRead = localStorage.getItem(annId);
                        if (!hasRead) {
                            showAnnouncement(ann);
                            localStorage.setItem(annId, '1');
                        }
                    }
                })
                .catch(function() {
                    // 静默失败，不影响游戏运行
                });
            }

            // 关闭按钮（仅非强制弹窗可用）
            annCloseBtn.addEventListener('click', function() {
                if (!announcementModal.classList.contains('force')) {
                    hideAnnouncement();
                }
            });

            // 遮罩点击关闭（仅非强制弹窗可用；强制弹窗遮罩不可点击关闭）
            announcementOverlay.addEventListener('click', function(e) {
                if (e.target === announcementOverlay && !announcementModal.classList.contains('force')) {
                    hideAnnouncement();
                }
            });

            // ==================== 事件绑定 ====================

            // 讨封iframe加载完成
            iframeTao.addEventListener('load', function() {
                isTaoLoading = false;
                if (currentVisibleIframe === 'tao') {
                    hideLoading();
                }
                // 更新taoLoadedUrl为实际加载的URL
                try {
                    const actualSrc = iframeTao.contentWindow?.location?.href;
                    if (actualSrc && actualSrc !== 'about:blank') {
                        taoLoadedUrl = actualSrc;
                    }
                } catch (e) {
                    // 跨域无法读取，使用之前设置的URL
                }
                isInitialLoad = false;
            });

            // 讨封iframe加载错误
            iframeTao.addEventListener('error', function() {
                isTaoLoading = false;
                if (isOffline) {
                    
                    if (currentVisibleIframe === 'tao') {
                        updateLoadingText('讨封卷轴暂不可用');
                        showRetryButton();
                    }
                } else {
                    
                    if (!isOffline) {
                        enterOfflineMode();
                    } else if (currentVisibleIframe === 'tao') {
                        updateLoadingText('讨封加载失败');
                        showRetryButton();
                    }
                }
            });

            // 其他iframe加载完成
            iframeOther.addEventListener('load', function() {
                isOtherLoading = false;
                if (currentVisibleIframe === 'other') {
                    hideLoading();
                }
                try {
                    const actualSrc = iframeOther.contentWindow?.location?.href;
                    if (actualSrc && actualSrc !== 'about:blank') {
                        otherLoadedUrl = actualSrc;
                    }
                } catch (e) { /* 跨域 */ }
            });

            // 其他iframe加载错误
            iframeOther.addEventListener('error', function() {
                isOtherLoading = false;
                if (currentVisibleIframe === 'other') {
                    updateLoadingText('页面加载失败');
                    showRetryButton();
                }
            });

            // 重试按钮
            retryBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isOffline || currentVisibleIframe === 'tao') {
                    taoLoadedUrl = null;
                    isTaoLoading = false;
                    loadTao(isOffline);
                } else {
                    otherLoadedPage = null;
                    otherLoadedUrl = null;
                    isOtherLoading = false;
                    const pageKey = otherLoadedPage || 'achievement';
                    // 找到当前高亮的非讨封按钮
                    const activeBtn = document.querySelector('.nav-btn.active:not([data-page="taofeng"]):not([data-page="settings"])');
                    const targetPage = activeBtn ? activeBtn.dataset.page : pageKey;
                    loadOtherPage(targetPage);
                }
            });

            // ==================== 右侧抽屉（更多菜单）====================
            const drawerMask = document.getElementById('drawerMask');
            const sideDrawer = document.getElementById('sideDrawer');
            const drawerClose = document.getElementById('drawerClose');
            const drawerTriggers = bottomNav.querySelectorAll('[aria-controls="sideDrawer"]');
            let lastDrawerTrigger = null;

            function openDrawer(trigger) {
                if (isOffline) return;
                lastDrawerTrigger = trigger || document.activeElement;
                // 极窄屏（<320px）下，"仙籍"作为抽屉内独立项显示（其余尺寸下仙籍是主 tab）
                const isNarrow = window.matchMedia && window.matchMedia('(max-width: 319px)').matches;
                const daoZhuItem = sideDrawer.querySelector('.drawer-item-daozhu');
                if (daoZhuItem) daoZhuItem.style.display = isNarrow ? '' : 'none';
                drawerMask.classList.add('show');
                drawerMask.setAttribute('aria-hidden', 'false');
                sideDrawer.classList.add('show');
                sideDrawer.setAttribute('aria-hidden', 'false');
                drawerTriggers.forEach(btn => btn.setAttribute('aria-expanded', 'true'));
                setTimeout(function() { if (drawerClose) drawerClose.focus(); }, 120);
            }
            function closeDrawer() {
                drawerMask.classList.remove('show');
                drawerMask.setAttribute('aria-hidden', 'true');
                sideDrawer.classList.remove('show');
                sideDrawer.setAttribute('aria-hidden', 'true');
                drawerTriggers.forEach(btn => btn.setAttribute('aria-expanded', 'false'));
                if (lastDrawerTrigger && typeof lastDrawerTrigger.focus === 'function') lastDrawerTrigger.focus();
            }

            // 点遮罩关闭抽屉
            if (drawerMask) drawerMask.addEventListener('click', closeDrawer);
            if (drawerClose) drawerClose.addEventListener('click', closeDrawer);

            // ESC 关闭抽屉 / 设置面板
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sideDrawer.classList.contains('show')) closeDrawer();
                else if (e.key === 'Escape' && settingsPanel.classList.contains('show')) closeSettings();
            });

            // 点抽屉里的项 → 关闭并跳转
            if (sideDrawer) {
                sideDrawer.addEventListener('click', function(e) {
                    const item = e.target.closest('.drawer-item');
                    if (!item || !item.dataset.target) return;
                    const target = item.dataset.target;
                    closeDrawer();
                    if (target === 'settings') {
                        openSettings();
                    } else {
                        switchPage(target);
                    }
                });
            }

            // 导航栏点击
            bottomNav.addEventListener('click', function(e) {
                const btn = e.target.closest('.nav-btn');
                if (!btn || !btn.dataset.page) return;

                const pageKey = btn.dataset.page;
                // "更多" / 极窄屏合并按钮 → 打开抽屉，不切换 iframe、不改高亮
                if (pageKey === 'more' || pageKey === 'more-merge') {
                    openDrawer(btn);
                    return;
                }

                if (pageKey === 'settings') {
                    openSettings();
                    return;
                }

                if (pageKey === 'taofeng') {
                    // 切回讨封，不重新加载
                    switchToTao();
                    setActiveNav('taofeng');
                } else {
                    switchPage(pageKey);
                }
            });

            // 设置面板
            document.getElementById('closeSettingsBtn').addEventListener('click', function() {
                closeSettings();
            });
            overlayBg.addEventListener('click', function() {
                closeSettings();
            });

            // 导航指示器随布局变化重算
            window.addEventListener('resize', updateNavIndicator, { passive: true });
            if ('ResizeObserver' in window) {
                new ResizeObserver(updateNavIndicator).observe(bottomNav);
            }
            if ('MutationObserver' in window) {
                new MutationObserver(updateNavIndicator).observe(document.documentElement, {
                    attributes: true,
                    attributeFilter: ['class']
                });
            }

            // 卷轴模式开关
            themeSwitch.addEventListener('click', function() {
                // 皮质卷轴 —— 功能维护中，点击给轻提示不再切换
                if (typeof showToast === 'function') showToast('暂不可用');
                else { var t = document.getElementById('appToast'); if (t) { t.textContent = '暂不可用'; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 1500); } }
            });

            // 平板模式开关
            tabletSwitch.addEventListener('click', function() {
                // 平板模式 —— 功能维护中，点击给轻提示不再切换
                if (typeof showToast === 'function') showToast('暂不可用');
                else { var t = document.getElementById('appToast'); if (t) { t.textContent = '暂不可用'; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 1500); } }
            });

            
            window.addEventListener('online', function() {
                if (isOffline) exitOfflineMode();
            });
            window.addEventListener('offline', function() {
                if (!isOffline) enterOfflineMode();
            });

            // 页面可见性变化时检测
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    const online = navigator.onLine;
                    if (!online && !isOffline) {
                        enterOfflineMode();
                    } else if (online && isOffline) {
                        exitOfflineMode();
                    }
                }
            });

            
            setInterval(function() {
                const online = navigator.onLine;
                if (!online && !isOffline) {
                    enterOfflineMode();
                } else if (online && isOffline) {
                    exitOfflineMode();
                }
            }, 30000);

            // ==================== 初始化 ====================
            function init() {
                initPlayerName();

                // 初始时其他iframe隐藏
                iframeOther.style.display = '';
                iframeOther.classList.remove('active');
                iframeTao.classList.remove('dimmed');
                currentVisibleIframe = 'tao';

                const online = navigator.onLine;
                if (!online) {
                    
                    enterOfflineMode();
                    // 确保讨封加载本地版本
                    taoLoadedUrl = null;
                    isTaoLoading = false;
                    loadTao(true);
                } else {
                    isOffline = false;
                    appContainer.classList.remove('offline-mode');
                    // 正常加载讨封
                    loadTao(false);
                    // 高亮讨封按钮
                    setActiveNav('taofeng');
                }

                // 延迟二次检测
                setTimeout(function() {
                    if (!navigator.onLine && !isOffline) {
                        enterOfflineMode();
                        taoLoadedUrl = null;
                        isTaoLoading = false;
                        loadTao(true);
                    } else if (navigator.onLine && isOffline) {
                        exitOfflineMode();
                    } else if (navigator.onLine) {
                    }
                }, 600);

                // ===== 云控公告：进入页面立刻检测一次 =====
                fetchAnnouncement();
                // 每30秒轮询一次
                setInterval(fetchAnnouncement, 30000);

                // 首帧后校准导航指示器位置
                requestAnimationFrame(updateNavIndicator);
            }

            init();
        })();
    </script>
</body>
