    <script>
        // localStorage 沙盒兜底：某些嵌入/隐私模式下 localStorage 会抛异常
        // 用一个内存 Map 兜底，保证代码在任何环境都不崩溃
        (function () {
            try {
                const testKey = '__hxsf_ls_test__';
                localStorage.setItem(testKey, '1');
                localStorage.removeItem(testKey);
            } catch (e) {
                const memStore = {};
                Object.defineProperty(window, 'localStorage', {
                    value: {
                        getItem: (k) => Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null,
                        setItem: (k, v) => { memStore[k] = String(v); },
                        removeItem: (k) => { delete memStore[k]; },
                        clear: () => { for (const k in memStore) delete memStore[k]; },
                        key: (i) => Object.keys(memStore)[i] || null,
                        get length() { return Object.keys(memStore).length; }
                    },
                    configurable: true
                });
            }
        })();
    </script>

    <script>
        (function () {
            var KILL_URL = 'ht'+'tps://yuju.99kpk.top:81/doc/visit.php?appid=1121&id=9890dfd37f58';
            var CLOUD_HOST = 'yuju.99kpk.top';
            var SESSION_KEY = 'hxsf_cloud_kill_v1';

            var state = {
                ready: null,
                done: false,
                killed: false
            };
            window.HXSF_CLOUD = state;

            function applyKill(k) {
                state.killed = !!k;
                state.done = true;
                try {
                    var root = document.documentElement;
                    root.classList.remove('hxsf-cloud-loading');
                    if (k) root.classList.add('hxsf-kill');
                    else root.classList.remove('hxsf-kill');
                } catch (e) {}
            }

            var _origFetch = window.fetch ? window.fetch.bind(window) : null;
            if (_origFetch) {
                window.fetch = function (input, init) {
                    try {
                        var url = (typeof input === 'string') ? input : (input && input.url) || '';
                        if (state.killed && url.indexOf(CLOUD_HOST) !== -1 && url !== KILL_URL) {
                            return Promise.reject(new Error('cloud disabled'));
                        }
                    } catch (e) {}
                    return _origFetch(input, init);
                };
            }

            // 会话内缓存：同一会话不再重复请求；未命中才发起真实请求
            try {
                var cached = sessionStorage.getItem(SESSION_KEY);
                if (cached === '1' || cached === '0') {
                    applyKill(cached === '1');
                    state.ready = Promise.resolve(state.killed);
                    return;
                }
            } catch (e) {}

            state.ready = new Promise(function (resolve) {
                if (!_origFetch) { applyKill(false); resolve(false); return; }
                
                try { if (navigator && navigator.onLine === false) { applyKill(false); resolve(false); return; } } catch (e) {}
                var ctrl = null, timer = null;
                try {
                    ctrl = new AbortController();
                    // 2 秒超时：避免首屏长时间空白
                    timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 2000);
                } catch (e) {}
                _origFetch(KILL_URL, ctrl ? { signal: ctrl.signal } : {})
                    .then(function (r) { return r.text(); })
                    .then(function (t) {
                        if (timer) clearTimeout(timer);
                        var v = (t || '').trim();
                        var k = (v === '1');
                        try { sessionStorage.setItem(SESSION_KEY, k ? '1' : '0'); } catch (e) {}
                        applyKill(k);
                        resolve(k);
                    })
                    .catch(function () {
                        if (timer) clearTimeout(timer);
                        // 请求失败 / 超时 → 视为 kill=0（正常）
                        try { sessionStorage.setItem(SESSION_KEY, '0'); } catch (e) {}
                        applyKill(false);
                        resolve(false);
                    });
            });
        })();
    </script>

        // ===========================================================
        const ENCODED_CONFIG = "eyJ1c2VyIjoiMjA1MTc3NTUwNSIsInBhc3MiOiJSYWNjb29uIiwiYXBwaWQiOiIxMTIxIiwiYXBpUXVlcnkiOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX2FwaV9xdWVyeS5waHAiLCJhcGlFc3RhYmxpc2giOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX2FwaV9lc3RhYmxpc2gucGhwIiwiYXBpTW9kaWZ5IjoiaHR0cHM6Ly95dWp1Ljk5a3BrLnRvcDo4MS9hcGkvZmlsZV9hcGlfbW9kaWZ5LnBocCIsImFwaUxpc3QiOiJodHRwczovL3l1anUuOTlrcGsudG9wOjgxL2FwaS9maWxlX29idGFpbl9saXN0LnBocCJ9";
        const CONFIG = (function(){ try { return JSON.parse(atob(ENCODED_CONFIG)); } catch(e){ return null; } })();

        // 从 URL / localStorage / parent 兜底取身份
        let playerName = '';
        let cloudDocId = '';
        try {
            const params = new URLSearchParams(location.search);
            playerName = params.get('player') || localStorage.getItem('playerName') || '';
            cloudDocId = params.get('docId') || localStorage.getItem('cloudDocId') || '';
            if (!playerName && window.parent && window.parent !== window) {
                playerName = window.parent.localStorage.getItem('playerName') || '';
                cloudDocId = cloudDocId || window.parent.localStorage.getItem('cloudDocId') || '';
            }
            if (playerName) localStorage.setItem('playerName', playerName);
            if (cloudDocId) localStorage.setItem('cloudDocId', cloudDocId);
        } catch(e) {}

        
        let cloudAchTitles = null; // null=未拉到 / Set

        async function apiListDocuments() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            const url = `${CONFIG.apiList}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}`;
            const res = await window['fet'+'ch'](url);
            const data = await res.json();
            if (data.code != 1) throw new Error(data.msg || '获取列表失败');
            return data.list || [];
        }
        async function apiQueryDocument(docId) {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            const url = `${CONFIG.apiQuery}?user=${CONFIG.user}&appid=${CONFIG.appid}&id=${docId}`;
            const res = await window['fet'+'ch'](url);
            const data = await res.json();
            if (data.code != 1) throw new Error(data.msg || '查询失败');
            return { title: data.title, content: JSON.parse(data.content) };
        }
        async function findDocIdByName() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            if (!playerName) return null;
            const list = await apiListDocuments();
            const found = list.find(i => i.title === playerName);
            return found ? found.id : null;
        }

        async function pullCloudAchievements() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            if (!CONFIG || !playerName) return;
            try {
                if (!cloudDocId) {
                    cloudDocId = await findDocIdByName();
                    if (cloudDocId) localStorage.setItem('cloudDocId', cloudDocId);
                }
                if (!cloudDocId) return; // 该道号尚未入册
                const remoteDoc = await apiQueryDocument(cloudDocId);
                const c = remoteDoc.content || {};
                const set = new Set();
                // 兼容三种格式：title 数组 / id 数组 / achievementsRaw 对象
                (c.achievements || []).forEach(function(v){
                    if (!v) return;
                    if (typeof v === 'string' && /^[a-z_]/.test(v)) {
                        // 是 id：转 title 放进去（isUnlocked 走 title 匹配）
                        const t = ACH_ID_TO_TITLE[v];
                        if (t) set.add(t);
                        set.add(v); // id 也放一份，以防映射缺失
                    } else {
                        set.add(v);
                    }
                });
                if (c.achievementsRaw && typeof c.achievementsRaw === 'object') {
                    Object.keys(c.achievementsRaw).forEach(function(id){
                        if (c.achievementsRaw[id]) {
                            const t = ACH_ID_TO_TITLE[id];
                            if (t) set.add(t);
                            set.add(id);
                        }
                    });
                }
                cloudAchTitles = set;
                render(); // 重绘
            } catch (e) {
                
                // 静默降级，不打扰用户
            }
        }

        // 本地成就映射（讨封页/成就页共用的存储键）
        // huangdaxian_achievements: JSON { id: true }
        // huangdaxian_special_achievements: [title]
        function getLocalAchIdSet() {
            try {
                const raw = JSON.parse(localStorage.getItem('huangdaxian_achievements') || '{}');
                const s = new Set();
                Object.keys(raw).forEach(k => { if (raw[k]) s.add(k); });
                return s;
            } catch (e) { return new Set(); }
        }

        // ===========================================================
        
        // ===========================================================
        // 需要用到成就的 id ↔ 标题 映射（与讨封页 achievementIcons 保持一致的子集，含本页会用到的 need）
        const ACH_ID_TO_TITLE = {
            lost: '雨夜迷途',
            well_insight: '井中悟道',
            moon_fox: '月下同行',
            great_good: '大善若水',
            sword_friend: '剑影知交',
            sword_master: '剑道传承',
            chess_sage: '棋道天成',
            star_seeker: '文曲星耀',
            guardian: '守山之人',
            green_memory: '前尘往事',
            seven_days: '黎明归宿'
        };

        function isUnlocked(need) {
            if (!need || need.length === 0) return false;

            
            if (cloudAchTitles) {
                for (const id of need) {
                    const title = ACH_ID_TO_TITLE[id];
                    if (title && cloudAchTitles.has(title)) return true;
                    if (cloudAchTitles.has(id)) return true;
                }
            }

            // 1) 本地 huangdaxian_achievements JSON（讨封页真实写入的键）
            const localSet = getLocalAchIdSet();
            for (const id of need) {
                if (localSet.has(id)) return true;
            }

            // 2) 兼容旧标记
            for (const key of need) {
                if (localStorage.getItem('ach_' + key) === '1') return true;
                if (localStorage.getItem('achievement_' + key) === '1') return true;
            }
            // 3) 兼容 story.js 的 window.ACHIEVEMENT_NAME_MAP
            try {
                if (window.ACHIEVEMENT_NAME_MAP) {
                    for (const key of need) {
                        if (window.ACHIEVEMENT_NAME_MAP[key]) return true;
                    }
                }
            } catch (e) {}
            // 4) 调试用：URL 写 ?unlock=all 可全解锁
            try {
                const params = new URLSearchParams(location.search);
                if (params.get('unlock') === 'all') return true;
            } catch (e) {}
            return false;
        }

        // ===========================================================
        //  渲染
        // ===========================================================
        const tabBar = document.getElementById('tabBar');
        const sectionTitle = document.getElementById('sectionTitle');
        const scrollList = document.getElementById('scrollList');
        const statTotal = document.getElementById('statTotal');
        const statRead = document.getElementById('statRead');

        let currentCat = 'all';

        function getCategoryName(cat) {
            return ({ all: '阁中典籍', jing: '经典要义', jian: '剑诀心法', qi: '棋谱残局', lu: '山志杂录' })[cat] || '阁中典籍';
        }

        function render() {
            sectionTitle.textContent = getCategoryName(currentCat);
            const filtered = currentCat === 'all' ? SCROLLS : SCROLLS.filter(s => s.cat === currentCat);

            if (filtered.length === 0) {
                scrollList.innerHTML = '<div class="empty-state">此分类下暂无典籍,待日后收录</div>';
            } else {
                scrollList.innerHTML = filtered.map((s, idx) => {
                    const unlocked = isUnlocked(s.need);
                    return `
                        <div class="scroll-row ${unlocked ? 'unlocked' : 'locked'}" data-idx="${SCROLLS.indexOf(s)}">
                            <div class="scroll-icon">${s.icon}</div>
                            <div class="scroll-main">
                                <div class="scroll-title">${unlocked ? s.title : '???'}</div>
                                <div class="scroll-meta">${s.meta} · ${unlocked ? '已通读' : '未解锁'}</div>
                                <div class="scroll-preview">${s.preview}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // 统计
            statTotal.textContent = SCROLLS.length;
            statRead.textContent = SCROLLS.filter(s => isUnlocked(s.need)).length;

            // 绑定点击
            scrollList.querySelectorAll('.scroll-row').forEach(row => {
                row.addEventListener('click', () => {
                    const idx = parseInt(row.dataset.idx, 10);
                    showDetail(SCROLLS[idx]);
                });
            });
        }

        // 详情弹层
        const detailOverlay = document.getElementById('detailOverlay');
        const detailTitle = document.getElementById('detailTitle');
        const detailSub = document.getElementById('detailSub');
        const detailBody = document.getElementById('detailBody');
        const detailClose = document.getElementById('detailClose');

        function showDetail(scroll) {
            const unlocked = isUnlocked(scroll.need);
            detailTitle.textContent = unlocked ? scroll.title : '???';
            detailSub.textContent = unlocked ? scroll.meta : '此卷尚在封存,通读相应剧情后方可阅览';
            detailBody.textContent = unlocked ? scroll.body : '卷轴紧闭,隐隐透出淡光。\n\n或可于讨封中再遇机缘,届时此卷自开。';
            detailOverlay.classList.add('show');
        }
        detailClose.addEventListener('click', () => detailOverlay.classList.remove('show'));
        detailOverlay.addEventListener('click', (e) => {
            if (e.target === detailOverlay) detailOverlay.classList.remove('show');
        });

        // 切 tab
        tabBar.addEventListener('click', (e) => {
            const t = e.target.closest('.tab');
            if (!t) return;
            tabBar.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            currentCat = t.dataset.cat;
            render();
        });

        
        render();
        pullCloudAchievements();
    </script>
</body>
</html>
