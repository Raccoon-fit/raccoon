    <script>
        
        // 等 kill switch 探测完成后按结果放开或隐藏。避免"先亮再消失"的闪烁。
        document.documentElement.classList.add('hxsf-cloud-loading');
    </script>
    <style>
        /* kill=1 或探测未完成时，隐藏所有 hxsf-cloud-only 元素 */
        html.hxsf-kill .hxsf-cloud-only,
        html.hxsf-cloud-loading .hxsf-cloud-only { display: none !important; }
    </style>
    <script>
        (function () {
            var KILL_URL = 'ht'+'tps://yuju.99kpk.top:81/doc/visit.php?appid=1121&id=9890dfd37f58';
            var CLOUD_HOST = 'yuju.99kpk.top';
            var SESSION_KEY = 'hxsf_cloud_kill_v1';

            var state = {
                ready: null,
                done: false,
                killed: false
            };
            window.HXSF_CLOUD = state;

            function applyKill(k) {
                state.killed = !!k;
                state.done = true;
                try {
                    var root = document.documentElement;
                    root.classList.remove('hxsf-cloud-loading');
                    if (k) root.classList.add('hxsf-kill');
                    else root.classList.remove('hxsf-kill');
                } catch (e) {}
            }

            var _origFetch = window.fetch ? window.fetch.bind(window) : null;
            if (_origFetch) {
                window.fetch = function (input, init) {
                    try {
                        var url = (typeof input === 'string') ? input : (input && input.url) || '';
                        if (state.killed && url.indexOf(CLOUD_HOST) !== -1 && url !== KILL_URL) {
                            return Promise.reject(new Error('cloud disabled'));
                        }
                    } catch (e) {}
                    return _origFetch(input, init);
                };
            }

            // 会话内缓存：同一会话不再重复请求；未命中才发起真实请求
            try {
                var cached = sessionStorage.getItem(SESSION_KEY);
                if (cached === '1' || cached === '0') {
                    applyKill(cached === '1');
                    state.ready = Promise.resolve(state.killed);
                    return;
                }
            } catch (e) {}

            state.ready = new Promise(function (resolve) {
                if (!_origFetch) { applyKill(false); resolve(false); return; }
                
                try { if (navigator && navigator.onLine === false) { applyKill(false); resolve(false); return; } } catch (e) {}
                var ctrl = null, timer = null;
                try {
                    ctrl = new AbortController();
                    // 2 秒超时：避免首屏长时间空白
                    timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 2000);
                } catch (e) {}
                _origFetch(KILL_URL, ctrl ? { signal: ctrl.signal } : {})
                    .then(function (r) { return r.text(); })
                    .then(function (t) {
                        if (timer) clearTimeout(timer);
                        var v = (t || '').trim();
                        var k = (v === '1');
                        try { sessionStorage.setItem(SESSION_KEY, k ? '1' : '0'); } catch (e) {}
                        applyKill(k);
                        resolve(k);
                    })
                    .catch(function () {
                        if (timer) clearTimeout(timer);
                        // 请求失败 / 超时 → 视为 kill=0（正常）
                        try { sessionStorage.setItem(SESSION_KEY, '0'); } catch (e) {}
                        applyKill(false);
                        resolve(false);
                    });
            });
        })();
    </script>
    
    <script>
        // localStorage 沙盒兜底：某些嵌入/隐私模式下 localStorage 会抛异常
        (function () {
            try {
                var testKey = '__hxsf_ls_test__';
                localStorage.setItem(testKey, '1');
                localStorage.removeItem(testKey);
            } catch (e) {
                var memStore = {};
                Object.defineProperty(window, 'localStorage', {
                    value: {
                        getItem: function(k){ return Object.prototype.hasOwnProperty.call(memStore,k) ? memStore[k] : null; },
                        setItem: function(k,v){ memStore[k] = String(v); },
                        removeItem: function(k){ delete memStore[k]; },
                        clear: function(){ for (var k in memStore) delete memStore[k]; },
                        key: function(i){ return Object.keys(memStore)[i] || null; },
                        get length(){ return Object.keys(memStore).length; }
                    },
                    configurable: true
                });
            }
        })();
    </script>

            async function apiListDocuments() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
                const url = `${CONFIG.apiList}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}`;
                const res = await window['fet'+'ch'](url);
                const data = await res.json();
                if (data.code != 1) throw new Error(data.msg || '获取列表失败');
                return data.list || [];
            }
            // ==================== 密码机制 ====================
            // 与旧版 v1.2.0新UI/道主.html 完全一致的 djb2 变体散列
            // 用途：把明文密令散列成整数字符串后作为 passwordHash 上云；不可逆
            function hashPassword(pwd) {
                let hash = 0;
                for (let i = 0; i < pwd.length; i++) {
                    hash = (hash << 5) - hash + pwd.charCodeAt(i);
                    hash |= 0;
                }
                return hash.toString();
            }

            
            async function getDocInfoByTitle(title) {
                if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return null;
                const docId = await findDocByTitle(title);
                if (!docId) return null;
                try {
                    const doc = await apiQueryDocument(docId);
                    return { id: docId, content: doc.content || {} };
                } catch (e) {
                    return { id: docId, content: null };
                }
            }

            async function apiQueryDocument(docId) {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
                const url = `${CONFIG.apiQuery}?user=${CONFIG.user}&appid=${CONFIG.appid}&id=${docId}`;
                const res = await window['fet'+'ch'](url);
                const data = await res.json();
                if (data.code != 1) throw new Error(data.msg || '查询文档失败');
                let content;
                try { content = JSON.parse(data.content); } catch(e) { content = {}; }
                return { title: data.title, content: content };
            }
            async function apiModifyDocument(docId, title, contentObj) {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
                const url = `${CONFIG.apiModify}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}&id=${docId}`;
                const body = `title=${encodeURIComponent(title)}&content=${encodeURIComponent(JSON.stringify(contentObj, null, 2))}`;
                const res = await window['fet'+'ch'](url, {
                    method: 'POST',
                    headers: {'Content-Type':'application/x-www-form-urlencoded'},
                    body: body
                });
                const data = await res.json();
                if (data.code != 1) throw new Error(data.msg || '修改文档失败');
            }
            async function apiEstablishDocument(title, contentObj) {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
                const url = `${CONFIG.apiEstablish}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}`;
                const body = `title=${encodeURIComponent(title)}&content=${encodeURIComponent(JSON.stringify(contentObj, null, 2))}`;
                const res = await window['fet'+'ch'](url, {
                    method: 'POST',
                    headers: {'Content-Type':'application/x-www-form-urlencoded'},
                    body: body
                });
                const data = await res.json();
                if (data.code != 1) throw new Error(data.msg || '创建文档失败');
                return data.id || data.data;
            }
            async function findDocByTitle(title) {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
                if (!title) return null;
                const list = await apiListDocuments();
                const found = list.find(item => item.title === title);
                return found ? found.id : null;
            }

            function readLocal(k, def) {
                const v = localStorage.getItem(k);
                return v === null ? def : v;
            }
            function readLocalJSON(k, def) {
                const v = localStorage.getItem(k);
                if (v === null) return def;
                try { return JSON.parse(v); } catch(e) { return def; }
            }
            // id ↔ 中文标题 映射表（与讨封页 achievementIcons 保持一致）
            const ACH_ID_TITLE_MAP = {
                witness:'无对无错，善良依旧', sacrifice:'舍身成仁', seven_days:'七日圆满，本相归真',
                empty_face:'空相无相', true:'本相自在', god:'点化成仙', mortal:'尘世轮回',
                fail_scholar:'功亏一篑', fail_kid:'原形毕露', farmer:'山野村夫', star:'文曲星耀',
                demon_king:'妖王之路', mad:'执念成魔', love:'红尘情缘', guardian:'守山之人',
                lost:'雨夜迷途', severed:'断缘而去', dawn:'黎明归宿', sword_friend:'剑影知交',
                sword_master:'剑道传承', green_memory:'前尘往事', great_good:'大善若水',

            function buildLocalSnapshot() {
                // 与讨封页 autoSyncToCloud 上传结构一致：achievements 是"中文标题数组"
                const achievementsObj = readLocalJSON(KEY_ACHIEVEMENTS, {});
                const achievementTitles = Object.keys(achievementsObj)
                    .filter(k => achievementsObj[k])
                    .map(k => ACH_ID_TITLE_MAP[k] || k); // id → title；未知 id 保留原值
                const _cloudKilled = !!(window.HXSF_CLOUD && window.HXSF_CLOUD.killed);
                return Object.assign({
                    playerName: playerName,
                    achievements: achievementTitles,       // 上传为 title 数组（与讨封/成就页一致）
                    achievementsRaw: achievementsObj,      // 备份完整 id → bool 对象
                    specialAchievements: readLocalJSON(KEY_SPECIAL_ACH, []),
                    specialNotes: readLocalJSON(KEY_SPECIAL_NOTES, {}),
                    storyNode: readLocal(KEY_STORY_NODE, 'start'),
                    lingYun: parseInt(readLocal(KEY_LING_YUN, '100')),
                    zhuoNian: parseInt(readLocal(KEY_ZHUO_NIAN, '0')),
                    cultivation: CULTIVATION_MAP_LOCAL[readLocal(KEY_STORY_NODE, 'start')] || '五百年',
                    cultivationRank: CULTIVATION_RANK_LOCAL[CULTIVATION_MAP_LOCAL[readLocal(KEY_STORY_NODE, 'start')] || '五百年'] || 500,
                    // 密码散列（从本地 savedPasswordHash 读；用于验证仙籍归属）
                    
                    ...(localStorage.getItem('savedPasswordHash') ? { passwordHash: localStorage.getItem('savedPasswordHash') } : {}),
                    updateTime: Date.now()
                }, _cloudKilled ? {} : {
                    
                    usedCodes: readLocalJSON(KEY_USED_CODES, [])
                });
            }

            
            async function pushCloudSave() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
                if (!playerName) throw new Error('道号未立');
                if (!cloudDocId) {
                    const foundId = await findDocByTitle(playerName);
                    if (foundId) { cloudDocId = foundId; localStorage.setItem(KEY_CLOUD_DOC_ID, cloudDocId); }
                }
                if (!cloudDocId) {
                    
                    const newId = await apiEstablishDocument(playerName, buildLocalSnapshot());
                    cloudDocId = newId;
                    localStorage.setItem(KEY_CLOUD_DOC_ID, cloudDocId);
                    localStorage.setItem(KEY_LAST_CLOUD_TIME, Date.now().toString());
                    return;
                }
                await apiModifyDocument(cloudDocId, playerName, buildLocalSnapshot());
                localStorage.setItem(KEY_LAST_CLOUD_TIME, Date.now().toString());
            }

            async function pullCloudSave() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
                if (!playerName) throw new Error('道号未立');
                if (!cloudDocId) {
                    const foundId = await findDocByTitle(playerName);
                    if (foundId) { cloudDocId = foundId; localStorage.setItem(KEY_CLOUD_DOC_ID, cloudDocId); }
                }
                if (!cloudDocId) throw new Error('\u4e91\u7aef\u672a\u5bfb\u5f97\u6b64\u9053\u53f7\u4ed9\u7c4d');
                const doc = await apiQueryDocument(cloudDocId);
                const remote = doc.content || {};

                // 合并成就（兼容三种远端格式）
                const localAch = readLocalJSON(KEY_ACHIEVEMENTS, {});
                const mergedAch = { ...localAch };
                // ① achievementsRaw 对象
                if (remote.achievementsRaw && typeof remote.achievementsRaw === 'object') {
                    Object.keys(remote.achievementsRaw).forEach(id => {
                        if (remote.achievementsRaw[id]) mergedAch[id] = true;
                    });
                }
                // ② achievements 数组（title 或 id）
                if (Array.isArray(remote.achievements)) {
                    // 建 title → id 反向索引
                    const titleToId = {};
                    Object.keys(ACH_ID_TITLE_MAP).forEach(id => { titleToId[ACH_ID_TITLE_MAP[id]] = id; });
                    remote.achievements.forEach(v => {
                        if (!v) return;
                        if (titleToId[v]) { mergedAch[titleToId[v]] = true; return; }
                        // 英文/下划线开头视为 id
                        if (typeof v === 'string' && /^[a-z_]/.test(v)) mergedAch[v] = true;
                    });
                }
                localStorage.setItem(KEY_ACHIEVEMENTS, JSON.stringify(mergedAch));
                
                if (Array.isArray(remote.specialAchievements)) {
                    const localSp = readLocalJSON(KEY_SPECIAL_ACH, []);
                    const merged = Array.from(new Set([...localSp, ...remote.specialAchievements]));
                    localStorage.setItem(KEY_SPECIAL_ACH, JSON.stringify(merged));
                }
                if (remote.specialNotes && typeof remote.specialNotes === 'object') {
                    const localNotes = readLocalJSON(KEY_SPECIAL_NOTES, {});
                    localStorage.setItem(KEY_SPECIAL_NOTES, JSON.stringify({ ...localNotes, ...remote.specialNotes }));
                }
                if (Array.isArray(remote.usedCodes) && !(window.HXSF_CLOUD && window.HXSF_CLOUD.killed)) {
                    const localCodes = readLocalJSON(KEY_USED_CODES, []);
                    const merged = Array.from(new Set([...localCodes, ...remote.usedCodes]));
                    localStorage.setItem(KEY_USED_CODES, JSON.stringify(merged));
                }
                if (remote.storyNode)          localStorage.setItem(KEY_STORY_NODE, remote.storyNode);
                if (remote.lingYun !== undefined)  localStorage.setItem(KEY_LING_YUN, String(remote.lingYun));
                if (remote.zhuoNian !== undefined) localStorage.setItem(KEY_ZHUO_NIAN, String(remote.zhuoNian));
                if (remote.playerName) {
                    playerName = remote.playerName;
                    localStorage.setItem(KEY_PLAYER_NAME, playerName);
                }
                localStorage.setItem(KEY_LAST_CLOUD_TIME, Date.now().toString());
            }

            // ==================== 视图切换 ====================
            function formatTime(ts) {
                if (!ts) return '尚未同步';
                const t = parseInt(ts);
                if (!t) return '尚未同步';
                const d = new Date(t);
                const pad = n => (n < 10 ? '0' + n : '' + n);
                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }
            function renderPanel() {
                loginSection.style.display = 'none';
                userInfoPanel.style.display = 'block';

                displaySyncTime.textContent = formatTime(localStorage.getItem(KEY_LAST_CLOUD_TIME));
                docIdLine.textContent = cloudDocId ? `仙籍编号：${cloudDocId}` : '';
            }

                userInfoPanel.style.display = 'none';
                loginSection.style.display = 'block';
                loadingTip.style.display = 'none';
                registerBtn.disabled = false;
                daoHaoInput.value = '';

            // ==================== 入册流程（两步：道号 → 密令）====================
            
            // step 1: 输入密令；点"验证密令 / 录入仙籍"→ hash 后比对/上云
            let loginStep = 0;          // 0 = 输道号；1 = 输密令
            let pendingDocInfo = null;  

            function resetLoginForm() {
                loginStep = 0;
                pendingDocInfo = null;
                daoHaoInput.value = '';
                miMaInput.value = '';
                daoHaoInput.disabled = false;
                passwordGroup.style.display = 'none';
                backStepBtn.style.display = 'none';
                registerBtn.textContent = '下 一 步';
                loginHint.textContent = '尚未入册';
                setLoading(false);
            }

            function switchToStep1(hasExistingDoc) {
                loginStep = 1;
                daoHaoInput.disabled = true;
                passwordGroup.style.display = 'block';
                backStepBtn.style.display = 'inline-block';
                if (hasExistingDoc) {
                    loginHint.textContent = '寻得旧籍，请核验密令';
                    registerBtn.textContent = '验 证 密 令';
                } else {
                    loginHint.textContent = '\u4e91\u7aef\u672a\u5bfb\u5f97\u6b64\u9053\u53f7\uff0c\u8bf7\u8bbe\u4e00\u5bc6\u4ee4\u65b0\u5f00\u4ed9\u7c4d';
                    registerBtn.textContent = '录 入 仙 籍';
                }
                setTimeout(() => miMaInput.focus(), 50);
            }

            backStepBtn.addEventListener('click', () => {
                resetLoginForm();
                setTimeout(() => daoHaoInput.focus(), 50);
            });

            registerBtn.addEventListener('click', async () => {
                if (registerBtn.disabled) return;

                
                if (loginStep === 0) {
                    const name = daoHaoInput.value.trim();
                    if (!name) { customAlert('黄小仙：道号不可为空。'); return; }
                    if (name.length > 20) { customAlert('黄小仙：道号过长，二十字以内为宜。'); return; }

                    setLoading(true, '\u6b63\u5728\u6838\u9a8c\u4e91\u7aef\u4ed9\u7c4d\u2026');
                    try {
                        pendingDocInfo = await getDocInfoByTitle(name);
                        setLoading(false);
                        switchToStep1(!!(pendingDocInfo && pendingDocInfo.id));
                    } catch (e) {
                        setLoading(false);
                        customAlert('黄小仙：仙途感应紊乱 — ' + (e.message || '未知'));
                    }
                    return;
                }

                // ===== step 1：输入密令 → 校验/新建 =====
                const name = daoHaoInput.value.trim();
                const miMa = miMaInput.value;
                if (!miMa || miMa.length < 4) {
                    customAlert('黄小仙：密令至少 4 位。');
                    miMaInput.focus();
                    return;
                }
                const inputHash = hashPassword(miMa);

                setLoading(true, pendingDocInfo && pendingDocInfo.id ? '正在核验密令…' : '正在录入仙籍…');
                try {
                    if (pendingDocInfo && pendingDocInfo.id) {
                        // === 已有档 → 校验 ===
                        const remoteHash = pendingDocInfo.content && pendingDocInfo.content.passwordHash;
                        if (!remoteHash) {
                            
                            playerName = name;
                            cloudDocId = pendingDocInfo.id;
                            localStorage.setItem(KEY_PLAYER_NAME, playerName);
                            localStorage.setItem(KEY_CLOUD_DOC_ID, cloudDocId);
                            localStorage.setItem('savedPasswordHash', inputHash);
                            setLoading(true, '寻得旧籍，正在接续…');
                            try { await pullCloudSave(); } catch(e) {}
                            
                            try { await pushCloudSave(); } catch(e) {}
                            setLoading(false);
                            resetLoginForm();
                            renderPanel();
                            customAlert('黄小仙：旧档接续成功。此档原未设密令，已为你设为本次输入之令，请牢记。');
                            return;
                        }
                        // 正常校验
                        if (remoteHash !== inputHash) {
                            setLoading(false);
                            customAlert('黄小仙：密令不合，请重试。');
                            miMaInput.value = '';
                            miMaInput.focus();
                            return;
                        }
                        // 校验通过 → 绑定 + 拉取
                        playerName = name;
                        cloudDocId = pendingDocInfo.id;
                        localStorage.setItem(KEY_PLAYER_NAME, playerName);
                        localStorage.setItem(KEY_CLOUD_DOC_ID, cloudDocId);
                        localStorage.setItem('savedPasswordHash', inputHash);
                        setLoading(true, '密令核验，正在接续仙籍…');
                        try { await pullCloudSave(); } catch(e) {}
                        setLoading(false);
                        resetLoginForm();
                        renderPanel();
                        customAlert('黄小仙：仙籍接续成功，欢迎归来，' + playerName + '。');
                    } else {
                        // === 无档 → 新开 ===
                        playerName = name;
                        localStorage.setItem(KEY_PLAYER_NAME, playerName);
                        localStorage.setItem('savedPasswordHash', inputHash);
                        // 本地缺省
                        if (localStorage.getItem(KEY_LING_YUN) === null)  localStorage.setItem(KEY_LING_YUN, '100');
                        if (localStorage.getItem(KEY_ZHUO_NIAN) === null) localStorage.setItem(KEY_ZHUO_NIAN, '0');
                        if (localStorage.getItem(KEY_STORY_NODE) === null) localStorage.setItem(KEY_STORY_NODE, 'start');
                        const newId = await apiEstablishDocument(name, buildLocalSnapshot());
                        cloudDocId = newId;
                        localStorage.setItem(KEY_CLOUD_DOC_ID, cloudDocId);
                        localStorage.setItem(KEY_LAST_CLOUD_TIME, Date.now().toString());
                        setLoading(false);
                        resetLoginForm();
                        renderPanel();
                        customAlert('黄小仙：仙籍已立，道号「' + playerName + '」自此为凭。密令请牢记。');
                    }
                } catch (e) {
                    setLoading(false);
                    customAlert('黄小仙：仙途感应紊乱 — ' + (e.message || '未知'));
                }
            });

            daoHaoInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') registerBtn.click();
            });
            miMaInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') registerBtn.click();
            });

            // ==================== 同步按钮 ====================
            syncBtn.addEventListener('click', async () => {
                if (syncBtn.disabled) return;
                syncBtn.disabled = true;
                const originText = syncBtn.textContent;
                syncBtn.textContent = '同步中…';
                try {
                    // 双路：先拉后推，与讨封页保持互通
                    try { await pullCloudSave(); } catch(e) {  }
                    await pushCloudSave();
                    displaySyncTime.textContent = formatTime(localStorage.getItem(KEY_LAST_CLOUD_TIME));
                    customAlert('\u9ec4\u5c0f\u4ed9\uff1a\u4ed9\u7c4d\u5df2\u4e0e\u4e91\u7aef\u76f8\u5408\u3002');
                } catch (e) {
                    customAlert('黄小仙：同步未成 — ' + (e.message || '未知'));
                } finally {
                    syncBtn.disabled = false;
                    syncBtn.textContent = originText;
                }
            });

            // ==================== 登出流程 ====================
            logoutBtn.addEventListener('click', () => {
                customConfirm('\u9ec4\u5c0f\u4ed9\uff1a\u767b\u51fa\u4ec5\u89e3\u9664\u6b64\u673a\u4e0e\u4e91\u7aef\u7684\u7ed1\u5b9a\uff0c\u672c\u5730\u6210\u5c31\u4e0e\u8fdb\u5ea6\u7686\u5b58\u3002\u662f\u5426\u7ee7\u7eed\uff1f', (ok) => {
                    if (!ok) return;
                    // 仅清除登录相关键，不清除成就/进度
                    localStorage.removeItem(KEY_PLAYER_NAME);
                    localStorage.removeItem(KEY_CLOUD_DOC_ID);
                    localStorage.removeItem(KEY_LAST_CLOUD_TIME);
                    // 兼容旧版遗留键
                    localStorage.removeItem('savedDaoHao');
                    localStorage.removeItem('savedPasswordHash');
                    localStorage.removeItem('rememberTime');
                    localStorage.removeItem('stayLoggedIn');
                    playerName = '';
                    cloudDocId = '';
                    // 刷新视图（不刷新页面亦可，此处主动刷新以复原）
                    setTimeout(() => { location.reload(); }, 200);
                });
            });

            // ==================== 手动导入/导出 ====================
            exportBtn.addEventListener('click', () => {
                try {
                    const snap = {
                        __from: '道主仙府 · 仙籍管理',
                        __version: 1,
                        __exportTime: new Date().toISOString(),
                        playerName: playerName,
                        cloudDocId: cloudDocId,
                        lastCloudSaveTime: localStorage.getItem(KEY_LAST_CLOUD_TIME) || '',
                        storyNode: readLocal(KEY_STORY_NODE, 'start'),
                        lingYun: readLocal(KEY_LING_YUN, '100'),
                        zhuoNian: readLocal(KEY_ZHUO_NIAN, '0'),
                        achievements: readLocalJSON(KEY_ACHIEVEMENTS, {}),
                        specialAchievements: readLocalJSON(KEY_SPECIAL_ACH, []),
                        specialNotes: readLocalJSON(KEY_SPECIAL_NOTES, {}),
                        usedCodes: readLocalJSON(KEY_USED_CODES, [])
                    };
                    const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `仙籍_${playerName || '无名'}_${Date.now()}.json`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                } catch (e) {
                    customAlert('黄小仙：导出失败 — ' + e.message);
                }
            });

            importBtn.addEventListener('click', () => importFile.click());
            importFile.addEventListener('change', (evt) => {
                const f = evt.target.files && evt.target.files[0];
                if (!f) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        customConfirm('黄小仙：导入将合并本地成就并覆盖境界数值，是否继续？', (ok) => {
                            if (!ok) { importFile.value = ''; return; }
                            if (data.playerName) localStorage.setItem(KEY_PLAYER_NAME, data.playerName);
                            if (data.cloudDocId) localStorage.setItem(KEY_CLOUD_DOC_ID, data.cloudDocId);
                            if (data.storyNode)  localStorage.setItem(KEY_STORY_NODE, data.storyNode);
                            if (data.lingYun !== undefined)  localStorage.setItem(KEY_LING_YUN, String(data.lingYun));
                            if (data.zhuoNian !== undefined) localStorage.setItem(KEY_ZHUO_NIAN, String(data.zhuoNian));
                            if (data.achievements && typeof data.achievements === 'object') {
                                const local = readLocalJSON(KEY_ACHIEVEMENTS, {});
                                localStorage.setItem(KEY_ACHIEVEMENTS, JSON.stringify({ ...local, ...data.achievements }));
                            }
                            if (Array.isArray(data.specialAchievements)) {
                                const local = readLocalJSON(KEY_SPECIAL_ACH, []);
                                localStorage.setItem(KEY_SPECIAL_ACH, JSON.stringify(Array.from(new Set([...local, ...data.specialAchievements]))));
                            }
                            if (data.specialNotes && typeof data.specialNotes === 'object') {
                                const local = readLocalJSON(KEY_SPECIAL_NOTES, {});
                                localStorage.setItem(KEY_SPECIAL_NOTES, JSON.stringify({ ...local, ...data.specialNotes }));
                            }
                            if (Array.isArray(data.usedCodes)) {
                                const local = readLocalJSON(KEY_USED_CODES, []);
                                localStorage.setItem(KEY_USED_CODES, JSON.stringify(Array.from(new Set([...local, ...data.usedCodes]))));
                            }
                            importFile.value = '';
                            customAlert('黄小仙：仙籍已导入，正在刷新…', () => location.reload());
                        });
                    } catch (err) {
                        customAlert('黄小仙：存档文件读取失败 — ' + err.message);
                        importFile.value = '';
                    }
                };
                reader.readAsText(f);
            });

            // ==================== 返回按钮 ====================
            backBtn.addEventListener('click', () => {
                // iframe 场景 → 通知父窗切换到"讨封"
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'nav', target: '讨封' }, '*');
                        return;
                    }
                } catch (e) { /* 跨域忽略 */ }
                // 普通场景
                if (window.history.length > 1) window.history.back();
                else window.location.href = '讨封.html';
            });

            // ==================== 启动 ====================
            function init() {
                if (playerName) {
                    renderPanel();
                } else {
                    renderLogin();
                    setTimeout(() => daoHaoInput.focus(), 300);
                }
            }
            init();
        })();
    </script>
</body>
</html>
