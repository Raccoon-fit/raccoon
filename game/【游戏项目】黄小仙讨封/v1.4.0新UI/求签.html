<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>仙音阁 · 求签</title>
    <meta name="theme-color" content="#5D4037">
    <script>
        (function () {
            // 主题系统：妖异风 demonic / 卷轴风 scroll
            function readTheme() {
                try {
                    if (window.parent && window.parent !== window) {
                        var pt = window.parent.document.documentElement.getAttribute('data-theme');
                        if (pt === 'scroll' || pt === 'demonic') return pt;
                    }
                } catch (e) {}
                try { var t = localStorage.getItem('hxsf_theme'); return (t === 'scroll' || t === 'demonic') ? t : 'demonic'; }
                catch (e) { return 'demonic'; }
            }
            document.documentElement.setAttribute('data-theme', readTheme());
        })();
    </script>
    <style>
        :root {
            --scroll-bg: #F5DEB3;
            --scroll-dark: #8B4513;
            --scroll-gold: #B8860B;
            --scroll-text: #3E2723;
            --scroll-light: #FFF8DC;
            --card-bg: rgba(255, 248, 220, 0.7);
            --unlocked-glow: rgba(184, 134, 11, 0.35);
            --font-stack: "SimSun", "Songti SC", "Noto Serif SC", serif;
            --shang: #C0392B;       /* 上上签 朱砂红 */
            --zhong: #8B4513;       /* 中签 棕褐 */
            --xia: #5D4037;         /* 下签 暗棕 */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--scroll-bg);
            color: var(--scroll-text);
            font-family: var(--font-stack);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 69, 19, 0.03) 2px, rgba(139, 69, 19, 0.03) 4px),
                radial-gradient(ellipse at 50% 0%, rgba(210, 180, 140, 0.2) 0%, transparent 60%);
        }
        .page-container {
            max-width: 720px;
            width: 100%;
            padding: 24px 20px 40px;
            background: rgba(255, 248, 220, 0.5);
            border-left: 4px solid var(--scroll-dark);
            border-right: 4px solid var(--scroll-dark);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            flex: 1;
        }
        .header { text-align: center; border-bottom: 2px solid var(--scroll-dark); margin-bottom: 18px; padding-bottom: 10px; }
        .header h1 { color: var(--scroll-gold); font-size: 32px; letter-spacing: 6px; text-shadow: 2px 2px 0 var(--scroll-dark); }
        .subtitle { color: #5D4037; font-size: 13px; letter-spacing: 4px; font-style: italic; }
        .stats-row { display: flex; justify-content: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .stat-item {
            background: linear-gradient(180deg, #D2B48C, #A0522D);
            border: 2px solid var(--scroll-dark);
            border-radius: 20px;
            padding: 4px 18px;
            font-size: 13px;
            color: var(--scroll-light);
            letter-spacing: 1px;
        }

        /* 签筒区 */
        .qian-tong {
            text-align: center;
            padding: 30px 20px;
            margin: 16px 0;
            background: linear-gradient(180deg, rgba(210, 180, 140, 0.4), rgba(139, 69, 19, 0.15));
            border: 2px solid var(--scroll-dark);
            border-radius: 12px;
            position: relative;
        }
        .qian-tong::before, .qian-tong::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 40px;
            border-radius: 4px;
            background: linear-gradient(180deg, #c9a84c, #8b7355);
            border: 1px solid #a08040;
            box-shadow: inset 0 1px 2px rgba(255, 220, 140, 0.3), 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .qian-tong::before { left: 8px; }
        .qian-tong::after { right: 8px; }
        .qian-icon {
            font-size: 60px;
            margin-bottom: 8px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .qian-prompt {
            color: var(--scroll-dark);
            font-size: 15px;
            letter-spacing: 3px;
            margin: 8px 0 18px;
        }
        .qian-prompt .today-date {
            display: block;
            font-size: 12px;
            color: #8B7355;
            letter-spacing: 2px;
            margin-top: 4px;
        }
        .draw-btn {
            padding: 12px 48px;
            background: linear-gradient(180deg, #A0522D, #8B4513);
            color: var(--scroll-light);
            border: none;
            border-radius: 6px;
            font-family: var(--font-stack);
            font-size: 17px;
            letter-spacing: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #5D2906;
            transition: transform 0.15s, box-shadow 0.2s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .draw-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #5D2906; }
        .draw-btn:disabled { background: #999; box-shadow: 0 4px 0 #666; cursor: not-allowed; opacity: 0.6; }

        /* 签面 */
        .qian-result {
            display: none;
            margin-top: 22px;
            padding: 22px 18px 18px;
            background: var(--scroll-light);
            border: 2px solid var(--scroll-dark);
            border-radius: 10px;
            position: relative;
            animation: fadeIn 0.6s ease;
        }
        .qian-result.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .qian-level {
            position: absolute;
            top: -14px;
            right: 18px;
            padding: 4px 18px;
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--scroll-light);
            border-radius: 14px;
            border: 2px solid;
        }
        .qian-level.shang { background: var(--shang); border-color: #8B0000; }
        .qian-level.zhong { background: var(--zhong); border-color: #5D2906; }
        .qian-level.xia { background: var(--xia); border-color: #3E2723; }
        .qian-no { text-align: center; color: var(--scroll-gold); font-size: 13px; letter-spacing: 3px; margin-bottom: 6px; }
        .qian-title { text-align: center; color: var(--scroll-dark); font-size: 24px; letter-spacing: 6px; font-weight: bold; margin: 6px 0 14px; text-shadow: 1px 1px 0 #DEB887; }
        .qian-poem { color: #5D4037; font-size: 15px; line-height: 2; text-align: center; padding: 0 12px 14px; border-bottom: 1px dashed var(--scroll-dark); white-space: pre-line; }
        .qian-explain { color: var(--scroll-text); font-size: 14px; line-height: 1.9; padding: 14px 8px 6px; }
        .qian-explain h4 { color: var(--scroll-gold); font-size: 13px; letter-spacing: 2px; margin: 8px 0 4px; }
        .qian-redo-tip { text-align: center; color: #8B7355; font-size: 11px; margin-top: 12px; font-style: italic; }

        /* 图鉴区 */
        .section-title {
            color: var(--scroll-dark);
            font-size: 14px;
            letter-spacing: 4px;
            text-align: center;
            padding: 16px 0 10px;
            border-top: 2px solid var(--scroll-dark);
            margin-top: 18px;
            font-weight: bold;
        }
        .qian-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 6px 0;
        }
        .qian-card {
            aspect-ratio: 3 / 4;
            border: 2px solid var(--scroll-dark);
            border-radius: 6px;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 4px;
            font-size: 11px;
            color: var(--scroll-dark);
            text-align: center;
            letter-spacing: 1px;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .qian-card:active { transform: scale(0.96); }
        .qian-card.got { box-shadow: 0 0 8px var(--unlocked-glow); border-color: var(--scroll-gold); }
        .qian-card.got.shang { background: linear-gradient(180deg, #FFD7D7, #F5DEB3); }
        .qian-card.got.zhong { background: linear-gradient(180deg, #F5DEB3, #DEB887); }
        .qian-card.got.xia { background: linear-gradient(180deg, #DEB887, #A0522D); color: #FFE4B5; }
        .qian-card .qc-no { font-size: 10px; color: #8B7355; }
        .qian-card.got .qc-no { color: var(--scroll-dark); }
        .qian-card .qc-name { font-size: 13px; font-weight: bold; margin: 4px 0 2px; }
        .qian-card .qc-lv { font-size: 10px; letter-spacing: 1px; opacity: 0.8; }
        .qian-card.locked .qc-name { color: #8B7355; font-style: italic; font-weight: normal; }
        .qian-card.locked .qc-no,
        .qian-card.locked .qc-lv { color: #8B7355; }
        .qian-card.locked { opacity: 0.55; }

        .empty-state {
            text-align: center;
            padding: 22px;
            color: var(--scroll-dark);
            font-style: italic;
            background: var(--card-bg);
            border-radius: 6px;
            margin-top: 8px;
        }
        .footer-hint { text-align: center; color: #8b5a2b; font-size: 12px; margin-top: 22px; font-style: italic; }

        /* 详情弹层（复用藏经阁风格） */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .detail-overlay.show { display: flex; }
        .detail-modal {
            max-width: 480px;
            width: 100%;
            max-height: 80vh;
            background: var(--scroll-light);
            border: 2px solid var(--scroll-dark);
            border-radius: 10px;
            padding: 22px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .detail-title { color: var(--scroll-gold); font-size: 22px; letter-spacing: 4px; text-align: center; margin-bottom: 10px; text-shadow: 1px 1px 0 var(--scroll-dark); }
        .detail-poem { color: #5D4037; font-size: 14px; line-height: 2; text-align: center; padding: 6px 12px 12px; border-bottom: 1px dashed var(--scroll-dark); white-space: pre-line; }
        .detail-body { color: var(--scroll-text); font-size: 14px; line-height: 1.9; padding: 10px 6px; }
        .detail-close {
            display: block;
            margin: 16px auto 0;
            padding: 8px 32px;
            background: #8B4513;
            color: var(--scroll-light);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: var(--font-stack);
            font-size: 14px;
            letter-spacing: 4px;
            box-shadow: 0 3px 0 #5D2906;
        }
        .detail-close:active { transform: translateY(2px); box-shadow: 0 1px 0 #5D2906; }

        /* ===== 妖异风覆盖 ===== */
        html[data-theme="demonic"] body {
            background-color: #0d0508;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(232, 197, 106, 0.03) 2px, rgba(232, 197, 106, 0.03) 4px),
                radial-gradient(ellipse at 50% 0%, rgba(232, 197, 106, 0.14) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 85%, rgba(138, 31, 43, 0.25) 0%, transparent 65%);
            color: #e8d8b8;
        }
        html[data-theme="demonic"] .page-container {
            background: rgba(18, 8, 12, 0.72);
            border-left: 4px solid #2a0f16;
            border-right: 4px solid #2a0f16;
            box-shadow: 0 0 40px rgba(138, 31, 43, 0.35);
        }
        html[data-theme="demonic"] .page-container::before,
        html[data-theme="demonic"] .page-container::after {
            background: linear-gradient(to bottom, #2a0f16, #5a1620, #2a0f16);
        }
        html[data-theme="demonic"] .header { border-bottom-color: #3a131c; }
        html[data-theme="demonic"] .header h1 { color: #E8C56A; text-shadow: 2px 2px 0 #3a0a10; }
        html[data-theme="demonic"] .subtitle { color: #c8a878; }
        html[data-theme="demonic"] .stat-item {
            background: linear-gradient(180deg, #5a1620, #3a0f16);
            border-color: #2a0f16;
            color: #FFE9A8;
        }
        html[data-theme="demonic"] .qian-tong {
            background: linear-gradient(180deg, rgba(58, 15, 22, 0.6), rgba(20, 8, 12, 0.5));
            border-color: #2a0f16;
        }
        html[data-theme="demonic"] .qian-prompt { color: #e8d8b8; }
        html[data-theme="demonic"] .qian-prompt .today-date { color: #9a8268; }
        html[data-theme="demonic"] .draw-btn {
            background: linear-gradient(180deg, #8a1f2b, #5a1620);
            color: #FFE9A8;
            box-shadow: 0 4px 0 #2a0f16;
        }
        html[data-theme="demonic"] .draw-btn:active { box-shadow: 0 2px 0 #2a0f16; }
        html[data-theme="demonic"] .qian-result { background: rgba(24, 10, 14, 0.85); border-color: #3a131c; }
        html[data-theme="demonic"] .qian-no { color: #E8C56A; }
        html[data-theme="demonic"] .qian-title { color: #FFE9A8; text-shadow: 1px 1px 0 #3a0a10; }
        html[data-theme="demonic"] .qian-poem { color: #d8c4a0; border-bottom-color: #3a131c; }
        html[data-theme="demonic"] .qian-explain { color: #e0d0b4; }
        html[data-theme="demonic"] .qian-explain h4 { color: #E8C56A; }
        html[data-theme="demonic"] .qian-redo-tip { color: #9a8268; }
        html[data-theme="demonic"] .section-title { color: #FFE9A8; border-top-color: #3a131c; }
        html[data-theme="demonic"] .qian-grid .qian-card {
            background: rgba(24, 10, 14, 0.85);
            border-color: #3a131c;
            color: #e0d0b4;
        }
        html[data-theme="demonic"] .qian-card.got { border-color: #E8C56A; box-shadow: 0 0 10px rgba(232, 197, 106, 0.35); }
        html[data-theme="demonic"] .qian-card.got.shang { background: linear-gradient(180deg, #3a1018, #2a0f16); color: #ffb0b0; }
        html[data-theme="demonic"] .qian-card.got.zhong { background: linear-gradient(180deg, #3a2a0c, #2a1a08); color: #f0d890; }
        html[data-theme="demonic"] .qian-card.got.xia { background: linear-gradient(180deg, #2a1a08, #1a0f06); color: #FFE9A8; }
        html[data-theme="demonic"] .qian-card .qc-no { color: #9a8268; }
        html[data-theme="demonic"] .qian-card.got .qc-no { color: #E8C56A; }
        html[data-theme="demonic"] .qian-card.locked .qc-name { color: #9a8268; }
        html[data-theme="demonic"] .qian-card.locked .qc-no,
        html[data-theme="demonic"] .qian-card.locked .qc-lv { color: #6a5a48; }
        html[data-theme="demonic"] .empty-state { color: #e0d0b4; background: rgba(24, 10, 14, 0.85); }
        html[data-theme="demonic"] .footer-hint { color: #9a8268; }
        html[data-theme="demonic"] .detail-modal {
            background: #180a0e;
            border-color: #3a131c;
            box-shadow: 0 10px 40px rgba(138, 31, 43, 0.4);
        }
        html[data-theme="demonic"] .detail-title { color: #FFE9A8; text-shadow: 1px 1px 0 #3a0a10; }
        html[data-theme="demonic"] .detail-poem { color: #d8c4a0; border-bottom-color: #3a131c; }
        html[data-theme="demonic"] .detail-body { color: #e0d0b4; }
        html[data-theme="demonic"] .detail-close {
            background: linear-gradient(180deg, #8a1f2b, #5a1620);
            color: #FFE9A8;
            box-shadow: 0 3px 0 #2a0f16;
        }
    </style>
    <script>
        // localStorage 沙盒兜底：某些嵌入/隐私模式下 localStorage 会抛异常
        // 用一个内存 Map 兜底，保证代码在任何环境都不崩溃
        (function () {
            try {
                const testKey = '__hxsf_ls_test__';
                localStorage.setItem(testKey, '1');
                localStorage.removeItem(testKey);
            } catch (e) {
                const memStore = {};
                Object.defineProperty(window, 'localStorage', {
                    value: {
                        getItem: (k) => Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null,
                        setItem: (k, v) => { memStore[k] = String(v); },
                        removeItem: (k) => { delete memStore[k]; },
                        clear: () => { for (const k in memStore) delete memStore[k]; },
                        key: (i) => Object.keys(memStore)[i] || null,
                        get length() { return Object.keys(memStore).length; }
                    },
                    configurable: true
                });
            }
        })();
    </script>
    
    
    <script>
        
        // 等 kill switch 探测完成后按结果放开或隐藏。避免"先亮再消失"的闪烁。
        document.documentElement.classList.add('hxsf-cloud-loading');
    </script>
    <style>
        /* kill=1 或探测未完成时，隐藏所有 hxsf-cloud-only 元素 */
        html.hxsf-kill .hxsf-cloud-only,
        html.hxsf-cloud-loading .hxsf-cloud-only { display: none !important; }
    </style>
    <script>
        (function () {
            var KILL_URL = 'ht'+'tps://yuju.99kpk.top:81/doc/visit.php?appid=1121&id=9890dfd37f58';
            var CLOUD_HOST = 'yuju.99kpk.top';
            var SESSION_KEY = 'hxsf_cloud_kill_v1';

            var state = {
                ready: null,
                done: false,
                killed: false
            };
            window.HXSF_CLOUD = state;

            function applyKill(k) {
                state.killed = !!k;
                state.done = true;
                try {
                    var root = document.documentElement;
                    root.classList.remove('hxsf-cloud-loading');
                    if (k) root.classList.add('hxsf-kill');
                    else root.classList.remove('hxsf-kill');
                } catch (e) {}
            }

            var _origFetch = window.fetch ? window.fetch.bind(window) : null;
            if (_origFetch) {
                window.fetch = function (input, init) {
                    try {
                        var url = (typeof input === 'string') ? input : (input && input.url) || '';
                        if (state.killed && url.indexOf(CLOUD_HOST) !== -1 && url !== KILL_URL) {
                            return Promise.reject(new Error('cloud disabled'));
                        }
                    } catch (e) {}
                    return _origFetch(input, init);
                };
            }

            // 会话内缓存：同一会话不再重复请求；未命中才发起真实请求
            try {
                var cached = sessionStorage.getItem(SESSION_KEY);
                if (cached === '1' || cached === '0') {
                    applyKill(cached === '1');
                    state.ready = Promise.resolve(state.killed);
                    return;
                }
            } catch (e) {}

            state.ready = new Promise(function (resolve) {
                if (!_origFetch) { applyKill(false); resolve(false); return; }
                
                try { if (navigator && navigator.onLine === false) { applyKill(false); resolve(false); return; } } catch (e) {}
                var ctrl = null, timer = null;
                try {
                    ctrl = new AbortController();
                    // 2 秒超时：避免首屏长时间空白
                    timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 2000);
                } catch (e) {}
                _origFetch(KILL_URL, ctrl ? { signal: ctrl.signal } : {})
                    .then(function (r) { return r.text(); })
                    .then(function (t) {
                        if (timer) clearTimeout(timer);
                        var v = (t || '').trim();
                        var k = (v === '1');
                        try { sessionStorage.setItem(SESSION_KEY, k ? '1' : '0'); } catch (e) {}
                        applyKill(k);
                        resolve(k);
                    })
                    .catch(function () {
                        if (timer) clearTimeout(timer);
                        // 请求失败 / 超时 → 视为 kill=0（正常）
                        try { sessionStorage.setItem(SESSION_KEY, '0'); } catch (e) {}
                        applyKill(false);
                        resolve(false);
                    });
            });
        })();
    </script>
    
</head>
<body>

    <script>
        // ===========================================================

        function extractUidFromTitle(t) {
            if (typeof t !== 'string' || !t.includes(';')) return '';
            return t.slice(t.indexOf(';') + 1) || '';
        }

        async function apiListDocuments() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            const url = `${CONFIG.apiList}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}`;
            const res = await window['fet'+'ch'](url);
            const data = await res.json();
            if (data.code != 1) throw new Error(data.msg || '获取列表失败');
            return data.list || [];
        }
        async function apiQueryDocument(docId) {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            const url = `${CONFIG.apiQuery}?user=${CONFIG.user}&appid=${CONFIG.appid}&id=${docId}`;
            const res = await window['fet'+'ch'](url);
            const data = await res.json();
            if (data.code != 1) throw new Error(data.msg || '查询文档失败');
            return { title: data.title, content: JSON.parse(data.content) };
        }
        async function apiModifyDocument(docId, title, contentObj) {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            const url = `${CONFIG.apiModify}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}&id=${docId}`;
            const body = `title=${encodeURIComponent(title)}&content=${encodeURIComponent(JSON.stringify(contentObj, null, 2))}`;
            const res = await window['fet'+'ch'](url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body
            });
            const data = await res.json();
            if (data.code != 1) throw new Error(data.msg || '修改文档失败');
        }
        async function findDocIdByName() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            if (!playerName) return null;
            const list = await apiListDocuments();
            // ① 本地已有 uid：只精确匹配 道号;uid，避免同名其他 uid 的档被误接管
            if (uid) {
                const exact = list.find(i => i.title === playerName + ';' + uid);
                return exact ? exact.id : null;
            }
            // ② 无本地 uid：按 道号; 前缀匹配找回老档并回填 uid
            const pref = playerName + ';';
            const hit = list.find(i => typeof i.title === 'string' && i.title.startsWith(pref));
            if (hit) {
                const extracted = extractUidFromTitle(hit.title);
                if (extracted) { uid = extracted; localStorage.setItem('playerUid', uid); }
                return hit.id;
            }
            // ③ 兜底：纯道号匹配（老档尚未改名时）
            const old = list.find(i => i.title === playerName);
            return old ? old.id : null;
        }

        const STORAGE_KEY = 'qian_records_v1';
        const TODAY_KEY = 'qian_today_v1';

        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function getRecords() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            } catch (e) { return {}; }
        }
        function saveRecords(r) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(r));
        }

        function getTodayRecord() {
            const recs = getRecords();
            return recs[todayStr()] || null;
        }
        function setTodayRecord(qian) {
            const recs = getRecords();
            recs[todayStr()] = { qianNo: qian.no, ts: Date.now() };
            saveRecords(recs);
            // 同时写入"已集"列表
            const got = JSON.parse(localStorage.getItem('qian_got_v1') || '{}');
            got[qian.no] = 1;
            localStorage.setItem('qian_got_v1', JSON.stringify(got));
            
            debouncedSyncToCloud();
        }

            try { return JSON.parse(localStorage.getItem('qian_got_v1') || '{}'); }

        async function pullCloudQian() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            if (!CONFIG || !playerName) return;
            try {
                if (!cloudDocId) {
                    cloudDocId = await findDocIdByName();
                    if (cloudDocId) localStorage.setItem('cloudDocId', cloudDocId);
                }
                if (!cloudDocId) return; // 该道号未在讨封页首次落档，暂不主动创建
                const remoteDoc = await apiQueryDocument(cloudDocId);
                const remote = remoteDoc.content || {};
                // 合并抽签记录（同一天以更早时间戳为准，避免覆盖首签）
                const localRecs = getRecords();
                const remoteRecs = remote.qianRecords || {};
                const mergedRecs = { ...remoteRecs };
                Object.keys(localRecs).forEach(k => {
                    const localTs = localRecs[k].ts || 0;
                    const remoteTs = (mergedRecs[k] && mergedRecs[k].ts) || Infinity;
                    if (!mergedRecs[k] || localTs < remoteTs) mergedRecs[k] = localRecs[k];
                });
                saveRecords(mergedRecs);
                // 合并图鉴（并集）
                const localGot = getGotSet();
                const remoteGot = remote.qianGot || {};
                const mergedGot = { ...remoteGot, ...localGot };
                localStorage.setItem('qian_got_v1', JSON.stringify(mergedGot));
                // 重绘
                renderStats();
                renderGrid();
                // 若合并后今天已有签，锁定按钮
                const todayRec = getTodayRecord();
                if (todayRec) {
                    const q = QIANS.find(x => x.no === todayRec.qianNo);
                    if (q) showQian(q, true);
                    drawBtn.disabled = true;
                    drawBtn.textContent = '今 日 已 请';
                }
            } catch (e) {
                
                // 静默降级，不打扰用户
            }
        }

            if (syncTimer) clearTimeout(syncTimer);
            syncTimer = setTimeout(() => pushCloudQian(), 2000);

        async function pushCloudQian() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            if (!CONFIG || !playerName) return;
            try {
                if (!cloudDocId) {
                    cloudDocId = await findDocIdByName();
                    if (cloudDocId) localStorage.setItem('cloudDocId', cloudDocId);
                }
                if (!cloudDocId) return; // 尚未入册，不主动新建
                // 读→合并→写，避免覆盖讨封/成就页写入的其他字段
                const remoteDoc = await apiQueryDocument(cloudDocId);
                const remote = remoteDoc.content || {};
                // 回填 uid：标题优先（权威来源），content.uid 兜底
                const titleUid = extractUidFromTitle(remoteDoc.title);
                if (titleUid) { uid = titleUid; localStorage.setItem('playerUid', uid); }
                else if (remote.uid) { uid = remote.uid; localStorage.setItem('playerUid', uid); }
                const uploadData = {
                    ...remote,
                    playerName: remote.playerName || playerName,
                    qianRecords: getRecords(),
                    qianGot: getGotSet(),
                    uid: uid || remote.uid || '',
                    updateTime: Date.now()
                };
                await apiModifyDocument(cloudDocId, uid ? (playerName + ';' + uid) : playerName, uploadData);
                localStorage.setItem('lastCloudSaveTime', Date.now());

        // 抽签(根据日期生成稳定签号)
        function draw() {
            const today = todayStr();
            const seed = today.split('-').join('') | 0;
            // 简单散列
            let h = seed;
            h = ((h << 5) - h) + 0x9e3779b9;
            h = h ^ (h >>> 16);
            h = Math.abs(h);
            const idx = h % QIANS.length;
            return QIANS[idx];
        }

            qianPoem.textContent = qian.p;
            qianExplain.innerHTML = '<h4>【释义】</h4>' + qian.e;
            qianRedoTip.textContent = alreadyToday ? '今日已请得此签,明日可再摇' : '';
            qianResult.classList.add('show');
        }

        drawBtn.addEventListener('click', () => {
            const todayRec = getTodayRecord();
            if (todayRec) {
                // 今日已抽过,显示但不能再抽
                const q = QIANS.find(x => x.no === todayRec.qianNo);
                if (q) showQian(q, true);
                drawBtn.disabled = true;
                drawBtn.textContent = '今 日 已 请';
                return;
            }
            const qian = draw();
            setTodayRecord(qian);
            showQian(qian, false);
            drawBtn.disabled = true;
            drawBtn.textContent = '今 日 已 请';
            renderStats();
            renderGrid();
        });

        // 渲染统计
        function renderStats() {
            const recs = getRecords();
            const dates = Object.keys(recs);
            statDrawn.textContent = dates.length;
            const got = getGotSet();
            statGot.textContent = Object.keys(got).length;
        }

        // 渲染图鉴
        function renderGrid() {
            const got = getGotSet();
            qianGrid.innerHTML = QIANS.map(q => {
                const owned = !!got[q.no];
                return `
                    <div class="qian-card ${owned ? 'got ' + q.level : 'locked'}" data-no="${q.no}">
                        <div class="qc-no">第 ${q.no} 签</div>
                        <div class="qc-name">${owned ? q.t : '未集'}</div>
                        <div class="qc-lv">${owned ? q.levelName : '???'}</div>
                    </div>
                `;
            }).join('');

            qianGrid.querySelectorAll('.qian-card.got').forEach(card => {
                card.addEventListener('click', () => {
                    const no = parseInt(card.dataset.no, 10);
                    const q = QIANS.find(x => x.no === no);
                    if (q) showDetail(q);
                });
            });
        }

        // 详情弹层
        const detailOverlay = document.getElementById('detailOverlay');
        const detailTitle = document.getElementById('detailTitle');
        const detailPoem = document.getElementById('detailPoem');
        const detailBody = document.getElementById('detailBody');
        const detailClose = document.getElementById('detailClose');
        function showDetail(q) {
            detailTitle.textContent = '第 ' + q.no + ' 签 · ' + q.t;
            detailPoem.textContent = q.p;
            detailBody.innerHTML = '<strong>【' + q.levelName + '】</strong><br><br>' + q.e;
            detailOverlay.classList.add('show');
        }
        detailClose.addEventListener('click', () => detailOverlay.classList.remove('show'));
        detailOverlay.addEventListener('click', (e) => {
            if (e.target === detailOverlay) detailOverlay.classList.remove('show');
        });

        
        renderStats();
        renderGrid();
        // 如果今天已经抽过,显示
        const todayRec = getTodayRecord();
        if (todayRec) {
            const q = QIANS.find(x => x.no === todayRec.qianNo);
            if (q) showQian(q, true);
            drawBtn.disabled = true;
            drawBtn.textContent = '今 日 已 请';
        }
        
        pullCloudQian();

        // 主题切换同步（父窗广播）
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'hxsf-theme' && (e.data.theme === 'scroll' || e.data.theme === 'demonic')) {
                document.documentElement.setAttribute('data-theme', e.data.theme);
                try { localStorage.setItem('hxsf_theme', e.data.theme); } catch (err) {}
            }
        });
    </script>
</body>
</html>
