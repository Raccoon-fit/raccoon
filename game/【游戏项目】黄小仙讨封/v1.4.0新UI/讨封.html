<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, interactive-widget=resizes-content, viewport-fit=cover">
    <title>黄小仙 · 讨封之卷</title>
    <meta name="theme-color" content="#1c0c0f">
    <script>
        (function () {
            // 主题系统：妖异风 demonic / 卷轴风 scroll
            function readTheme() {
                try {
                    if (window.parent && window.parent !== window) {
                        var pt = window.parent.document.documentElement.getAttribute('data-theme');
                        if (pt === 'scroll' || pt === 'demonic') return pt;
                    }
                } catch (e) {}
                try { var t = localStorage.getItem('hxsf_theme'); return (t === 'scroll' || t === 'demonic') ? t : 'demonic'; }
                catch (e) { return 'demonic'; }
            }
            document.documentElement.setAttribute('data-theme', readTheme());
        })();
    </script>
    <style>
        :root {
            --scroll-bg: #1a0e10;
            --scroll-dark: #4a0d14;
            --scroll-gold: #E8C56A;
            --scroll-text: #f0e6d2;
            --scroll-light: #FFF8DC;
            --accent-color: #C0392B;
        }
        body {
            background-color: var(--scroll-bg);
            color: var(--scroll-text);
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            line-height: 1.8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative;
            background-image:
                radial-gradient(ellipse at 18% 0%, rgba(138, 31, 43, 0.28), transparent 55%),
                radial-gradient(ellipse at 82% 6%, rgba(232, 197, 106, 0.12), transparent 45%),
                radial-gradient(ellipse at 50% 100%, rgba(90, 13, 20, 0.4), transparent 60%),
                linear-gradient(180deg, #0d0508 0%, #160a0c 50%, #1c0c0f 100%);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 14% 22%, rgba(255, 233, 168, 0.7), transparent 60%),
                radial-gradient(1px 1px at 38% 66%, rgba(255, 233, 168, 0.5), transparent 60%),
                radial-gradient(2px 2px at 62% 30%, rgba(255, 233, 168, 0.6), transparent 60%),
                radial-gradient(1px 1px at 80% 72%, rgba(255, 233, 168, 0.45), transparent 60%);
            animation: stardrift 14s linear infinite;
        }
        @keyframes stardrift {
            0% { transform: translateY(0); opacity: 0.7; }
            50% { opacity: 1; }
            100% { transform: translateY(-30px); opacity: 0.7; }
        }
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .game-container {
            max-width: 600px; width: 100%; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            position: relative; z-index: 1; border-left: 6px solid var(--scroll-dark); border-right: 6px solid var(--scroll-dark);
            background: linear-gradient(180deg, rgba(26, 12, 14, 0.92), rgba(14, 7, 9, 0.96));
            box-shadow: 0 0 40px rgba(138, 31, 43, 0.35), 0 0 24px rgba(232, 197, 106, 0.08);
        }
        .game-container::before, .game-container::after {
            content: ""; position: absolute; top: 0; bottom: 0; width: 12px;
            background: linear-gradient(to bottom, var(--scroll-dark), #6b1f2b, var(--scroll-dark));
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.3), inset -2px 0 5px rgba(0,0,0,0.2); z-index: -1; pointer-events: none;
        }
        .game-container::before { left: -6px; border-radius: 4px 0 0 4px; }
        .game-container::after { right: -6px; border-radius: 0 4px 4px 0; }
        .status-bar {
            flex-shrink: 0; z-index: 100; background: linear-gradient(to bottom, rgba(30, 14, 16, 0.96) 75%, rgba(24, 11, 13, 0.85) 92%, transparent);
            padding: 12px 20px 10px; border-bottom: 1px solid var(--scroll-dark);
        }
        .cultivation { font-size: 14px; color: #d9c6a8; }
        .cultivation span { color: var(--scroll-gold); font-weight: bold; text-shadow: 0 0 10px rgba(232, 197, 106, 0.5); }
        .playtime-display { font-size: 12px; color: #d9c6a8; margin-left: 14px; }
        .playtime-display span { color: var(--scroll-gold); font-weight: bold; }
        .karma-display { display: flex; gap: 12px; font-size: 12px; }
        .karma-lingyun { color: #66BB6A; }
        .karma-zhuonian { color: #EF5350; }
        .env-bar { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; font-size: 12px; color: #d9c6a8; }
        .env-item { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; background: rgba(74, 13, 20, 0.4); border-radius: 10px; border: 1px solid rgba(138, 31, 43, 0.4); }
        .env-item .env-icon { font-size: 14px; }
        .env-item .env-label { color: var(--scroll-gold); font-weight: bold; }
        .env-item.moon .env-icon { color: var(--scroll-gold); }
        .env-effect { width: 100%; font-size: 11px; color: #c98a45; font-style: italic; margin-top: 2px; }
        .story-container {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 20px;
            scrollbar-width: thin; scrollbar-color: var(--scroll-dark) rgba(40, 16, 18, 0.5);
        }
        .story-container::-webkit-scrollbar { width: 6px; }
        .story-container::-webkit-scrollbar-track { background: rgba(40, 16, 18, 0.5); }
        .story-container::-webkit-scrollbar-thumb { background: var(--scroll-dark); border-radius: 3px; }
        .choices-container {
            flex-shrink: 0; z-index: 100; background: linear-gradient(to top, rgba(30, 14, 16, 0.96) 75%, rgba(24, 11, 13, 0.85) 92%, transparent);
            padding: 14px 20px 10px; border-top: 1px solid var(--scroll-dark); display: flex; flex-wrap: wrap;
        }
        .choices-container .choice-btn { width: calc(50% - 6px); margin-bottom: 12px; }
        .choices-container .choice-btn:nth-child(odd) { margin-right: 12px; }
        .choices-container.single-col .choice-btn { width: 100%; margin-right: 0; }
        .story-text { font-size: 17px; margin-bottom: 15px; opacity: 0; animation: fadeIn 0.8s ease forwards; }
        .story-text.narrator { color: #cfbca2; font-style: italic; }
        .story-text.speaker { color: #f0e6d2; font-weight: bold; }
        .story-text.system { color: var(--accent-color); text-align: center; padding: 20px 0; border-top: 1px solid var(--scroll-dark); border-bottom: 1px solid var(--scroll-dark); margin: 20px 0; }
        .story-text.witness { color: var(--scroll-gold); font-weight: bold; text-align: center; letter-spacing: 1px; padding: 10px 0; text-shadow: 0 0 14px rgba(232, 197, 106, 0.5); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .choice-btn, .start-btn, .settings-btn-action {
            background: linear-gradient(180deg, #6b1f2b 0%, #3a0d14 100%); border: 2px solid #8a1f2b;
            color: var(--scroll-light); text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.4), inset 2px 2px 4px rgba(255, 233, 168, 0.12), inset -2px -2px 4px rgba(0,0,0,0.4);
            border-radius: 6px; font-family: inherit; letter-spacing: 2px; font-weight: bold;
            padding: 15px 20px; font-size: 15px; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .choice-btn::after, .start-btn::after {
            content: ""; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px dashed rgba(255, 233, 168, 0.22); border-radius: 4px; pointer-events: none;
        }
        .choice-btn:hover, .start-btn:hover { background: linear-gradient(180deg, #8a1f2b 0%, #4a0d14 100%); transform: translateY(-3px); box-shadow: 5px 5px 0 rgba(0,0,0,0.45), 0 0 18px rgba(232, 197, 106, 0.2), inset 2px 2px 6px rgba(255, 233, 168, 0.15), inset -2px -2px 6px rgba(0,0,0,0.5); }
        .choice-btn:active, .start-btn:active { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.3), inset 2px 2px 6px rgba(0,0,0,0.4); }
        .footer { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 8px 20px; font-size: 12px; color: #9a8370; background: rgba(24, 11, 13, 0.94); border-top: 1px solid var(--scroll-dark); }
        .start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #0d0508, #1c0c0f); z-index: 2000; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #B0B0B0; transition: opacity 0.3s; }
        .start-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 28%, rgba(255, 233, 168, 0.7), transparent 60%),
                radial-gradient(1px 1px at 70% 40%, rgba(255, 233, 168, 0.5), transparent 60%),
                radial-gradient(2px 2px at 88% 66%, rgba(255, 233, 168, 0.6), transparent 60%),
                radial-gradient(1px 1px at 40% 80%, rgba(255, 233, 168, 0.4), transparent 60%);
            animation: stardrift 12s linear infinite;
            pointer-events: none;
        }
        .start-content { text-align: center; max-width: 80%; position: relative; }
        .start-content h1 { font-family: 'Ma Shan Zheng', 'KaiTi', serif; color: var(--scroll-gold); font-size: 56px; margin-bottom: 16px; text-shadow: 0 0 30px rgba(232, 197, 106, 0.55), 2px 2px 0 var(--scroll-dark); letter-spacing: 8px; }
        .start-subtitle { font-size: 18px; margin-bottom: 48px; color: #c9a480; font-style: italic; letter-spacing: 2px; }
        .top-right-bar { position: fixed; top: 12px; right: 12px; z-index: 1500; display: flex; align-items: center; gap: 8px; }
        .feedback-group-btn { position: fixed; top: 12px; right: 12px; z-index: 2200; background: rgba(20, 7, 10, 0.85); border: 1px solid var(--scroll-gold); color: #E8C56A; font-family: inherit; font-size: 12px; padding: 5px 12px; border-radius: 5px; cursor: pointer; letter-spacing: 1px; line-height: 1.5; }
        .feedback-group-btn:hover { background: rgba(138, 31, 43, 0.9); color: #FFE4B5; }
        .xianfu-btn { background: transparent; border: none; padding: 4px 8px; font-family: inherit; font-size: 12px; color: #9a8370; cursor: pointer; letter-spacing: 1px; outline: none; transition: color 0.2s; line-height: 1.4; }
        .xianfu-btn.logged { color: #E8C56A; }
        .xianfu-btn:hover { text-decoration: underline; }
        .xianfu-btn:focus { outline: none; }
        .settings-btn { position: static; width: 32px; height: 32px; background: linear-gradient(180deg, #6b1f2b, #3a0d14); border: 1px solid #8a1f2b; color: var(--scroll-light); border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 1px 1px 0 rgba(0,0,0,0.25); padding: 0; opacity: 0.85; }
        .settings-btn:hover { opacity: 1; }
        .net-warn-bar { position: fixed; top: 0; left: 0; right: 0; background: rgba(138, 31, 43, 0.95); color: #FFE4B5; text-align: center; font-size: 12px; padding: 6px 12px; z-index: 4500; letter-spacing: 1px; transform: translateY(-100%); transition: transform 0.3s; }
        .net-warn-bar.show { transform: translateY(0); }
        .settings-item.maintenance { color: #9a8370; font-size: 12px; }
        .settings-item.maintenance .label { color: #9a8370; font-size: 12px; }
        .settings-item.maintenance #progressInfo,
        .settings-item.maintenance #tabletModeBtn { color: #9a8370 !important; font-size: 12px; background: #3a2a20; border-color: #5a3a20; cursor: not-allowed; opacity: 0.75; }
        .maintenance-tag { color: #9a8370; font-size: 12px; margin-left: 6px; }
        .settings-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.72); z-index: 3000; display: none; justify-content: center; align-items: center; }
        .settings-overlay.show { display: flex; }
        .settings-modal { background: linear-gradient(180deg, #1c0d10, #14070a); border: 2px solid #8a1f2b; border-radius: 10px; padding: 28px; max-width: 360px; width: 90%; color: #f0e6d2; box-shadow: 0 0 30px rgba(138, 31, 43, 0.3); }
        .settings-modal h3 { color: var(--scroll-gold); text-align: center; border-bottom: 1px solid #3a1620; padding-bottom: 10px; margin-bottom: 18px; text-shadow: 0 0 12px rgba(232, 197, 106, 0.4); }
        .settings-item { margin-bottom: 12px; }
        .settings-item .label { color: #d9c6a8; font-size: 13px; display: block; margin-bottom: 6px; }
        .settings-row { display: flex; gap: 10px; margin-top: 20px; }
        .settings-btn-action { flex: 1; padding: 12px 16px; font-size: 14px; }
        .settings-btn-action.danger { border-color: #C0392B; color: #FFD2D2; background: linear-gradient(180deg, #8a1f2b, #3a0d14); }
        .toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%) translateY(40px); background: #1c0d10; border: 2px solid var(--scroll-gold); color: #FFE4B5; padding: 12px 24px; border-radius: 5px; font-size: 14px; z-index: 5000; opacity: 0; transition: all 0.3s; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .confirm-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.72); z-index: 4000; display: none; justify-content: center; align-items: center; }
        .confirm-overlay.show { display: flex; }
        .confirm-modal { background: linear-gradient(180deg, #1c0d10, #14070a); border: 2px solid #C0392B; border-radius: 10px; padding: 24px 28px; max-width: 320px; width: 90%; color: #f0e6d2; box-shadow: 0 0 30px rgba(192, 57, 43, 0.25); }
        .confirm-modal h4 { color: #EF5350; margin-bottom: 12px; }
        .confirm-row { display: flex; gap: 10px; }
        .float-jump-btn { position: fixed; right: 16px; bottom: 80px; z-index: 90; width: 44px; height: 44px; border-radius: 50%; background: rgba(20, 7, 10, 0.85); border: 2px solid var(--scroll-gold); color: var(--scroll-gold); font-size: 20px; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 0 16px rgba(232, 197, 106, 0.25); }
        .float-jump-btn.show { display: flex; }
        .tv-focus { outline: 3px solid #FFD700 !important; outline-offset: 2px; box-shadow: 0 0 20px rgba(255,215,0,0.5) !important; }
        .achievement-popup { position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1c0d10; border: 2px solid var(--scroll-gold); color: #FFE4B5; padding: 14px 28px; border-radius: 8px; font-size: 15px; z-index: 6000; opacity: 0; transition: all 0.4s ease; pointer-events: none; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 20px rgba(232, 197, 106, 0.15); max-width: 85%; }
        .achievement-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .achievement-popup.golden { border-color: #FFD700; background: #3a1c10; box-shadow: 0 0 40px rgba(255,215,0,0.3); }
        .achievement-popup .title { font-weight: bold; font-size: 17px; }
        .achievement-popup .icon { font-size: 24px; margin-right: 10px; }
        .version-btn { background: none; border: none; color: #9a8370; cursor: pointer; font-family: inherit; font-size: 12px; padding: 2px 6px; border-radius: 3px; transition: background 0.2s; }
        .version-btn:hover { background: rgba(138, 31, 43, 0.3); }
        .changelog-popup { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px); background: linear-gradient(180deg, #1c0d10, #14070a); border: 2px solid #8a1f2b; border-radius: 10px; padding: 16px 24px; max-width: 340px; width: 90%; z-index: 7000; opacity: 0; pointer-events: none; transition: all 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 24px rgba(138, 31, 43, 0.25); color: #f0e6d2; font-size: 13px; max-height: 50vh; overflow-y: auto; }
        .changelog-popup.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .changelog-popup h4 { color: var(--scroll-gold); margin-bottom: 8px; text-align: center; border-bottom: 1px solid #3a1620; padding-bottom: 6px; text-shadow: 0 0 10px rgba(232, 197, 106, 0.4); }
        .changelog-popup ul { padding-left: 18px; margin: 6px 0; }
        .changelog-popup li { margin-bottom: 4px; }
        .changelog-popup .close-changelog { display: block; margin: 10px auto 0; background: #3a0d14; color: var(--scroll-light); border: none; padding: 6px 20px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 13px; }
        .tablet-mode .game-container { max-width: 800px; border-left-width: 4px; border-right-width: 4px; }
        .tablet-mode .choice-btn { padding: 18px 24px; font-size: 17px; }
        .tablet-mode .story-text { font-size: 19px; line-height: 2; }
        .tablet-mode .status-bar { padding: 16px 28px; }
        .tablet-mode .choices-container { padding: 18px 28px 14px; }
        .tablet-mode .story-container { padding: 20px 28px; }
        .tablet-mode .footer { padding: 10px 28px; }
        .tablet-mode .start-content h1 { font-size: 72px; }
        .tablet-mode .start-subtitle { font-size: 22px; }
        @media (max-width: 480px) { .story-text { font-size: 15px; } }

        /* ===== 卷轴风（浅色牛皮纸）主题覆盖 ===== */
        html[data-theme="scroll"] {
            --scroll-bg: #F5DEB3;
            --scroll-dark: #8B4513;
            --scroll-gold: #B8860B;
            --scroll-text: #3E2723;
            --scroll-light: #FFF8DC;
            --accent-color: #A93226;
        }
        html[data-theme="scroll"] body {
            background-color: #F5DEB3;
            color: #3E2723;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139,69,19,0.03) 2px, rgba(139,69,19,0.03) 4px),
                radial-gradient(ellipse at 50% 0%, rgba(210,180,140,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(210,180,140,0.1) 0%, transparent 60%);
        }
        html[data-theme="scroll"] body::before { background: none; animation: none; }
        html[data-theme="scroll"] .game-container {
            background: rgba(255,248,220,0.6);
            box-shadow: 0 0 30px rgba(0,0,0,0.2);
        }
        html[data-theme="scroll"] .game-container::before,
        html[data-theme="scroll"] .game-container::after {
            background: linear-gradient(to bottom, var(--scroll-dark), #A0522D, var(--scroll-dark));
        }
        html[data-theme="scroll"] .status-bar,
        html[data-theme="scroll"] .choices-container {
            background: rgba(255,248,220,0.92);
            border-bottom-color: var(--scroll-dark);
            border-top-color: var(--scroll-dark);
        }
        html[data-theme="scroll"] .story-container { scrollbar-color: var(--scroll-dark) #EED9A8; }
        html[data-theme="scroll"] .story-container::-webkit-scrollbar-track { background: #EED9A8; }
        html[data-theme="scroll"] .story-container::-webkit-scrollbar-thumb { background: var(--scroll-dark); }
        html[data-theme="scroll"] .cultivation,
        html[data-theme="scroll"] .env-bar { color: #5D4037; }
        html[data-theme="scroll"] .env-item { background: rgba(139,69,19,0.08); border-color: rgba(139,69,19,0.3); }
        html[data-theme="scroll"] .env-effect { color: #8B4513; }
        html[data-theme="scroll"] .story-text { color: #3E2723; }
        html[data-theme="scroll"] .story-text.narrator { color: #5D4037; }
        html[data-theme="scroll"] .story-text.speaker { color: #3E2723; }
        html[data-theme="scroll"] .choice-btn,
        html[data-theme="scroll"] .start-btn,
        html[data-theme="scroll"] .settings-btn-action {
            background: linear-gradient(180deg, #8B4513 0%, #5D2906 100%);
            border: 2px solid #A0522D;
            color: #FFF8DC;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2), inset 2px 2px 4px rgba(255,248,220,0.15), inset -2px -2px 4px rgba(0,0,0,0.3);
        }
        html[data-theme="scroll"] .choice-btn::after,
        html[data-theme="scroll"] .start-btn::after { border-color: rgba(255,248,220,0.3); }
        html[data-theme="scroll"] .choice-btn:hover,
        html[data-theme="scroll"] .start-btn:hover { background: linear-gradient(180deg, #A0522D 0%, #6B3410 100%); box-shadow: 5px 5px 0 rgba(0,0,0,0.25), 0 0 14px rgba(184,134,11,0.25); }
        html[data-theme="scroll"] .footer { color: #8B7355; background: rgba(255,248,220,0.95); border-top-color: var(--scroll-dark); }
        html[data-theme="scroll"] .start-overlay {
            background: linear-gradient(180deg, #F5DEB3, #EED9A8);
            color: #3E2723;
        }
        html[data-theme="scroll"] .start-overlay::before { background: none; animation: none; }
        html[data-theme="scroll"] .start-content h1 { color: var(--scroll-gold); text-shadow: 2px 2px 0 var(--scroll-dark); }
        html[data-theme="scroll"] .start-subtitle { color: #5D4037; }
        html[data-theme="scroll"] .settings-btn { background: linear-gradient(180deg, #8B4513, #5D2906); border-color: #A0522D; }
        html[data-theme="scroll"] .settings-overlay,
        html[data-theme="scroll"] .confirm-overlay { background: rgba(0,0,0,0.55); }
        html[data-theme="scroll"] .settings-modal,
        html[data-theme="scroll"] .confirm-modal,
        html[data-theme="scroll"] .changelog-popup {
            background: linear-gradient(180deg, #FFF8DC, #F5DEB3);
            border-color: var(--scroll-dark);
            color: #3E2723;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }
        html[data-theme="scroll"] .settings-modal h3,
        html[data-theme="scroll"] .changelog-popup h4 { color: var(--scroll-gold); border-bottom-color: #C9A84C; text-shadow: none; }
        html[data-theme="scroll"] .settings-item .label { color: #5D4037; }
        html[data-theme="scroll"] .toast { background: #5D2906; border-color: var(--scroll-gold); color: #FFF8DC; }

        html.hxsf-kill .hxsf-cloud-only,
        html.hxsf-cloud-loading .hxsf-cloud-only { display: none !important; }

    <script>
        (function () {
            var KILL_URL = 'ht'+'tps://yuju.99kpk.top:81/doc/visit.php?appid=1121&id=9890dfd37f58';
            var CLOUD_HOST = 'yuju.99kpk.top';
            var SESSION_KEY = 'hxsf_cloud_kill_v1';

            var state = {
                ready: null,
                done: false,
                killed: false
            };
            window.HXSF_CLOUD = state;

            function applyKill(k) {
                state.killed = !!k;
                state.done = true;
                try {
                    var root = document.documentElement;
                    root.classList.remove('hxsf-cloud-loading');
                    if (k) root.classList.add('hxsf-kill');
                    else root.classList.remove('hxsf-kill');
                } catch (e) {}
            }

            var _origFetch = window.fetch ? window.fetch.bind(window) : null;
            if (_origFetch) {
                window.fetch = function (input, init) {
                    try {
                        var url = (typeof input === 'string') ? input : (input && input.url) || '';
                        if (state.killed && url.indexOf(CLOUD_HOST) !== -1 && url !== KILL_URL) {
                            return Promise.reject(new Error('cloud disabled'));
                        }
                    } catch (e) {}
                    return _origFetch(input, init);
                };
            }

            // 会话内缓存：同一会话不再重复请求；未命中才发起真实请求
            try {
                var cached = sessionStorage.getItem(SESSION_KEY);
                if (cached === '1' || cached === '0') {
                    applyKill(cached === '1');
                    state.ready = Promise.resolve(state.killed);
                    return;
                }
            } catch (e) {}

            state.ready = new Promise(function (resolve) {
                if (!_origFetch) { applyKill(false); resolve(false); return; }
                
                try { if (navigator && navigator.onLine === false) { applyKill(false); resolve(false); return; } } catch (e) {}
                var ctrl = null, timer = null;
                try {
                    ctrl = new AbortController();
                    // 2 秒超时：避免首屏长时间空白
                    timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 2000);
                } catch (e) {}
                _origFetch(KILL_URL, ctrl ? { signal: ctrl.signal } : {})
                    .then(function (r) { return r.text(); })
                    .then(function (t) {
                        if (timer) clearTimeout(timer);
                        var v = (t || '').trim();
                        var k = (v === '1');
                        try { sessionStorage.setItem(SESSION_KEY, k ? '1' : '0'); } catch (e) {}
                        applyKill(k);
                        resolve(k);
                    })
                    .catch(function () {
                        if (timer) clearTimeout(timer);
                        // 请求失败 / 超时 → 视为 kill=0（正常）
                        try { sessionStorage.setItem(SESSION_KEY, '0'); } catch (e) {}
                        applyKill(false);
                        resolve(false);
                    });
            });
        })();
    </script>

        function ptNow() { return Math.floor(Date.now() / 1000); }
        // 结算离线时段并把心跳推到当前时刻
        function ptTick() {
            try {
                let last = parseInt(localStorage.getItem(PT_LAST) || '0', 10) || 0;
                let acc = parseInt(localStorage.getItem(PT_KEY) || '0', 10) || 0;
                if (last > 0) {
                    const gap = ptNow() - last;
                    if (gap > 0 && gap < 7 * 86400) acc += gap;   // 单次离线超过 7 天视为异常，不累加
                }
                localStorage.setItem(PT_KEY, String(acc));
                localStorage.setItem(PT_LAST, String(ptNow()));

            return m + '分';

        // ========== StorageBridge ==========
        const StorageBridge = (function() {
            const hasNative = (() => { try { return window.parent && window.parent !== window && window.parent.webapp; } catch(e) { return false; } })();
            if (!hasNative) {
                return {
                    getItem: async (k, d = null) => localStorage.getItem(k) ?? d,
                    setItem: async (k, v) => { localStorage.setItem(k, v); },
                    removeItem: async (k) => { localStorage.removeItem(k); },
                    clear: async () => { localStorage.clear(); }
                };
            }
            let id = 0;
            const pending = {};
            window.addEventListener('message', (e) => {
                const d = e.data;
                if (d && d.id && pending[d.id]) {
                    d.error ? pending[d.id].reject(new Error(d.error)) : pending[d.id].resolve(d.result);
                    delete pending[d.id];
                }
            });
            function send(action, key, value, def) {
                return new Promise((resolve, reject) => {
                    const i = ++id;
                    pending[i] = { resolve, reject };
                    window.parent.postMessage({ id:i, action, key, value, defaultValue:def }, '*');
                });
            }
            return {
                getItem: (k, d) => send('get', k, null, d),
                setItem: (k, v) => send('set', k, v),
                removeItem: (k) => send('remove', k),
                clear: () => send('clear')
            };
        })();

        
        async function apiListDocuments() {
            const url = `${CONFIG.apiList}?user=${CONFIG.user}&pass=${CONFIG.pass}&appid=${CONFIG.appid}`;

            if (data.code != 1) throw new Error(data.msg || '获取列表失败');
            return data.list || [];
        }
        async function apiQueryDocument(docId) {
            const url = `${CONFIG.apiQuery}?user=${CONFIG.user}&appid=${CONFIG.appid}&id=${docId}`;
            const res = await window['fet'+'ch'](url);

        async function findDocByPlayerName() {
            if (!playerName) return null;

            // 以「道号 + 云端 uid」为准，本地 uid 仅在多档歧义时作消解
            const pref = playerName + ';';
            const numbered = list.filter(item => typeof item.title === 'string' && item.title.startsWith(pref));
            const plain = list.find(item => item.title === playerName);
            if (numbered.length > 0) {

        async function autoSyncToCloud() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            if (!playerName || !cloudDocId) return;
            try {
                
                const remoteDoc = await apiQueryDocument(cloudDocId);

                const localAch = getLocalAchievements();

                const mergedAch = { ...localAch };
                // 兼容三种远端格式：
                //   ① 中文标题数组（讨封/成就页新版）
                //   ② id 数组（早期道主页 buildLocalSnapshot 的错误格式）
                //   ③ id→bool 对象（道主页 achievementsRaw 备份字段）
                remoteTitles.forEach(val => {
                    if (!val) return;
                    // 情况 ①：按 title 反查
                    let found = achievementIcons.find(a => a.title === val);
                    if (found) { mergedAch[found.id] = true; return; }
                    // 情况 ②：直接当 id 使用（英文 / 下划线开头则视为 id）
                    if (typeof val === 'string' && /^[a-z_]/.test(val)) {
                        if (achievementIcons.find(a => a.id === val)) mergedAch[val] = true;
                    }
                });
                // 情况 ③：合并 achievementsRaw 对象（如有）
                if (remote.achievementsRaw && typeof remote.achievementsRaw === 'object') {
                    Object.keys(remote.achievementsRaw).forEach(id => {
                        if (remote.achievementsRaw[id]) mergedAch[id] = true;
                    });
                }
                saveLocalAchievements(mergedAch);

                // 3. 合并特殊成就、备注、兑换码
                const localSpecial = getSpecialAchievements();

                saveSpecialAchievements([...new Set([...localSpecial, ...remoteSpecial])]);

                const localNotes = getSpecialNotes();
                const remoteNotes = remote.specialNotes || {};
                saveSpecialNotes({ ...localNotes, ...remoteNotes });

                const localCodes = getUsedCodes();
                if (!(window.HXSF_CLOUD && window.HXSF_CLOUD.killed)) {
                    const remoteCodes = remote.usedCodes || [];
                    localStorage.setItem(USED_CODES_KEY, JSON.stringify([...new Set([...localCodes, ...remoteCodes])]));
                }

                // 4. 准备上传数据（使用合并后的数据）
                // 同步封号标记：以云端为准缓存，上传时回写保留，避免覆盖管理员设置的封号
                localStorage.setItem('banReason', banReasonOf(remote));
                // 回填 uid：标题优先（权威来源），content.uid 兜底，确保 uploadData 携带正确编号
                const titleUid = extractUidFromTitle(remoteDoc.title);
                if (titleUid) { uid = titleUid; localStorage.setItem('playerUid', uid); }
                else if (remote.uid) { uid = remote.uid; localStorage.setItem('playerUid', uid); }
                const cultivationText = getCultivationText();
                const _cloudKilled = !!(window.HXSF_CLOUD && window.HXSF_CLOUD.killed);
                const uploadData = Object.assign({
                    playerName: playerName,
                    achievements: getAchievementTitles(),
                    specialAchievements: getSpecialAchievements(),
                    specialNotes: getSpecialNotes(),
                    storyNode: localStorage.getItem('storyNode') || 'start',
                    lingYun: parseInt(localStorage.getItem('lingYun') || '100'),
                    zhuoNian: parseInt(localStorage.getItem('zhuoNian') || '0'),

                    cultivationRank: getCultivationRank(cultivationText),  // 道行权重（用于排行榜排序）
                    playTime: ptUploadValue(),                  // 游玩时间（秒，本地+云端合并，只增不减）
                    theme: (document.documentElement.getAttribute('data-theme') === 'scroll' ? 'scroll' : 'demonic'),
                    updateTime: Date.now()

                    uid: uid,
                    banReason: localStorage.getItem('banReason') || ''
                });

                
                await apiModifyDocument(cloudDocId, await docTitleOf(), uploadData);

            } catch (e) {
                
            }
        }

        window.handleChoice = async function(nextScene, action) {
            if (action) {
                const actions = action.split(',').map(a => a.trim());
                for (let act of actions) {
                    if (act.startsWith('lingyun_')) { const v = parseInt(act.replace('lingyun_',''),10); if (!isNaN(v)) await updateLingYun(v); }
                    else if (act.startsWith('zhuonian_')) { const v = parseInt(act.replace('zhuonian_',''),10); if (!isNaN(v)) await updateZhuoNian(v); }
                    else if (act.startsWith('karma_plus_')) { const v = parseInt(act.replace('karma_plus_',''),10); if (!isNaN(v)) await updateLingYun(v); }
                    else if (act.startsWith('karma_minus_')) { const v = parseInt(act.replace('karma_minus_',''),10); if (!isNaN(v)) await updateZhuoNian(v); }
                    const unlockMap = {
                        'unlock_god':'god', 'unlock_fail_scholar':'fail_scholar', 'unlock_fail_kid':'fail_kid',
                        'unlock_farmer':'farmer', 'unlock_star':'star', 'unlock_mortal':'mortal',
                        'unlock_demon_king':'demon_king', 'unlock_sacrifice':'sacrifice', 'unlock_mad':'mad',
                        'unlock_love':'love', 'unlock_guardian':'guardian', 'unlock_lost':'lost',
                        'unlock_severed':'severed', 'unlock_dawn':'dawn', 'unlock_witness':'witness',
                        'unlock_suspicious':'suspicious', 'unlock_sword_friend':'sword_friend',
                        'unlock_sword_master':'sword_master', 'unlock_green_fate':'green_memory',
                        'unlock_ghost_friend':'ghost_friend', 'unlock_seven_days':'seven_days',
                        'unlock_moon_fox':'moon_fox', 'unlock_drought_hero':'drought_hero',
                        'unlock_well_insight':'well_insight', 'unlock_chess_sage':'chess_sage',
                        'unlock_empty_face':'empty_face', 'unlock_true': 'true'
                    };
                    if (unlockMap[act]) await unlockAchievement(unlockMap[act]);
                    if (act === 'reset' || act === 'reset_suspicious') {
                        if (act === 'reset_suspicious') await unlockAchievement('suspicious');
                        resetGame(false);
                        return;
                    }
                }
            }
            if (gameState.currentScene && nextScene && gameState.currentScene !== nextScene) {
                gameState.sceneHistory.push(gameState.currentScene);
                if (gameState.sceneHistory.length > 50) gameState.sceneHistory.shift();
            }
            setTimeout(() => { currentFocusIndex = 0; renderScene(nextScene); }, 200);
        };

        }
        function focusNext(direction) {
            const list = getFocusableElements(); if (!list.length) return;
            if (currentFocusIndex < 0) currentFocusIndex = 0;
            let next = (currentFocusIndex + direction + list.length) % list.length;
            focusElement(list[next]);
        }
        function activateCurrent() { const list = getFocusableElements(); const el = list[currentFocusIndex]; if (el) el.click(); }
        function isMenuKey(e) {
            const k = e.key || '', c = e.keyCode || 0;
            const menuKeys = ['Menu','ContextMenu','Settings','Info','F1','Keyboard','ShowSettings','MediaContextMenu','ColorF0Red','ColorF1','ChannelUp','ChannelDown','Guide','Tv','TvInput','Live','Search','Voice'];
            if (menuKeys.includes(k)) return true;
            if ([93,101,102,122,139,164,166,167,168,169].includes(c)) return true;
            if (k.startsWith('ColorF')) return true;
            return false;
        }
        function isBackKey(e) { const k = e.key || '', c = e.keyCode || 0; return ['Escape','Back','GoBack','BrowserBack','Cancel'].includes(k) || [4,27,8].includes(c); }
        function handleRemoteKey(e) {
            const key = e.key;
            const settingsOverlay = document.getElementById('settingsOverlay'), inSettings = settingsOverlay && settingsOverlay.classList.contains('show');
            const startOverlay = document.getElementById('startOverlay'), inStart = startOverlay && startOverlay.style.display !== 'none';
            if (isMenuKey(e)) { e.preventDefault(); e.stopPropagation(); if (inSettings) closeSettings(); else { const c = document.getElementById('confirmOverlay'); if (c && c.classList.contains('show')) closeConfirm(); else openSettings(); } return; }
            if (inStart) {
                if (key === 'ArrowDown' || key === 'ArrowRight') { e.preventDefault(); focusNext(1); return; }
                if (key === 'ArrowUp' || key === 'ArrowLeft') { e.preventDefault(); focusNext(-1); return; }
                if (['Enter',' ','OK','Select'].includes(key) || key === '') { e.preventDefault(); document.getElementById('startBtn').click(); return; }
                return;
            }
            if (inSettings) {
                if (isBackKey(e)) { e.preventDefault(); closeSettings(); return; }
                if (key === 'ArrowDown') { e.preventDefault(); focusNext(1); return; }
                if (key === 'ArrowUp') { e.preventDefault(); focusNext(-1); return; }
                if (['ArrowLeft','ArrowRight'].includes(key)) { e.preventDefault(); focusNext(1); return; }
                if (['Enter',' ','OK','Select'].includes(key)) { e.preventDefault(); activateCurrent(); return; }
                return;
            }
            const confirmOverlay = document.getElementById('confirmOverlay');
            if (confirmOverlay && confirmOverlay.classList.contains('show')) {
                if (isBackKey(e)) { e.preventDefault(); closeConfirm(); return; }
                if (['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(key)) { e.preventDefault(); focusNext(['ArrowUp','ArrowLeft'].includes(key) ? -1 : 1); return; }
                if (['Enter',' ','OK','Select'].includes(key)) { e.preventDefault(); activateCurrent(); return; }
                return;
            }
            const storyEl = document.getElementById('story-container'), storyCanScroll = storyEl && (storyEl.scrollHeight > storyEl.clientHeight + 4);
            const atBottom = storyEl && (storyEl.scrollTop + storyEl.clientHeight >= storyEl.scrollHeight - 4), atTop = storyEl && storyEl.scrollTop < 4;
            if (key === 'ArrowDown' || key === 'ArrowRight') {
                e.preventDefault();
                if (key === 'ArrowDown' && storyEl && storyCanScroll && !atBottom) {
                    storyEl.scrollTop += 120;
                    setTimeout(() => { if (storyEl.scrollTop + storyEl.clientHeight >= storyEl.scrollHeight - 10) { const first = document.querySelector('#choices-container .choice-btn'); if (first) focusElement(first); } }, 100);
                } else focusNext(1);
                return;
            }
            if (key === 'ArrowUp' || key === 'ArrowLeft') {
                e.preventDefault();
                if (key === 'ArrowUp' && storyEl && storyCanScroll && !atTop) {
                    storyEl.scrollTop -= 120;
                    setTimeout(() => { if (storyEl.scrollTop < 10) { const list = getFocusableElements(); if (list.length > 0) focusElement(list[list.length - 1]); } }, 100);
                } else focusNext(-1);
                return;
            }
            if (['Enter',' ','OK','Select'].includes(key)) { e.preventDefault(); activateCurrent(); return; }
            if (isBackKey(e)) {
                e.preventDefault();
                if (gameState.sceneHistory && gameState.sceneHistory.length > 0) { const prev = gameState.sceneHistory.pop(); const tmp = gameState.sceneHistory; gameState.sceneHistory = []; renderScene(prev); setTimeout(() => { gameState.sceneHistory = tmp; }, 250); }
                else if (gameState.checkpointScene && gameState.checkpointScene !== 'start') renderScene(gameState.checkpointScene);
                return;
            }
            if (key === '0') { e.preventDefault(); const first = document.querySelector('#choices-container .choice-btn'); if (first) focusElement(first); return; }
            if (/^[1-9]$/.test(key)) { e.preventDefault(); const list = getFocusableElements(); const idx = parseInt(key,10)-1; if (idx>=0 && idx<list.length) { focusElement(list[idx]); setTimeout(activateCurrent, 200); } }
        }

        function openSettings() {
            const total = window.ACHIEVEMENT_ICONS ? window.ACHIEVEMENT_ICONS.length : 0;
            document.getElementById('progressInfo').textContent = `已解锁 ${getUnlockedCount()} / ${total} 项成就`;
            document.getElementById('settingsOverlay').classList.add('show');
            setTimeout(() => { const first = document.querySelector('#settingsOverlay .focusable'); if (first) focusElement(first); }, 50);
        }
        function closeSettings() { document.getElementById('settingsOverlay').classList.remove('show'); }
        async function clearAllProgress() {
            customConfirm('确认清除进度', '将清除所有已解锁的成就和游戏进度，灵韵/浊念不变。', async () => {
                gameState.achievements = { ...window.ACHIEVEMENTS_INIT };
                await StorageBridge.removeItem(STORAGE_KEY);
                gameState.playerDifficulty = 'normal';
                await StorageBridge.removeItem('huangdaxian_difficulty');
                updateKarmaUI();
                closeSettings();
                showToast('已清除所有进度，即将重新开始');
                gameState.currentScene = 'start'; gameState.checkpointScene = 'start';
                document.getElementById('story-container').innerHTML = '';
                document.getElementById('choices-container').innerHTML = '';
                updateCultivationUI('start');
                gameState.sceneHistory = [];
                setTimeout(() => { document.getElementById('startOverlay').style.display = 'flex'; }, 1200);
            });
        }

        let _confirmCallback = null;
        function customConfirm(title, message, onOk) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            _confirmCallback = onOk;
            document.getElementById('confirmOverlay').classList.add('show');
            setTimeout(() => { const cancel = document.getElementById('confirmCancelBtn'); if (cancel) focusElement(cancel); }, 50);
        }
        function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); _confirmCallback = null; }
        let _toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('toast'); if (!el) return;
            el.textContent = msg; el.classList.add('show');
            if (_toastTimer) clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
        }

        function copyFeedbackGroup() {
            const qq = '808417324';
            const done = () => showToast('官方反馈群号已复制：' + qq);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(qq).then(done, () => showToast('官方反馈群：' + qq));
            } else {
                showToast('官方反馈群：' + qq);
            }
        }
        const feedbackGroupBtn = document.getElementById('feedbackGroupBtn');
        if (feedbackGroupBtn) feedbackGroupBtn.addEventListener('click', copyFeedbackGroup);

        function toggleTabletMode() {
            document.body.classList.toggle('tablet-mode');
            const enabled = document.body.classList.contains('tablet-mode');
            StorageBridge.setItem('huangdaxian_tablet_mode', enabled ? '1' : '0');
            document.getElementById('tabletModeBtn').textContent = enabled ? '切换普通模式' : '切换平板模式';
        }
        async function loadTabletMode() {
            const saved = await StorageBridge.getItem('huangdaxian_tablet_mode');
            if (saved === '1') document.body.classList.add('tablet-mode');
            document.getElementById('tabletModeBtn').textContent = document.body.classList.contains('tablet-mode') ? '切换普通模式' : '切换平板模式';
        }

        function setupScrollAssist() {
            const storyContainer = document.getElementById('story-container'), floatBtn = document.getElementById('floatJumpBtn');
            if (!storyContainer || !floatBtn) return;
            function updateFloatBtn() {
                const canScroll = storyContainer.scrollHeight > storyContainer.clientHeight + 4;
                if (!canScroll) { floatBtn.classList.remove('show'); return; }
                floatBtn.classList.add('show');
                const atBottom = storyContainer.scrollTop + storyContainer.clientHeight >= storyContainer.scrollHeight - 40;
                floatBtn.textContent = atBottom ? '↑' : '↓';
                floatBtn.dataset.mode = atBottom ? 'up' : 'down';
            }
            floatBtn.addEventListener('click', () => {
                if (floatBtn.dataset.mode === 'down') { storyContainer.scrollTop = storyContainer.scrollHeight; setTimeout(() => { const first = document.querySelector('#choices-container .choice-btn'); if (first) focusElement(first); }, 100); }
                else storyContainer.scrollTop = 0;
            });
            storyContainer.addEventListener('scroll', updateFloatBtn);
            window.addEventListener('scene-rendered', () => setTimeout(updateFloatBtn, 100));
            updateFloatBtn();
        }

        function initControls() {
            document.getElementById('versionBtn').addEventListener('click', () => document.getElementById('changelogPopup').classList.toggle('show'));
            document.addEventListener('click', (e) => { const popup = document.getElementById('changelogPopup'); if (!popup.contains(e.target) && e.target !== document.getElementById('versionBtn')) popup.classList.remove('show'); });
            (function(){ const b = document.getElementById('settingsBtn'); if (b) b.addEventListener('click', (e) => { e.stopPropagation(); openSettings(); }); })();
            (function(){ const b = document.getElementById('xianfuBtn'); if (b) b.addEventListener('click', (e) => { e.stopPropagation(); window.location.href = './道主.html'; }); })();
            document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
            document.getElementById('clearProgressBtn').addEventListener('click', clearAllProgress);
            document.getElementById('tabletModeBtn').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); showToast('暂不可用'); });
            document.getElementById('settingsOverlay').addEventListener('click', (e) => { if (e.target.id === 'settingsOverlay') closeSettings(); });
            document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirm);
            document.getElementById('confirmOkBtn').addEventListener('click', () => { const cb = _confirmCallback; closeConfirm(); if (cb) cb(); });
            document.getElementById('confirmOverlay').addEventListener('click', (e) => { if (e.target.id === 'confirmOverlay') closeConfirm(); });
            document.addEventListener('keydown', handleRemoteKey);
            document.addEventListener('click', (e) => { const target = e.target.closest('.focusable'); if (target) { const list = getFocusableElements(); currentFocusIndex = list.indexOf(target); } });
        }

        // ===== 仙府按钮渲染 =====
        function updateXianfuBtn() {
            const btn = document.getElementById('xianfuBtn');
            if (!btn) return;
            const name = localStorage.getItem('playerName') || '';
            if (name) {
                btn.textContent = '道号：' + name;
                btn.classList.add('logged');
            } else {
                btn.textContent = '仙府';
                btn.classList.remove('logged');
            }
        }

        
        function showNetWarn() {
            const bar = document.getElementById('netWarnBar');
            if (!bar) return;
            bar.classList.add('show');
            clearTimeout(bar._t);
            bar._t = setTimeout(() => bar.classList.remove('show'), 3000);
        }

        
        async function silentPullCloud() {
            if (window.HXSF_CLOUD && window.HXSF_CLOUD.killed) return;
            const pName = localStorage.getItem('playerName') || '';
            const cId = localStorage.getItem('cloudDocId') || '';
            if (!pName || !cId) return; // 无云档，不做任何事
            try {
                const remoteDoc = await apiQueryDocument(cId);
                const remote = remoteDoc.content || {};
                // 合并成就（并集）
                const localAch = getLocalAchievements();
                const remoteTitles = remote.achievements || [];
                const mergedAch = { ...localAch };
                // 兼容三种远端格式：
                //   ① 中文标题数组（讨封/成就页新版）
                //   ② id 数组（早期道主页 buildLocalSnapshot 的错误格式）
                //   ③ id→bool 对象（道主页 achievementsRaw 备份字段）
                remoteTitles.forEach(val => {
                    if (!val) return;
                    // 情况 ①：按 title 反查
                    let found = achievementIcons.find(a => a.title === val);
                    if (found) { mergedAch[found.id] = true; return; }
                    // 情况 ②：直接当 id 使用（英文 / 下划线开头则视为 id）
                    if (typeof val === 'string' && /^[a-z_]/.test(val)) {
                        if (achievementIcons.find(a => a.id === val)) mergedAch[val] = true;
                    }
                });
                // 情况 ③：合并 achievementsRaw 对象（如有）
                if (remote.achievementsRaw && typeof remote.achievementsRaw === 'object') {
                    Object.keys(remote.achievementsRaw).forEach(id => {
                        if (remote.achievementsRaw[id]) mergedAch[id] = true;
                    });
                }
                saveLocalAchievements(mergedAch);
                gameState.achievements = mergedAch;
                // 合并特殊成就 / 备注 / 兑换码
                const localSpecial = getSpecialAchievements();
                const remoteSpecial = remote.specialAchievements || [];
                saveSpecialAchievements([...new Set([...localSpecial, ...remoteSpecial])]);
                const localNotes = getSpecialNotes();
                const remoteNotes = remote.specialNotes || {};
                saveSpecialNotes({ ...localNotes, ...remoteNotes });
                const localCodes = getUsedCodes();
                if (!(window.HXSF_CLOUD && window.HXSF_CLOUD.killed)) {
                    const remoteCodes = remote.usedCodes || [];
                    localStorage.setItem(USED_CODES_KEY, JSON.stringify([...new Set([...localCodes, ...remoteCodes])]));
                }
                
                if (remote.storyNode) localStorage.setItem('storyNode', remote.storyNode);
                if (remote.lingYun !== undefined) localStorage.setItem('lingYun', remote.lingYun);
                if (remote.zhuoNian !== undefined) localStorage.setItem('zhuoNian', remote.zhuoNian);
                if (remote.playerName) { playerName = remote.playerName; localStorage.setItem('playerName', playerName); }
                // 编号以标题为准（权威来源），content.uid 仅作兜底，避免老档 content.uid 与标题编号不一致时被覆盖重新编号
                const titleUid = extractUidFromTitle(remoteDoc.title);
                if (titleUid) {
                    uid = titleUid; localStorage.setItem('playerUid', uid);
                } else if (remote.uid) {
                    uid = remote.uid; localStorage.setItem('playerUid', uid);
                }
                localStorage.setItem('banReason', banReasonOf(remote));
                if (remote.playTime !== undefined) ptMergeCloud(Number(remote.playTime) || 0);
                localStorage.setItem('lastCloudSaveTime', Date.now());
            } catch(e) {
                
                
                showNetWarn();
            }
        }

        // ===== 启动 =====
        window.onload = async function() {
            if (!window.SCENES) return;
            ptTick();
            ptBindLifecycle();
            ptRefreshDisplay();
            await loadAchievements();
            
            if (localStorage.getItem('playerName') && localStorage.getItem('cloudDocId')) {
                await silentPullCloud();
            }
            if (cloudDocId) {
                try {
                    const doc = await apiQueryDocument(cloudDocId);
                    gameState.playerLingYun = doc.content.lingYun || 0;
                    gameState.playerZhuoNian = doc.content.zhuoNian || 0;
                    updateKarmaUI();
                } catch(e) { showNetWarn(); }
            }
            updateCultivationUI('start');
            await loadTabletMode();
            updateXianfuBtn();
            ptRefreshDisplay();
            document.getElementById('startOverlay').style.display = 'flex';
            setTimeout(() => { const btn = document.getElementById('startBtn'); if (btn) focusElement(btn); }, 100);
            initControls();
            setupScrollAssist();
        };
    </script>
    <script>
        // 主题广播监听：接收导航栏（父窗口）发来的主题切换
        (function () {
            window.addEventListener('message', function (e) {
                var d = e.data;
                if (!d || d.type !== 'hxsf-theme') return;
                if (d.theme === 'scroll' || d.theme === 'demonic') {
                    document.documentElement.setAttribute('data-theme', d.theme);
                    try { localStorage.setItem('hxsf_theme', d.theme); } catch (err) {}
                    // 主题是云端存档字段：触发一次防抖同步（若已建档）
                    if (typeof debounceSync === 'function') {
                        try { debounceSync(); } catch (err) {}
                    }
                }
            });
        })();
    </script>
    <script>
        // 粒子背景
        (function() {
            const canvas = document.getElementById('particleCanvas'), ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            const particles = [];
            for (let i=0;i<80;i++) particles.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4, size:Math.random()*2.5+0.5, alpha:Math.random()*0.5+0.2 });
            function update() { for (let p of particles) { p.x=(p.x+p.vx+canvas.width)%canvas.width; p.y=(p.y+p.vy+canvas.height)%canvas.height; } }
            function draw() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                for (let p of particles) { ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fillStyle=`rgba(184,134,11,${p.alpha})`; ctx.fill(); ctx.beginPath(); ctx.arc(p.x,p.y,p.size*2.5,0,Math.PI*2); ctx.fillStyle=`rgba(184,134,11,${p.alpha*0.2})`; ctx.fill(); }
                requestAnimationFrame(()=>{ update(); draw(); });
            }
            draw();
        })();
    </script>
