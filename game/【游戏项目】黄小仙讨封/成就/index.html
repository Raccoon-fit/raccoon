<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>黄小仙 · 成就图鉴</title>
    <meta name="theme-color" content="#0a0a0f">
    <style>
        :root {
            --bg-color: #0a0a0d;
            --text-color: #9a9892;
            --accent-color: #5a7588;
            --highlight-color: #d8d4cc;
            --btn-border: #3a3834;
            --btn-hover: #141418;
            --legendary: #8cb4d8;
            --legendary-glow: rgba(140, 180, 216, 0.35);
            --unlocked-border: #5a5550;
            --unlocked-text: #c8c4bc;
            --card-bg: #0c0c10;
            --card-border: #1a1a1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(90, 117, 136, 0.04) 0%, transparent 70%),
                radial-gradient(ellipse at 50% 100%, rgba(90, 117, 136, 0.03) 0%, transparent 70%);
        }

        .page-container {
            max-width: 680px;
            width: 100%;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 28px 20px 10px;
            position: relative;
            border-bottom: 1px solid #1a1a1e;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #e8e4dc;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 6px;
            text-shadow: 0 0 2px rgba(200, 196, 188, 0.12);
        }
        .header .subtitle {
            color: #5a5650;
            font-size: 13px;
            letter-spacing: 2px;
            font-style: italic;
        }
        .header .stats {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header .stats .stat-item {
            background: #0f0f14;
            border: 1px solid #1a1a1e;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            color: #7a7670;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .header .stats .stat-item.highlight {
            border-color: #5a5550;
            color: #c8c4bc;
            background: #141210;
        }
        .header .stats .stat-count {
            font-weight: bold;
            font-size: 22px;
            color: #d8d4cc;
            letter-spacing: 0;
        }
        .header .top-actions {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .header .action-link {
            display: inline-block;
            color: #5a5650;
            font-size: 12px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s;
            cursor: pointer;
            background: transparent;
            border: 1px solid #2a2824;
            padding: 6px 18px;
            border-radius: 3px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .header .action-link:hover {
            color: #8cb4d8;
            border-color: #5a7588;
        }
        .header .action-link:active {
            background: #141a20;
            color: #8cb4d8;
            border-color: #7a9ab0;
        }

        .section-title {
            color: #6b6560;
            font-size: 13px;
            letter-spacing: 3px;
            text-align: center;
            padding: 14px 0 8px;
            border-top: 1px solid #1a1a1e;
            margin-top: 8px;
            text-transform: uppercase;
        }
        .section-title.legendary-title {
            color: #8cb4d8;
            border-top-color: #1a2028;
        }

        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            width: 100%;
        }

        .achievement-row {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 4px;
            transition: all 0.35s ease;
            cursor: default;
            position: relative;
            border-bottom: 1px solid rgba(26, 26, 30, 0.5);
            min-height: 56px;
            gap: 14px;
        }
        .achievement-row:hover {
            background: rgba(20, 20, 26, 0.6);
        }
        .achievement-row:last-child {
            border-bottom: none;
        }

        .achievement-icon-cell {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border: 1px solid #2a2824;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #0c0c10;
            color: #e8e4dc;
            transition: all 0.5s ease;
            position: relative;
        }
        .achievement-row.unlocked .achievement-icon-cell {
            opacity: 1;
            border-color: #5a5550;
            background: #141210;
            box-shadow: 0 0 8px rgba(90, 85, 80, 0.2);
        }
        .achievement-row.unlocked.legendary .achievement-icon-cell {
            border-color: #7a9ab0;
            background: #181d24;
            box-shadow: 0 0 14px var(--legendary-glow), 0 0 28px rgba(140, 180, 216, 0.12);
            animation: legendaryPulse 3.5s ease-in-out infinite;
        }
        @keyframes legendaryPulse {
            0%,
            100% {
                box-shadow: 0 0 14px var(--legendary-glow), 0 0 28px rgba(140, 180, 216, 0.12);
            }
            50% {
                box-shadow: 0 0 22px rgba(140, 180, 216, 0.45), 0 0 38px rgba(140, 180, 216, 0.22);
            }
        }
        .achievement-row.locked .achievement-icon-cell {
            opacity: 0.25;
            border-color: #1a1a1e;
            background: #08080c;
            color: #3a3834;
            filter: grayscale(0.6);
        }

        .achievement-info {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 6px;
            min-width: 0;
        }
        .achievement-name {
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: all 0.35s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .achievement-row.unlocked .achievement-name {
            color: #c8c4bc;
        }
        .achievement-row.unlocked.legendary .achievement-name {
            color: #8cb4d8;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(140, 180, 216, 0.25);
        }
        .achievement-row.locked .achievement-name {
            color: #3a3834;
            font-style: italic;
        }

        .achievement-badge {
            flex-shrink: 0;
            font-size: 10px;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid;
            opacity: 0.7;
            transition: all 0.35s ease;
        }
        .achievement-row.unlocked .achievement-badge {
            border-color: #5a5550;
            color: #8a8580;
            background: rgba(90, 85, 80, 0.06);
        }
        .achievement-row.unlocked.legendary .achievement-badge {
            border-color: #7a9ab0;
            color: #8cb4d8;
            background: rgba(140, 180, 216, 0.08);
            opacity: 0.9;
        }
        .achievement-row.locked .achievement-badge {
            border-color: #1a1a1e;
            color: #2a2824;
            background: transparent;
            opacity: 0.5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #3a3834;
            font-style: italic;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .footer-note {
            text-align: center;
            padding: 20px 16px;
            color: #2a2824;
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: auto;
            border-top: 1px solid #111115;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .footer-note a {
            color: #4a4640;
            text-decoration: none;
            transition: color 0.3s;
            cursor: pointer;
        }
        .footer-note a:hover {
            color: #8cb4d8;
        }
        .storage-status {
            font-size: 9px;
            color: #3a3834;
            letter-spacing: 0.5px;
        }
        .storage-status.recovered {
            color: #8cb4d8;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #141a20;
            border: 1px solid #5a7588;
            color: #8cb4d8;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            white-space: nowrap;
            font-family: inherit;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
        .toast.error {
            border-color: #8a4a4a;
            color: #d8a0a0;
            background: #1a1014;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .modal-box {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-height: 80vh;
        }
        .modal-textarea {
            width: 100%;
            height: 100px;
            max-height: 180px;
            background: #0c0c10;
            border: 1px solid #5a5550;
            border-radius: 4px;
            padding: 10px;
            font-size: 10px;
            font-family: monospace;
            color: #c8c4bc;
            resize: vertical;
            line-height: 1.4;
            word-break: break-all;
        }
        .modal-textarea.error-style {
            border-color: #8a4a4a;
            color: #d8a0a0;
        }
        .modal-hint {
            color: #6b6560;
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
            margin: 0;
        }
        .modal-hint.error-style {
            color: #d8a0a0;
        }
        .modal-btn {
            padding: 8px 24px;
            background: #141210;
            color: #c8c4bc;
            border: 1px solid #5a5550;
            border-radius: 4px;
            font-family: inherit;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.3s;
        }
        .modal-btn:hover {
            border-color: #8cb4d8;
            color: #8cb4d8;
            background: #141a20;
        }
        .modal-btn.error-style {
            background: #1a1014;
            color: #d8a0a0;
            border-color: #8a4a4a;
        }
        .modal-btn.error-style:hover {
            border-color: #d8a0a0;
            background: #201418;
        }

        .refresh-indicator {
            text-align: center;
            font-size: 10px;
            color: #2a2824;
            letter-spacing: 1px;
            padding: 4px;
        }

        @keyframes fadeInRow {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .achievement-row { animation: fadeInRow 0.5s ease forwards; }
        .achievement-row:nth-child(1) { animation-delay: 0.02s; }
        .achievement-row:nth-child(2) { animation-delay: 0.04s; }
        .achievement-row:nth-child(3) { animation-delay: 0.06s; }
        .achievement-row:nth-child(4) { animation-delay: 0.08s; }
        .achievement-row:nth-child(5) { animation-delay: 0.10s; }
        .achievement-row:nth-child(6) { animation-delay: 0.12s; }
        .achievement-row:nth-child(7) { animation-delay: 0.14s; }
        .achievement-row:nth-child(8) { animation-delay: 0.16s; }
        .achievement-row:nth-child(9) { animation-delay: 0.18s; }
        .achievement-row:nth-child(10) { animation-delay: 0.20s; }
        .achievement-row:nth-child(n+11) { animation-delay: 0.22s; }

        @media (max-width: 480px) {
            .header h1 { font-size: 24px; letter-spacing: 2px; }
            .achievement-icon-cell { width: 38px; height: 38px; font-size: 17px; }
            .achievement-name { font-size: 14px; }
            .achievement-row { padding: 8px 10px; gap: 10px; min-height: 48px; }
            .achievement-badge { font-size: 9px; padding: 2px 8px; }
            .page-container { padding: 12px 8px 30px; }
            .header .top-actions { gap: 10px; }
            .header .action-link { font-size: 10px; padding: 4px 10px; }
            .modal-textarea { height: 80px; font-size: 9px; }
        }

        @media (min-width: 768px) {
            .achievement-icon-cell { width: 52px; height: 52px; font-size: 24px; }
            .achievement-name { font-size: 17px; }
            .achievement-row { padding: 14px 20px; gap: 18px; min-height: 64px; }
            .header h1 { font-size: 40px; }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <h1>黄小仙</h1>
            <p class="subtitle">成就图鉴</p>
            <div class="stats">
                <span class="stat-item highlight">
                    已解锁 <span class="stat-count" id="unlockedCount">0</span> / <span id="totalCount">40</span>
                </span>
                <span class="stat-item" id="legendaryStat" style="display:none;">
                    ✦ 传说 <span class="stat-count" id="legendaryCount">0</span>
                </span>
            </div>
            <div class="top-actions">
                <span class="action-link" id="btnExportTop">📤 导出仙籍</span>
                <span class="action-link" id="btnImportTop">📥 导入仙籍</span>
            </div>
        </div>

        <div id="unlockedSection">
            <div class="section-title legendary-title" id="unlockedTitle" style="display:none;">✦ 已解锁的成就 ✦</div>
            <div class="achievement-list" id="unlockedList"></div>
            <div class="empty-state" id="unlockedEmpty">尚无成就解锁，去游戏中探索吧</div>
        </div>

        <div id="lockedSection">
            <div class="section-title" id="lockedTitle">尚未解锁</div>
            <div class="achievement-list" id="lockedList"></div>
        </div>

        <div class="refresh-indicator" id="refreshNote"></div>

        <div class="footer-note">
            <span class="storage-status" id="storageStatus"></span>
            <span>黄小仙 · 成就图鉴</span>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== 跨域存储桥（适配导航栏原生存储，回退 localStorage） ==========
        const StorageBridge = (function() {
            const hasNativeBridge = (() => {
                try {
                    return window.parent && window.parent !== window && window.parent.webapp;
                } catch (e) { return false; }
            })();

            if (!hasNativeBridge) {
                return {
                    getItem: async (key, defaultValue = null) => localStorage.getItem(key) ?? defaultValue,
                    setItem: async (key, value) => { localStorage.setItem(key, value); },
                    removeItem: async (key) => { localStorage.removeItem(key); },
                    clear: async () => { localStorage.clear(); }
                };
            }

            let callId = 0;
            const pending = {};

            window.addEventListener('message', function(event) {
                const data = event.data;
                if (data && data.id && pending[data.id]) {
                    if (data.error) {
                        pending[data.id].reject(new Error(data.error));
                    } else {
                        pending[data.id].resolve(data.result);
                    }
                    delete pending[data.id];
                }
            });

            function sendMessage(action, key, value, defaultValue) {
                return new Promise(function(resolve, reject) {
                    const id = ++callId;
                    pending[id] = { resolve, reject };
                    window.parent.postMessage({
                        id: id,
                        action: action,
                        key: key,
                        value: value,
                        defaultValue: defaultValue
                    }, '*');
                });
            }

            return {
                getItem: (key, defaultValue = null) => sendMessage('get', key, null, defaultValue),
                setItem: (key, value) => sendMessage('set', key, value),
                removeItem: (key) => sendMessage('remove', key),
                clear: () => sendMessage('clear')
            };
        })();

        // ========== 成就图标数据 ==========
        const achievementIcons = [
            { id: 'witness', title: '无对无错，善良依旧', icon: '✦', legendary: true },
            { id: 'sacrifice', title: '舍身成仁', icon: '†', legendary: true },
            { id: 'true', title: '本相自在', icon: '◯', legendary: false },
            { id: 'god', title: '点化成仙', icon: '☀', legendary: false },
            { id: 'mortal', title: '尘世轮回', icon: '人', legendary: false },
            { id: 'fail_scholar', title: '功亏一篑', icon: '✗', legendary: false },
            { id: 'fail_kid', title: '原形毕露', icon: '✗', legendary: false },
            { id: 'farmer', title: '山野村夫', icon: '🌾', legendary: false },
            { id: 'star', title: '文曲星耀', icon: '⭐', legendary: false },
            { id: 'demon_king', title: '妖王之路', icon: '◆', legendary: false },
            { id: 'mad', title: '执念成魔', icon: '◇', legendary: false },
            { id: 'love', title: '红尘情缘', icon: '♡', legendary: false },
            { id: 'guardian', title: '守山之人', icon: '⛰', legendary: false },
            { id: 'lost', title: '雨夜迷途', icon: '?', legendary: false },
            { id: 'severed', title: '断缘而去', icon: '—', legendary: false },
            { id: 'dawn', title: '黎明归宿', icon: '☽', legendary: false },
            { id: 'sword_friend', title: '剑影知交', icon: '⚔', legendary: false },
            { id: 'sword_master', title: '剑道传承', icon: '剑', legendary: false },
            { id: 'green_memory', title: '前尘往事', icon: '记', legendary: false },
            { id: 'green_fate', title: '三世因缘', icon: '缘', legendary: false },
            { id: 'great_good', title: '大善若水', icon: '☯', legendary: false },
            { id: 'great_evil', title: '大恶如魔', icon: '💀', legendary: false },
            { id: 'balance_sage', title: '中庸之道', icon: '⚖', legendary: false },
            { id: 'ghost_friend', title: '鬼魂之交', icon: '👻', legendary: false },
            { id: 'star_seeker', title: '星辰指引', icon: '星', legendary: false },
            { id: 'hermit', title: '隐士之道', icon: '隐', legendary: false },
            { id: 'treasure', title: '寻宝猎人', icon: '宝', legendary: false },
            { id: 'dragon_friend', title: '蛟龙之友', icon: '龙', legendary: false },
            { id: 'spirit_guardian', title: '灵脉守护', icon: '脉', legendary: false },
            { id: 'forest_king', title: '森林之王', icon: '林', legendary: false },
            { id: 'underworld', title: '黄泉交易', icon: '泉', legendary: false },
            { id: 'immortal', title: '长生不老', icon: '寿', legendary: false },
            { id: 'forgotten_god', title: '遗忘之神', icon: '忘', legendary: false },
            { id: 'fake_god', title: '伪仙真相', icon: '假', legendary: false },
            { id: 'fake_enemy', title: '宿敌真相', icon: '敌', legendary: false },
            { id: 'dream_ending', title: '黄粱一梦', icon: '梦', legendary: false },
            { id: 'time_loop', title: '时光倒流', icon: '循环', legendary: false },
            { id: 'destiny_symphony', title: '命运交响', icon: '命', legendary: false },
            { id: 'fate_encounter', title: '因缘际会', icon: '会', legendary: false },
            { id: 'suspicious', title: '疑心失缘', icon: '疑', legendary: false },
        ];

        const STORAGE_KEY = 'huangdaxian_achievements';
        const ORDER_KEY = 'huangdaxian_achievement_order';

        let cachedAchievements = null;
        let cachedOrder = null;

        async function loadAchievements() {
            if (cachedAchievements) return cachedAchievements;
            const saved = await StorageBridge.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data && typeof data === 'object' && !Array.isArray(data)) {
                        cachedAchievements = data;
                        return data;
                    }
                } catch (e) {}
            }
            return {};
        }

        async function saveAchievements(achievements) {
            cachedAchievements = achievements;
            await StorageBridge.setItem(STORAGE_KEY, JSON.stringify(achievements));
        }

        async function loadOrder() {
            if (cachedOrder) return cachedOrder;
            const saved = await StorageBridge.getItem(ORDER_KEY);
            if (saved) {
                try {
                    const order = JSON.parse(saved);
                    if (Array.isArray(order)) {
                        cachedOrder = order;
                        return order;
                    }
                } catch (e) {}
            }
            return null;
        }

        async function saveOrder(orderArray) {
            cachedOrder = orderArray;
            await StorageBridge.setItem(ORDER_KEY, JSON.stringify(orderArray));
        }

        async function getSortedAchievements() {
            const achievements = await loadAchievements();
            let order = await loadOrder();
            const unlockedIds = Object.keys(achievements).filter(id => achievements[id] === true);

            if (!order) {
                order = unlockedIds.slice();
                await saveOrder(order);
            } else {
                const newlyUnlocked = unlockedIds.filter(id => order.indexOf(id) === -1);
                if (newlyUnlocked.length > 0) {
                    order = [...newlyUnlocked, ...order];
                    await saveOrder(order);
                }
                const stillValid = order.filter(id => unlockedIds.indexOf(id) >= 0);
                if (stillValid.length !== order.length) {
                    order = stillValid;
                    await saveOrder(order);
                }
            }

            const allUnlockedOrdered = [...new Set([...order.filter(id => unlockedIds.includes(id)), ...unlockedIds])];
            const unlockedAchievements = [];
            const lockedAchievements = [];

            achievementIcons.forEach(ach => {
                if (allUnlockedOrdered.includes(ach.id)) {
                    unlockedAchievements.push(ach);
                } else {
                    lockedAchievements.push(ach);
                }
            });

            unlockedAchievements.sort((a, b) => allUnlockedOrdered.indexOf(a.id) - allUnlockedOrdered.indexOf(b.id));

            return { unlockedAchievements, lockedAchievements };
        }

        async function exportAllData() {
            const achievements = await loadAchievements();
            const order = await loadOrder();
            const payload = {
                version: 2,
                exportTime: new Date().toISOString(),
                achievements: achievements,
                order: order || [],
                totalUnlocked: Object.keys(achievements).filter(k => achievements[k] === true).length
            };
            return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        }

        async function importAllData(inputStr) {
            let jsonStr;
            try {
                jsonStr = decodeURIComponent(escape(atob(inputStr)));
            } catch (e) {
                jsonStr = inputStr;
            }
            try {
                const payload = JSON.parse(jsonStr);
                if (!payload || !payload.achievements || typeof payload.achievements !== 'object') {
                    return { success: false, message: '数据格式无效' };
                }
                const currentAchievements = await loadAchievements();
                const merged = { ...currentAchievements };
                Object.keys(payload.achievements).forEach(id => {
                    if (payload.achievements[id] === true) merged[id] = true;
                });
                await saveAchievements(merged);
                if (Array.isArray(payload.order)) {
                    await saveOrder(payload.order.filter(id => merged[id] === true));
                }
                return { success: true, message: `导入成功！已合并 ${Object.keys(merged).filter(k => merged[k] === true).length} 个成就` };
            } catch (e) {
                return { success: false, message: 'JSON解析失败：' + e.message };
            }
        }

        let toastTimer = null;
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = message;
            toast.className = 'toast ' + (isError ? 'error' : '');
            void toast.offsetWidth;
            toast.classList.add('show');
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
                toastTimer = null;
            }, 2500);
        }

        function copyToClipboard(text) {
            return new Promise((resolve, reject) => {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(resolve).catch(reject);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        resolve();
                    } catch (e) { reject(e); }
                    document.body.removeChild(textarea);
                }
            });
        }

        function createAchievementRow(ach, isUnlocked) {
            const row = document.createElement('div');
            row.className = 'achievement-row';
            if (isUnlocked) {
                row.classList.add('unlocked');
                if (ach.legendary) row.classList.add('legendary');
            } else {
                row.classList.add('locked');
            }
            const iconCell = document.createElement('div');
            iconCell.className = 'achievement-icon-cell';
            iconCell.textContent = isUnlocked ? ach.icon : '?';
            const infoDiv = document.createElement('div');
            infoDiv.className = 'achievement-info';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'achievement-name';
            nameSpan.textContent = ach.title;
            infoDiv.appendChild(nameSpan);
            const badge = document.createElement('span');
            badge.className = 'achievement-badge';
            if (isUnlocked && ach.legendary) badge.textContent = '传说';
            else if (isUnlocked) badge.textContent = '已解锁';
            else badge.textContent = '未解锁';
            row.appendChild(iconCell);
            row.appendChild(infoDiv);
            row.appendChild(badge);
            return row;
        }

        async function renderAll() {
            const { unlockedAchievements, lockedAchievements } = await getSortedAchievements();
            const unlockedList = document.getElementById('unlockedList');
            const lockedList = document.getElementById('lockedList');
            const unlockedTitle = document.getElementById('unlockedTitle');
            const unlockedEmpty = document.getElementById('unlockedEmpty');
            const lockedTitle = document.getElementById('lockedTitle');
            const unlockedCountEl = document.getElementById('unlockedCount');
            const totalCountEl = document.getElementById('totalCount');
            const legendaryStat = document.getElementById('legendaryStat');
            const legendaryCountEl = document.getElementById('legendaryCount');
            const refreshNote = document.getElementById('refreshNote');

            unlockedList.innerHTML = '';
            lockedList.innerHTML = '';

            const legendaryUnlocked = unlockedAchievements.filter(a => a.legendary);
            const totalLegendary = achievementIcons.filter(a => a.legendary).length;

            if (unlockedAchievements.length > 0) {
                unlockedTitle.style.display = 'block';
                unlockedEmpty.style.display = 'none';
                unlockedAchievements.forEach(ach => unlockedList.appendChild(createAchievementRow(ach, true)));
            } else {
                unlockedTitle.style.display = 'none';
                unlockedEmpty.style.display = 'block';
            }

            if (lockedAchievements.length > 0) {
                lockedTitle.style.display = 'block';
                lockedTitle.textContent = '尚未解锁';
                lockedTitle.classList.remove('legendary-title');
                lockedAchievements.forEach(ach => lockedList.appendChild(createAchievementRow(ach, false)));
            } else if (unlockedAchievements.length > 0) {
                lockedTitle.style.display = 'block';
                lockedTitle.textContent = '全成就达成';
                lockedTitle.classList.add('legendary-title');
                const allDone = document.createElement('div');
                allDone.className = 'empty-state';
                allDone.textContent = '🎉 全部成就已解锁！功德圆满！';
                allDone.style.color = '#8cb4d8';
                allDone.style.padding = '30px 20px';
                lockedList.appendChild(allDone);
            } else {
                lockedTitle.style.display = 'none';
            }

            unlockedCountEl.textContent = unlockedAchievements.length;
            totalCountEl.textContent = achievementIcons.length;

            if (legendaryUnlocked.length > 0) {
                legendaryStat.style.display = 'inline-flex';
                legendaryCountEl.textContent = legendaryUnlocked.length + '/' + totalLegendary;
            } else {
                legendaryStat.style.display = 'none';
            }

            const now = new Date();
            refreshNote.textContent = '数据更新于 ' + now.toLocaleString('zh-CN', {
                month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'
            }) + ' · 存储方式：原生存储';

            document.getElementById('storageStatus').textContent = '存储状态正常 · 使用父页面原生存储';
        }

        async function init() {
            await renderAll();

            // 监听来自游戏页的更新通知
            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'achievements-updated') {
                    cachedAchievements = null;
                    cachedOrder = null;
                    renderAll();
                }
            });

            document.getElementById('btnExportTop').addEventListener('click', async () => {
                const encrypted = await exportAllData();
                try {
                    await copyToClipboard(encrypted);
                    showToast('✅ 备份数据已复制到剪贴板');
                } catch (e) {
                    showToast('复制失败，请手动复制', true);
                    prompt('请手动复制：', encrypted);
                }
            });

            document.getElementById('btnImportTop').addEventListener('click', async () => {
                const input = prompt('请粘贴之前导出的备份数据：');
                if (!input) return;
                const result = await importAllData(input.trim());
                if (result.success) {
                    showToast(result.message);
                    cachedAchievements = null;
                    cachedOrder = null;
                    await renderAll();
                } else {
                    showToast('导入失败：' + result.message, true);
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
