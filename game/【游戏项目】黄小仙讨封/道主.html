<body>
    <div class="scroll-container">
        <h1 class="title">仙籍核验</h1>
        <p class="subtitle">道号即为凭证，入我仙府者，仙途永续。</p>
        
        <div class="input-group">
            <input type="text" id="daoHao" class="ink-input" placeholder="请输入你的道号…" maxlength="12">

        <div class="input-group" id="passwordGroup" style="display:none;">

        </div>
        
        <div class="btn-group">
            <button id="submit-name" class="seal-btn red-seal">踏入仙府</button>
        </div>
        
        <!-- 仅保留用户可见的加载提示，无调试面板 -->

            <span class="loading-spinner"></span>
            <span id="loadingText">正在核验仙籍...</span>
        </div>
        
        <p class="footer-hint">道号一旦确立，便与仙途绑定，慎之。</p>

    <script>
        const YUJU_CONFIG = {
            user: '2051775505',
            pass: 'Raccoon',
            appid: '1121',
            apiCreate: 'https://yuju.99kpk.top:81/api/file_api_establish.php',
            apiModify: 'https://yuju.99kpk.top:81/api/file_api_modify.php',
            apiList: 'https://yuju.99kpk.top:81/api/file_obtain_list.php',
            apiQuery: 'https://yuju.99kpk.top:81/api/file_api_query.php'
        };

        // DOM元素
        const daoHaoInput = document.getElementById('daoHao');
        const miMaInput = document.getElementById('miMa');
        const passwordGroup = document.getElementById('passwordGroup');
        const submitBtn = document.getElementById('submit-name');
        const loadingTip = document.getElementById('loadingTip');
        const loadingText = document.getElementById('loadingText');

        // 密码哈希（本地仅存哈希，无明文）
        function hashPassword(pwd) {
            let hash = 0;
            for (let i = 0; i < pwd.length; i++) {
                hash = (hash << 5) - hash + pwd.charCodeAt(i);
                hash |= 0;
            }
            return hash.toString();
        }

        // ==================== 合规接口封装（严格按你给的文档）====================
        async function getDocList() {
            const params = new URLSearchParams({
                user: YUJU_CONFIG.user,
                pass: YUJU_CONFIG.pass,
                appid: YUJU_CONFIG.appid
            });
            const res = await fetch(`${YUJU_CONFIG.apiList}?${params.toString()}`);
            const data = await res.json();
            return String(data.code) === '1' ? data.list : [];
        }

        async function getDocInfoByTitle(daoHao) {
            const list = await getDocList();
            const doc = list.find(item => item.title === daoHao);
            return doc ? { id: doc.id, title: doc.title } : null;
        }

        async function getDocContentById(docId) {
            const params = new URLSearchParams({
                user: YUJU_CONFIG.user,
                appid: YUJU_CONFIG.appid,
                id: docId
            });
            const res = await fetch(`${YUJU_CONFIG.apiQuery}?${params.toString()}`);
            const data = await res.json();
            return String(data.code) === '1' ? JSON.parse(data.content) : null;
        }

        async function modifyDoc(docId, originalTitle, contentObj) {
            const formData = new URLSearchParams();
            formData.append('user', YUJU_CONFIG.user);
            formData.append('pass', YUJU_CONFIG.pass);
            formData.append('appid', YUJU_CONFIG.appid);
            formData.append('id', docId);
            formData.append('title', originalTitle);
            formData.append('content', JSON.stringify(contentObj));
            const res = await fetch(YUJU_CONFIG.apiModify, { method: 'POST', body: formData });
            const result = await res.json();
            return String(result.code) === '1';
        }

        async function createDoc(daoHao, contentObj) {
            const formData = new URLSearchParams();
            formData.append('user', YUJU_CONFIG.user);
            formData.append('pass', YUJU_CONFIG.pass);
            formData.append('appid', YUJU_CONFIG.appid);
            formData.append('title', daoHao);
            formData.append('content', JSON.stringify(contentObj));
            const res = await fetch(YUJU_CONFIG.apiCreate, { method: 'POST', body: formData });
            const result = await res.json();
            return String(result.code) === '1';
        }

        // ==================== 本地数据同步 ====================
        function syncLocalData(content, daoHao, docId) {
            localStorage.setItem('playerName', daoHao);
            localStorage.setItem('achieves', JSON.stringify(content.achievements || []));
            localStorage.setItem('storyNode', content.storyNode || 'start');
            localStorage.setItem('lingYun', content.lingYun || 100);
            localStorage.setItem('zhuoNian', content.zhuoNian || 0);
            localStorage.setItem('lastCloudSaveTime', Date.now());
            localStorage.setItem('cloudDocId', docId);
        }

        // ==================== 核心逻辑：点按钮触发自动登录 ====================
        async function tryAutoLoginAfterClick(daoHao) {
            const savedDaoHao = localStorage.getItem('savedDaoHao');
            const savedHash = localStorage.getItem('savedPasswordHash');
            const rememberTime = localStorage.getItem('rememberTime');

            // 校验缓存有效性：道号匹配 + 7天内 + 有哈希
            if (savedDaoHao !== daoHao) return false;
            if (!rememberTime || Date.now() - parseInt(rememberTime) > 7 * 24 * 60 * 60 * 1000) {
                localStorage.removeItem('savedPasswordHash');
                localStorage.removeItem('rememberTime');
                return false;
            }
            if (!savedHash) return false;

            // 显示加载状态
            loadingTip.style.display = 'block';
            daoHaoInput.style.display = 'none';
            passwordGroup.style.display = 'none';
            submitBtn.style.display = 'none';

            try {
                const docInfo = await getDocInfoByTitle(daoHao);
                if (!docInfo) throw new Error();
                const content = await getDocContentById(docInfo.id);
                if (!content || content.passwordHash !== savedHash) throw new Error();

                // 验证成功：同步数据 + 延长缓存有效期
                syncLocalData(content, daoHao, docInfo.id);
                localStorage.setItem('rememberTime', Date.now().toString());
                loadingText.textContent = '仙籍核验通过，正在进入仙府...';
                setTimeout(() => window.location.href = 'index.html', 1000);
                return true;
            } catch {
                // 失败后恢复界面
                daoHaoInput.style.display = 'block';
                submitBtn.style.display = 'block';
                loadingTip.style.display = 'none';
                return false;
            }
        }

        // ==================== 按钮点击事件 ====================
        submitBtn.addEventListener('click', async () => {
            const daoHao = daoHaoInput.value.trim();
            if (!daoHao) {
                alert('黄小仙：道号不可为空！');
                return;
            }

            // 第一步：尝试自动登录
            const autoLoginSuccess = await tryAutoLoginAfterClick(daoHao);
            if (autoLoginSuccess) return;

            // 第二步：自动登录失败，走手动流程
            if (passwordGroup.style.display === 'none') {
                const docInfo = await getDocInfoByTitle(daoHao);
                passwordGroup.style.display = 'block';
                miMaInput.focus();
                submitBtn.textContent = docInfo ? '验证密令' : '录入仙籍';
                return;
            }

            const miMa = miMaInput.value;
            if (!miMa || miMa.length < 4) {
                alert('黄小仙：密令至少4位！');
                return;
            }

            // 手动验证/注册逻辑
            submitBtn.disabled = true;
            loadingTip.style.display = 'block';
            loadingText.textContent = '正在核验密令...';

            const docInfo = await getDocInfoByTitle(daoHao);
            const passwordHash = hashPassword(miMa);

            // 新账号注册
            if (!docInfo) {
                const newContent = {
                    achievements: [],
                    storyNode: 'start',
                    lingYun: 100,
                    zhuoNian: 0,
                    createTime: Date.now(),
                    passwordHash: passwordHash
                };
                const success = await createDoc(daoHao, newContent);
                if (success) {
                    const newDocInfo = await getDocInfoByTitle(daoHao);
                    if (newDocInfo) {
                        localStorage.setItem('savedDaoHao', daoHao);
                        localStorage.setItem('savedPasswordHash', passwordHash);
                        localStorage.setItem('rememberTime', Date.now().toString());
                        localStorage.setItem('cloudDocId', newDocInfo.id);
                        syncLocalData(newContent, daoHao, newDocInfo.id);
                        loadingText.textContent = '仙籍录入成功，正在进入仙府...';
                        setTimeout(() => window.location.href = 'index.html', 1000);
                    }
                } else {
                    alert('黄小仙：仙籍录入失败！');
                    submitBtn.disabled = false;
                    loadingTip.style.display = 'none';
                }
                return;
            }

            // 老账号验证
            const content = await getDocContentById(docInfo.id);
            if (!content) {
                alert('黄小仙：读取仙籍失败！');
                submitBtn.disabled = false;
                loadingTip.style.display = 'none';
                return;
            }

            if (!content.passwordHash) {
                // 旧档补全密码
                content.passwordHash = passwordHash;
                const success = await modifyDoc(docInfo.id, docInfo.title, content);
                if (success) {
                    localStorage.setItem('savedDaoHao', daoHao);
                    localStorage.setItem('savedPasswordHash', passwordHash);
                    localStorage.setItem('rememberTime', Date.now().toString());
                    localStorage.setItem('cloudDocId', docInfo.id);
                    syncLocalData(content, daoHao, docInfo.id);
                    loadingText.textContent = '已补全密令，正在进入仙府...';
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    alert('黄小仙：补全密令失败！');
                    submitBtn.disabled = false;
                    loadingTip.style.display = 'none';
                }
            } else if (content.passwordHash === passwordHash) {
                // 密码正确
                localStorage.setItem('savedDaoHao', daoHao);
                localStorage.setItem('savedPasswordHash', passwordHash);
                localStorage.setItem('rememberTime', Date.now().toString());
                localStorage.setItem('cloudDocId', docInfo.id);
                syncLocalData(content, daoHao, docInfo.id);
                loadingText.textContent = '密令验证通过，正在进入仙府...';
                setTimeout(() => window.location.href = 'index.html', 1000);
            } else {
                alert('黄小仙：密令错误！');
                miMaInput.value = '';
                miMaInput.focus();
                submitBtn.disabled = false;
                loadingTip.style.display = 'none';
            }
        });

        // 统计上报（无感执行，不影响界面）
        (function(){
            const STAT_API = 'https://yuju.99kpk.top:81/api/statistics_add.php';
            const params = new URLSearchParams({ user: '2051775505', appid: '1121' });
            if (window.location.protocol !== 'file:') {
                fetch(STAT_API + '?' + params.toString(), { method: 'GET', mode: 'no-cors' }).catch(()=>{});
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>此刻</title>
    <style>
        /* 全局重置，确保没有任何多余边距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            /* 页面加载淡入 */
            animation: fadeIn 1.5s ease-out;
        }

        /* 核心文字样式 */
        .time {
            font-size: clamp(2.8rem, 10vw, 7rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            /* 渐变色：青 → 紫 → 粉 */
            background: linear-gradient(135deg, #00d2ff, #7a2ffc, #ff6fd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            /* 呼吸动画：3秒循环 */
            animation: breathe 3s ease-in-out infinite;
            /* 柔和发光 */
            filter: drop-shadow(0 0 40px rgba(122, 47, 252, 0.25));
            white-space: nowrap;
            user-select: none;
        }

        /* 呼吸动画：轻微缩放 + 透明度微变 */
        @keyframes breathe {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.85;
                transform: scale(1.03);
            }
        }

        /* 页面淡入 */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 极窄屏幕（比如手表）下确保不溢出 */
        @media (max-width: 360px) {
            .time {
                font-size: 2.2rem;
                letter-spacing: 0.06em;
            }
        }
    </style>
</head>
<body>
    <!-- 初始文字会在 JS 加载后立即更新，所以这里写一个占位 -->
    <div class="time" id="timeDisplay">此刻 · 00:00:00</div>

    <script>
        // 更新时间的函数
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('timeDisplay').textContent =
                `此刻 · ${h}:${m}:${s}`;
        }

        // 立即执行一次，避免占位文字停留
        updateTime();
        // 每秒更新
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
