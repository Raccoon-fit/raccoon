<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦟 打蚊子大作战</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Noto Sans SC', 'ZCOOL KuaiLe', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.5); }
        }

        /* 游戏画布 */
        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="%238B4513" stroke-width="3"/><line x1="5" y1="5" x2="35" y2="35" stroke="%238B4513" stroke-width="3"/><line x1="35" y1="5" x2="5" y2="35" stroke="%238B4513" stroke-width="3"/></svg>') 20 20, crosshair;
        }

        /* UI 层 */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* 顶部信息栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
        }

        .score-display, .target-display {
            font-size: clamp(18px, 4vw, 28px);
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .score-value {
            color: #FF6B35;
            font-size: 1.2em;
        }

        .target-value {
            color: #4ECDC4;
        }

        .timer-display {
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .timer-warning {
            animation: timerPulse 0.5s infinite;
            color: #FF4757 !important;
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* 开始/结束界面 */
        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 30, 0.95);
            z-index: 100;
            pointer-events: auto;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .game-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: clamp(36px, 10vw, 72px);
            font-weight: 900;
            color: #FF6B35;
            text-shadow:
                3px 3px 0 #8B4513,
                6px 6px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            animation: titleBounce 2s ease-in-out infinite;
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .mosquito-icon {
            font-size: clamp(60px, 15vw, 120px);
            margin-bottom: 30px;
            animation: mosquitoFloat 1.5s ease-in-out infinite;
        }

        @keyframes mosquitoFloat {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .game-subtitle {
            font-size: clamp(16px, 4vw, 24px);
            color: #aaa;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }

        .target-info {
            font-size: clamp(18px, 4vw, 28px);
            color: #4ECDC4;
            margin-bottom: 40px;
        }

        .game-btn {
            padding: 15px 50px;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 700;
            font-family: inherit;
            color: white;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow:
                0 6px 20px rgba(255, 107, 53, 0.4),
                inset 0 -3px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 10px 30px rgba(255, 107, 53, 0.5),
                inset 0 -3px 10px rgba(0,0,0,0.2);
        }

        .game-btn:active {
            transform: translateY(0);
        }

        /* 结果界面 */
        .result-display {
            font-size: clamp(48px, 12vw, 96px);
            font-weight: 900;
            margin-bottom: 20px;
        }

        .result-win {
            color: #4ECDC4;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.5);
        }

        .result-lose {
            color: #FF4757;
            text-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
        }

        .final-score {
            font-size: clamp(20px, 5vw, 32px);
            color: white;
            margin-bottom: 40px;
        }

        /* 粒子效果容器 */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .hit-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #FF4757;
            border-radius: 50%;
            pointer-events: none;
            animation: particleExplode 0.6s ease-out forwards;
        }

        @keyframes particleExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .hit-text {
            position: absolute;
            font-size: 24px;
            font-weight: 900;
            color: #FF6B35;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: hitTextFloat 0.8s ease-out forwards;
        }

        @keyframes hitTextFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.5);
            }
        }

        /* 飞蝇拍动画 */
        .swatter {
            position: fixed;
            width: 80px;
            height: 120px;
            pointer-events: none;
            z-index: 60;
            transform: translate(-50%, -50%);
            display: none;
        }

        .swatter.active {
            display: block;
        }

        .swatter svg {
            width: 100%;
            height: 100%;
        }

        /* 说明提示 */
        .tips {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(12px, 3vw, 16px);
            color: #666;
            text-align: center;
        }

        @media (max-width: 768px) {
            .top-bar {
                padding: 10px 15px;
            }

            .game-btn {
                padding: 12px 40px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration" id="bgDecoration"></div>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 粒子效果 -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- UI 层 -->
    <div class="ui-layer" id="uiLayer">
        <div class="top-bar" id="topBar" style="display: none;">
            <div class="score-display">
                得分: <span class="score-value" id="scoreValue">0</span>
            </div>
            <div class="timer-display" id="timerDisplay">60</div>
            <div class="target-display">
                目标: <span class="target-value" id="targetValue">20</span>
            </div>
        </div>
    </div>

    <!-- 开始界面 -->
    <div class="game-overlay" id="startOverlay">
        <div class="game-title">🦟 打蚊子大作战</div>
        <div class="mosquito-icon">🦟</div>
        <div class="game-subtitle">用你的鼠标或手指<br>拍打可恶的蚊子！</div>
        <div class="target-info">目标: 在 60 秒内得到 <span id="startTarget">20</span> 分</div>
        <button class="game-btn" id="startBtn">开始游戏</button>
        <div class="tips">电脑用户：鼠标点击 | 手机用户：触摸点击</div>
    </div>

    <!-- 结果界面 -->
    <div class="game-overlay hidden" id="resultOverlay">
        <div class="result-display" id="resultDisplay">胜利!</div>
        <div class="final-score" id="finalScore">你的得分: 20</div>
        <button class="game-btn" id="restartBtn">再来一局</button>
    </div>

    <script>
        // ========== 游戏配置 ==========
        const CONFIG = {
            GAME_DURATION: 60,          // 游戏时长（秒）
            TARGET_SCORE: 20,           // 目标分数
            MOSQUITO_BASE_SPEED: 2,     // 基础速度
            MOSQUITO_MAX_SPEED: 10,     // 最大速度
            HIT_RADIUS_BONUS: 15,       // 点击容错半径
            PARTICLE_COUNT: 12,        // 粒子数量
        };

        // ========== 游戏状态 ==========
        const GameState = {
            START: 'START',
            PLAYING: 'PLAYING',
            WIN: 'WIN',
            LOSE: 'LOSE'
        };

        // ========== 蚊子类 ==========
        class Mosquito {
            constructor(canvas) {
                this.canvas = canvas;
                this.reset();
            }

            reset() {
                const padding = 100;
                this.x = padding + Math.random() * (this.canvas.width - padding * 2);
                this.y = padding + Math.random() * (this.canvas.height - padding * 2);

                // 随机移动方向
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle);
                this.vy = Math.sin(angle);

                // 根据分数调整速度和大小
                this.updateDifficulty(game.score);

                // 翅膀动画
                this.wingPhase = Math.random() * Math.PI * 2;
                this.wingSpeed = 0.3 + Math.random() * 0.2;
            }

            updateDifficulty(score) {
                if (score < 10) {
                    this.speed = 2 + Math.random() * 1;
                    this.size = 50;
                } else if (score < 20) {
                    this.speed = 4 + Math.random() * 1;
                    this.size = 40;
                } else if (score < 30) {
                    this.speed = 6 + Math.random() * 1;
                    this.size = 30;
                } else {
                    this.speed = 8 + Math.random() * 2;
                    this.size = 25;
                }
            }

            update() {
                // 移动蚊子
                this.x += this.vx * this.speed;
                this.y += this.vy * this.speed;

                // 边界反弹（带随机性）
                const margin = 50;
                if (this.x < margin || this.x > this.canvas.width - margin) {
                    this.vx *= -1;
                    this.vy += (Math.random() - 0.5) * 0.5;
                }
                if (this.y < margin || this.y > this.canvas.height - margin) {
                    this.vy *= -1;
                    this.vx += (Math.random() - 0.5) * 0.5;
                }

                // 随机改变方向（增加随机性）
                if (Math.random() < 0.02) {
                    const angle = Math.random() * Math.PI * 2;
                    this.vx = Math.cos(angle);
                    this.vy = Math.sin(angle);
                }

                // 规范化速度向量
                const mag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                this.vx /= mag;
                this.vy /= mag;

                // 更新翅膀动画
                this.wingPhase += this.wingSpeed;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // 计算朝向角度
                const angle = Math.atan2(this.vy, this.vx);
                ctx.rotate(angle);

                const s = this.size;

                // 绘制翅膀（带振动动画）
                const wingOffset = Math.sin(this.wingPhase) * 8;

                // 左翅膀
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.beginPath();
                ctx.ellipse(-s * 0.1, -s * 0.35 + wingOffset, s * 0.4, s * 0.15, -0.3, 0, Math.PI * 2);
                ctx.fill();

                // 右翅膀
                ctx.beginPath();
                ctx.ellipse(-s * 0.1, s * 0.35 - wingOffset, s * 0.4, s * 0.15, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // 翅膀纹理
                ctx.strokeStyle = 'rgba(200, 200, 200, 0.3)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(-s * 0.3, -s * 0.35);
                ctx.lineTo(-s * 0.3, s * 0.35);
                ctx.stroke();

                // 绘制身体
                ctx.fillStyle = '#2d2d2d';
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.4, s * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();

                // 身体条纹
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.2 + i * s * 0.12, -s * 0.12);
                    ctx.lineTo(-s * 0.2 + i * s * 0.12, s * 0.12);
                    ctx.stroke();
                }

                // 头部
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(s * 0.35, 0, s * 0.12, 0, Math.PI * 2);
                ctx.fill();

                // 眼睛
                ctx.fillStyle = '#8B0000';
                ctx.beginPath();
                ctx.arc(s * 0.38, -s * 0.05, s * 0.04, 0, Math.PI * 2);
                ctx.arc(s * 0.38, s * 0.05, s * 0.04, 0, Math.PI * 2);
                ctx.fill();

                // 腿（6条腿）
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1.5;
                const legPositions = [-s * 0.15, 0, s * 0.1];
                legPositions.forEach((lx, i) => {
                    // 上腿
                    ctx.beginPath();
                    ctx.moveTo(lx, -s * 0.1);
                    ctx.quadraticCurveTo(lx - 5, -s * 0.25, lx - 8, -s * 0.35 - (i % 2) * 5);
                    ctx.stroke();
                    // 下腿
                    ctx.beginPath();
                    ctx.moveTo(lx, s * 0.1);
                    ctx.quadraticCurveTo(lx - 5, s * 0.25, lx - 8, s * 0.35 + (i % 2) * 5);
                    ctx.stroke();
                });

                // 嘴巴（吸管）
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(s * 0.45, 0);
                ctx.lineTo(s * 0.65, 0);
                ctx.stroke();

                ctx.restore();
            }

            isHit(clickX, clickY) {
                const dx = clickX - this.x;
                const dy = clickY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance <= (this.size / 2 + CONFIG.HIT_RADIUS_BONUS);
            }
        }

        // ========== 主游戏类 ==========
        class MosquitoGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                // DOM 元素
                this.startOverlay = document.getElementById('startOverlay');
                this.resultOverlay = document.getElementById('resultOverlay');
                this.topBar = document.getElementById('topBar');
                this.scoreValue = document.getElementById('scoreValue');
                this.timerDisplay = document.getElementById('timerDisplay');
                this.targetValue = document.getElementById('targetValue');
                this.resultDisplay = document.getElementById('resultDisplay');
                this.finalScore = document.getElementById('finalScore');
                this.particlesContainer = document.getElementById('particlesContainer');

                // 游戏状态
                this.state = GameState.START;
                this.score = 0;
                this.timeLeft = CONFIG.GAME_DURATION;
                this.mosquito = null;

                // 初始化
                this.resize();
                this.createStars();
                this.bindEvents();
                this.gameLoop();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            createStars() {
                const container = document.getElementById('bgDecoration');
                container.innerHTML = '';
                const starCount = Math.floor((this.canvas.width * this.canvas.height) / 8000);

                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 2 + 's';
                    container.appendChild(star);
                }
            }

            bindEvents() {
                // 窗口大小改变
                window.addEventListener('resize', () => {
                    this.resize();
                    this.createStars();
                });

                // 开始按钮
                document.getElementById('startBtn').addEventListener('click', () => this.startGame());
                document.getElementById('restartBtn').addEventListener('click', () => this.startGame());

                // 点击/触摸事件
                const handleInteraction = (e) => {
                    if (this.state !== GameState.PLAYING) return;

                    e.preventDefault();

                    let x, y;
                    if (e.type === 'touchstart') {
                        x = e.touches[0].clientX;
                        y = e.touches[0].clientY;
                    } else {
                        x = e.clientX;
                        y = e.clientY;
                    }

                    this.handleClick(x, y);
                };

                this.canvas.addEventListener('click', handleInteraction);
                this.canvas.addEventListener('touchstart', handleInteraction, { passive: false });

                // 防止默认触摸行为
                document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
            }

            startGame() {
                this.state = GameState.PLAYING;
                this.score = 0;
                this.timeLeft = CONFIG.GAME_DURATION;

                // 创建蚊子
                this.mosquito = new Mosquito(this.canvas);

                // 更新UI
                this.updateUI();

                // 隐藏/显示界面
                this.startOverlay.classList.add('hidden');
                this.resultOverlay.classList.add('hidden');
                this.topBar.style.display = 'flex';

                // 启动计时器
                this.startTimer();

                // 更新目标显示
                document.getElementById('startTarget').textContent = CONFIG.TARGET_SCORE;
            }

            startTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);

                this.timerInterval = setInterval(() => {
                    if (this.state !== GameState.PLAYING) {
                        clearInterval(this.timerInterval);
                        return;
                    }

                    this.timeLeft--;
                    this.updateUI();

                    if (this.timeLeft <= 0) {
                        this.endGame(false);
                    }
                }, 1000);
            }

            handleClick(x, y) {
                if (!this.mosquito) return;

                if (this.mosquito.isHit(x, y)) {
                    // 命中！
                    this.score++;
                    this.updateUI();

                    // 创建粒子效果
                    this.createHitEffect(x, y);

                    // 重置蚊子（带新参数）
                    this.mosquito.updateDifficulty(this.score);
                    this.mosquito.reset();

                    // 检查胜利条件
                    if (this.score >= CONFIG.TARGET_SCORE) {
                        this.endGame(true);
                    }
                }
            }

            createHitEffect(x, y) {
                // 创建粒子
                for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'hit-particle';

                    const angle = (Math.PI * 2 / CONFIG.PARTICLE_COUNT) * i;
                    const distance = 30 + Math.random() * 40;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;

                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.setProperty('--tx', tx + 'px');
                    particle.style.setProperty('--ty', ty + 'px');
                    particle.style.background = Math.random() > 0.5 ? '#FF4757' : '#8B0000';

                    this.particlesContainer.appendChild(particle);

                    setTimeout(() => particle.remove(), 600);
                }

                // 创建+1文字
                const text = document.createElement('div');
                text.className = 'hit-text';
                text.textContent = '+1';
                text.style.left = x + 'px';
                text.style.top = (y - 20) + 'px';
                this.particlesContainer.appendChild(text);

                setTimeout(() => text.remove(), 800);
            }

            updateUI() {
                this.scoreValue.textContent = this.score;
                this.timerDisplay.textContent = this.timeLeft;
                this.targetValue.textContent = CONFIG.TARGET_SCORE;

                // 计时器警告
                if (this.timeLeft <= 10) {
                    this.timerDisplay.classList.add('timer-warning');
                } else {
                    this.timerDisplay.classList.remove('timer-warning');
                }
            }

            endGame(isWin) {
                this.state = isWin ? GameState.WIN : GameState.LOSE;
                clearInterval(this.timerInterval);

                // 更新结果界面
                if (isWin) {
                    this.resultDisplay.textContent = '🎉 胜利! 🎉';
                    this.resultDisplay.className = 'result-display result-win';
                } else {
                    this.resultDisplay.textContent = '😅 时间到! 😅';
                    this.resultDisplay.className = 'result-display result-lose';
                }

                this.finalScore.textContent = `你的得分: ${this.score} / ${CONFIG.TARGET_SCORE}`;

                // 显示结果界面
                setTimeout(() => {
                    this.resultOverlay.classList.remove('hidden');
                }, 500);
            }

            gameLoop() {
                // 清空画布
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 更新和绘制蚊子
                if (this.state === GameState.PLAYING && this.mosquito) {
                    this.mosquito.update();
                    this.mosquito.draw(this.ctx);
                }

                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // ========== 启动游戏 ==========
        let game;
        window.addEventListener('DOMContentLoaded', () => {
            game = new MosquitoGame();
        });
    </script>
</body>
</html>
