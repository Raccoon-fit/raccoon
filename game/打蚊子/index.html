<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦟 打蚊子大作战</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Noto Sans SC', 'ZCOOL KuaiLe', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.5); }
        }

        /* 游戏画布 */
        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="%23FF6B35" stroke-width="3" stroke-dasharray="5,3"/><line x1="10" y1="10" x2="40" y2="40" stroke="%23FF6B35" stroke-width="4" stroke-linecap="round"/><line x1="40" y1="10" x2="10" y2="40" stroke="%23FF6B35" stroke-width="4" stroke-linecap="round"/></svg>') 25 25, crosshair;
        }

        /* UI 层 */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* 顶部信息栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
        }

        .score-display, .target-display {
            font-size: clamp(18px, 4vw, 28px);
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .score-value {
            color: #FFD700;
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .target-value {
            color: #4ECDC4;
        }

        .timer-display {
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .timer-warning {
            animation: timerPulse 0.5s infinite;
            color: #FF4757 !important;
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* 开始/结束界面 */
        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 30, 0.95);
            z-index: 100;
            pointer-events: auto;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .game-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: clamp(36px, 10vw, 72px);
            font-weight: 900;
            color: #FF6B35;
            text-shadow:
                3px 3px 0 #8B4513,
                6px 6px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            animation: titleBounce 2s ease-in-out infinite;
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .mosquito-icon {
            font-size: clamp(60px, 15vw, 120px);
            margin-bottom: 30px;
            animation: mosquitoFloat 1.5s ease-in-out infinite;
        }

        @keyframes mosquitoFloat {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .game-subtitle {
            font-size: clamp(16px, 4vw, 24px);
            color: #aaa;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }

        .target-info {
            font-size: clamp(18px, 4vw, 28px);
            color: #4ECDC4;
            margin-bottom: 40px;
        }

        .game-btn {
            padding: 15px 50px;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 700;
            font-family: inherit;
            color: white;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow:
                0 6px 20px rgba(255, 107, 53, 0.4),
                inset 0 -3px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 10px 30px rgba(255, 107, 53, 0.5),
                inset 0 -3px 10px rgba(0,0,0,0.2);
        }

        .game-btn:active {
            transform: translateY(0);
        }

        /* 模式按钮组 */
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .mode-btn {
            min-width: 220px;
        }

        .free-btn {
            background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%) !important;
            box-shadow:
                0 6px 20px rgba(78, 205, 196, 0.4),
                inset 0 -3px 10px rgba(0,0,0,0.2) !important;
        }

        .free-btn:hover {
            box-shadow:
                0 10px 30px rgba(78, 205, 196, 0.5),
                inset 0 -3px 10px rgba(0,0,0,0.2) !important;
        }

        /* 模式信息 */
        .mode-info {
            font-size: clamp(18px, 4vw, 28px);
            color: #4ECDC4;
            margin-bottom: 30px;
            text-align: center;
        }

        .mode-info.target-mode {
            color: #4ECDC4;
        }

        .mode-info.free-mode {
            color: #FFD700;
        }

        /* 结果界面 */
        .result-display {
            font-size: clamp(48px, 12vw, 96px);
            font-weight: 900;
            margin-bottom: 20px;
        }

        .result-win {
            color: #4ECDC4;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.5);
        }

        .result-lose {
            color: #FF4757;
            text-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
        }

        .final-score {
            font-size: clamp(20px, 5vw, 32px);
            color: white;
            margin-bottom: 40px;
        }

        /* 粒子效果容器 */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* 击杀特效样式 */
        .hit-effect {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .hit-circle {
            width: 60px;
            height: 60px;
            border: 4px solid #FFD700;
            border-radius: 50%;
            animation: circleExpand 0.5s ease-out forwards;
        }

        @keyframes circleExpand {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        .hit-star {
            position: absolute;
            font-size: 24px;
            animation: starExplode 0.6s ease-out forwards;
        }

        @keyframes starExplode {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            50% { transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: translate(var(--tx2), var(--ty2)) scale(0) rotate(360deg); opacity: 0; }
        }

        .hit-sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #FFD700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkleFloat 0.8s ease-out forwards;
        }

        @keyframes sparkleFloat {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            30% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 1; }
            100% { transform: translate(var(--tx2), var(--ty2)) scale(0); opacity: 0; }
        }

        .hit-text {
            position: absolute;
            font-size: 32px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 2px 2px 4px rgba(0,0,0,0.5);
            animation: textBounce 0.8s ease-out forwards;
            white-space: nowrap;
        }

        @keyframes textBounce {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            20% { transform: translate(-50%, -60%) scale(1.3); opacity: 1; }
            40% { transform: translate(-50%, -70%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -120%) scale(0.8); opacity: 0; }
        }

        /* 蚊子样式 */
        .mosquito {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: none;
        }

        .mosquito-body {
            font-size: 40px;
            animation: mosquitoWiggle 0.2s ease-in-out infinite;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        @keyframes mosquitoWiggle {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
        }

        .mosquito-shadow {
            position: absolute;
            width: 30px;
            height: 10px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.3) 0%, transparent 70%);
            border-radius: 50%;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            animation: shadowPulse 0.3s ease-in-out infinite;
        }

        @keyframes shadowPulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
            50% { transform: translateX(-50%) scale(1.1); opacity: 0.3; }
        }

        /* 说明提示 */
        .tips {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(12px, 3vw, 16px);
            color: #666;
            text-align: center;
        }

        @media (max-width: 768px) {
            .top-bar {
                padding: 10px 15px;
            }

            .game-btn {
                padding: 12px 40px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration" id="bgDecoration"></div>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 粒子效果 -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- UI 层 -->
    <div class="ui-layer" id="uiLayer">
        <div class="top-bar" id="topBar" style="display: none;">
            <div class="score-display">
                得分: <span class="score-value" id="scoreValue">0</span>
            </div>
            <div class="timer-display" id="timerDisplay">60</div>
            <div class="target-display">
                目标: <span class="target-value" id="targetValue">20</span>
            </div>
        </div>
    </div>

    <!-- 开始界面 -->
    <div class="game-overlay" id="startOverlay">
        <div class="game-title">🦟 打蚊子大作战</div>
        <div class="mosquito-icon">🦟</div>
        <div class="game-subtitle">用你的鼠标或手指<br>拍打可恶的蚊子！</div>
        <div class="mode-buttons">
            <button class="game-btn mode-btn" id="startBtn">🎯 目标模式</button>
            <button class="game-btn mode-btn free-btn" id="freeModeBtn">🌊 自由模式</button>
        </div>
        <div class="mode-info" id="modeInfo">目标: 在 60 秒内得到 <span id="startTarget">20</span> 分</div>
        <div class="tips">电脑用户：鼠标点击 | 手机用户：触摸点击</div>
    </div>

    <!-- 结果界面 -->
    <div class="game-overlay hidden" id="resultOverlay">
        <div class="result-display" id="resultDisplay">胜利!</div>
        <div class="final-score" id="finalScore">你的得分: 20</div>
        <button class="game-btn" id="restartBtn">再来一局</button>
    </div>

    <script>
        // ========== 游戏配置 ==========
        const CONFIG = {
            GAME_DURATION: 60,
            TARGET_SCORE: 20,
            MOSQUITO_BASE_SPEED: 2,
            MOSQUITO_MAX_SPEED: 10,
            HIT_RADIUS_BONUS: 20,
        };

        // ========== 游戏状态 ==========
        const GameState = {
            START: 'START',
            PLAYING: 'PLAYING',
            WIN: 'WIN',
            LOSE: 'LOSE'
        };

        // ========== 蚊子类 (DOM版本) ==========
        class MosquitoDOM {
            constructor(container) {
                this.container = container;
                this.element = null;
                this.x = 0;
                this.y = 0;
                this.vx = 0;
                this.vy = 0;
                this.speed = 2;
                this.size = 50;
                this.isHit = false;
                this.warmupFrames = 0; // 初始化热身帧计数器
                this.createElement();
            }

            createElement() {
                this.element = document.createElement('div');
                this.element.className = 'mosquito';
                this.element.innerHTML = `
                    <div class="mosquito-body">🪰</div>
                    <div class="mosquito-shadow"></div>
                `;
                this.container.appendChild(this.element);
            }

            reset(canvasWidth, canvasHeight, score, isFirstSpawn = false) {
                // 计算安全区域（避开顶部信息栏和角落）
                const topMargin = 80;  // 顶部信息栏高度
                const safeMargin = 150; // 安全边距

                // 屏幕中心区域spawn（在中心1/3区域spawn）
                const minX = canvasWidth * 0.25;
                const maxX = canvasWidth * 0.75;
                const minY = canvasHeight * 0.25;
                const maxY = canvasHeight * 0.75;

                // 生成随机位置，确保在中心安全区域
                this.x = minX + Math.random() * (maxX - minX);
                this.y = minY + Math.random() * (maxY - minY);

                // 计算从当前位置到中心的角度
                const centerX = canvasWidth / 2;
                const centerY = canvasHeight / 2;
                let angleToCenter = Math.atan2(centerY - this.y, centerX - this.x);

                // 第一次spawn时，让方向主要朝向中心（80%概率）
                if (isFirstSpawn) {
                    if (Math.random() < 0.8) {
                        // 80%概率：朝向中心，带小随机偏移 (±30°)
                        angleToCenter += (Math.random() - 0.5) * Math.PI / 6;
                    } else {
                        // 20%概率：稍微朝向角落方向
                        angleToCenter += (Math.random() - 0.5) * Math.PI;
                    }
                    this.warmupFrames = 60; // 60帧热身期（大约1秒）
                } else {
                    // 非第一次spawn，可以更随机
                    if (Math.random() < 0.5) {
                        angleToCenter += (Math.random() - 0.5) * Math.PI / 3;
                    } else {
                        angleToCenter += (Math.random() - 0.5) * Math.PI;
                    }
                    this.warmupFrames = 30; // 非第一次spawn热身期缩短
                }

                this.vx = Math.cos(angleToCenter);
                this.vy = Math.sin(angleToCenter);

                this.updateDifficulty(score);
                this.updatePosition();
            }

            updateDifficulty(score) {
                if (score < 10) {
                    this.speed = 2 + Math.random() * 1;
                    this.size = 50;
                } else if (score < 20) {
                    this.speed = 4 + Math.random() * 1;
                    this.size = 45;
                } else if (score < 30) {
                    this.speed = 6 + Math.random() * 1;
                    this.size = 40;
                } else {
                    this.speed = 8 + Math.random() * 2;
                    this.size = 35;
                }
                this.element.style.transform = `translate(-50%, -50%) scale(${this.size / 50})`;
            }

            update(canvasWidth, canvasHeight) {
                // 热身期：前几帧不移动，让蚊子先显示出来
                if (this.warmupFrames > 0) {
                    this.warmupFrames--;
                    return;
                }

                this.x += this.vx * this.speed;
                this.y += this.vy * this.speed;

                const margin = 60;
                if (this.x < margin || this.x > canvasWidth - margin) {
                    this.vx *= -1;
                    // 轻微改变方向，而不是完全反转
                    this.vy += (Math.random() - 0.5) * 0.3;
                }
                if (this.y < margin || this.y > canvasHeight - margin) {
                    this.vy *= -1;
                    this.vx += (Math.random() - 0.5) * 0.3;
                }

                // 随机改变方向（概率降低）
                if (Math.random() < 0.01) {
                    const angle = Math.random() * Math.PI * 2;
                    this.vx = Math.cos(angle);
                    this.vy = Math.sin(angle);
                }

                // 归一化速度向量
                const mag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (mag > 0) {
                    this.vx /= mag;
                    this.vy /= mag;
                }

                this.updatePosition();
            }

            updatePosition() {
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';

                const angle = Math.atan2(this.vy, this.vx) * 180 / Math.PI;
                const body = this.element.querySelector('.mosquito-body');
                body.style.transform = `rotate(${angle}deg)`;
            }

            checkHit(clickX, clickY) {
                const dx = clickX - this.x;
                const dy = clickY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance <= (this.size / 2 + CONFIG.HIT_RADIUS_BONUS);
            }

            destroy() {
                if (this.element && this.element.parentElement) {
                    this.element.parentElement.removeChild(this.element);
                }
            }
        }

        // ========== 主游戏类 ==========
        class MosquitoGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.particlesContainer = document.getElementById('particlesContainer');
                this.startOverlay = document.getElementById('startOverlay');
                this.resultOverlay = document.getElementById('resultOverlay');
                this.topBar = document.getElementById('topBar');
                this.scoreValue = document.getElementById('scoreValue');
                this.timerDisplay = document.getElementById('timerDisplay');
                this.targetValue = document.getElementById('targetValue');
                this.resultDisplay = document.getElementById('resultDisplay');
                this.finalScore = document.getElementById('finalScore');

                this.state = GameState.START;
                this.score = 0;
                this.timeLeft = CONFIG.GAME_DURATION;
                this.mosquito = null;
                this.gameMode = 'target'; // 'target' 或 'free'

                this.resize();
                this.createStars();
                this.bindEvents();
                this.gameLoop();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            createStars() {
                const container = document.getElementById('bgDecoration');
                container.innerHTML = '';
                const starCount = Math.floor((this.canvas.width * this.canvas.height) / 8000);

                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 2 + 's';
                    container.appendChild(star);
                }
            }

            bindEvents() {
                window.addEventListener('resize', () => {
                    this.resize();
                    this.createStars();
                });

                document.getElementById('startBtn').addEventListener('click', () => this.startGame('target'));
                document.getElementById('freeModeBtn').addEventListener('click', () => this.startGame('free'));
                document.getElementById('restartBtn').addEventListener('click', () => this.startGame(this.gameMode));

                const handleInteraction = (e) => {
                    if (this.state !== GameState.PLAYING) return;
                    e.preventDefault();

                    let x, y;
                    if (e.type === 'touchstart') {
                        // 使用changedTouches确保获取正确的触摸点
                        x = e.changedTouches[0].clientX;
                        y = e.changedTouches[0].clientY;
                    } else {
                        x = e.clientX;
                        y = e.clientY;
                    }

                    this.handleClick(x, y);
                };

                // 同时监听touchmove确保在移动过程中也能检测
                this.canvas.addEventListener('click', handleInteraction);
                this.canvas.addEventListener('touchstart', handleInteraction, { passive: false });
                this.canvas.addEventListener('touchmove', (e) => {
                    if (this.state !== GameState.PLAYING) return;
                    if (e.touches.length > 0) {
                        const touchX = e.touches[0].clientX;
                        const touchY = e.touches[0].clientY;
                        this.handleClick(touchX, touchY);
                    }
                }, { passive: false });
                document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
            }

            startGame(mode) {
                this.gameMode = mode || 'target';
                this.state = GameState.PLAYING;
                this.score = 0;
                this.timeLeft = CONFIG.GAME_DURATION;

                // 更新模式信息显示
                const modeInfo = document.getElementById('modeInfo');
                const startTarget = document.getElementById('startTarget');
                const targetValue = document.getElementById('targetValue');

                if (this.gameMode === 'free') {
                    modeInfo.innerHTML = '自由模式：挑战你的极限！';
                    modeInfo.className = 'mode-info free-mode';
                    startTarget.textContent = '∞';
                    targetValue.textContent = '∞';
                } else {
                    modeInfo.innerHTML = '目标: 在 60 秒内得到 <span id="startTarget">20</span> 分';
                    modeInfo.className = 'mode-info target-mode';
                    startTarget.textContent = CONFIG.TARGET_SCORE;
                    targetValue.textContent = CONFIG.TARGET_SCORE;
                }

                if (this.mosquito) {
                    this.mosquito.destroy();
                }
                this.mosquito = new MosquitoDOM(this.particlesContainer);
                // 初始化蚊子位置，第一次spawn使用特殊逻辑
                this.mosquito.reset(this.canvas.width, this.canvas.height, this.score, true);

                this.updateUI();

                this.startOverlay.classList.add('hidden');

                    const star = document.createElement('div');
                    star.className = 'hit-star';
                    star.textContent = stars[Math.floor(Math.random() * stars.length)];

                    const angle = (Math.PI * 2 / 8) * i;
                    const distance = 50 + Math.random() * 30;
                    const tx = Math.cos(angle) * distance * 0.5;
                    const ty = Math.sin(angle) * distance * 0.5;
                    const tx2 = Math.cos(angle) * distance;
                    const ty2 = Math.sin(angle) * distance;

                    star.style.left = x + 'px';
                    star.style.top = y + 'px';
                    star.style.setProperty('--tx', tx + 'px');
                    star.style.setProperty('--ty', ty + 'px');
                    star.style.setProperty('--tx2', tx2 + 'px');
                    star.style.setProperty('--ty2', ty2 + 'px');

                    this.particlesContainer.appendChild(star);
                    setTimeout(() => star.remove(), 600);
                }

                // 闪光粒子
                for (let i = 0; i < 12; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'hit-sparkle';

                    const angle = Math.random() * Math.PI * 2;
                    const distance = 30 + Math.random() * 50;
                    const tx = Math.cos(angle) * distance * 0.3;
                    const ty = Math.sin(angle) * distance * 0.3;
                    const tx2 = Math.cos(angle) * distance;
                    const ty2 = Math.sin(angle) * distance;

                    sparkle.style.left = x + 'px';
                    sparkle.style.top = y + 'px';
                    sparkle.style.setProperty('--tx', tx + 'px');
                    sparkle.style.setProperty('--ty', ty + 'px');
                    sparkle.style.setProperty('--tx2', tx2 + 'px');
                    sparkle.style.setProperty('--ty2', ty2 + 'px');

                    const colors = ['#FFD700', '#FFA500', '#FF6B35', '#FF4757'];
                    sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];

                    this.particlesContainer.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 800);
                }

                const text = document.createElement('div');
                text.className = 'hit-text';
                text.textContent = '+1';
                text.style.left = x + 'px';
                text.style.top = y + 'px';
                this.particlesContainer.appendChild(text);
                setTimeout(() => text.remove(), 800);
            }

            updateUI() {
                this.scoreValue.textContent = this.score;
                this.timerDisplay.textContent = this.timeLeft;
                this.targetValue.textContent = CONFIG.TARGET_SCORE;

                if (this.timeLeft <= 10) {
                    this.timerDisplay.classList.add('timer-warning');
                } else {
                    this.timerDisplay.classList.remove('timer-warning');
                }
            }

            endGame(isWin) {
                this.state = isWin ? GameState.WIN : GameState.LOSE;

                }

                }

                setTimeout(() => {
                    this.resultOverlay.classList.remove('hidden');
                }, 500);
            }

            game = new MosquitoGame();
        });
