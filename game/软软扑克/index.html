            ctx.stroke();
            ctx.fillStyle = '#c8b0ff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(txt, CANVAS_WIDTH/2, by + 17);
            ctx.restore();
        }
    }

    _drawPlayerLabel(ctx) {
        const name = this.t('you') + (this.landlordId === 0 ? ' · ' + this.t('landlord') : '');
        const cnt = this.playersHand[0].length + this.t('cards_count');
        const text = `${name}   ${cnt}`;
        ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
        const tw = ctx.measureText(text).width;
        const bx = CANVAS_WIDTH/2 - tw/2 - 18;
        const by = CANVAS_HEIGHT - 168;
        ctx.fillStyle = 'rgba(8,16,30,.8)';
        this._roundRect(ctx, bx, by, tw + 36, 28, 14);
        ctx.fill();
        ctx.strokeStyle = this.landlordId === 0 ? 'rgba(255,215,64,.6)' : 'rgba(120,165,235,.32)';
        ctx.lineWidth = 1.2;
        this._roundRect(ctx, bx, by, tw + 36, 28, 14);
        ctx.stroke();
        ctx.fillStyle = this.landlordId === 0 ? '#ffd740' : '#dce8fa';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, CANVAS_WIDTH/2, by + 15);

        if (this.currentPlayer === 0 && this.state === 'playing') {
            const pulse = 0.45 + 0.55 * Math.abs(Math.sin(this._tick / 22));
            ctx.save();
            ctx.globalAlpha = pulse;
            ctx.strokeStyle = '#ffd740';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#ffd740';
            ctx.shadowBlur = 16;
            this._roundRect(ctx, bx, by, tw + 36, 28, 14);
            ctx.stroke();
            ctx.restore();
        }
    }

    _drawTitle(ctx) {
        if (this.state === 'idle' || this.state === 'ended') {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = 'bold 34px "Microsoft YaHei",sans-serif';
            ctx.fillStyle = 'rgba(255,190,20,.25)';
            ctx.fillText(this.t('title'), CANVAS_WIDTH/2 + 2, 102);
            const g = ctx.createLinearGradient(0, 72, 0, 110);
            g.addColorStop(0, '#fff4c4');
            g.addColorStop(0.5, '#ffd740');
            g.addColorStop(1, '#dfa200');
            ctx.fillStyle = g;
            ctx.shadowColor = 'rgba(255,200,40,.6)';
            ctx.shadowBlur = 22;
            ctx.fillText(this.t('title'), CANVAS_WIDTH/2, 100);
            ctx.restore();
        }
    }

    _drawMessage(ctx) {
        if (!this.message || this.messageTimer <= 0) return;
        const alpha = this.messageTimer > 9000 ? 1 : Math.min(1, this.messageTimer / 40);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = 'bold 20px "Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(this.message).width;
        const bw = tw + 52, bh = 46;
        const bx = CANVAS_WIDTH/2 - bw/2;
        const by = CANVAS_HEIGHT - 230;

        ctx.shadowColor = 'rgba(0,0,0,.65)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 5;
        ctx.fillStyle = 'rgba(6,14,26,.88)';
        this._roundRect(ctx, bx, by, bw, bh, bh/2);
        ctx.fill();
        ctx.shadowColor = 'transparent';

        const isWin = this.state === 'ended' && (this.message.includes('赢') || this.message.includes('Win'));
        const isLose = this.state === 'ended' && !isWin;
        ctx.strokeStyle = isWin ? 'rgba(120,240,150,.85)' : isLose ? 'rgba(255,120,120,.8)' : 'rgba(255,215,64,.68)';
        ctx.lineWidth = 2;
        this._roundRect(ctx, bx, by, bw, bh, bh/2);
        ctx.stroke();

        const tg = ctx.createLinearGradient(0, by, 0, by + bh);
        if (isWin) { tg.addColorStop(0, '#c2ffd8'); tg.addColorStop(1, '#4ce07a'); }
        else if (isLose) { tg.addColorStop(0, '#ffd6d6'); tg.addColorStop(1, '#ff7b7b'); }
        else { tg.addColorStop(0, '#fff6cc'); tg.addColorStop(1, '#ffd740'); }
        ctx.fillStyle = tg;
        ctx.fillText(this.message, CANVAS_WIDTH/2, by + bh/2 + 1);
        ctx.restore();
    }

    _button(ctx, x, y, w, h, text, scheme) {
        const hover = this._mouseX >= x && this._mouseX <= x + w && this._mouseY >= y && this._mouseY <= y + h;
        const s = hover ? 1.035 : 1;
        const cx = x + w/2, cy = y + h/2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(s, s);
        ctx.translate(-w/2, -h/2);
        ctx.shadowColor = scheme.glow || 'rgba(0,0,0,.5)';
        ctx.shadowBlur = hover ? 24 : 12;
        ctx.shadowOffsetY = 5;
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, hover ? scheme.topHover : scheme.top);
        g.addColorStop(1, hover ? scheme.botHover : scheme.bot);
        ctx.fillStyle = g;
        this._roundRect(ctx, 0, 0, w, h, 12);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.strokeStyle = scheme.border || 'rgba(255,255,255,.5)';
        ctx.lineWidth = 2;
        this._roundRect(ctx, 0, 0, w, h, 12);
        ctx.stroke();
        if (text) {
            ctx.fillStyle = scheme.textColor || '#ffffff';
            ctx.font = 'bold 17px "Microsoft YaHei",sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, w/2, h/2 + 1);
        }
        ctx.restore();
    }

    _drawGunIcon(ctx, cx, cy, scale, color) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.fillStyle = color;
        ctx.fillRect(-20, -7, 30, 8);
        ctx.fillRect(-10, -11, 18, 4);
        ctx.fillRect(2, -14, 4, 3);
        ctx.fillRect(-12, 1, 18, 4);
        ctx.beginPath();
        ctx.moveTo(-11, 5);
        ctx.lineTo(-2, 5);
        ctx.lineTo(-6, 17);
        ctx.lineTo(-15, 17);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-5, 6, 3.6, 0.15, Math.PI - 0.15);
        ctx.stroke();
        ctx.restore();
    }

    _drawButtons(ctx) {
        this._playBtnRect = null;
        this._passBtnRect = null;
        this._callBtnRect = null;
        this._noCallBtnRect = null;
        this._grabBtnRect = null;
        this._noGrabBtnRect = null;
        this._startBtnRect = null;
        this._gunBtnRect = null;

        const BTN_Y = CANVAS_HEIGHT - 62, BTN_H = 46;

        if (this.state === 'playing' && this.currentPlayer === 0) {
            const selCount = this.playersHand[0].filter(c => c.selected).length;
            const playLabel = this.t('play') + (selCount ? ` (${selCount})` : '');
            const pw = 136, px = CANVAS_WIDTH/2 - pw - 12;
            this._button(ctx, px, BTN_Y, pw, BTN_H, playLabel, {
                top:'#5aa9f5', bot:'#2d6fc0', topHover:'#7cc0fc', botHover:'#3d84d8',
                border:'rgba(200,230,255,.7)', glow:'rgba(70,150,255,.6)'
            });
            this._playBtnRect = { x:px, y:BTN_Y, w:pw, h:BTN_H };
            if (this.lastPlayInfo) {
                const pw2 = 100, px2 = CANVAS_WIDTH/2 + 12;
                this._button(ctx, px2, BTN_Y, pw2, BTN_H, this.t('pass'), {
                    top:'#e8a04c', bot:'#b06725', topHover:'#f7ba70', botHover:'#c47c36',
                    border:'rgba(255,225,180,.6)', glow:'rgba(230,150,60,.55)'
                });
                this._passBtnRect = { x:px2, y:BTN_Y, w:pw2, h:BTN_H };
            }
        }
        if (this.state === 'calling' && this.callCurrent === 0) {
            const cw = 152, ch = 48, cx = CANVAS_WIDTH/2 - cw - 12;
            this._button(ctx, cx, BTN_Y, cw, ch, this.t('call_landlord'), {
                top:'#5aa9f5', bot:'#2d6fc0', topHover:'#7cc0fc', botHover:'#3d84d8',
                border:'rgba(200,230,255,.7)', glow:'rgba(70,150,255,.6)'
            });
            this._callBtnRect = { x:cx, y:BTN_Y, w:cw, h:ch };
            const ncw = 112, ncx = CANVAS_WIDTH/2 + 12;
            this._button(ctx, ncx, BTN_Y, ncw, ch, this.t('no_call'), {
                top:'#e8a04c', bot:'#b06725', topHover:'#f7ba70', botHover:'#c47c36',
                border:'rgba(255,225,180,.6)', glow:'rgba(230,150,60,.55)'
            });
            this._noCallBtnRect = { x:ncx, y:BTN_Y, w:ncw, h:ch };
        }
        if (this.state === 'grabbing' && this.grabCurrent === 0) {
            const gw = 152, gh = 48, gx = CANVAS_WIDTH/2 - gw - 12;
            this._button(ctx, gx, BTN_Y, gw, gh, this.t('grab_landlord'), {
                top:'#f2685a', bot:'#bb3225', topHover:'#ff8a7c', botHover:'#d24334',
                border:'rgba(255,210,150,.85)', glow:'rgba(230,80,60,.6)'
            });
            this._grabBtnRect = { x:gx, y:BTN_Y, w:gw, h:gh };
            const ngw = 112, ngx = CANVAS_WIDTH/2 + 12;
            this._button(ctx, ngx, BTN_Y, ngw, gh, this.t('no_grab'), {
                top:'#e8a04c', bot:'#b06725', topHover:'#f7ba70', botHover:'#c47c36',
                border:'rgba(255,225,180,.6)', glow:'rgba(230,150,60,.55)'
            });
            this._noGrabBtnRect = { x:ngx, y:BTN_Y, w:ngw, h:gh };
        }
        if (this.state === 'idle' || this.state === 'ended') {
            const sw = 200, sh = 58;
            const sx = CANVAS_WIDTH/2 - sw/2;
            const sy = CANVAS_HEIGHT/2 + 100;
            const key = this.state === 'ended' ? 'restart' : 'start';
            const pulse = 0.5 + 0.5 * Math.sin(this._tick / 26);
            ctx.save();
            ctx.globalAlpha = 0.25 + pulse * 0.4;
            ctx.shadowColor = '#ffd740';
            ctx.shadowBlur = 30;
            ctx.strokeStyle = 'rgba(255,215,64,.95)';
            ctx.lineWidth = 2;
            this._roundRect(ctx, sx - 5, sy - 5, sw + 10, sh + 10, 18);
            ctx.stroke();
            ctx.restore();
            this._button(ctx, sx, sy, sw, sh, '', {
                top:'#ffd45e', bot:'#d99a10', topHover:'#ffe283', botHover:'#eba91c',
                border:'rgba(255,250,210,.9)', glow:'rgba(255,200,50,.7)'
            });
            ctx.save();
            ctx.fillStyle = '#3a2600';
            ctx.font = 'bold 21px "Microsoft YaHei",sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.t(key), sx + sw/2, sy + sh/2 + 1);
            ctx.restore();
            this._startBtnRect = { x:sx, y:sy, w:sw, h:sh };
        }

        this._drawGunButton(ctx);
        this._drawGear(ctx);
    }

    _drawGunButton(ctx) {
        const gw = 84, gh = 72;
        const gx = CANVAS_WIDTH - 100;
        const gy = CANVAS_HEIGHT - 160;
        const used = this.gunUsed;
        const hover = !used && this._mouseX >= gx && this._mouseX <= gx + gw && this._mouseY >= gy && this._mouseY <= gy + gh;

        ctx.save();
        if (!used && (this.aiming || hover)) {
            const pulse = 0.5 + 0.5 * Math.sin(this._tick / 10);
            ctx.globalAlpha = 0.25 + pulse * 0.4;
            ctx.shadowColor = this.aiming ? '#ff3030' : '#ffd740';
            ctx.shadowBlur = 26;
            ctx.fillStyle = this.aiming ? 'rgba(255,60,60,.5)' : 'rgba(255,215,64,.4)';
            this._roundRect(ctx, gx - 4, gy - 4, gw + 8, gh + 8, 16);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }
        const bg = ctx.createLinearGradient(gx, gy, gx, gy + gh);
        if (used) { bg.addColorStop(0, 'rgba(38,38,42,.92)'); bg.addColorStop(1, 'rgba(20,20,24,.92)'); }
        else if (this.aiming) { bg.addColorStop(0, 'rgba(150,20,20,.95)'); bg.addColorStop(1, 'rgba(90,10,10,.95)'); }
        else if (hover) { bg.addColorStop(0, 'rgba(90,60,20,.95)'); bg.addColorStop(1, 'rgba(60,38,12,.95)'); }
        else { bg.addColorStop(0, 'rgba(52,36,18,.9)'); bg.addColorStop(1, 'rgba(30,20,10,.9)'); }
        ctx.fillStyle = bg;
        this._roundRect(ctx, gx, gy, gw, gh, 14);
        ctx.fill();
        ctx.strokeStyle = used ? 'rgba(120,120,130,.5)' : this.aiming ? '#ff5050' : '#ffd740';
        ctx.lineWidth = this.aiming ? 2.8 : 2.2;
        this._roundRect(ctx, gx, gy, gw, gh, 14);
        ctx.stroke();
        const iconColor = used ? 'rgba(120,120,130,.55)' : this.aiming ? '#ffb0b0' : hover ? '#ffe98c' : '#ffd740';
        this._drawGunIcon(ctx, gx + gw/2, gy + gh/2 - 8, 1.55, iconColor);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 11px "Microsoft YaHei",sans-serif';
        if (used) {
            ctx.fillStyle = 'rgba(160,160,170,.75)';
            ctx.fillText(this.t('gun_used'), gx + gw/2, gy + gh - 12);
        } else if (this.aiming) {
            ctx.fillStyle = '#ffb0b0';
            ctx.fillText('瞄准中…', gx + gw/2, gy + gh - 12);
        } else {
            ctx.fillStyle = '#ffd740';
            ctx.fillText(this.t('gun_ready'), gx + gw/2, gy + gh - 12);
        }
        if (used) {
            ctx.strokeStyle = 'rgba(200,60,60,.7)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(gx + 14, gy + 14);
            ctx.lineTo(gx + gw - 14, gy + gh - 14);
            ctx.stroke();
        }
        ctx.restore();
        this._gunBtnRect = { x:gx, y:gy, w:gw, h:gh };
    }

    _drawGear(ctx) {
        const gx = CANVAS_WIDTH - 46, gy = 42, r = 22;
        const hover = Math.hypot(this._mouseX - gx, this._mouseY - gy) < r;
        ctx.save();
        const g = ctx.createRadialGradient(gx - 6, gy - 8, 3, gx, gy, r);
        if (hover) { g.addColorStop(0, '#5f8bc9'); g.addColorStop(1, '#2f5488'); }
        else { g.addColorStop(0, '#2c3f5c'); g.addColorStop(1, '#16202f'); }
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(gx, gy, r, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = hover ? '#ffd740' : 'rgba(150,180,225,.42)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = hover ? '#ffd740' : '#b8cae4';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(gx, gy, 6.5, 0, Math.PI*2);
        ctx.stroke();
        for (let a = 0; a < 360; a += 45) {
            const rad = a * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(gx + Math.cos(rad) * 9, gy + Math.sin(rad) * 9);
            ctx.lineTo(gx + Math.cos(rad) * 14, gy + Math.sin(rad) * 14);
            ctx.stroke();
        }
        ctx.restore();
    }

    _drawAimPrompt(ctx) {
        if (!this.aiming) return;
        ctx.save();
        ctx.font = 'bold 18px "Microsoft YaHei",sans-serif';
        const text = this.t('aim_prompt');
        const tw = ctx.measureText(text).width;
        const bw = tw + 62, bh = 48;
        const bx = CANVAS_WIDTH/2 - bw/2;
        const by = 100;
        const pulse = 0.5 + 0.5 * Math.sin(this._tick / 8);
        ctx.shadowColor = `rgba(255,50,50,${0.5 + pulse * 0.5})`;
        ctx.shadowBlur = 22;
        ctx.fillStyle = 'rgba(80,10,10,.94)';
        this._roundRect(ctx, bx, by, bw, bh, 24);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = `rgba(255,80,80,${0.6 + pulse * 0.4})`;
        ctx.lineWidth = 2.5;
        this._roundRect(ctx, bx, by, bw, bh, 24);
        ctx.stroke();
        ctx.fillStyle = '#ffc0c0';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, CANVAS_WIDTH/2, by + bh/2 + 1);
        ctx.restore();
    }

    _drawCrosshair(ctx) {
        if (!this.aiming) return;
        const mx = this._mouseX, my = this._mouseY;
        if (mx < 0 || my < 0) return;
        ctx.save();
        ctx.strokeStyle = 'rgba(255,60,60,.92)';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#ff3030';
        ctx.shadowBlur = 10;
        const pulse = 0.5 + 0.5 * Math.sin(this._tick / 6);
        const r = 20 + pulse * 4;
        ctx.beginPath();
        ctx.arc(mx, my, r, 0, Math.PI*2);
        ctx.stroke();
        for (let a = 0; a < 360; a += 90) {
            const rad = a * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(mx + Math.cos(rad) * (r - 8), my + Math.sin(rad) * (r - 8));
            ctx.lineTo(mx + Math.cos(rad) * (r + 10), my + Math.sin(rad) * (r + 10));
            ctx.stroke();
        }
        ctx.fillStyle = '#ff3030';
        ctx.beginPath();
        ctx.arc(mx, my, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }

    /* ── 点击 ── */
    handleClick(pos) {
        const { x, y } = pos;
        if (Math.hypot(x - (CANVAS_WIDTH - 46), y - 42) < 26) {
            this.settingsOpen = true;
            settingsOverlay.classList.add('active');
            return;
        }
        const inRect = r => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
        if (inRect(this._gunBtnRect) && !this.gunUsed && this.state !== 'ended') {
            this.aiming = !this.aiming;
            return;
        }
        if (this.aiming) {
            /* 用 3D 投影位置检测点击 */
            const targets = [
                { pid: 1, seat: SEAT_AI1 },
                { pid: 2, seat: SEAT_AI2 }
            ];
            for (const t of targets) {
                if (this.deadPlayers[t.pid]) continue;
                const p = this.camera.project(t.seat.x, 150, t.seat.z);
                if (!p) continue;
                const d = Math.hypot(x - p.x, y - p.y);
                if (d < 90 * Math.max(0.5, Math.min(2, p.scale))) {
                    this._shootPlayer(t.pid);
                    return;
                }
            }
            this.aiming = false;
            return;
        }
        if (inRect(this._startBtnRect)) { this.initNewGame(); return; }
        if (inRect(this._callBtnRect)) {
            this.callScores[0] = 1;
            this.message = this.t('you') + ' · ' + this.t('call_landlord');
            this.messageTimer = 60;
            this._advanceCalling();
            return;
        }
        if (inRect(this._noCallBtnRect)) {
            this.callScores[0] = 0;
            this.message = this.t('you') + ' · ' + this.t('no_call');
            this.messageTimer = 60;
            this._advanceCalling();
            return;
        }
        if (inRect(this._grabBtnRect)) {
            const base = Math.max(this.callScores[0], ...this.grabScores);
            this.grabScores[0] = base + 1;
            this.message = this.t('you') + ' · ' + this.t('grab_landlord');
            this.messageTimer = 60;
            this._advanceGrabbing();
            return;
        }
        if (inRect(this._noGrabBtnRect)) {
            this.grabScores[0] = 0;
            this.message = this.t('you') + ' · ' + this.t('no_grab');
            this.messageTimer = 60;
            this._advanceGrabbing();
            return;
        }
        if (inRect(this._playBtnRect)) {
            const sel = this.playersHand[0].filter(c => c.selected);
            if (sel.length) this.playerPlayCards(sel);
            else { this.message = this.t('select_cards'); this.messageTimer = 55; }
            return;
        }
        if (inRect(this._passBtnRect)) { this.playerPass(); return; }
        if (this.state === 'playing' && this.currentPlayer === 0) {
            const h0 = this.playersHand[0];
            for (let i = h0.length - 1; i >= 0; i--) {
                if (h0[i].containsPoint(x, y)) {
                    h0[i].selected = !h0[i].selected;
                    return;
                }
            }
        }
    }
}

/* ═══════════════ 启动 ═══════════════ */
const game = new Game();

game._updateAIDifficulty = function () {
    if (this.aiPlayers[1]) this.aiPlayers[1].difficulty = this.difficulty;
    if (this.aiPlayers[2]) this.aiPlayers[2].difficulty = this.difficulty;
};

let _lastUISig = '';
function updateSettingsUI() {
    const sig = [game.difficulty, game.lang].join('|');
    if (sig === _lastUISig) return;
    _lastUISig = sig;
    diffEasy.classList.toggle('active', game.difficulty === 'easy');
    diffNormal.classList.toggle('active', game.difficulty === 'normal');
    diffHard.classList.toggle('active', game.difficulty === 'hard');
    langZh.classList.toggle('active', game.lang === 'zh');
    langEn.classList.toggle('active', game.lang === 'en');
    settingsTitle.textContent = game.t('settings');
    diffLabel.textContent = game.t('difficulty') + '：';
    langLabel.textContent = game.t('language') + '：';
    diffEasy.textContent = game.t('easy');
    diffNormal.textContent = game.t('normal');
    diffHard.textContent = game.t('hard');
    langZh.textContent = game.t('chinese');
    langEn.textContent = game.t('english');
}

settingsClose.addEventListener('click', () => {
    game.settingsOpen = false;
    settingsOverlay.classList.remove('active');
});
settingsOverlay.addEventListener('click', e => {
    if (e.target === settingsOverlay) {
        game.settingsOpen = false;
        settingsOverlay.classList.remove('active');
    }
});
diffEasy.addEventListener('click', () => { game.difficulty = 'easy'; game._updateAIDifficulty(); updateSettingsUI(); });
diffNormal.addEventListener('click', () => { game.difficulty = 'normal'; game._updateAIDifficulty(); updateSettingsUI(); });
diffHard.addEventListener('click', () => { game.difficulty = 'hard'; game._updateAIDifficulty(); updateSettingsUI(); });
langZh.addEventListener('click', () => { game.lang = 'zh'; window._lang = 'zh'; updateSettingsUI(); });
langEn.addEventListener('click', () => { game.lang = 'en'; window._lang = 'en'; updateSettingsUI(); });

document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['w','a','s','d','q','e'].includes(k)) {
        game.keys[k] = true;
        if (['w','a','s','d'].includes(k)) e.preventDefault();
    }
    if (e.key === 'Escape') {
        if (game.settingsOpen) {
            game.settingsOpen = false;
            settingsOverlay.classList.remove('active');
        } else if (game.aiming) {
            game.aiming = false;
        }
    }
    if (e.code === 'Space' && game.state === 'playing' && game.currentPlayer === 0) {
        e.preventDefault();
        const sel = game.playersHand[0].filter(c => c.selected);
        if (sel.length) game.playerPlayCards(sel);
    }
    if (k === 'p') {
        if (game.state === 'playing' && game.currentPlayer === 0 && game.lastPlayInfo) game.playerPass();
    }
    if (k === 'g') {
        if (!game.gunUsed && game.state !== 'ended') game.aiming = !game.aiming;
    }
    if (k === 'r') {
        game.cameraRadius = 620;
        game.cameraAngle = 0;
        game.cameraHeight = 340;
        game._updateCameraFromSpherical();
    }
});
document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (['w','a','s','d','q','e'].includes(k)) game.keys[k] = false;
});

canvas.addEventListener('mousedown', e => {
    if (e.button === 0) {
        game.mouseDrag = true;
        game.lastMouseX = e.clientX;
        game.lastMouseY = e.clientY;
        game.handleClick(getCanvasPos(e));
    }
});
canvas.addEventListener('mousemove', e => {
    const pos = getCanvasPos(e);
    game._mouseX = pos.x; game._mouseY = pos.y;
    if (game.mouseDrag) {
        const dx = e.clientX - game.lastMouseX;
        const dy = e.clientY - game.lastMouseY;
        game.camera.yaw += dx * 0.005;
        game.camera.pitch = clamp(game.camera.pitch - dy * 0.003, -1.2, 1.2);
        game.lastMouseX = e.clientX;
        game.lastMouseY = e.clientY;
    }
});
canvas.addEventListener('mouseup', () => { game.mouseDrag = false; });
canvas.addEventListener('mouseleave', () => {
    game._mouseX = -999; game._mouseY = -999;
    game.mouseDrag = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* 触摸 */
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
        const pos = getCanvasPos(e);
        game._mouseX = pos.x; game._mouseY = pos.y;
        game.handleClick(pos);
        game.mouseDrag = true;
        game.lastMouseX = e.touches[0].clientX;
        game.lastMouseY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastTouchDist = Math.sqrt(dx*dx + dy*dy);
    }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && game.mouseDrag) {
        const dx = e.touches[0].clientX - game.lastMouseX;
        const dy = e.touches[0].clientY - game.lastMouseY;
        game.camera.yaw += dx * 0.005;
        game.camera.pitch = clamp(game.camera.pitch - dy * 0.003, -1.2, 1.2);
        game.lastMouseX = e.touches[0].clientX;
        game.lastMouseY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (lastTouchDist > 0) {
            const delta = (d - lastTouchDist) * 0.4;
            const cam = game.camera;
            const fx = Math.sin(cam.yaw), fz = Math.cos(cam.yaw);
            cam.x += fx * delta;
            cam.z += fz * delta;
        }
        lastTouchDist = d;
    }
}, { passive: false });
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    game.mouseDrag = false;
    lastTouchDist = 0;
    game._mouseX = -999; game._mouseY = -999;
}, { passive: false });

function gameLoop() {
    game.update();
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    game.draw(ctx);
    updateSettingsUI();
    canvas.style.cursor = game.aiming ? 'crosshair' : game.mouseDrag ? 'grabbing' : 'grab';
    requestAnimationFrame(gameLoop);
}

game.state = 'idle';
updateSettingsUI();
gameLoop();

})();
</script>
