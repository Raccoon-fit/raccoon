<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>软软扑克 · 3D 斗地主 · 自由视角</title>
<style>
    :root { --gold: #ffd740; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        background: #05080f;
        display: flex; justify-content: center; align-items: center;
        font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .game-container {
        position: relative; width: 100%; max-width: 1100px;
        height: 720px; max-height: 100vh; margin: 0 auto;
    }
    canvas {
        display: block; width: 100%; height: 100%;
        border-radius: 14px; cursor: grab;
        box-shadow: 0 30px 90px rgba(0,0,0,.85), 0 0 0 1px rgba(120,170,255,.12);
        background: #1a2a44;
    }
    .hud-hint {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        padding: 6px 18px; background: rgba(10,20,35,.72);
        border: 1px solid rgba(120,170,255,.3); border-radius: 20px;
        color: #b8cae4; font-size: 12px; letter-spacing: 1px;
        pointer-events: none; white-space: nowrap;
        backdrop-filter: blur(4px); z-index: 5;
    }
    .hud-hint b { color: var(--gold); font-weight: 700; }
    .overlay {
        position: absolute; inset: 0;
        background: rgba(4,8,16,.74);
        backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
        display: none; justify-content: center; align-items: center;
        z-index: 10; border-radius: 14px;
    }
    .overlay.active { display: flex; }
    .settings-panel {
        background: linear-gradient(160deg, #1d2c47 0%, #101a2c 100%);
        border: 2px solid #3d5a8a; border-radius: 18px;
        padding: 26px 30px 22px; width: 86%; max-width: 440px;
        color: #e8eefc; position: relative;
        box-shadow: 0 24px 70px rgba(0,0,0,.8);
    }
    .settings-panel h3 {
        text-align: center; margin-bottom: 20px; font-size: 1.3em;
        letter-spacing: 4px; color: var(--gold);
    }
    .close-btn {
        position: absolute; top: 12px; right: 14px; width: 34px; height: 34px;
        border-radius: 50%; background: linear-gradient(180deg,#e74c3c,#a8281c);
        color: #fff; border: none; font-size: 1em; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }
    .close-btn:hover { transform: scale(1.1) rotate(90deg); }
    .row { display: flex; align-items: center; margin: 14px 0; gap: 10px; flex-wrap: wrap; }
    .row label { font-weight: 700; min-width: 56px; font-size: .96em; color: #9fb6d8; }
    .row button {
        padding: 9px 18px; border-radius: 10px; border: 1.5px solid #365272;
        background: linear-gradient(180deg,#253a58,#1a2a42);
        color: #b9cbe4; cursor: pointer; font-size: .9em; font-weight: 600;
        transition: all .18s ease; white-space: nowrap;
    }
    .row button:hover { background: linear-gradient(180deg,#34527c,#24395a); color: #fff; }
    .row button.active {
        background: linear-gradient(180deg,#3f8de0,#2563b0);
        color: #fff; border-color: var(--gold);
        box-shadow: 0 0 16px rgba(255,215,64,.35);
    }
    @media (max-width: 768px) {
        .game-container { max-height: 100vh; height: 100vh; }
        canvas { border-radius: 0; box-shadow: none; }
        .settings-panel { width: 92%; padding: 20px 16px 16px; }
        .hud-hint { font-size: 10px; padding: 4px 12px; }
    }
</style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div class="hud-hint"><b>WASD</b> 移动 · <b>鼠标拖动</b> 旋转 · <b>Q/E</b> 升降 · <b>R</b> 复位 · 走到机器人身后看牌</div>
    <div class="overlay" id="settingsOverlay">
        <div class="settings-panel">
            <button class="close-btn" id="settingsClose">✕</button>
            <h3 id="settingsTitle">设置</h3>
            <div class="row">
                <label id="diffLabel">难度：</label>
                <button data-diff="easy" id="diffEasy">简单</button>
                <button data-diff="normal" id="diffNormal">普通</button>
                <button data-diff="hard" id="diffHard">困难</button>
            </div>
            <div class="row">
                <label id="langLabel">语言：</label>
                <button data-lang="zh" id="langZh">中文</button>
                <button data-lang="en" id="langEn">English</button>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
'use strict';

/* ═══════════════ 常量 ═══════════════ */
const CANVAS_WIDTH  = 1100;
const CANVAS_HEIGHT = 720;
const TABLE_RADIUS  = 300;
const CARD_W_3D = 60, CARD_H_3D = 84;

const SEAT_PLAYER = { x: 0,    z: -340 };
const SEAT_AI1    = { x: -320, z:  250 };
const SEAT_AI2    = { x:  320, z:  250 };

/* 三家出牌区（靠近桌子中心，避免被人物/手牌遮挡） */
const ZONE_PLAYER = { x: 0,   z: -170 };
const ZONE_AI1    = { x: -180, z:  110 };
const ZONE_AI2    = { x:  180, z:  110 };

const CARD_WIDTH = 72, CARD_HEIGHT = 100, CARD_RADIUS = 8, CARD_SELECTED_OFFSET = 26;

const SUIT_SPADE=0, SUIT_HEART=1, SUIT_CLUB=2, SUIT_DIAMOND=3, SUIT_JOKER=4;
const SUIT_SYMBOLS = { [SUIT_SPADE]:'♠', [SUIT_HEART]:'♥', [SUIT_CLUB]:'♣', [SUIT_DIAMOND]:'♦', [SUIT_JOKER]:'★' };
const RANK_NAMES_ZH = { 3:'3',4:'4',5:'5',6:'6',7:'7',8:'8',9:'9',10:'10',11:'J',12:'Q',13:'K',14:'A',15:'2',16:'小',17:'大' };
const RANK_NAMES_EN = { 3:'3',4:'4',5:'5',6:'6',7:'7',8:'8',9:'9',10:'10',11:'J',12:'Q',13:'K',14:'A',15:'2',16:'Jo',17:'JO' };

const TEXTS = {
    zh: { title:'软 软 扑 克', start:'开始游戏', restart:'再来一局', settings:'设置',
        difficulty:'难度', easy:'简单', normal:'普通', hard:'困难', language:'语言', chinese:'中文', english:'English',
        call_landlord:'叫地主', no_call:'不叫', grab_landlord:'抢地主', no_grab:'不抢', play:'出牌', pass:'不出',
        landlord:'地主', you_win:'🎉 你赢了！', you_lose:'💔 你输了…', you:'你',
        cards_count:'张', bottom_cards:'底 牌', new_round:'新一轮 · 请出牌', invalid_play:'无效牌型！',
        cant_beat:'打不过上家！', must_play:'新一轮必须出牌', select_cards:'请先选牌',
        no_one_call:'无人叫地主，重新发牌…', no_one_grab:'无人抢地主，重新发牌…',
        ai_play:'出牌', ai_pass:'不出', thinking:'思考中', dealing:'发牌中…',
        gun_ready:'手枪', gun_used:'已用', aim_prompt:'点击机器人面板击毙',
        shot_ok:'击毙成功！', shot_kill_landlord:'地主已淘汰！继续对战',
        dead:'已淘汰', your_turn:'轮到你出牌', peeking:'窥视中…' },
    en: { title:'R U A N  P O K E R', start:'Start', restart:'Play Again', settings:'Settings',
        difficulty:'Difficulty', easy:'Easy', normal:'Normal', hard:'Hard', language:'Language', chinese:'中文', english:'English',
        call_landlord:'Call', no_call:'Pass', grab_landlord:'Grab', no_grab:'Pass', play:'Play', pass:'Pass',
        landlord:'Landlord', you_win:'🎉 You Win!', you_lose:'💔 You Lose…', you:'You',
        cards_count:'', bottom_cards:'BOTTOM', new_round:'New round · play!', invalid_play:'Invalid play!',
        cant_beat:"Can't beat that!", must_play:'Must play a card', select_cards:'Select cards first',
        no_one_call:'Nobody called — redealing…', no_one_grab:'Nobody grabbed — redealing…',
        ai_play:'plays', ai_pass:'passes', thinking:'thinking', dealing:'Dealing…',
        gun_ready:'Gun', gun_used:'Used', aim_prompt:'Click a robot to shoot',
        shot_ok:'Target eliminated!', shot_kill_landlord:'Landlord down! Fight on',
        dead:'Eliminated', your_turn:'Your turn', peeking:'Peeking…' }
};

/* ═══════════════ DOM ═══════════════ */
const canvas = document.getElementById('gameCanvas');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;
const ctx = canvas.getContext('2d');

const settingsOverlay = document.getElementById('settingsOverlay');
const settingsClose   = document.getElementById('settingsClose');
const diffEasy = document.getElementById('diffEasy');
const diffNormal = document.getElementById('diffNormal');
const diffHard = document.getElementById('diffHard');
const langZh = document.getElementById('langZh');
const langEn = document.getElementById('langEn');
const settingsTitle = document.getElementById('settingsTitle');
const diffLabel = document.getElementById('diffLabel');
const langLabel = document.getElementById('langLabel');

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = CANVAS_WIDTH / rect.width, sy = CANVAS_HEIGHT / rect.height;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ═══════════════ 摄像机（修复版） ═══════════════ */
class Camera {
    constructor() {
        this.x = 0; this.y = 340; this.z = -620;
        this.yaw = 0; this.pitch = -0.45; this.focal = 780;
        this.lookAt(0, 40, 0);
    }
    lookAt(tx, ty, tz) {
        const dx = tx - this.x, dy = ty - this.y, dz = tz - this.z;
        this.yaw = Math.atan2(dx, dz);
        this.pitch = Math.atan2(dy, Math.sqrt(dx*dx + dz*dz));
    }
    project(wx, wy, wz) {
        const dx = wx - this.x, dy = wy - this.y, dz = wz - this.z;
        const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
        const cyw = Math.cos(this.yaw),   syw = Math.sin(this.yaw);
        const fx = syw*cp, fy = sp, fz = cyw*cp;
        const rx = cyw,    ry = 0,  rz = -syw;
        const ux = -sp*syw, uy = cp, uz = -sp*cyw;
        const camX = dx*rx + dy*ry + dz*rz;
        const camY = dx*ux + dy*uy + dz*uz;
        const camZ = dx*fx + dy*fy + dz*fz;
        if (camZ < 1) return null;
        const scale = this.focal / camZ;
        return {
            x: CANVAS_WIDTH/2 + camX*scale,
            y: CANVAS_HEIGHT/2 - camY*scale,
            scale, depth: camZ
        };
    }
}

/* ═══════════════ Card ═══════════════ */
class Card {
    constructor(suit, rank) {
        this.suit = suit; this.rank = rank;
        this.selected = false; this.faceUp = true;
        this.x = 0; this.y = 0;
        this.targetX = 0; this.targetY = 0;
        this.rotation = 0; this.targetRotation = 0;
        this.scale = 1; this.targetScale = 1;
        this.animSpeed = 0.18;
    }
    get isRed() { return this.suit === SUIT_HEART || this.suit === SUIT_DIAMOND || (this.suit === SUIT_JOKER && this.rank === 17); }
    get displayRank() { return (window._lang === 'en' ? RANK_NAMES_EN : RANK_NAMES_ZH)[this.rank] || String(this.rank); }
    get displaySuit() { return SUIT_SYMBOLS[this.suit] || ''; }

    updatePosition() {
        this.x = lerp(this.x, this.targetX, this.animSpeed);
        this.y = lerp(this.y, this.targetY, this.animSpeed);
        this.rotation = lerp(this.rotation, this.targetRotation, this.animSpeed * 1.4);
        this.scale = lerp(this.scale, this.targetScale, this.animSpeed * 1.4);
        if (Math.abs(this.x - this.targetX) < 0.4) this.x = this.targetX;
        if (Math.abs(this.y - this.targetY) < 0.4) this.y = this.targetY;
    }
    setTarget(x, y, rot, sc) {
        this.targetX = x; this.targetY = y;
        if (rot !== undefined) this.targetRotation = rot;
        if (sc !== undefined) this.targetScale = sc;
    }
    snapToTarget() { this.x = this.targetX; this.y = this.targetY; this.rotation = this.targetRotation; this.scale = this.targetScale; }
    containsPoint(px, py) {
        const sel = this.selected ? -CARD_SELECTED_OFFSET : 0;
        const cx = this.x + CARD_WIDTH/2, cy = this.y + CARD_HEIGHT/2 + sel;
        return Math.abs(px - cx) <= CARD_WIDTH/2 && Math.abs(py - cy) <= CARD_HEIGHT/2;
    }

    drawHUD(ctx, lang) {
        const sel = this.selected ? -CARD_SELECTED_OFFSET : 0;
        ctx.save();
        ctx.translate(this.x + CARD_WIDTH/2, this.y + CARD_HEIGHT/2 + sel);
        ctx.rotate(this.rotation);
        ctx.scale(this.scale, this.scale);
        if (this.selected) {
            ctx.shadowColor = 'rgba(255,215,64,.9)';
            ctx.shadowBlur = 26; ctx.shadowOffsetY = -4;
        } else {
            ctx.shadowColor = 'rgba(0,0,0,.65)';
            ctx.shadowBlur = 12; ctx.shadowOffsetY = 6;
        }
        ctx.translate(-CARD_WIDTH/2, -CARD_HEIGHT/2);
        this._renderFace(ctx, CARD_WIDTH, CARD_HEIGHT, CARD_RADIUS, lang);
        ctx.restore();
    }

    _renderFace(ctx, w, h, r, lang) {
        if (this.faceUp) {
            ctx.fillStyle = 'rgba(196,190,172,.95)';
            this._roundRect(ctx, 2.5, 4, w, h, r); ctx.fill();
            const g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#fbf9f3'); g.addColorStop(1, '#eee9dc');
            ctx.fillStyle = g;
            this._roundRect(ctx, 0, 0, w, h, r); ctx.fill();
            ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
            ctx.strokeStyle = this.selected ? '#f5b301' : 'rgba(0,0,0,.16)';
            ctx.lineWidth = this.selected ? 2.2 : 1;
            this._roundRect(ctx, 0, 0, w, h, r); ctx.stroke();

            const color = this.isRed ? '#d02a2a' : '#1b1f28';
            if (this.suit === SUIT_JOKER) {
                const jc = this.rank === 17 ? '#d02a2a' : '#3a3f4a';
                const main = this.rank === 17 ? (lang==='en'?'JO':'大') : (lang==='en'?'Jo':'小');
                ctx.fillStyle = jc;
                ctx.font = `bold ${w*0.33}px "Microsoft YaHei",sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(main, w/2, h/2 - 4);
                ctx.font = `bold ${w*0.14}px "Segoe UI",sans-serif`;
                ctx.fillStyle = this.rank === 17 ? '#e05555' : '#8a8f9a';
                ctx.fillText('JOKER', w/2, h/2 + h*0.22);
            } else {
                ctx.textBaseline = 'alphabetic';
                ctx.fillStyle = color;
                ctx.font = `bold ${w*0.27}px "Microsoft YaHei",sans-serif`;
                ctx.textAlign = 'left';
                ctx.fillText(this.displayRank, w*0.10, h*0.23);
                ctx.font = `${w*0.21}px "Segoe UI Symbol",serif`;
                ctx.fillText(this.displaySuit, w*0.10, h*0.41);
                ctx.font = `${w*0.5}px "Segoe UI Symbol",serif`;
                ctx.textAlign = 'center';
                ctx.globalAlpha = 0.92;
                ctx.fillText(this.displaySuit, w/2, h/2 + h*0.13);
                ctx.globalAlpha = 1;
            }
        } else {
            ctx.fillStyle = 'rgba(22,40,86,.95)';
            this._roundRect(ctx, 2.5, 4, w, h, r); ctx.fill();
            const g = ctx.createLinearGradient(0, 0, w, h);
            g.addColorStop(0, '#3f6ad4'); g.addColorStop(0.5, '#2a4ba8'); g.addColorStop(1, '#16295e');
            ctx.fillStyle = g;
            this._roundRect(ctx, 0, 0, w, h, r); ctx.fill();
            ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(180,205,255,.5)';
            ctx.lineWidth = 1.5;
            this._roundRect(ctx, 0, 0, w, h, r); ctx.stroke();
        }
    }

    _roundRect(ctx, x, y, w, h, r) {
        r = Math.min(r, w/2, h/2);
        ctx.beginPath();
        ctx.moveTo(x+r, y);
        ctx.lineTo(x+w-r, y);
        ctx.quadraticCurveTo(x+w, y, x+w, y+r);
        ctx.lineTo(x+w, y+h-r);
        ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
        ctx.lineTo(x+r, y+h);
        ctx.quadraticCurveTo(x, y+h, x, y+h-r);
        ctx.lineTo(x, y+r);
        ctx.quadraticCurveTo(x, y, x+r, y);
        ctx.closePath();
    }
}

/* ═══════════════ 牌型分析 ═══════════════ */
function getRankCounts(cards) {
    const c = {};
    for (const card of cards) c[card.rank] = (c[card.rank] || 0) + 1;
    return c;
}

function analyzeHand(cards) {
    if (!cards || !cards.length) return null;
    const n = cards.length;
    const counts = getRankCounts(cards);
    const ranks = Object.keys(counts).map(Number).sort((a, b) => a - b);
    const vals = ranks.map(r => counts[r]).sort((a, b) => a - b);

    if (n === 2 && counts[16] === 1 && counts[17] === 1) return { type:'rocket', mainRank:100, length:1 };
    if (n === 4 && ranks.length === 1) return { type:'bomb', mainRank:ranks[0], length:1 };
    if (n === 1) return { type:'single', mainRank:ranks[0], length:1 };
    if (n === 2 && ranks.length === 1) return { type:'pair', mainRank:ranks[0], length:1 };
    if (n === 3 && ranks.length === 1) return { type:'triple', mainRank:ranks[0], length:1 };
    if (n === 4 && vals.length === 2 && vals[0] === 1 && vals[1] === 3)
        return { type:'triple_one', mainRank:ranks.find(r => counts[r] === 3), length:1 };
    if (n === 5 && vals.length === 2 && vals[0] === 2 && vals[1] === 3)
        return { type:'triple_two', mainRank:ranks.find(r => counts[r] === 3), length:1 };
    if (n === 6 && vals.length === 3 && vals[0] === 1 && vals[1] === 1 && vals[2] === 4)
        return { type:'quad_two', mainRank:ranks.find(r => counts[r] === 4), length:1 };
    if (n === 8 && vals.length === 3 && vals[0] === 2 && vals[1] === 2 && vals[2] === 4)
        return { type:'quad_two_pair', mainRank:ranks.find(r => counts[r] === 4), length:1 };

    if (n >= 5 && ranks.length === n && ranks[n-1] <= 14 && ranks[n-1] - ranks[0] === n - 1)
        return { type:'straight', mainRank:ranks[n-1], length:n };
    if (n >= 6 && n % 2 === 0 && ranks.length === n/2 &&
        ranks.every(r => counts[r] === 2) && ranks[ranks.length-1] <= 14 &&
        ranks[ranks.length-1] - ranks[0] === ranks.length - 1)
        return { type:'straight_pair', mainRank:ranks[ranks.length-1], length:ranks.length };

    const tripleRanks = ranks.filter(r => counts[r] >= 3 && r <= 14);
    const maxLen = Math.min(6, Math.floor(tripleRanks.length));
    for (let len = maxLen; len >= 2; len--) {
        for (let s = 0; s + len <= tripleRanks.length; s++) {
            const seq = tripleRanks.slice(s, s + len);
            if (seq[seq.length-1] - seq[0] !== len - 1) continue;
            if (!seq.every(r => counts[r] >= 3)) continue;
            const tripCount = len * 3;
            const rem = n - tripCount;
            const wing = {};
            for (const r of ranks) wing[r] = counts[r];
            for (const r of seq) wing[r] -= 3;
            const wingRanks = Object.keys(wing).map(Number).filter(r => wing[r] > 0);
            const wingTotal = wingRanks.reduce((a, r) => a + wing[r], 0);
            if (rem === 0 && seq.every(r => counts[r] === 3))
                return { type:'plane', mainRank:seq[seq.length-1], length:len };
            if (rem === len && wingTotal === len)
                return { type:'plane_single', mainRank:seq[seq.length-1], length:len };
            if (rem === len*2 && wingRanks.length === len && wingRanks.every(r => wing[r] === 2))
                return { type:'plane_pair', mainRank:seq[seq.length-1], length:len };
        }
    }
    return null;
}

function canBeat(newT, lastT) {
    if (!newT) return false;
    if (!lastT) return true;
    if (newT.type === 'rocket') return true;
    if (lastT.type === 'rocket') return false;
    if (newT.type === 'bomb') {
        if (lastT.type !== 'bomb') return true;
        return newT.mainRank > lastT.mainRank;
    }
    if (lastT.type === 'bomb') return false;
    if (newT.type === lastT.type && newT.length === lastT.length)
        return newT.mainRank > lastT.mainRank;
    return false;
}

/* ═══════════════ AI ═══════════════ */
class AIPlayer {
    constructor(playerId, difficulty = 'normal') {
        this.playerId = playerId;
        this.difficulty = difficulty;
        this.hand = [];
        this.isLandlord = false;
    }
    findPlay(game) {
        if (!this.hand.length) return null;
        const last = game.lastPlayInfo;
        const whole = analyzeHand(this.hand);
        if (whole && canBeat(whole, last)) return [...this.hand];
        if (!last) return this._leadPlay(game);
        if (this._isTeammate(game, game.lastPlayedBy)) {
            if (this.hand.length <= 2) {
                const trySame = this._followPlay(game, last);
                if (trySame && trySame.length === this.hand.length) return trySame;
            }
            return null;
        }
        return this._followPlay(game, last);
    }
    _isTeammate(game, pid) {
        if (pid === -1 || pid === this.playerId) return false;
        if (this.isLandlord) return false;
        return pid !== game.landlordId;
    }
    _getEnemies(game) {
        if (this.isLandlord) return [0, 1, 2].filter(p => p !== this.playerId && !game.deadPlayers[p]);
        return [game.landlordId].filter(p => p >= 0 && !game.deadPlayers[p]);
    }
    _leadPlay(game) {
        const hand = this.hand;
        const n = hand.length;
        if (n === 1) return [...hand];
        if (this.difficulty === 'easy') {
            const sorted = [...hand].sort((a, b) => a.rank - b.rank);
            return [sorted[0]];
        }
        const counts = getRankCounts(hand);
        const byRank = {};
        for (const c of hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        const ranksAsc = Object.keys(byRank).map(Number).sort((a, b) => a - b);
        const st = this._findLongestStraight();
        if (st && st.length >= 5) return st;
        if (this.difficulty === 'hard') {
            const tri = ranksAsc.filter(r => counts[r] === 3);
            if (tri.length && n <= 8) {
                const r = tri[0];
                const tr = byRank[r].slice(0, 3);
                const rem = hand.filter(c => !tr.includes(c));
                if (rem.length === 1) return [...tr, rem[0]];
                if (rem.length === 2 && rem[0].rank === rem[1].rank) return [...tr, ...rem];
            }
        }
        const singles = ranksAsc.filter(r => counts[r] === 1);
        if (singles.length) return [byRank[singles[0]][0]];
        const pairs = ranksAsc.filter(r => counts[r] === 2 && r <= 15);
        if (pairs.length) return byRank[pairs[0]].slice(0, 2);
        const triples = ranksAsc.filter(r => counts[r] === 3);
        if (triples.length) return byRank[triples[0]].slice(0, 3);
        return [byRank[ranksAsc[0]][0]];
    }
    _followPlay(game, last) {
        const enemies = this._getEnemies(game);
        const enemyMin = enemies.length ? Math.min(...enemies.map(p => game.playersHand[p].length)) : 99;
        const desperate = enemyMin <= 2;
        const same = this._findBeatingSame(last);
        if (same) {
            const info = analyzeHand(same);
            if (info && info.type === 'bomb' && last.type !== 'bomb' && last.type !== 'rocket') {
                if (this.difficulty === 'easy') {
                    if (this.hand.length > 3) return null;
                    return Math.random() < 0.25 ? same : null;
                }
                if (!desperate && this.hand.length > 5) return null;
            }
            return same;
        }
        const bomb = this._findSmallestBomb();
        if (bomb) {
            const bInfo = analyzeHand(bomb);
            if (canBeat(bInfo, last)) {
                if (desperate) return bomb;
                if (last.type === 'bomb') return bomb;
                if (this.hand.length <= 5) return bomb;
                if (this.difficulty === 'hard' && this.hand.length <= 8) return bomb;
                if (this.difficulty === 'normal' && Math.random() < 0.3) return bomb;
                if (this.difficulty === 'easy' && Math.random() < 0.12) return bomb;
            }
        }
        if (desperate || this.difficulty === 'hard') {
            const rocket = this._findRocket();
            if (rocket) {
                const rInfo = analyzeHand(rocket);
                if (canBeat(rInfo, last)) {
                    if (desperate || Math.random() < 0.4) return rocket;
                }
            }
        }
        return null;
    }
    _findBeatingSame(info) {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        const sRanks = Object.keys(byRank).map(Number).sort((a, b) => a - b);
        const lt = info.type, lr = info.mainRank, ll = info.length;
        const cost = n => (n === 1 ? 0 : n === 2 ? 1 : n === 3 ? 2 : 20);

        if (lt === 'single') {
            const cands = sRanks.filter(r => r > lr);
            if (!cands.length) return null;
            cands.sort((a, b) => cost(byRank[a].length) - cost(byRank[b].length) || a - b);
            return [byRank[cands[0]][0]];
        }
        if (lt === 'pair') {
            const cands = sRanks.filter(r => r > lr && byRank[r].length >= 2);
            if (!cands.length) return null;
            cands.sort((a, b) => cost(byRank[a].length) - cost(byRank[b].length) || a - b);
            return byRank[cands[0]].slice(0, 2);
        }
        if (lt === 'triple') {
            const cands = sRanks.filter(r => r > lr && byRank[r].length >= 3);
            if (!cands.length) return null;
            cands.sort((a, b) => cost(byRank[a].length) - cost(byRank[b].length) || a - b);
            return byRank[cands[0]].slice(0, 3);
        }
        if (lt === 'triple_one' || lt === 'triple_two') {
            const need = lt === 'triple_one' ? 1 : 2;
            for (const r of sRanks) {
                if (r <= lr || byRank[r].length < 3) continue;
                const tr = byRank[r].slice(0, 3);
                const rem = this.hand.filter(c => !tr.includes(c));
                if (need === 1) {
                    if (rem.length >= 1) {
                        const rc = getRankCounts(rem);
                        const wr = Object.keys(rc).map(Number).sort((a, b) => rc[a] - rc[b] || a - b);
                        return [...tr, rem.find(c => c.rank === wr[0])];
                    }
                } else {
                    const rc = getRankCounts(rem);
                    const pr = Object.keys(rc).map(Number).filter(x => rc[x] >= 2)
                        .sort((a, b) => rc[a] - rc[b] || a - b);
                    if (pr.length) {
                        const pc = rem.filter(c => c.rank === pr[0]).slice(0, 2);
                        return [...tr, ...pc];
                    }
                }
            }
            return null;
        }
        if (lt === 'straight') return this._findBeatingStraight(lr, ll);
        if (lt === 'straight_pair') return this._findBeatingStraightPair(lr, ll);
        if (lt === 'plane' || lt === 'plane_single' || lt === 'plane_pair')
            return this._findBeatingPlane(lt, lr, ll);
        if (lt === 'quad_two' || lt === 'quad_two_pair') {
            for (const r of sRanks) {
                if (r <= lr || byRank[r].length < 4) continue;
                const qd = byRank[r].slice(0, 4);
                const rem = this.hand.filter(c => !qd.includes(c));
                if (lt === 'quad_two') {
                    if (rem.length >= 2) {
                        const sorted = [...rem].sort((a, b) => a.rank - b.rank);
                        return [...qd, sorted[0], sorted[1]];
                    }
                } else {
                    const rc = getRankCounts(rem);
                    const pr = Object.keys(rc).map(Number).filter(x => rc[x] >= 2);
                    if (pr.length >= 2) {
                        const w = [];
                        for (const x of pr.slice(0, 2)) w.push(...rem.filter(c => c.rank === x).slice(0, 2));
                        return [...qd, ...w];
                    }
                }
            }
            return null;
        }
        return null;
    }
    _findBeatingStraight(lr, ll) {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        for (let sr = 3; sr + ll - 1 <= 14; sr++) {
            const er = sr + ll - 1;
            if (er <= lr) continue;
            let ok = true;
            for (let r = sr; r <= er; r++) if (!byRank[r] || !byRank[r].length) { ok = false; break; }
            if (!ok) continue;
            const res = [];
            for (let r = sr; r <= er; r++) res.push(byRank[r][0]);
            return res;
        }
        return null;
    }
    _findBeatingStraightPair(lr, ll) {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        for (let sr = 3; sr + ll - 1 <= 14; sr++) {
            const er = sr + ll - 1;
            if (er <= lr) continue;
            let ok = true;
            for (let r = sr; r <= er; r++) if (!byRank[r] || byRank[r].length < 2) { ok = false; break; }
            if (!ok) continue;
            const res = [];
            for (let r = sr; r <= er; r++) res.push(...byRank[r].slice(0, 2));
            return res;
        }
        return null;
    }
    _findBeatingPlane(lt, lr, ll) {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        const trs = Object.keys(byRank).map(Number).filter(r => byRank[r].length >= 3 && r <= 14).sort((a, b) => a - b);
        for (let s = 0; s + ll <= trs.length; s++) {
            const seq = trs.slice(s, s + ll);
            if (seq[seq.length-1] - seq[0] !== ll - 1) continue;
            if (seq[seq.length-1] <= lr) continue;
            const tripCards = [];
            for (const r of seq) tripCards.push(...byRank[r].slice(0, 3));
            const rem = this.hand.filter(c => !tripCards.includes(c));
            if (lt === 'plane') return tripCards;
            if (lt === 'plane_single') {
                if (rem.length >= ll) {
                    const sorted = [...rem].sort((a, b) => a.rank - b.rank);
                    return [...tripCards, ...sorted.slice(0, ll)];
                }
            }
            if (lt === 'plane_pair') {
                const rc = getRankCounts(rem);
                const prs = Object.keys(rc).map(Number).filter(r => rc[r] >= 2);
                if (prs.length >= ll) {
                    const w = [];
                    for (const r of prs.slice(0, ll)) w.push(...rem.filter(c => c.rank === r).slice(0, 2));
                    return [...tripCards, ...w];
                }
            }
        }
        return null;
    }
    _findSmallestBomb() {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        const bombs = Object.entries(byRank).filter(([, cs]) => cs.length >= 4)
            .map(([r, cs]) => [Number(r), cs]).sort((a, b) => a[0] - b[0]);
        return bombs.length ? bombs[0][1].slice(0, 4) : null;
    }
    _findRocket() {
        const hasS = this.hand.some(c => c.rank === 16);
        const hasB = this.hand.some(c => c.rank === 17);
        if (hasS && hasB) return this.hand.filter(c => c.rank === 16 || c.rank === 17);
        return null;
    }
    _findLongestStraight() {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        let best = null;
        for (let sr = 3; sr <= 10; sr++) {
            const cur = [];
            for (let r = sr; r <= 14; r++) {
                if (byRank[r] && byRank[r].length) cur.push(r);
                else break;
            }
            if (cur.length >= 5 && (!best || cur.length > best.length)) best = cur;
        }
        if (!best) return null;
        const counts = getRankCounts(this.hand);
        if (best.some(r => counts[r] >= 4)) return null;
        return best.map(r => byRank[r][0]);
    }
}

/* ═══════════════ Game ═══════════════ */
class Game {
    constructor() {
        this.lang = 'zh'; window._lang = 'zh';
        this.difficulty = 'normal';
        this.settingsOpen = false;
        this.state = 'idle';
        this.playersHand = [[], [], []];
        this.landlordCards = [];
        this.landlordId = -1;
        this.currentPlayer = -1;
        this.tableCards  = [[], [], []];
        this.tablePassed = [false, false, false];
        this.lastPlayedCards = [];
        this.lastPlayedBy = -1;
        this.lastPlayInfo = null;
        this.passCount = 0;
        this.callScores = [0, 0, 0];
        this.callStartPlayer = 0;
        this.callCurrent = 0;
        this.calledSet = new Set();
        this.grabPhase = false;
        this.grabScores = [0, 0, 0];
        this.grabCurrent = 0;
        this.grabStart = 0;
        this.grabbedSet = new Set();
        this.winner = -1;
        this.message = '';
        this.messageTimer = 0;
        this.thinkingPid = -1;
        this.gunUsed = false;
        this.aiming = false;
        this.deadPlayers = [false, false, false];
        this.shotEffects = [];
        this.camera = new Camera();
        this.keys = {};
        this.mouseDrag = false;
        this.lastMouseX = 0;
        this.lastMouseY = 0;
        this.cameraRadius = 620;
        this.cameraAngle = 0;
        this.cameraHeight = 340;
        this.peekingAI = -1;
        this.aiPlayers = [null, new AIPlayer(1, this.difficulty), new AIPlayer(2, this.difficulty)];
        this.aiTimer = null;
        this._mouseX = -999; this._mouseY = -999;
        this._playBtnRect = null; this._passBtnRect = null;
        this._callBtnRect = null; this._noCallBtnRect = null;
        this._grabBtnRect = null; this._noGrabBtnRect = null;
        this._startBtnRect = null;
        this._gunBtnRect = null;
        this._tick = 0;
        this.initNewGame();
    }
    t(key) { return (TEXTS[this.lang] || TEXTS.zh)[key] || key; }
    _aiDelay() {
        const base = this.difficulty === 'easy' ? 1050 : this.difficulty === 'normal' ? 880 : 700;
        return base + Math.random() * 850;
    }

    initNewGame() {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        this.thinkingPid = -1;

        const deck = [];
        for (const s of [SUIT_SPADE, SUIT_HEART, SUIT_CLUB, SUIT_DIAMOND])
            for (let r = 3; r <= 15; r++) deck.push(new Card(s, r));
        deck.push(new Card(SUIT_JOKER, 16), new Card(SUIT_JOKER, 17));
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        this.playersHand = [deck.slice(0, 17), deck.slice(17, 34), deck.slice(34, 51)];
        this.landlordCards = deck.slice(51, 54);

        this.aiPlayers = [null, new AIPlayer(1, this.difficulty), new AIPlayer(2, this.difficulty)];
        this.aiPlayers[1].hand = [...this.playersHand[1]];
        this.aiPlayers[2].hand = [...this.playersHand[2]];
        for (const c of this.playersHand[0]) c.faceUp = true;
        for (const c of this.playersHand[1]) c.faceUp = false;
        for (const c of this.playersHand[2]) c.faceUp = false;
        for (const c of this.landlordCards) c.faceUp = false;

        this.state = 'idle';
        this.landlordId = -1;
        this.currentPlayer = -1;
        this.lastPlayedCards = [];
        this.lastPlayedBy = -1;
        this.lastPlayInfo = null;
        this.passCount = 0;
        this.callScores = [0, 0, 0];
        this.calledSet = new Set();
        this.grabPhase = false;
        this.grabScores = [0, 0, 0];
        this.grabbedSet = new Set();
        this.winner = -1;
        this.message = this.t('dealing');
        this.messageTimer = 90;
        this.tableCards = [[], [], []];
        this.tablePassed = [false, false, false];
        this.gunUsed = false;
        this.aiming = false;
        this.deadPlayers = [false, false, false];
        this.shotEffects = [];

        for (let i = 0; i < 3; i++)
            this.playersHand[i].sort((a, b) => a.rank - b.rank || a.suit - b.suit);
        this.landlordCards.sort((a, b) => a.rank - b.rank || a.suit - b.suit);

        /* 摄像机初始复位到玩家座位后方 */
        this.cameraRadius = 620;
        this.cameraAngle = 0;
        this.cameraHeight = 340;
        this._updateCameraFromSpherical();

        this._layoutHUDCards();

        this.aiTimer = setTimeout(() => {
            this.aiTimer = null;
            if (this.state === 'idle') this.startCallingPhase();
        }, 1200);
    }

    _updateCameraFromSpherical() {
        this.camera.x = this.cameraRadius * Math.sin(this.cameraAngle);
        this.camera.z = -this.cameraRadius * Math.cos(this.cameraAngle);
        this.camera.y = this.cameraHeight;
        this.camera.lookAt(0, 40, 0);
    }

    _layoutHUDCards() {
        const hand0 = this.playersHand[0];
        const n0 = hand0.length;
        if (!n0) return;
        const maxW = CANVAS_WIDTH - 240;
        let sp0 = 46;
        if (n0 > 1 && (n0 - 1) * sp0 + CARD_WIDTH > maxW) sp0 = (maxW - CARD_WIDTH) / (n0 - 1);
        if (n0 > 1 && sp0 < 18) sp0 = (maxW - CARD_WIDTH) / (n0 - 1);
        const totalW0 = n0 > 1 ? (n0 - 1) * sp0 + CARD_WIDTH : CARD_WIDTH;
        const startX0 = (CANVAS_WIDTH - totalW0) / 2;
        const baseY0 = CANVAS_HEIGHT - 130;
        const maxA = n0 > 1 ? Math.min(0.11, n0 * 0.007) : 0;
        for (let i = 0; i < n0; i++) {
            const t = n0 > 1 ? (i - (n0 - 1) / 2) / ((n0 - 1) / 2) : 0;
            hand0[i].setTarget(startX0 + i * sp0, baseY0 + Math.abs(t) * 12, t * maxA, 1);
        }
    }

    /* ── 叫地主 ── */
    startCallingPhase() {
        this.state = 'calling';
        this.callScores = [0, 0, 0];
        this.calledSet = new Set();
        const alive = [0, 1, 2].filter(p => !this.deadPlayers[p]);
        if (!alive.length) return;
        this.callStartPlayer = alive[Math.floor(Math.random() * alive.length)];
        this.callCurrent = this.callStartPlayer;
        this.grabPhase = false;
        this.message = ''; this.messageTimer = 0;
        this._processCurrentCaller();
    }
    _processCurrentCaller() {
        if (this.state !== 'calling') return;
        if (this.deadPlayers[this.callCurrent]) { this._advanceCalling(); return; }
        this.currentPlayer = this.callCurrent;
        if (this.callCurrent === 0) { this.message = ''; }
        else this._aiCallLandlord(this.callCurrent);
    }
    _aiCallLandlord(pid) {
        const ai = this.aiPlayers[pid];
        const score = this._evaluateHandStrength(ai.hand);
        const th = this.difficulty === 'easy' ? 42 : this.difficulty === 'normal' ? 32 : 22;
        const noOneYet = this.callScores.every(s => s === 0);
        if (score > th || (noOneYet && score > 16)) {
            let cs = 1;
            if (this.difficulty === 'hard' && score > 62) cs = Math.min(3, 1 + Math.floor(score / 30));
            else if (this.difficulty === 'normal' && score > 52) cs = 2;
            this.callScores[pid] = cs;
            this.message = `AI ${pid} · ${this.t('call_landlord')} ${cs}`;
        } else {
            this.callScores[pid] = 0;
            this.message = `AI ${pid} · ${this.t('no_call')}`;
        }
        this.messageTimer = 60;
        this.aiTimer = setTimeout(() => this._advanceCalling(), 720 + Math.random() * 400);
    }
    _evaluateHandStrength(hand) {
        if (!hand || !hand.length) return 0;
        const counts = getRankCounts(hand);
        let score = 0;
        const bombs = Object.values(counts).filter(c => c >= 4).length;
        score += bombs * 16;
        if (counts[16] && counts[17]) score += 26;
        else if (counts[16] || counts[17]) score += 9;
        for (const r of [15, 14, 13, 12]) if (counts[r]) score += counts[r] * 3;
        const ranks = [...new Set(hand.map(c => c.rank).filter(r => r <= 14))].sort((a, b) => a - b);
        let consec = 0, maxC = 0;
        for (let i = 0; i < ranks.length - 1; i++) {
            if (ranks[i+1] - ranks[i] === 1) { consec++; maxC = Math.max(maxC, consec); }
            else consec = 0;
        }
        score += maxC * 5;
        score += Object.values(counts).filter(c => c >= 3).length * 8;
        score += Object.values(counts).filter(c => c >= 2).length * 2;
        return Math.min(100, score);
    }
    _advanceCalling() {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.calledSet) this.calledSet.add(this.callCurrent);
        let next = this.callCurrent;
        let found = false;
        for (let i = 0; i < 3; i++) {
            next = (next + 1) % 3;
            if (!this.deadPlayers[next] && !this.calledSet.has(next)) { found = true; break; }
        }
        if (!found) this._resolveCalling();
        else { this.callCurrent = next; this._processCurrentCaller(); }
    }
    _resolveCalling() {
        const maxS = Math.max(...this.callScores);
        if (maxS === 0) {
            this.message = this.t('no_one_call');
            this.messageTimer = 90;
            this.aiTimer = setTimeout(() => { this.initNewGame(); }, 1500);
            return;
        }
        const cands = [];
        for (let i = 0; i < 3; i++) {
            if (this.deadPlayers[i]) continue;
            if (this.callScores[i] === maxS) cands.push(i);
        }
        if (!cands.length) {
            this.message = this.t('no_one_call');
            this.messageTimer = 90;
            this.aiTimer = setTimeout(() => { this.initNewGame(); }, 1500);
            return;
        }
        if (cands.length === 1) this._setLandlord(cands[0]);
        else this._startGrabPhase(cands);
    }
    _startGrabPhase(cands) {
        this.state = 'grabbing';
        this.grabPhase = true;
        this.grabScores = [0, 0, 0];
        this.grabbedSet = new Set();
        let start = (cands[0] + 1) % 3;
        let found = false;
        for (let i = 0; i < 3; i++) {
            if (!this.deadPlayers[start]) { found = true; break; }
            start = (start + 1) % 3;
        }
        if (!found) { this._resolveGrabbing(); return; }
        this.grabStart = start;
        this.grabCurrent = start;
        this._processGrabber();
    }
    _processGrabber() {
        if (this.state !== 'grabbing') return;
        if (this.deadPlayers[this.grabCurrent]) { this._advanceGrabbing(); return; }
        if (this.grabCurrent === 0) { this.currentPlayer = 0; this.message = ''; }
        else this._aiGrabLandlord(this.grabCurrent);
    }
    _aiGrabLandlord(pid) {
        const ai = this.aiPlayers[pid];
        const score = this._evaluateHandStrength(ai.hand);
        const th = this.difficulty === 'easy' ? 52 : this.difficulty === 'normal' ? 42 : 32;
        if (score > th) {
            this.grabScores[pid] = (this.callScores[pid] || 1) + 1;
            this.message = `AI ${pid} · ${this.t('grab_landlord')}!`;
        } else {
            this.grabScores[pid] = 0;
            this.message = `AI ${pid} · ${this.t('no_grab')}`;
        }
        this.messageTimer = 60;
        this.aiTimer = setTimeout(() => this._advanceGrabbing(), 720 + Math.random() * 400);
    }
    _advanceGrabbing() {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.grabbedSet) this.grabbedSet.add(this.grabCurrent);
        let next = this.grabCurrent;
        let found = false;
        for (let i = 0; i < 3; i++) {
            next = (next + 1) % 3;
            if (!this.deadPlayers[next] && !this.grabbedSet.has(next)) { found = true; break; }
        }
        if (!found) this._resolveGrabbing();
        else { this.grabCurrent = next; this._processGrabber(); }
    }
    _resolveGrabbing() {
        const all = [];
        for (let i = 0; i < 3; i++) {
            if (this.deadPlayers[i]) continue;
            if (this.grabScores[i] > 0) all.push([i, this.grabScores[i]]);
            else if (this.callScores[i] > 0) all.push([i, this.callScores[i]]);
        }
        if (!all.length) {
            this.message = this.t('no_one_grab');
            this.messageTimer = 90;
            this.aiTimer = setTimeout(() => { this.initNewGame(); }, 1500);
            return;
        }
        all.sort((a, b) => b[1] - a[1]);
        this._setLandlord(all[0][0]);
    }
    _setLandlord(pid) {
        this.landlordId = pid;
        this.aiPlayers[1].isLandlord = (pid === 1);
        this.aiPlayers[2].isLandlord = (pid === 2);
        for (const c of this.landlordCards) { c.faceUp = true; this.playersHand[pid].push(c); }
        if (pid !== 0) this.aiPlayers[pid].hand = [...this.playersHand[pid]];
        this.playersHand[pid].sort((a, b) => a.rank - b.rank || a.suit - b.suit);
        if (pid !== 0) this.aiPlayers[pid].hand.sort((a, b) => a.rank - b.rank || a.suit - b.suit);
        this._clearTable();
        this._layoutHUDCards();
        this.state = 'playing';
        this.currentPlayer = pid;
        this.lastPlayedCards = [];
        this.lastPlayedBy = -1;
        this.lastPlayInfo = null;
        this.passCount = 0;
        this.message = `${pid === 0 ? this.t('you') : 'AI ' + pid} · ${this.t('landlord')}`;
        this.messageTimer = 80;
        if (pid !== 0) this._scheduleAI(pid, 1200);
    }
    _clearTable() {
        for (let i = 0; i < 3; i++) { this.tableCards[i] = []; this.tablePassed[i] = false; }
    }
    _scheduleAI(pid, extra = 0) {
        if (this.state !== 'playing') return;
        if (pid === 0 || this.deadPlayers[pid]) return;
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        this.thinkingPid = pid;
        this.aiTimer = setTimeout(() => {
            this.aiTimer = null;
            this.thinkingPid = -1;
            this._aiTurnIfNeeded();
        }, this._aiDelay() + extra);
    }
    _aiTurnIfNeeded() {
        if (this.state === 'playing' && this.currentPlayer !== 0 && !this.deadPlayers[this.currentPlayer])
            this._aiTurn(this.currentPlayer);
    }
    _aiTurn(pid) {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.state !== 'playing') return;
        if (this.deadPlayers[pid]) {
            this.currentPlayer = this._getNextPlayer(pid);
            this._scheduleAI(this.currentPlayer, 300);
            return;
        }
        this.currentPlayer = pid;
        const ai = this.aiPlayers[pid];
        if (!ai || !this.playersHand[pid].length) { this._aiPass(pid); return; }
        let cards = null;
        try { cards = ai.findPlay(this); } catch (e) { cards = null; }
        if (cards && cards.length) {
            const info = analyzeHand(cards);
            if (info && canBeat(info, this.lastPlayInfo)) {
                this._commitPlay(pid, cards, info);
                return;
            }
        }
        this._aiPass(pid);
    }
    _commitPlay(pid, cards, info) {
        const ai = this.aiPlayers[pid];
        for (const c of cards) {
            if (ai) { const i1 = ai.hand.indexOf(c); if (i1 >= 0) ai.hand.splice(i1, 1); }
            const i2 = this.playersHand[pid].indexOf(c);
            if (i2 >= 0) this.playersHand[pid].splice(i2, 1);
            c.faceUp = true; c.selected = false;
        }
        this.lastPlayedCards = cards;
        this.lastPlayedBy = pid;
        this.lastPlayInfo = info;
        this.passCount = 0;
        this.tableCards[pid] = cards;
        this.tablePassed[pid] = false;
        this.message = `AI ${pid} · ${this.t('ai_play')}`;
        this.messageTimer = 45;
        if (this.playersHand[pid].length === 0) { this._gameOver(pid); return; }
        this.currentPlayer = this._getNextPlayer(pid);
        this._scheduleAI(this.currentPlayer, 300);
    }
    _aiPass(pid) {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.state !== 'playing') return;
        this.thinkingPid = -1;
        if (!this.lastPlayInfo) {
            const ai = this.aiPlayers[pid];
            if (ai && ai.hand.length) {
                const sorted = [...ai.hand].sort((a, b) => a.rank - b.rank);
                const card = sorted[0];
                const info = analyzeHand([card]);
                if (info) { this._commitPlay(pid, [card], info); return; }
            }
        }
        this.passCount++;
        this.tableCards[pid] = [];
        this.tablePassed[pid] = true;
        this.message = `AI ${pid} · ${this.t('ai_pass')}`;
        this.messageTimer = 45;
        if (this.passCount >= 2) {
            this.lastPlayedCards = [];
            this.lastPlayedBy = -1;
            this.lastPlayInfo = null;
            this.passCount = 0;
            this._clearTable();
            this.currentPlayer = this._getNextPlayer(this.currentPlayer);
            if (this.currentPlayer === 0) {
                this.message = this.t('new_round');
                this.messageTimer = 70;
            } else this._scheduleAI(this.currentPlayer, 400);
        } else {
            this.currentPlayer = this._getNextPlayer(pid);
            this._scheduleAI(this.currentPlayer, 350);
        }
    }
    _getNextPlayer(pid) {
        let next = pid;
        for (let i = 0; i < 3; i++) {
            next = (next + 1) % 3;
            if (!this.deadPlayers[next]) return next;
        }
        return pid;
    }
    playerPlayCards(selected) {
        if (this.currentPlayer !== 0 || this.state !== 'playing') return false;
        const info = analyzeHand(selected);
        if (!info) { this.message = this.t('invalid_play'); this.messageTimer = 55; return false; }
        if (!canBeat(info, this.lastPlayInfo)) { this.message = this.t('cant_beat'); this.messageTimer = 55; return false; }
        for (const c of selected) {
            const idx = this.playersHand[0].indexOf(c);
            if (idx >= 0) this.playersHand[0].splice(idx, 1);
        }
        this.lastPlayedCards = selected;
        this.lastPlayedBy = 0;
        this.lastPlayInfo = info;
        this.passCount = 0;
        for (const c of this.playersHand[0]) c.selected = false;
        this.tableCards[0] = selected;
        this.tablePassed[0] = false;
        this._layoutHUDCards();
        this.message = ''; this.messageTimer = 0;
        if (this.playersHand[0].length === 0) { this._gameOver(0); return true; }
        this.currentPlayer = this._getNextPlayer(0);
        this._scheduleAI(this.currentPlayer, 350);
        return true;
    }
    playerPass() {
        if (this.currentPlayer !== 0 || this.state !== 'playing') return;
        if (!this.lastPlayInfo) { this.message = this.t('must_play'); this.messageTimer = 55; return; }
        this.passCount++;
        this.tableCards[0] = [];
        this.tablePassed[0] = true;
        this.message = this.t('pass'); this.messageTimer = 40;
        if (this.passCount >= 2) {
            this.lastPlayedCards = [];
            this.lastPlayedBy = -1;
            this.lastPlayInfo = null;
            this.passCount = 0;
            this._clearTable();
            this.currentPlayer = this._getNextPlayer(this.currentPlayer);
            if (this.currentPlayer !== 0) this._scheduleAI(this.currentPlayer, 400);
            else { this.message = this.t('new_round'); this.messageTimer = 70; }
        } else {
            this.currentPlayer = this._getNextPlayer(0);
            this._scheduleAI(this.currentPlayer, 350);
        }
    }
    _shootPlayer(pid) {
        if (this.gunUsed || pid === 0 || pid === -1 || this.deadPlayers[pid]) return false;
        if (this.state === 'ended') return false;
        this.gunUsed = true;
        this.aiming = false;
        this.deadPlayers[pid] = true;
        this.callScores[pid] = 0;
        this.grabScores[pid] = 0;
        this.tableCards[pid] = [];
        this.tablePassed[pid] = false;
        const seat = pid === 1 ? SEAT_AI1 : SEAT_AI2;
        this.shotEffects.push({ x: seat.x, y: 100, z: seat.z, t: 65, maxT: 65 });
        if (this.landlordId === pid) {
            this.message = this.t('shot_kill_landlord');
            this.messageTimer = 160;
        } else {
            this.message = this.t('shot_ok');
            this.messageTimer = 90;
        }
        const wasActive =
            (this.state === 'calling'  && this.callCurrent === pid) ||
            (this.state === 'grabbing' && this.grabCurrent === pid) ||
            (this.state === 'playing'  && (this.currentPlayer === pid || this.thinkingPid === pid));
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        this.thinkingPid = -1;
        if (wasActive) {
            if (this.state === 'calling') this._advanceCalling();
            else if (this.state === 'grabbing') this._advanceGrabbing();
            else if (this.state === 'playing') {
                if (this.playersHand[pid].length === 0) { this._gameOver(pid); return true; }
                this.currentPlayer = this._getNextPlayer(pid);
                if (this.currentPlayer === 0) {
                    this.message = this.t('your_turn');
                    this.messageTimer = 80;
                } else this._scheduleAI(this.currentPlayer, 500);
            }
        }
        return true;
    }
    _gameOver(wid) {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        this.thinkingPid = -1;
        this.state = 'ended';
        this.winner = wid;
        const winnerIsLandlord = (wid === this.landlordId);
        let humanWin;
        if (this.landlordId === 0) humanWin = winnerIsLandlord;
        else humanWin = !winnerIsLandlord;
        this.message = humanWin ? this.t('you_win') : this.t('you_lose');
        this.messageTimer = 9999;
        for (const h of this.playersHand) for (const c of h) c.faceUp = true;
        for (const c of this.landlordCards) c.faceUp = true;
    }

    /* ── 更新 ── */
    update() {
        this._tick++;
        for (const c of this.playersHand[0]) c.updatePosition();
        if (!this.settingsOpen) this._handleMovement();
        this._checkPeeking();
        for (let i = this.shotEffects.length - 1; i >= 0; i--) {
            this.shotEffects[i].t--;
            if (this.shotEffects[i].t <= 0) this.shotEffects.splice(i, 1);
        }
        if (this.messageTimer > 0 && this.messageTimer < 9000) this.messageTimer--;
    }
    _handleMovement() {
        const speed = 6;
        const cam = this.camera;
        const fx = Math.sin(cam.yaw), fz = Math.cos(cam.yaw);
        const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
        let mvX = 0, mvZ = 0;
        if (this.keys['w']) { mvX += fx; mvZ += fz; }
        if (this.keys['s']) { mvX -= fx; mvZ -= fz; }
        if (this.keys['a']) { mvX -= rx; mvZ -= rz; }
        if (this.keys['d']) { mvX += rx; mvZ += rz; }
        if (mvX || mvZ) {
            const len = Math.sqrt(mvX*mvX + mvZ*mvZ);
            mvX /= len; mvZ /= len;
            cam.x += mvX * speed;
            cam.z += mvZ * speed;
            const dist = Math.sqrt(cam.x*cam.x + cam.z*cam.z);
            if (dist < TABLE_RADIUS + 120) {
                const s = (TABLE_RADIUS + 120) / dist;
                cam.x *= s; cam.z *= s;
            }
            if (dist > 900) {
                const s = 900 / dist;
                cam.x *= s; cam.z *= s;
            }
        }
        if (this.keys['q']) cam.y = clamp(cam.y + speed, 120, 700);
        if (this.keys['e']) cam.y = clamp(cam.y - speed, 120, 700);
    }
    _checkPeeking() {
        const cam = this.camera;
        this.peekingAI = -1;
        const list = [
            { id: 1, seat: SEAT_AI1 },
            { id: 2, seat: SEAT_AI2 }
        ];
        for (const a of list) {
            if (this.deadPlayers[a.id]) continue;
            const vx = cam.x - a.seat.x;
            const vz = cam.z - a.seat.z;
            const dist = Math.sqrt(vx*vx + vz*vz);
            if (dist > 250) continue;
            /* AI 面向桌子中心 */
            const faceAngle = Math.atan2(0 - a.seat.x, 0 - a.seat.z);
            const afx = Math.sin(faceAngle), afz = Math.cos(faceAngle);
            const dot = (vx * afx + vz * afz) / (dist || 1);
            /* 玩家在 AI 背后（dot 为负表示反向） */
            if (dot < -0.15) { this.peekingAI = a.id; break; }
        }
    }

    /* ═══════════ 绘制 ═══════════ */
    draw(ctx) {
        this._drawSky(ctx);
        this._drawFloor(ctx);
        this._drawTable(ctx);
        /* 先画远处的：AI 手牌 */
        if (!this.deadPlayers[1]) this._drawAIHand3D(ctx, 1, SEAT_AI1.x, SEAT_AI1.z);
        if (!this.deadPlayers[2]) this._drawAIHand3D(ctx, 2, SEAT_AI2.x, SEAT_AI2.z);
        /* 人物模型 */
        this._drawCharacter(ctx, SEAT_AI1.x, SEAT_AI1.z, 1, this.deadPlayers[1], 'AI 1');
        this._drawCharacter(ctx, SEAT_AI2.x, SEAT_AI2.z, 2, this.deadPlayers[2], 'AI 2');
        /* 底牌 */
        this._drawBottomCards3D(ctx);
        /* 三家出牌区（靠近桌子中心） */
        this._drawTableZones(ctx);
        /* 特效 */
        this._drawShotEffects(ctx);
        /* HUD 层 */
        this._drawHUD(ctx);
        this._drawCrosshair(ctx);
        this._drawAimPrompt(ctx);
    }

    _drawSky(ctx) {
        const g = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
        g.addColorStop(0, '#1a3050');
        g.addColorStop(0.35, '#122340');
        g.addColorStop(0.75, '#0a1628');
        g.addColorStop(1, '#050a14');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        /* 星空 */
        for (let i = 0; i < 70; i++) {
            const px = (i * 137.508) % CANVAS_WIDTH;
            const py = (i * 219.31) % (CANVAS_HEIGHT * 0.55);
            const a = 0.08 + 0.15 * Math.abs(Math.sin((this._tick + i * 40) / 130));
            ctx.fillStyle = `rgba(170,210,255,${a})`;
            ctx.beginPath();
            ctx.arc(px, py, 1.4, 0, Math.PI * 2);
            ctx.fill();
        }

        /* 地平线光晕 */
        const hg = ctx.createRadialGradient(CANVAS_WIDTH/2, 320, 40, CANVAS_WIDTH/2, 320, 800);
        hg.addColorStop(0, 'rgba(80,130,200,.28)');
        hg.addColorStop(0.5, 'rgba(40,80,140,.12)');
        hg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = hg;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        /* 室内暖光 */
        const wg = ctx.createRadialGradient(CANVAS_WIDTH/2, CANVAS_HEIGHT*0.4, 100, CANVAS_WIDTH/2, CANVAS_HEIGHT*0.4, 700);
        wg.addColorStop(0, 'rgba(120,160,220,.15)');
        wg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = wg;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    }

    _drawFloor(ctx) {
        const cam = this.camera;
        ctx.save();
        /* 地板填色（大圆盘，用投影近似） */
        const floorP = cam.project(0, -140, 0);
        if (floorP) {
            const r = 1200 * floorP.scale;
            const fg = ctx.createRadialGradient(floorP.x, floorP.y, r*0.1, floorP.x, floorP.y, r);
            fg.addColorStop(0, '#1a2a44');
            fg.addColorStop(0.5, '#0f1a2c');
            fg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.arc(floorP.x, floorP.y, r, 0, Math.PI*2);
            ctx.fill();
        }

        /* 同心圆 */
        const rings = [340, 480, 640, 820, 1020];
        for (const r of rings) {
            const segs = 48;
            ctx.strokeStyle = 'rgba(90,140,220,.16)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            let started = false;
            for (let i = 0; i <= segs; i++) {
                const a = (i / segs) * Math.PI * 2;
                const p = cam.project(r * Math.cos(a), -60, r * Math.sin(a));
                if (!p) { started = false; continue; }
                if (!started) { ctx.moveTo(p.x, p.y); started = true; }
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
        }

        /* 径向线 */
        for (let i = 0; i < 24; i++) {
            const a = (i / 24) * Math.PI * 2;
            const p1 = cam.project(340 * Math.cos(a), -60, 340 * Math.sin(a));
            const p2 = cam.project(1100 * Math.cos(a), -60, 1100 * Math.sin(a));
            if (!p1 || !p2) continue;
            ctx.strokeStyle = 'rgba(90,140,220,.10)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }

        ctx.restore();
    }

    _drawTable(ctx) {
        const cam = this.camera;
        const segs = 56;

        /* 桌腿（三层圆环） */
        const drawRing = (topY, botY, rTop, rBot, fill) => {
            for (let i = 0; i < segs; i++) {
                const a1 = (i / segs) * Math.PI * 2;
                const a2 = ((i + 1) / segs) * Math.PI * 2;
                const t1 = cam.project(rTop * Math.cos(a1), topY, rTop * Math.sin(a1));
                const t2 = cam.project(rTop * Math.cos(a2), topY, rTop * Math.sin(a2));
                const b1 = cam.project(rBot * Math.cos(a1), botY, rBot * Math.sin(a1));
                const b2 = cam.project(rBot * Math.cos(a2), botY, rBot * Math.sin(a2));
                if (!t1 || !t2 || !b1 || !b2) continue;
                ctx.fillStyle = fill;
                ctx.beginPath();
                ctx.moveTo(t1.x, t1.y);
                ctx.lineTo(t2.x, t2.y);
                ctx.lineTo(b2.x, b2.y);
                ctx.lineTo(b1.x, b1.y);
                ctx.closePath();
                ctx.fill();
            }
        };
        drawRing(0, -60, TABLE_RADIUS, TABLE_RADIUS - 10, '#4a3218');
        drawRing(-60, -110, TABLE_RADIUS - 10, TABLE_RADIUS - 40, '#33220e');
        drawRing(-110, -160, TABLE_RADIUS - 40, TABLE_RADIUS - 100, '#1a1108');

        /* 桌面填充 */
        ctx.save();
        const centerP = cam.project(0, 0, 0);
        if (centerP) {
            /* 桌面用径向渐变近似 */
            const grd = ctx.createRadialGradient(
                centerP.x, centerP.y - 60, 80,
                centerP.x, centerP.y, 800
            );
            grd.addColorStop(0, '#3a9c6c');
            grd.addColorStop(0.4, '#227a4a');
            grd.addColorStop(0.75, '#145230');
            grd.addColorStop(1, '#0a3520');
            ctx.beginPath();
            let started = false;
            for (let i = 0; i <= segs; i++) {
                const a = (i / segs) * Math.PI * 2;
                const p = cam.project(TABLE_RADIUS * Math.cos(a), 0, TABLE_RADIUS * Math.sin(a));
                if (!p) { started = false; continue; }
                if (!started) { ctx.moveTo(p.x, p.y); started = true; }
                else ctx.lineTo(p.x, p.y);
            }
            ctx.closePath();
            ctx.fillStyle = grd;
            ctx.fill();
            /* 边缘金线 */
            ctx.strokeStyle = 'rgba(255,215,64,.35)';
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }

        /* 内圈装饰 */
        for (let k = 0; k < 2; k++) {
            const r = TABLE_RADIUS - 40 - k * 80;
            ctx.beginPath();
            let started = false;
            for (let i = 0; i <= segs; i++) {
                const a = (i / segs) * Math.PI * 2;
                const p = cam.project(r * Math.cos(a), 1, r * Math.sin(a));
                if (!p) { started = false; continue; }
                if (!started) { ctx.moveTo(p.x, p.y); started = true; }
                else ctx.lineTo(p.x, p.y);
            }
            ctx.closePath();
            ctx.strokeStyle = `rgba(255,235,170,${0.16 - k*0.06})`;
            ctx.lineWidth = 1.4;
            ctx.stroke();
        }
        ctx.restore();

        /* 中央水印 */
        if (centerP) {
            ctx.save();
            ctx.globalAlpha = 0.12;
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.max(50, 130 * centerP.scale)}px "Microsoft YaHei",sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('斗', centerP.x, centerP.y);
            ctx.restore();
        }
    }

    /* ── 3D 卡牌（仿射变换，让牌随摄像机倾斜） ── */
    _drawCard3D(ctx, card, cx, cy, cz, rotation, faceUp) {
        const cam = this.camera;
        const halfW = CARD_W_3D / 2;
        const halfH = CARD_H_3D / 2;
        const cosR = Math.cos(rotation), sinR = Math.sin(rotation);

        /* 牌的 4 个角在世界坐标 */
        const corners = [
            [-halfW, -halfH], [ halfW, -halfH],
            [ halfW,  halfH], [-halfW,  halfH]
        ];
        const pts = [];
        for (const [lx, lz] of corners) {
            const wx = cx + lx * cosR - lz * sinR;
            const wz = cz + lx * sinR + lz * cosR;
            const p = cam.project(wx, cy, wz);
            if (!p) return;
            pts.push(p);
        }

        /* 屏幕外剔除 */
        const minX = Math.min(pts[0].x, pts[1].x, pts[2].x, pts[3].x);
        const maxX = Math.max(pts[0].x, pts[1].x, pts[2].x, pts[3].x);
        const minY = Math.min(pts[0].y, pts[1].y, pts[2].y, pts[3].y);
        const maxY = Math.max(pts[0].y, pts[1].y, pts[2].y, pts[3].y);
        if (maxX < -50 || minX > CANVAS_WIDTH + 50) return;
        if (maxY < -50 || minY > CANVAS_HEIGHT + 50) return;

        /* 用仿射变换把牌面映射到屏幕四边形 */
        const origin = pts[0];
        const e1 = { x: pts[1].x - pts[0].x, y: pts[1].y - pts[0].y }; // 沿牌宽
        const e2 = { x: pts[3].x - pts[0].x, y: pts[3].y - pts[0].y }; // 沿牌高

        ctx.save();
        ctx.setTransform(
            e1.x / CARD_W_3D, e1.y / CARD_W_3D,
            e2.x / CARD_H_3D, e2.y / CARD_H_3D,
            origin.x, origin.y
        );

        const W = CARD_W_3D, H = CARD_H_3D, R = 5;

        /* 阴影 */
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        this._roundRect(ctx, 2, 4, W, H, R);
        ctx.fill();

        if (faceUp) {
            ctx.fillStyle = '#fdfcf6';
            this._roundRect(ctx, 0, 0, W, H, R);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,.22)';
            ctx.lineWidth = 0.8;
            this._roundRect(ctx, 0, 0, W, H, R);
            ctx.stroke();

            const color = card.isRed ? '#c0282a' : '#1b1f28';
            if (card.suit === SUIT_JOKER) {
                const jc = card.rank === 17 ? '#c0282a' : '#3a3f4a';
                const main = card.rank === 17 ? (this.lang === 'en' ? 'JO' : '大') : (this.lang === 'en' ? 'Jo' : '小');
                ctx.fillStyle = jc;
                ctx.font = `bold ${W * 0.36}px "Microsoft YaHei",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(main, W / 2, H / 2 - 4);
                ctx.font = `bold ${W * 0.13}px "Segoe UI",sans-serif`;
                ctx.fillStyle = jc;
                ctx.globalAlpha = 0.75;
                ctx.fillText('JOKER', W / 2, H / 2 + H * 0.24);
                ctx.globalAlpha = 1;
            } else {
                const rank = card.displayRank;
                const suit = card.displaySuit;
                ctx.fillStyle = color;
                ctx.textBaseline = 'alphabetic';
                ctx.textAlign = 'left';
                ctx.font = `bold ${W * 0.30}px "Microsoft YaHei",sans-serif`;
                ctx.fillText(rank, W * 0.10, H * 0.24);
                ctx.font = `${W * 0.22}px "Segoe UI Symbol",serif`;
                ctx.fillText(suit, W * 0.10, H * 0.42);
                ctx.font = `${W * 0.55}px "Segoe UI Symbol",serif`;
                ctx.textAlign = 'center';
                ctx.globalAlpha = 0.9;
                ctx.fillText(suit, W / 2, H * 0.74);
                ctx.globalAlpha = 1;
            }
        } else {
            const g = ctx.createLinearGradient(0, 0, W, H);
            g.addColorStop(0, '#3f6ad4');
            g.addColorStop(0.5, '#2a4ba8');
            g.addColorStop(1, '#16295e');
            ctx.fillStyle = g;
            this._roundRect(ctx, 0, 0, W, H, R);
            ctx.fill();
            ctx.strokeStyle = 'rgba(180,205,255,.5)';
            ctx.lineWidth = 0.8;
            this._roundRect(ctx, 0, 0, W, H, R);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(200,225,255,.55)';
            ctx.lineWidth = 0.7;
            this._roundRect(ctx, W*0.1, H*0.08, W*0.8, H*0.84, R*0.7);
            ctx.stroke();

            ctx.fillStyle = 'rgba(140,180,255,.5)';
            ctx.beginPath();
            ctx.moveTo(W/2, H*0.35);
            ctx.lineTo(W*0.68, H/2);
            ctx.lineTo(W/2, H*0.65);
            ctx.lineTo(W*0.32, H/2);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }

    _roundRect(ctx, x, y, w, h, r) {
        r = Math.min(r, w/2, h/2);
        ctx.beginPath();
        ctx.moveTo(x+r, y);
        ctx.lineTo(x+w-r, y);
        ctx.quadraticCurveTo(x+w, y, x+w, y+r);
        ctx.lineTo(x+w, y+h-r);
        ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
        ctx.lineTo(x+r, y+h);
        ctx.quadraticCurveTo(x, y+h, x, y+h-r);
        ctx.lineTo(x, y+r);
        ctx.quadraticCurveTo(x, y, x+r, y);
        ctx.closePath();
    }

    /* ── 出牌区 ── */
    _drawTableZones(ctx) {
        const zones = [
            { pid: 0, pos: ZONE_PLAYER },
            { pid: 1, pos: ZONE_AI1 },
            { pid: 2, pos: ZONE_AI2 }
        ];
        for (const zone of zones) {
            const cards = this.tableCards[zone.pid];
            const passed = this.tablePassed[zone.pid];

            if (cards && cards.length) {
                this._drawCards3D(ctx, cards, zone.pos.x, 30, zone.pos.z, 0, true);
            } else if (passed) {
                const p = this.camera.project(zone.pos.x, 60, zone.pos.z);
                if (!p) continue;
                const scale = Math.max(0.4, Math.min(2.2, p.scale));
                const label = this.t('pass');
                ctx.save();
                ctx.font = `bold ${20 * scale}px "Microsoft YaHei",sans-serif`;
                const tw = ctx.measureText(label).width;
                ctx.fillStyle = 'rgba(0,0,0,.55)';
                this._roundRect(ctx, p.x - tw/2 - 18*scale, p.y - 20*scale, tw + 36*scale, 40*scale, 20*scale);
                ctx.fill();
                ctx.strokeStyle = 'rgba(200,210,230,.45)';
                ctx.lineWidth = 1.6 * scale;
                this._roundRect(ctx, p.x - tw/2 - 18*scale, p.y - 20*scale, tw + 36*scale, 40*scale, 20*scale);
                ctx.stroke();
                ctx.fillStyle = '#dce4f4';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, p.x, p.y);
                ctx.restore();
            }

            /* 思考中 */
            if (this.thinkingPid === zone.pid && this.state === 'playing') {
                const p = this.camera.project(zone.pos.x, 130, zone.pos.z);
                if (p) {
                    const dots = '.'.repeat(1 + (Math.floor(this._tick / 18) % 3));
                    const label = this.t('thinking') + dots;
                    const scale = Math.max(0.5, Math.min(1.8, p.scale));
                    ctx.save();
                    ctx.font = `bold ${14*scale}px "Microsoft YaHei",sans-serif`;
                    const tw = ctx.measureText(label).width;
                    ctx.fillStyle = 'rgba(20,40,70,.9)';
                    this._roundRect(ctx, p.x - tw/2 - 14*scale, p.y - 12*scale, tw + 28*scale, 24*scale, 12*scale);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,215,64,.55)';
                    ctx.lineWidth = 1 * scale;
                    this._roundRect(ctx, p.x - tw/2 - 14*scale, p.y - 12*scale, tw + 28*scale, 24*scale, 12*scale);
                    ctx.stroke();
                    ctx.fillStyle = '#ffd740';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(label, p.x, p.y);
                    ctx.restore();
                }
            }
        }
    }

    _drawCards3D(ctx, cards, cx, cy, cz, rotation, forceUp) {
        const n = cards.length;
        if (!n) return;
        const spacing = CARD_W_3D * 0.5;
        const totalW = (n - 1) * spacing;
        const startX = cx - totalW / 2;

        /* 按深度排序（远的先画） */
        const cam = this.camera;
        const items = [];
        for (let i = 0; i < n; i++) {
            const wx = startX + i * spacing;
            const p = cam.project(wx, cy, cz);
            items.push({
                card: cards[i],
                wx, wz: cz,
                depth: p ? p.depth : 99999,
                faceUp: forceUp || cards[i].faceUp
            });
        }
        items.sort((a, b) => b.depth - a.depth);
        for (const item of items) {
            this._drawCard3D(ctx, item.card, item.wx, cy, item.wz, rotation, item.faceUp);
        }
    }

    /* ── AI 手牌（3D 世界中） ── */
    _drawAIHand3D(ctx, pid, seatX, seatZ) {
        const hand = this.playersHand[pid];
        const n = hand.length;
        if (!n) return;
        const peeking = this.peekingAI === pid;

        /* 牌放在 AI 和桌子中心之间，稍稍偏向 AI */
        const faceAngle = Math.atan2(0 - seatX, 0 - seatZ);
        const handDist = 95;
        const handX = seatX + Math.sin(faceAngle) * handDist;
        const handZ = seatZ + Math.cos(faceAngle) * handDist;

        /* 沿垂直于朝向的方向排列 */
        const perpX = Math.cos(faceAngle);
        const perpZ = -Math.sin(faceAngle);
        const spacing = CARD_W_3D * 0.36;
        const totalW = (n - 1) * spacing;
        const cam = this.camera;

        const items = [];
        for (let i = 0; i < n; i++) {
            const card = hand[i];
            const off = i * spacing - totalW / 2;
            const wx = handX + perpX * off;
            const wz = handZ + perpZ * off;
            const p = cam.project(wx, 4, wz);
            items.push({
                card, wx, wz,
                rotation: faceAngle + Math.PI / 2,
                depth: p ? p.depth : 99999
            });
        }
        items.sort((a, b) => b.depth - a.depth);
        for (const item of items) {
            this._drawCard3D(ctx, item.card, item.wx, 4, item.wz, item.rotation, peeking || item.card.faceUp);
        }
    }

    /* ── 底牌 ── */
    _drawBottomCards3D(ctx) {
        const n = this.landlordCards.length;
        if (!n) return;
        const spacing = CARD_W_3D * 0.5;
        const totalW = (n - 1) * spacing;
        const startX = -totalW / 2;
        for (let i = 0; i < n; i++) {
            const c = this.landlordCards[i];
            this._drawCard3D(ctx, c, startX + i * spacing, 2, 70, 0, c.faceUp);
        }
    }

    /* ── 人物模型 ── */
    _drawCharacter(ctx, x, z, pid, isDead, name) {
        const cam = this.camera;
        const headY = 150;
        const bodyH = 110;

        const bodyTop = cam.project(x, headY - 45, z);
        const bodyBot = cam.project(x, headY - 45 - bodyH, z);
        if (!bodyTop || !bodyBot) return;
        const scale = Math.max(0.4, Math.min(2.5, bodyTop.scale));

        /* 身体 */
        ctx.save();
        const bg = ctx.createLinearGradient(bodyTop.x, bodyTop.y, bodyBot.x, bodyBot.y);
        if (isDead) { bg.addColorStop(0, '#3a3a3e'); bg.addColorStop(1, '#1a1a1e'); }
        else {
            bg.addColorStop(0, pid === 1 ? '#3a5a8a' : '#7a4a5a');
            bg.addColorStop(1, pid === 1 ? '#1a2a4a' : '#4a2a3a');
        }
        ctx.fillStyle = bg;
        const wTop = 34 * scale, wBot = 48 * scale;
        ctx.beginPath();
        ctx.moveTo(bodyTop.x - wTop, bodyTop.y);
        ctx.lineTo(bodyTop.x + wTop, bodyTop.y);
        ctx.lineTo(bodyBot.x + wBot, bodyBot.y);
        ctx.lineTo(bodyBot.x - wBot, bodyBot.y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.45)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();

        /* 头 */
        const headP = cam.project(x, headY, z);
        if (headP) {
            const hr = 26 * headP.scale;
            const hg = ctx.createRadialGradient(headP.x - hr*0.3, headP.y - hr*0.3, hr*0.1, headP.x, headP.y, hr);
            if (isDead) { hg.addColorStop(0, '#5a5a5e'); hg.addColorStop(1, '#2a2a2e'); }
            else { hg.addColorStop(0, '#f2d8b6'); hg.addColorStop(1, '#b28c6a'); }
            ctx.fillStyle = hg;
            ctx.beginPath();
            ctx.arc(headP.x, headP.y, hr, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,.4)';
            ctx.lineWidth = 1;
            ctx.stroke();

            /* 名牌 */
            const fontSize = 14 * Math.max(0.5, Math.min(1.6, headP.scale));
            ctx.font = `bold ${fontSize}px "Microsoft YaHei",sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const nameY = headP.y - hr - fontSize;
            const tw = ctx.measureText(name).width;
            ctx.fillStyle = 'rgba(0,0,0,.65)';
            this._roundRect(ctx, headP.x - tw/2 - 12, nameY - fontSize*0.8, tw + 24, fontSize*1.6, fontSize*0.8);
            ctx.fill();
            ctx.fillStyle = isDead ? '#a08080' : (this.landlordId === pid ? '#ffd740' : '#dce8fa');
            ctx.fillText(name, headP.x, nameY);

            if (this.landlordId === pid && !isDead) {
                ctx.font = `${20 * headP.scale}px "Segoe UI Symbol",sans-serif`;
                ctx.fillStyle = '#ffd740';
                ctx.shadowColor = '#ffd740';
                ctx.shadowBlur = 16;
                ctx.fillText('👑', headP.x, nameY - fontSize * 2.2);
                ctx.shadowBlur = 0;
            }
            if (isDead) {
                ctx.font = `bold ${24 * headP.scale}px sans-serif`;
                ctx.fillStyle = '#ff5050';
                ctx.shadowColor = '#a02020';
                ctx.shadowBlur = 12;
                ctx.fillText('✕', headP.x, headP.y);
                ctx.shadowBlur = 0;
            }
            if (!isDead && this.currentPlayer === pid &&
                (this.state === 'playing' || this.state === 'calling' || this.state === 'grabbing')) {
                const pulse = 0.5 + 0.5 * Math.sin(this._tick / 12);
                ctx.strokeStyle = `rgba(255,215,64,${0.5 + pulse * 0.5})`;
                ctx.lineWidth = 3 * Math.max(0.6, Math.min(1.6, headP.scale));
                ctx.shadowColor = '#ffd740';
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(headP.x, headP.y, hr + 8 * headP.scale, 0, Math.PI*2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }
    }

    _drawShotEffects(ctx) {
        const cam = this.camera;
        for (const eff of this.shotEffects) {
            const progress = 1 - eff.t / eff.maxT;
            const alpha = Math.max(0, 1 - progress);
            const worldR = 40 + progress * 200;
            const p = cam.project(eff.x, eff.y, eff.z);
            if (!p) continue;
            const r = worldR * p.scale;

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = '#ffaa00';
            ctx.lineWidth = 5 * (1 - progress) + 1;
            ctx.shadowColor = '#ff8020';
            ctx.shadowBlur = 24;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI*2);
            ctx.stroke();

            ctx.shadowBlur = 0;
            const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, r*0.55);
            g.addColorStop(0, `rgba(255,220,120,${alpha})`);
            g.addColorStop(0.4, `rgba(255,80,40,${alpha*0.7})`);
            g.addColorStop(1, 'rgba(180,20,20,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r*0.55, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
    }

    /* ═══════════ HUD ═══════════ */
    _drawHUD(ctx) {
        for (const c of this.playersHand[0]) c.drawHUD(ctx, this.lang);
        this._drawPlayerLabel(ctx);
        this._drawMessage(ctx);
        this._drawTitle(ctx);
        this._drawButtons(ctx);

        if (this.peekingAI >= 0) {
            ctx.save();
            const txt = this.t('peeking') + ' AI ' + this.peekingAI;
            ctx.font = 'bold 16px "Microsoft YaHei",sans-serif';
            const tw = ctx.measureText(txt).width;
            const bx = CANVAS_WIDTH/2 - tw/2 - 22;
            const by = 46;
            ctx.fillStyle = 'rgba(40,20,80,.85)';
            this._roundRect(ctx, bx, by, tw + 44, 34, 17);
            ctx.fill();
            ctx.strokeStyle = '#a080ff';
            ctx.lineWidth = 1.6;
            this._roundRect(ctx, bx, by, tw + 44, 34, 17);
