<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>软软扑克 · 3D 斗地主 · 手枪玩法</title>
<style>
    :root { --gold: #ffd740; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        background: radial-gradient(circle at 50% 12%, #16243c 0%, #060a12 68%);
        display: flex; justify-content: center; align-items: center;
        font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .game-container {
        position: relative; width: 100%; max-width: 1100px;
        aspect-ratio: 1100 / 720; max-height: 100vh; margin: 0 auto;
    }
    canvas {
        display: block; width: 100%; height: 100%;
        border-radius: 14px; cursor: pointer;
        box-shadow: 0 30px 90px rgba(0,0,0,.85), 0 0 0 1px rgba(120,170,255,.12);
    }
    .overlay {
        position: absolute; inset: 0;
        background: rgba(4,8,16,.74);
        backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
        display: none; justify-content: center; align-items: center;
        z-index: 10; border-radius: 14px; animation: fadeIn .18s ease;
    }
    .overlay.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes panelIn {
        from { opacity: 0; transform: translateY(18px) scale(.95); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .settings-panel {
        background: linear-gradient(160deg, #1d2c47 0%, #101a2c 100%);
        border: 2px solid #3d5a8a; border-radius: 18px;
        padding: 26px 30px 22px; width: 86%; max-width: 440px;
        color: #e8eefc; position: relative;
        box-shadow: 0 24px 70px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.07);
        animation: panelIn .24s cubic-bezier(.22,1,.36,1);
    }
    .settings-panel h3 {
        text-align: center; margin-bottom: 20px; font-size: 1.3em;
        letter-spacing: 4px; color: var(--gold);
        text-shadow: 0 2px 12px rgba(255,215,64,.35);
    }
    .close-btn {
        position: absolute; top: 12px; right: 14px; width: 34px; height: 34px;
        border-radius: 50%; background: linear-gradient(180deg,#e74c3c,#a8281c);
        color: #fff; border: none; font-size: 1em; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: transform .18s, filter .18s;
        box-shadow: 0 4px 12px rgba(200,40,30,.45);
    }
    .close-btn:hover { transform: scale(1.1) rotate(90deg); filter: brightness(1.15); }
    .row { display: flex; align-items: center; margin: 14px 0; gap: 10px; flex-wrap: wrap; }
    .row label { font-weight: 700; min-width: 56px; font-size: .96em; letter-spacing: 1px; color: #9fb6d8; }
    .row button {
        padding: 9px 18px; border-radius: 10px; border: 1.5px solid #365272;
        background: linear-gradient(180deg,#253a58,#1a2a42);
        color: #b9cbe4; cursor: pointer; font-size: .9em; font-weight: 600;
        letter-spacing: 1px; transition: all .18s ease; white-space: nowrap;
    }
    .row button:hover {
        background: linear-gradient(180deg,#34527c,#24395a);
        color: #fff; border-color: #6d9bdc; transform: translateY(-1px);
    }
    .row button.active {
        background: linear-gradient(180deg,#3f8de0,#2563b0);
        color: #fff; border-color: var(--gold);
        box-shadow: 0 0 16px rgba(255,215,64,.35);
    }
    @media (max-width: 768px) {
        .game-container { max-height: 100vh; aspect-ratio: auto; height: 100vh; }
        canvas { border-radius: 0; box-shadow: none; }
        .settings-panel { width: 92%; padding: 20px 16px 16px; }
        .settings-panel h3 { font-size: 1.15em; margin-bottom: 14px; }
        .row button { padding: 8px 13px; font-size: .82em; }
        .row { gap: 7px; margin: 10px 0; }
    }
</style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay" id="settingsOverlay">
        <div class="settings-panel">
            <button class="close-btn" id="settingsClose">✕</button>
            <h3 id="settingsTitle">设置</h3>
            <div class="row">
                <label id="diffLabel">难度：</label>
                <button data-diff="easy" id="diffEasy">简单</button>
                <button data-diff="normal" id="diffNormal">普通</button>
                <button data-diff="hard" id="diffHard">困难</button>

            <div class="row">

                <button data-lang="en" id="langEn">English</button>

</div>

<script>
(function () {
'use strict';

/* ══════════════════════════════════════════
   常量
   ══════════════════════════════════════════ */
const CANVAS_WIDTH  = 1100;
const CANVAS_HEIGHT = 720;
const CARD_WIDTH    = 72;
const CARD_HEIGHT   = 100;
const CARD_RADIUS   = 8;
const CARD_SELECTED_OFFSET = 26;

const SUIT_SPADE = 0, SUIT_HEART = 1, SUIT_CLUB = 2, SUIT_DIAMOND = 3, SUIT_JOKER = 4;
const SUIT_SYMBOLS = {
    [SUIT_SPADE]: '♠', [SUIT_HEART]: '♥', [SUIT_CLUB]: '♣',
    [SUIT_DIAMOND]: '♦', [SUIT_JOKER]: '★'
};
const RANK_NAMES_ZH = { 3:'3',4:'4',5:'5',6:'6',7:'7',8:'8',9:'9',10:'10',11:'J',12:'Q',13:'K',14:'A',15:'2',16:'小',17:'大' };
const RANK_NAMES_EN = { 3:'3',4:'4',5:'5',6:'6',7:'7',8:'8',9:'9',10:'10',11:'J',12:'Q',13:'K',14:'A',15:'2',16:'Jo',17:'JO' };

const TEXTS = {
    zh: {
        title:'软 软 扑 克', start:'开始游戏', restart:'再来一局', settings:'设置',
        difficulty:'难度', easy:'简单', normal:'普通', hard:'困难',
        language:'语言', chinese:'中文', english:'English',
        call_landlord:'叫地主', no_call:'不叫', grab_landlord:'抢地主', no_grab:'不抢',
        play:'出牌', pass:'不出',
        landlord:'地主', farmer:'农民',
        you_win:'🎉 你赢了！', you_lose:'💔 你输了…',
        you:'你', ai1:'电脑 A', ai2:'电脑 B',
        cards_count:'张', bottom_cards:'底 牌',
        new_round:'新一轮 · 请出牌', invalid_play:'无效牌型！',
        cant_beat:'打不过上家！', must_play:'新一轮必须出牌',
        select_cards:'请先选牌', no_one_call:'无人叫地主，重新发牌…',

    },

        difficulty:'Difficulty', easy:'Easy', normal:'Normal', hard:'Hard',
        language:'Language', chinese:'中文', english:'English',
        call_landlord:'Call', no_call:'Pass', grab_landlord:'Grab', no_grab:'Pass',
        play:'Play', pass:'Pass',
        landlord:'Landlord', farmer:'Farmer',
        you_win:'🎉 You Win!', you_lose:'💔 You Lose…',
        you:'You', ai1:'AI 1', ai2:'AI 2',
        cards_count:'', bottom_cards:'BOTTOM',
        new_round:'New round · play!', invalid_play:'Invalid play!',
        cant_beat:"Can't beat that!", must_play:'Must play a card',
        select_cards:'Select cards first', no_one_call:'Nobody called — redealing…',
        no_one_grab:'Nobody grabbed — redealing…',
        ai_play:'plays', ai_pass:'passes', thinking:'thinking',
        dealing:'Dealing…',
        gun_ready:'Gun', gun_used:'Used',
        aim_prompt:'Click a robot panel to shoot',

        dead:'Eliminated', your_turn:'Your turn',
        gun_tip:'Gun · one shot per game'

};

/* ══════════════════════════════════════════
   Canvas / DOM
   ══════════════════════════════════════════ */
const canvas = document.getElementById('gameCanvas');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;
const ctx = canvas.getContext('2d');

const settingsOverlay = document.getElementById('settingsOverlay');
const settingsClose   = document.getElementById('settingsClose');
const diffEasy = document.getElementById('diffEasy');
const diffNormal = document.getElementById('diffNormal');
const diffHard = document.getElementById('diffHard');
const langZh = document.getElementById('langZh');
const langEn = document.getElementById('langEn');
const settingsTitle = document.getElementById('settingsTitle');
const diffLabel = document.getElementById('diffLabel');
const langLabel = document.getElementById('langLabel');

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = CANVAS_WIDTH / rect.width;
    const sy = CANVAS_HEIGHT / rect.height;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
}
const lerp = (a, b, t) => a + (b - a) * t;

/* AI 面板固定区域 */
const PANEL_AI1 = { x: 16, y: 8, w: 200, h: 56 };
const PANEL_AI2 = { x: CANVAS_WIDTH - 216, y: 8, w: 200, h: 56 };

/* ══════════════════════════════════════════
   牌
   ══════════════════════════════════════════ */
class Card {
    constructor(suit, rank) {
        this.suit = suit;
        this.rank = rank;
        this.selected = false;
        this.faceUp = true;
        this.x = 0; this.y = 0;
        this.targetX = 0; this.targetY = 0;
        this.rotation = 0; this.targetRotation = 0;
        this.scale = 1;   this.targetScale = 1;
        this.animSpeed = 0.16;
    }
    get isRed() {
        return this.suit === SUIT_HEART || this.suit === SUIT_DIAMOND ||
               (this.suit === SUIT_JOKER && this.rank === 17);
    }
    get displayRank() {
        return (window._lang === 'en' ? RANK_NAMES_EN : RANK_NAMES_ZH)[this.rank] || String(this.rank);
    }
    get displaySuit() { return SUIT_SYMBOLS[this.suit] || ''; }

    updatePosition() {
        this.x = lerp(this.x, this.targetX, this.animSpeed);
        this.y = lerp(this.y, this.targetY, this.animSpeed);
        this.rotation = lerp(this.rotation, this.targetRotation, this.animSpeed * 1.4);
        this.scale  = lerp(this.scale, this.targetScale, this.animSpeed * 1.4);
        if (Math.abs(this.x - this.targetX) < 0.4) this.x = this.targetX;
        if (Math.abs(this.y - this.targetY) < 0.4) this.y = this.targetY;
        if (Math.abs(this.rotation - this.targetRotation) < 0.002) this.rotation = this.targetRotation;
        if (Math.abs(this.scale - this.targetScale) < 0.004) this.scale = this.targetScale;
    }
    setTarget(x, y, rot, sc) {
        this.targetX = x; this.targetY = y;
        if (rot !== undefined) this.targetRotation = rot;
        if (sc !== undefined) this.targetScale = sc;
    }
    snapToTarget() {
        this.x = this.targetX; this.y = this.targetY;
        this.rotation = this.targetRotation;
        this.scale = this.targetScale;
    }
    containsPoint(px, py) {
        const sel = this.selected ? -CARD_SELECTED_OFFSET : 0;
        const cx = this.x + CARD_WIDTH / 2;
        const cy = this.y + CARD_HEIGHT / 2 + sel;
        const dx = px - cx, dy = py - cy;
        const cos = Math.cos(-this.rotation), sin = Math.sin(-this.rotation);
        const lx = dx * cos - dy * sin;
        const ly = dx * sin + dy * cos;
        return Math.abs(lx) <= (CARD_WIDTH * this.scale) / 2 &&
               Math.abs(ly) <= (CARD_HEIGHT * this.scale) / 2;
    }

    draw(ctx, lang) {
        const sel = this.selected ? -CARD_SELECTED_OFFSET : 0;
        const cx = this.x + CARD_WIDTH / 2;
        const cy = this.y + CARD_HEIGHT / 2 + sel;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(this.rotation);
        ctx.scale(this.scale, this.scale);

        if (this.selected) {
            ctx.shadowColor = 'rgba(255,215,64,.85)';
            ctx.shadowBlur = 24;
            ctx.shadowOffsetY = -4;
        } else {
            ctx.shadowColor = 'rgba(0,0,0,.6)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 6;
        }

        ctx.translate(-CARD_WIDTH / 2, -CARD_HEIGHT / 2);
        const w = CARD_WIDTH, h = CARD_HEIGHT, r = CARD_RADIUS;

        if (this.faceUp) {
            ctx.fillStyle = 'rgba(196,190,172,.95)';
            this._roundRect(ctx, 2.5, 4, w, h, r);
            ctx.fill();

            const g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, '#ffffff');
            g.addColorStop(0.55, '#fbf9f3');
            g.addColorStop(1, '#eee9dc');
            ctx.fillStyle = g;
            this._roundRect(ctx, 0, 0, w, h, r);
            ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.strokeStyle = this.selected ? '#f5b301' : 'rgba(0,0,0,.16)';
            ctx.lineWidth = this.selected ? 2.2 : 1;
            this._roundRect(ctx, 0, 0, w, h, r);
            ctx.stroke();

            ctx.save();
            ctx.beginPath();
            this._roundRect(ctx, 0, 0, w, h, r);
            ctx.clip();
            const sg = ctx.createLinearGradient(0, 0, w * 0.75, h * 0.5);
            sg.addColorStop(0, 'rgba(255,255,255,.85)');
            sg.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = sg;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();

            const color = this.isRed ? '#d02a2a' : '#1b1f28';

            if (this.suit === SUIT_JOKER) {
                const jcolor = this.rank === 17 ? '#d02a2a' : '#3a3f4a';
                const main = this.rank === 17 ? (lang === 'en' ? 'JO' : '大') : (lang === 'en' ? 'Jo' : '小');
                ctx.fillStyle = jcolor;
                ctx.font = 'bold 24px "Microsoft YaHei","PingFang SC",sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(main, w / 2, h / 2 - 4);
                ctx.font = 'bold 10px "Segoe UI",sans-serif';
                ctx.fillStyle = this.rank === 17 ? '#e05555' : '#8a8f9a';
                ctx.fillText('JOKER', w / 2, h / 2 + 22);
                ctx.font = '13px serif';
                ctx.fillStyle = jcolor;
                ctx.globalAlpha = .5;
                ctx.fillText('★', w / 2, h / 2 - 30);
                ctx.fillText('★', w / 2, h / 2 + 38);
                ctx.globalAlpha = 1;
            } else {
                ctx.textBaseline = 'alphabetic';
                ctx.fillStyle = color;
                ctx.font = 'bold 19px "Microsoft YaHei","PingFang SC",sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(this.displayRank, 7, 23);
                ctx.font = '15px "Segoe UI Symbol",serif';
                ctx.fillText(this.displaySuit, 7, 41);
                ctx.font = '36px "Segoe UI Symbol",serif';
                ctx.textAlign = 'center';
                ctx.globalAlpha = .92;
                ctx.fillText(this.displaySuit, w / 2, h / 2 + 13);
                ctx.globalAlpha = 1;
                ctx.save();
                ctx.translate(w - 7, h - 7);
                ctx.rotate(Math.PI);
                ctx.fillStyle = color;
                ctx.font = 'bold 19px "Microsoft YaHei","PingFang SC",sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(this.displayRank, 0, 19);
                ctx.font = '15px "Segoe UI Symbol",serif';
                ctx.fillText(this.displaySuit, 0, 37);
                ctx.restore();
            }
        } else {
            ctx.fillStyle = 'rgba(22,40,86,.95)';
            this._roundRect(ctx, 2.5, 4, w, h, r);
            ctx.fill();
            const g = ctx.createLinearGradient(0, 0, w, h);
            g.addColorStop(0, '#3f6ad4');
            g.addColorStop(0.5, '#2a4ba8');
            g.addColorStop(1, '#16295e');
            ctx.fillStyle = g;
            this._roundRect(ctx, 0, 0, w, h, r);
            ctx.fill();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(180,205,255,.5)';
            ctx.lineWidth = 1.5;
            this._roundRect(ctx, 0, 0, w, h, r);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(160,190,255,.32)';
            ctx.lineWidth = 1;
            this._roundRect(ctx, 7, 7, w - 14, h - 14, 5);
            ctx.stroke();
            const cx2 = w / 2, cy2 = h / 2;
            ctx.fillStyle = 'rgba(130,175,255,.42)';
            ctx.beginPath();
            ctx.moveTo(cx2, cy2 - 17);
            ctx.lineTo(cx2 + 12, cy2);
            ctx.lineTo(cx2, cy2 + 17);
            ctx.lineTo(cx2 - 12, cy2);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(200,225,255,.62)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx2, cy2, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(230,240,255,.55)';
            ctx.fill();
        }
        ctx.restore();
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
    }

    _roundRect(ctx, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }
}

/* ══════════════════════════════════════════
   牌型
   ══════════════════════════════════════════ */
function getRankCounts(cards) {
    const c = {};
    for (const card of cards) c[card.rank] = (c[card.rank] || 0) + 1;
    return c;
}

function analyzeHand(cards) {
    if (!cards || !cards.length) return null;
    const n = cards.length;
    const counts = getRankCounts(cards);
    const ranks = Object.keys(counts).map(Number).sort((a, b) => a - b);
    const vals = ranks.map(r => counts[r]).sort((a, b) => a - b);

    if (n === 2 && counts[16] === 1 && counts[17] === 1)
        return { type: 'rocket', mainRank: 100, length: 1 };
    if (n === 4 && ranks.length === 1)
        return { type: 'bomb', mainRank: ranks[0], length: 1 };
    if (n === 1) return { type: 'single', mainRank: ranks[0], length: 1 };
    if (n === 2 && ranks.length === 1) return { type: 'pair', mainRank: ranks[0], length: 1 };
    if (n === 3 && ranks.length === 1) return { type: 'triple', mainRank: ranks[0], length: 1 };
    if (n === 4 && vals.length === 2 && vals[0] === 1 && vals[1] === 3)
        return { type: 'triple_one', mainRank: ranks.find(r => counts[r] === 3), length: 1 };
    if (n === 5 && vals.length === 2 && vals[0] === 2 && vals[1] === 3)
        return { type: 'triple_two', mainRank: ranks.find(r => counts[r] === 3), length: 1 };
    if (n === 6 && vals.length === 3 && vals[0] === 1 && vals[1] === 1 && vals[2] === 4)
        return { type: 'quad_two', mainRank: ranks.find(r => counts[r] === 4), length: 1 };
    if (n === 8 && vals.length === 3 && vals[0] === 2 && vals[1] === 2 && vals[2] === 4)
        return { type: 'quad_two_pair', mainRank: ranks.find(r => counts[r] === 4), length: 1 };

    if (n >= 5 && ranks.length === n && ranks[n - 1] <= 14 && ranks[n - 1] - ranks[0] === n - 1)
        return { type: 'straight', mainRank: ranks[n - 1], length: n };

    if (n >= 6 && n % 2 === 0 && ranks.length === n / 2 &&
        ranks.every(r => counts[r] === 2) && ranks[ranks.length - 1] <= 14 &&
        ranks[ranks.length - 1] - ranks[0] === ranks.length - 1)
        return { type: 'straight_pair', mainRank: ranks[ranks.length - 1], length: ranks.length };

    const tripleRanks = ranks.filter(r => counts[r] >= 3 && r <= 14);
    const maxLen = Math.min(6, Math.floor(tripleRanks.length));
    for (let len = maxLen; len >= 2; len--) {
        for (let s = 0; s + len <= tripleRanks.length; s++) {
            const seq = tripleRanks.slice(s, s + len);
            if (seq[seq.length - 1] - seq[0] !== len - 1) continue;
            if (!seq.every(r => counts[r] >= 3)) continue;
            const tripCount = len * 3;
            const rem = n - tripCount;
            const wing = {};
            for (const r of ranks) wing[r] = counts[r];
            for (const r of seq) wing[r] -= 3;
            const wingRanks = Object.keys(wing).map(Number).filter(r => wing[r] > 0);
            const wingTotal = wingRanks.reduce((a, r) => a + wing[r], 0);
            if (rem === 0 && seq.every(r => counts[r] === 3))
                return { type: 'plane', mainRank: seq[seq.length - 1], length: len };
            if (rem === len && wingTotal === len)
                return { type: 'plane_single', mainRank: seq[seq.length - 1], length: len };
            if (rem === len * 2 && wingRanks.length === len && wingRanks.every(r => wing[r] === 2))
                return { type: 'plane_pair', mainRank: seq[seq.length - 1], length: len };
        }
    }
    return null;
}

function canBeat(newT, lastT) {
    if (!newT) return false;
    if (!lastT) return true;
    if (newT.type === 'rocket') return true;
    if (lastT.type === 'rocket') return false;
    if (newT.type === 'bomb') {
        if (lastT.type !== 'bomb') return true;
        return newT.mainRank > lastT.mainRank;
    }
    if (lastT.type === 'bomb') return false;
    if (newT.type === lastT.type && newT.length === lastT.length)
        return newT.mainRank > lastT.mainRank;
    return false;
}

/* ══════════════════════════════════════════
   AI
   ══════════════════════════════════════════ */
class AIPlayer {
    constructor(playerId, difficulty = 'normal') {
        this.playerId = playerId;
        this.difficulty = difficulty;
        this.hand = [];
        this.isLandlord = false;
    }

    findPlay(game) {
        if (!this.hand.length) return null;
        const last = game.lastPlayInfo;
        const whole = analyzeHand(this.hand);
        if (whole && canBeat(whole, last)) return [...this.hand];
        if (!last) return this._leadPlay(game);
        if (this._isTeammate(game, game.lastPlayedBy)) {
            if (this.hand.length <= 2) {
                const trySame = this._followPlay(game, last);
                if (trySame && trySame.length === this.hand.length) return trySame;
            }
            return null;
        }
        return this._followPlay(game, last);
    }

    _isTeammate(game, pid) {
        if (pid === -1 || pid === this.playerId) return false;
        if (this.isLandlord) return false;
        return pid !== game.landlordId;
    }
    _getEnemies(game) {
        if (this.isLandlord) return [0, 1, 2].filter(p => p !== this.playerId);
        return [game.landlordId].filter(p => p >= 0);
    }

    _leadPlay(game) {
        const hand = this.hand;
        const n = hand.length;
        if (n === 1) return [...hand];
        const counts = getRankCounts(hand);
        const byRank = {};
        for (const c of hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        const ranksAsc = Object.keys(byRank).map(Number).sort((a, b) => a - b);
        const enemies = this._getEnemies(game);
        const enemyMin = enemies.length ? Math.min(...enemies.map(p => game.playersHand[p].length)) : 99;

        if (enemyMin === 1) {
            const pairsDesc = ranksAsc.filter(r => counts[r] >= 2 && r <= 15).sort((a, b) => b - a);
            if (pairsDesc.length) return byRank[pairsDesc[0]].slice(0, 2);
            const triDesc = ranksAsc.filter(r => counts[r] >= 3).sort((a, b) => b - a);
            if (triDesc.length) return byRank[triDesc[0]].slice(0, 3);
            return [byRank[ranksAsc[ranksAsc.length - 1]][0]];
        }
        if (this.difficulty !== 'easy') {
            const st = this._findLongestStraight();
            if (st && st.length >= 5) return st;
        }
        if (this.difficulty === 'hard') {
            const tri = ranksAsc.filter(r => counts[r] === 3);
            if (tri.length && n <= 8) {
                const r = tri[0];
                const tr = byRank[r].slice(0, 3);
                const rem = hand.filter(c => !tr.includes(c));
                if (rem.length === 1) return [...tr, rem[0]];
                if (rem.length === 2 && rem[0].rank === rem[1].rank) return [...tr, ...rem];
            }
        }
        const singles = ranksAsc.filter(r => counts[r] === 1);
        if (singles.length) return [byRank[singles[0]][0]];
        const pairs = ranksAsc.filter(r => counts[r] === 2 && r <= 15);
        if (pairs.length) return byRank[pairs[0]].slice(0, 2);
        const triples = ranksAsc.filter(r => counts[r] === 3);
        if (triples.length) {
            const tr = byRank[triples[0]].slice(0, 3);
            const rem = hand.filter(c => !tr.includes(c));
            if (rem.length && this.difficulty !== 'easy' && rem.length <= 2) {
                const remSorted = [...rem].sort((a, b) => a.rank - b.rank);
                return [...tr, remSorted[0]];
            }
            return tr;
        }
        return [byRank[ranksAsc[0]][0]];
    }

    _followPlay(game, last) {
        const enemies = this._getEnemies(game);
        const enemyMin = enemies.length ? Math.min(...enemies.map(p => game.playersHand[p].length)) : 99;
        const desperate = enemyMin <= 2;
        const same = this._findBeatingSame(last);
        if (same) {
            const info = analyzeHand(same);
            if (info && info.type === 'bomb' && last.type !== 'bomb' && last.type !== 'rocket') {
                if (this.difficulty === 'easy') return Math.random() < 0.5 ? same : null;
                if (!desperate && this.hand.length > 5) return null;
            }
            return same;
        }
        const bomb = this._findSmallestBomb();
        if (bomb) {
            const bInfo = analyzeHand(bomb);
            if (canBeat(bInfo, last)) {
                if (desperate) return bomb;
                if (last.type === 'bomb') return bomb;
                if (this.hand.length <= 5) return bomb;
                if (this.difficulty === 'hard' && this.hand.length <= 8) return bomb;
                if (this.difficulty === 'normal' && Math.random() < 0.3) return bomb;
                if (this.difficulty === 'easy' && Math.random() < 0.12) return bomb;
            }
        }
        if (desperate || this.difficulty === 'hard') {
            const rocket = this._findRocket();
            if (rocket) {
                const rInfo = analyzeHand(rocket);
                if (canBeat(rInfo, last)) {
                    if (desperate || Math.random() < 0.4) return rocket;
                }
            }
        }
        return null;
    }

    _findBeatingSame(info) {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        const sRanks = Object.keys(byRank).map(Number).sort((a, b) => a - b);
        const lt = info.type, lr = info.mainRank, ll = info.length;
        const cost = n => (n === 1 ? 0 : n === 2 ? 1 : n === 3 ? 2 : 20);

        if (lt === 'single') {
            const cands = sRanks.filter(r => r > lr);
            if (!cands.length) return null;
            cands.sort((a, b) => cost(byRank[a].length) - cost(byRank[b].length) || a - b);
            return [byRank[cands[0]][0]];
        }
        if (lt === 'pair') {
            const cands = sRanks.filter(r => r > lr && byRank[r].length >= 2);
            if (!cands.length) return null;
            cands.sort((a, b) => cost(byRank[a].length) - cost(byRank[b].length) || a - b);
            return byRank[cands[0]].slice(0, 2);
        }
        if (lt === 'triple') {
            const cands = sRanks.filter(r => r > lr && byRank[r].length >= 3);
            if (!cands.length) return null;
            cands.sort((a, b) => cost(byRank[a].length) - cost(byRank[b].length) || a - b);
            return byRank[cands[0]].slice(0, 3);
        }
        if (lt === 'triple_one' || lt === 'triple_two') {
            const need = lt === 'triple_one' ? 1 : 2;
            for (const r of sRanks) {
                if (r <= lr || byRank[r].length < 3) continue;
                const tr = byRank[r].slice(0, 3);
                const rem = this.hand.filter(c => !tr.includes(c));
                if (need === 1) {
                    if (rem.length >= 1) {
                        const rc = getRankCounts(rem);
                        const wr = Object.keys(rc).map(Number).sort((a, b) => rc[a] - rc[b] || a - b);
                        return [...tr, rem.find(c => c.rank === wr[0])];
                    }
                } else {
                    const rc = getRankCounts(rem);
                    const pr = Object.keys(rc).map(Number).filter(x => rc[x] >= 2)
                        .sort((a, b) => rc[a] - rc[b] || a - b);
                    if (pr.length) {
                        const pc = rem.filter(c => c.rank === pr[0]).slice(0, 2);
                        return [...tr, ...pc];
                    }
                }
            }
            return null;
        }
        if (lt === 'straight') return this._findBeatingStraight(lr, ll);
        if (lt === 'straight_pair') return this._findBeatingStraightPair(lr, ll);
        if (lt === 'plane' || lt === 'plane_single' || lt === 'plane_pair')
            return this._findBeatingPlane(lt, lr, ll);
        if (lt === 'quad_two' || lt === 'quad_two_pair') {
            for (const r of sRanks) {
                if (r <= lr || byRank[r].length < 4) continue;
                const qd = byRank[r].slice(0, 4);
                const rem = this.hand.filter(c => !qd.includes(c));
                if (lt === 'quad_two') {
                    if (rem.length >= 2) {
                        const sorted = [...rem].sort((a, b) => a.rank - b.rank);
                        return [...qd, sorted[0], sorted[1]];
                    }
                } else {
                    const rc = getRankCounts(rem);
                    const pr = Object.keys(rc).map(Number).filter(x => rc[x] >= 2);
                    if (pr.length >= 2) {
                        const w = [];
                        for (const x of pr.slice(0, 2)) w.push(...rem.filter(c => c.rank === x).slice(0, 2));
                        return [...qd, ...w];
                    }
                }
            }
            return null;
        }
        return null;
    }

    _findBeatingStraight(lr, ll) {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        for (let sr = 3; sr + ll - 1 <= 14; sr++) {
            const er = sr + ll - 1;
            if (er <= lr) continue;
            let ok = true;
            for (let r = sr; r <= er; r++) if (!byRank[r] || !byRank[r].length) { ok = false; break; }
            if (!ok) continue;
            const res = [];
            for (let r = sr; r <= er; r++) res.push(byRank[r][0]);
            return res;
        }
        return null;
    }

    _findBeatingStraightPair(lr, ll) {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        for (let sr = 3; sr + ll - 1 <= 14; sr++) {
            const er = sr + ll - 1;
            if (er <= lr) continue;
            let ok = true;
            for (let r = sr; r <= er; r++) if (!byRank[r] || byRank[r].length < 2) { ok = false; break; }
            if (!ok) continue;
            const res = [];
            for (let r = sr; r <= er; r++) res.push(...byRank[r].slice(0, 2));
            return res;
        }
        return null;
    }

    _findBeatingPlane(lt, lr, ll) {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        const trs = Object.keys(byRank).map(Number).filter(r => byRank[r].length >= 3 && r <= 14).sort((a, b) => a - b);
        for (let s = 0; s + ll <= trs.length; s++) {
            const seq = trs.slice(s, s + ll);
            if (seq[seq.length - 1] - seq[0] !== ll - 1) continue;
            if (seq[seq.length - 1] <= lr) continue;
            const tripCards = [];
            for (const r of seq) tripCards.push(...byRank[r].slice(0, 3));
            const rem = this.hand.filter(c => !tripCards.includes(c));
            if (lt === 'plane') return tripCards;
            if (lt === 'plane_single') {
                if (rem.length >= ll) {
                    const sorted = [...rem].sort((a, b) => a.rank - b.rank);
                    return [...tripCards, ...sorted.slice(0, ll)];
                }
            }
            if (lt === 'plane_pair') {
                const rc = getRankCounts(rem);
                const prs = Object.keys(rc).map(Number).filter(r => rc[r] >= 2);
                if (prs.length >= ll) {
                    const w = [];
                    for (const r of prs.slice(0, ll)) w.push(...rem.filter(c => c.rank === r).slice(0, 2));
                    return [...tripCards, ...w];
                }
            }
        }
        return null;
    }

    _findSmallestBomb() {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        const bombs = Object.entries(byRank).filter(([, cs]) => cs.length >= 4)
            .map(([r, cs]) => [Number(r), cs]).sort((a, b) => a[0] - b[0]);
        return bombs.length ? bombs[0][1].slice(0, 4) : null;
    }
    _findRocket() {
        const hasS = this.hand.some(c => c.rank === 16);
        const hasB = this.hand.some(c => c.rank === 17);
        if (hasS && hasB) return this.hand.filter(c => c.rank === 16 || c.rank === 17);
        return null;
    }
    _findLongestStraight() {
        const byRank = {};
        for (const c of this.hand) (byRank[c.rank] || (byRank[c.rank] = [])).push(c);
        let best = null;
        for (let sr = 3; sr <= 10; sr++) {
            const cur = [];
            for (let r = sr; r <= 14; r++) {
                if (byRank[r] && byRank[r].length) cur.push(r);
                else break;
            }
            if (cur.length >= 5 && (!best || cur.length > best.length)) best = cur;
        }
        if (!best) return null;
        const counts = getRankCounts(this.hand);
        if (best.some(r => counts[r] >= 4)) return null;
        return best.map(r => byRank[r][0]);
    }
}

/* ══════════════════════════════════════════
   游戏主类
   ══════════════════════════════════════════ */
class Game {
    constructor() {
        this.lang = 'zh';
        window._lang = 'zh';
        this.difficulty = 'normal';
        this.settingsOpen = false;
        this.state = 'idle';

        this.playersHand = [[], [], []];
        this.landlordCards = [];
        this.landlordId = -1;
        this.currentPlayer = -1;

        this.tableCards  = [[], [], []];
        this.tablePassed = [false, false, false];

        this.lastPlayedCards = [];
        this.lastPlayedBy = -1;
        this.lastPlayInfo = null;
        this.passCount = 0;

        this.callScores = [0, 0, 0];
        this.callStartPlayer = 0;
        this.callCurrent = 0;
        this.calledSet = new Set();
        this.grabPhase = false;
        this.grabScores = [0, 0, 0];
        this.grabCurrent = 0;
        this.grabStart = 0;
        this.grabbedSet = new Set();

        this.winner = -1;
        this.message = '';
        this.messageTimer = 0;
        this.thinkingPid = -1;

        /* —— 手枪 —— */
        this.gunUsed = false;
        this.aiming = false;
        this.deadPlayers = [false, false, false];
        this.shotEffects = [];

        this.aiPlayers = [null, new AIPlayer(1, this.difficulty), new AIPlayer(2, this.difficulty)];
        this.aiTimer = null;

        this._mouseX = -999; this._mouseY = -999;
        this._playBtnRect = null; this._passBtnRect = null;
        this._callBtnRect = null; this._noCallBtnRect = null;
        this._grabBtnRect = null; this._noGrabBtnRect = null;
        this._startBtnRect = null;
        this._gunBtnRect = null;
        this._tick = 0;

        this.initNewGame();
    }

    t(key) { return (TEXTS[this.lang] || TEXTS.zh)[key] || key; }

    _tableZone(pid) {
        if (pid === 0) return { x: 362, y: 392, w: 376, h: 118 };
        if (pid === 1) return { x: 128, y: 226, w: 300, h: 112 };
        return { x: 672, y: 226, w: 300, h: 112 };
    }

    _aiDelay() {
        const base = this.difficulty === 'easy' ? 1050
                   : this.difficulty === 'normal' ? 880 : 700;
        return base + Math.random() * 850;
    }

    /* ───────── 初始化 ───────── */
    initNewGame() {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        this.thinkingPid = -1;

        const deck = [];
        for (const s of [SUIT_SPADE, SUIT_HEART, SUIT_CLUB, SUIT_DIAMOND])
            for (let r = 3; r <= 15; r++) deck.push(new Card(s, r));
        deck.push(new Card(SUIT_JOKER, 16), new Card(SUIT_JOKER, 17));
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        this.playersHand = [deck.slice(0, 17), deck.slice(17, 34), deck.slice(34, 51)];
        this.landlordCards = deck.slice(51, 54);

        this.aiPlayers = [null, new AIPlayer(1, this.difficulty), new AIPlayer(2, this.difficulty)];
        this.aiPlayers[1].hand = [...this.playersHand[1]];
        this.aiPlayers[2].hand = [...this.playersHand[2]];

        for (const c of this.playersHand[0]) c.faceUp = true;
        for (const c of this.playersHand[1]) c.faceUp = false;
        for (const c of this.playersHand[2]) c.faceUp = false;
        for (const c of this.landlordCards) c.faceUp = false;

        const dealX = CANVAS_WIDTH / 2 - CARD_WIDTH / 2;
        const dealY = CANVAS_HEIGHT / 2 - CARD_HEIGHT / 2;
        for (const h of this.playersHand) {
            for (const c of h) {
                c.x = dealX; c.y = dealY;
                c.scale = 0.2; c.targetScale = 1;
                c.rotation = (Math.random() - 0.5) * 1.2;
                c.setTarget(dealX, dealY);
            }
        }
        for (const c of this.landlordCards) {
            c.x = dealX; c.y = dealY;
            c.scale = 0.2; c.targetScale = 1;
            c.rotation = (Math.random() - 0.5) * 1.2;
            c.setTarget(dealX, dealY);
        }

        this.state = 'idle';
        this.landlordId = -1;
        this.currentPlayer = -1;
        this.lastPlayedCards = [];
        this.lastPlayedBy = -1;
        this.lastPlayInfo = null;
        this.passCount = 0;
        this.callScores = [0, 0, 0];
        this.calledSet = new Set();
        this.grabPhase = false;
        this.grabScores = [0, 0, 0];
        this.grabbedSet = new Set();
        this.winner = -1;
        this.message = this.t('dealing');
        this.messageTimer = 90;
        this.tableCards = [[], [], []];
        this.tablePassed = [false, false, false];

        /* 重置手枪 */
        this.gunUsed = false;
        this.aiming = false;
        this.deadPlayers = [false, false, false];
        this.shotEffects = [];

        for (let i = 0; i < 3; i++)
            this.playersHand[i].sort((a, b) => a.rank - b.rank || a.suit - b.suit);
        this.landlordCards.sort((a, b) => a.rank - b.rank || a.suit - b.suit);

        this._layoutAllCards(false);

        this.aiTimer = setTimeout(() => {
            this.aiTimer = null;
            if (this.state === 'idle') this.startCallingPhase();
        }, 1200);
    }

    /* ───────── 布局 ───────── */
    _layoutAllCards(snap = true) {
        const hand0 = this.playersHand[0];
        const n0 = hand0.length;
        if (n0) {
            const maxW = CANVAS_WIDTH - 240;
            let sp0 = 46;
            if (n0 > 1 && (n0 - 1) * sp0 + CARD_WIDTH > maxW)
                sp0 = (maxW - CARD_WIDTH) / (n0 - 1);
            if (n0 > 1 && sp0 < 18) sp0 = (maxW - CARD_WIDTH) / (n0 - 1);
            const totalW0 = n0 > 1 ? (n0 - 1) * sp0 + CARD_WIDTH : CARD_WIDTH;
            const startX0 = (CANVAS_WIDTH - totalW0) / 2;
            const baseY0 = 548;
            const maxA = n0 > 1 ? Math.min(0.11, n0 * 0.007) : 0;
            for (let i = 0; i < n0; i++) {
                const t = n0 > 1 ? (i - (n0 - 1) / 2) / ((n0 - 1) / 2) : 0;
                const c = hand0[i];
                c.setTarget(startX0 + i * sp0, baseY0 + Math.abs(t) * 12, t * maxA, 1);
                if (snap) c.snapToTarget();
            }
        }

        const hand1 = this.playersHand[1];
        const n1 = hand1.length;
        if (n1) {
            const sp1 = n1 > 14 ? 17 : 21;
            const maxA1 = n1 > 1 ? Math.min(0.09, n1 * 0.006) : 0;
            for (let i = 0; i < n1; i++) {
                const t = n1 > 1 ? (i - (n1 - 1) / 2) / ((n1 - 1) / 2) : 0;
                const c = hand1[i];
                c.setTarget(22 + i * sp1, 82 + Math.abs(t) * 8, t * maxA1, 0.6);
                if (snap) c.snapToTarget();
            }
        }

        const hand2 = this.playersHand[2];
        const n2 = hand2.length;
        if (n2) {
            const sp2 = n2 > 14 ? 17 : 21;
            const visW = CARD_WIDTH * 0.6;
            const totalW2 = (n2 - 1) * sp2 + visW;
            const startX2 = CANVAS_WIDTH - 22 - totalW2 + (CARD_WIDTH - visW) / 2;
            const maxA2 = n2 > 1 ? Math.min(0.09, n2 * 0.006) : 0;
            for (let i = 0; i < n2; i++) {
                const t = n2 > 1 ? (i - (n2 - 1) / 2) / ((n2 - 1) / 2) : 0;
                const c = hand2[i];
                c.setTarget(startX2 + i * sp2, 82 + Math.abs(t) * 8, t * maxA2, 0.6);
                if (snap) c.snapToTarget();
            }
        }

        const n3 = this.landlordCards.length;
        if (n3) {
            const sp3 = 52;
            const totalW3 = (n3 - 1) * sp3 + CARD_WIDTH;
            const startX3 = (CANVAS_WIDTH - totalW3) / 2;
            for (let i = 0; i < n3; i++) {
                const c = this.landlordCards[i];
                c.setTarget(startX3 + i * sp3, 16, 0, 0.82);
                if (snap) c.snapToTarget();
            }
        }

        this._layoutTableCards(snap);
    }

    _layoutTableCards(snap = true) {
        for (let pid = 0; pid < 3; pid++) {
            const cards = this.tableCards[pid];
            if (!cards || !cards.length) continue;
            const zone = this._tableZone(pid);
            const n = cards.length;
            const sc = 0.74;
            const visW = CARD_WIDTH * sc;
            const centerX = zone.x + zone.w / 2;
            const centerY = zone.y + zone.h / 2;
            let sp;
            if (n === 1) sp = 0;
            else sp = Math.min(visW * 0.72, (zone.w - 30 - visW) / (n - 1));
            const totalVisW = (n - 1) * sp + visW;
            const startCX = centerX - totalVisW / 2 + visW / 2;
            for (let i = 0; i < n; i++) {
                const c = cards[i];
                c.selected = false;
                c.setTarget(startCX + i * sp - CARD_WIDTH / 2, centerY - CARD_HEIGHT / 2, 0, sc);
                if (snap) c.snapToTarget();
            }
        }
    }

    /* ───────── 叫地主 ───────── */
    startCallingPhase() {
        this.state = 'calling';
        this.callScores = [0, 0, 0];
        this.calledSet = new Set();

        const alive = [0, 1, 2].filter(p => !this.deadPlayers[p]);
        if (!alive.length) { return; }
        this.callStartPlayer = alive[Math.floor(Math.random() * alive.length)];
        this.callCurrent = this.callStartPlayer;
        this.grabPhase = false;
        this.message = '';
        this.messageTimer = 0;
        this._processCurrentCaller();
    }

    _processCurrentCaller() {
        if (this.state !== 'calling') return;
        if (this.deadPlayers[this.callCurrent]) {
            this._advanceCalling();
            return;
        }
        this.currentPlayer = this.callCurrent;
        if (this.callCurrent === 0) { this.message = ''; }
        else this._aiCallLandlord(this.callCurrent);
    }

    _aiCallLandlord(pid) {
        const ai = this.aiPlayers[pid];
        const score = this._evaluateHandStrength(ai.hand);
        const th = this.difficulty === 'easy' ? 42 : (this.difficulty === 'normal' ? 32 : 22);
        const noOneYet = this.callScores.every(s => s === 0);
        if (score > th || (noOneYet && score > 16)) {
            let cs = 1;
            if (this.difficulty === 'hard' && score > 62) cs = Math.min(3, 1 + Math.floor(score / 30));
            else if (this.difficulty === 'normal' && score > 52) cs = 2;
            this.callScores[pid] = cs;
            this.message = `AI ${pid} · ${this.t('call_landlord')} ${cs}`;
        } else {
            this.callScores[pid] = 0;
            this.message = `AI ${pid} · ${this.t('no_call')}`;
        }
        this.messageTimer = 60;
        this.aiTimer = setTimeout(() => this._advanceCalling(), 720 + Math.random() * 400);
    }

    _evaluateHandStrength(hand) {
        if (!hand || !hand.length) return 0;
        const counts = getRankCounts(hand);
        let score = 0;
        const bombs = Object.values(counts).filter(c => c >= 4).length;
        score += bombs * 16;
        if (counts[16] && counts[17]) score += 26;
        else if (counts[16] || counts[17]) score += 9;
        for (const r of [15, 14, 13, 12]) if (counts[r]) score += counts[r] * 3;
        const ranks = [...new Set(hand.map(c => c.rank).filter(r => r <= 14))].sort((a, b) => a - b);
        let consec = 0, maxC = 0;
        for (let i = 0; i < ranks.length - 1; i++) {
            if (ranks[i + 1] - ranks[i] === 1) { consec++; maxC = Math.max(maxC, consec); }
            else consec = 0;
        }
        score += maxC * 5;
        score += Object.values(counts).filter(c => c >= 3).length * 8;
        score += Object.values(counts).filter(c => c >= 2).length * 2;
        return Math.min(100, score);
    }

    _advanceCalling() {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.calledSet) this.calledSet.add(this.callCurrent);

        let next = this.callCurrent;
        let found = false;
        for (let i = 0; i < 3; i++) {
            next = (next + 1) % 3;
            if (!this.deadPlayers[next] && !this.calledSet.has(next)) {
                found = true;
                break;
            }
        }
        if (!found) {
            this._resolveCalling();
        } else {
            this.callCurrent = next;
            this._processCurrentCaller();
        }
    }

    _resolveCalling() {
        const maxS = Math.max(...this.callScores);
        if (maxS === 0) {
            this.message = this.t('no_one_call');
            this.messageTimer = 90;
            this.aiTimer = setTimeout(() => { this.initNewGame(); }, 1500);
            return;
        }
        const cands = [];
        for (let i = 0; i < 3; i++) {
            if (this.deadPlayers[i]) continue;
            if (this.callScores[i] === maxS) cands.push(i);
        }
        if (!cands.length) {
            this.message = this.t('no_one_call');
            this.messageTimer = 90;
            this.aiTimer = setTimeout(() => { this.initNewGame(); }, 1500);
            return;
        }
        if (cands.length === 1) this._setLandlord(cands[0]);
        else this._startGrabPhase(cands);
    }

    _startGrabPhase(cands) {
        this.state = 'grabbing';
        this.grabPhase = true;
        this.grabScores = [0, 0, 0];
        this.grabbedSet = new Set();

        let start = (cands[0] + 1) % 3;
        let found = false;
        for (let i = 0; i < 3; i++) {
            if (!this.deadPlayers[start]) { found = true; break; }
            start = (start + 1) % 3;
        }
        if (!found) { this._resolveGrabbing(); return; }

        this.grabStart = start;
        this.grabCurrent = start;
        this._processGrabber();
    }

    _processGrabber() {
        if (this.state !== 'grabbing') return;
        if (this.deadPlayers[this.grabCurrent]) {
            this._advanceGrabbing();
            return;
        }
        if (this.grabCurrent === 0) { this.currentPlayer = 0; this.message = ''; }
        else this._aiGrabLandlord(this.grabCurrent);
    }

    _aiGrabLandlord(pid) {
        const ai = this.aiPlayers[pid];
        const score = this._evaluateHandStrength(ai.hand);
        const th = this.difficulty === 'easy' ? 52 : (this.difficulty === 'normal' ? 42 : 32);
        if (score > th) {
            this.grabScores[pid] = (this.callScores[pid] || 1) + 1;
            this.message = `AI ${pid} · ${this.t('grab_landlord')}!`;
        } else {
            this.grabScores[pid] = 0;
            this.message = `AI ${pid} · ${this.t('no_grab')}`;
        }
        this.messageTimer = 60;
        this.aiTimer = setTimeout(() => this._advanceGrabbing(), 720 + Math.random() * 400);
    }

    _advanceGrabbing() {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.grabbedSet) this.grabbedSet.add(this.grabCurrent);

        let next = this.grabCurrent;
        let found = false;
        for (let i = 0; i < 3; i++) {
            next = (next + 1) % 3;
            if (!this.deadPlayers[next] && !this.grabbedSet.has(next)) {
                found = true;
                break;
            }
        }
        if (!found) {
            this._resolveGrabbing();
        } else {
            this.grabCurrent = next;
            this._processGrabber();
        }
    }

    _resolveGrabbing() {
        const all = [];
        for (let i = 0; i < 3; i++) {
            if (this.deadPlayers[i]) continue;
            if (this.grabScores[i] > 0) all.push([i, this.grabScores[i]]);
            else if (this.callScores[i] > 0) all.push([i, this.callScores[i]]);
        }
        if (!all.length) {
            this.message = this.t('no_one_grab');
            this.messageTimer = 90;
            this.aiTimer = setTimeout(() => { this.initNewGame(); }, 1500);
            return;
        }
        all.sort((a, b) => b[1] - a[1]);
        this._setLandlord(all[0][0]);
    }

    _setLandlord(pid) {
        this.landlordId = pid;
        this.aiPlayers[1].isLandlord = (pid === 1);
        this.aiPlayers[2].isLandlord = (pid === 2);

        for (const c of this.landlordCards) {
            c.faceUp = true;
            this.playersHand[pid].push(c);
        }
        if (pid !== 0) this.aiPlayers[pid].hand = [...this.playersHand[pid]];

        this.playersHand[pid].sort((a, b) => a.rank - b.rank || a.suit - b.suit);
        if (pid !== 0) this.aiPlayers[pid].hand.sort((a, b) => a.rank - b.rank || a.suit - b.suit);

        this._clearTable();
        this._layoutAllCards(false);

        this.state = 'playing';
        this.currentPlayer = pid;
        this.lastPlayedCards = [];
        this.lastPlayedBy = -1;
        this.lastPlayInfo = null;
        this.passCount = 0;
        this.message = `${pid === 0 ? this.t('you') : 'AI ' + pid} · ${this.t('landlord')}`;
        this.messageTimer = 80;

        if (pid !== 0) this._scheduleAI(pid, 1200);
    }

    _clearTable() {
        for (let i = 0; i < 3; i++) {
            this.tableCards[i] = [];
            this.tablePassed[i] = false;
        }
    }

    /* ───────── AI 调度 ───────── */
    _scheduleAI(pid, extra = 0) {
        if (this.state !== 'playing') return;
        if (pid === 0) return;
        if (this.deadPlayers[pid]) return;
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        this.thinkingPid = pid;
        this.aiTimer = setTimeout(() => {
            this.aiTimer = null;
            this.thinkingPid = -1;
            this._aiTurnIfNeeded();
        }, this._aiDelay() + extra);
    }

    _aiTurnIfNeeded() {
        if (this.state === 'playing' && this.currentPlayer !== 0 && !this.deadPlayers[this.currentPlayer])
            this._aiTurn(this.currentPlayer);
    }

    _aiTurn(pid) {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.state !== 'playing') return;
        if (this.deadPlayers[pid]) {
            this.currentPlayer = this._getNextPlayer(pid);
            this._scheduleAI(this.currentPlayer, 300);
            return;
        }
        this.currentPlayer = pid;
        const ai = this.aiPlayers[pid];
        if (!ai || !this.playersHand[pid].length) { this._aiPass(pid); return; }

        let cards = null;
        try { cards = ai.findPlay(this); } catch (e) { cards = null; }

        if (cards && cards.length) {
            const info = analyzeHand(cards);
            if (info && canBeat(info, this.lastPlayInfo)) {
                this._commitPlay(pid, cards, info);
                return;
            }
        }
        this._aiPass(pid);
    }

    _commitPlay(pid, cards, info) {
        const ai = this.aiPlayers[pid];
        for (const c of cards) {
            if (ai) { const i1 = ai.hand.indexOf(c); if (i1 >= 0) ai.hand.splice(i1, 1); }
            const i2 = this.playersHand[pid].indexOf(c);
            if (i2 >= 0) this.playersHand[pid].splice(i2, 1);
            c.faceUp = true;
            c.selected = false;
        }
        this.lastPlayedCards = cards;
        this.lastPlayedBy = pid;
        this.lastPlayInfo = info;
        this.passCount = 0;
        this.tableCards[pid] = cards;
        this.tablePassed[pid] = false;

        this._layoutAllCards(false);
        this._layoutTableCards(false);

        this.message = `AI ${pid} · ${this.t('ai_play')}`;
        this.messageTimer = 45;

        if (this.playersHand[pid].length === 0) { this._gameOver(pid); return; }
        this.currentPlayer = this._getNextPlayer(pid);
        this._scheduleAI(this.currentPlayer, 300);
    }

    _aiPass(pid) {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.state !== 'playing') return;
        this.thinkingPid = -1;

        if (!this.lastPlayInfo) {
            const ai = this.aiPlayers[pid];
            if (ai && ai.hand.length) {
                const sorted = [...ai.hand].sort((a, b) => a.rank - b.rank);
                const card = sorted[0];
                const info = analyzeHand([card]);
                if (info) { this._commitPlay(pid, [card], info); return; }
            }
        }

        this.passCount++;
        this.tableCards[pid] = [];
        this.tablePassed[pid] = true;
        this.message = `AI ${pid} · ${this.t('ai_pass')}`;
        this.messageTimer = 45;

        if (this.passCount >= 2) {
            this.lastPlayedCards = [];
            this.lastPlayedBy = -1;
            this.lastPlayInfo = null;
            this.passCount = 0;
            this._clearTable();
            this.currentPlayer = this._getNextPlayer(this.currentPlayer);
            if (this.currentPlayer === 0) {
                this.message = this.t('new_round');
                this.messageTimer = 70;
            } else {
                this._scheduleAI(this.currentPlayer, 400);
            }
        } else {
            this.currentPlayer = this._getNextPlayer(pid);
            this._scheduleAI(this.currentPlayer, 350);
        }
    }

    /* 跳过死者 */
    _getNextPlayer(pid) {
        let next = pid;
        for (let i = 0; i < 3; i++) {
            next = (next + 1) % 3;
            if (!this.deadPlayers[next]) return next;
        }
        return pid;
    }

    /* ───────── 玩家操作 ───────── */
    playerPlayCards(selected) {
        if (this.currentPlayer !== 0 || this.state !== 'playing') return false;
        const info = analyzeHand(selected);
        if (!info) { this.message = this.t('invalid_play'); this.messageTimer = 55; return false; }
        if (!canBeat(info, this.lastPlayInfo)) { this.message = this.t('cant_beat'); this.messageTimer = 55; return false; }

        for (const c of selected) {
            const idx = this.playersHand[0].indexOf(c);
            if (idx >= 0) this.playersHand[0].splice(idx, 1);
        }
        this.lastPlayedCards = selected;
        this.lastPlayedBy = 0;
        this.lastPlayInfo = info;
        this.passCount = 0;
        for (const c of this.playersHand[0]) c.selected = false;

        this.tableCards[0] = selected;
        this.tablePassed[0] = false;

        this._layoutAllCards(false);
        this._layoutTableCards(false);
        this.message = '';
        this.messageTimer = 0;

        if (this.playersHand[0].length === 0) { this._gameOver(0); return true; }
        this.currentPlayer = this._getNextPlayer(0);
        this._scheduleAI(this.currentPlayer, 350);
        return true;
    }

    playerPass() {
        if (this.currentPlayer !== 0 || this.state !== 'playing') return;
        if (!this.lastPlayInfo) { this.message = this.t('must_play'); this.messageTimer = 55; return; }
        this.passCount++;
        this.tableCards[0] = [];
        this.tablePassed[0] = true;
        this.message = this.t('pass');
        this.messageTimer = 40;

        if (this.passCount >= 2) {
            this.lastPlayedCards = [];
            this.lastPlayedBy = -1;
            this.lastPlayInfo = null;
            this.passCount = 0;
            this._clearTable();
            this.currentPlayer = this._getNextPlayer(this.currentPlayer);
            if (this.currentPlayer !== 0) this._scheduleAI(this.currentPlayer, 400);
            else { this.message = this.t('new_round'); this.messageTimer = 70; }
        } else {
            this.currentPlayer = this._getNextPlayer(0);
            this._scheduleAI(this.currentPlayer, 350);
        }
    }

    /* ═══════════ 手枪逻辑 ═══════════ */
    _shootPlayer(pid) {
        if (this.gunUsed || pid === 0 || pid === -1 || this.deadPlayers[pid]) return false;
        if (this.state === 'ended') return false;

        this.gunUsed = true;
        this.aiming = false;
        this.deadPlayers[pid] = true;

        this.callScores[pid] = 0;
        this.grabScores[pid] = 0;
        this.tableCards[pid] = [];
        this.tablePassed[pid] = false;

        /* 击毙特效位置 */
        const panel = pid === 1 ? PANEL_AI1 : PANEL_AI2;
        this.shotEffects.push({
            x: panel.x + panel.w / 2,
            y: panel.y + panel.h / 2,
            t: 65, maxT: 65
        });

        /* 地主被击毙 → 游戏结束（农民胜） */
        if (this.landlordId === pid) {
            if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
            this.thinkingPid = -1;
            this.message = this.t('shot_kill_landlord');
            this.messageTimer = 200;
            this._gameOver(-2);
            return true;
        }

        this.message = this.t('shot_ok');
        this.messageTimer = 90;

        /* 判断是否需要立即推进 */
        let needAdvance = false;
        if (this.state === 'calling' && this.callCurrent === pid) needAdvance = true;
        else if (this.state === 'grabbing' && this.grabCurrent === pid) needAdvance = true;
        else if (this.state === 'playing' && this.currentPlayer === pid) needAdvance = true;
        else if (this.thinkingPid === pid) needAdvance = true;

        if (needAdvance) {
            if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
            this.thinkingPid = -1;

            if (this.state === 'calling') {
                if (this.calledSet) this.calledSet.add(pid);
                this._advanceCalling();
            } else if (this.state === 'grabbing') {
                if (this.grabbedSet) this.grabbedSet.add(pid);
                this._advanceGrabbing();
            } else if (this.state === 'playing') {
                this.currentPlayer = this._getNextPlayer(pid);
                if (this.currentPlayer === 0) {
                    this.message = this.t('your_turn');
                    this.messageTimer = 80;
                } else {
                    this._scheduleAI(this.currentPlayer, 500);
                }
            }
        }
        return true;
    }

    _gameOver(wid) {
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        this.thinkingPid = -1;
        this.state = 'ended';
        this.winner = wid;

        let humanWin;
        if (wid === 0) humanWin = true;
        else if (wid === -2) humanWin = (this.landlordId !== 0);
        else {
            const winnerIsLandlord = (wid === this.landlordId);
            if (this.landlordId === 0) humanWin = winnerIsLandlord;
            else humanWin = !winnerIsLandlord;
        }

        this.message = humanWin ? this.t('you_win') : this.t('you_lose');
        this.messageTimer = 9999;

        for (const h of this.playersHand) for (const c of h) c.faceUp = true;
        for (const c of this.landlordCards) c.faceUp = true;
    }

    /* ───────── 更新 ───────── */
    update() {
        this._tick++;
        const all = [];
        for (const h of this.playersHand) all.push(...h);
        all.push(...this.landlordCards);
        const seen = new Set(all);
        for (let p = 0; p < 3; p++)
            for (const c of this.tableCards[p]) if (!seen.has(c)) { seen.add(c); all.push(c); }
        for (const c of all) c.updatePosition();

        for (let i = this.shotEffects.length - 1; i >= 0; i--) {
            this.shotEffects[i].t--;
            if (this.shotEffects[i].t <= 0) this.shotEffects.splice(i, 1);
        }
        if (this.messageTimer > 0 && this.messageTimer < 9000) this.messageTimer--;
    }

    /* ═══════════════════════════════════════
       绘制
       ═══════════════════════════════════════ */
    draw(ctx) {
        this._drawBackground(ctx);
        this._drawTable(ctx);
        this._drawTableZones(ctx);
        this._drawBottomCards(ctx);
        this._drawAIPanels(ctx);
        this._drawHands(ctx);
        this._drawPlayerLabel(ctx);
        if (this.state === 'idle' || this.state === 'ended') this._drawTitle(ctx);
        this._drawGear(ctx);
        this._drawMessage(ctx);
        this._drawButtons(ctx);
        this._drawAimPrompt(ctx);
        this._drawShotEffects(ctx);
        this._drawCrosshair(ctx);
    }

    _drawBackground(ctx) {
        const g = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
        g.addColorStop(0, '#16294a');
        g.addColorStop(0.45, '#0c1728');
        g.addColorStop(1, '#05090f');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.save();
        ctx.strokeStyle = 'rgba(80,130,200,.05)';
        ctx.lineWidth = 1;
        const vpx = CANVAS_WIDTH / 2, vpy = 300;
        for (let i = -14; i <= 14; i++) {
            ctx.beginPath();
            ctx.moveTo(vpx + i * 130, CANVAS_HEIGHT + 120);
            ctx.lineTo(vpx + i * 26, vpy);
            ctx.stroke();
        }
        for (let k = 1; k <= 7; k++) {
            const t = k / 7;
            const y = vpy + (CANVAS_HEIGHT + 120 - vpy) * Math.pow(t, 2.1);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(CANVAS_WIDTH, y);
            ctx.stroke();
        }
        ctx.restore();

        ctx.save();
        for (let i = 0; i < 46; i++) {
            const px = (i * 137.508) % CANVAS_WIDTH;
            const py = (i * 219.31) % (CANVAS_HEIGHT * 0.6);
            const a = 0.025 + 0.05 * Math.abs(Math.sin((this._tick + i * 40) / 130));
            ctx.fillStyle = `rgba(170,210,255,${a})`;
            ctx.beginPath();
            ctx.arc(px, py, 1.3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();

        const vg = ctx.createRadialGradient(
            CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 40, 200,
            CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 780
        );
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,.62)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    }

    _drawTable(ctx) {
        const cx = CANVAS_WIDTH / 2, cy = 350, rx = 468, ry = 188;

        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        ctx.filter = 'blur(18px)';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 40, rx + 30, ry + 26, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        const sideG = ctx.createLinearGradient(0, cy, 0, cy + ry + 60);
        sideG.addColorStop(0, '#3a2a18');
        sideG.addColorStop(0.4, '#241a10');
        sideG.addColorStop(1, '#0d0906');
        ctx.fillStyle = sideG;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 24, rx + 8, ry + 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        const rimG = ctx.createLinearGradient(0, cy - ry, 0, cy + ry);
        rimG.addColorStop(0, '#6b4a28');
        rimG.addColorStop(0.35, '#4a3218');
        rimG.addColorStop(1, '#2a1c0e');
        ctx.fillStyle = rimG;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        const feltG = ctx.createRadialGradient(cx, cy - 78, 24, cx, cy + 10, rx);
        feltG.addColorStop(0, '#3ea370');
        feltG.addColorStop(0.42, '#237a4a');
        feltG.addColorStop(0.78, '#145233');
        feltG.addColorStop(1, '#0a3520');
        ctx.fillStyle = feltG;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx - 16, ry - 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        for (let i = 0; i < 3; i++) {
            ctx.strokeStyle = `rgba(255,235,170,${0.10 - i * 0.026})`;
            ctx.lineWidth = i === 0 ? 2.2 : 1;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx - 34 - i * 56, ry - 30 - i * 40, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.16;
        const hg = ctx.createRadialGradient(cx - 130, cy - 110, 10, cx - 130, cy - 110, 340);
        hg.addColorStop(0, 'rgba(255,255,255,.9)');
        hg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx - 16, ry - 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.05;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 130px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♠', cx - 195, cy + 10);
        ctx.fillText('♥', cx + 195, cy + 10);
        ctx.globalAlpha = 0.065;
        ctx.font = 'bold 100px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.fillText('斗', cx, cy - 26);
        ctx.globalAlpha = 0.10;
        ctx.font = 'bold 22px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.fillText('D O U   D I   Z H U', cx, cy + 46);
        ctx.restore();
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
    }

    _drawTableZones(ctx) {
        for (let pid = 0; pid < 3; pid++) {
            const zone = this._tableZone(pid);
            const cards = this.tableCards[pid];
            const passed = this.tablePassed[pid];
            const hasCards = cards && cards.length;
            if (!hasCards && !passed) continue;

            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,.20)';
            this._roundRect(ctx, zone.x, zone.y, zone.w, zone.h, 14);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.06)';
            ctx.lineWidth = 1;
            this._roundRect(ctx, zone.x, zone.y, zone.w, zone.h, 14);
            ctx.stroke();
            ctx.restore();

            if (hasCards) for (const c of cards) c.draw(ctx, this.lang);

            if (passed && !hasCards) {
                const label = this.t('pass');
                ctx.save();
                ctx.font = 'bold 17px "Microsoft YaHei","PingFang SC",sans-serif';
                const tw = ctx.measureText(label).width;
                const bx = zone.x + zone.w / 2 - tw / 2 - 16;
                const by = zone.y + zone.h / 2 - 17;
                ctx.fillStyle = 'rgba(0,0,0,.42)';
                this._roundRect(ctx, bx, by, tw + 32, 34, 17);
                ctx.fill();
                ctx.strokeStyle = 'rgba(200,210,230,.35)';
                ctx.lineWidth = 1.2;
                this._roundRect(ctx, bx, by, tw + 32, 34, 17);
                ctx.stroke();
                ctx.fillStyle = '#c8d4e8';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, zone.x + zone.w / 2, zone.y + zone.h / 2);
                ctx.restore();
                ctx.textAlign = 'start';
                ctx.textBaseline = 'alphabetic';
            }

            if (this.thinkingPid === pid && this.state === 'playing') {
                const dots = '.'.repeat(1 + (Math.floor(this._tick / 18) % 3));
                const label = this.t('thinking') + dots;
                ctx.save();
                ctx.font = 'bold 14px "Microsoft YaHei","PingFang SC",sans-serif';
                const tw = ctx.measureText(label).width;
                const bx = zone.x + zone.w / 2 - tw / 2 - 14;
                const by = zone.y - 26;
                ctx.fillStyle = 'rgba(20,40,70,.88)';
                this._roundRect(ctx, bx, by, tw + 28, 24, 12);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,215,64,.45)';
                ctx.lineWidth = 1;
                this._roundRect(ctx, bx, by, tw + 28, 24, 12);
                ctx.stroke();
                ctx.fillStyle = '#ffd740';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, zone.x + zone.w / 2, by + 12);
                ctx.restore();
                ctx.textAlign = 'start';
                ctx.textBaseline = 'alphabetic';
            }
        }
    }

    _drawBottomCards(ctx) {
        const n = this.landlordCards.length;
        if (!n) return;
        const sp3 = 52;
        const totalW = (n - 1) * sp3 + CARD_WIDTH;
        const sx = (CANVAS_WIDTH - totalW) / 2;
        const by = 8;

        ctx.save();
        ctx.fillStyle = 'rgba(8,16,30,.62)';
        this._roundRect(ctx, sx - 30, by, totalW + 60, 106, 12);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,215,64,.22)';
        ctx.lineWidth = 1.2;
        this._roundRect(ctx, sx - 30, by, totalW + 60, 106, 12);
        ctx.stroke();
        ctx.restore();

        for (const c of this.landlordCards) c.draw(ctx, this.lang);

        ctx.save();
        ctx.fillStyle = 'rgba(255,215,64,.8)';
        ctx.font = 'bold 11px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.t('bottom_cards'), sx - 30, by + 58);
        ctx.restore();
        ctx.textAlign = 'start';
    }

    _drawAIPanels(ctx) {
        const panels = [
            { id: 1, ...PANEL_AI1, name: this.t('ai1') },
            { id: 2, ...PANEL_AI2, name: this.t('ai2') }
        ];
        for (const p of panels) {
            const w = p.w, h = p.h;
            const isLandlord = this.landlordId === p.id;
            const isDead = this.deadPlayers[p.id];
            const isTurn = !isDead && (this.currentPlayer === p.id) &&
                (this.state === 'playing' || this.state === 'calling' || this.state === 'grabbing');

            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,.5)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 4;
            const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + h);
            if (isDead) {
                g.addColorStop(0, 'rgba(28,28,32,.92)');
                g.addColorStop(1, 'rgba(14,14,18,.92)');
            } else if (isTurn) {
                g.addColorStop(0, 'rgba(60,105,170,.95)');
                g.addColorStop(1, 'rgba(34,62,108,.95)');
            } else {
                g.addColorStop(0, 'rgba(26,42,68,.92)');
                g.addColorStop(1, 'rgba(15,26,44,.92)');
            }
            ctx.fillStyle = g;
            this._roundRect(ctx, p.x, p.y, w, h, 14);
            ctx.fill();
            ctx.restore();

            if (this.aiming && !isDead) {
                const pulse = 0.5 + 0.5 * Math.sin(this._tick / 8);
                ctx.strokeStyle = `rgba(255,60,60,${0.4 + pulse * 0.6})`;
                ctx.lineWidth = 3;
                this._roundRect(ctx, p.x, p.y, w, h, 14);
                ctx.stroke();
            } else {
                ctx.strokeStyle = isDead ? 'rgba(180,60,60,.55)'
                                : isTurn ? '#ffd740' : 'rgba(120,165,235,.32)';
                ctx.lineWidth = isTurn ? 2 : 1.2;
                this._roundRect(ctx, p.x, p.y, w, h, 14);
                ctx.stroke();
            }

            /* 头像 */
            const ax = p.x + 30, ay = p.y + h / 2;
            const ag = ctx.createRadialGradient(ax - 5, ay - 6, 2, ax, ay, 21);
            if (isDead) { ag.addColorStop(0, '#3a3a40'); ag.addColorStop(1, '#1a1a1e'); }
            else if (isLandlord) { ag.addColorStop(0, '#f0c34a'); ag.addColorStop(1, '#9a7110'); }
            else { ag.addColorStop(0, '#7092c6'); ag.addColorStop(1, '#334c78'); }
            ctx.fillStyle = ag;
            ctx.beginPath();
            ctx.arc(ax, ay, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = isDead ? 'rgba(150,60,60,.6)'
                            : isLandlord ? '#ffd740' : 'rgba(200,220,255,.45)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = '15px "Segoe UI Symbol",sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isDead ? '✕' : (isLandlord ? '👑' : '🤖'), ax, ay + 1);

            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';

            if (isDead) {
                ctx.fillStyle = '#ff8080';
                ctx.font = 'bold 15px "Microsoft YaHei","PingFang SC",sans-serif';
                ctx.fillText(p.name, p.x + 58, p.y + 24);
                ctx.fillStyle = '#c05050';
                ctx.font = 'bold 14px "Microsoft YaHei","PingFang SC",sans-serif';
                ctx.fillText('☠ ' + this.t('dead'), p.x + 58, p.y + 43);
            } else {
                ctx.fillStyle = isLandlord ? '#ffd740' : '#e6eefc';
                ctx.font = 'bold 15px "Microsoft YaHei","PingFang SC",sans-serif';
                ctx.fillText(p.name + (isLandlord ? ' · ' + this.t('landlord') : ''), p.x + 58, p.y + 24);
                ctx.fillStyle = '#9fb6d8';
                ctx.font = '13px "Microsoft YaHei","PingFang SC",sans-serif';
                ctx.fillText('🂠 ' + this.playersHand[p.id].length + this.t('cards_count'), p.x + 58, p.y + 43);
            }

            if (isTurn) {
                const pulse = 0.5 + 0.5 * Math.sin(this._tick / 12);
                ctx.fillStyle = `rgba(255,215,64,${0.35 + pulse * 0.65})`;
                ctx.beginPath();
                ctx.arc(p.x + w - 14, p.y + 14, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
    }

    _drawHands(ctx) {
        for (let i = 0; i < 3; i++) {
            if (this.deadPlayers[i]) continue;
            for (const c of this.playersHand[i]) c.draw(ctx, this.lang);
        }
    }

    _drawPlayerLabel(ctx) {
        const name = this.t('you') + (this.landlordId === 0 ? ' · ' + this.t('landlord') : '');
        const cnt = this.playersHand[0].length + this.t('cards_count');
        const text = `${name}   ${cnt}`;
        ctx.font = 'bold 16px "Microsoft YaHei","PingFang SC",sans-serif';
        const tw = ctx.measureText(text).width;
        const bx = CANVAS_WIDTH / 2 - tw / 2 - 18;
        const by = 508;

        ctx.fillStyle = 'rgba(8,16,30,.75)';
        this._roundRect(ctx, bx, by, tw + 36, 30, 15);
        ctx.fill();
        ctx.strokeStyle = this.landlordId === 0 ? 'rgba(255,215,64,.6)' : 'rgba(120,165,235,.32)';
        ctx.lineWidth = 1.2;
        this._roundRect(ctx, bx, by, tw + 36, 30, 15);
        ctx.stroke();

        ctx.fillStyle = this.landlordId === 0 ? '#ffd740' : '#dce8fa';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, CANVAS_WIDTH / 2, by + 16);
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';

        if (this.currentPlayer === 0 && this.state === 'playing') {
            const pulse = 0.45 + 0.55 * Math.abs(Math.sin(this._tick / 22));
            ctx.save();
            ctx.globalAlpha = pulse;
            ctx.strokeStyle = '#ffd740';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#ffd740';
            ctx.shadowBlur = 16;
            this._roundRect(ctx, bx, by, tw + 36, 30, 15);
            ctx.stroke();
            ctx.restore();
        }
    }

    _drawTitle(ctx) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = 'bold 34px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.fillStyle = 'rgba(255,190,20,.22)';
        ctx.fillText(this.t('title'), CANVAS_WIDTH / 2 + 2, 100);
        const g = ctx.createLinearGradient(0, 70, 0, 108);
        g.addColorStop(0, '#fff4c4');
        g.addColorStop(0.5, '#ffd740');
        g.addColorStop(1, '#dfa200');
        ctx.fillStyle = g;
        ctx.shadowColor = 'rgba(255,200,40,.6)';
        ctx.shadowBlur = 22;
        ctx.fillText(this.t('title'), CANVAS_WIDTH / 2, 98);
        ctx.restore();
        ctx.textAlign = 'start';
    }

    _drawGear(ctx) {
        const gx = CANVAS_WIDTH - 46, gy = 42, r = 22;
        const hover = Math.hypot(this._mouseX - gx, this._mouseY - gy) < r;
        ctx.save();
        const g = ctx.createRadialGradient(gx - 6, gy - 8, 3, gx, gy, r);
        if (hover) { g.addColorStop(0, '#5f8bc9'); g.addColorStop(1, '#2f5488'); }
        else { g.addColorStop(0, '#2c3f5c'); g.addColorStop(1, '#16202f'); }
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(gx, gy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = hover ? '#ffd740' : 'rgba(150,180,225,.42)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = hover ? '#ffd740' : '#b8cae4';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(gx, gy, 6.5, 0, Math.PI * 2);
        ctx.stroke();
        for (let a = 0; a < 360; a += 45) {
            const rad = a * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(gx + Math.cos(rad) * 9, gy + Math.sin(rad) * 9);
            ctx.lineTo(gx + Math.cos(rad) * 14, gy + Math.sin(rad) * 14);
            ctx.stroke();
        }
        ctx.restore();
    }

    _drawMessage(ctx) {
        if (!this.message || this.messageTimer <= 0) return;
        const alpha = this.messageTimer > 9000 ? 1 : Math.min(1, this.messageTimer / 40);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = 'bold 21px "Microsoft YaHei","PingFang SC",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(this.message).width;
        const bw = tw + 58, bh = 50;
        const bx = CANVAS_WIDTH / 2 - bw / 2;
        const by = CANVAS_HEIGHT / 2 + 58;

        ctx.shadowColor = 'rgba(0,0,0,.65)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 5;
        ctx.fillStyle = 'rgba(6,14,26,.86)';
        this._roundRect(ctx, bx, by, bw, bh, bh / 2);
        ctx.fill();
        ctx.shadowColor = 'transparent';

        const isWin = this.state === 'ended' && (this.message.includes('赢') || this.message.includes('Win'));
        const isLose = this.state === 'ended' && !isWin;
        ctx.strokeStyle = isWin ? 'rgba(120,240,150,.85)'
                       : isLose ? 'rgba(255,120,120,.8)'
                       : 'rgba(255,215,64,.68)';
        ctx.lineWidth = 2;
        this._roundRect(ctx, bx, by, bw, bh, bh / 2);
        ctx.stroke();

        const tg = ctx.createLinearGradient(0, by, 0, by + bh);
        if (isWin) { tg.addColorStop(0, '#c2ffd8'); tg.addColorStop(1, '#4ce07a'); }
        else if (isLose) { tg.addColorStop(0, '#ffd6d6'); tg.addColorStop(1, '#ff7b7b'); }
        else { tg.addColorStop(0, '#fff6cc'); tg.addColorStop(1, '#ffd740'); }
        ctx.fillStyle = tg;
        ctx.fillText(this.message, CANVAS_WIDTH / 2, by + bh / 2 + 1);
        ctx.restore();
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
    }
