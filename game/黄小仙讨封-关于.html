<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>关于 · 黄小仙讨封</title>
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #C0C0C0;
            --golden: #D4AF37;
            --bronze: #8B7355;
            --highlight-color: #FFFFFF;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            line-height: 1.8; min-height: 100vh; width: 100vw;
            padding: 30px 20px; overflow-x: hidden; -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(ellipse at 50% 30%, rgba(139, 115, 85, 0.06) 0%, transparent 60%), radial-gradient(ellipse at 50% 80%, rgba(139, 115, 85, 0.04) 0%, transparent 60%);
        }
        .page-header { text-align:center; margin-bottom:40px; }
        .page-header .icon { font-size:40px; color:var(--golden); margin-bottom:12px; animation: goldenPulse 3s ease-in-out infinite; }
        @keyframes goldenPulse { 0%,100%{opacity:0.65;}50%{opacity:1;} }
        .page-header h1 { color:var(--highlight-color); font-size:26px; font-weight:300; letter-spacing:4px; margin-bottom:6px; text-shadow:0 0 3px rgba(255,255,255,0.15); }
        .page-header .divider { width:80px; height:1px; background:linear-gradient(to right,transparent,var(--bronze),transparent); margin:0 auto; }
        .content-box {
            max-width: 680px; margin: 0 auto 40px; padding: 25px;
            border: 1px solid #1a1a1a; border-radius: 4px; background: rgba(10, 10, 10, 0.7);
        }
        .content-box h2 { color:var(--golden); font-size:20px; margin-bottom:15px; letter-spacing:2px; }
        .content-box p { margin-bottom:12px; font-size:15px; color:#aaa; }
        .content-box .highlight { color:var(--golden); font-weight:bold; }
        .action-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            color: #888; text-decoration: none; font-size: 17px; letter-spacing: 2px;
            padding: 16px 36px; border: 1px solid #333; border-radius: 3px; cursor: pointer;
            background: transparent; transition: all 0.3s ease; margin: 20px auto 0;
        }
        .action-btn .btn-icon { font-size: 20px; color: var(--bronze); transition: all 0.3s ease; }
        .action-btn:hover { color: var(--golden); border-color: var(--bronze); background: rgba(139, 115, 85, 0.08); }
        .action-btn:hover .btn-icon { color: var(--golden); transform: translateX(3px); }
        .footer-hint { text-align:center; font-size:12px; color:#444; margin-top:40px; letter-spacing:1px; }
    </style>
</head>
<!-- 🔴 唯一一次webapp指令，和升维公告完全一致 -->
<script>
    webapp.关闭跳转打开(false);
    webapp.设置下拉刷新(false);
    webapp.清空浏览记录();
</script>
<body>
    <div class="page-header">
        <span class="icon">✦</span>
        <h1>关于黄小仙讨封</h1>
        <div class="divider"></div>
    </div>

    <div class="content-box">
        <h2>仙府志异</h2>
        <p>本仙居深山五百载，修得人形，今开仙府广纳道友，共参长生大道。</p>
        <p>仙府已迭代至<span class="highlight">V1.2.0版本</span>，新增灵韵流转、浊念净化之能，候门仙友可享专属加成。</p>
        <p class="version-tag">当前版本：V1.1.0 · 五百年修为一念之间</p>
    </div>

    <div class="content-box">
        <h2>合规告示</h2>
        <p>本游戏为修仙模拟产品，不含任何现实赌博、付费诱导内容。</p>
        <p>健康游戏忠告：抵制不良游戏，拒绝盗版游戏；注意自我保护，谨防受骗上当；适度游戏益脑，沉迷游戏伤身；合理安排时间，享受健康生活。</p>
        <p>版权所有 © 2026 软软的小窝 · 黄小仙讨封项目组</p>
    </div>

    <div style="text-align:center;">
        <button class="action-btn" id="backBtn">
            <span class="btn-icon">➤</span>
            <span>返回新仙府</span>
        </button>
    </div>

    <p class="footer-hint">仙府出品 · 盗版必究</p>

<script>
    // 🔴 清死锁
    if (location.search.includes('clear=1')) {
        sessionStorage.removeItem('hx_about_jumped');
    }
    if (sessionStorage.getItem('hx_about_jumped')) return;
    sessionStorage.setItem('hx_about_jumped', '1');

    // 🔴 点击事件里完全没有webapp指令！只负责跳转！
    document.getElementById('backBtn').addEventListener('click', function() {
        setTimeout(() => {
            const targetUrl = 'https://raccoon.fit/game/%E3%80%90%E6%B8%B8%E6%88%8F%E9%A1%B9%E7%9B%AE%E3%80%91%E9%BB%84%E5%B0%8F%E4%BB%99%E8%AE%A8%E5%B0%81/%E5%81%A5%E5%BA%B7%E6%B8%B8%E6%88%8F%E5%BF%A0%E5%91%8A/index.html';
            window.location.replace(targetUrl + '?t=' + Date.now());
        }, 300);
    });
</script>
</body>
</html>
