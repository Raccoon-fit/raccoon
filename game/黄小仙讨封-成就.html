<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>黄小仙 · 成就图鉴</title>
    <meta name="theme-color" content="#000000">
    <style>
        /* 原有样式保持不变 */
        :root {
            --bg-color: #000000;
            --text-color: #C0C0C0;
            --accent-color: #A93226;
            --highlight-color: #FFFFFF;
            --btn-border: #555555;
            --btn-hover: #1A1A1A;
            --golden: #D4AF37;
            --bronze: #8B7355;
            --card-bg: #0a0a0a;
            --card-border: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(139, 115, 85, 0.06) 0%, transparent 70%),
                radial-gradient(ellipse at 50% 100%, rgba(139, 115, 85, 0.04) 0%, transparent 70%);
        }

        .page-container {
            max-width: 680px;
            width: 100%;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 28px 20px 10px;
            position: relative;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 6px;
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.15);
        }
        .header .subtitle {
            color: #666;
            font-size: 13px;
            letter-spacing: 2px;
            font-style: italic;
        }
        .header .stats {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header .stats .stat-item {
            background: #0f0f0f;
            border: 1px solid #1a1a1a;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            color: #999;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .header .stats .stat-item.highlight {
            border-color: #8B7355;
            color: #D4AF37;
            background: #1a1510;
        }
        .header .stats .stat-count {
            font-weight: bold;
            font-size: 22px;
            color: #D4AF37;
            letter-spacing: 0;
        }
        .header .back-link {
            display: inline-block;
            margin-top: 14px;
            color: #555;
            font-size: 12px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.3s;
            cursor: pointer;
            background: transparent;
            border: 1px solid #222;
            padding: 6px 18px;
            border-radius: 3px;
            font-family: inherit;
        }
        .header .back-link:hover {
            color: #D4AF37;
            border-color: #8B7355;
        }

        .section-title {
            color: #8B7355;
            font-size: 13px;
            letter-spacing: 3px;
            text-align: center;
            padding: 14px 0 8px;
            border-top: 1px solid #1a1a1a;
            margin-top: 8px;
            text-transform: uppercase;
        }
        .section-title.golden-title {
            color: #D4AF37;
            border-top-color: #2a2015;
        }

        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            width: 100%;
        }

        .achievement-row {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 4px;
            transition: all 0.35s ease;
            cursor: default;
            position: relative;
            border-bottom: 1px solid rgba(26, 26, 26, 0.5);
            min-height: 56px;
            gap: 14px;
        }
        .achievement-row:hover {
            background: rgba(20, 20, 20, 0.6);
        }
        .achievement-row:last-child {
            border-bottom: none;
        }

        .achievement-icon-cell {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #0a0a0a;
            color: #fff;
            transition: all 0.5s ease;
            position: relative;
        }
        .achievement-row.unlocked .achievement-icon-cell {
            opacity: 1;
            border-color: #8B7355;
            background: #1a1510;
            box-shadow: 0 0 8px rgba(139, 115, 85, 0.25);
        }
        .achievement-row.unlocked.golden .achievement-icon-cell {
            border-color: #D4AF37;
            background: #3a2e1a;
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.4), 0 0 28px rgba(212, 175, 55, 0.15);
            animation: goldenPulse 3s ease-in-out infinite;
        }
        @keyframes goldenPulse {
            0%,
            100% {
                box-shadow: 0 0 14px rgba(212, 175, 55, 0.4), 0 0 28px rgba(212, 175, 55, 0.15);
            }
            50% {
                box-shadow: 0 0 22px rgba(212, 175, 55, 0.6), 0 0 40px rgba(212, 175, 55, 0.3);
            }
        }
        .achievement-row.locked .achievement-icon-cell {
            opacity: 0.25;
            border-color: #222;
            background: #060606;
            color: #444;
            filter: grayscale(0.6);
        }

        .achievement-info {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 6px;
            min-width: 0;
        }
        .achievement-name {
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: all 0.35s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .achievement-row.unlocked .achievement-name {
            color: #d4c0a1;
        }
        .achievement-row.unlocked.golden .achievement-name {
            color: #D4AF37;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(212, 175, 55, 0.3);
        }
        .achievement-row.locked .achievement-name {
            color: #3a3a3a;
            font-style: italic;
        }

        .achievement-badge {
            flex-shrink: 0;
            font-size: 10px;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid;
            opacity: 0.7;
            transition: all 0.35s ease;
        }
        .achievement-row.unlocked .achievement-badge {
            border-color: #8B7355;
            color: #8B7355;
            background: rgba(139, 115, 85, 0.08);
        }
        .achievement-row.unlocked.golden .achievement-badge {
            border-color: #D4AF37;
            color: #D4AF37;
            background: rgba(212, 175, 55, 0.12);
            opacity: 0.9;
        }
        .achievement-row.locked .achievement-badge {
            border-color: #222;
            color: #333;
            background: transparent;
            opacity: 0.5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #3a3a3a;
            font-style: italic;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .footer-note {
            text-align: center;
            padding: 20px;
            color: #333;
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: auto;
            border-top: 1px solid #111;
        }
        .footer-note a {
            color: #555;
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer-note a:hover {
            color: #8B7355;
        }

        .refresh-indicator {
            text-align: center;
            font-size: 10px;
            color: #333;
            letter-spacing: 1px;
            padding: 4px;
        }

        @keyframes fadeInRow {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .achievement-row {
            animation: fadeInRow 0.5s ease forwards;
        }
        .achievement-row:nth-child(1) {
            animation-delay: 0.02s;
        }
        .achievement-row:nth-child(2) {
            animation-delay: 0.04s;
        }
        .achievement-row:nth-child(3) {
            animation-delay: 0.06s;
        }
        .achievement-row:nth-child(4) {
            animation-delay: 0.08s;
        }
        .achievement-row:nth-child(5) {
            animation-delay: 0.10s;
        }
        .achievement-row:nth-child(6) {
            animation-delay: 0.12s;
        }
        .achievement-row:nth-child(7) {
            animation-delay: 0.14s;
        }
        .achievement-row:nth-child(8) {
            animation-delay: 0.16s;
        }
        .achievement-row:nth-child(9) {
            animation-delay: 0.18s;
        }
        .achievement-row:nth-child(10) {
            animation-delay: 0.20s;
        }
        .achievement-row:nth-child(n+11) {
            animation-delay: 0.22s;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
                letter-spacing: 2px;
            }
            .achievement-icon-cell {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }
            .achievement-name {
                font-size: 14px;
            }
            .achievement-row {
                padding: 8px 10px;
                gap: 10px;
                min-height: 48px;
            }
            .achievement-badge {
                font-size: 9px;
                padding: 2px 8px;
            }
            .page-container {
                padding: 12px 8px 30px;
            }
        }
        @media (min-width: 768px) {
            .achievement-icon-cell {
                width: 52px;
                height: 52px;
                font-size: 24px;
            }
            .achievement-name {
                font-size: 17px;
            }
            .achievement-row {
                padding: 14px 20px;
                gap: 18px;
                min-height: 64px;
            }
            .header h1 {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
<script>
    webapp.关闭跳转打开(false);
    webapp.设置下拉刷新(false);
    webapp.清空浏览记录();
</script>
    <div class="page-container">
        <div class="header">
            <h1>黄小仙</h1>
            <p class="subtitle">成就图鉴</p>
            <div class="stats">
                <span class="stat-item highlight">
                    已解锁 <span class="stat-count" id="unlockedCount">0</span> / <span id="totalCount">40</span>
                </span>
                <span class="stat-item" id="goldenStat" style="display:none;">
                    ✦ 传说 <span class="stat-count" id="goldenCount">0</span>
                </span>
            </div>
        </div>

        <div id="unlockedSection">
            <div class="section-title golden-title" id="unlockedTitle" style="display:none;">✦ 已解锁的成就 ✦</div>
            <div class="achievement-list" id="unlockedList"></div>
            <div class="empty-state" id="unlockedEmpty">尚无成就解锁，去游戏中探索吧</div>
        </div>

        <div id="lockedSection">
            <div class="section-title" id="lockedTitle">尚未解锁</div>
            <div class="achievement-list" id="lockedList"></div>
        </div>

        <div class="refresh-indicator" id="refreshNote"></div>
    </div>

    <script>
        // ============================================================
        // 1. 成就数据定义（包含本地 ID 与 TapPlay ID 映射）
        // ============================================================
        const achievementIcons = [
            { id: 'witness', title: '无对无错，善良依旧', icon: '✦', golden: true },
            { id: 'sacrifice', title: '舍身成仁', icon: '†', golden: true },
            { id: 'true', title: '本相自在', icon: '◯', golden: false },
            { id: 'god', title: '点化成仙', icon: '☀', golden: false },
            { id: 'mortal', title: '尘世轮回', icon: '人', golden: false },
            { id: 'fail_scholar', title: '功亏一篑', icon: '✗', golden: false },
            { id: 'fail_kid', title: '原形毕露', icon: '✗', golden: false },
            { id: 'farmer', title: '山野村夫', icon: '🌾', golden: false },
            { id: 'star', title: '文曲星耀', icon: '⭐', golden: false },
            { id: 'demon_king', title: '妖王之路', icon: '◆', golden: false },
            { id: 'mad', title: '执念成魔', icon: '◇', golden: false },
            { id: 'love', title: '红尘情缘', icon: '♡', golden: false },
            { id: 'guardian', title: '守山之人', icon: '⛰', golden: false },
            { id: 'lost', title: '雨夜迷途', icon: '?', golden: false },
            { id: 'severed', title: '断缘而去', icon: '—', golden: false },
            { id: 'dawn', title: '黎明归宿', icon: '☽', golden: false },
            { id: 'sword_friend', title: '剑影知交', icon: '⚔', golden: false },
            { id: 'sword_master', title: '剑道传承', icon: '剑', golden: false },
            { id: 'green_memory', title: '前尘往事', icon: '记', golden: false },
            { id: 'green_fate', title: '三世因缘', icon: '缘', golden: false },
            { id: 'great_good', title: '大善若水', icon: '☯', golden: false },
            { id: 'great_evil', title: '大恶如魔', icon: '💀', golden: false },
            { id: 'balance_sage', title: '中庸之道', icon: '⚖', golden: false },
            { id: 'ghost_friend', title: '鬼魂之交', icon: '👻', golden: false },
            { id: 'star_seeker', title: '星辰指引', icon: '星', golden: false },
            { id: 'hermit', title: '隐士之道', icon: '隐', golden: false },
            { id: 'treasure', title: '寻宝猎人', icon: '宝', golden: false },
            { id: 'dragon_friend', title: '蛟龙之友', icon: '龙', golden: false },
            { id: 'spirit_guardian', title: '灵脉守护', icon: '脉', golden: false },
            { id: 'forest_king', title: '森林之王', icon: '林', golden: false },
            { id: 'underworld', title: '黄泉交易', icon: '泉', golden: false },
            { id: 'immortal', title: '长生不老', icon: '寿', golden: false },
            { id: 'forgotten_god', title: '遗忘之神', icon: '忘', golden: false },
            { id: 'fake_god', title: '伪仙真相', icon: '假', golden: false },
            { id: 'fake_enemy', title: '宿敌真相', icon: '敌', golden: false },
            { id: 'dream_ending', title: '黄粱一梦', icon: '梦', golden: false },
            { id: 'time_loop', title: '时光倒流', icon: '循环', golden: false },
            { id: 'destiny_symphony', title: '命运交响', icon: '命', golden: false },
            { id: 'fate_encounter', title: '因缘际会', icon: '会', golden: false },
            { id: 'suspicious', title: '疑心失缘', icon: '疑', golden: false },
        ];

        // ============================================================
        // 2. TapPlay 成就 ID 映射配置
        // ============================================================
        // 在这里将本地成就 ID 映射到 TapPlay 后台配置的成就 ID
        const TAPPLAY_IDS = {
            'witness': '10001',   // 无对无错，善良依旧
            // 其他成就请按此格式添加，例如：
            // 'sacrifice': '10002',
            // 'true': '10003',
            // ...
        };

        // ============================================================
        // 3. 防重复上报核心函数
        // ============================================================

        /**
         * 一次性成就上报（直接传入 TapPlay ID）
         * @param {string} localKey   - 游戏内成就状态的 localStorage 键名（如 'ach_benxiang'）
         * @param {string} tapplayId  - TapPlay 平台分配的成就 ID
         *
         * 用法示例：
         *   localStorage.setItem('ach_witness', 'true');
         *   unlockNormalAchievement('ach_witness', '10001');
         */
        function unlockNormalAchievement(localKey, tapplayId) {
            try {
                // 1. 检查是否已上报过
                const reportedKey = tapplayId + '_REPORTED';
                if (localStorage.getItem(reportedKey) === 'true') {
                    return; // 已上报，避免重复调用
                }

                // 2. 检查游戏内成就是否已解锁（防止误调用）
                if (localStorage.getItem(localKey) !== 'true') {
                    return; // 成就尚未解锁，不上报
                }

                // 3. 执行上报（兼容非 TapPlay 环境）
                if (typeof window !== 'undefined' &&
                    window.tapAchievement &&
                    typeof window.tapAchievement.reach === 'function') {
                    window.tapAchievement.reach(tapplayId);
                    // 4. 上报成功后写入标记
                    localStorage.setItem(reportedKey, 'true');
                } else {
                    // 非 TapPlay 环境，仅记录调试信息，不报错
                    console.debug('[TapPlay] 非 TapPlay 环境，跳过上报:', tapplayId);
                }
            } catch (e) {
                // 静默处理，不影响游戏主逻辑
                console.warn('[TapPlay] 一次性成就上报异常:', e.message, 'ID:', tapplayId);
            }
        }

        /**
         * 便捷函数：通过本地成就 ID 自动查找 TapPlay ID 并上报
         * @param {string} localKey   - 游戏内成就状态的 localStorage 键名
         * @param {string} localId    - 本地成就 ID（对应 achievementIcons 中的 id）
         *
         * 用法示例：
         *   localStorage.setItem('ach_witness', 'true');
         *   unlockAchievement('ach_witness', 'witness');
         */
        function unlockAchievement(localKey, localId) {
            const tapplayId = TAPPLAY_IDS[localId];
            if (!tapplayId) {
                console.warn('[TapPlay] 未找到本地成就 ID 对应的 TapPlay ID:', localId);
                return;
            }
            unlockNormalAchievement(localKey, tapplayId);
        }

        // ============================================================
        // 4. 成就图鉴渲染逻辑（保持不变）
        // ============================================================
        const STORAGE_KEY = 'huangdaxian_achievements';
        const ORDER_KEY = 'huangdaxian_achievement_order';

        function loadAchievements() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (e) {}
            return {};
        }

        function loadOrder() {
            try {
                const saved = localStorage.getItem(ORDER_KEY);
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (e) {}
            return null;
        }

        function saveOrder(orderArray) {
            try {
                localStorage.setItem(ORDER_KEY, JSON.stringify(orderArray));
            } catch (e) {}
        }

        function getSortedAchievements() {
            const achievements = loadAchievements();
            let order = loadOrder();
            const unlockedIds = Object.keys(achievements).filter(id => achievements[id] === true);

            if (!order) {
                order = unlockedIds.slice();
                saveOrder(order);
            } else {
                const newlyUnlocked = unlockedIds.filter(id => order.indexOf(id) === -1);
                if (newlyUnlocked.length > 0) {
                    order = [...newlyUnlocked, ...order];
                    saveOrder(order);
                }
                const stillValid = order.filter(id => unlockedIds.indexOf(id) >= 0);
                if (stillValid.length !== order.length) {
                    order = stillValid;
                    saveOrder(order);
                }
            }

            const unlockedSet = new Set(unlockedIds);
            const unlockedInOrder = order.filter(id => unlockedSet.has(id));
            const remainingUnlocked = unlockedIds.filter(id => unlockedInOrder.indexOf(id) === -1);
            const allUnlockedOrdered = [...unlockedInOrder, ...remainingUnlocked];

            const unlockedAchievements = [];
            const lockedAchievements = [];

            const allUnlockedMap = new Map();
            allUnlockedOrdered.forEach(id => {
                const ach = achievementIcons.find(a => a.id === id);
                if (ach) allUnlockedMap.set(id, ach);
            });

            achievementIcons.forEach(ach => {
                if (allUnlockedMap.has(ach.id)) {
                    unlockedAchievements.push(ach);
                } else {
                    lockedAchievements.push(ach);
                }
            });

            unlockedAchievements.sort((a, b) => {
                const idxA = allUnlockedOrdered.indexOf(a.id);
                const idxB = allUnlockedOrdered.indexOf(b.id);
                if (idxA >= 0 && idxB >= 0) return idxA - idxB;
                if (idxA >= 0) return -1;
                if (idxB >= 0) return 1;
                return 0;
            });

            return { unlockedAchievements, lockedAchievements };
        }

        function createAchievementRow(ach, isUnlocked) {
            const row = document.createElement('div');
            row.className = 'achievement-row';
            if (isUnlocked) {
                row.classList.add('unlocked');
                if (ach.golden) row.classList.add('golden');
            } else {
                row.classList.add('locked');
            }

            const iconCell = document.createElement('div');
            iconCell.className = 'achievement-icon-cell';
            iconCell.textContent = isUnlocked ? ach.icon : '?';
            iconCell.setAttribute('aria-label', ach.icon);

            const infoDiv = document.createElement('div');
            infoDiv.className = 'achievement-info';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'achievement-name';
            nameSpan.textContent = ach.title;
            infoDiv.appendChild(nameSpan);

            const badge = document.createElement('span');
            badge.className = 'achievement-badge';
            if (isUnlocked && ach.golden) {
                badge.textContent = '传说';
            } else if (isUnlocked) {
                badge.textContent = '已解锁';
            } else {
                badge.textContent = '未解锁';
            }

            row.appendChild(iconCell);
            row.appendChild(infoDiv);
            row.appendChild(badge);

            if (isUnlocked && ach.golden) {
                row.title = ach.title + ' · 传说成就';
            } else if (isUnlocked) {
                row.title = ach.title + ' · 已解锁';
            } else {
                row.title = ach.title + ' · 尚未解锁';
            }

            return row;
        }

        function renderAll() {
            const { unlockedAchievements, lockedAchievements } = getSortedAchievements();
            const unlockedList = document.getElementById('unlockedList');
            const lockedList = document.getElementById('lockedList');
            const unlockedTitle = document.getElementById('unlockedTitle');
            const unlockedEmpty = document.getElementById('unlockedEmpty');
            const lockedTitle = document.getElementById('lockedTitle');
            const unlockedCountEl = document.getElementById('unlockedCount');
            const totalCountEl = document.getElementById('totalCount');
            const goldenStat = document.getElementById('goldenStat');
            const goldenCountEl = document.getElementById('goldenCount');
            const refreshNote = document.getElementById('refreshNote');

            unlockedList.innerHTML = '';
            lockedList.innerHTML = '';

            const goldenUnlocked = unlockedAchievements.filter(a => a.golden);
            const totalGolden = achievementIcons.filter(a => a.golden).length;

            if (unlockedAchievements.length > 0) {
                unlockedTitle.style.display = 'block';
                unlockedEmpty.style.display = 'none';
                unlockedAchievements.forEach(ach => {
                    unlockedList.appendChild(createAchievementRow(ach, true));
                });
            } else {
                unlockedTitle.style.display = 'none';
                unlockedEmpty.style.display = 'block';
            }

            if (lockedAchievements.length > 0) {
                lockedTitle.style.display = 'block';
                lockedAchievements.forEach(ach => {
                    lockedList.appendChild(createAchievementRow(ach, false));
                });
            } else {
                lockedTitle.style.display = 'none';
                if (lockedAchievements.length === 0 && unlockedAchievements.length > 0) {
                    const allDone = document.createElement('div');
                    allDone.className = 'empty-state';
                    allDone.textContent = '🎉 全部成就已解锁！功德圆满！';
                    allDone.style.color = '#D4AF37';
                    allDone.style.padding = '30px 20px';
                    lockedList.appendChild(allDone);
                    lockedTitle.style.display = 'block';
                    lockedTitle.textContent = '全成就达成';
                    lockedTitle.classList.add('golden-title');
                }
            }

            unlockedCountEl.textContent = unlockedAchievements.length;
            totalCountEl.textContent = achievementIcons.length;

            if (goldenUnlocked.length > 0) {
                goldenStat.style.display = 'inline-flex';
                goldenCountEl.textContent = goldenUnlocked.length + '/' + totalGolden;
            } else {
                goldenStat.style.display = 'none';
            }

            const now = new Date();
            refreshNote.textContent = '数据更新于 ' + now.toLocaleString('zh-CN', {
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }) + ' · 刷新页面以同步游戏进度';
        }

        function init() {
            renderAll();
            window.addEventListener('storage', function(e) {
                if (e.key === STORAGE_KEY || e.key === ORDER_KEY) {
                    renderAll();
                }
            });
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    renderAll();
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
