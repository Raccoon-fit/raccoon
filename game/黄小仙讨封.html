<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 核心：强制使用最新渲染模式，防止旧样式残留 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 超级强缓存控制，防止回源 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>载入1.2.0...</title>
    <style>
        /* 初始全黑，覆盖旧页面，防止闪现旧导航栏 */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #0a0604; /* 接近1.2.0的深色背景，视觉无缝衔接 */
            overflow: hidden; 
        }
        /* 加载动画，告诉用户没死机 */
        .loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; border: 4px solid #4a2c17; 
            border-top-color: #d4a853; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>

<script>
    // 🔒 防重入锁
    if (window.__IS_UPGRADING__) {
        throw new Error('Already upgrading...');
    }
    window.__IS_UPGRADING__ = true;

    // 1. 你的1.2.0真实地址（已编码，防止中文乱码）
    const v120_url = 'https://raccoon.fit/game/%E3%80%90%E6%B8%B8%E6%88%8F%E9%A1%B9%E7%9B%AE%E3%80%91%E9%BB%84%E5%B0%8F%E4%BB%99%E8%AE%A8%E5%B0%81/%E5%81%A5%E5%BA%B7%E6%B8%B8%E6%88%8F%E5%BF%A0%E5%91%8A/index.html?t=' + Date.now();

    // 2. 拉取1.2.0的HTML内容
    fetch(v120_url, { cache: 'no-store' }) // 强制不读缓存
        .then(response => {
            if (!response.ok) {
                throw new Error('仙府1.2.0加载失败，请检查路径或网络！');
            }
            return response.text();
        })
        .then(html => {
            // 3. 【核心】原子级替换：把当前页面的所有内容（包括旧导航栏的DOM和JS）
            // 全部替换成1.2.0的内容。这是瞬间完成的，没有白屏。
            document.open();
            document.write(html);
            document.close();

            // 4. 清理旧缓存，防止干扰新页面
            try {
                localStorage.clear();
                sessionStorage.clear();
                if (window.caches) caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
            } catch(e) {}
        })
        .catch(error => {
            // 5. 兜底：如果拉取失败，显示错误信息，而不是白屏
            document.body.innerHTML = `
                <div style="color:#d4a853; text-align:center; padding-top:30%; font-family:SimSun; line-height:2;">
                    <h2>仙途受阻</h2>
                    <p>${error.message}</p>
                    <p>请检查网络或稍后重试</p>
                    <button onclick="location.reload()" style="padding:10px 20px; background:#4a2c17; color:#d4a853; border:none; cursor:pointer; margin-top:20px;">
                        重试
                    </button>
                </div>
            `;
        });
</script>
</body>
</html>
