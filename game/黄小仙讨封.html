<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>黄小仙 · 讨封之卷 (深泽重制)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #000000;
            --text-color: #B0B0B0;
            --accent-color: #A93226;
            --highlight-color: #FFFFFF;
            --btn-border: #555555;
            --btn-hover: #1A1A1A;
            --illustration-bg: #0f0f0f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .game-container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
        }

        .cultivation {
            font-size: 14px;
            color: #666;
        }

        .cultivation span {
            color: #8B7355;
            font-weight: bold;
        }

        .achievements {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .achievement-icon {
            width: 32px;
            height: 32px;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            opacity: 0.3;
            transition: all 0.5s ease;
            position: relative;
            background: #0a0a0a;
            color: #fff;
        }

        .achievement-icon.unlocked {
            opacity: 1;
            border-color: #8B7355;
            background: #1a1510;
            box-shadow: 0 0 6px rgba(139, 115, 85, 0.3);
        }

        .achievement-icon.unlocked.golden {
            border-color: #D4AF37;
            background: #3a2e1a;
            box-shadow: 0 0 8px #D4AF37;
            color: #fff;
        }

        .achievement-icon[data-achievement]:hover::after {
            content: attr(data-title);
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1510;
            border: 1px solid #8B7355;
            padding: 4px 8px;
            font-size: 11px;
            white-space: nowrap;
            border-radius: 3px;
            z-index: 100;
            color: #d4c0a1;
        }

        /* 剧情区域 */
        .story-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .story-text {
            font-size: 17px;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .story-text.narrator {
            color: #888;
            font-style: italic;
        }

        .story-text.speaker {
            color: var(--highlight-color);
            font-weight: bold;
        }

        .story-text.system {
            color: var(--accent-color);
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 选项区域 */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 0;
            border-top: 1px solid #222;
        }

        .choice-btn {
            background: transparent;
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            padding: 15px 20px;
            font-size: 15px;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .choice-btn:hover {
            background: var(--btn-hover);
            border-color: var(--highlight-color);
            color: var(--highlight-color);
        }

        .choice-btn:active {
            transform: scale(0.98);
        }

        /* 成就弹窗 */
        .achievement-popup {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1a1510 0%, #2a2015 100%);
            border: 1px solid #8B7355;
            padding: 15px 25px;
            border-radius: 5px;
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 2100;
        }

        .achievement-popup.show {
            top: 20px;
            opacity: 1;
        }

        .achievement-popup .title {
            color: #8B7355;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .achievement-popup .name {
            color: #D4AF37;
            font-size: 16px;
            font-weight: bold;
        }

        /* 底部信息区：版本号 + 快进 + 备案 */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 10px;
            font-size: 12px;
            color: #444;
            border-top: 1px solid #222;
        }

        .version-container {
            position: relative;
            display: flex;
            gap: 12px;
        }

        .version-btn, .skip-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            padding: 2px 6px;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .version-btn:hover, .skip-btn:hover {
            color: #aaa;
            background: #111;
        }

        /* 版本弹窗 (更新日志) */
        .changelog-popup {
            position: fixed;
            bottom: 80px;
            left: 20px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 16px 20px;
            max-width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            z-index: 2200;
            display: none;
            color: #ccc;
            font-size: 13px;
            line-height: 1.6;
            backdrop-filter: blur(4px);
        }

        .changelog-popup.show {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        .changelog-popup h4 {
            color: #8B7355;
            margin-bottom: 8px;
            font-size: 14px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .changelog-popup .version-block {
            margin-bottom: 12px;
            border-left: 2px solid #8B7355;
            padding-left: 8px;
        }

        .changelog-popup .version-block.old {
            border-left-color: #444;
            opacity: 0.9;
        }

        .changelog-popup .version-title {
            color: #D4AF37;
            font-weight: bold;
        }

        .changelog-popup ul {
            padding-left: 18px;
            margin: 8px 0;
        }

        .changelog-popup li {
            margin-bottom: 4px;
        }

        .changelog-popup .date {
            color: #D4AF37;
            font-size: 11px;
            margin-top: 4px;
            text-align: right;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .inland-security-footer {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .raccoon-link {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 300;
            color: #adadad;
            text-decoration: none;
        }

        .raccoon-link:visited {
            color: #adadad;
        }

        .raccoon-link:hover {
            color: #666666;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .story-text {
                font-size: 15px;
            }

            .choice-btn {
                padding: 12px 15px;
                font-size: 14px;
            }

            .changelog-popup {
                left: 10px;
                right: 10px;
                max-width: none;
            }
        }

        /* 开始界面 */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #B0B0B0;
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            transition: opacity 0.3s ease;
        }

        .start-content {
            text-align: center;
            max-width: 80%;
        }

        .start-content h1 {
            color: #ffffff;
            font-size: 56px;
            margin-bottom: 16px;
            font-weight: 300;
            letter-spacing: 6px;
            text-shadow: 0 0 2px rgba(255,255,255,0.2);
        }

        .start-subtitle {
            font-size: 18px;
            margin-bottom: 48px;
            color: #666;
            font-style: italic;
            letter-spacing: 2px;
        }

        .start-btn {
            background: transparent;
            border: 1px solid #444;
            color: #B0B0B0;
            padding: 14px 48px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 3px;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .start-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: #111;
        }
    </style>
</head>
<body>
    <!-- 开始界面 overlay -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <h1>黄小仙·深泽</h1>
            <p class="start-subtitle">五百年修为一念之间</p>
            <button class="start-btn" id="startBtn">开始讨封</button>
        </div>
    </div>

    <div class="game-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="cultivation">道行：<span id="cultivation-level">五百年</span></div>
            <div class="achievements" id="achievementsContainer"></div>
        </div>

        <!-- 剧情区域 -->
        <div class="story-container" id="story-container"></div>

        <!-- 选项区域 -->
        <div class="choices-container" id="choices-container"></div>

        <!-- 底部：版本号 + 快进 + 软软小窝 -->
        <div class="footer">
            <div class="version-container">
                <button class="version-btn" id="versionBtn">v1.2.0</button>
                <button class="skip-btn" id="skipBtn">⏩ 快进</button>
            </div>
            <div class="inland-security-footer">
                <a href="https://raccoon.fit/" target="_blank" rel="noreferrer" class="raccoon-link">
                    <span>© 2026 软软的小窝</span>
                </a>
            </div>
        </div>
    </div>

    <!-- 成就弹窗 -->
    <div class="achievement-popup" id="achievement-popup">
        <div class="title">成就解锁</div>
        <div class="name" id="achievement-name"></div>
    </div>

    <!-- 更新日志弹窗 (左下角) -->
    <div class="changelog-popup" id="changelogPopup">
        <h4>更新日志 · 深泽重制</h4>
        <div class="version-block">
            <div class="version-title">v1.2.0</div>
            <ul>
                <li>新增「分支回溯」：可从结局一键返回上一个选择点</li>
                <li>快进功能：瞬间读完当前段落</li>
                <li>两大全新结局：「山野村夫」「文曲星耀」及对应成就</li>
                <li>书生/顽童支线增加正面反转选项</li>
                <li>农夫隐藏人物线，带来意外温暖</li>
                <li>大幅扩充文本细节，分支更繁茂</li>
                <li>修复成就无法全部点亮的遗留问题</li>
            </ul>
            <div class="date">2026-03-21</div>
        </div>
        <div class="version-block old">
            <div class="version-title">v1.0.2</div>
            <ul><li>基础版本：五结局 + 成就系统</li></ul>
        </div>
    </div>

    <script>
        (function() {
            // 游戏数据 —— 丰富多结局、隐藏反转、分支回溯
            const gameData = {
                achievements: {
                    'true': false,          // 无对无错，善良依旧 (金色)
                    'god': false,            // 点化成仙
                    'mortal': false,         // 尘世轮回
                    'fail_scholar': false,   // 功亏一篑
                    'fail_kid': false,       // 原形毕露
                    'farmer': false,         // 山野村夫 (新)
                    'star': false             // 文曲星耀 (新)
                },
                // 成就图标配置
                achievementIcons: [
                    { id: 'true', title: '无对无错，善良依旧', icon: '✓' },
                    { id: 'god', title: '点化成仙', icon: '✓' },
                    { id: 'mortal', title: '尘世轮回', icon: '✓' },
                    { id: 'fail_scholar', title: '功亏一篑', icon: '✓' },
                    { id: 'fail_kid', title: '原形毕露', icon: '✓' },
                    { id: 'farmer', title: '山野村夫', icon: '🌾' },
                    { id: 'star', title: '文曲星耀', icon: '⭐' }
                ],
                // 场景库
                scenes: {
                    'start': {
                        texts: [
                            { type: 'narrator', content: '雷雨夜，山路泥泞。' },
                            { type: 'narrator', content: '你是一只修炼了五百年的黄鼠狼精，今日正是你的讨封之期。' },
                            { type: 'narrator', content: '只要能让人说一声"像人"或"像仙"，你便能化形成功，脱离妖身。' },
                            { type: 'narrator', content: '雨幕中，远远走来几个人影。你该向谁开口？' }
                        ],
                        choices: [
                            { text: '向前面那个赶路的书生讨封', nextScene: 'scholar_encounter' },
                            { text: '向路边的顽童讨封', nextScene: 'kid_encounter' },
                            { text: '再找找其他人', nextScene: 'wait_more_1' }
                        ]
                    },
                    // 书生初始（负面）
                    'scholar_encounter': {
                        texts: [
                            { type: 'narrator', content: '你从树后闪身而出，拦住了那位赶路的书生。' },
                            { type: 'speaker', content: '书生猛地停步，伞掉在地上："何...何方妖怪！莫要害我！"' },
                            { type: 'narrator', content: '你尽力作出一副和善模样，拱手道："这位公子，请问你看我像人还是像仙？"' },
                            { type: 'speaker', content: '书生脸色惨白，连连后退："像...像妖怪！一身骚气，还不快滚！"' },
                            { type: 'narrator', content: '他捡起石块朝你扔来，转身就跑。' }
                        ],
                        choices: [
                            { text: '仓皇逃离', nextScene: 'fail_scholar_end', action: 'unlock_fail_scholar' },
                            { text: '追上去，拼命解释', nextScene: 'scholar_follow' }  // 新分支：反转可能
                        ]
                    },
                    // 书生后续 —— 反转线
                    'scholar_follow': {
                        texts: [
                            { type: 'narrator', content: '你不甘心，追上去挡在他面前，口吐人言："公子莫怕，我修行五百年从不害人，只求一句认可。"' },
                            { type: 'speaker', content: '书生跌坐泥地，见你并无恶意，颤抖着问："你……你真的不偷鸡？"' },
                            { type: 'narrator', content: '你摇头，将近日捕鼠护粮之事道来。书生渐渐平静，眼中竟有几分敬意。' },
                            { type: 'speaker', content: '他沉吟良久："我自幼读书，从不信妖邪，今日见你通人性、守本分，倒像是……像是文曲星君座下的灵兽。"' },
                            { type: 'narrator', content: '话音刚落，一道灵光没入你体内。你感觉灵智大开，虽未化人，却得了文气。' }
                        ],
                        choices: [
                            { text: '拜谢书生', nextScene: 'star_ending', action: 'unlock_star' }
                        ]
                    },
                    // 顽童初始（负面）
                    'kid_encounter': {
                        texts: [
                            { type: 'narrator', content: '你悄悄靠近那个蹲在路边玩泥巴的顽童。' },
                            { type: 'speaker', content: '顽童抬头看见你，眼睛一亮："呀，好大一只黄鼠狼！你的尾巴真好看！"' },
                            { type: 'narrator', content: '你心中暗喜，低声问道："小娃娃，你看我像什么？像人吗？"' },
                            { type: 'speaker', content: '顽童歪头想了想："像……像一只会说话的黄鼠狼！我阿婆说黄鼠狼会偷鸡，你是不是来偷我的泥人？"' },
                            { type: 'narrator', content: '顽童抓起泥巴朝你扔来，咯咯笑着跑开了。' }
                        ],
                        choices: [
                            { text: '落荒而逃', nextScene: 'fail_kid_end', action: 'unlock_fail_kid' },
                            { text: '变成小猫逗他开心', nextScene: 'kid_play' }   // 新分支：友善路线
                        ]
                    },
                    'kid_play': {
                        texts: [
                            { type: 'narrator', content: '你灵机一动，使出小法术变成一只小花猫，喵喵叫着蹭顽童的腿。' },
                            { type: 'speaker', content: '顽童惊喜："哇！你还会变猫！太好玩了！"他抱起你，完全忘了刚才的害怕。' },
                            { type: 'narrator', content: '顽童带你回家，他的奶奶是个慈祥老人，见猫通人性，笑着说："这猫有灵性，像保家的黄大仙呢。"' },
                            { type: 'narrator', content: '你心头一暖，虽然没能化人，却从此留在农家，成为一只真正的保家仙。' }
                        ],
                        choices: [
                            { text: '留在农家', nextScene: 'farmer_ending', action: 'unlock_farmer' }
                        ]
                    },
                    // 等待分支1
                    'wait_more_1': {
                        texts: [
                            { type: 'narrator', content: '你觉得书生和顽童都非有缘之人，决定再等等。' },
                            { type: 'narrator', content: '雨越下越大，山路上积起水洼，你的皮毛已湿透。' },
                            { type: 'narrator', content: '就在你几乎要放弃时，雨幕中缓缓走来一道青色身影，撑着油纸伞，步履从容。' },
                            { type: 'narrator', content: '另有一个农夫挑着柴，从山道拐角冒雨跑来。' }
                        ],
                        choices: [
                            { text: '向青衣人讨封', nextScene: 'true_encounter_first' },
                            { text: '向农夫讨封', nextScene: 'farmer_encounter' },
                            { text: '再等等，或许还有其他人', nextScene: 'wait_more_2' }
                        ]
                    },
                    // 农夫新支线
                    'farmer_encounter': {
                        texts: [
                            { type: 'narrator', content: '你拦住农夫，他吓了一跳，柴担差点掉地。' },
                            { type: 'speaker', content: '农夫瞪大眼："黄……黄大仙？俺娘说过，山里有修行的黄仙，不能得罪。"' },
                            { type: 'narrator', content: '你作揖道："大哥，我修行五百年，今日讨封，你看我像人还是像仙？"' },
                            { type: 'speaker', content: '农夫挠头，憨厚一笑："俺看您像山里的土地爷，护着咱们庄稼人。像，像保家仙！"' }
                        ],
                        choices: [
                            { text: '感激不尽', nextScene: 'farmer_ending', action: 'unlock_farmer' }
                        ]
                    },
                    // 等待分支2
                    'wait_more_2': {
                        texts: [
                            { type: 'narrator', content: '你按捺住心中的焦躁，继续躲在树后等待。' },
                            { type: 'narrator', content: '雨势渐小，山路却再无行人。' },
                            { type: 'narrator', content: '那位青衣人并未走远，他停在不远处，伞沿微抬，似乎在望着你藏身的方向。' },
                            { type: 'speaker', content: '他轻声开口："雨夜立良久，可是在等什么人？"' }
                        ],
                        choices: [
                            { text: '走向他，实话实说', nextScene: 'true_encounter_second' },
                            { text: '犹豫不决，再等下去', nextScene: 'wait_final' }
                        ]
                    },
                    'wait_final': {
                        texts: [
                            { type: 'narrator', content: '你犹豫着，始终不敢上前。' },
                            { type: 'narrator', content: '青衣人轻叹一声，转身离去，消失在雨雾中。' },
                            { type: 'narrator', content: '雷声渐歇，天边泛起鱼肚白，讨封的时机已过。' },
                            { type: 'narrator', content: '你只能拖着疲惫的身躯回到山中，继续做一只普通的黄鼠狼。' },
                            { type: 'system', content: '结局：错失良机' }
                        ],
                        choices: [

                    'farmer_ending': {

                            { type: 'narrator', content: '从此你常驻山村，护佑五谷牲畜，成了远近闻名的"黄大仙"。逢年过节，总有村民来供香火。' },

                    // 结局5：文曲星耀
                    'star_ending': {

                    // 失败结局：书生
                    'fail_scholar_end': {

                        ],

                        ]
                    },
                    // 失败结局：顽童
                    'fail_kid_end': {
                        texts: [
                            { type: 'narrator', content: '你躲入草丛，看着顽童跑远的背影，泥巴还粘在你的皮毛上。' },
                            { type: 'narrator', content: '童言无忌，却字字如刀。你忽然明白，讨封一事强求不得。' },

                        ],

                },
                currentScene: 'start',
                storyHistory: [],
                typingTimer: null,
                checkpointScene: 'start',        // 存档点（上一个有意义的选择场景）
                skipMode: false
            };

            // 显示成就弹窗
            function showAchievement(name) {
                const popup = document.getElementById('achievement-popup');
                const nameEl = document.getElementById('achievement-name');
                nameEl.textContent = name;
                popup.classList.add('show');
                setTimeout(() => {
                    popup.classList.remove('show');
                }, 3000);
            }

            // 解锁成就
            function unlockAchievement(id) {
                if (!gameData.achievements[id]) {
                    gameData.achievements[id] = true;
                    renderAchievementIcons();
                    localStorage.setItem('huangdaxian_achievements', JSON.stringify(gameData.achievements));
                    const nameMap = {
                        'true': '无对无错，善良依旧',
                        'god': '点化成仙',
                        'mortal': '尘世轮回',
                        'fail_scholar': '功亏一篑',
                        'fail_kid': '原形毕露',
                        'farmer': '山野村夫',
                        'star': '文曲星耀'
                    };
                    if (nameMap[id]) showAchievement(nameMap[id]);
                }
            }

            // 渲染成就图标
            function renderAchievementIcons() {
                const container = document.getElementById('achievementsContainer');
                if (!container) return;
                let html = '';
                gameData.achievementIcons.forEach(ach => {
                    const unlocked = gameData.achievements[ach.id];
                    const goldenClass = (ach.id === 'true' && unlocked) ? 'golden' : '';
                    html += `<div class="achievement-icon ${unlocked ? 'unlocked ' + goldenClass : ''}" data-achievement="${ach.id}" data-title="${ach.title}">${unlocked ? ach.icon : ''}</div>`;
                });
                container.innerHTML = html;
            }

            // 完全显示当前场景（快进）
            function skipCurrentScene() {
                if (gameData.typingTimer) clearTimeout(gameData.typingTimer);
                const scene = gameData.scenes[gameData.currentScene];
                if (!scene) return;
                const storyContainer = document.getElementById('story-container');
                const choicesContainer = document.getElementById('choices-container');
                // 直接清空并一次性显示所有文本
                storyContainer.innerHTML = '';
                scene.texts.forEach(textObj => {
                    const p = document.createElement('p');
                    p.className = `story-text ${textObj.type}`;
                    p.textContent = textObj.content;
                    storyContainer.appendChild(p);
                });
                storyContainer.scrollTop = storyContainer.scrollHeight;
                // 显示选项
                showChoicesDirect(scene);
            }

            function showChoicesDirect(scene) {
                const choicesContainer = document.getElementById('choices-container');
                let html = '';
                scene.choices.forEach((choice, index) => {
                    // 如果选项是返回checkpoint但checkpoint无效，则不显示
                    if (choice.nextScene === 'checkpoint' && !gameData.checkpointScene) return;
                    const actionParam = choice.action ? `'${choice.action}'` : 'null';
                    const nextParam = choice.nextScene === 'checkpoint' ? `'${gameData.checkpointScene}'` : `'${choice.nextScene}'`;
                    html += `<button class="choice-btn" onclick="handleChoice(${nextParam}, ${actionParam})" style="animation-delay: ${index * 0.1}s">${choice.text}</button>`;
                });
                choicesContainer.innerHTML = html;
            }

            // 渲染场景 (打字机)
            function renderScene(sceneId) {
                if (gameData.typingTimer) clearTimeout(gameData.typingTimer);

                const scene = gameData.scenes[sceneId];
                if (!scene) return;

                gameData.currentScene = sceneId;

                // 更新存档点：如果当前场景有选项（且不是纯重置场景），则设为检查点
                if (scene.choices && scene.choices.length > 0 && scene.choices[0].text !== '重新开始' && scene.choices[0].text !== '回到上一个选择点') {
                    gameData.checkpointScene = sceneId;
                }

                const storyContainer = document.getElementById('story-container');
                const choicesContainer = document.getElementById('choices-container');

                storyContainer.innerHTML = '';
                choicesContainer.innerHTML = '';

                let textIndex = 0;
                const totalTexts = scene.texts.length;

                function showNextText() {
                    if (textIndex >= totalTexts) {
                        showChoicesDirect(scene);
                        return;
                    }

                    const textObj = scene.texts[textIndex];
                    const p = document.createElement('p');
                    p.className = `story-text ${textObj.type}`;
                    storyContainer.appendChild(p);
                    storyContainer.scrollTop = storyContainer.scrollHeight;

                    const charSpeed = textObj.type === 'speaker' ? 40 : (textObj.type === 'system' ? 20 : 30);
                    let charIndex = 0;
                    const text = textObj.content;

                    function typeNextChar() {
                        if (charIndex < text.length) {
                            p.textContent += text[charIndex];
                            charIndex++;
                            storyContainer.scrollTop = storyContainer.scrollHeight;
                            gameData.typingTimer = setTimeout(typeNextChar, charSpeed);
                        } else {
                            textIndex++;
                            gameData.typingTimer = setTimeout(showNextText, 300);
                        }
                    }
                    typeNextChar();
                }

                showNextText();
            }

            // 处理选择
            window.handleChoice = function(nextScene, action) {
                // 处理特殊action
                if (action === 'achievement_true') unlockAchievement('true');
                else if (action === 'unlock_god') unlockAchievement('god');
                else if (action === 'unlock_fail_scholar') unlockAchievement('fail_scholar');
                else if (action === 'unlock_fail_kid') unlockAchievement('fail_kid');
                else if (action === 'unlock_farmer') unlockAchievement('farmer');
                else if (action === 'unlock_star') unlockAchievement('star');
                else if (action === 'reset') {
                    resetGame(false);
                    return;
                }

                // 延迟加载下一场景
                setTimeout(() => {
                    renderScene(nextScene);
                }, 200);
            };

            // 重置游戏 (不重置成就)
            function resetGame(fullReset = false) {
                const overlay = document.getElementById('startOverlay');
                if (overlay) overlay.style.display = 'none';

                if (fullReset) {
                    gameData.achievements = {
                        'true': false, 'god': false, 'mortal': false,
                        'fail_scholar': false, 'fail_kid': false,
                        'farmer': false, 'star': false
                    };
                    localStorage.removeItem('huangdaxian_achievements');
                    renderAchievementIcons();
                }
                gameData.checkpointScene = 'start';
                renderScene('start');
            }

            // 加载成就
            function loadSavedAchievements() {
                const saved = localStorage.getItem('huangdaxian_achievements');
                if (saved) {
                    const savedAchievements = JSON.parse(saved);
                    Object.keys(savedAchievements).forEach(key => {
                        if (savedAchievements[key]) gameData.achievements[key] = true;
                    });
                }
                renderAchievementIcons();
            }

            // 初始化版本弹窗 + 快进
            function initControls() {
                const versionBtn = document.getElementById('versionBtn');
                const popup = document.getElementById('changelogPopup');
                versionBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    popup.classList.toggle('show');
                });
                document.addEventListener('click', (e) => {
                    if (!popup.contains(e.target) && e.target !== versionBtn) {
                        popup.classList.remove('show');
                    }
                });

                // 快进按钮
                const skipBtn = document.getElementById('skipBtn');
                skipBtn.addEventListener('click', () => {
                    skipCurrentScene();
                });
            }

            // 启动
            window.onload = function() {
                loadSavedAchievements();

                const overlay = document.getElementById('startOverlay');
                const startBtn = document.getElementById('startBtn');

                overlay.style.display = 'flex';

                startBtn.addEventListener('click', function() {
                    overlay.style.display = 'none';
                    renderScene('start');
                });

                initControls();
            };

            // 暴露reset给全局（可选）
            window.resetGame = resetGame;
        })();
    </script>
