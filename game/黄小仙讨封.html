<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>仙府升维</title>
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --bg-color: #000000;
            --golden: #D4AF37;
            --bronze: #8B7355;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-color);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "SimSun", "Songti SC", serif;
        }
        .container { text-align: center; padding: 20px; }
        .icon { font-size: 48px; color: var(--golden); margin-bottom: 20px; }
        h1 { color: #fff; font-size: 26px; letter-spacing: 4px; margin-bottom: 10px; }
        .divider { width: 80px; height: 1px; background: var(--bronze); margin: 0 auto 30px; }
        .hint { color: #888; font-size: 15px; line-height: 1.8; margin-bottom: 40px; max-width: 300px; }
        /* 和关于页隐私按钮一模一样的样式，webapp认这个脸 */
        .enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #888;
            text-decoration: none;
            font-size: 17px;
            letter-spacing: 2px;
            padding: 16px 36px;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            background: transparent;
            transition: all 0.3s ease;
        }
        .enter-btn .btn-icon { font-size: 20px; color: var(--bronze); transition: all 0.3s ease; }
        .enter-btn:hover { color: var(--golden); border-color: var(--bronze); background: rgba(139, 115, 85, 0.08); }
        .enter-btn:hover .btn-icon { color: var(--golden); transform: translateX(3px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✦</div>
        <h1>仙府升维</h1>
        <div class="divider"></div>
        <p class="hint">
            仙府已迭代至1.2.0版本<br>
            点击下方传送阵进入新境<br>
            <small>（真人点击后自动隐藏旧导航栏）</small>
        </p>
        <button class="enter-btn" id="enterBtn">
            <span class="btn-icon">➤</span>
            <span>进入新仙府</span>
        </button>
    </div>

<script>
    // 清死锁
    if (location.search.includes('clear=1')) {
        sessionStorage.removeItem('hx_entered');
    }

    document.getElementById('enterBtn').addEventListener('click', function() {
        // 点击时才调用webapp指令，这时候JSBridge肯定就绪了
        try {
            webapp.关闭跳转打开(false);
            webapp.设置下拉刷新(false);
            webapp.清空浏览记录();
        } catch(e) {}

        // 给webapp 300ms收导航栏，然后直接跳
        setTimeout(() => {
            window.location.replace('https://raccoon.fit/game/%E3%80%90%E6%B8%B8%E6%88%8F%E9%A1%B9%E7%9B%AE%E3%80%91%E9%BB%84%E5%B0%8F%E4%BB%99%E8%AE%A8%E5%B0%81/%E5%81%A5%E5%BA%B7%E6%B8%B8%E6%88%8F%E5%BF%A0%E5%91%8A/index.html?t=' + Date.now());
        }, 300);
    });
</script>
</body>
</html>
