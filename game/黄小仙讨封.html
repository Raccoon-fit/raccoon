<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄小仙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #000000;
            --text-color: #B0B0B0;
            --accent-color: #A93226;
            --highlight-color: #FFFFFF;
            --btn-border: #555555;
            --btn-hover: #1A1A1A;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .game-container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        .cultivation {
            font-size: 14px;
            color: #666;
        }

        .cultivation span {
            color: #8B7355;
            font-weight: bold;
        }

        .achievements {
            display: flex;
            gap: 10px;
        }

        .achievement-icon {
            width: 24px;
            height: 24px;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0.3;
            transition: all 0.5s ease;
            position: relative;
        }

        .achievement-icon.unlocked {
            opacity: 1;
            border-color: #8B7355;
            background: #1a1510;
        }

        .achievement-icon[data-achievement="true"]:hover::after {
            content: "无对无错，善良依旧";
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1510;
            border: 1px solid #8B7355;
            padding: 4px 8px;
            font-size: 11px;
            white-space: nowrap;
            border-radius: 3px;
            z-index: 10;
        }

        /* 剧情区域 */
        .story-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .story-text {
            font-size: 17px;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .story-text.narrator {
            color: #888;
            font-style: italic;
        }

        .story-text.speaker {
            color: var(--highlight-color);
            font-weight: bold;
        }

        .story-text.system {
            color: var(--accent-color);
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 选项区域 */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 0;
            border-top: 1px solid #222;
        }

        .choice-btn {
            background: transparent;
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            padding: 15px 20px;
            font-size: 15px;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .choice-btn:hover {
            background: var(--btn-hover);
            border-color: var(--highlight-color);
            color: var(--highlight-color);
        }

        .choice-btn:active {
            transform: scale(0.98);
        }

        /* 成就弹窗 */
        .achievement-popup {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1a1510 0%, #2a2015 100%);
            border: 1px solid #8B7355;
            padding: 15px 25px;
            border-radius: 5px;
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 2100;
        }

        .achievement-popup.show {
            top: 20px;
            opacity: 1;
        }

        .achievement-popup .title {
            color: #8B7355;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .achievement-popup .name {
            color: #D4AF37;
            font-size: 16px;
            font-weight: bold;
        }

        /* 结束画面（保留原有样式） */
        .ending-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .ending-screen h2 {
            color: var(--highlight-color);
            margin-bottom: 20px;
            font-size: 20px;
        }

        .ending-screen p {
            margin-bottom: 30px;
            color: #777;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 20px 0;
            font-size: 12px;
            color: #444;
            border-top: 1px solid #222;
        }

        .reset-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .reset-btn:hover {
            color: #888;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .story-text {
                font-size: 15px;
            }

            .choice-btn {
                padding: 12px 15px;
                font-size: 14px;
            }
        }

        /* ---------- 开始界面（省电风格 · 纯黑极简） ---------- */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #B0B0B0;
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            transition: opacity 0.3s ease;
        }

        .start-content {
            text-align: center;
            max-width: 80%;
        }

        .start-content h1 {
            color: #ffffff;
            font-size: 56px;
            margin-bottom: 16px;
            font-weight: 300;
            letter-spacing: 6px;
            text-shadow: 0 0 2px rgba(255,255,255,0.2);
        }

        .start-subtitle {
            font-size: 18px;
            margin-bottom: 48px;
            color: #666;
            font-style: italic;
            letter-spacing: 2px;
        }

        .start-btn {
            background: transparent;
            border: 1px solid #444;
            color: #B0B0B0;
            padding: 14px 48px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 3px;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .start-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: #111;
        }

        /* 确保游戏内容在开始界面下方不可见 */
        .game-container {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- 开始界面 overlay (省电纯黑) -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <h1>黄小仙</h1>
            <p class="start-subtitle">五百年修行为一朝</p>
            <button class="start-btn" id="startBtn">开始讨封</button>
        </div>
    </div>

    <div class="game-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="cultivation">道行：<span id="cultivation-level">500年</span></div>
            <div class="achievements">
                <div class="achievement-icon" id="ach-true" data-achievement="true" title="无对无错，善良依旧">✓</div>
                <!-- 预留其他成就图标位（可后续扩展） -->
            </div>
        </div>

        <!-- 剧情区域 -->
        <div class="story-container" id="story-container"></div>

        <!-- 选项区域 -->
        <div class="choices-container" id="choices-container"></div>

        <!-- 页脚 -->
        <div class="footer">
            <button class="reset-btn" onclick="resetGame()">重新开始</button>
        </div>
    </div>

    <!-- 成就弹窗 -->
    <div class="achievement-popup" id="achievement-popup">
        <div class="title">成就解锁</div>
        <div class="name" id="achievement-name"></div>
    </div>

    <!-- 底部备案信息（原样保留） -->
    <style>
        .inland-security-footer {
            position: fixed;
            z-index: 10;
            bottom: 0;
            right: 0;
            width: fit-content;
            display: flex;
            justify-content: flex-end;
        }

        .tooltip-container {
            position: relative;
        }

        .trigger-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background-color: transparent;
            border-radius: 8px;
            cursor: pointer;
        }

        .raccoon-link {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 300;
            color: #adadad;
            text-decoration: none;
        }

        .raccoon-link:visited {
            color: #adadad;
        }

        .raccoon-link:hover {
            color: #666666;
        }

        .tooltip-content {
            position: absolute;
            bottom: 100%;
            right: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 8px;
            padding-bottom: 16px; 
            font-size: 12px;
            line-height: 17px;
            background-color: #fafafa;
            border-radius: 12px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            color: #171717;
        }

        .tooltip-content::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 16px;
        }

        .tooltip-container:hover .tooltip-content {
            display: flex;
        }

        .info-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .beian-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #171717;
        }

        .beian-icon {
            width: 14px;
            height: 14px;
            margin-right: 2px;
        }

        .underline-text {
            color: #171717;
            text-decoration: underline;
        }

        .underline-text:hover {
            color: #000000;
        }

        @media (prefers-color-scheme: dark) {
            .trigger-content {
                background-color: transparent;
            }

            .raccoon-link,
            .raccoon-link:visited {
                color: #666666;
            }

            .raccoon-link:hover {
                color: #adadad;
            }

            .tooltip-content {
                background-color: #262626;
                color: #ededed;
            }

            .beian-link,
            .underline-text {
                color: #ededed;
            }

            .underline-text:hover {
                color: #ffffff;
            }
        }
    </style>
    <div class="inland-security-footer">
        <div class="tooltip-container">
            <div class="trigger-content">
                <a href="https://raccoon.fit/" target="_blank" rel="noreferrer" class="raccoon-link">
                    <span>© 2026 软软的小窝</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 游戏数据
        const gameData = {
            achievements: {
                'true': false,
                'fail_scholar': false,
                'fail_kid': false,
                'mortal': false,
                'god': false
            },
            scenes: {
                'start': {
                    texts: [
                        { type: 'narrator', content: '雷雨夜，山路泥泞。' },
                        { type: 'narrator', content: '你是一只修炼了五百年的黄鼠狼精，今日正是你的讨封之期。' },
                        { type: 'narrator', content: '只要能让人说一声"像人"或"像仙"，你便能化形成功，脱离妖身。' },
                        { type: 'narrator', content: '雨幕中，远远走来几个人影。你该向谁开口？' }
                    ],
                    choices: [
                        { text: '向前面那个赶路的书生讨封', nextScene: 'scholar_encounter' },
                        { text: '向路边的顽童讨封', nextScene: 'kid_encounter' },
                        { text: '再找找其他人', nextScene: 'wait_more_1' }
                    ]
                },
                'scholar_encounter': {
                    texts: [
                        { type: 'narrator', content: '你拦住了那位书生。' },
                        { type: 'speaker', content: '书生惊恐后退："何...何方妖怪！"' },
                        { type: 'narrator', content: '你急忙说道："这位公子，请问你看我像人还是像仙？"' },
                        { type: 'speaker', content: '书生脸色苍白："像...像妖怪！还不快滚！"' },
                        { type: 'narrator', content: '他转身就跑，一路上大呼小叫，引来更多人。' }
                    ],
                    choices: [
                        { text: '仓皇逃离', nextScene: 'fail_scholar' }
                    ]
                },
                'kid_encounter': {
                    texts: [
                        { type: 'narrator', content: '你拦住了那个在路边玩耍的顽童。' },
                        { type: 'speaker', content: '顽童眨眨眼："呀，好大一只黄鼠狼！"' },
                        { type: 'narrator', content: '你低声下气问道："小娃娃，你看我像什么？"' },
                        { type: 'speaker', content: '顽童拍手大笑："像个大尾巴狼！还会说话呢！"' },
                        { type: 'narrator', content: '顽童捡起石头向你扔来。' }
                    ],
                    choices: [
                        { text: '落荒而逃', nextScene: 'fail_kid' }
                    ]
                },
                'wait_more_1': {
                    texts: [
                        { type: 'narrator', content: '你觉得这几人并非有缘之人，决定再等等。' },
                        { type: 'narrator', content: '雨越下越大，山路愈发难行。' },
                        { type: 'narrator', content: '又过了良久，雨幕中缓缓走来一道青色身影。' }
                    ],
                    choices: [
                        { text: '再找找其他人', nextScene: 'wait_more_2' },
                        { text: '向这位青衣人讨封', nextScene: 'true_encounter' }
                    ]
                },
                'wait_more_2': {
                    texts: [
                        { type: 'narrator', content: '你按捺住心中的躁动，继续在雨中等待。' },
                        { type: 'narrator', content: '又过了许久，再无人经过。' },
                        { type: 'narrator', content: '那位青衣人却并未走远，他撑着油纸伞，静静立在不远处，仿佛在等你做出选择。' }
                    ],
                    choices: [
                        { text: '向他走去', nextScene: 'true_encounter' },
                        { text: '再等下去', nextScene: 'wait_final' }
                    ]
                },
                'wait_final': {
                    texts: [
                        { type: 'narrator', content: '你在雨中等了又等，筋疲力尽。' },
                        { type: 'narrator', content: '雷声渐歇，雨势减弱，天边泛起鱼肚白。' },
                        { type: 'narrator', content: '讨封的时机已过，你只能拖着疲惫的身体回到山中。' },
                        { type: 'system', content: '结局：错失良机' }
                    ],
                    choices: [
                        { text: '重新开始', nextScene: 'start', action: 'reset' }
                    ]
                },
                'true_encounter': {
                    texts: [
                        { type: 'narrator', content: '青衣人停下脚步，打量着你。' },
                        { type: 'narrator', content: '你忽然觉得此人有些面熟，却又想不起在哪里见过。' },
                        { type: 'narrator', content: '你上前作揖，声音有些颤抖："这位先生，你觉得我像人还是像仙？"' },
                        { type: 'speaker', content: '青衣人望着你，目光深邃，沉默了良久，终于开口——' },
                        { type: 'speaker', content: '"我看你既不像人也不像仙，你从始至终一直都是我的黄小仙。"' }
                    ],
                    choices: [
                        { text: '心中一颤，喃喃道：我...本就是我自己？', nextScene: 'true_ending', action: 'achievement_true' },
                        { text: '急切追问：先生此话何意？', nextScene: 'mortal_ending' }
                    ]
                },
                'true_ending': {
                    texts: [
                        { type: 'speaker', content: '"我看你既不像人也不像仙，你从始至终一直都是我的黄小仙。"' },
                        { type: 'narrator', content: '青衣人的声音不高，却如同一道惊雷在你心头炸响。' },
                        { type: 'narrator', content: '五百年间，你一直执着于"像人"或"像仙"，却从未想过，自己本就是自己。' },
                        { type: 'narrator', content: '心中的执念在这一刻烟消云散，灵台一片清明。' },
                        { type: 'narrator', content: '你不入神籍，不落凡尘，而是以本我的姿态，逍遥于山水之间。' },
                        { type: 'system', content: '成就解锁：无对无错，善良依旧' }
                    ],
                    choices: [
                        { text: '重新开始', nextScene: 'start', action: 'reset' }
                    ]
                },
                'mortal_ending': {
                    texts: [
                        { type: 'speaker', content: '"我看你像个凡人。"' },
                        { type: 'narrator', content: '青衣人说道。' },
                        { type: 'narrator', content: '你心中一喜，终于化形成功，变成了一个普通人的模样。' },
                        { type: 'narrator', content: '然而当你沉浸在喜悦中时，青衣人已转身离去，消失在雨幕中。' },
                        { type: 'narrator', content: '你入了凡尘，却渐渐忘了前尘往事，忘了自己曾是一只黄鼠狼。' },
                        { type: 'narrator', content: '转世轮回，生老病死，与常人无异。' },
                        { type: 'system', content: '结局：尘世轮回' }
                    ],
                    choices: [
                        { text: '重新开始', nextScene: 'start', action: 'reset' }
                    ]
                },
                'fail_scholar': {
                    texts: [
                        { type: 'narrator', content: '你仓皇逃入山中，五百年的修为几乎毁于一旦。' },
                        { type: 'narrator', content: '道行大损，你只能重新修炼，能否化形仍是未知数。' },
                        { type: 'narrator', content: '也许，这就是妖的命吧。' },
                        { type: 'system', content: '结局：功亏一篑' }
                    ],
                    choices: [
                        { text: '重新开始', nextScene: 'start', action: 'reset' }
                    ]
                },
                'fail_kid': {
                    texts: [
                        { type: 'narrator', content: '你躲入草丛，看着顽童跑远的背影。' },
                        { type: 'narrator', content: '童言无忌，却字字如刀。' },
                        { type: 'narrator', content: '你忽然明白，讨封一事强求不得。' },
                        { type: 'narrator', content: '或许，这就是天意吧。你转身回到山中，继续做你的黄鼠狼。' },
                        { type: 'system', content: '结局：原形毕露' }
                    ],
                    choices: [
                        { text: '重新开始', nextScene: 'start', action: 'reset' }
                    ]
                }
            },
            currentScene: 'start',
            storyHistory: [],
            typingTimer: null // 用于清除旧计时器（简单防冲突）
        };

        // 显示成就弹窗
        function showAchievement(name) {
            const popup = document.getElementById('achievement-popup');
            const nameEl = document.getElementById('achievement-name');
            nameEl.textContent = name;
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        // 解锁成就
        function unlockAchievement(id) {
            if (!gameData.achievements[id]) {
                gameData.achievements[id] = true;
                const icon = document.getElementById('ach-' + id);
                if (icon) icon.classList.add('unlocked');
                localStorage.setItem('huangdaxian_achievements', JSON.stringify(gameData.achievements));
            }
        }

        // 渲染场景（修复了语法错误和定时器问题）
        function renderScene(sceneId) {
            // 清除之前的打字计时器
            if (gameData.typingTimer) {
                clearTimeout(gameData.typingTimer);
                gameData.typingTimer = null;
            }

            const scene = gameData.scenes[sceneId];
            if (!scene) return;

            gameData.currentScene = sceneId;

            const storyContainer = document.getElementById('story-container');
            const choicesContainer = document.getElementById('choices-container');

            storyContainer.innerHTML = '';
            choicesContainer.innerHTML = '';

            let textIndex = 0;
            const totalTexts = scene.texts.length;

            // 递归显示文本（带打字机）
            function showNextText() {
                if (textIndex >= totalTexts) {
                    showChoices();
                    return;
                }

                const textObj = scene.texts[textIndex];
                const p = document.createElement('p');
                p.className = `story-text ${textObj.type}`;  // 修复模板字符串
                storyContainer.appendChild(p);
                storyContainer.scrollTop = storyContainer.scrollHeight;

                const typeSpeed = {
                    'narrator': 30,
                    'speaker': 40,
                    'system': 20
                };
                const charSpeed = typeSpeed[textObj.type] || 30;
                let charIndex = 0;
                const text = textObj.content;

                function typeNextChar() {
                    if (charIndex < text.length) {
                        p.textContent += text[charIndex];
                        charIndex++;
                        storyContainer.scrollTop = storyContainer.scrollHeight;
                        gameData.typingTimer = setTimeout(typeNextChar, charSpeed);
                    } else {
                        textIndex++;
                        gameData.typingTimer = setTimeout(showNextText, 300);
                    }
                }

                typeNextChar();
            }

            function showChoices() {
                let html = '';
                scene.choices.forEach((choice, index) => {
                    const actionParam = choice.action ? `'${choice.action}'` : 'null';
                    html += `<button class="choice-btn" onclick="handleChoice('${choice.nextScene}', ${actionParam})" style="animation-delay: ${index * 0.1}s">${choice.text}</button>`;
                });
                choicesContainer.innerHTML = html;
            }

            showNextText();
        }

        // 处理选择
        function handleChoice(nextScene, action) {
            // 执行动作
            if (action === 'achievement_true') {
                unlockAchievement('true');
                showAchievement('无对无错，善良依旧');
            } else if (action === 'reset') {
                resetGame(false);
                return;
            }

            // 延迟切换场景，让用户看清选项反馈
            setTimeout(() => {
                renderScene(nextScene);
            }, 300);
        }

        // 重置游戏（保留成就加载状态）
        function resetGame(fullReset = true) {
            // 隐藏开始界面（如果意外显示）
            const overlay = document.getElementById('startOverlay');
            if (overlay) overlay.style.display = 'none';

            if (fullReset) {
                // 完全重置成就
                gameData.achievements = {
                    'true': false,
                    'fail_scholar': false,
                    'fail_kid': false,
                    'mortal': false,
                    'god': false
                };
                localStorage.removeItem('huangdaxian_achievements');
                document.querySelectorAll('.achievement-icon').forEach(icon => {
                    icon.classList.remove('unlocked');
                });
            }
            // 无论是否完全重置，都重新开始剧情
            renderScene('start');
        }

        // 加载保存的成就
        function loadSavedAchievements() {
            const saved = localStorage.getItem('huangdaxian_achievements');
            if (saved) {
                const savedAchievements = JSON.parse(saved);
                Object.keys(savedAchievements).forEach(key => {
                    if (savedAchievements[key]) {
                        gameData.achievements[key] = true;
                        const icon = document.getElementById('ach-' + key);
                        if (icon) icon.classList.add('unlocked');
                    }
                });
            }
        }

        // 初始化：加载成就，绑定开始按钮，但不自动渲染游戏（等待开始界面）
        window.onload = function() {
            loadSavedAchievements();

            const overlay = document.getElementById('startOverlay');
            const startBtn = document.getElementById('startBtn');

            // 确保开始界面显示
            overlay.style.display = 'flex';

            startBtn.addEventListener('click', function() {
                overlay.style.display = 'none';      // 隐藏开始界面
                renderScene('start');                // 开始游戏
            });

            // 如果用户从结局点击“重新开始”，会调用resetGame，也需要隐藏overlay
            // resetGame中已有隐藏逻辑，但以防reset时overlay未隐藏，已在resetGame处理
        };

        // 暴露给全局（用于onclick调用）
        window.handleChoice = handleChoice;
        window.resetGame = resetGame;
    </script>
</body>
</html>
