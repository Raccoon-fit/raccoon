<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>黄小仙 · 讨封之卷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #000000;
            --text-color: #B0B0B0;
            --accent-color: #A93226;
            --highlight-color: #FFFFFF;
            --btn-border: #555555;
            --btn-hover: #1A1A1A;
            --illustration-bg: #0f0f0f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .game-container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
        }

        .cultivation {
            font-size: 14px;
            color: #666;
        }

        .cultivation span {
            color: #8B7355;
            font-weight: bold;
        }

        .achievements {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .achievement-icon {
            width: 28px;
            height: 28px;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0.3;
            transition: all 0.5s ease;
            position: relative;
            background: #0a0a0a;
        }

        .achievement-icon.unlocked {
            opacity: 1;
            border-color: #8B7355;
            background: #1a1510;
            box-shadow: 0 0 6px rgba(139, 115, 85, 0.3);
        }

        .achievement-icon[data-achievement]:hover::after {
            content: attr(data-title);
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1510;
            border: 1px solid #8B7355;
            padding: 4px 8px;
            font-size: 11px;
            white-space: nowrap;
            border-radius: 3px;
            z-index: 100;
            color: #d4c0a1;
        }

        /* 剧情区域 */
        .story-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .story-text {
            font-size: 17px;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .story-text.narrator {
            color: #888;
            font-style: italic;
        }

        .story-text.speaker {
            color: var(--highlight-color);
            font-weight: bold;
        }

        .story-text.system {
            color: var(--accent-color);
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 选项区域 */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 0;
            border-top: 1px solid #222;
        }

        .choice-btn {
            background: transparent;
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            padding: 15px 20px;
            font-size: 15px;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .choice-btn:hover {
            background: var(--btn-hover);
            border-color: var(--highlight-color);
            color: var(--highlight-color);
        }

        .choice-btn:active {
            transform: scale(0.98);
        }

        /* 成就弹窗 */
        .achievement-popup {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1a1510 0%, #2a2015 100%);
            border: 1px solid #8B7355;
            padding: 15px 25px;
            border-radius: 5px;
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 2100;
        }

        .achievement-popup.show {
            top: 20px;
            opacity: 1;
        }

        .achievement-popup .title {
            color: #8B7355;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .achievement-popup .name {
            color: #D4AF37;
            font-size: 16px;
            font-weight: bold;
        }

        /* 结束画面（保留原有样式） */
        .ending-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .ending-screen h2 {
            color: var(--highlight-color);
            margin-bottom: 20px;
            font-size: 20px;
        }

        .ending-screen p {
            margin-bottom: 30px;
            color: #777;
        }

        /* 底部信息区：版本号 + 备案 */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 10px;
            font-size: 12px;
            color: #444;
            border-top: 1px solid #222;
        }

        .version-container {
            position: relative;
        }

        .version-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            padding: 2px 6px;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .version-btn:hover {
            color: #aaa;
            background: #111;
        }

        /* 版本弹窗 (更新日志) */
        .changelog-popup {
            position: fixed;
            bottom: 80px;
            left: 20px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 16px 20px;
            max-width: 280px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            z-index: 2200;
            display: none;
            color: #ccc;
            font-size: 13px;
            line-height: 1.6;
            backdrop-filter: blur(4px);
        }

        .changelog-popup.show {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        .changelog-popup h4 {
            color: #8B7355;
            margin-bottom: 8px;
            font-size: 14px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .changelog-popup ul {
            padding-left: 18px;
            margin: 8px 0;
        }

        .changelog-popup li {
            margin-bottom: 4px;
        }

        .changelog-popup .date {
            color: #D4AF37;
            font-size: 11px;
            margin-top: 8px;
            text-align: right;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .inland-security-footer {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .raccoon-link {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 300;
            color: #adadad;
            text-decoration: none;
        }

        .raccoon-link:visited {
            color: #adadad;
        }

        .raccoon-link:hover {
            color: #666666;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .story-text {
                font-size: 15px;
            }

            .choice-btn {
                padding: 12px 15px;
                font-size: 14px;
            }

            .changelog-popup {
                left: 10px;
                right: 10px;
                max-width: none;
            }
        }

        /* ---------- 开始界面（省电风格 · 纯黑极简） ---------- */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #B0B0B0;
            font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
            transition: opacity 0.3s ease;
        }

        .start-content {
            text-align: center;
            max-width: 80%;
        }

        .start-content h1 {
            color: #ffffff;
            font-size: 56px;
            margin-bottom: 16px;
            font-weight: 300;
            letter-spacing: 6px;
            text-shadow: 0 0 2px rgba(255,255,255,0.2);
        }

        .start-subtitle {
            font-size: 18px;
            margin-bottom: 48px;
            color: #666;
            font-style: italic;
            letter-spacing: 2px;
        }

        .start-btn {
            background: transparent;
            border: 1px solid #444;
            color: #B0B0B0;
            padding: 14px 48px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 3px;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .start-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: #111;
        }

        /* 确保游戏内容在开始界面下方不可见 */
        .game-container {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- 开始界面 overlay (省电纯黑) -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <h1>黄小仙</h1>
            <p class="start-subtitle">五百年修行为一朝</p>
            <button class="start-btn" id="startBtn">开始讨封</button>
        </div>
    </div>

    <div class="game-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="cultivation">道行：<span id="cultivation-level">500年</span></div>
            <div class="achievements" id="achievementsContainer">
                <!-- 成就图标由js动态渲染，避免重复 -->
            </div>
        </div>

        <!-- 剧情区域 -->
        <div class="story-container" id="story-container"></div>

        <!-- 选项区域 -->
        <div class="choices-container" id="choices-container"></div>

        <!-- 底部：版本号 + 软软小窝 -->
        <div class="footer">
            <div class="version-container">
                <button class="version-btn" id="versionBtn">v1.0.1</button>
            </div>
            <div class="inland-security-footer">
                <a href="https://raccoon.fit/" target="_blank" rel="noreferrer" class="raccoon-link">
                    <span>© 2026 软软的小窝</span>
                </a>
            </div>
        </div>
    </div>

    <!-- 成就弹窗 -->
    <div class="achievement-popup" id="achievement-popup">
        <div class="title">成就解锁</div>
        <div class="name" id="achievement-name"></div>
    </div>

    <!-- 更新日志弹窗 (左下角) -->
    <div class="changelog-popup" id="changelogPopup">
        <h4>📜 更新日志 v1.0.1</h4>
        <ul>
            <li>✨ 新增多个结局分支：青衣少年两次选择不同</li>
            <li>✨ 新增「山野村夫」「文曲星耀」等成就</li>
            <li>✨ 丰富剧情深度，每个选择导向更细腻</li>
            <li>✨ 成就图标增加悬浮描述</li>
            <li>✨ 修复打字机与选项冲突</li>
        </ul>
        <div class="date">📅 更新日期：2026-03-19</div>
    </div>

    <script>
        // 游戏数据 —— 丰富多结局、多成就、青衣少年两次选择差异
        const gameData = {
            achievements: {
                'true': false,          // 无对无错，善良依旧
                'fail_scholar': false,   // 功亏一篑
                'fail_kid': false,       // 原形毕露
                'mortal': false,         // 尘世轮回
                'god': false,            // 点化成仙(青衣认可)
                'farmer': false,          // 山野村夫
                'star': false             // 文曲星耀
            },
            scenes: {
                'start': {
                    texts: [
                        { type: 'narrator', content: '雷雨夜，山路泥泞。' },
                        { type: 'narrator', content: '你是一只修炼了五百年的黄鼠狼精，今日正是你的讨封之期。' },
                        { type: 'narrator', content: '只要能让人说一声"像人"或"像仙"，你便能化形成功，脱离妖身。' },
                        { type: 'narrator', content: '雨幕中，远远走来几个人影。你该向谁开口？' }
                    ],
                    choices: [
                        { text: '向前面那个赶路的书生讨封', nextScene: 'scholar_encounter' },
                        { text: '向路边的顽童讨封', nextScene: 'kid_encounter' },
                        { text: '再找找其他人', nextScene: 'wait_more_1' }
                    ]
                },
                'scholar_encounter': {
                    texts: [
                        { type: 'narrator', content: '你拦住了那位书生。' },
                        { type: 'speaker', content: '书生惊恐后退："何...何方妖怪！"' },
                        { type: 'narrator', content: '你急忙说道："这位公子，请问你看我像人还是像仙？"' },
                        { type: 'speaker', content: '书生脸色苍白："像...像妖怪！还不快滚！"' },
                        { type: 'narrator', content: '他转身就跑，一路上大呼小叫，引来更多人。' }
                    ],
                    choices: [
                        { text: '仓皇逃离', nextScene: 'fail_scholar_end' }
                    ]
                },
                'kid_encounter': {
                    texts: [
                        { type: 'narrator', content: '你拦住了那个在路边玩耍的顽童。' },
                        { type: 'speaker', content: '顽童眨眨眼："呀，好大一只黄鼠狼！"' },
                        { type: 'narrator', content: '你低声下气问道："小娃娃，你看我像什么？"' },
                        { type: 'speaker', content: '顽童拍手大笑："像个大尾巴狼！还会说话呢！"' },
                        { type: 'narrator', content: '顽童捡起石头向你扔来。' }
                    ],
                    choices: [
                        { text: '落荒而逃', nextScene: 'fail_kid_end' }
                    ]
                },
                'wait_more_1': {
                    texts: [
                        { type: 'narrator', content: '你觉得这几人并非有缘之人，决定再等等。' },
                        { type: 'narrator', content: '雨越下越大，山路愈发难行。' },
                        { type: 'narrator', content: '又过了良久，雨幕中缓缓走来一道青色身影。' }
                    ],
                    choices: [
                        { text: '再等等，或许还有其他人', nextScene: 'wait_more_2' },
                        { text: '向这位青衣人讨封', nextScene: 'true_encounter_first' }  // 第一次遇青衣
                    ]
                },
                'wait_more_2': {
                    texts: [
                        { type: 'narrator', content: '你按捺住心中的躁动，继续在雨中等待。' },
                        { type: 'narrator', content: '又过了许久，再无人经过。' },
                        { type: 'narrator', content: '那位青衣人却并未走远，他撑着油纸伞，静静立在不远处，仿佛在等你做出选择。' }
                    ],

                        { text: '向他走去', nextScene: 'true_encounter_second' },  // 第二次遇青衣，对话不同
                        { text: '再等下去', nextScene: 'wait_final' }
                    ]
                },
                'wait_final': {
                    texts: [
                        { type: 'narrator', content: '你在雨中等了又等，筋疲力尽。' },
                        { type: 'narrator', content: '雷声渐歇，雨势减弱，天边泛起鱼肚白。' },
                        { type: 'narrator', content: '讨封的时机已过，你只能拖着疲惫的身体回到山中。' },
                        { type: 'system', content: '结局：错失良机' }
                    ],
                    choices: [
                        { text: '重新开始', nextScene: 'start', action: 'reset' }
                    ]
                },
                // 第一次遇见青衣 —— 温和而疏离
                'true_encounter_first': {
                    texts: [
                        { type: 'narrator', content: '青衣人停下脚步，伞沿微抬，露出一双清澈的眼睛。' },
                        { type: 'narrator', content: '你上前作揖："先生，你觉得我像人还是像仙？"' },

                    ]

                // 第二次遇见青衣 —— 话语更深
                'true_encounter_second': {

                    ],

                'fail_scholar_end': {

            currentScene: 'start',
            storyHistory: [],

                { id: 'true', title: '无对无错，善良依旧', icon: '🌟' },

                { id: 'fail_scholar', title: '功亏一篑', icon: '📜' },
                { id: 'fail_kid', title: '原形毕露', icon: '🍃' }

        };

        // 显示成就弹窗
        function showAchievement(name) {
            const popup = document.getElementById('achievement-popup');
            const nameEl = document.getElementById('achievement-name');
            nameEl.textContent = name;
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        // 解锁成就
        function unlockAchievement(id) {
            if (!gameData.achievements[id]) {
                gameData.achievements[id] = true;
                renderAchievementIcons();  // 重新渲染成就图标
                localStorage.setItem('huangdaxian_achievements', JSON.stringify(gameData.achievements));
                // 根据id显示中文名
                const nameMap = {
                    'true': '无对无错，善良依旧',
                    'god': '点化成仙',
                    'mortal': '尘世轮回',
                    'fail_scholar': '功亏一篑',
                    'fail_kid': '原形毕露'
                };
                if (nameMap[id]) showAchievement(nameMap[id]);
            }
        }

        // 渲染成就图标 (动态避免重复)
        function renderAchievementIcons() {
            const container = document.getElementById('achievementsContainer');
            if (!container) return;
            let html = '';
            gameData.achievementIcons.forEach(ach => {
                const unlocked = gameData.achievements[ach.id];
                html += `<div class="achievement-icon ${unlocked ? 'unlocked' : ''}" data-achievement="${ach.id}" data-title="${ach.title}">${ach.icon}</div>`;
            });
            container.innerHTML = html;
        }

        // 渲染场景（带打字机）
        function renderScene(sceneId) {
            if (gameData.typingTimer) clearTimeout(gameData.typingTimer);

            const scene = gameData.scenes[sceneId];
            if (!scene) return;

            gameData.currentScene = sceneId;

            const storyContainer = document.getElementById('story-container');
            const choicesContainer = document.getElementById('choices-container');

            storyContainer.innerHTML = '';
            choicesContainer.innerHTML = '';

            let textIndex = 0;
            const totalTexts = scene.texts.length;

            function showNextText() {
                if (textIndex >= totalTexts) {
                    showChoices();
                    return;
                }

                const textObj = scene.texts[textIndex];
                const p = document.createElement('p');
                p.className = `story-text ${textObj.type}`;
                storyContainer.appendChild(p);
                storyContainer.scrollTop = storyContainer.scrollHeight;

                const charSpeed = textObj.type === 'speaker' ? 40 : (textObj.type === 'system' ? 20 : 30);
                let charIndex = 0;
                const text = textObj.content;

                function typeNextChar() {
                    if (charIndex < text.length) {
                        p.textContent += text[charIndex];
                        charIndex++;
                        storyContainer.scrollTop = storyContainer.scrollHeight;
                        gameData.typingTimer = setTimeout(typeNextChar, charSpeed);
                    } else {
                        textIndex++;
                        gameData.typingTimer = setTimeout(showNextText, 300);
                    }
                }
                typeNextChar();
            }

            function showChoices() {
                let html = '';
                scene.choices.forEach((choice, index) => {
                    const actionParam = choice.action ? `'${choice.action}'` : 'null';
                    html += `<button class="choice-btn" onclick="handleChoice('${choice.nextScene}', ${actionParam})" style="animation-delay: ${index * 0.1}s">${choice.text}</button>`;
                });
                choicesContainer.innerHTML = html;
            }

            showNextText();
        }

        // 处理选择
        function handleChoice(nextScene, action) {
            if (action === 'achievement_true') {
                unlockAchievement('true');
            } else if (action === 'unlock_god') {
                unlockAchievement('god');
            } else if (action === 'reset') {
                resetGame(false);
                return;
            }

            setTimeout(() => {
                renderScene(nextScene);
            }, 200);
        }

        // 重置游戏 (保留成就加载)
        function resetGame(fullReset = true) {
            const overlay = document.getElementById('startOverlay');
            if (overlay) overlay.style.display = 'none';

            if (fullReset) {
                gameData.achievements = {
                    'true': false,
                    'fail_scholar': false,
                    'fail_kid': false,
                    'mortal': false,
                    'god': false
                };
                localStorage.removeItem('huangdaxian_achievements');
                renderAchievementIcons();
            }
            renderScene('start');
        }

        // 加载成就
        function loadSavedAchievements() {
            const saved = localStorage.getItem('huangdaxian_achievements');
            if (saved) {
                const savedAchievements = JSON.parse(saved);
                Object.keys(savedAchievements).forEach(key => {
                    if (savedAchievements[key]) gameData.achievements[key] = true;
                });
            }
            renderAchievementIcons();
        }

        // 版本号弹窗逻辑
        function initVersionPopup() {
            const versionBtn = document.getElementById('versionBtn');
            const popup = document.getElementById('changelogPopup');
            versionBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                popup.classList.toggle('show');
            });
            document.addEventListener('click', (e) => {
                if (!popup.contains(e.target) && e.target !== versionBtn) {
                    popup.classList.remove('show');
                }
            });
        }

        // 初始化
        window.onload = function() {
            loadSavedAchievements();

            const overlay = document.getElementById('startOverlay');
            const startBtn = document.getElementById('startBtn');

            overlay.style.display = 'flex';

            startBtn.addEventListener('click', function() {
                overlay.style.display = 'none';
                renderScene('start');
            });

            initVersionPopup();
        };

        // 全局函数
        window.handleChoice = handleChoice;
        window.resetGame = resetGame;
    </script>
</body>
</html>
