<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>是小浣熊哦 · 个人主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }
        
        .link-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .link-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .link-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .link-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        
        .link-desc {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        .email-section {
            text-align: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.2);
            margin: 20px;
            border-radius: 15px;
        }
        
        .email-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        .email-btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 25px;
            background: #ff4d4d;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .email-btn:hover {
            background: #ff3333;
            transform: scale(1.05);
        }
        
        .email-icon {
            margin-right: 8px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .links-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>· 是小浣熊哦 ·</h1>
            <p class="subtitle">欢迎来到我的个人空间，探索更多有趣内容</p>
        </header>
        
        <div class="links-container">
            <div class="link-card">
                <i class="fas fa-link link-icon"></i>
                <h3 class="link-title">MULU官方网站</h3>
                <p class="link-desc">访问我的主项目网站</p>
                <a href="https://link3.cc/littleraccoon" target="_blank" class="btn">前往网站</a>
            </div>
            
            <div class="link-card">
                <i class="fas fa-book link-icon"></i>
                <h3 class="link-title">灵熊小记官方网站</h3>
                <p class="link-desc">阅读我的成长日记与心得</p>
                <a href="https://link3.cc/training_fengfeng_games" target="_blank" class="btn">前往网站</a>
            </div>
            
            <div class="link-card">
                <i class="fab fa-weixin link-icon"></i>
                <h3 class="link-title">软软的小窝公众号</h3>
                <p class="link-desc">关注我的微信公众号获取最新动态</p>
                <a href="https://mp.weixin.qq.com/s/NpS8AsODG5qwCG5NJJeNDw" target="_blank" class="btn">关注公众号</a>
            </div>
            
            <div class="link-card">
                <i class="fab fa-bilibili link-icon"></i>
                <h3 class="link-title">哔哩哔哩官方账号</h3>
                <p class="link-desc">观看我创作的视频内容</p>
                <a href="https://www.bilibili.com/space/3494380149148445" target="_blank" class="btn">进入B站</a>
            </div>
        </div>
        
        <div class="email-section">
            <h3 class="email-title">联系我</h3>
            <a href="mailto:2051775505@qq.com" class="email-btn">
                <i class="fas fa-paper-plane email-icon"></i>
                发送邮件
            </a>
        </div>
        
        <footer>
            <p>© 2026 · 是小浣熊哦 · 网页正在制作中</p>
        </footer>
    </div>
</body>
</html>
