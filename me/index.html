<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🦝 是小浣熊哦 · 灵动个人空间</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1e2a3a, #0f1722);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态流光背景 + 漂浮粒子 */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 40%, rgba(255, 140, 60, 0.08) 0%, rgba(100, 80, 200, 0.05) 100%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.1"><path fill="none" stroke="%23ffb347" stroke-width="1.2" d="M70 40 L85 55 L70 70 L55 55 Z M120 30 L135 45 L120 60 L105 45 Z M160 80 L175 95 L160 110 L145 95 Z M40 120 L55 135 L40 150 L25 135 Z M100 150 L115 165 L100 180 L85 165 Z"/><circle cx="50" cy="130" r="4" fill="%23ffaa66"/><circle cx="140" cy="50" r="3" fill="%23ffaa66"/><circle cx="170" cy="120" r="3.5" fill="%23ffaa66"/></svg>');
            background-repeat: repeat;
            background-size: 48px;
            pointer-events: none;
            opacity: 0.2;
            z-index: 0;
        }

        /* 主容器 - 精致玻璃质感 */
        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(22, 28, 38, 0.55);
            backdrop-filter: blur(14px);
            border-radius: 3rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        /* 装饰光晕 */
        .container::before {
            content: "";
            position: absolute;
            top: -20%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 140, 70, 0.2), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        /* 头部区域 */
        header {
            text-align: center;
            padding: 2.5rem 1.5rem 1.8rem;
            position: relative;
        }

        .avatar-icon {
            font-size: 4.5rem;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
            display: inline-block;
            animation: subtleFloat 3s ease-in-out infinite;
            background: linear-gradient(135deg, #ffb347, #ff8c42);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: none;
        }

        @keyframes subtleFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0.5rem 0 0.5rem;
            background: linear-gradient(120deg, #FFF8E7, #FFD89C, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: rgba(255, 245, 220, 0.9);
            background: rgba(0, 0, 0, 0.2);
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            margin-top: 0.5rem;
        }

        /* 浣熊爪印装饰 */
        .paw-trail {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            opacity: 0.7;
        }
        .paw-trail i {
            font-size: 0.9rem;
            color: #ffbc6e;
            filter: drop-shadow(0 0 2px #ff9f4a);
        }

        /* 卡片网格 - 现代轻拟态 */
        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.8rem;
            padding: 1.5rem 2rem 2rem;
        }

        .link-card {
            background: rgba(20, 26, 36, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.8rem 1.2rem 1.5rem;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 200, 140, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 180, 80, 0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .link-card:hover::before {
            opacity: 1;
        }

        .link-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 180, 80, 0.7);
            background: rgba(30, 38, 50, 0.75);
            box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.4);
        }

        .link-icon {
            font-size: 2.8rem;
            background: linear-gradient(145deg, #FFC285, #FFA44A);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.8rem;
            transition: transform 0.2s;
            display: inline-block;
        }

        .link-card:hover .link-icon {
            transform: scale(1.08);
        }

        .link-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0.6rem 0 0.5rem;
            color: #FFE2B5;
            letter-spacing: -0.3px;
        }

        .link-desc {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 1.5rem;
            color: #dddddd;
            line-height: 1.4;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.65rem 1.4rem;
            background: rgba(255, 140, 50, 0.2);
            border-radius: 60px;
            text-decoration: none;
            color: #FFE0B5;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s;
            border: 1px solid rgba(255, 160, 70, 0.5);
            backdrop-filter: blur(4px);
        }

        .btn i {
            font-size: 0.9rem;
        }

        .btn:hover {
            background: #ff8c42;
            color: #1e1a1a;
            border-color: #ffb45e;
            box-shadow: 0 6px 14px rgba(255, 120, 30, 0.3);
            transform: scale(1.02);
        }

        /* 邮箱区域 高级感 */
        .email-section {
            text-align: center;
            padding: 1rem 2rem 2rem;
            margin: 0 1.5rem 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 150, 0.3);
        }

        .email-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .email-title i {
            font-size: 1.7rem;
            color: #ffaa55;
        }

        .email-address-box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 0.8rem 0 1.2rem;
        }
        .email-text {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-family: monospace;
            font-size: 1rem;
            letter-spacing: 0.5px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,200,100,0.4);
            color: #ffdd99;
        }
        .copy-btn {
            background: rgba(255, 150, 70, 0.2);
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #ffdbb5;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }
        .copy-btn:hover {
            background: #ff8c42;
            color: #1e2a2a;
            transform: scale(1.02);
        }
        .email-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(95deg, #ff7e2e, #ffb347);
            padding: 0.85rem 2rem;
            border-radius: 60px;
            text-decoration: none;
            color: #1f1b16;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.25s;
            box-shadow: 0 10px 18px -6px rgba(0,0,0,0.3);
            border: none;
        }
        .email-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(95deg, #ff912e, #ffc46b);
            box-shadow: 0 18px 25px -10px #ff8c4280;
            color: #000;
        }

        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #2c241aee;
            backdrop-filter: blur(12px);
            color: #ffddbb;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            border-left: 4px solid #ffaa55;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
            font-family: monospace;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #bbaa88;
            border-top: 1px solid rgba(255,200,100,0.2);
        }

        /* 装饰浮动小浣熊爪 */
        .floating-paw {
            position: absolute;
            bottom: 5%;
            right: 2%;
            font-size: 2.5rem;
            opacity: 0.3;
            pointer-events: none;
            animation: slowDrift 12s infinite alternate;
            z-index: 1;
        }
        @keyframes slowDrift {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.2; }
            100% { transform: translate(-15px, -20px) rotate(8deg); opacity: 0.5; }
        }

        @media (max-width: 680px) {
            body {
                padding: 1rem;
            }
            .links-container {
                padding: 1rem 1.2rem;
                gap: 1.2rem;
            }
            h1 {
                font-size: 2rem;
            }
            .avatar-icon {
                font-size: 3.5rem;
            }
            .email-text {
                font-size: 0.75rem;
                word-break: break-all;
            }
            .email-address-box {
                flex-direction: column;
                gap: 0.6rem;
            }
            .toast-msg {
                white-space: nowrap;
                font-size: 0.7rem;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="avatar-icon">
            🦝
        </div>
        <h1>· 是小浣熊哦 ·</h1>
        <p class="subtitle">✨ 收集温暖，分享奇趣日常 ✨</p>
        <div class="paw-trail">
            <i class="fas fa-paw"></i>
            <i class="fas fa-paw"></i>
            <i class="fas fa-paw"></i>
        </div>
    </header>

    <div class="links-container">
        <div class="link-card">
            <i class="fas fa-globe-asia link-icon"></i>
            <h3 class="link-title">MULU官方网站</h3>
            <p class="link-desc">主站 · 创作与灵感集散地</p>
            <a href="https://link3.cc/littleraccoon" target="_blank" class="btn">
                <i class="fas fa-arrow-up-right-from-squares"></i> 即刻探索
            </a>
        </div>

        <div class="link-card">
            <i class="fas fa-journal-whills link-icon"></i>
            <h3 class="link-title">灵熊小记官方网站</h3>
            <p class="link-desc">成长手记 · 温暖治愈小栈</p>
            <a href="https://link3.cc/training_fengfeng_games" target="_blank" class="btn">
                <i class="fas fa-feather"></i> 翻阅日记
            </a>
        </div>

        <div class="link-card">
            <i class="fab fa-weixin link-icon"></i>
            <h3 class="link-title">软软的小窝公众号</h3>
            <p class="link-desc">萌系推送 · 最新动态不错过</p>
            <a href="https://mp.weixin.qq.com/s/NpS8AsODG5qwCG5NJJeNDw" target="_blank" class="btn">
                <i class="fab fa-weixin"></i> 关注公众号
            </a>
        </div>

        <div class="link-card">
            <i class="fab fa-bilibili link-icon"></i>
            <h3 class="link-title">哔哩哔哩官方账号</h3>
            <p class="link-desc">视频 · 浣熊的奇妙物语</p>
            <a href="https://www.bilibili.com/space/3494380149148445" target="_blank" class="btn">
                <i class="fab fa-bilibili"></i> 直达B站
            </a>
        </div>
    </div>

    <div class="email-section">
        <div class="email-title">
            <i class="fas fa-leaf"></i> 联系小浣熊
            <i class="fas fa-envelope-open-text"></i>
        </div>
        <div class="email-address-box">
            <span class="email-text" id="emailAddr">Raccoon@raccoon.fit</span>
            <button class="copy-btn" id="copyEmailBtn">
                <i class="far fa-copy"></i> 复制邮箱
            </button>
        </div>
        <a href="mailto:Raccoon@raccoon.fit" class="email-btn">
            <i class="fas fa-paper-plane"></i> 发送邮件
        </a>
        <p style="font-size: 0.7rem; margin-top: 1rem; opacity: 0.6;">📬 来信必复，期待与你相遇</p>
    </div>

    <footer>
        <p>🦝 © 2026 · 是小浣熊哦 · 森林深处有座小木屋，网页正在温柔生长中 🌿</p>
    </footer>
</div>

<div class="floating-paw">
    <i class="fas fa-paw"></i>
</div>

<!-- 简易 Toast 提示 -->
<div id="copyToast" class="toast-msg">✨ 邮箱已复制，期待你的来信 ✨</div>

<script>
    (function() {
        const copyBtn = document.getElementById('copyEmailBtn');
        const emailSpan = document.getElementById('emailAddr');
        const toast = document.getElementById('copyToast');

        if (copyBtn && emailSpan) {
            copyBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const email = emailSpan.innerText.trim();
                try {
                    await navigator.clipboard.writeText(email);
                    showToast('📧 邮箱 ' + email + ' 已复制到剪贴板', '#ffaa55');
                } catch (err) {
                    // 降级方案
                    const textarea = document.createElement('textarea');
                    textarea.value = email;
                    document.body.appendChild(textarea);
                    textarea.select();
                    const success = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    if (success) {
                        showToast('📋 复制成功！给小浣熊写信吧', '#ffaa66');
                    } else {
                        showToast('❌ 复制失败，可以手动选中邮箱', '#ff8866');
                    }
                }
            });
        }

        function showToast(message, accentColor = '#ffaa55') {
            if (!toast) return;
            toast.textContent = message;
            toast.style.borderLeftColor = accentColor;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                // 恢复默认文字用于下次
                setTimeout(() => {
                    if (toast.textContent !== '✨ 邮箱已复制，期待你的来信 ✨') {
                        toast.textContent = '✨ 邮箱已复制，期待你的来信 ✨';
                        toast.style.borderLeftColor = '#ffaa55';
                    }
                }, 200);
            }, 2000);
        }

        // 可选: 给卡片增加点额外涟漪 (轻交互)
        const cards = document.querySelectorAll('.link-card');
        cards.forEach(card => {
            card.addEventListener('click', (e) => {
                // 防止点到内部a标签二次触发 (a标签会自己处理跳转)
                if (e.target.closest('.btn')) return;
                const btn = card.querySelector('.btn');
                if (btn && btn.href) {
                    window.open(btn.href, '_blank');
                }
            });
        });
    })();
</script>
</body>
</html>
