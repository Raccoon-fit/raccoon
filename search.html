<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
  <meta name="description" content="软软的小窝 · 极简浏览器主页"/>
  <title>软软的小窝 · 极简浏览器主页</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23FF7F50'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='system-ui'%3ER%3C/text%3E%3C/svg%3E"/>
  <!-- 字体 · 仅保留必要，不拖累性能 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- 极简tailwind (仅用于基础排版，无复杂样式) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            soft: { orange: '#FF7F50', light: '#FF9F6E', dark: '#E8642E' }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* ---------- 极致简洁 · 低配置友好 · 无动画/无重阴影 ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #d4e6ff;  /* 柔和浅蓝底 */
      font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
      color: #0a1f2c;
      overflow: hidden;       /* 防止双滚动条 */
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    /* ----- 顶栏：仅一行，极轻量 ----- */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.65); /* 半透白，清爽不卡 */
      border-bottom: 1px solid rgba(0,0,0,0.05);
      backdrop-filter: none;   /* 关闭模糊，低配流畅 */
      flex-shrink: 0;
    }

    /* 品牌小标 */
    .brand-mini {
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.01em;
      color: #1e3b4f;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .brand-mini span {
      background: #FF7F50;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 30px;
      margin-left: 6px;
    }

    /* 搜索条 —— 极简、无圆角/无渐变，纯色 */
    .search-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid #bdd3e8;
      border-radius: 40px;      /* 略微软化，但保持清爽 */
      padding: 2px 2px 2px 18px;
      transition: none;          /* 移除过渡，减少重绘 */
      box-shadow: none;
    }
    .search-bar:focus-within {
      border-color: #FF7F50;
      outline: none;
    }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1rem;
      padding: 12px 8px 12px 0;
      color: #111;
      font-weight: 500;
      min-width: 0;
    }
    .search-bar input::placeholder {
      color: #5f7d9c;
      font-weight: 400;
      opacity: 0.8;
    }

    .search-bar button {
      background: #FF7F50;       /* 纯色，无渐变 */
      border: none;
      border-radius: 40px;
      width: 52px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      flex-shrink: 0;
      transition: none;
      box-shadow: none;
      margin: 2px;
    }
    .search-bar button:hover {
      background: #e06a3a;       /* 微深，无动画 */
    }
    .search-bar button svg {
      width: 24px;
      height: 24px;
      stroke: white;
      stroke-width: 2.5;
    }

    /* 右侧小工具：官网入口 (极简) */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .home-link {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,127,80,0.5);
      color: #1e3b4f;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 40px;
      text-decoration: none;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: none;
    }
    .home-link:hover {
      background: white;
      border-color: #FF7F50;
    }

    /* ----- 全屏内嵌视图 (占用剩余全部空间) ----- */
    .browser-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: white;
      display: block;
    }

    /* 底部极简脚标 (固定高度，不抢占视图) */
    .micro-footer {
      flex-shrink: 0;
      text-align: center;
      font-size: 11px;
      padding: 6px 12px;
      color: #2c5778;
      background: transparent;
      border-top: 1px solid rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      opacity: 0.8;
    }

    /* 所有过渡/动画移除，保证低配流畅 */
    a, button, input {
      -webkit-tap-highlight-color: transparent;
    }

    /* 手机小屏适配：顶栏略微紧凑 */
    @media (max-width: 560px) {
      .top-bar {
        padding: 8px 12px;
        gap: 8px;
      }
      .brand-mini {
        font-size: 1.1rem;
      }
      .brand-mini span {
        display: none;  /* 移动端隐藏小圆标，保留清爽 */
      }
      .home-link span:last-child {
        display: none;  /* 隐藏“官网”文字，只留🏠 */
      }
      .home-link {
        padding: 8px 12px;
      }
      .search-bar input {
        font-size: 0.95rem;
        padding: 10px 4px 10px 0;
      }
      .search-bar button {
        width: 46px;
        height: 42px;
      }
    }

    /* 移除所有花哨效果 */
    .no-transition {
      transition: none !important;
    }
  </style>
</head>
<body>

<!-- 顶栏：严格一行，包含品牌+搜索框+官网入口 -->
<div class="top-bar">
  <div class="brand-mini">
    🦝 软软的小窝
    <span>lite</span>
  </div>

  <!-- 搜索框 (一行核心) -->
  <div class="search-bar">
    <input type="text" id="globalNavInput" placeholder="输入网址或关键词…" autofocus spellcheck="false" autocomplete="off">
    <button id="globalNavBtn" aria-label="前往">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
      </svg>
    </button>
  </div>

  <div class="top-actions">
    <a href="#" id="officialSiteBtn" class="home-link" title="在页面内打开 raccoon.fit">
      <span>🏠</span>
      <span>官网</span>
    </a>
  </div>
</div>

<!-- 
  内嵌视图：动态强制显示初始页面（修复srcdoc可能不加载的问题）。
  原srcdoc属性移除，通过JavaScript注入完全相同的欢迎内容，保证在任何低配浏览器中强制显示。
  保留所有原始文字、样式，不改变任何视觉内容。
-->
<iframe id="contentFrame" class="browser-frame" 
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation-by-user-activation"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy">
</iframe>

<!-- 脚标：极简信息，不占视图 -->
<div class="micro-footer">
  <span>🐎 丙午马年 · 奔腾向前</span>
  <span>RACCOON.FIT</span>
</div>

<script>
  (function() {
    "use strict";

    const input = document.getElementById('globalNavInput');
    const searchBtn = document.getElementById('globalNavBtn');
    const frame = document.getElementById('contentFrame');
    const officialBtn = document.getElementById('officialSiteBtn');

    // ---------- ✨ 强制显示嵌入页面 · 完美保留原始欢迎内容 ✨ ----------
    // 原srcdoc中的完整内容（一字不差，保留所有文字/emoji/样式）
    // 使用 data:text/html 方式强制加载，彻底避免任何浏览器对srcdoc的兼容问题
    

    // 强制显示初始页面（保证任何情况下嵌入页面都能正常展示）
    function forceShowInitialPage() {
      if (!frame) return;
      // 移除可能遗留的 srcdoc 属性，避免浏览器行为冲突
      frame.removeAttribute('srcdoc');
      // 使用 data URI 设置内容，绝对可靠，兼容所有现代浏览器及低配环境
      frame.src = "data:text/html;charset=utf-8," + encodeURIComponent(INITIAL_PAGE_HTML);
    }

    // 核心：在页面加载时立即执行强制显示，确保嵌入页面可见
    // 使用 DOMContentLoaded 保证 DOM 就绪，同时兼容 load 事件作为备胎
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', forceShowInitialPage);
    } else {
      forceShowInitialPage();
    }
    // 额外安全保险：如果由于某种异步原因未成功，load时再次确保内容可见（不会影响后续用户导航）
    window.addEventListener('load', function() {
      // 仅当当前iframe内容为空或为about:blank时重新强制加载（防止覆盖用户已访问的页面）
      if (frame && (!frame.src || frame.src === 'about:blank' || frame.src.startsWith('about:srcdoc'))) {
        forceShowInitialPage();
      }
    });

    // ---------- 核心导航：在本页面内嵌框架打开链接/搜索 ----------
    function navigateTo(rawInput) {
      let raw = rawInput.trim();
      if (!raw) return;

      // 简单判断是否为网址 (包含.且无空格，或以http开头)
      const looksLikeUrl = /^https?:\/\//i.test(raw) || /^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/|$)/.test(raw);
      let destination = raw;

      if (!looksLikeUrl) {
        // 关键词 → Bing搜索 (内嵌)
        destination = `https://www.bing.com/search?q=${encodeURIComponent(raw)}`;
      } else if (!/^https?:\/\//i.test(raw)) {
        destination = 'https://' + raw;
      }

      // 更新iframe —— 在本页面内打开 ✅
      frame.src = destination;
    }

    // 处理跳转事件
    function handleNavigate() {
      if (!input) return;
      navigateTo(input.value);
    }

    // 搜索按钮点击
    if (searchBtn) {
      searchBtn.addEventListener('click', handleNavigate);
    }

    // 输入框：使用可靠的 keydown 事件，确保回车键正常触发导航
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();  // 阻止任何潜在的默认行为
          handleNavigate();
        } else if (e.key === 'Escape') {
          input.value = '';    // ESC 清空输入框
        }
      });
    }

    // 官网按钮：在iframe内打开 raccoon.fit (保留原有体验)
    if (officialBtn) {
      officialBtn.addEventListener('click', (e) => {
        e.preventDefault();
        frame.src = 'https://raccoon.fit';
      });
    }

    // 低配友好：静默输出控制台信息，不干扰用户
    console.log("%c🦝 软软的小窝 · 轻量版浏览器主页 | 一行搜索·低配流畅 | 嵌入页面已强制显示", "color: #FF7F50; font-size: 13px; font-weight: bold;");
  })();
</script>
</body>
</html>
