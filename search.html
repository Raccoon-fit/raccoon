<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
  <title>软软的小窝 · 极简浏览器主页</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { soft: { orange: '#FF7F50' } },
          fontFamily: { sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #d4e6ff; font-family: 'Inter', 'Noto Sans SC', sans-serif; color: #0a1f2c; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .top-bar { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: rgba(255,255,255,0.68); border-bottom: 1px solid rgba(0,0,0,0.05); flex-shrink: 0; }
    .brand-mini { font-weight: 700; font-size: 1.3rem; color: #1e3b4f; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
    .brand-mini span { background: #FF7F50; color: white; font-size: 0.9rem; font-weight: 600; padding: 2px 8px; border-radius: 30px; margin-left: 6px; }
    .search-bar { flex: 1; display: flex; align-items: center; background: white; border: 1px solid #bdd3e8; border-radius: 40px; padding: 2px 2px 2px 18px; }
    .search-bar:focus-within { border-color: #FF7F50; }
    .search-bar input { flex: 1; background: transparent; border: none; outline: none; font-size: 1rem; padding: 12px 8px 12px 0; color: #111; font-weight: 500; min-width: 0; }
    .search-bar button { background: #FF7F50; border: none; border-radius: 40px; width: 52px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; margin: 2px; }
    .search-bar button:hover { background: #e06a3a; }
    .top-actions { display: flex; gap: 6px; }
    .home-link { background: rgba(255,255,255,0.7); border: 1px solid rgba(255,127,80,0.5); color: #1e3b4f; font-weight: 600; padding: 8px 16px; border-radius: 40px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .browser-frame { flex: 1; width: 100%; border: none; background: #fef9f0; }
    .micro-footer { flex-shrink: 0; font-size: 11px; padding: 6px 12px; color: #2c5778; border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; opacity: 0.8; }
    .info-banner { background: #fff1e0; text-align: center; font-size: 12px; padding: 4px; color: #b85c1a; border-bottom: 1px solid #ffe0c0; }
    @media (max-width: 560px) {
      .top-bar { padding: 8px 12px; gap: 8px; }
      .brand-mini span { display: none; }
      .home-link span:last-child { display: none; }
      .home-link { padding: 8px 12px; }
      .search-bar button { width: 46px; height: 42px; }
    }
  </style>
</head>
<body>
<div class="top-bar">
  <div class="brand-mini">🦝 软软的小窝<span>lite</span></div>
  <div class="search-bar">
    <input type="text" id="globalNavInput" placeholder="输入网址或关键词…" autofocus>
    <button id="globalNavBtn">→</button>
  </div>
  <div class="top-actions">
    <a href="#" id="officialSiteBtn" class="home-link">🏠 官网</a>
  </div>
</div>

<!-- 
  关键修复：
  - 添加 allow-popups → 链接可点击（新标签页）
  - 禁止 allow-top-navigation → 防止主页跳转
  - 保留 allow-downloads 等
-->
<iframe id="contentFrame" class="browser-frame"
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-downloads allow-modals"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
        loading="eager">
</iframe>

<div class="micro-footer">
  <span>🐎 丙午马年 · 奔腾向前</span>
  <span>RACCOON.FIT</span>
</div>

<script>
  (function() {
    const input = document.getElementById('globalNavInput');
    const searchBtn = document.getElementById('globalNavBtn');
    const frame = document.getElementById('contentFrame');
    const officialBtn = document.getElementById('officialSiteBtn');

   

    function loadInitial() {
      if (!frame) return;
      frame.src = "data:text/html;charset=utf-8," + encodeURIComponent(INITIAL_PAGE_HTML);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', loadInitial);
    else loadInitial();

    function navigateTo(raw) {
      let s = raw.trim();
      if (!s) return;
      let url = /^https?:\/\//i.test(s) ? s : (/^[a-z0-9.-]+\.[a-z]{2,}/i.test(s) ? 'https://' + s : 'https://www.bing.com/search?q=' + encodeURIComponent(s));
      frame.src = url;
    }
    searchBtn?.addEventListener('click', () => navigateTo(input.value));
    input?.addEventListener('keydown', e => { if (e.key === 'Enter') navigateTo(input.value); });
    officialBtn?.addEventListener('click', e => { e.preventDefault(); frame.src = 'https://raccoon.fit'; });
  })();
</script>
</body>
</html>
