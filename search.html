<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>软软的小窝 · 极简主页</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e8e0d8;
            --bg-soft: #f5efe8;
            --orange: #f4966e;
            --orange-deep: #e07a50;
            --orange-pale: #fff1e8;
            --text-dark: #2c2416;
            --text-mid: #5c4a38;
            --text-light: #8a7560;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.55);
            --glass-hover: rgba(255, 255, 255, 0.78);
            --border-soft: rgba(180, 160, 140, 0.25);
            --shadow-sm: 0 1px 3px rgba(80, 50, 30, 0.06);
            --shadow-md: 0 4px 16px rgba(80, 50, 30, 0.10);
            --shadow-lg: 0 12px 36px rgba(60, 30, 10, 0.16);
            --shadow-glow: 0 0 0 6px rgba(244, 150, 110, 0.10);
            --radius-sm: 14px;
            --radius-md: 22px;
            --radius-lg: 28px;
            --radius-xl: 40px;
            --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
            color: var(--text-dark);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(255, 210, 180, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 60%, rgba(240, 200, 170, 0.28) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(220, 190, 160, 0.22) 0%, transparent 50%),
                var(--bg);
        }

        /* ========== 顶部栏 ========== */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-soft);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }

        .brand-mini {
            font-weight: 700;
            font-size: 1.35rem;
            color: #3d3025;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.01em;
            flex-shrink: 0;
        }
        .brand-mini .brand-icon {
            font-size: 1.5rem;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.10));
        }
        .brand-mini .brand-badge {
            background: var(--orange);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 30px;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 8px rgba(244, 150, 110, 0.30);
        }

        /* ========== 搜索框 ========== */
        .search-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--white);
            border: 2px solid transparent;
            border-radius: var(--radius-xl);
            padding: 3px 3px 3px 20px;
            box-shadow: var(--shadow-md), 0 0 0 0 rgba(244, 150, 110, 0);
            transition: all var(--transition-smooth);
            position: relative;
            min-width: 0;
            max-width: 580px;
            margin: 0 auto;
        }
        .search-bar:hover {
            box-shadow: var(--shadow-md), 0 0 0 5px rgba(244, 150, 110, 0.05);
            border-color: rgba(244, 150, 110, 0.20);
        }
        .search-bar:focus-within {
            border-color: var(--orange);
            box-shadow: var(--shadow-md), var(--shadow-glow);
            background: #fffdfb;
        }
        .search-bar .search-icon-svg {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            color: #b8a590;
            transition: color var(--transition-fast);
            margin-right: 4px;
        }
        .search-bar:focus-within .search-icon-svg {
            color: var(--orange);
        }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            padding: 13px 6px 13px 0;
            color: #1a1a1a;
            font-weight: 500;
            min-width: 0;
            letter-spacing: 0.01em;
            font-family: inherit;
        }
        .search-bar input::placeholder {
            color: #c4b5a2;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }
        .search-bar button {
            flex-shrink: 0;
            background: var(--orange);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: all var(--transition-fast);
            box-shadow: 0 3px 10px rgba(244, 150, 110, 0.30);
            position: relative;
            overflow: hidden;
        }
        .search-bar button:hover {
            background: var(--orange-deep);
            box-shadow: 0 5px 18px rgba(224, 122, 80, 0.38);
            transform: scale(1.04);
        }
        .search-bar button:active {
            transform: scale(0.96);
            box-shadow: 0 2px 6px rgba(224, 122, 80, 0.28);
            transition: all 0.08s;
        }
        .search-bar button svg {
            width: 22px;
            height: 22px;
            transition: transform var(--transition-fast);
        }
        .search-bar button:hover svg {
            transform: translateX(1px);
        }

        .search-bar button::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s ease-out;
            pointer-events: none;
        }
        .search-bar button:active::after {
            opacity: 1;
            transform: scale(2.2);
            transition: all 0s;
        }

        /* ========== 顶部操作按钮 ========== */
        .top-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .home-link {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(200, 175, 150, 0.35);
            color: #4a3828;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: var(--radius-xl);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all var(--transition-fast);
            font-size: 0.9rem;
            letter-spacing: 0.01em;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }
        .home-link:hover {
            background: var(--glass-hover);
            border-color: var(--orange);
            box-shadow: var(--shadow-md), 0 0 0 4px rgba(244, 150, 110, 0.06);
            color: #2c1f10;
            transform: translateY(-1px);
        }
        .home-link:active {
            transform: scale(0.97);
            transition: all 0.08s;
        }
        .home-link .link-icon {
            font-size: 1.15rem;
            line-height: 1;
        }

        /* ========== 浏览器框架 ========== */
        .browser-frame-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            margin: 10px 14px 10px 14px;
            border-radius: var(--radius-lg);
            box-shadow:
                0 2px 20px rgba(60, 35, 15, 0.10),
                0 0 0 1px rgba(180, 150, 120, 0.18),
                inset 0 0 0 1px rgba(255, 255, 255, 0.25);
            background: #fdfaf6;
            transition: box-shadow var(--transition-smooth);
        }
        .browser-frame-wrap:hover {
            box-shadow:
                0 4px 28px rgba(60, 35, 15, 0.13),
                0 0 0 1px rgba(180, 150, 120, 0.22),
                inset 0 0 0 1px rgba(255, 255, 255, 0.30);
        }
        .browser-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fdfaf6;
            display: block;
            border-radius: var(--radius-lg);
        }

        /* ========== 底部 ========== */
        .micro-footer {
            flex-shrink: 0;
            font-size: 11px;
            padding: 7px 16px;
            color: #8a7560;
            border-top: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-between;
            opacity: 0.75;
            letter-spacing: 0.03em;
            background: rgba(255, 255, 255, 0.28);
        }

        /* ========== 广告弹窗 ========== */
        .ad-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(35, 18, 5, 0.40);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.25s, visibility 0.25s;
        }
        .ad-modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }
        .ad-window {
            width: 430px;
            max-width: 93vw;
            background: #fefdfb;
            border-radius: 16px;
            box-shadow: 0 24px 50px rgba(40, 20, 5, 0.30), 0 8px 16px rgba(40, 20, 5, 0.16);
            border: 1px solid rgba(200, 175, 150, 0.4);
            overflow: hidden;
            animation: modalFadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes modalFadeIn {
            from {
                transform: translateY(12px) scale(0.96);
                opacity: 0.7;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        .win-titlebar {
            background: #faf7f2;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(200, 175, 150, 0.3);
        }
        .win-titlebar h3 {
            font-weight: 600;
            font-size: 1rem;
            color: #3d2e1f;
            letter-spacing: 0.01em;
        }
        .win-close-btn {
            background: none;
            border: none;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            color: #9a8a78;
            padding: 4px 10px;
            border-radius: 8px;
            transition: all var(--transition-fast);
            font-weight: 300;
        }
        .win-close-btn:hover {
            color: #c0392b;
            background: #fce8e6;
        }
        .ad-content {
            padding: 22px 20px 20px;
            background: #fefdfb;
        }
        .ad-message {
            font-size: 1rem;
            color: #3d2e1f;
            margin-bottom: 20px;
            line-height: 1.55;
            background: var(--orange-pale);
            padding: 16px 18px;
            border-radius: 14px;
            border-left: 5px solid var(--orange);
        }
        .ad-actions {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }
        .btn-primary-ad {
            background: #f4966e;
            border: none;
            color: white;
            font-weight: 600;
            padding: 13px 16px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 14px rgba(244, 150, 110, 0.32);
            width: 100%;
            letter-spacing: 0.02em;
            font-family: inherit;
        }
        .btn-primary-ad:hover {
            background: #e07a50;
            box-shadow: 0 6px 20px rgba(224, 122, 80, 0.40);
            transform: translateY(-1px);
        }
        .btn-primary-ad:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(224, 122, 80, 0.28);
            transition: all 0.08s;
        }
        .btn-secondary-ad {
            background: #f5f0ea;
            border: 1px solid #d5c8b8;
            color: #4a3828;
            font-weight: 500;
            padding: 11px 16px;
            border-radius: 30px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            width: 100%;
            letter-spacing: 0.02em;
            font-family: inherit;
        }
        .btn-secondary-ad:hover {
            background: #ede5da;
            border-color: #c4b5a0;
        }
        .btn-secondary-ad:active {
            transform: scale(0.97);
            transition: all 0.08s;
        }
        .feedback-note {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #8a7560;
            text-align: center;
            line-height: 1.6;
        }
        .feedback-note button {
            background: none;
            border: none;
            color: #d0805a;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
            padding: 4px 8px;
            font-family: inherit;
            transition: color var(--transition-fast);
        }
        .feedback-note button:hover {
            color: #b05030;
        }
        .ad-bottom-note {
            font-size: 0.75rem;
            margin-top: 16px;
            color: #b0a090;
            text-align: center;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            .top-bar {
                padding: 10px 12px;
                gap: 8px;
            }
            .brand-mini {
                font-size: 1.15rem;
                gap: 3px;
            }
            .brand-mini .brand-badge {
                display: none;
            }
            .search-bar {
                border-radius: var(--radius-lg);
                padding: 2px 2px 2px 14px;
                max-width: 100%;
            }
            .search-bar input {
                font-size: 0.9rem;
                padding: 11px 4px 11px 0;
            }
            .search-bar input::placeholder {
                font-size: 0.85rem;
            }
            .search-bar button {
                width: 40px;
                height: 40px;
            }
            .search-bar button svg {
                width: 18px;
                height: 18px;
            }
            .search-bar .search-icon-svg {
                width: 17px;
                height: 17px;
                margin-right: 2px;
            }
            .home-link {
                padding: 8px 13px;
                font-size: 0.82rem;
                gap: 4px;
                border-radius: var(--radius-lg);
            }
            .home-link .link-label {
                display: none;
            }
            .browser-frame-wrap {
                margin: 6px 8px 6px 8px;
                border-radius: var(--radius-md);
            }
            .browser-frame {
                border-radius: var(--radius-md);
            }
            .ad-window {
                border-radius: 14px;
            }
        }
        @media (max-width: 380px) {
            .top-bar {
                padding: 8px 8px;
                gap: 5px;
            }
            .brand-mini {
                font-size: 1rem;
            }
            .search-bar {
                border-radius: var(--radius-md);
                padding: 1px 1px 1px 10px;
            }
            .search-bar input {
                font-size: 0.82rem;
                padding: 10px 2px 10px 0;
            }
            .search-bar button {
                width: 36px;
                height: 36px;
            }
            .search-bar button svg {
                width: 16px;
                height: 16px;
            }
            .home-link {
                padding: 7px 10px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 顶部栏 ==================== -->
    <div class="top-bar">
        <div class="brand-mini">
            <span class="brand-icon">🦝</span>

        <div class="search-bar">

                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="globalNavInput" placeholder="搜索或输入网址…" autofocus maxlength="500" />
            <button id="globalNavBtn" aria-label="搜索/前往" title="搜索或前往">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>
        </div>

        <div class="top-actions">
            <a href="#" id="officialSiteBtn" class="home-link">
                <span class="link-icon">🏠</span>
                <span class="link-label">官网</span>
            </a>
            <a href="#" id="downloadsBtn" class="home-link">
                <span class="link-icon">📥</span>
                <span class="link-label">查看下载</span>
            </a>
        </div>
    </div>

    <!-- ==================== 浏览器框架 ==================== -->

        <iframe
        id="contentFrame"
        class="browser-frame"
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-downloads allow-modals"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
        loading="eager"
        title="内容浏览区"
        srcdoc="<!DOCTYPE html><html lang=&quot;zh-CN&quot;><head><meta charset=&quot;utf-8&quot;/><meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1.0&quot;/><base target=&quot;_self&quot;/><style>*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;background:#fdf9f4;font-family:'Inter','Noto Sans SC',sans-serif;}body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 55% 40%,rgba(255,210,180,0.30) 0%,transparent 60%),radial-gradient(ellipse at 30% 65%,rgba(240,200,160,0.22) 0%,transparent 50%),radial-gradient(ellipse at 70% 20%,rgba(250,220,190,0.20) 0%,transparent 55%),#fdf9f4;}.glow-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.45;pointer-events:none;animation:floatOrb 14s ease-in-out infinite;}.glow-orb:nth-child(1){width:180px;height:180px;background:rgba(255,190,150,0.55);top:25%;left:30%;animation-delay:0s;}.glow-orb:nth-child(2){width:140px;height:140px;background:rgba(240,180,140,0.45);top:50%;left:55%;animation-delay:-5s;animation-duration:16s;}.glow-orb:nth-child(3){width:120px;height:120px;background:rgba(255,200,160,0.40);top:35%;left:50%;animation-delay:-9s;animation-duration:18s;}@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1);}25%{transform:translate(18px,-14px) scale(1.08);}50%{transform:translate(-10px,20px) scale(0.94);}75%{transform:translate(-16px,-8px) scale(1.05);}}.center-glow{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,160,0.30) 0%,rgba(255,180,130,0.10) 40%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;animation:breathe 6s ease-in-out infinite;}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.7;}50%{transform:translate(-50%,-50%) scale(1.25);opacity:0.45;}}</style></head><body><div class=&quot;glow-orb&quot;></div><div class=&quot;glow-orb&quot;></div><div class=&quot;glow-orb&quot;></div><div class=&quot;center-glow&quot;></div></body></html>">
    </iframe>
    </div>

    <!-- ==================== 底部 ==================== -->
    <div class="micro-footer">
        <span>🐎 丙午马年 · 奔腾向前</span>
        <span>RACCOON.FIT</span>
    </div>

    <!-- ==================== 广告弹窗 ==================== -->
    <div class="ad-modal-overlay" id="adModalOverlay">
        <div class="ad-window">
            <div class="win-titlebar">
                <h3>🦊 广告 · 欢迎体验 [黄小仙讨封] 网页小游戏</h3>
                <button class="win-close-btn" id="closeAdModalBtn" aria-label="关闭">✕</button>
            </div>
            <div class="ad-content">
                <div class="ad-message">
                    🦊 500年修为一念之间 · 讨封奇遇<br />
                    <span style="font-size:0.9rem;opacity:0.75;">点击下方按钮即刻游玩</span>
                </div>
                <div class="ad-actions">
                    <button class="btn-primary-ad" id="playGameBtn">🎮 点我查看 · 黄小仙讨封</button>
                    <div class="feedback-note">
                        如有意见请点击下方按钮进行反馈<br />
                        <button id="feedbackAdBtn">📬 意见反馈 (内嵌打开)</button>
                    </div>
                </div>
                <p class="ad-bottom-note">点击右上角 ✕ 关闭广告 · 本次会话不再弹出</p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const GAME_URL = 'http://raccoon.fit/game/%E9%BB%84%E5%B0%8F%E4%BB%99%E8%AE%A8%E5%B0%81.html';
            const FEEDBACK_URL = 'http://raccoon.fit/%E5%8F%8D%E9%A6%88';

            const input = document.getElementById('globalNavInput');
            const searchBtn = document.getElementById('globalNavBtn');
            const frame = document.getElementById('contentFrame');
            const officialBtn = document.getElementById('officialSiteBtn');
            const downloadsBtn = document.getElementById('downloadsBtn');

            const overlay = document.getElementById('adModalOverlay');
            const closeAdBtn = document.getElementById('closeAdModalBtn');
            const playGameBtn = document.getElementById('playGameBtn');
            const feedbackBtn = document.getElementById('feedbackAdBtn');

            let hasAdBeenShown = false;
            let isAdModalOpen = false;
            let adTimer = null;
            let lastLengthWarningTime = 0;

            // ---- 导航至URL (iframe) ----
            function navigateToUrl(url) {
                if (!url || !frame) return;
                let finalUrl = url;
                if (!/^https?:\/\//i.test(finalUrl) && /^[a-z0-9.-]+\.[a-z]{2,}/i.test(finalUrl)) {
                    finalUrl = 'https://' + finalUrl;
                }
                frame.src = finalUrl;
            }

            // ---- 搜索/导航 ----
            function performSearchNavigation(rawInput) {
                let s = rawInput.trim();
                if (!s) return;
                let targetUrl;
                if (/^https?:\/\//i.test(s)) {
                    targetUrl = s;
                } else if (/^[a-z0-9.-]+\.[a-z]{2,}/i.test(s)) {
                    targetUrl = 'https://' + s;
                } else {
                    targetUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(s);
                }
                if (isAdModalOpen) hideAdModal();
                navigateToUrl(targetUrl);
            }

            // ---- 广告弹窗 ----
            function showAdModal() {
                if (!overlay || hasAdBeenShown || isAdModalOpen) return;
                overlay.classList.add('show');
                isAdModalOpen = true;
                hasAdBeenShown = true;
            }

            function hideAdModal() {
                if (!overlay) return;
                overlay.classList.remove('show');
                isAdModalOpen = false;
            }

            function openInFrameAndCloseAd(url) {
                if (!url) return;
                hideAdModal();
                navigateToUrl(url);
            }

            function scheduleAdPopup() {
                if (adTimer) clearTimeout(adTimer);
                adTimer = setTimeout(() => {
                    if (!hasAdBeenShown && !isAdModalOpen) {
                        showAdModal();
                    }
                    adTimer = null;
                }, 30000);
            }

            // ---- 输入长度限制 ----
            function enforceInputLimitAndWarn() {
                if (!input) return;
                input.addEventListener('input', function(e) {
                    let currentLen = this.value.length;
                    if (currentLen > 500) {
                        this.value = this.value.slice(0, 500);
                        currentLen = 500;
                    }
                    if (currentLen === 500) {
                        const now = Date.now();
                        if (now - lastLengthWarningTime > 1500) {
                            lastLengthWarningTime = now;
                            alert('⚠️ 已达到500字符上限，无法继续输入');
                        }
                    }
                });
            }

            // ---- 事件绑定 ----
            if (searchBtn) {
                searchBtn.addEventListener('click', () => {
                    performSearchNavigation(input.value);
                });
            }

            if (input) {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        performSearchNavigation(input.value);
                    }
                });
                enforceInputLimitAndWarn();
            }

            if (officialBtn) {
                officialBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (isAdModalOpen) hideAdModal();
                    navigateToUrl('https://raccoon.fit');
                });
            }

            if (downloadsBtn) {
                downloadsBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (isAdModalOpen) hideAdModal();
                    window.location.href = 'opendownloads:';
                });
            }

            if (closeAdBtn) {
                closeAdBtn.addEventListener('click', () => {
                    hideAdModal();
                });
            }

            if (playGameBtn) {
                playGameBtn.addEventListener('click', () => {
                    openInFrameAndCloseAd(GAME_URL);
                });
            }

            if (feedbackBtn) {
                feedbackBtn.addEventListener('click', () => {
                    openInFrameAndCloseAd(FEEDBACK_URL);
                });
            }

            if (overlay) {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        e.stopPropagation();
                    }
                });
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isAdModalOpen) {
                    e.preventDefault();
                    return false;
                }
            });

            // ---- 启动 ----
            scheduleAdPopup();

            window.addEventListener('beforeunload', () => {
                if (adTimer) clearTimeout(adTimer);
            });
        })();
    </script>
</body>
</html>
