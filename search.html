<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
  <meta name="description" content="软软的小窝 · 极简搜索"/>
  <title>软软的小窝 · 搜索</title>
  <!-- 浣熊图标 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🦝%3C/text%3E%3C/svg%3E"/>
  <!-- 字体与 Tailwind -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            raccoon: {
              orange: '#FF7F50',
              orangeLight: '#FF9F6E',
              orangeDark: '#E8642E',
              brown: '#CD7A4A',
              dark: '#0B1A2A',
              surface: '#EFF6FF',
              accent: '#FF9F6E',
              glow: 'rgba(255, 127, 80, 0.4)',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'],
          },
          animation: {
            'float-soft': 'floatSoft 8s ease-in-out infinite',
            'glow-pulse': 'glowPulse 3s ease-in-out infinite',
          },
          keyframes: {
            floatSoft: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-10px) rotate(0.5deg)' },
            },
            glowPulse: {
              '0%, 100%': { boxShadow: '0 0 0px rgba(255,127,80,0)' },
              '50%': { boxShadow: '0 0 25px rgba(255,127,80,0.25)' },
            }
          },
          backgroundImage: {
            'grid-pattern': "url(\"data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E\")",
          },
          backdropBlur: {
            'xs': '2px',
          }
        }
      }
    }
  </script>
  <style>
    /* ---------- 纯净蓝调 · 只保留搜索核心 ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: #c3ddfd;  /* 柔和蓝色基底 */
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(70, 130, 200, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(100, 180, 255, 0.2) 0%, transparent 45%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      color: #0b2a41;
      font-smooth: antialiased;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* 玻璃卡片 — 干净半透明 */
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 30, 70, 0.12), inset 0 1px 2px rgba(255,255,255,0.8);
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(255, 127, 80, 0.4);
      box-shadow: 0 28px 45px -10px rgba(0, 60, 120, 0.2);
    }

    /* 搜索框强化 — 沿用原有风格，更明显 */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    #globalNavInput {
      width: 100%;
      background: rgba(255, 255, 255, 0.95) !important;
      border: 2px solid rgba(255, 127, 80, 0.35) !important;
      border-radius: 60px !important;
      padding: 1rem 5rem 1rem 1.8rem !important;
      font-size: 1.2rem;
      font-weight: 500;
      color: #0b2a41 !important;
      box-shadow: 0 6px 14px rgba(0, 30, 60, 0.06);
      transition: all 0.2s;
      outline: none;
    }

    #globalNavInput:focus {
      border-color: #FF7F50 !important;
      box-shadow: 0 0 0 5px rgba(255, 127, 80, 0.15), 0 8px 18px rgba(0,0,0,0.05);
      background: white !important;
    }

    #globalNavInput::placeholder {
      color: #5f7f9f;
      font-weight: 400;
      font-size: 1rem;
    }

    .search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, #FF7F50 0%, #E8642E 100%);
      color: white;
      width: 52px;
      height: 52px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      box-shadow: 0 8px 16px rgba(255, 127, 80, 0.35);
      border: none;
      cursor: pointer;
    }

    .search-btn:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 12px 22px rgba(255, 127, 80, 0.5);
    }

    /* 标题风格 */
    .brand-title {
      font-weight: 900;
      background: linear-gradient(135deg, #0a3146, #1a5270);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(0,60,120,0.1);
    }

    /* 官网按钮 */
    .btn-outline-blue {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(30, 90, 140, 0.3);
      color: #0b3d5c;
      font-weight: 600;
      border-radius: 60px;
      padding: 0.8rem 2.5rem;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-outline-blue:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: #FF7F50;
      color: #0a2a3f;
      transform: translateY(-2px);
      box-shadow: 0 14px 22px rgba(0, 50, 100, 0.1);
    }

    /* 装饰 */
    .welcome-text {
      color: #1e4e6f;
      font-weight: 500;
    }

    /* 移除所有不需要的固定元素，保留纯净 */
    .bg-grid-pattern {
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(200, 220, 240, 0.5); }
    ::-webkit-scrollbar-thumb { background: #7fadd0; border-radius: 6px; }
  </style>
</head>
<body class="font-sans antialiased">

<!-- 背景装饰 (纯蓝氛围) -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
  <div class="absolute inset-0 bg-grid-pattern opacity-30"></div>
  <div class="absolute top-1/4 left-1/5 w-[600px] h-[600px] bg-gradient-to-br from-blue-300/20 via-transparent to-transparent blur-[130px] rounded-full animate-float-soft"></div>
  <div class="absolute bottom-1/3 right-1/6 w-[500px] h-[500px] bg-gradient-to-tl from-indigo-200/20 via-transparent to-transparent blur-[100px] rounded-full animate-float-soft" style="animation-delay: 2s;"></div>
</div>

<!-- 主卡片：只包含搜索框、欢迎语、进入官网 -->
<div class="glass-card w-full max-w-3xl p-8 md:p-12 text-center relative z-10 animate-glow-pulse">
  
  <!-- 标题沿用：软软的小窝 + 浣熊 -->
  <div class="mb-6 flex items-center justify-center gap-2">
    <span class="text-5xl md:text-6xl drop-shadow-md">🦝</span>
    <h1 class="brand-title text-4xl md:text-6xl font-black tracking-tight">
      软软的小窝
    </h1>
  </div>
  <p class="text-[#206088] text-sm md:text-base mb-8 font-mono tracking-wider">—— 搜索 · 直达 · 灵感 ——</p>

  <!-- 搜索框 (完全沿用代码里的核心组件) -->
  <div class="search-wrapper">
    <input type="text" id="globalNavInput" placeholder="🔍 输入网址或关键词，回车直达…" 
           class="w-full" autofocus>
    <button id="globalNavBtn" class="search-btn" aria-label="搜索跳转">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
      </svg>
    </button>
  </div>
  
  <!-- 提示小字 -->
  <p class="text-xs text-[#3f7196] mt-3 font-mono tracking-wide">按 ↵ 回车键快速跳转 · 支持网址/Edge搜索</p>

  <!-- 中字号欢迎语：欢迎使用【软软的小窝】搜索页 -->
  <div class="mt-10 mb-6">
    <span class="welcome-text text-xl md:text-2xl font-medium bg-white/30 px-6 py-2 rounded-full inline-block border border-white/40 shadow-sm">
      ✨ 欢迎使用【软软的小窝】搜索页 ✨
    </span>
  </div>

  <!-- 进入官网按钮 (http://raccoon.fit) -->
  <div class="mt-2">
    <a href="http://raccoon.fit" target="_blank" rel="noopener noreferrer" 
       class="btn-outline-blue text-lg md:text-xl">
      <span>🏠</span> 进入官网 <span>→</span>
    </a>
  </div>

  <!-- 极简脚标 (保持轻盈) -->
  <div class="mt-12 text-[11px] text-[#36709c] font-mono opacity-70 border-t border-white/30 pt-5 flex justify-center gap-4">
    <span>🐎 丙午马年 · 奔腾向前</span>
    <span>·</span>
    <span>RACCOON.FIT</span>
  </div>
</div>

<script>
  (function() {
    "use strict";
    
    // ---------- 搜索逻辑 (完全沿用原搜索框功能) ----------
    const initSearch = function() {
      const input = document.getElementById('globalNavInput');
      const btn = document.getElementById('globalNavBtn');
      if (!input || !btn) return;

      function handleNavigate() {
        let raw = input.value.trim();
        if (!raw) return;
        
        // 判断是否为网址或关键词
        const isUrl = /^https?:\/\//i.test(raw) || /^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/.test(raw);
        let finalUrl = raw;
        
        if (!isUrl) {
  finalUrl = `https://www.bing.com/search?q=${encodeURIComponent(raw)}`;
} else if (!/^https?:\/\//i.test(raw)) {
          // 补全协议
          finalUrl = 'https://' + raw;
        }
        
        window.open(finalUrl, '_blank');
        input.value = '';  // 清空输入框
      }

      btn.addEventListener('click', handleNavigate);
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleNavigate();
        }
      });
    };

    // 页面加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSearch);
    } else {
      initSearch();
    }

    // 可选：自动聚焦输入框 (已经autofocus)
    
    // 移除所有原页面冗余的fixed元素(无，已精简)。保持纯净。
    // 添加一点点微交互：点击卡片无干扰
    
    console.log("%c🦝 软软的小窝 · 蓝调搜索页 | 简洁 · 专注", "color: #FF7F50; font-size: 14px; font-weight: bold;");
    
    // 小细节：按ESC清空输入框
    const inputEl = document.getElementById('globalNavInput');
    if (inputEl) {
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          inputEl.value = '';
        }
      });
    }
  })();
</script>

<!-- 完全移除了：导航栏、项目卡片、实验室、关于、反馈按钮、称号入口、密码模态等。
     只保留纯净搜索体验，背景蓝色，符合“只有一个搜索框，标题沿用，欢迎语+进入官网” -->
</body>
</html>
