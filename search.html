<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
  <meta name="description" content="软软的小窝 · 极简搜索"/>
  <title>软软的小窝 · 搜索</title>
  <!-- 简洁图标 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23FF7F50'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='system-ui'%3ER%3C/text%3E%3C/svg%3E"/>
  <!-- 字体与 Tailwind -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            raccoon: {
              orange: '#FF7F50',
              orangeLight: '#FF9F6E',
              orangeDark: '#E8642E',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* ---------- 浅蓝色背景 · 无圆角框 · 文字黑色/深色 · 清晰可读 ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: #d4e6ff;  /* 柔和浅蓝色，纯色无渐变 */
      color: #1a1a1a;        /* 全局文字深色/黑色 */
      font-smooth: antialiased;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* 内容容器：无背景、无边框、无圆角 */
    .content-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    /* 搜索框加大版 */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    #globalNavInput {
      width: 100%;
      background: white !important;
      border: 2px solid rgba(255, 127, 80, 0.5) !important;
      border-radius: 60px !important;
      padding: 1.4rem 6.5rem 1.4rem 2.2rem !important;
      font-size: 1.45rem !important;
      font-weight: 500;
      color: #111 !important;          /* 输入框文字黑色 */
      box-shadow: 0 8px 18px rgba(0, 20, 40, 0.06);
      transition: all 0.2s;
      outline: none;
      line-height: 1.4;
    }

    #globalNavInput:focus {
      border-color: #FF7F50 !important;
      box-shadow: 0 0 0 5px rgba(255, 127, 80, 0.12), 0 8px 20px rgba(0,0,0,0.03);
      background: white !important;
    }

    #globalNavInput::placeholder {
      color: #4a6075;
      font-weight: 400;
      font-size: 1.15rem;
    }

    /* 搜索按钮加大 */
    .search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, #FF7F50 0%, #E8642E 100%);
      color: white;
      width: 62px;
      height: 62px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      box-shadow: 0 8px 18px rgba(255, 127, 80, 0.35);
      border: none;
      cursor: pointer;
    }

    .search-btn:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 14px 24px rgba(255, 127, 80, 0.5);
    }

    .search-btn svg {
      width: 30px;
      height: 30px;
    }

    /* 标题风格 —— 文字深色/黑色，保留渐变但清晰可见 */
    .brand-title {
      font-weight: 900;
      background: linear-gradient(135deg, #1e2fee, #1e3b4f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }

    /* 副标题文字黑色 */
    .subhead-text {
      color: #1e3b4f;
    }

    /* 官网按钮 —— 干净样式 */
    .btn-outline-blue {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(30, 90, 140, 0.5);
      color: #0a1f2c;                /* 深色文字 */
      font-weight: 600;
      border-radius: 60px;
      padding: 0.8rem 2.5rem;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-outline-blue:hover {
      background: white;
      border-color: #FF7F50;
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 14px 22px rgba(0, 30, 60, 0.08);
    }

    /* 欢迎语 —— 黑色/深色，背景浅白半透明 */
    .welcome-text {
      color: #0a1c28;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255,255,255,0.9);
      backdrop-filter: none;
    }

    /* 提示小字与脚标 —— 深色 */
    .hint-text, .footer-note {
      color: #1f4059;
    }

    .footer-note {
      border-top-color: rgba(0,0,0,0.08) !important;
    }

    /* 调整链接/文字颜色 */
    a, p, span {
      color: inherit;
    }

    /* 移除所有不需要的背景、圆角卡片 */
  </style>
</head>
<body class="font-sans antialiased">

<!-- 纯浅蓝色背景，无任何装饰，直接展示内容 -->
<div class="content-container">
  
  <!-- 标题沿用：软软的小窝 (无浣熊emoji) -->
  <div class="mb-6">
    <h1 class="brand-title text-4xl md:text-6xl font-black tracking-tight">
      软软的小窝
    </h1>
  </div>
  <p class="subhead-text text-sm md:text-base mb-8 font-mono tracking-wider">—— 搜索 · 直达 · 灵感 ——</p>

  <!-- 搜索框 (加大版，无圆角外框) -->
  <div class="search-wrapper">
    <input type="text" id="globalNavInput" placeholder="🔍 输入网址或关键词，回车直达…" 
           class="w-full" autofocus>
    <button id="globalNavBtn" class="search-btn" aria-label="搜索跳转">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
      </svg>
    </button>
  </div>
  
  <!-- 提示小字 -->
  <p class="hint-text text-xs mt-3 font-mono tracking-wide">按 ↵ 回车键快速跳转 · 支持网址/Edge搜索</p>

  <!-- 中字号欢迎语：欢迎使用【软软的小窝】搜索页 (完全不动，文字黑色) -->
  <div class="mt-10 mb-6">
    <span class="welcome-text text-xl md:text-2xl font-medium px-6 py-2 rounded-full inline-block shadow-sm">
      ✨ 欢迎使用【软软的小窝】搜索页 ✨
    </span>
  </div>

  <!-- 进入官网按钮 (http://raccoon.fit) -->
  <div class="mt-2">
    <a href="http://raccoon.fit" target="_blank" rel="noopener noreferrer" 
       class="btn-outline-blue text-lg md:text-xl">
      <span>🏠</span> 进入官网 <span>→</span>
    </a>
  </div>

  <!-- 极简脚标 -->
  <div class="footer-note mt-12 text-[11px] font-mono opacity-70 pt-5 flex justify-center gap-4 border-t">
    <span>🐎 丙午马年 · 奔腾向前</span>
    <span>·</span>
    <span>RACCOON.FIT</span>
  </div>
</div>

<script>
  (function() {
    "use strict";
    
    // ---------- 搜索逻辑 (关键词使用 Bing 搜索) ----------
    const initSearch = function() {
      const input = document.getElementById('globalNavInput');
      const btn = document.getElementById('globalNavBtn');
      if (!input || !btn) return;

      function handleNavigate() {
        let raw = input.value.trim();
        if (!raw) return;
        
        // 判断是否为网址或关键词
        const isUrl = /^https?:\/\//i.test(raw) || /^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/.test(raw);
        let finalUrl = raw;
        
        if (!isUrl) {
          finalUrl = `https://www.bing.com/search?q=${encodeURIComponent(raw)}`;
        } else if (!/^https?:\/\//i.test(raw)) {
          finalUrl = 'https://' + raw;
        }
        
        window.open(finalUrl, '_blank');
        input.value = '';
      }

      btn.addEventListener('click', handleNavigate);
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleNavigate();
        }
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSearch);
    } else {
      initSearch();
    }

    console.log("%c🦝 软软的小窝 · 浅蓝极简 | 文字黑色 · 清晰", "color: #FF7F50; font-size: 14px; font-weight: bold;");
    
    // 按ESC清空输入框
    const inputEl = document.getElementById('globalNavInput');
    if (inputEl) {
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          inputEl.value = '';
        }
      });
    }
  })();
</script>

<!-- 背景浅蓝，文字黑色/深色，无圆角框，搜索框加大，完全符合要求 -->
</body>
</html>
