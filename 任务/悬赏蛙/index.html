<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务说明</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 40px;
            font-weight: 500;
        }
        .task-list {
            list-style: none;
        }
        .task-item {
            background: #111;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .task-number {
            display: inline-block;
            background: #fff;
            color: #000;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .task-title {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .task-link {
            color: #4da6ff;
            text-decoration: none;
            display: inline-block;
            padding: 10px 20px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
            transition: all 0.3s ease;
            word-break: break-all;
        }
        .task-link:hover {
            background: #222;
            border-color: #4da6ff;
        }
        .task-desc {
            color: #999;
            font-size: 14px;
            margin-top: 12px;
        }
        .warning {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 8px;
        }
        .highlight {
            color: #ffcc00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>任务完成步骤</h1>
        <ul class="task-list">
            <li class="task-item">
                <span class="task-number">1</span>
                <div class="task-title">进入游戏链接，游玩体验</div>
                <a href="http://raccoon.fit/game/黄小仙讨封.html" class="task-link" target="_blank">
                    点击进入游戏
                </a>
            </li>
            <li class="task-item">
                <span class="task-number">2</span>
                <div class="task-title">游玩后进入反馈页面，填写真实反馈</div>
                <a href="http://raccoon.fit/反馈/" class="task-link" target="_blank">
                    点击进入反馈页
                </a>
            </li>
            <li class="task-item">
                <span class="task-number">3</span>
                <div class="task-title">回到【悬赏蛙】APP提交截图</div>
                <p class="task-desc">
                    截图需包含：<span class="highlight">时间</span>和<span class="highlight">页面下方成功字样</span>
                </p>
                <p class="warning">如截图不符合要求将不予通过审核</p>
            </li>
        </ul>
    </div>


</body>
</html>
