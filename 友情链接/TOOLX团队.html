:root {
  --bg-grad: linear-gradient(135deg,#eef2ff 0%,#f5f3ff 45%,#e0f2fe 100%);

  --card-border: rgba(255,255,255,.7);

  --progress:rgba(99,102,241,.25);
}
[data-theme="dark"] {

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg-grad); color:var(--text); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:24px;
  transition:background .4s,color .4s; position:relative; overflow:hidden;
}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(800px 500px at 18% 22%,rgba(99,102,241,.25),transparent 60%),radial-gradient(700px 460px at 82% 78%,rgba(14,165,233,.22),transparent 60%);z-index:0;}
.theme-btn{position:fixed;top:18px;right:18px;z-index:10;width:44px;height:44px;border-radius:14px;
  border:1px solid var(--card-border);background:var(--card-bg);color:var(--text);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);box-shadow:var(--shadow);transition:.3s;}
.theme-btn:hover{transform:scale(1.06);}
.card{position:relative;z-index:1;width:100%;max-width:460px;padding:36px 32px;border-radius:28px;
  background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  text-align:center;transition:transform .4s,background .4s,border-color .4s;}
.card:hover{transform:translateY(-4px);}
.icon{width:96px;height:96px;margin:0 auto 20px;border-radius:26px;background:var(--icon-bg);
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(37,99,235,.22);padding:12px;transition:background .4s;}
.icon img{width:100%;height:100%;object-fit:contain;display:block;}
h1{font-size:25px;font-weight:800;letter-spacing:.5px;margin-bottom:6px;}
.site{font-size:14px;color:var(--accent2);font-weight:600;margin-bottom:14px;letter-spacing:.3px;}
p.desc{font-size:14.5px;line-height:1.7;color:var(--sub);margin-bottom:18px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px;}
.tag{font-size:12px;padding:5px 12px;border-radius:20px;background:var(--tag-bg);color:var(--tag-text);font-weight:600;}
.countdown{font-size:13.5px;color:var(--sub);margin-bottom:8px;}
.countdown b{color:var(--accent);font-weight:800;}
.bar{height:6px;width:100%;background:rgba(148,163,184,.22);border-radius:99px;overflow:hidden;margin-bottom:22px;}
.bar > i{display:block;height:100%;width:0%;background:var(--btn-bg);border-radius:99px;transition:width .3s linear;}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn{font-size:14.5px;font-weight:700;padding:11px 22px;border-radius:14px;cursor:pointer;border:none;text-decoration:none;
  background:var(--btn-bg);color:var(--btn-text);box-shadow:0 6px 20px rgba(99,102,241,.3);transition:.3s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(99,102,241,.4);}
.btn.ghost{background:transparent;color:var(--text);box-shadow:none;border:1px solid var(--card-border);}
.btn.ghost:hover{background:var(--card-bg);}
.note{font-size:12px;color:var(--sub);margin-top:16px;min-height:18px;}
a{color:inherit;text-decoration:none;}

  <h1 itemprop="name">TOOLX团队</h1>
  <div class="site" itemprop="url"><a href="https://toolx.top" target="_blank" rel="noopener noreferrer">toolx.top</a></div>
  <p class="desc" itemprop="description">专注开发者效率的专业团队。提供前端在线工具、VisioDroidStudio、CDN 安全监控等，以简洁现代的矢量工具集，让开发与安全运维更高效。</p>

  <div class="countdown" id="cd">将在 <b>5</b> 秒后自动跳转至 TOOLX团队 主页…</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="actions">
    <a class="btn" href="https://toolx.top" target="_blank" rel="noopener noreferrer" id="goBtn">立即访问</a>
    <button class="btn ghost" id="cancelBtn" type="button">取消跳转</button>
  </div>

</main>
<script>
(function(){
  var t=parseInt(localStorage.getItem('theme')||'auto',10);
  var m=window.matchMedia('(prefers-color-scheme: dark)');
  function apply(theme){
    var dark=(theme==='dark')||(theme==='auto'&&m.matches);
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    var btn=document.getElementById('themeBtn');if(btn)btn.textContent=dark?'☀':'☾';
  }
  apply(t==='dark'||t==='light'?t:'auto');
  var btn=document.getElementById('themeBtn');
  btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
    var next=cur==='dark'?'light':'dark';localStorage.setItem('theme',next);apply(next);
  });
  m.addEventListener&&m.addEventListener('change',function(){if((localStorage.getItem('theme')||'auto')==='auto')apply('auto');});

  var DUR=5,elapsed=0,timer=null;
  var cd=document.getElementById('cd'),prog=document.getElementById('prog'),note=document.getElementById('note');
  var go=document.getElementById('goBtn');
  function tick(){
    elapsed++;var left=DUR-elapsed;
    if(left>0){cd.innerHTML='将在 <b>'+left+'</b> 秒后自动跳转至 TOOLX团队 主页…';prog.style.width=(elapsed/DUR*100)+'%';}
    else{prog.style.width='100%';cd.innerHTML='正在跳转至 <b>TOOLX团队</b>…';stopTimer();setTimeout(function(){window.location.replace('https://toolx.top');},350);}
  }
  function startTimer(){prog.style.width='0%';timer=setInterval(tick,1000);}
  function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
  document.getElementById('cancelBtn').addEventListener('click',function(){
    stopTimer();cd.textContent='已取消自动跳转';note.innerHTML='可随时点击「立即访问」手动前往 <a href="https://toolx.top" target="_blank" rel="noopener noreferrer">toolx.top</a>';
  });
  go.addEventListener('click',function(){stopTimer();});
  startTimer();
})();
</script>
