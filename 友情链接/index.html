<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>软软的小窝 · 友情链接</title>
<style>
:root{
  --bg:#0a0a16;
  --ink:#eef0ff;
  --muted:#a9a6c4;
  --acc:#c4b5ff;
  --acc2:#86e3ff;
  --glass-bg:rgba(255,255,255,.07);
  --glass-border:rgba(255,255,255,.16);
  --glass-shadow:0 8px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 600px at 88% -8%,rgba(140,110,255,.28),transparent 60%),
    radial-gradient(800px 560px at -10% 108%,rgba(90,200,255,.20),transparent 60%),
    radial-gradient(600px 400px at 50% 40%,rgba(255,120,200,.10),transparent 60%),
    var(--bg);
  color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
/* 浮动光斑，增强液态玻璃的通透感 */
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(220px 220px at 18% 22%,rgba(180,160,255,.18),transparent 70%),
    radial-gradient(260px 260px at 82% 78%,rgba(130,220,255,.14),transparent 70%);
  pointer-events:none;z-index:0;
}
header{padding:52px 24px 16px;max-width:1040px;margin:auto;position:relative;z-index:1}
.brand{color:var(--muted);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
h1{
  font-size:34px;margin:10px 0 8px;font-weight:900;letter-spacing:.01em;
  background:linear-gradient(90deg,#fff,var(--acc) 55%,var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--muted);font-size:13px;max-width:660px}
main{
  max-width:1040px;margin:auto;padding:22px 24px 80px;
  display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  position:relative;z-index:1;
}
/* 液态玻璃卡片 */
.card{
  position:relative;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  backdrop-filter:blur(14px) saturate(140%);
  border:1px solid var(--glass-border);
  border-radius:20px;
  padding:22px 20px 18px;
  display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.08);
  transition:.3s cubic-bezier(.2,.8,.2,1);
  cursor:pointer;
  overflow:hidden;
}
/* 玻璃高光 */
.card::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 42%);
  pointer-events:none;border-radius:inherit;
}
.card:hover{
  transform:translateY(-5px);
  background:rgba(255,255,255,.11);
  border-color:rgba(196,181,255,.55);
  box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 1px rgba(196,181,255,.25),inset 0 1px 0 rgba(255,255,255,.12);
}
.ico{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:linear-gradient(135deg,rgba(140,120,220,.35),rgba(80,160,220,.25));
  border:1px solid rgba(255,255,255,.18);color:var(--acc);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}
/* 链接名称放大突出 */
.name{
  font-weight:900;word-break:break-all;font-size:21px;line-height:1.3;
  letter-spacing:.01em;
  background:linear-gradient(90deg,#fff 30%,var(--acc));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.btn{
  flex:0 0 auto;color:var(--acc);text-decoration:none;font-size:12.5px;font-weight:700;
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 13px;
  cursor:pointer;background:rgba(255,255,255,.06);font-family:inherit;transition:.2s;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.btn:hover{background:rgba(196,181,255,.18);color:var(--acc2);border-color:rgba(134,227,255,.5)}
#status{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 20px}
.skel{height:104px;border-radius:20px;
  background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));
  background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{
  background:var(--glass-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px dashed var(--glass-border);border-radius:20px;padding:42px 24px;color:var(--muted);
  grid-column:1/-1;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.empty b{color:var(--ink)}
footer{max-width:1040px;margin:auto;padding:0 24px 40px;color:#5e5a72;font-size:12px;text-align:center;position:relative;z-index:1}
</style></head>
<body>
<header><div class="brand">Raccoon.Fit · 软软的小窝</div><h1>友情链接</h1><div class="sub">在梦境中保持清醒 · 在现实中保持想象 — 新增友情链接推送后自动出现在列表</div></header>
<main id="app"><div id="status">正在加载友情链接列表…</div></main>
<footer>© 2025-2026 软软 · 超现实设计哲学 · DREAM AWAKE · CREATE BEYOND</footer>
<script>
const OWNER="Raccoon-fit",REPO="raccoon",DIR="友情链接",SITE="https://raccoon.fit",BRANCH="main";
const DIR_ENC=DIR.split("/").map(encodeURIComponent).join("/");
const API="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+DIR_ENC;
const app=document.getElementById("app"),status=document.getElementById("status");
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fmt(n){if(!n&&n!==0)return"";if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(2)+" MB"}
function siteLink(name){return SITE+"/"+DIR.split("/").map(encodeURIComponent).join("/")+"/"+encodeURIComponent(name)}
async function load(){try{
  status.innerHTML='<div class="skel" style="max-width:560px;margin:auto"></div><div style="margin-top:14px;font-size:13px">正在拉取友情链接列表…</div>';
  const r=await fetch(API,{headers:{"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}});
  if(!r.ok)throw new Error("HTTP "+r.status);let items=await r.json();
  if(!Array.isArray(items))throw new Error("非目录");
  items=items.filter(i=>i.type==="file"&&i.name.toLowerCase().endsWith(".html")&&i.name!=="index.html").sort((a,b)=>a.name.localeCompare(b.name,"zh"));
  if(!items.length){status.outerHTML='<div class="empty"><b>目录中暂无其他友情链接</b><br><span style="font-size:12.5px">把作品 HTML 与 index.html 放在同一目录（'+esc(DIR)+'），推送后刷新即可自动出现。</span></div>';return}
  status.remove();
  for(const it of items){const name=it.name.replace(/\.html$/i,"");const card=document.createElement("div");card.className="card";
    card.innerHTML='<div class="ico">✦</div><div class="name">'+esc(name)+'</div><div class="meta">'+(it.size?fmt(it.size):"")+' · 友情链接</div><div class="row"><button class="btn" data-act="site">打开 →</button></div>';
    card.addEventListener("click",()=>window.open(siteLink(it.name),"_blank","noopener"));
    app.appendChild(card);
  }
}catch(e){status.innerHTML='加载失败：'+esc(e.message)+'<br><span style="font-size:12px">请确认仓库为公开，且 OWNER/REPO 已正确配置。</span>';console.error(e)}}
load();
</script>
</body></html>
