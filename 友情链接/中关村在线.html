    <script>
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'auto';
        if (savedTheme !== 'auto') html.setAttribute('data-theme', savedTheme);
        updateThemeIcon();

        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        });

        function updateThemeIcon() {
            const isDark = html.getAttribute('data-theme') === 'dark' ||
                (html.getAttribute('data-theme') === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            themeToggle.textContent = isDark ? '☀' : '☾';
        }

        // 5秒倒计时跳转
        const TOTAL = 5;
        let elapsed = 0;
        let timer = null;
        const countdownNum = document.getElementById('countdownNum');
        const progressFill = document.getElementById('progressFill');
        const countdownWrap = document.getElementById('countdownWrap');
        const cancelTip = document.getElementById('cancelTip');
        const cancelBtn = document.getElementById('cancelBtn');

        function startTimer() {
            timer = setInterval(() => {
                elapsed++;
                const left = TOTAL - elapsed;
                countdownNum.textContent = left;
                progressFill.style.width = (elapsed / TOTAL * 100) + '%';

                if (elapsed >= TOTAL) {
                    clearInterval(timer);
                    window.location.replace('https://www.zol.com.cn/');
                }
            }, 1000);
        }

        function stopTimer() {
            if (timer) { clearInterval(timer); timer = null; }
            countdownWrap.style.display = 'none';
            cancelTip.style.display = 'block';
        }

        cancelBtn.addEventListener('click', stopTimer);
        startTimer();
    </script>
