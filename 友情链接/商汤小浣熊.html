<style>
:root{
  --bg-1:#eef4ff;--bg-2:#fef3f2;--bg-3:#eaf9f0;
  --card-bg:rgba(255,255,255,.62);--card-border:rgba(255,255,255,.7);
  --text:#1f2733;--sub:#5b6572;--brand:#1e6fff;--brand-2:#ff6a4d;
  --btn-text:#fff;
  --tag-bg:rgba(30,111,255,.08);--tag-text:#1e6fff;
  --shadow:0 12px 40px rgba(30,60,120,.14);
}
[data-theme="dark"]{
  --bg-1:#0f1626;--bg-2:#1a1320;--bg-3:#0d1a17;
  --card-bg:rgba(28,34,46,.55);--card-border:rgba(255,255,255,.08);
  --text:#eef1f5;--sub:#a6b0bd;--brand:#6aa4ff;--brand-2:#ff8a6a;
  --tag-bg:rgba(106,164,255,.14);--tag-text:#9ec5ff;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);background:var(--bg-1);
  background-image:radial-gradient(1200px 700px at 12% 8%,var(--bg-2) 0%,transparent 60%),
    radial-gradient(900px 600px at 88% 92%,var(--bg-3) 0%,transparent 60%);
  min-height:100%;display:flex;align-items:center;justify-content:center;
  padding:24px;transition:background-color .4s,color .4s;
}
.theme-btn{
  position:fixed;top:18px;right:18px;width:44px;height:44px;border-radius:14px;
  border:1px solid var(--card-border);background:var(--card-bg);color:var(--text);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:var(--shadow);transition:transform .25s;z-index:9;
}
.theme-btn:hover{transform:rotate(15deg) scale(1.06);}
.card{
  width:100%;max-width:560px;position:relative;overflow:hidden;
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:26px;
  backdrop-filter:blur(20px) saturate(165%);-webkit-backdrop-filter:blur(20px) saturate(165%);
  box-shadow:var(--shadow);padding:34px 32px 26px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
.card::before{content:"";position:absolute;inset:-2px;border-radius:28px;
  background:conic-gradient(from 130deg at 70% 10%,rgba(30,111,255,.25),transparent 40%,rgba(255,106,77,.22) 70%,transparent);
  z-index:-1;filter:blur(2px);opacity:.7;}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98);}to{opacity:1;transform:none;}}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.logo{width:68px;height:68px;border-radius:20px;flex:none;
  background:linear-gradient(135deg,#dce9ff,#ffe3df);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 6px 18px rgba(30,111,255,.18);border:1px solid rgba(255,255,255,.6);}
[data-theme="dark"] .logo{background:linear-gradient(135deg,#1c2a44,#3a1f29);border-color:rgba(255,255,255,.08);box-shadow:0 6px 18px rgba(0,0,0,.4);}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:18px;}
.title{font-size:21px;font-weight:800;letter-spacing:.2px;line-height:1.25;}
.title small{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-top:3px;letter-spacing:.5px;}
.meta{font-size:13px;color:var(--sub);margin-top:2px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px;}
.tag{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;
  background:var(--tag-bg);color:var(--tag-text);}
.desc{font-size:14.5px;line-height:1.75;color:var(--sub);margin:14px 0 4px;}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--card-border),transparent);margin:20px 0;}
.countdown{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.countdown .label{font-size:13px;color:var(--sub);white-space:nowrap;}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(120,130,150,.14);overflow:hidden;}
.bar>i{display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .25s linear;}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--brand);font-size:15px;min-width:42px;text-align:right;}
.actions{display:flex;gap:12px;flex-wrap:wrap;}
.btn{flex:1;min-width:140px;text-align:center;text-decoration:none;font-weight:700;font-size:14.5px;
  padding:12px 16px;border-radius:14px;transition:transform .2s,box-shadow .2s,opacity .2s;cursor:pointer;border:none;font-family:inherit;}
.btn.primary{color:var(--btn-text);background:linear-gradient(135deg,var(--brand),#4d8bff);box-shadow:0 8px 22px rgba(30,111,255,.28);}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(30,111,255,.34);}
.btn.ghost{color:var(--text);background:transparent;border:1.5px solid var(--card-border);}
.btn.ghost:hover{background:var(--tag-bg);}
.note{font-size:12px;color:var(--sub);margin-top:14px;text-align:center;display:none;}
.note.show{display:block;}
footer{margin-top:18px;text-align:center;font-size:11px;color:var(--sub);opacity:.8;}
footer a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--sub);}
</style>
</head>
