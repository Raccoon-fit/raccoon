<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>软软的小窝 · 反馈 · 省电版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
            text-align: center;
            color: #aaa;
        }
        textarea {
            width: 100%;
            padding: 1rem;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            resize: vertical;
            min-height: 150px;
            margin-bottom: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        textarea:focus {
            border-color: #666;
        }
        button {
            width: 100%;
            padding: 1rem;
            background: #1a5c1a;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2a7a2a;
        }
        button:disabled {
            background: #333;
            cursor: not-allowed;
        }
        .status {
            margin-top: 1rem;
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            word-break: break-word;
        }
        .status.success {
            color: #4caf50;
        }
        .status.error {
            color: #f44336;
        }
        .battery-hint {
            color: #555;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>软软的小窝 · 反馈</h1>
        <textarea id="feedbackInput" placeholder="请输入您的反馈内容..." aria-label="反馈输入框"></textarea>
        <button id="submitBtn" disabled>提交反馈</button>
        <div id="status" class="status">初始化中 ...</div>
        <div class="battery-hint" id="extraInfoHint"></div>
    </div>

    <script>
        (function() {
            let batteryLevel = '未知电量';
            let networkType = '未知网络';
            let downlinkSpeed = '未知网速';

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (connection) {
                networkType = connection.effectiveType || '未知网络';
                downlinkSpeed = connection.downlink ? connection.downlink + ' Mbps' : '未知网速';
            } else {
                if (navigator.onLine) {
                    networkType = '在线(常规)';
                } else {
                    networkType = '离线';
                }
            }

            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    batteryLevel = Math.floor(battery.level * 100) + '%';
                }).catch(() => {});
            }

            const hintDiv = document.getElementById('extraInfoHint');
            setTimeout(() => {
                let currentBattery = batteryLevel;
                hintDiv.textContent = `📱 提交时将附带: 电量 ${batteryLevel} · ${networkType} · ${downlinkSpeed}`;
            }, 200);

            const LOGIN_URL = 'http://159.75.183.170:3000/Users/Login';
            const POST_ADD_URL = 'http://159.75.183.170:3000/Posts/PostsAdd';
            const digits = "0123456789";
            const mixedWithNoise = [0, 3, 0, 5, 0, 5, 2, 7, 6, 9, 0, 5, 1, 3];
            const mixedPasswordNoise = [3, 0, 5, 0, 5, 2, 0, 7, 6, 9, 5, 1, 3, 0];
            const LOCALTOKEN_POSTADD = 'TA1DBPQ19f7sT9HWZYPVeCiVsfMqcrfHaQzk2TbN3UgI9h9ZXjlLSm0gIVTK7s/VXgOSjLcRNJf6VZur0hMVUzo+uzE5TvZRCPnTT5gdFWmhedtyWXF3TXrrP6GMUnylIa6O3V+ZojnQj91I/lHqhw==';
            const SECTION_ID = '15';
            let tokenPart1 = '';
            let tokenPart2 = '';
            let tokenPart3 = '';
            const feedbackInput = document.getElementById('feedbackInput');
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');

            function buildStringFromNoisyArray(noisyArr) {
                return noisyArr.filter(v => v !== 0).map(idx => digits[idx]).join('');
            }

            function getUserDevice() {
                return navigator.userAgent || '未知设备';
            }

            function getBatterySyncLike() {
                if (navigator.battery && navigator.battery.level !== undefined) {
                    return Math.floor(navigator.battery.level * 100) + '%';
                }
                return batteryLevel;
            }

            function getNetworkInfo() {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    return {
                        type: conn.effectiveType || '未知',
                        speed: conn.downlink ? conn.downlink + ' Mbps' : '未知'
                    };
                } else {
                    return {
                        type: navigator.onLine ? '在线' : '离线',
                        speed: '未知'
                    };
                }
            }

            function getCurrentTime() {
                const d = new Date();
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const hour = String(d.getHours()).padStart(2, '0');
                const minute = String(d.getMinutes()).padStart(2, '0');
                const second = String(d.getSeconds()).padStart(2, '0');
                return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
            }

            async function login() {
                try {
                    const username = buildStringFromNoisyArray(mixedWithNoise);
                    const password = buildStringFromNoisyArray(mixedPasswordNoise);
                    const body = `name=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                    const response = await fetch(LOGIN_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: body
                    });
                    const text = await response.text();
                    let json;
                    try {
                        json = JSON.parse(text);
                    } catch {
                        throw new Error('登录返回非JSON格式');
                    }
                    if (json.code === 20001) {
                        statusDiv.textContent = '请稍后重试或联系管理员。';
                        statusDiv.className = 'status error';
                        return false;
                    }
                    if (response.ok && json.code === 1 && json.data && json.data.token) {
                        const token = json.data.token;
                        const len = token.length;
                        const part1Len = Math.floor(len / 3);
                        const part2Len = Math.floor(len / 3);
                        tokenPart1 = token.substring(0, part1Len);
                        tokenPart2 = token.substring(part1Len, part1Len + part2Len);
                        tokenPart3 = token.substring(part1Len + part2Len);
                        statusDiv.textContent = '登录成功，可以提交反馈。';
                        statusDiv.className = 'status success';
                        submitBtn.disabled = false;

                        if ('getBattery' in navigator) {
                            navigator.getBattery().then(battery => {
                                batteryLevel = Math.floor(battery.level * 100) + '%';
                                const net = getNetworkInfo();
                                hintDiv.textContent = `📱 提交时将附带: 电量 ${batteryLevel} · ${net.type} · ${net.speed}`;
                            }).catch(() => {});
                        } else {
                            const net = getNetworkInfo();
                            hintDiv.textContent = ``;
                        }
                        return true;
                    } else {
                        throw new Error(json.msg || '登录失败');
                    }
                } catch (e) {
                    statusDiv.textContent = `登录错误: ${e.message}`;
                    statusDiv.className = 'status error';
                    return false;
                }
            }

            async function submitFeedback() {
                const content = feedbackInput.value.trim();
                if (!content) {
                    statusDiv.textContent = '反馈内容不能为空';
                    statusDiv.className = 'status error';
                    return;
                }
                submitBtn.disabled = true;
                statusDiv.textContent = '提交中...';
                statusDiv.className = 'status';

                let finalBattery = batteryLevel;
                if ('getBattery' in navigator) {
                    try {
                        const battery = await navigator.getBattery();
                        finalBattery = Math.floor(battery.level * 100) + '%';
                    } catch { }
                }
                const net = getNetworkInfo();
                const device = getUserDevice();
                const time = getCurrentTime();

                const textContent = `反馈时间：${time}\n反馈内容：${content}\n用户手机型号：${device}\n【设备电量】${finalBattery}\n【网络类型】${net.type}\n【当前网速】${net.speed}`;

                const delta = JSON.stringify([{ insert: textContent }]);
                const title = '【软软的小窝官网】反馈';
                const fullToken = tokenPart1 + tokenPart2 + tokenPart3;

                try {
                    const body = new URLSearchParams();
                    body.append('title', title);
                    body.append('sections', SECTION_ID);
                    body.append('text', delta);
                    body.append('token', fullToken);
                    body.append('isMd', '0');
                    
                    const response = await fetch(POST_ADD_URL, {
                        method: 'POST',
                        headers: {
                            'Authorization': fullToken,
                            'localtoken': LOCALTOKEN_POSTADD,
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: body.toString()
                    });
                    const text = await response.text();
                    let json;
                    try {
                        json = JSON.parse(text);
                    } catch {
                        throw new Error('服务器返回非JSON格式：' + text);
                    }
                    if (response.ok && json.code === 1) {
                        const preview = content.length > 20 ? content.substring(0,20) + '...' : content;
                        statusDiv.textContent = `反馈提交成功 (长度:${textContent.length}, 内容: ${preview})，感谢您的支持！`;
                        statusDiv.className = 'status success';
                        feedbackInput.value = '';
                    } else {
                        throw new Error(json.msg || '提交失败');
                    }
                } catch (e) {
                    statusDiv.textContent = `提交错误: ${e.message}`;
                    statusDiv.className = 'status error';
                } finally {
                    submitBtn.disabled = false;
                }
            }

            window.addEventListener('load', async () => {
                statusDiv.textContent = '正在登录...';
                await login();
            });

            submitBtn.addEventListener('click', submitFeedback);
        })();
    </script>
</body>
</html>
