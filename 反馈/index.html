<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>软软的小窝 · 反馈</title>
    <!-- ===== 修复 HTTPS 问题：不再自动跳转，显示友好提示 ===== -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 1.2rem;
            text-align: center;
            color: #aaa;
            letter-spacing: 1px;
        }
        /* HTTPS 警告条 */
        .https-warning {
            background: #b85c5c;
            color: white;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.95rem;
            border: 1px solid #d32f2f;
        }
        .https-warning a {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .feedback-meta {
            background: #0a0a0a;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.2rem;
            border: 1px solid #222;
        }
        .meta-row {
            margin-bottom: 0.9rem;
            display: flex;
            flex-direction: column;
        }
        .meta-row label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.25rem;
            letter-spacing: 0.3px;
        }
        .meta-row select {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 0.75rem 0.8rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.15s;
            width: 100%;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23777' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1rem;
        }
        .meta-row select:focus {
            border-color: #666;
        }
        .meta-row select option {
            background: #111;
            color: #eee;
        }
        .meta-row select option:disabled {
            color: #555;
        }
        .dynamic-container {
            margin-top: 0.5rem;
            border-left: 2px solid #2a5c2a;
            padding-left: 0.8rem;
        }
        .dynamic-container.hidden {
            display: none;
        }
        .dynamic-container select {
            background: #1a1a1a;
        }
        textarea {
            width: 100%;
            padding: 1rem;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            resize: vertical;
            min-height: 150px;
            margin-bottom: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        textarea:focus {
            border-color: #666;
        }
        button {
            width: 100%;
            padding: 1rem;
            background: #1a5c1a;
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2a7a2a;
        }
        button:disabled {
            background: #333;
            cursor: not-allowed;
        }
        .status {
            margin-top: 1rem;
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            word-break: break-word;
        }
        .status.success {
            color: #4caf50;
        }
        .status.error {
            color: #f44336;
        }
        .battery-hint {
            color: #555;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.5rem;
        }
        .footnote {
            color: #3a3a3a;
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1rem;
            border-top: 1px solid #222;
            padding-top: 0.5rem;
        }
        .required-hint {
            color: #b85c5c;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HTTPS 警告容器（默认隐藏，通过JS显示） -->
        <div id="httpsWarning" class="https-warning" style="display: none;">
            ⚠️ 检测到您正在使用 HTTPS 访问，但服务需要 HTTP 协议。
            <a href="http://raccoon.fit/%E5%8F%8D%E9%A6%88/" id="switchToHttpLink">点击此处切换到 HTTP 版本</a>
        </div>

        <h1>软软的小窝 · 反馈</h1>

        <!-- 新增的下拉区域：全部改为“请选择”占位 -->
        <div class="feedback-meta">
            <!-- 反馈类型 (建议/Bug) 默认请选择 -->
            <div class="meta-row">
                <label>反馈类型 <span style="color:#b85c5c;">*</span></label>
                <select id="feedbackTypeSelect">
                    <option value="" disabled selected>—— 请选择反馈类型 ——</option>
                    <option value="建议">建议</option>
                    <option value="Bug">Bug</option>
                </select>
            </div>

            <!-- 反馈项目 默认请选择 -->
            <div class="meta-row">
                <label>反馈项目 <span style="color:#b85c5c;">*</span></label>
                <select id="projectSelect">
                    <option value="" disabled selected>—— 请选择反馈项目 ——</option>
                    <option value="官网">官网</option>
                    <option value="游戏">游戏</option>
                    <option value="旗下APP">旗下APP</option>
                    <option value="webide插件">webide插件</option>
                </select>
            </div>

            <!-- 动态二级菜单：游戏类型容器 (默认隐藏) 且包含占位选项 -->
            <div id="gameTypeContainer" class="dynamic-container hidden">
                <div class="meta-row" style="margin-bottom:0;">
                    <label>🎮 游戏类型 <span style="color:#b85c5c;">*</span></label>
                    <select id="gameTypeSelect">
                        <option value="" disabled selected>—— 请选择游戏类型 ——</option>
                        <option>飞翔的浣熊</option>
                        <option>星际陨石防御者</option>
                        <option>太空探险家</option>
                        <option>修仙问道</option>
                        <option>黄小仙讨封</option>
                        <option>其他</option>
                    </select>
                </div>
            </div>

            <!-- 动态二级菜单：APP名称容器 占位 -->
            <div id="appNameContainer" class="dynamic-container hidden">
                <div class="meta-row" style="margin-bottom:0;">
                    <label>📱 APP名称 <span style="color:#b85c5c;">*</span></label>
                    <select id="appSelect">
                        <option value="" disabled selected>—— 请选择APP名称 ——</option>
                        <option>MULU</option>
                        <option>灵熊小记</option>
                        <option>其他</option>
                    </select>
                </div>
            </div>

            <!-- 动态二级菜单：插件名称容器 占位 -->
            <div id="pluginNameContainer" class="dynamic-container hidden">
                <div class="meta-row" style="margin-bottom:0;">
                    <label>🔌 插件名称 <span style="color:#b85c5c;">*</span></label>
                    <select id="pluginSelect">
                        <option value="" disabled selected>—— 请选择插件名称 ——</option>
                        <option>屏幕绘制(教师端)</option>
                        <option>其他</option>
                    </select>
                </div>
            </div>
            <div class="required-hint">* 所有项目均为必选</div>
        </div>

        <!-- 原有的反馈输入框 -->
        <textarea id="feedbackInput" placeholder="请输入详细的反馈内容..." aria-label="反馈输入框"></textarea>
        <button id="submitBtn" disabled>提交反馈</button>
        <div id="status" class="status">初始化中 ...</div>
        <div class="battery-hint" id="extraInfoHint"></div>
        <div class="footnote">分类信息自动填入标题及内容末尾</div>
    </div>

    <script>
        (function() {
            // ---------- HTTPS 检测与处理 ----------
            const warningDiv = document.getElementById('httpsWarning');
            const switchLink = document.getElementById('switchToHttpLink');

            function handleHttps() {
                if (window.location.protocol === 'https:') {
                    // 显示警告条，并禁用提交按钮（保留其他功能，但用户无法提交）
                    warningDiv.style.display = 'block';
                    submitBtn.disabled = true;
                    statusDiv.textContent = '请使用 HTTP 协议访问以提交反馈。';
                    statusDiv.className = 'status error';

                    // 构建 HTTP 链接（保留路径、参数、哈希）
                    const httpUrl = 'http://' + window.location.host + window.location.pathname + window.location.search + window.location.hash;
                    switchLink.setAttribute('href', httpUrl);
                } else {
                    // 已经是 HTTP，隐藏警告（如有）
                    warningDiv.style.display = 'none';
                }
            }

            // ---------- 原有电量/网络信息 ----------
            let batteryLevel = '未知电量';
            let networkType = '未知网络';
            let downlinkSpeed = '未知网速';

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (connection) {
                networkType = connection.effectiveType || '未知网络';
                downlinkSpeed = connection.downlink ? connection.downlink + ' Mbps' : '未知网速';
            } else {
                if (navigator.onLine) {
                    networkType = '在线(常规)';
                } else {
                    networkType = '离线';
                }
            }

            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    batteryLevel = Math.floor(battery.level * 100) + '%';
                }).catch(() => {});
            }

            const hintDiv = document.getElementById('extraInfoHint');
            setTimeout(() => {
                hintDiv.textContent = ``;
            }, 200);

            // ---------- 固定配置 (原有登录信息不变) ----------
            const LOGIN_URL = 'http://159.75.183.170:3000/Users/Login';
            const POST_ADD_URL = 'http://159.75.183.170:3000/Posts/PostsAdd';
            const digits = "0123456789";
            const mixedWithNoise = [0, 3, 0, 5, 0, 5, 2, 7, 6, 9, 0, 5, 1, 3];
            const mixedPasswordNoise = [3, 0, 5, 0, 5, 2, 0, 7, 6, 9, 5, 1, 3, 0];
            const LOCALTOKEN_POSTADD = 'TA1DBPQ19f7sT9HWZYPVeCiVsfMqcrfHaQzk2TbN3UgI9h9ZXjlLSm0gIVTK7s/VXgOSjLcRNJf6VZur0hMVUzo+uzE5TvZRCPnTT5gdFWmhedtyWXF3TXrrP6GMUnylIa6O3V+ZojnQj91I/lHqhw==';
            const SECTION_ID = '15';
            let tokenPart1 = '';
            let tokenPart2 = '';
            let tokenPart3 = '';

            // ---------- DOM 元素 ----------
            const feedbackInput = document.getElementById('feedbackInput');
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');

            // 下拉元素
            const feedbackTypeSelect = document.getElementById('feedbackTypeSelect');
            const projectSelect = document.getElementById('projectSelect');
            const gameTypeContainer = document.getElementById('gameTypeContainer');
            const appNameContainer = document.getElementById('appNameContainer');
            const pluginNameContainer = document.getElementById('pluginNameContainer');
            const gameTypeSelect = document.getElementById('gameTypeSelect');
            const appSelect = document.getElementById('appSelect');
            const pluginSelect = document.getElementById('pluginSelect');

            // ---------- 辅助函数 (原有) ----------
            function buildStringFromNoisyArray(noisyArr) {
                return noisyArr.filter(v => v !== 0).map(idx => digits[idx]).join('');
            }

            function getUserDevice() {
                return navigator.userAgent || '未知设备';
            }

            function getNetworkInfo() {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    return {
                        type: conn.effectiveType || '未知',
                        speed: conn.downlink ? conn.downlink + ' Mbps' : '未知'
                    };
                } else {
                    return {
                        type: navigator.onLine ? '在线' : '离线',
                        speed: '未知'
                    };
                }
            }

            function getCurrentTime() {
                const d = new Date();
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const hour = String(d.getHours()).padStart(2, '0');
                const minute = String(d.getMinutes()).padStart(2, '0');
                const second = String(d.getSeconds()).padStart(2, '0');
                return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
            }

            // ---------- 联动：根据项目显示/隐藏二级，并重置二级为占位 ----------
            function updateDynamicMenus() {
                const project = projectSelect.value; // 可能为 "" (占位符)

                // 先全部隐藏
                gameTypeContainer.classList.add('hidden');
                appNameContainer.classList.add('hidden');
                pluginNameContainer.classList.add('hidden');

                // 如果项目未选 (空字符串) 则直接返回，不显示任何二级
                if (!project) return;

                // 根据项目显示对应容器，并将该容器内的选择重置为占位符 (value = "")
                if (project === '游戏') {
                    gameTypeContainer.classList.remove('hidden');
                    // 重置为占位选项 (disabled selected 的 value 为空)
                    gameTypeSelect.value = '';
                } else if (project === '旗下APP') {
                    appNameContainer.classList.remove('hidden');
                    appSelect.value = '';
                } else if (project === 'webide插件') {
                    pluginNameContainer.classList.remove('hidden');
                    pluginSelect.value = '';
                }
                // 官网：没有二级，保持全部隐藏
            }

            // 监听项目变化
            projectSelect.addEventListener('change', updateDynamicMenus);

            // ---------- 登录逻辑 (原有，获取token) ----------
            async function login() {
                // 如果当前是 HTTPS，不执行登录，已由 handleHttps 禁用按钮并显示提示
                if (window.location.protocol === 'https:') {
                    return false;
                }

                try {
                    const username = buildStringFromNoisyArray(mixedWithNoise);
                    const password = buildStringFromNoisyArray(mixedPasswordNoise);
                    const body = `name=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                    const response = await fetch(LOGIN_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: body
                    });
                    const text = await response.text();
                    let json;
                    try {
                        json = JSON.parse(text);
                    } catch {
                        throw new Error('登录返回非JSON格式');
                    }
                    if (json.code === 20001) {
                        statusDiv.textContent = '请稍后重试或联系管理员。';
                        statusDiv.className = 'status error';
                        return false;
                    }
                    if (response.ok && json.code === 1 && json.data && json.data.token) {
                        const token = json.data.token;
                        const len = token.length;
                        const part1Len = Math.floor(len / 3);
                        const part2Len = Math.floor(len / 3);
                        tokenPart1 = token.substring(0, part1Len);
                        tokenPart2 = token.substring(part1Len, part1Len + part2Len);
                        tokenPart3 = token.substring(part1Len + part2Len);
                        statusDiv.textContent = '登录成功，请选择分类并填写反馈。';
                        statusDiv.className = 'status success';
                        submitBtn.disabled = false;  // 登录成功启用按钮，但提交时会验证选项

                        if ('getBattery' in navigator) {
                            navigator.getBattery().then(battery => {
                                batteryLevel = Math.floor(battery.level * 100) + '%';
                            }).catch(() => {});
                        }
                        return true;
                    } else {
                        throw new Error(json.msg || '登录失败');
                    }
                } catch (e) {
                    statusDiv.textContent = `登录错误: ${e.message}`;
                    statusDiv.className = 'status error';
                    return false;
                }
            }

            // ---------- 提交反馈 (增加必选验证，防止手欠) ----------
            async function submitFeedback() {
                // 如果 HTTPS，按钮已被禁用，不会进入这里，但以防万一
                if (window.location.protocol === 'https:') {
                    statusDiv.textContent = '请在 HTTP 协议下提交。';
                    statusDiv.className = 'status error';
                    return;
                }

                // 1. 验证反馈类型和项目是否已选 (不能是占位符)
                const feedbackType = feedbackTypeSelect.value;
                const project = projectSelect.value;

                if (!feedbackType) {
                    statusDiv.textContent = '请选择反馈类型';
                    statusDiv.className = 'status error';
                    return;
                }
                if (!project) {
                    statusDiv.textContent = '请选择反馈项目';
                    statusDiv.className = 'status error';
                    return;
                }

                // 2. 根据项目验证对应的二级菜单是否已选
                let subTypeLabel = '';
                let subTypeValue = '';

                if (project === '游戏') {
                    subTypeValue = gameTypeSelect.value;
                    subTypeLabel = '游戏类型';
                    if (!subTypeValue) {
                        statusDiv.textContent = '请选择游戏类型';
                        statusDiv.className = 'status error';
                        return;
                    }
                } else if (project === '旗下APP') {
                    subTypeValue = appSelect.value;
                    subTypeLabel = 'APP名称';
                    if (!subTypeValue) {
                        statusDiv.textContent = '请选择APP名称';
                        statusDiv.className = 'status error';
                        return;
                    }
                } else if (project === 'webide插件') {
                    subTypeValue = pluginSelect.value;
                    subTypeLabel = '插件名称';
                    if (!subTypeValue) {
                        statusDiv.textContent = '请选择插件名称';
                        statusDiv.className = 'status error';
                        return;
                    }
                }
                // 官网：无二级，不需要验证

                // 3. 验证反馈内容
                const content = feedbackInput.value.trim();
                if (!content) {
                    statusDiv.textContent = '反馈内容不能为空';
                    statusDiv.className = 'status error';
                    return;
                }

                // ----- 构建标题 -----
                let title = `【${project}`;
                if (subTypeValue) {
                    title += `(${subTypeValue})`;
                }
                title += `】${feedbackType}`;

                // ----- 构建详细内容 (末尾添加 /n) -----
                let finalBattery = batteryLevel;
                if ('getBattery' in navigator) {
                    try {
                        const battery = await navigator.getBattery();
                        finalBattery = Math.floor(battery.level * 100) + '%';
                    } catch { }
                }
                const net = getNetworkInfo();
                const device = getUserDevice();
                const time = getCurrentTime();

                let textContent = `反馈时间：${time}\n`;
                textContent += `反馈项目：${project}`;
                if (subTypeLabel && subTypeValue) {
                    textContent += `；${subTypeLabel}：${subTypeValue}`;
                }
                textContent += `\n反馈类型：${feedbackType}\n`;
                textContent += `反馈内容：${content}\n`;
                textContent += `用户手机型号：${device}\n`;
                textContent += `【当前网速】${net.speed}\n`;
                textContent += `【网络类型】${net.type}\n`;
                textContent += `【设备电量】${finalBattery}\n`;
                textContent += `/n`;   // 以 /n 结尾

                const delta = JSON.stringify([{ insert: textContent }]);
                const fullToken = tokenPart1 + tokenPart2 + tokenPart3;

                // 禁用按钮，防止二次提交
                submitBtn.disabled = true;
                statusDiv.textContent = '提交中...';
                statusDiv.className = 'status';

                try {
                    const body = new URLSearchParams();
                    body.append('title', title);
                    body.append('sections', SECTION_ID);
                    body.append('text', delta);
                    body.append('token', fullToken);
                    body.append('isMd', '0');

                    const response = await fetch(POST_ADD_URL, {
                        method: 'POST',
                        headers: {
                            'Authorization': fullToken,
                            'localtoken': LOCALTOKEN_POSTADD,
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: body.toString()
                    });
                    const text = await response.text();
                    let json;
                    try {
                        json = JSON.parse(text);
                    } catch {
                        throw new Error('服务器返回非JSON格式：' + text);
                    }
                    if (response.ok && json.code === 1) {
                        const preview = content.length > 20 ? content.substring(0,20) + '...' : content;
                        statusDiv.textContent = `✓ 反馈提交成功 (分类:${project}|${feedbackType}, 内容: ${preview})，感谢！`;
                        statusDiv.className = 'status success';
                        feedbackInput.value = '';  // 清空输入框

                        // 可选：重置所有选择到占位符（避免下次直接提交）
                        feedbackTypeSelect.value = '';
                        projectSelect.value = '';
                        // 隐藏所有二级并重置
                        gameTypeContainer.classList.add('hidden');
                        appNameContainer.classList.add('hidden');
                        pluginNameContainer.classList.add('hidden');
                        gameTypeSelect.value = '';
                        appSelect.value = '';
                        pluginSelect.value = '';
                    } else {
                        throw new Error(json.msg || '提交失败');
                    }
                } catch (e) {
                    statusDiv.textContent = `提交错误: ${e.message}`;
                    statusDiv.className = 'status error';
                } finally {
                    submitBtn.disabled = false;
                }
            }

            // ---------- 初始化 ----------
            window.addEventListener('load', async () => {
                // 先处理 HTTPS 情况（显示警告并禁用按钮）
                handleHttps();

                // 如果不是 HTTPS，才尝试登录
                if (window.location.protocol !== 'https:') {
                    statusDiv.textContent = '正在登录...';
                    await login();
                } else {
                    // HTTPS 下不登录，按钮已被禁用，状态已设置
                }

                // 确保二级菜单初始为隐藏 (因为项目默认为空)
                updateDynamicMenus();
            });

            submitBtn.addEventListener('click', submitFeedback);
        })();
    </script>
</body>
</html>
