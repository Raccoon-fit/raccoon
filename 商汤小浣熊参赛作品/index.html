<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商汤小浣熊参赛作品 · 软软的小窝</title>
<style>
:root{--bg:#0b0b14;--ink:#e8e6f0;--muted:#9b97b0;--card:#14131f;--line:#262438;--acc:#b9a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:34px 22px 10px;max-width:920px;margin:auto}.brand{color:var(--muted);font-size:13px;letter-spacing:.05em}
h1{font-size:24px;margin:6px 0 4px;font-weight:800}.sub{color:var(--muted);font-size:13px}
main{max-width:920px;margin:auto;padding:18px 22px 60px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;transition:.2s;border-top:3px solid transparent}
.card:hover{border-top-color:var(--acc);transform:translateY(-2px);box-shadow:0 8px 24px #00000033}
.name{font-weight:700;word-break:break-all}.meta{color:var(--muted);font-size:12px}
a.open{flex:0 0 auto;align-self:flex-start;margin-top:auto;color:var(--acc);text-decoration:none;font-size:13px;font-weight:700;border:1px solid #3a335c;border-radius:999px;padding:5px 12px}
a.open:hover{background:#1c1a2c}#status{text-align:center;color:var(--muted);padding:40px 20px;grid-column:1/-1}
</style></head>
<body>
<header><div class="brand">Raccoon.Fit · 软软的小窝</div><h1>商汤小浣熊参赛作品</h1><div class="sub">在梦境中保持清醒 · 在现实中保持想象 — 新增作品推送后自动出现在列表</div></header>
<main id="app"><div id="status">正在加载作品列表…</div></main>
<script>
const API="https://api.github.com/repos/RaccoonFit/raccoon.fit/contents/%E5%95%86%E6%B1%A4%E5%B0%8F%E6%B5%A3%E7%86%8A%E5%8F%82%E8%B5%9B%E4%BD%9C%E5%93%81";const SITE="https://raccoon.fit";const DIR="商汤小浣熊参赛作品";
const app=document.getElementById("app"),status=document.getElementById("status");
function escape(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fmt(n){if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(2)+" MB"}
function link(name){return SITE+"/"+DIR.split("/").map(encodeURIComponent).join("/")+"/"+encodeURIComponent(name)}
async function load(){try{const r=await fetch(API,{headers:{"Accept":"application/vnd.github+json"}});if(!r.ok)throw new Error("HTTP "+r.status);let items=await r.json();if(!Array.isArray(items))throw new Error("非目录");items=items.filter(i=>i.type==="file"&&i.name.endsWith(".html")&&i.name!=="index.html").sort((a,b)=>a.name.localeCompare(b.name,"zh"));if(!items.length){status.textContent="暂无 HTML 作品（index.html 自身已隐藏）";return}status.remove();for(const it of items){const card=document.createElement("a");card.className="card";card.href=link(it.name);card.target="_blank";card.rel="noopener";card.innerHTML='<div class="name">'+escape(it.name)+'</div><div class="meta">'+(it.size?fmt(it.size):"")+'</div><span class="open">打开作品 →</span>';app.appendChild(card)}}catch(e){status.textContent="加载失败："+e.message+"（请确认仓库为公开，且 OWNER/REPO 已正确配置）";console.error(e)}}
load();
</script></body></html>
