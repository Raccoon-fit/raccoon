<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<title>七夕 · 鹊桥有约 · 定制贺卡</title>
<!--
  七夕限定页面 v4
  本版改动：
  1. 字体/缩放兼容性加固：Web Font 兜底、text-size-adjust、min-width:0、overflow-wrap
     等，避免用户放大字号或系统字体缺失时错位
  2. 微信/QQ 分享通道接入：
     - 检测微信/QQ 内置浏览器，提供长按保存 + scheme 兜底引导
     - 生成含二维码的分享图（可扫码直接进入贺卡页）
     - 多平台分享菜单（微信/QQ/微博/复制链接）
-->
<!-- 中文字体 Web Font 兜底：系统缺失楷体时使用 Noto Serif SC，避免降级为默认字体导致行高错位 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  /* ===== 基础 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; overflow-x: hidden;
    /* 防止 iOS Safari / 微信内嵌浏览器自动调整字体大小 */
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 25%, #2d1b5e 50%, #4a1e5a 75%, #6b1e4a 100%);
    min-height: 100vh;
    /* 字体栈：优先系统楷体 → Web Font 兜底 → 通用 serif；确保任何设备都有合适字体 */
    font-family: "STKaiti", "KaiTi", "楷体", "Kaiti SC", "PingFang SC",
                 "Ma Shan Zheng", "Noto Serif SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑",
                 serif;
    color: #fff;
    position: relative;
    /* 通用文字防溢出 */
    word-wrap: break-word;
    overflow-wrap: break-word;
    /* 抗锯齿，字体渲染更平滑 */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  @media (hover: hover) { body { cursor: crosshair; } }

  /* 全局兜底：所有 flex/grid 子项允许收缩，避免长文本撑破布局 */
  .container *, .card-studio *, .card *, .modal-box * { min-width: 0; }

  /* ===== 星空画布 ===== */
  #starCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1; pointer-events: none;
  }

  /* ===== 银河 ===== */
  .milky-way {
    position: fixed; top: 20%; left: -20%;
    width: 140%; height: 200px;
    background: linear-gradient(90deg,
      transparent 0%, rgba(255,255,255,0.05) 20%,
      rgba(200,180,255,0.15) 50%, rgba(255,200,220,0.1) 80%, transparent 100%);
    transform: rotate(-15deg); filter: blur(20px);
    z-index: 2; pointer-events: none;
    animation: milkyFlow 20s ease-in-out infinite alternate;
  }
  @keyframes milkyFlow {
    0%   { opacity: 0.6; transform: rotate(-15deg) translateX(0); }
    100% { opacity: 1;   transform: rotate(-13deg) translateX(30px); }
  }

  /* ===== 圆月：位置和大小随屏幕伸缩 ===== */
  .moon {
    position: fixed;
    top: clamp(20px, 4vw, 60px);
    right: clamp(20px, 4vw, 80px);
    width:  clamp(60px, 10vw, 120px);
    height: clamp(60px, 10vw, 120px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe6, #ffe9a8 60%, #f5c76a 100%);
    box-shadow: 0 0 40px rgba(255,230,150,.7), 0 0 80px rgba(255,220,120,.4),
                inset -10px -15px 30px rgba(200,150,50,.3);
    z-index: 3;
    animation: moonGlow 4s ease-in-out infinite alternate;
  }
  /* 小屏降低月亮不透明度，减少对标题干扰 */
  @media (max-width: 640px) { .moon { opacity: 0.75; } }
  @keyframes moonGlow {
    0%   { box-shadow: 0 0 40px rgba(255,230,150,.7), 0 0 80px  rgba(255,220,120,.4); }
    100% { box-shadow: 0 0 60px rgba(255,230,150,.9), 0 0 120px rgba(255,220,120,.6); }
  }

  /* ===== 主容器：三档最大宽度 ===== */
  .container {
    position: relative; z-index: 10;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(30px, 5vw, 60px) clamp(16px, 3vw, 24px) 40px;
    text-align: center;
  }

  /* ===== 标题 ===== */
  .title-wrap { margin-top: clamp(20px, 5vw, 60px); }
  .title-main {
    font-size: clamp(60px, 14vw, 130px);
    font-weight: bold;
    background: linear-gradient(180deg, #fff5f5 0%, #ffb8c8 50%, #ff6b9d 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,150,200,.6));
    letter-spacing: 0.3em; line-height: 1;
    animation: titleFloat 4s ease-in-out infinite;
  }
  @keyframes titleFloat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }
  .title-sub {
    font-size: clamp(13px, 2.2vw, 18px);
    color: #ffd7e5;
    margin-top: clamp(10px, 2vw, 15px);
    letter-spacing: 0.7em; padding-left: 0.7em;
    opacity: 0.9;
  }
  .seal {
    display: inline-block;
    background: linear-gradient(135deg, #c0392b, #8b1a1a);
    color: #fff;
    padding: clamp(4px, 1vw, 6px) clamp(8px, 1.5vw, 10px);
    font-size: clamp(11px, 1.6vw, 14px);
    border-radius: 4px;
    margin: 0 clamp(6px, 1.5vw, 10px);
    box-shadow: 0 0 10px rgba(200,50,50,.5);
    letter-spacing: 0.3em; padding-left: 0.3em;
  }

  /* ===== 诗句 ===== */
  .poem-box {
    margin: clamp(30px, 5vw, 60px) auto;
    padding: clamp(18px, 3vw, 25px);
    max-width: min(600px, 100%);
    background: rgba(255,255,255,.05); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,200,220,.2); border-radius: 8px;
    position: relative;
  }
  .poem-box::before, .poem-box::after {
    content: "❋"; position: absolute; color: #ffb8c8;
    font-size: 20px; opacity: 0.6;
  }
  .poem-box::before { top: 8px; left: 12px; }
  .poem-box::after  { bottom: 8px; right: 12px; }
  .poem-text {
    font-size: clamp(16px, 2.6vw, 22px);
    line-height: 2; color: #fff5f5;
    min-height: 80px; transition: opacity 1s;
    text-shadow: 0 0 15px rgba(255,180,210,.5);
  }
  .poem-author {
    margin-top: 8px;
    font-size: clamp(11px, 1.6vw, 13px);
    color: #ffb8c8; letter-spacing: 3px;
  }

  /* ===== 分栏工作室 ===== */
  .card-studio {
    margin: clamp(30px, 5vw, 60px) auto;
    display: grid;
    /* 默认单列（手机 & 平板），电脑再切两列 */
    grid-template-columns: 1fr;
    gap: clamp(24px, 4vw, 40px);
    max-width: min(1000px, 100%);
    align-items: start;
    justify-items: center;
  }
  /* 电脑端：左编辑 + 右预览两列 */
  @media (min-width: 1024px) {
    .card-studio {
      grid-template-columns: 1fr 400px;
      justify-items: stretch;
    }
  }

  /* 编辑面板 */
  .editor {
    background: rgba(120, 30, 80, 0.25);
    border: 1px solid rgba(255,180,200,.3);
    border-radius: 16px;
    padding: clamp(20px, 3.5vw, 30px);
    backdrop-filter: blur(8px);
    text-align: left;
    width: 100%;
    max-width: 560px;
  }
  .editor-title {
    font-size: clamp(18px, 2.6vw, 22px);
    color: #ffe0e8;
    letter-spacing: 0.35em; padding-left: 0.35em;
    text-align: center; margin-bottom: 25px;
  }
  .editor-title::before, .editor-title::after {
    content: "❋"; margin: 0 12px; color: #ffb8c8; font-size: 16px;
  }
  .field { margin-bottom: clamp(16px, 2.5vw, 20px); }
  .field label {
    display: block;
    font-size: clamp(12px, 1.8vw, 14px);
    color: #ffd7e5; letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .field input, .field textarea {
    width: 100%;
    padding: clamp(9px, 1.5vw, 11px) clamp(12px, 2vw, 14px);
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,200,220,.4);
    border-radius: 10px;
    color: #fff;
    font-size: clamp(14px, 2vw, 15px);
    font-family: inherit; outline: none;
    transition: all 0.3s;
  }
  .field textarea { resize: vertical; min-height: 84px; line-height: 1.7; }
  .field input:focus, .field textarea:focus {
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 15px rgba(255,180,210,.4);
    border-color: #ffb8c8;
  }

  /* 主题色卡 */
  .theme-picker {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(6px, 1.5vw, 10px);
    max-width: 100%;
  }
  /* 小屏切 3 列，让每个色块更大更好点 */
  @media (max-width: 640px) { .theme-picker { grid-template-columns: repeat(3, 1fr); } }
  .theme-chip {
    aspect-ratio: 1 / 1;
    width: 100%;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.3s;
    position: relative;
  }
  .theme-chip:hover { transform: scale(1.08); }
  .theme-chip.active {
    border-color: #fff;
    box-shadow: 0 0 15px rgba(255,255,255,.6);
  }
  .theme-chip::after {
    content: attr(data-name);
    position: absolute; bottom: -22px; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(10px, 1.5vw, 11px);
    color: #ffd7e5; white-space: nowrap;
    opacity: 0.7; letter-spacing: 1px;
  }
  /* 给标签留出下方空间 */
  .theme-wrap { padding-bottom: 22px; }

  /* 文案模板 */
  .templates {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
  }
  .tmpl-chip {
    padding: clamp(5px, 1vw, 6px) clamp(10px, 2vw, 12px);
    font-size: clamp(11px, 1.6vw, 12px);
    background: rgba(255,255,255,.08); color: #ffd7e5;
    border: 1px solid rgba(255,200,220,.3);
    border-radius: 20px; cursor: pointer;
    transition: all 0.2s; letter-spacing: 1px;
    white-space: nowrap;
  }
  .tmpl-chip:hover {
    background: rgba(255,180,210,.25); color: #fff;
    border-color: #ffb8c8;
  }

  /* ===== 贺卡预览：宽度自适应，长宽比固定 9:16 ===== */
  .card-preview-wrap {
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
  }
  .card-preview-inner {
    width: 100%;
    max-width: 360px;
  }
  .card {
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: clamp(14px, 2.5vw, 20px);
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.5),
                0 0 40px rgba(255,150,200,.3);
    background: linear-gradient(160deg, #1a0a3e 0%, #4a1e5a 50%, #8b1e4a 100%);
    transition: transform 0.5s;
  }
  @media (hover: hover) {
    .card:hover { transform: rotateY(3deg) rotateX(-2deg); }
  }

  /* 卡片内部布局用百分比 & vw 让它自适应 */
  .card-inner {
    position: absolute; inset: 0;
    padding: 8% 7%;
    display: flex; flex-direction: column;
    justify-content: space-between;
    color: #fff;
  }
  .card-deco-top {
    position: absolute; top: 0; left: 0; right: 0; height: 40%;
    pointer-events: none; overflow: hidden;
  }
  .card-moon {
    position: absolute;
    top: 7%; right: 7%;
    width: 14%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe6, #ffe9a8 60%, #f5c76a 100%);
    box-shadow: 0 0 20px rgba(255,230,150,.7);
  }
  .card-stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20px 30px,  #fff, transparent),
      radial-gradient(1px 1px at 60px 80px,  #fff, transparent),
      radial-gradient(1.5px 1.5px at 120px 50px, #ffd7e5, transparent),
      radial-gradient(1px 1px at 180px 100px, #fff, transparent),
      radial-gradient(1px 1px at 240px 40px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 280px 90px, #ffd7e5, transparent),
      radial-gradient(1px 1px at 40px 130px, #fff, transparent),
      radial-gradient(1px 1px at 200px 160px, #fff, transparent);
    background-size: 320px 200px;
  }
  .card-header { text-align: center; position: relative; z-index: 2; }
  .card-to {
    font-size: clamp(11px, 3.5cqw, 14px);
    color: #ffd7e5; letter-spacing: 3px;
    margin-bottom: 6px; opacity: 0.85;
  }
  .card-to-name {
    font-size: clamp(16px, 6cqw, 22px);
    color: #fff; letter-spacing: 0.25em; padding-left: 0.25em;
    text-shadow: 0 0 10px rgba(255,180,210,.6);
    margin-bottom: 10px;
    word-break: break-all;
  }
  .card-title {
    font-size: clamp(30px, 12cqw, 44px);
    font-weight: bold;
    background: linear-gradient(180deg, #fff5f5, #ffb8c8, #ff6b9d);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.3em; padding-left: 0.3em;
    filter: drop-shadow(0 0 12px rgba(255,150,200,.6));
    line-height: 1.1;
  }
  .card-title-sub {
    font-size: clamp(10px, 3cqw, 12px);
    color: #ffd7e5; letter-spacing: 8px;
    padding-left: 0.5em; margin-top: 5px; opacity: 0.8;
  }
  .card-body {
    text-align: center; padding: 5% 3%;
    position: relative; z-index: 2;
  }
  .card-msg {
    font-size: clamp(13px, 5cqw, 18px);
    line-height: 1.9; color: #fff5f5;
    text-shadow: 0 0 10px rgba(255,180,210,.4);
    min-height: 60px;
    word-break: break-word; white-space: pre-wrap;
  }
  .card-flower {
    color: #ffb8c8;
    font-size: clamp(11px, 3.5cqw, 14px);
    margin-top: 12px;
  }
  .card-footer {
    text-align: right; position: relative; z-index: 2;
    padding-top: 10px;
  }
  .card-from {
    font-size: clamp(11px, 3.5cqw, 13px);
    color: #ffd7e5; letter-spacing: 3px; opacity: 0.85;
  }
  .card-from-name {
    font-size: clamp(16px, 5.5cqw, 20px);
    color: #fff; letter-spacing: 0.2em; padding-left: 0.2em;
    margin-top: 6px;
    text-shadow: 0 0 8px rgba(255,180,210,.5);
    word-break: break-all;
  }
  .card-bridge {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 20%; pointer-events: none;
    background: linear-gradient(0deg, rgba(0,0,0,.3), transparent);
  }
  .card-bridge svg { width: 100%; height: 100%; }

  /* card 内启用容器查询单位 cqw，让卡片内文字随卡片宽度而非视口缩放 */
  #cardPreview { container-type: inline-size; }

  /* 主题变体 */
  .theme-classic .card { background: linear-gradient(160deg, #1a0a3e 0%, #4a1e5a 50%, #8b1e4a 100%); }
  .theme-sunset  .card { background: linear-gradient(160deg, #2d0845 0%, #8b1e5a 50%, #d4526e 100%); }
  .theme-ink     .card { background: linear-gradient(160deg, #0e1a2e 0%, #1e2f4d 50%, #2c4870 100%); }
  .theme-ink     .card-title { background: linear-gradient(180deg, #fff5f5, #c8d8ff, #6b9dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .theme-ink     .card-moon  { background: radial-gradient(circle at 35% 35%, #fffbe6, #e8f0ff 60%, #b8ccf5 100%); }
  .theme-peach   .card { background: linear-gradient(160deg, #4a1a3a 0%, #a83d6b 50%, #f2b6c6 100%); }
  .theme-gold    .card { background: linear-gradient(160deg, #1a0f00 0%, #4a2f0a 50%, #b8862e 100%); }
  .theme-gold    .card-title { background: linear-gradient(180deg, #fff8e1, #ffd980, #d4a428); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  /* ===== 操作按钮 ===== */
  .actions {
    margin-top: clamp(18px, 3vw, 25px);
    display: flex; gap: clamp(8px, 1.5vw, 12px);
    flex-wrap: wrap; justify-content: center;
  }
  .btn {
    padding: clamp(10px, 2vw, 12px) clamp(18px, 3vw, 24px);
    border: none; border-radius: 30px;
    font-size: clamp(13px, 1.8vw, 14px);
    font-family: inherit; cursor: pointer;
    letter-spacing: 0.25em; padding-left: 0.25em;
    transition: all 0.3s;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff6b9d, #c0392b);
    color: #fff;
    box-shadow: 0 4px 20px rgba(255,100,150,.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(255,100,150,.6);
  }
  .btn-ghost {
    background: rgba(255,255,255,.1); color: #fff;
    border: 1px solid rgba(255,200,220,.4);
  }
  .btn-ghost:hover {
    background: rgba(255,180,210,.2); border-color: #ffb8c8;
  }

  /* ===== 花瓣 ===== */
  .petal {
    position: fixed; top: -30px; font-size: 20px;
    z-index: 5; pointer-events: none;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall {
    0%   { transform: translateY(0)     rotate(0deg)   translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) translateX(100px); opacity: 0.3; }
  }

  /* ===== 底部 ===== */
  .footer {
    text-align: center; padding: 30px 20px;
    color: #ffb8c8;
    font-size: clamp(12px, 1.8vw, 13px);
    letter-spacing: 3px; opacity: 0.7;
    position: relative; z-index: 10;
  }

  /* ===== Toast ===== */
  /* 顶部环境提示条（微信/QQ 内嵌浏览器时显示） */
  .env-banner {
    display: none;
    position: sticky;
    top: 0;
    z-index: 200;
    padding: 10px 40px 10px 16px;
    background: linear-gradient(90deg, rgba(7,193,96,.85), rgba(18,183,245,.85));
    color: #fff;
    font-size: clamp(12px, 1.8vw, 13px);
    letter-spacing: 1px;
    text-align: center;
    backdrop-filter: blur(6px);
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  .env-banner.show { display: block; }
  .env-banner-close {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,.2); border: none;
    color: #fff; width: 22px; height: 22px;
    border-radius: 50%; cursor: pointer;
    font-size: 14px; line-height: 1;
  }

  .toast {
    position: fixed; top: 30px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(255,100,150,.9); color: #fff;
    padding: 12px 26px; border-radius: 30px;
    font-size: clamp(13px, 1.8vw, 15px);
    z-index: 1000; letter-spacing: 2px;
    box-shadow: 0 4px 20px rgba(255,100,150,.5);
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== 分享弹窗 ===== */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 500; display: none;
    align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal-box {
    background: linear-gradient(160deg, #2d1b5e, #4a1e5a);
    border: 1px solid rgba(255,200,220,.4);
    border-radius: 20px;
    padding: clamp(20px, 4vw, 30px);
    max-width: 420px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255,100,150,.3);
    max-height: 90vh; overflow-y: auto;
  }
  .modal-title {
    font-size: clamp(18px, 2.6vw, 22px);
    color: #ffe0e8;
    letter-spacing: 0.35em; padding-left: 0.35em; margin-bottom: 8px;
  }
  .modal-sub {
    font-size: clamp(11px, 1.8vw, 13px);
    color: #ffb8c8; letter-spacing: 2px;
    margin-bottom: 18px; opacity: 0.8;
  }
  .modal-img-wrap {
    background: rgba(0,0,0,.3); border-radius: 12px;
    padding: 10px; margin-bottom: 18px;
  }
  .modal-img-wrap img {

<script>
/* ============================================================
   1. 星空画布：多层视差 + 流星 + 点击点亮
   ============================================================ */
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 星星密度随屏幕面积调整，小屏也不显得空
const starCount = Math.min(200, Math.max(80, Math.floor(W*H/8000)));
const stars = [];
for (let i = 0; i < starCount; i++) {
  stars.push({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.5 + 0.3,
    tw: Math.random()*Math.PI*2,
    speed: 0.02 + Math.random()*0.03,
    color: Math.random() > 0.85 ? '#ffd7e5' : '#ffffff'
  });
}
const meteors = [];
setInterval(() => { if (Math.random() > 0.4) meteors.push({
  x: Math.random()*W, y: -20, len: 80+Math.random()*60,
  speed: 8+Math.random()*6, angle: Math.PI/4+(Math.random()-.5)*.3, alpha: 1
});}, 4000);

const clickStars = [];
window.addEventListener('click', (e) => {
  // 排除交互元素
  if (e.target.closest('.editor, .card, .btn, .modal-box, .toast, input, button, textarea, .theme-chip, .tmpl-chip')) return;
  clickStars.push({ x: e.clientX, y: e.clientY, r: 0, maxR: 15+Math.random()*10, alpha: 1 });
});

function draw() {
  ctx.fillStyle = 'rgba(10, 10, 46, 0.15)';
  ctx.fillRect(0, 0, W, H);
  stars.forEach(s => {
    s.tw += s.speed;
    const a = 0.5 + Math.sin(s.tw)*.4;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = s.color; ctx.globalAlpha = a;
    ctx.shadowBlur = 8; ctx.shadowColor = s.color; ctx.fill();
  });
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  for (let i = meteors.length-1; i >= 0; i--) {
    const m = meteors[i];
    const dx = Math.cos(m.angle)*m.len, dy = Math.sin(m.angle)*m.len;
    const g = ctx.createLinearGradient(m.x, m.y, m.x-dx, m.y-dy);
    g.addColorStop(0, `rgba(255,220,240,${m.alpha})`);
    g.addColorStop(1, 'rgba(255,220,240,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x-dx, m.y-dy); ctx.stroke();
    m.x += Math.cos(m.angle)*m.speed; m.y += Math.sin(m.angle)*m.speed;
    if (m.y > H+100 || m.x > W+100) meteors.splice(i, 1);
  }
  for (let i = clickStars.length-1; i >= 0; i--) {
    const c = clickStars[i];
    ctx.beginPath(); ctx.arc(c.x, c.y, 2, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,240,200,${c.alpha})`;
    ctx.shadowBlur = 20; ctx.shadowColor = '#ffe9a8'; ctx.fill();
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,200,220,${c.alpha*.6})`; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = `rgba(255,240,200,${c.alpha})`; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(c.x-c.r, c.y); ctx.lineTo(c.x+c.r, c.y);
    ctx.moveTo(c.x, c.y-c.r); ctx.lineTo(c.x, c.y+c.r);
    ctx.stroke(); ctx.shadowBlur = 0;
    c.r += 0.8; c.alpha -= 0.015;
    if (c.alpha <= 0) clickStars.splice(i, 1);
  }
  requestAnimationFrame(draw);
}
draw();

/* ============================================================
   2. 花瓣飘落：小屏减少数量避免性能问题
   ============================================================ */
const petalChars = ['🌸','🌺','❀','✿','🌷'];
const petalInterval = window.innerWidth < 640 ? 1400 : 900;
function spawnPetal() {
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = petalChars[Math.floor(Math.random()*petalChars.length)];
  p.style.left = Math.random()*100 + 'vw';
  p.style.animationDuration = (8+Math.random()*6) + 's';
  p.style.fontSize = (16+Math.random()*16) + 'px';
  p.style.opacity = 0.5 + Math.random()*0.5;
  const hue = 320 + Math.random()*40;
  p.style.filter = `drop-shadow(0 0 4px hsl(${hue}, 80%, 70%))`;
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 15000);
}
setInterval(spawnPetal, petalInterval);
for (let i = 0; i < 6; i++) setTimeout(spawnPetal, i*200);

/* ============================================================
   3. 诗句轮播
   ============================================================ */
const poems = [
  { t: "两情若是久长时，又岂在朝朝暮暮。", a: "—— 秦观《鹊桥仙》" },
  { t: "金风玉露一相逢，便胜却人间无数。", a: "—— 秦观《鹊桥仙》" },
  { t: "天阶夜色凉如水，卧看牵牛织女星。", a: "—— 杜牧《秋夕》" },
  { t: "迢迢牵牛星，皎皎河汉女。",         a: "—— 《古诗十九首》" },
  { t: "家家乞巧望秋月，穿尽红丝几万条。", a: "—— 林杰《乞巧》" },
];
let poemIdx = 0;
const poemText = document.getElementById('poemText');
const poemAuthor = document.getElementById('poemAuthor');
setInterval(() => {
  poemText.style.opacity = 0; poemAuthor.style.opacity = 0;
  setTimeout(() => {
    poemIdx = (poemIdx+1) % poems.length;
    poemText.textContent = poems[poemIdx].t;
    poemAuthor.textContent = poems[poemIdx].a;
    poemText.style.opacity = 1; poemAuthor.style.opacity = 1;
  }, 1000);
}, 5000);

/* ============================================================
   4. 贺卡编辑器
   ============================================================ */
const $ = id => document.getElementById(id);
const cardHost = $('cardHost');

function bind(inputId, previewId) {
  const inp = $(inputId), pv = $(previewId);
  inp.addEventListener('input', () => {
    pv.textContent = inp.value || pv.dataset.placeholder || '';
  });
}
bind('inputTo',   'pvTo');
bind('inputMsg',  'pvMsg');
bind('inputFrom', 'pvFrom');

document.querySelectorAll('.theme-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.theme-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    cardHost.className = 'theme-' + chip.dataset.theme;
  });
});

document.querySelectorAll('.tmpl-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const t = chip.dataset.tmpl;
    $('inputMsg').value = t;
    $('pvMsg').textContent = t;
    showToast('✍ 已填入，可继续编辑');
  });
});

function randomize() {
  const chips = document.querySelectorAll('.theme-chip');
  const tmpls = document.querySelectorAll('.tmpl-chip');
  chips[Math.floor(Math.random()*chips.length)].click();
  tmpls[Math.floor(Math.random()*tmpls.length)].click();
  showToast('🎲 换一种心情');
}

/* ============================================================
   5. 生成分享卡片 + 多平台分享
   ============================================================ */
let currentImgDataUrl = null;
let currentImgBlob = null;

// ---- 环境检测：判断当前浏览器是不是微信/QQ/微博内嵌浏览器 ----
const UA = navigator.userAgent.toLowerCase();
const ENV = {
  isWeixin: /micromessenger/.test(UA),
  isQQ:     /qq\//.test(UA) || /mqqbrowser/.test(UA) || / qq/.test(UA),
  isWeibo:  /weibo/.test(UA),
  isMobile: /android|iphone|ipad|ipod|mobile/.test(UA),
};
ENV.isInApp = ENV.isWeixin || ENV.isQQ || ENV.isWeibo;

// 进入页面时：如果是微信/QQ/微博内嵌浏览器，显示顶部提示条
(function initEnvBanner(){
  if (!ENV.isInApp) return;
  const banner = $('envBanner');
  const txt = $('envBannerText');
  if (ENV.isWeixin) txt.innerHTML = '💡 微信内保存图片可长按 · 建议点击右上角在浏览器打开';
  else if (ENV.isQQ) txt.innerHTML = '💡 QQ 内保存图片可长按 · 建议点击右上角在浏览器打开';
  else txt.innerHTML = '💡 建议点击右上角在外部浏览器打开，体验更流畅';
  banner.classList.add('show');
})();

$('btnGenerate').addEventListener('click', async () => {
  const btn = $('btnGenerate');
  const oldHtml = btn.innerHTML;
  btn.innerHTML = '<span class="loader"></span><span>生成中⋯</span>';
  btn.disabled = true;
  try {
    // 直接用原生 Canvas 绘制贺卡，不依赖 html2canvas
    // 优点：无跨域污染问题、100% 可导出、下载稳定
    const canvasImg = drawCardToCanvas();
    currentImgDataUrl = canvasImg.toDataURL('image/png');
    currentImgBlob = await new Promise(res => canvasImg.toBlob(res, 'image/png'));
    $('shareImg').src = currentImgDataUrl;
    $('shareModal').classList.add('show');
    updateGuideForEnv();
  } catch (err) {
    console.error(err);
    showToast('⚠ 生成失败：' + (err.message || '未知错误'));
  } finally {
    btn.innerHTML = oldHtml;
    btn.disabled = false;
  }
});

// ============================================================
// 用原生 Canvas 绘制贺卡（替代 html2canvas）
// 好处：不受跨域字体污染影响，任何浏览器都能稳定 toBlob/toDataURL
// ============================================================
function drawCardToCanvas() {
  // 高分辨率输出，DPR = 2
  const W = 720, H = 1280;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // 读取当前用户输入的四要素
  const toName   = ($('inputTo').value   || '致 · 你').trim();
  const msg      = ($('inputMsg').value  || '今夕何夕，见此良人。').trim();
  const fromName = ($('inputFrom').value || '爱你的我').trim();
  const themeKey = cardHost.className.replace('theme-','') || 'classic';

  // 各主题的配色方案：背景渐变三色 + 标题文字渐变三色 + 月色
  const themes = {
    classic: { bg:['#1a0a3e','#4a1e5a','#8b1e4a'], title:['#fff5f5','#ffb8c8','#ff6b9d'], moon:['#fffbe6','#ffe9a8','#f5c76a'] },
    sunset:  { bg:['#2d0845','#8b1e5a','#d4526e'], title:['#fff5f5','#ffb8c8','#ff6b9d'], moon:['#fffbe6','#ffe9a8','#f5c76a'] },
    ink:     { bg:['#0e1a2e','#1e2f4d','#2c4870'], title:['#fff5f5','#c8d8ff','#6b9dff'], moon:['#fffbe6','#e8f0ff','#b8ccf5'] },
    peach:   { bg:['#4a1a3a','#a83d6b','#f2b6c6'], title:['#fff5f5','#ffb8c8','#ff6b9d'], moon:['#fffbe6','#ffe9a8','#f5c76a'] },
    gold:    { bg:['#1a0f00','#4a2f0a','#b8862e'], title:['#fff8e1','#ffd980','#d4a428'], moon:['#fffbe6','#ffe9a8','#f5c76a'] },
  };
  const T = themes[themeKey] || themes.classic;

  // 1) 背景渐变
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0,   T.bg[0]);
  bgGrad.addColorStop(0.5, T.bg[1]);
  bgGrad.addColorStop(1,   T.bg[2]);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 2) 星星（随机撒 60 颗）
  ctx.save();
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H * 0.5;
    const r = Math.random() * 2 + 0.5;
    ctx.fillStyle = Math.random() > 0.8 ? '#ffd7e5' : '#ffffff';
    ctx.globalAlpha = 0.4 + Math.random() * 0.6;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 3) 圆月（右上角）
  const moonX = W - 90, moonY = 90, moonR = 42;
  // 光晕
  const glow = ctx.createRadialGradient(moonX, moonY, moonR*0.5, moonX, moonY, moonR*2.5);
  glow.addColorStop(0, 'rgba(255,230,150,0.6)');
  glow.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR*2.5, 0, Math.PI*2);
  ctx.fill();
  // 月球本体
  const moonGrad = ctx.createRadialGradient(moonX - moonR*0.3, moonY - moonR*0.3, moonR*0.2, moonX, moonY, moonR);
  moonGrad.addColorStop(0, T.moon[0]);
  moonGrad.addColorStop(0.6, T.moon[1]);
  moonGrad.addColorStop(1, T.moon[2]);
  ctx.fillStyle = moonGrad;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, Math.PI*2);
  ctx.fill();

  // 4) 顶部 TO / 收件人
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd7e5';
  ctx.font = '500 22px "STKaiti","KaiTi","楷体","PingFang SC",serif';
  ctx.fillText('T  O', W/2, 160);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 44px "STKaiti","KaiTi","楷体","PingFang SC",serif';
  // 收件人可能较长，截断防溢出
  const toDisplay = toName.length > 8 ? toName.slice(0,8) + '…' : toName;
  ctx.fillText(toDisplay, W/2, 220);

  // 5) 大标题「七夕」—— 用渐变填充文字
  ctx.font = 'bold 140px "STKaiti","KaiTi","楷体","PingFang SC",serif';
  const titleGrad = ctx.createLinearGradient(0, 300, 0, 460);
  titleGrad.addColorStop(0, T.title[0]);
  titleGrad.addColorStop(0.5, T.title[1]);
  titleGrad.addColorStop(1, T.title[2]);
  ctx.fillStyle = titleGrad;
  // 阴影发光
  ctx.shadowColor = 'rgba(255,150,200,0.6)';
  ctx.shadowBlur = 30;
  ctx.fillText('七  夕', W/2, 430);
  ctx.shadowBlur = 0;

  // 副标题 QI XI
  ctx.fillStyle = '#ffd7e5';
  ctx.font = '20px sans-serif';
  ctx.fillText('Q  I    X  I', W/2, 480);

  // 6) 中部祝福语（自动换行）
  ctx.fillStyle = '#fff5f5';
  ctx.font = '34px "STKaiti","KaiTi","楷体","PingFang SC",serif';
  ctx.shadowColor = 'rgba(255,180,210,0.3)';
  ctx.shadowBlur = 8;
  const lines = wrapText(ctx, msg, W - 160, 34);
  const lineHeight = 60;
  const totalMsgHeight = lines.length * lineHeight;
  const msgStartY = H/2 + 80 - totalMsgHeight/2;
  lines.forEach((line, i) => {
    ctx.fillText(line, W/2, msgStartY + i*lineHeight);
  });
  ctx.shadowBlur = 0;

  // 中部装饰花
  ctx.fillStyle = '#ffb8c8';
  ctx.font = '28px sans-serif';
  ctx.fillText('❋   ❋   ❋', W/2, msgStartY + lines.length*lineHeight + 40);

  // 7) 底部鹊桥剪影 SVG 曲线
  ctx.strokeStyle = 'rgba(255,200,220,0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(60, H - 180);
  ctx.quadraticCurveTo(W/2, H - 280, W - 60, H - 180);
  ctx.stroke();
  // 三只小鸟符号
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = '30px sans-serif';
  ctx.fillText('•', W/2 - 140, H - 225);
  ctx.fillText('•', W/2,       H - 245);
  ctx.fillText('•', W/2 + 140, H - 225);

  // 8) 底部落款 FROM / 签名（右下角）
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd7e5';
  ctx.font = '22px "STKaiti","KaiTi","楷体","PingFang SC",serif';
  ctx.fillText('F  R  O  M', W - 60, H - 120);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px "STKaiti","KaiTi","楷体","PingFang SC",serif';
  ctx.shadowColor = 'rgba(255,180,210,0.5)';
  ctx.shadowBlur = 10;
  const fromDisplay = fromName.length > 8 ? fromName.slice(0,8) + '…' : fromName;
  ctx.fillText(fromDisplay, W - 60, H - 70);
  ctx.shadowBlur = 0;

  return cv;
}

// 中文自动换行工具
function wrapText(ctx, text, maxWidth, fontSize) {
  // 先按用户手动换行符 \n 分段
  const paragraphs = text.split(/\r?\n/);
  const lines = [];
  paragraphs.forEach(para => {
    if (!para) { lines.push(''); return; }
    let cur = '';
    for (let i = 0; i < para.length; i++) {
      const test = cur + para[i];
      if (ctx.measureText(test).width > maxWidth && cur) {
        lines.push(cur);
        cur = para[i];
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
  });
  return lines;
}

// ---- 平台分享路由 ----
// 微信/QQ 都不允许静态网页直接调起分享 API 传图片（需要公众号/JS-SDK 签名后端）。
// 这里的策略：给用户明确的可执行指引，配合系统能力尽力而为。
function shareTo(platform) {
  const pageUrl = location.href;
  const shareText = '为你写了一张七夕贺卡 💝';

  switch(platform) {
    case 'wechat':
      // 微信内：提示点右上角；非微信：显示"请截图/保存后手动发送到微信"
      if (ENV.isWeixin) {
        $('wxGuide').classList.add('show');
        showToast('👆 点右上角「···」发送给朋友');
        // 平滑滚动到引导条
        $('wxGuide').scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else if (ENV.isMobile) {
        showToast('💡 请先下载/长按保存图片，再打开微信发送给 ta');
      } else {
        // 电脑端：尝试唤起 PC 微信；同时下载图片
        showToast('💾 已下载图片，请打开微信粘贴/发送');
        downloadImg();
      }
      break;

    case 'moments':
      if (ENV.isWeixin) {
        $('wxGuide').classList.add('show');
        $('wxGuideText').innerHTML = '点右上角「···」<br>选择「分享到朋友圈」';
        showToast('👆 点右上角「···」→ 分享到朋友圈');
        $('wxGuide').scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        showToast('💡 朋友圈需在微信中操作，请先保存图片');
      }
      break;

    case 'qq':
      // QQ 分享：使用官方分享 URL（在 PC 上会打开分享面板；移动端需要 QQ 已安装）
      if (ENV.isQQ) {
        showToast('👆 点右上角「⋮」→ 分享到 QQ');
      } else if (ENV.isMobile) {
        // 尝试 mqqapi scheme（图文分享）
        // 由于纯前端无法上传图片到 QQ 服务器，这里只分享链接
        const qqUrl = `mqqapi://share/to_fri?src_type=web&version=1&file_type=news&`
                    + `title=${encodeURIComponent('七夕快乐')}&`
                    + `description=${encodeURIComponent(shareText)}&`
                    + `url=${encodeURIComponent(pageUrl)}`;
        window.location.href = qqUrl;
        setTimeout(() => showToast('💡 若未打开 QQ，请先保存图片手动发送'), 1500);
      } else {
        // PC 端：调用 QQ 分享网页
        const shareUrl = `https://connect.qq.com/widget/shareqq/index.html?`
                       + `url=${encodeURIComponent(pageUrl)}&`
                       + `title=${encodeURIComponent('七夕快乐 · ' + shareText)}&`
                       + `desc=${encodeURIComponent(shareText)}`;
        window.open(shareUrl, '_blank', 'width=600,height=500');
      }
      break;

    case 'qzone':
      // QQ空间分享
      const qzoneUrl = `https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?`
                     + `url=${encodeURIComponent(pageUrl)}&`
                     + `title=${encodeURIComponent('七夕快乐')}&`
                     + `summary=${encodeURIComponent(shareText)}`;
      window.open(qzoneUrl, '_blank', 'width=600,height=500');
      break;

    case 'weibo':
      // 微博分享网页版
      const weiboUrl = `https://service.weibo.com/share/share.php?`
                     + `url=${encodeURIComponent(pageUrl)}&`
                     + `title=${encodeURIComponent(shareText + ' ' + pageUrl)}`;
      window.open(weiboUrl, '_blank', 'width=600,height=500');
      break;

    case 'copy':
      // 复制页面链接
      copyText(pageUrl).then(() => {
        showToast('🔗 链接已复制，粘贴给 ta 即可');
      });
      break;
  }
}

// 复制文本兼容函数
async function copyText(txt) {
  try {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(txt);
    } else {
      // 兼容旧浏览器/微信内嵌
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  } catch (e) { showToast('⚠ 复制失败，请手动复制'); }
}

function downloadImg() {
  if (!currentImgBlob && !currentImgDataUrl) {
    // 还没生成图片，提醒用户
    showToast('⚠ 请先点「生成分享卡片」');
    return;
  }
  const to = ($('inputTo').value || '').trim() || '贺卡';
  const fileName = `七夕贺卡_${to}_${Date.now()}.png`;

  // 特性探测：<a download> 属性是否有效
  // 说明：iOS Safari / 微信 / QQ / 部分国产浏览器都不支持真正的 download 触发
  const a = document.createElement('a');
  const supportsDownload = typeof a.download !== 'undefined';
  const isIOS = /iphone|ipad|ipod/.test(UA);
  const cannotRealDownload = ENV.isInApp || isIOS || !supportsDownload;

  // ---- 场景 A：微信/QQ/iOS/不支持 download 的浏览器 ----
  // 这些环境下 <a download> 无效或被劫持，只能引导长按/右键保存
  if (cannotRealDownload) {
    // 让分享弹窗打开且滚动到图片位置
    if (!$('shareModal').classList.contains('show')) {
      $('shareModal').classList.add('show');
    }
    setTimeout(() => {
      $('shareImg').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
    if (ENV.isInApp || isIOS) {
      showToast('👇 请长按下方图片 → 保存到相册');
    } else {
      showToast('👇 请右键图片 → 图片另存为');
    }
    return;
  }

  // ---- 场景 B：桌面 Chrome/Firefox/Edge 等，正常触发下载 ----
  // 优先使用 Blob URL（比 dataURL 更兼容，避免超长 URL 被拦截）
  try {
    let url;
    if (currentImgBlob) {
      url = URL.createObjectURL(currentImgBlob);
    } else {
      url = currentImgDataUrl;
    }
    a.href = url;
    a.download = fileName;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    // 释放 Blob URL，等浏览器处理完再释放
    setTimeout(() => {
      a.remove();
      if (currentImgBlob) URL.revokeObjectURL(url);
    }, 1000);
    showToast('💾 已保存到"下载"文件夹');
  } catch (err) {
    console.error(err);
    // ---- 场景 C：兜底 —— 新窗口打开图片，让用户手动保存 ----
    try {
      const w = window.open('');
      if (w && currentImgDataUrl) {
        w.document.write(
          '<title>' + fileName + '</title>' +
          '<body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;">' +
          '<img src="' + currentImgDataUrl + '" style="max-width:100%;max-height:100vh;" alt="' + fileName + '">' +
          '<p style="position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;font-family:sans-serif;">' +
          '右键图片另存为 / 长按图片保存</p></body>'
        );
        showToast('👉 已在新窗口打开，请右键保存');
      } else {
        showToast('⚠ 保存失败，请截图代替');
      }
    } catch (e2) {
      showToast('⚠ 保存失败，请截图代替');
    }
  }
}

async function copyImg() {
  if (!currentImgBlob) { showToast('⚠ 请先点「生成分享卡片」'); return; }
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([ new ClipboardItem({ 'image/png': currentImgBlob }) ]);
      showToast('📋 已复制，可粘贴给 ta');
    } else {
      showToast('⚠ 当前浏览器不支持复制图片，请下载');
    }
  } catch (err) { showToast('⚠ 复制失败，请下载'); }
}

async function shareNative() {
  if (!currentImgBlob) { showToast('⚠ 请先点「生成分享卡片」'); return; }
  // 微信/QQ 内嵌浏览器：跳过原生分享，改为提示
  if (ENV.isInApp) {
    updateGuideForEnv();
    showToast('👆 请通过右上角菜单分享');
    return;
  }
  try {
    if (navigator.share && navigator.canShare) {
      const file = new File([currentImgBlob], '七夕贺卡.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: '七夕快乐', text: '送你一张七夕贺卡 💝' });
        return;
      }
    }
    showToast('⚠ 请使用下载或复制');
  } catch (err) {
    if (err.name !== 'AbortError') showToast('⚠ 分享失败');
  }
}

/* ============================================================
   6. Toast
   ============================================================ */
let toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
