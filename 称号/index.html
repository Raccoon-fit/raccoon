<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>森林称号小屋 · 自然森系版</title><style>
/* 自然森系主题：柔和土绿、植物剪影、手绘贴纸和温暖木质卡片。 */
:root{--cream:#f5f0df;--green:#425e43;--sage:#91a47c;--brown:#76583c;--orange:#d98b54}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;overflow-x:hidden;color:#344233;font-family:"Microsoft YaHei",sans-serif;background:linear-gradient(#b8cba7 0 36%,#8fa67c 36% 100%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 10%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 80% 22%,#fff8 0 2px,transparent 3px);background-size:90px 90px,130px 130px}.landscape{position:fixed;left:0;right:0;bottom:0;height:42%;opacity:.28;background:linear-gradient(145deg,transparent 0 42%,#315238 42% 55%,transparent 55%),linear-gradient(35deg,transparent 0 42%,#47684a 42% 60%,transparent 60%)}.card{position:relative;width:min(100%,680px);padding:46px 52px 38px;border:2px solid #6c805e;border-radius:36px 14px 36px 14px;background:var(--cream);box-shadow:0 22px 0 #6d7f5f55,0 30px 60px #36503855;overflow:hidden}.card:before,.card:after{position:absolute;font-size:110px;line-height:1;opacity:.13}.card:before{content:"❧";left:-15px;top:-15px;color:var(--green);transform:rotate(20deg)}.card:after{content:"♧";right:-18px;bottom:-20px;color:var(--brown);transform:rotate(-15deg)}.tape{position:absolute;top:18px;left:50%;width:110px;height:28px;background:#d9cb9bbd;transform:translateX(-50%) rotate(-2deg);box-shadow:0 2px 4px #6f634638}.mascot{position:relative;z-index:1;width:82px;height:82px;margin:8px auto 12px;display:grid;place-items:center;border-radius:47% 53% 45% 55%;font-size:42px;background:#dce4c7;border:2px dashed var(--green);transform:rotate(2deg)}h1{position:relative;z-index:1;margin:0;text-align:center;color:var(--green);font-size:clamp(32px,7vw,53px);letter-spacing:3px}.sub{margin:9px 0 27px;text-align:center;color:#75816a;font-size:13px;letter-spacing:2px}.leaf-line{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--sage)}.leaf-line:before,.leaf-line:after{content:"";height:1px;flex:1;background:#9eaa8e}.panel{position:relative;z-index:1;padding:24px;border:1px solid #b8b99f;border-radius:18px;background:#faf7eccc;box-shadow:inset 0 0 24px #c9c6a84a}label{display:block;margin-bottom:8px;color:var(--green);font-size:13px;font-weight:800}.form{display:grid;grid-template-columns:1fr auto;gap:10px}input{min-width:0;width:100%;padding:14px 16px;border:1px solid #94a184;border-radius:12px;outline:none;color:var(--green);background:#fffdf3;font-size:16px;box-shadow:inset 0 2px 5px #67765a20}input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #d98b5430}button{padding:0 22px;border:0;border-radius:12px;color:#fff8e8;background:var(--green);font-weight:800;cursor:pointer;box-shadow:0 5px 0 #2d4630;transition:.15s}button:hover{background:#507252;transform:translateY(-2px)}button:active{transform:translateY(4px);box-shadow:0 1px 0 #2d4630}.result{margin-top:18px;padding:18px;border-radius:14px;background:#e3ead3;border:1px dashed #6d825f;text-align:center}.result:before{content:"☘  FOREST RECORD  ☘";display:block;margin-bottom:8px;color:#829175;font-size:10px;letter-spacing:2px}.badge{color:var(--brown);font-size:clamp(22px,5vw,30px);font-weight:900}.msg{margin:7px 0 0;color:#718068;font-size:12px}.reveal{animation:grow .38s ease}.stickers{position:relative;z-index:1;display:flex;justify-content:space-between;margin-top:20px;color:var(--brown);font-size:22px}.home{display:block;width:max-content;margin:5px auto 0;padding:10px 15px;border:1px solid #8b927b;border-radius:999px;color:var(--green);background:#ece8d4;text-decoration:none;font-size:12px;font-weight:800}.foot{position:relative;z-index:1;margin:17px 0 0;text-align:center;color:#89917e;font-size:10px;letter-spacing:2px}@keyframes grow{from{opacity:0;transform:scale(.96) translateY(8px)}}@media(max-width:560px){.card{padding:40px 20px 28px}.form{grid-template-columns:1fr}button{height:48px}.panel{padding:18px}}
</style></head><body><div class="landscape"></div><main class="card"><span class="tape"></span><div class="mascot">🦝</div><h1>森林称号小屋</h1><p class="sub">在林间名册里，寻找属于你的叶片</p><div class="leaf-line">❧</div><section class="panel"><label for="qqInput">你的QQ号码</label><div class="form"><input id="qqInput" inputmode="numeric" maxlength="20" placeholder="轻轻写下纯数字号码" autocomplete="off"><button id="searchBtn">去寻找</button></div><div id="resultArea" class="result" hidden aria-live="polite"><div id="badgeDisplay" class="badge"></div><p id="extraMsg" class="msg"></p></div></section><div class="stickers" aria-hidden="true"><span>🍄</span><a class="home" href="http://raccoon.fit">⌂ 回到软软的小窝</a><span>🌿</span></div><p class="foot">RACCOON.FIT · 森林身份名册</p></main><script>
/* 查询内核：将 QQ 号码编码成十六进制键，保留原页面的数据匹配方式。 */
(() => {
  const titles = {
    "32303531373735353035": "【网站创建者】",
    "32303739303737383039": "【云端筑盒师】",
    "31353537303335333238": "【星链架构师】"
  };
  const encode = value => [...value].map(char => ("0" + char.charCodeAt(0).toString(16)).slice(-2)).join("");
  const input = document.querySelector('#qqInput');
  const result = document.querySelector('#resultArea');
  const badge = document.querySelector('#badgeDisplay');
  const message = document.querySelector('#extraMsg');
  function show(title, detail, state) {
    badge.textContent = title;
    message.textContent = detail;
    result.dataset.state = state;
    result.hidden = false;
    result.classList.remove('reveal');
    void result.offsetWidth;
    result.classList.add('reveal');
  }
  function search() {
    const value = input.value.trim();
    if (!value) { show('请输入QQ号', '请先留下身份号码', 'warn'); input.focus(); return; }
    if (!/^\d+$/.test(value)) { show('格式有误', '仅支持纯数字QQ号', 'error'); input.focus(); return; }
    const title = titles[encode(value)];
    title ? show(title, '森林名册已找到你，愿这枚称号常伴左右', 'success') : show('无称号', '名册尚无记录，新的叶片仍在生长', 'empty');
  }
  document.querySelector('#searchBtn').addEventListener('click', search);
  input.addEventListener('keydown', event => { if (event.key === 'Enter') search(); });
  input.focus();
})();
</script></body></html>
