<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纪念停服的游戏官网</title>
    <style>
        /* 彻底的黑，极简的纪念 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #dddddd;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
        }

        /* 主标题：庄重，带下划线 */
        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            text-align: center;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 3.5rem;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 1.8rem;
            word-break: keep-all;
        }

        /* 列表容器：无项目符号，干净纯粹 */
        .game-list {
            list-style: none;
        }

        .game-list li {
            margin-bottom: 1.4rem;
            display: flex;
            align-items: center;
            border-left: 2px solid #2a2a2a;
            padding-left: 1.8rem;
            transition: border-color 0.25s ease;
        }

        /* 悬停时左侧线条微微亮起，如同微弱的信号 */
        .game-list li:hover {
            border-left-color: #6a6a6a;
        }

        /* 链接本身：游戏标题，淡蓝灰色，强调可读 */
        .game-list a {
            color: #9bb9e0;
            text-decoration: none;
            font-size: 1.6rem;
            font-weight: 350;
            transition: color 0.2s, text-decoration 0.2s;
            word-break: break-word;
            width: 100%;
        }

        .game-list a:hover {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-thickness: 1px;
        }

        /* 细小的纪念脚注 —— 存在过，即留下痕迹 */
        .epitaph {
            margin-top: 4rem;
            text-align: center;
            color: #3a3a3a;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            border-top: 1px solid #1e1e1e;
            padding-top: 2rem;
        }

        .epitaph span {
            color: #4a4a4a;
        }

        /* 移动端：字体稍作调整，左侧留白依旧 */
        @media (max-width: 550px) {
            h1 {
                font-size: 2.2rem;
                margin-bottom: 2.5rem;
                padding-bottom: 1.2rem;
            }
            .game-list a {
                font-size: 1.3rem;
            }
            .game-list li {
                padding-left: 1.2rem;
                margin-bottom: 1.2rem;
            }
        }

        /* 对于极窄屏幕，确保不溢出 */
        @media (max-width: 380px) {
            h1 {
                font-size: 1.9rem;
            }
            .game-list a {
                font-size: 1.2rem;
            }
        }

        /* 辅助 —— 让不可见的光标停留时更明确 */
        a:focus-visible {
            outline: 1px solid #888;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>【纪念停服的游戏官网】</h1>

        <!-- 纯粹的游戏标题链接列表 —— 每一个名字都是一段沉寂的世界 -->
        <ul class="game-list">
            <li><a href="javascript:void(0)">小动物之星</a></li>
            <!-- 你可以继续添加更多曾闪耀而后静默的名字 -->
        </ul>

        <!-- 极淡的墓志铭：服务器沉默，但记忆未熄灭 -->
        <div class="epitaph">
            <span>✞ 服务器永久关闭 · 仅以此纪念那些消逝的王国 ✞</span>
        </div>
<span>所有网站均从网上收录，如果本站对您造成侵权，请联系2051775505@qq.com</span></div>
</body>
</html>
